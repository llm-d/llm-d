apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: decode
  labels:
    llm-d.ai/role: decode
spec:
  # Every pod that decodes: monolithic model servers (prefill-decode) and the
  # decode workers of a P/D deployment (decode). monitoring-pd adds prefill.
  selector:
    matchExpressions:
      - key: llm-d.ai/role
        operator: In
        values: [decode, prefill-decode]
  podMetricsEndpoints:
    - port: "modelserver"
      path: /metrics
      interval: 30s
