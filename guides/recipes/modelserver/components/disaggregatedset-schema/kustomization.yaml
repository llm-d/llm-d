apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Teaches kustomize the DisaggregatedSet merge keys, so strategic merge patches match
# roles, containers, env, volumes, and claims by key instead of by index. Kustomize only
# reads a schema file inside the kustomization's own directory, so overlays include this
# component instead of copying the file.
openapi:
  path: disaggregatedset-schema.json
