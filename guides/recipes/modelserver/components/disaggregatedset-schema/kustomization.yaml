apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Teaches kustomize about the DisaggregatedSet: the merge keys, so strategic merge patches
# match roles, containers, env, volumes, and claims by key instead of by index, and the
# ServiceAccount and ResourceClaimTemplate references inside its pod templates, so
# nameSuffix/namePrefix rename them. Kustomize only reads a schema file inside the
# kustomization's own directory, so overlays include this component instead of copying it.
openapi:
  path: disaggregatedset-schema.json
configurations:
  - kustomizeconfig.yaml
