apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # Node-local Hugging Face cache shared across the pods on a node, mirroring the
  # P/D GKE overlay: without HF_HOME the weights land in the container's writable
  # layer and are downloaded once per pod.
  # Overlays that render a DisaggregatedSet need the same settings as an inline role patch.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HF_HOME
          value: /root/.cache/huggingface
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HF_HUB_DOWNLOAD_TIMEOUT
          value: "60"
      # Xet CDN rate-limits concurrent downloads (429) when all pods pull the model at once
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HF_HUB_DISABLE_XET
          value: "1"
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          mountPath: /root/.cache/huggingface
          name: huggingface-cache
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: huggingface-cache
          hostPath:
            path: /var/cache/huggingface
            type: DirectoryOrCreate