apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# SGLang on Torch TPU (sgl-project/sglang-torchtpu), public release image. The Docker tag
# v0.1.0-tpu is the repository's release tpu-v0.1.0, commit 00ef120c (2026-10-19):
# https://github.com/sgl-project/sglang-torchtpu/releases/tag/tpu-v0.1.0
images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: docker.io/lmsysorg/sglang
    newTag: v0.1.0-tpu
