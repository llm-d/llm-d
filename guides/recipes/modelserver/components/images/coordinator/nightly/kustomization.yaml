apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: REPLACE_COORDINATOR_IMAGE
    newName: ghcr.io/llm-d/llm-d-router-coordinator
    newTag: main

# imagePullPolicy: Always: the main tag moves with every merge to llm-d-router
# main, so pull it again instead of running an older image cached on the node.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
