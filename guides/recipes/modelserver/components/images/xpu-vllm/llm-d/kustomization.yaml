apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: ghcr.io/llm-d/llm-d-xpu
    newTag: v0.10.0

# Required by vLLM v0.20.0+ with torch 2.11+ on XPU.
# See https://github.com/vllm-project/vllm/issues/44548.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USER
          value: llm-d
