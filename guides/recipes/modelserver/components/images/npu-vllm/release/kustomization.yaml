apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Rebellions publishes this image: RBLN SDK 0.12.0, with vllm-rbln 0.12.0+rh built from its
# release branch, which the P/D decode role needs. Moves to a docker/Dockerfile.rbln built by llm-d at GA.
images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: ghcr.io/rbln-sw/rbln-serve
    newTag: 0.12.0-rh

# Workaround for https://github.com/vllm-project/vllm/issues/44548, required with vLLM v0.20.0+ due to torch 2.11-2.13
# This image pins vLLM 0.31.0 on torch 2.13.0, so it is in range.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USER
          value: llm-d
  - target:
      kind: LeaderWorkerSet
    patch: |-
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: USER
          value: llm-d
  - target:
      kind: DisaggregatedSet
    patch: |-
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: USER
          value: llm-d
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: USER
          value: llm-d
