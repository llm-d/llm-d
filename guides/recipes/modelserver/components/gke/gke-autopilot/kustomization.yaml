apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all-deployments
      spec:
        template:
          spec:
            nodeSelector:
              cloud.google.com/gke-accelerator: nvidia-h100-80gb
              # GKE Autopilot Spot Instance selector.
              # Set to "true" to use Spot instances (highly cost-effective for dev/test).
              # Set to "false" or remove this line to use On-Demand instances.
              cloud.google.com/gke-spot: "true"
