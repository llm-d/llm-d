apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Encode in front of a combined prefill/decode role: the base set without its prefill role,
# plus an encode role, with the routing sidecar speaking the encoder-cache protocol.
resources:
  - ../base

components:
  - ../../../../components/disaggregatedset-schema
  - ../components/encode-role

patches:
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: prefill
            $patch: delete
  # Routing sidecar in front of the decode model server. Kept transfer-implementation agnostic
  # beyond the encoder-cache connector; engine-specific args are set in guide overlays.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: decode
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    initContainers:
                      - name: routing-proxy
                        image: REPLACE_ROUTING_SIDECAR_IMAGE
                        imagePullPolicy: Always
                        args:
                          - --port=8000
                          - --ec-connector=ec-nixl
                          - --zap-log-level=1
                          - --secure-serving=false
                        ports:
                          - name: sidecar
                            containerPort: 8000
                            protocol: TCP
                        resources: {}
                        restartPolicy: Always
                        securityContext:
                          allowPrivilegeEscalation: false
                          runAsNonRoot: true
