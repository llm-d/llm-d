apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default
  - encode-deployment.yaml

configurations:
  - namereference.yaml

patches:
  # Add routing sidecar to the decode deployment. Kept kv-transfer implementation agnostic —
  # engine-specific args (e.g. --kv-connector, --ec-connector) are set in guide overlays.
  - path: patch-sidecar.yaml
    target:
      kind: Deployment
      name: decode

  # Change decode modelserver port to 8200 (sidecar proxies 8000 -> 8200).
  # NOTE: guides building on this base should verify their own port configuration.
  # Engine-specific ports (e.g. nixl on 5610 for EC Connector) must be added in
  # the guide overlay, not here.
  - target:
      kind: Deployment
      name: decode
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8200
