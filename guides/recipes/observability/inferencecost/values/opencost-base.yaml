opencost:
  exporter:
    defaultClusterId: "${CLUSTER_ID}"   # filled by installer
    extraEnv:
      - name: INFERENCE_COST_ENABLED
        value: "true"
      - name: INFERENCE_MODEL_LABEL
        value: "llm-d.ai/model"
      - name: INFERENCE_SHARED_INFRA_LABEL
        value: "llm-d.ai/inference-serving"
      - name: INFERENCE_SHARED_INFRA_LABEL_VALUE
        value: "true"
      - name: INFERENCE_KV_CACHE_BLOCK_SIZE
        value: "16"   # match vLLM --block-size; set to 0 to disable KV cache correction
  prometheus:
    internal:
      enabled: true
      serviceName: "${PROMETHEUS_SVC}"  # filled by installer
      namespaceName: "${PROMETHEUS_NS}" # filled by installer
      port: 9090
  metrics:
    serviceMonitor:
      enabled: true                     # requires Prometheus Operator CRDs
      scrapeInterval: 1m
      honorLabels: true
      additionalLabels:
        release: llmd                   # must match kube-prometheus-stack serviceMonitorSelector
  ui:
    enabled: true
  customPricing:
    enabled: true
    configmapName: opencost-custom-pricing  # created by installer from interactive pricing prompt
