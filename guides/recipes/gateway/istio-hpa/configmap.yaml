apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-inference-gateway
data:
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 1
      maxReplicas: 5
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
