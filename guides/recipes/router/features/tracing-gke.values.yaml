## Enables distributed tracing (OpenTelemetry) for the router on GKE using
## GKE Managed OpenTelemetry (--managed-otel-scope=COLLECTION_AND_INSTRUMENTATION_COMPONENTS).
## Layer this on top of base.values.yaml to export traces to Google Cloud Trace.

router:
  tracing:
    enabled: true
    otelExporterEndpoint: "http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317"
    sampling:
      sampler: "parentbased_traceidratio"
      samplerArg: "0.05"
