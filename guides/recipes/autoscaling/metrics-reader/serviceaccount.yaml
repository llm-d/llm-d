# Dedicated ServiceAccount whose token KEDA borrows to authenticate to Thanos
# Querier on OpenShift. Guides that run no WVA controller (keda-epp-queue,
# keda-epp-saturation) provision this metrics reader; the WVA path instead
# borrows the controller-manager token and does not use this recipe.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-epp-metrics-reader
