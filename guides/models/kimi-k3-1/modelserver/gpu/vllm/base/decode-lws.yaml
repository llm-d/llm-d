# Kimi-K3.1-Pro (moonshotai/Kimi-K3.1-Pro) Decode pool for the 3P1D Disaggregated + Mooncake RDMA +
# Precise Prefix Cache Routing recipe on NVIDIA GB300 GPUs.
#
# Topology: 1 replica x 4 nodes (4 GPUs/node) = 4 nodes / 16x GB300 GPUs total (DP=16 x EP=16,
# 4 local DP workers per node on ports 8200..8203, fronted on ports 8000..8003 by the
# llm-d-router-disagg-sidecar with --kv-connector=nixlv2).
# Uses MXFP8 quantization for attention/expert projections, nvfp4_ds_mla KV cache, ReplaySSM
# (--use-replayssm), DSpark EAGLE3 speculative decoding (5 tokens), and MultiConnector
# (NixlConnector kv_consumer + MooncakeStoreConnector kv_consumer).
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: decode
  labels:
    llm-d.ai/guide: kimi-k3-1
    llm-d.ai/role: decode
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdateConfiguration:
      maxSurge: 0
      maxUnavailable: 1
  leaderWorkerTemplate:
    size: 4
    restartPolicy: RecreateGroupOnPodRestart
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/guide: kimi-k3-1
          llm-d.ai/role: decode
          llm-d.ai/component: decode
          llm-d.ai/model: Kimi-K3.1-Pro
          llm-d.ai/inference-serving: "true"
          llm-d.ai/pool-member: "true"
          llm-d.ai/accelerator-vendor: nvidia
          llm-d.ai/accelerator-variant: gpu
        annotations:
          llm-d.ai/active-ports: "8000,8001,8002,8003"
      spec:
        enableServiceLinks: false
        hostIPC: true
        terminationGracePeriodSeconds: 75
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          - key: kubernetes.io/arch
            operator: Equal
            value: arm64
            effect: NoSchedule
        initContainers:
          - name: routing-proxy
            image: REPLACE_ROUTING_SIDECAR_IMAGE
            imagePullPolicy: IfNotPresent
            restartPolicy: Always
            args:
              - --port=8000
              - --model-server-port=8200
              - --data-parallel-size=4
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-serving=false
              - --max-idle-conns-per-host=1024
            env:
              - name: OTEL_SDK_DISABLED
                value: "true"
              - name: GOGC
                value: "400"
              - name: GOMEMLIMIT
                value: 6GiB
            ports:
              - name: rank0
                containerPort: 8000
                protocol: TCP
              - name: rank1
                containerPort: 8001
                protocol: TCP
              - name: rank2
                containerPort: 8002
                protocol: TCP
              - name: rank3
                containerPort: 8003
                protocol: TCP
            resources:
              requests:
                cpu: "4"
                memory: 4Gi
              limits:
                cpu: "16"
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        containers:
          - name: vllm
            image: REPLACE_MODEL_SERVER_IMAGE
            imagePullPolicy: IfNotPresent
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sleep", "15"]
            securityContext:
              privileged: true
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
                  - SYS_PTRACE
                  - NET_ADMIN
            command: ["/bin/bash", "-c"]
            args:
              - |
                exec vllm serve /models/Kimi-K3.1-Pro \
                  --host 0.0.0.0 \
                  --port 8200 \
                  --data-parallel-start-rank "$(( ${LWS_WORKER_INDEX:-0} * 4 ))" \
                  --data-parallel-address "${LWS_LEADER_ADDRESS}" \
                  --trust-remote-code \
                  --served-model-name moonshotai/Kimi-K3.1-Pro \
                  --tensor-parallel-size 1 \
                  --data-parallel-size 16 \
                  --data-parallel-size-local 4 \
                  --data-parallel-rpc-port 13345 \
                  --data-parallel-multi-port-external-lb \
                  --data-parallel-supervisor-port 8208 \
                  --enable-expert-parallel \
                  --enable-ep-weight-filter \
                  --enable-cumem-allocator \
                  --load-format fastsafetensors \
                  --gpu-memory-utilization 0.95 \
                  --kv-cache-dtype nvfp4_ds_mla \
                  --language-model-only \
                  --max-num-seqs 32 \
                  --max-num-batched-tokens 512 \
                  --max-cudagraph-capture-size 512 \
                  --no-enable-prefix-caching \
                  --use-replayssm \
                  --quantization-config '{"targets":{"*.in_proj_qkvgfab":"mxfp8","*.fused_qkv_a_g_proj":"mxfp8","*.routed_expert_down_proj":"mxfp8","*.routed_expert_up_proj":"mxfp8","*.o_proj":"mxfp8","*.shared_experts.gate_up_proj":"mxfp8","*.shared_experts.down_proj":"mxfp8"}}' \
                  --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","num_speculative_tokens":5,"method":"dspark","draft_sample_method":"probabilistic"}' \
                  --kv-transfer-config '{"kv_connector":"MultiConnector","kv_role":"kv_consumer","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_consumer","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_lookup":false,"save_decode_cache":false,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}' \
                  --shutdown-timeout 45
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                value: "5600"
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: PYTHONHASHSEED
                value: "42"
              - name: MOONCAKE_CONFIG_PATH
                value: /etc/mooncake/mooncake_config.json
              - name: VLLM_MOONCAKE_LOAD_RECV_THREADS
                value: "4"
              - name: MC_SLICE_SIZE
                value: "1048576"
              - name: MC_MAX_MR_SIZE
                value: "4294967296"
              - name: MC_ENABLE_DEST_DEVICE_AFFINITY
                value: "1"
              - name: NCCL_CUMEM_ENABLE
                value: "1"
              - name: NCCL_MNNVL_ENABLE
                value: "1"
              - name: NCCL_NVLS_ENABLE
                value: "1"
              - name: UCX_NET_DEVICES
                value: all
              - name: VLLM_SSM_CONV_STATE_LAYOUT
                value: DS
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3600"
              - name: VLLM_USE_RUST_FRONTEND
                value: "1"
              - name: UCX_IB_ROCE_REACHABILITY_MODE
                value: all
              - name: UCX_IB_GID_INDEX
                value: "3"
              - name: UCX_IB_PCI_RELAXED_ORDERING
                value: "y"
              - name: UCX_CUDA_COPY_DMABUF
                value: "y"
              - name: UCX_CUDA_IPC_ENABLE_MNNVL
                value: "y"
              - name: UCX_MAX_RNDV_LANES
                value: "8"
              - name: UCX_MAX_EAGER_LANES
                value: "8"
              - name: UCX_WARN_UNUSED_ENV_VARS
                value: "n"
              - name: VLLM_CACHE_ROOT
                value: /root/.cache/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /root/.cache/flashinfer
              - name: TRITON_CACHE_DIR
                value: /root/.cache/triton
              - name: CUDA_CACHE_PATH
                value: /root/.cache/cuda
              - name: HF_HOME
                value: /models/hf-cache
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
                    optional: true
            ports:
              - name: dp0
                containerPort: 8200
              - name: dp1
                containerPort: 8201
              - name: dp2
                containerPort: 8202
              - name: dp3
                containerPort: 8203
              - name: supervisor
                containerPort: 8208
              - name: nixl0
                containerPort: 5600
              - name: nixl1
                containerPort: 5601
              - name: nixl2
                containerPort: 5602
              - name: nixl3
                containerPort: 5603
              - name: nixl4
                containerPort: 5604
              - name: nixl5
                containerPort: 5605
              - name: nixl6
                containerPort: 5606
              - name: nixl7
                containerPort: 5607
              - name: nixl8
                containerPort: 5608
              - name: nixl9
                containerPort: 5609
              - name: nixl10
                containerPort: 5610
              - name: nixl11
                containerPort: 5611
              - name: nixl12
                containerPort: 5612
              - name: nixl13
                containerPort: 5613
              - name: nixl14
                containerPort: 5614
              - name: nixl15
                containerPort: 5615
            resources:
              requests:
                cpu: "100"
                memory: 700Gi
                nvidia.com/gpu: "4"
              limits:
                memory: 860Gi
                nvidia.com/gpu: "4"
            startupProbe:
              httpGet:
                path: /health
                port: supervisor
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 540
            livenessProbe:
              httpGet:
                path: /health
                port: supervisor
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 10
            readinessProbe:
              httpGet:
                path: /readyz
                port: supervisor
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            volumeMounts:
              - mountPath: /dev/shm
                name: dshm
              - mountPath: /root/.cache
                name: cache
              - mountPath: /models
                name: models
                readOnly: true
              - mountPath: /etc/mooncake
                name: mooncake-config
                readOnly: true
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 250Gi
          - name: cache
            emptyDir: {}
          - name: models
            persistentVolumeClaim:
              claimName: kimi-k3-1-models
              readOnly: true
          - name: mooncake-config
            configMap:
              name: mooncake-store-config
