## NVIDIA-Nemotron-3-Ultra (GPU / P/D-disaggregated) guide overrides for the llm-d router.
## Layer on top of: recipes/router/base.values.yaml
##
## This deployment serves the agentic code-generation workload on NVIDIA GPUs with
## prefill/decode disaggregation, so the router runs disagg-aware scheduling profiles
## (separate prefill and decode profiles with toke-load awareness)
## rather than the single default profile used
## by the non-disaggregated Qwen3-Coder-480B TPU deployment.
##
## The plugin config name and the `llm-d.ai/guide: agentic-serving-gpu` pod
## selector are kept from the former agentic-serving guide; they must match the
## labels set in ../modelserver/gpu/vllm/base/kustomization.yaml.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "agentic-serving-gpu-plugins.yaml"
    pluginsCustomConfig:
      agentic-serving-gpu-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
          parameters:
            autoTune: false
            lruCapacityPerServer: 4000000
        - type: active-request-scorer
        - type: token-load-scorer
        - type: prefix-cache-affinity-filter
          parameters:
            peakPrefillThroughput: 9866
        - type: inflight-load-producer
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: token-load-scorer
          - pluginRef: prefix-cache-affinity-filter
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer

  modelServers:
    matchLabels:
      llm-d.ai/guide: "agentic-serving-gpu"
