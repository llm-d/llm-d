## NVIDIA-Nemotron-3-Ultra (GPU / P/D-disaggregated) guide overrides for the llm-d router.
## Layer on top of: recipes/router/base.values.yaml
##
## This deployment serves the agentic code-generation workload on NVIDIA GPUs with
## prefill/decode disaggregation, so the router runs disagg-aware scheduling profiles
## (separate prefill and decode profiles with token-load awareness)
## rather than the single default profile used
## by the non-disaggregated Qwen3-Coder-480B TPU deployment.
##
## The plugin config name and the `llm-d.ai/guide: agentic-serving-gpu` pod
## selector are kept from the former agentic-serving guide; they must match the
## labels set in ../modelserver/gpu/vllm/base/kustomization.yaml.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    # Single EPP replica: the inflight-load-producer's in-flight token accounting
    # (which the token-load-scorer and affinity filter consume) is local to each
    # EPP process, so multiple replicas would each see only a fraction of the
    # per-endpoint load and incorrectly gate the affinity filter.
    replicas: 1
    pluginsConfigFile: "agentic-serving-gpu-plugins.yaml"
    pluginsCustomConfig:
      agentic-serving-gpu-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
          parameters:
            autoTune: false
            lruCapacityPerServer: 4000000
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            # Set for this guide's reference setup (Nemotron-3-Ultra FP8,
            # H200 TP=8). Re-measure for other hardware or models
            # (guides/recipes/router/calibration).
            peakPrefillThroughput: 9866
        - type: token-load-scorer
        - type: active-request-scorer
        - type: max-score-picker
        schedulingProfiles:
        # Prefill does the prompt pass: keep prefix groups on cache-warm pods
        # (affinity filter) and pick by queued prefill token load.
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        # Pure decode is bound by concurrent in-flight requests, not prefill
        # throughput: pick the least-busy endpoint.
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker

  modelServers:
    matchLabels:
      llm-d.ai/guide: "agentic-serving-gpu"
