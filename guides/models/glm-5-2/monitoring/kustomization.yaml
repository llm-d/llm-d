apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Wide-EP / DP-aware monitoring overlay.
#
# This is an overlay of the generic recipes/modelserver/components/monitoring-pd
# component, which defines the decode and prefill PodMonitors. That component
# scrapes a single "modelserver" port, but wide expert parallelism exposes one
# metrics port per data-parallel rank: dp0-dp7 on the prefill vLLM container,
# and rank0-rank7 on the decode routing sidecar.
#
# The patches below replace the metrics endpoints on each PodMonitor so they
# scrape all 8 ranks (at a tighter 5s interval), and the labels transformer
# scopes the PodMonitors to this guide's pods.
components:
  - ../../../recipes/modelserver/components/monitoring-pd

labels:
  - pairs:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/guide: wide-ep
      llm-d.ai/model: GLM-5.2-FP8
    includeSelectors: true
    fields:
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: metadata/labels
        create: true
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: spec/selector/matchLabels
        create: true

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PodMonitor
      name: prefill
    patch: |-
      - op: replace
        path: /spec/podMetricsEndpoints
        value:
          - port: dp0
            path: /metrics
            interval: 5s
          - port: dp1
            path: /metrics
            interval: 5s
          - port: dp2
            path: /metrics
            interval: 5s
          - port: dp3
            path: /metrics
            interval: 5s
          - port: dp4
            path: /metrics
            interval: 5s
          - port: dp5
            path: /metrics
            interval: 5s
          - port: dp6
            path: /metrics
            interval: 5s
          - port: dp7
            path: /metrics
            interval: 5s
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PodMonitor
      name: decode
    patch: |-
      - op: replace
        path: /spec/podMetricsEndpoints
        value:
          - port: rank0
            path: /metrics
            interval: 5s
          - port: rank1
            path: /metrics
            interval: 5s
          - port: rank2
            path: /metrics
            interval: 5s
          - port: rank3
            path: /metrics
            interval: 5s
          - port: rank4
            path: /metrics
            interval: 5s
          - port: rank5
            path: /metrics
            interval: 5s
          - port: rank6
            path: /metrics
            interval: 5s
          - port: rank7
            path: /metrics
            interval: 5s
