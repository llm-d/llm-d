# GLM-5.2 overrides for glm-5-2.values.yaml: gates prefill on GPU prefix-cache
# affinity and token load, and adds a CPU prefix-cache scorer so P/D routing
# also accounts for CPU-offloaded KV when picking an endpoint. Apply after
# glm-5-2.values.yaml; replicas, targetPorts and matchLabels are inherited
# from it.
router:
  epp:
    pluginsCustomConfig:
      wide-ep-config.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: disaggregatedset-rollout-screener
          parameters:
            scope:
              labelSelector: "disaggregatedset.x-k8s.io/name=wide-ep-vllm-glm-5-2"
            revisionGating:
              mode: max-role
              requiredRoles: [prefill, decode]
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
          name: gpu-prefix-cache-producer
        - type: approx-prefix-cache-producer
          name: cpu-prefix-cache-producer
          parameters:
            autoTune: false
            lruCapacityPerServer: 200000
        - type: inflight-load-producer
          parameters:
            prefixMatchInfoProducerName: gpu-prefix-cache-producer
        # The affinity filter takes a single prefix producer, so it gates on the
        # GPU-resident index; CPU-offloaded hits are scored separately below.
        - type: prefix-cache-affinity-filter
          parameters:
            prefixMatchInfoProducerName: gpu-prefix-cache-producer
            # Per DP rank, H200, 2048-token prefill chunk. Taken from
            # precise-routing.values.yaml (#2203) and not re-measured here; it
            # agrees within ~20% with measured MoE prefill rates scaled to
            # GLM-5.2's ~40B active parameters. Re-measure for other hardware
            # or models (guides/recipes/router/calibration).
            peakPrefillThroughput: 3585
        - type: token-load-scorer
        - type: prefix-cache-scorer
          name: cpu-prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: cpu-prefix-cache-producer
        - type: active-request-scorer
        - type: max-score-picker
        schedulingProfiles:
        # Prefill: keep prefix groups on GPU-cache-warm ranks (affinity filter),
        # then pick by queued prefill token load, with a CPU-tier prefix bonus
        # so resumed sessions favor ranks that can restore offloaded context.
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
            weight: 3
          - pluginRef: cpu-prefix-cache-scorer
            weight: 1
          - pluginRef: max-score-picker
        # Pure decode is bound by concurrent in-flight requests, not prefill
        # throughput: pick the least-busy endpoint.
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
