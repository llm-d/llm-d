# SGLang overrides for glm-5-2.values.yaml. Apply after glm-5-2.values.yaml;
# replicas, targetPorts (the 8 per-rank ports) and matchLabels are inherited
# from it, and the plugin config below replaces its vLLM one.
#
# The SGLang Rust frontend serves the native /generate API and the OpenAI
# /v1/chat/completions and /v1/completions routes on every DP rank, and keeps
# the P/D bootstrap fields on all of them. The EPP
# parses /generate bodies (text or input_ids) with the sglanghttp-parser
# and OpenAI bodies with the openai-parser. The explicit parser list means
# other paths are rejected with 400 rather than forwarded to a listener that
# does not serve them.
#
# The Rust listeners expose no /metrics endpoint yet, so routing uses only
# signals the EPP computes itself: the approximate prefix-cache index (from
# the request it parsed), in-flight token load and active requests.
# dataLayer.injectDefaults: false turns off the default /metrics scrape, which
# would only return 404s.
#
# Like the vLLM overrides, prefill gates on prefix-cache affinity over one
# index sized for the per-rank GPU and CPU (HiCache) tiers. autoTune reads the
# KV size from /metrics, so the index is sized by hand per DP rank (one rank =
# one endpoint) in 64-token blocks (the SGLang page size), for a DEP8 prefill
# rank on H200:
# - GPU: 261,376 KV tokens per DEP8 prefill rank -> 4,084 blocks;
# - CPU: hicache component, 100 GB per rank = 1,929,664 tokens -> 30,151 blocks;
# - total: 34,235 blocks.
#
# Every standard SGLang deployment overlay includes hicache. If you disable
# hicache (for example in the benchmark/baseline overlay or with
# HICACHE_SIZE_GB_PER_RANK=0), set lruCapacityPerServer to 4084 so the router
# does not count CPU cache blocks that do not exist. When hicache-fs adds a
# shared storage tier (L3), keep lruCapacityPerServer sized to GPU + CPU: the
# approximate index tracks per-rank locality, while the shared L3 volume is
# accessible from every prefill rank.
router:
  modelServers:
    type: sglang
  epp:
    pluginsCustomConfig:
      wide-ep-config.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: sglanghttp-parser
        - type: openai-parser
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
          parameters:
            autoTune: false
            blockSizeTokens: 64
            lruCapacityPerServer: 34235
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            # Peak single-rank 2048-token prefill rate measured on an H200 SGLang
            # GLM-5.2-FP8 DEP8 prefill pod (scheduler chunk logs; calibrate.sh
            # single-request TTFT is skewed by RustServerIdleSleeper 1s ticks).
            peakPrefillThroughput: 3975
        - type: token-load-scorer
        - type: active-request-scorer
        - type: max-score-picker
        schedulingProfiles:
        # Prefill: keep prefix groups on ranks that hold them in GPU or CPU
        # (affinity filter), then pick by queued prefill token load.
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
        requestHandler:
          parsers:
          - pluginRef: sglanghttp-parser
          - pluginRef: openai-parser
        dataLayer:
          injectDefaults: false
