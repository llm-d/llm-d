apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# hicache-fs (L1 + host tier + storage tier on prefill): 1 prefill node (DEP8)
# + 1 decode node (DEP8) -> 2 nodes / 16 GPUs. Needs the llm-d-kv-cache-storage
# PVC in the namespace (see the hicache-fs component).
resources:
  - ../../../../providers/gke
components:
  - ../../../../components/hicache
  - ../../../../components/hicache-fs
patches:
  - target:
      group: disaggregatedset.x-k8s.io
      kind: DisaggregatedSet
    patch: |-
      # Roles are ordered [prefill, decode] in the base DisaggregatedSet.
      - op: replace
        path: /spec/roles/0/spec/replicas
        value: 1
      - op: replace
        path: /spec/roles/0/spec/leaderWorkerTemplate/size
        value: 1
      - op: replace
        path: /spec/roles/1/spec/replicas
        value: 1
      - op: replace
        path: /spec/roles/1/spec/leaderWorkerTemplate/size
        value: 1
