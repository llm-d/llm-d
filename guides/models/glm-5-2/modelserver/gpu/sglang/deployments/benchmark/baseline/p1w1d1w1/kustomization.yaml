apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# baseline (L1 only, no HiCache): 1 prefill node (DEP8) + 1 decode node (DEP8)
# -> 2 nodes / 16 GPUs. Use lruCapacityPerServer: 4084 in
# router/sglang.values.yaml with this overlay (GPU-resident blocks only).
resources:
  - ../../../../providers/gke
patches:
  - target:
      group: disaggregatedset.x-k8s.io
      kind: DisaggregatedSet
    patch: |-
      # Roles are ordered [prefill, decode] in the base DisaggregatedSet.
      - op: replace
        path: /spec/roles/0/spec/replicas
        value: 1
      - op: replace
        path: /spec/roles/0/spec/leaderWorkerTemplate/size
        value: 1
      - op: replace
        path: /spec/roles/1/spec/replicas
        value: 1
      - op: replace
        path: /spec/roles/1/spec/leaderWorkerTemplate/size
        value: 1
  # Without HiCache, L1-only queueing at concurrency 128 reaches 267s p90 TTFT,
  # so tail requests exceed SGLang's 300s default disaggregation timeouts.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: wide-ep-sglang-glm-5-2
      spec:
        roles:
          - name: prefill
            spec: &baseline-timeouts
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: sglang
                        env:
                          - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
                            value: "900"
                          - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
                            value: "900"
          - name: decode
            spec: *baseline-timeouts
