apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Enable SGLang HiCache (host-memory KV cache) on the prefill role, 100 GB per
# rank with zero-copy direct PCIe DMA transfers, and raise pod memory to fit it
# and the DSA indexer cache. Every SGLang deployment overlay includes this
# component, because router/sglang.values.yaml scores the CPU prefix cache that
# HiCache provides.

# The patch below matches the role, container, and env entry by name via the
# DisaggregatedSet schema the base declares.
patches:
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: wide-ep-sglang-glm-5-2
      spec:
        roles:
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: sglang
                        env:
                          - name: HICACHE_SIZE_GB_PER_RANK
                            value: "100"
                          - name: HICACHE_IO_BACKEND
                            value: direct
                          - name: HICACHE_MEM_LAYOUT
                            value: page_first_direct
                        resources:
                          limits:
                            memory: 1600Gi
                          requests:
                            memory: 1200Gi
