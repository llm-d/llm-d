    - name: JAX_PLATFORMS
      value: ""
    - name: PJRT_DEVICE
      value: "TPU"
    - name: VLLM_TARGET_DEVICE
      value: "tpu"
    - name: TPU_SPARSE_MLA_NOPE_LAYOUT
      value: "tensorcore"
    - name: TPU_SPARSE_MLA_ROPE_LAYOUT
      value: "tensorcore"
    - name: VLLM_USE_BREAKABLE_CUDAGRAPH
      value: "0"
    - name: VLLM_USE_AOT_COMPILE
      value: "0"
    - name: MOE_REQUANTIZE_BLOCK_SIZE
      value: "512"
    - name: TORCHINDUCTOR_AUTOGRAD_CACHE
      value: "0"
    - name: TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS
      value: "false"
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: llm-d-hf-token
          key: HF_TOKEN
          optional: true
- op: add
  path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources
  value:
    limits:
      google.com/tpu: 4
    requests:
      google.com/tpu: 4
- op: add
  path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/volumeMounts
  value:
    - mountPath: /dev/shm
      name: dshm
    - mountPath: /root/.cache/huggingface
      name: huggingface-cache
