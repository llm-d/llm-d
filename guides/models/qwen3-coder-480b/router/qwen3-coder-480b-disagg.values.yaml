## Qwen3-Coder-480B (TPU / P/D-disaggregated) guide overrides for the llm-d router.
## Layer on top of: recipes/router/base.values.yaml
##
## This deployment serves the agentic code-generation workload on Google TPUs with
## prefill/decode disaggregation, so the router runs disagg-aware scheduling profiles
## (separate prefill and decode profiles with token-load awareness)
## rather than the single default profile used
## by the non-disaggregated TPU deployment in qwen3-coder-480b.values.yaml.
##
## The `llm-d.ai/guide: agentic-serving` pod selector is kept from the former
## agentic-serving guide; it must match the labels set in
## ../modelserver/tpu/vllm-disaggregated/kustomization.yaml.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    # Single EPP replica: the inflight-load-producer's in-flight token accounting
    # (which the token-load-scorer and affinity filter consume) is local to each
    # EPP process, so multiple replicas would each see only a fraction of the
    # per-endpoint load and incorrectly gate the affinity filter.
    replicas: 1
    pluginsConfigFile: "pd-config.yaml"
    pluginsCustomConfig:
      pd-config.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
          parameters:
            autoTune: false
            lruCapacityPerServer: 4000000
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            # Calibrated for Qwen3-Coder-480B-FP8 on TPU 7x. Re-measure for other
            # hardware or models (guides/recipes/router/calibration).
            peakPrefillThroughput: 16444
        - type: token-load-scorer
        - type: active-request-scorer
        - type: max-score-picker
        schedulingProfiles:
        # Prefill does the prompt pass: keep prefix groups on cache-warm pods
        # (affinity filter) and pick by queued prefill token load.
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        # Pure decode is bound by concurrent in-flight requests, not prefill
        # throughput: pick the least-busy endpoint.
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker

  modelServers:
    matchLabels:
      llm-d.ai/guide: "agentic-serving"
