apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/vllm-disaggregated

nameSuffix: -tpu

components:
  - ../../../../../recipes/modelserver/components/images/tpu-vllm/release
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema

labels:
  - pairs:
      llm-d.ai/model: Qwen3-Coder-480B-A35B-Instruct-FP8
      llm-d.ai/guide: agentic-serving
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
      llm-d.ai/engine-type: vllm
    fields:
      - path: spec/roles/spec/leaderWorkerTemplate/workerTemplate/metadata/labels
        kind: DisaggregatedSet
        create: true
patches:
  - path: patch-decode.yaml
  - path: patch-prefill.yaml
