apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 8
  template:
    spec:
      initContainers:
      - name: tpu-node-setup
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - |
          # WARNING: This changes the HOST memory settings, not just the container.
          # Required to prevent vLLM crashes due to memory mapping limits.
          sysctl -w vm.max_map_count=33554432

          # Check if the VFIO IOMMU module parameter exists, and if so, increase the
          # limit on DMA mappings. This allows the TPU driver to pin and map a
          # larger number of memory pages for direct hardware access.
          if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
            echo 8000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
            echo "Successfully increased dma_entry_limit to 8000000"
          else
            echo "Warning: vfio_iommu_type1 module parameter not found. Ensure the module is loaded."
          fi

          echo "Final vm.max_map_count: $(cat /proc/sys/vm.max_map_count)"
        securityContext:
          privileged: true
      containers:
        - name: modelserver
          command:
          - /bin/bash
          - -c
          - --
          args:
- vllm serve --seed=42 --model=Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8 --served-model-name=Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8 --max-model-len=262144 --max-num-batched-tokens=8192 --max-num-seqs=64 --tensor-parallel-size=8 --kv-cache-dtype=fp8 --gpu-memory-utilization=0.8 --async-scheduling --enable-expert-parallel --data-parallel-size=1 --block-size=256 --kv-transfer-config '{"kv_connector":"TPUOffloadConnector","kv_connector_module_path":"tpu_inference.offload.tpu_offload_connector","kv_role":"kv_both"}' --shutdown-timeout=45 --enable-auto-tool-choice --tool-call-parser=qwen3_xml
