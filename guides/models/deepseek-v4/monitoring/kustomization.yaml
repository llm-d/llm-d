apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Wide-EP / DP-aware monitoring overlay.
#
# This is an overlay of the generic recipes/modelserver/components/monitoring-pd
# component, which defines the decode and prefill PodMonitors. DeepSeek-V4 uses
# --data-parallel-hybrid-lb, exposing a single "modelserver" port per pod.
#
# The patch below tightens the scrape interval on both PodMonitors to 5s, and
# the labels transformer scopes the PodMonitors to this guide's pods.
components:
  - ../../../recipes/modelserver/components/monitoring-pd

labels:
  - pairs:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/guide: wide-ep
      llm-d.ai/model: DeepSeek-V4-Pro
    includeSelectors: true
    fields:
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: metadata/labels
        create: true
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: spec/selector/matchLabels
        create: true

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PodMonitor
    patch: |-
      - op: replace
        path: /spec/podMetricsEndpoints
        value:
          - port: modelserver
            path: /metrics
            interval: 5s
