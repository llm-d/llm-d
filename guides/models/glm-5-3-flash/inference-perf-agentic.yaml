apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-agentic-config
  labels:
    app: inference-perf-agentic
data:
  config.yaml: |
    # Multi-turn agentic coding workload up to 100K input tokens (tests prefix caching + P/D disaggregation)
    load:
      type: concurrent
      num_workers: 8
      worker_max_concurrency: 1000
      request_timeout: 600
      stages:
        - num_requests: 320
          concurrency_level: 32

    api:
      type: completion
      streaming: true           # measures TTFT, ITL, TPOT, and prefix cache latency improvements

    server:
      type: vllm
      model_name: zai-org/GLM-5.3-Flash
      base_url: http://glm-5-3-flash-epp # in-cluster Service/route for the decode/gateway endpoint

    tokenizer:
      pretrained_model_name_or_path: /tmp/glm-tokenizer

    data:
      type: conversation_replay
      conversation_replay:
        seed: 39
        max_model_len: 100000
        num_conversations: 32
        shared_system_prompt_len: 3000
        dynamic_system_prompt_len:
          type: lognormal
          min: 10000
          max: 75000
          mean: 40000
          std_dev: 20000
        turns_per_conversation:
          type: lognormal
          min: 5
          max: 25
          mean: 12
          std_dev: 5
        input_tokens_per_turn:
          type: lognormal
          min: 500
          max: 6000
          mean: 2000
          std_dev: 1000
        output_tokens_per_turn:
          type: lognormal
          min: 100
          max: 1000
          mean: 350
          std_dev: 200
        tool_call_latency_sec:
          type: lognormal
          min: 1
          max: 5
          mean: 2
          std_dev: 1

    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: false
      session_lifecycle:
        summary: true
        per_stage: true
        per_session: false
      prometheus:
        summary: true
        per_stage: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf-agentic
  labels:
    app: inference-perf-agentic
spec:
  template:
    metadata:
      labels:
        app: inference-perf-agentic
    spec:
      containers:
        - name: inference-perf
          image: quay.io/inference-perf/inference-perf:v0.6.0
          imagePullPolicy: IfNotPresent
          # GLM-5.3-Flash ships a transformers v5 tokenizer config (tokenizer_class
          # TokenizersBackend, list-valued extra_special_tokens) that transformers 4.57.6 in
          # this image cannot load: load the same tokenizer.json as PreTrainedTokenizerFast.
          command:
            - python3
            - -c
            - |
              import json, shutil, os
              from huggingface_hub import hf_hub_download
              os.makedirs("/tmp/glm-tokenizer", exist_ok=True)
              for fn in ["tokenizer.json", "tokenizer_config.json", "chat_template.jinja"]:
                  p = hf_hub_download("zai-org/GLM-5.3-Flash", fn)
                  shutil.copy(p, os.path.join("/tmp/glm-tokenizer", fn))
              tc_path = "/tmp/glm-tokenizer/tokenizer_config.json"
              tc = json.load(open(tc_path))
              tc["tokenizer_class"] = "PreTrainedTokenizerFast"
              tc.pop("extra_special_tokens", None)
              json.dump(tc, open(tc_path, "w"))
              os.execvp("inference-perf", ["inference-perf", "--config_file", "/etc/config/config.yaml"])
          env:
            - name: RAYON_NUM_THREADS
              value: "4"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
                  optional: true
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: config-volume
          configMap:
            name: inference-perf-agentic-config
