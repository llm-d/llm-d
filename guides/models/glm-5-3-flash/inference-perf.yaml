apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-config
  labels:
    app: inference-perf
data:
  config.yaml: |
    # 2000 ISL / 2000 OSL, random data, 2048 concurrency, 8192 total requests
    load:
      type: concurrent          # closed-loop: holds `concurrency_level` in flight until `num_requests` complete
      request_timeout: 600
      stages:
        - num_requests: 8192
          concurrency_level: 2048
      num_workers: 32

    api:
      type: completion          # random datagen only supports the completion API
      streaming: false          # set true for TTFT / ITL; false reports request latency and normalized TPOT

    server:
      type: vllm
      model_name: zai-org/GLM-5.3-Flash
      base_url: http://glm-5-3-flash-epp # in-cluster Service/route for the decode/gateway endpoint
      ignore_eos: true          # required so the server emits the full 2000 output tokens

    tokenizer:
      pretrained_model_name_or_path: /tmp/glm-tokenizer

    data:
      type: random
      input_distribution:
        type: fixed             # every request is exactly `mean` tokens
        mean: 2000
        min: 2000
        max: 2000
        std_dev: 0
        total_count: 8192       # must be >= num_requests, or the datagen index runs out
      output_distribution:
        type: fixed
        mean: 2000
        min: 2000
        max: 2000
        std_dev: 0
        total_count: 8192

    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: false      # 8192 rows is a lot; flip to true for raw per-request data
      prometheus:
        summary: true
        per_stage: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf
  labels:
    app: inference-perf
spec:
  template:
    metadata:
      labels:
        app: inference-perf
    spec:
      containers:
        - name: inference-perf
          image: quay.io/inference-perf/inference-perf:v0.6.0
          imagePullPolicy: IfNotPresent
          # GLM-5.3-Flash ships a transformers v5 tokenizer config (tokenizer_class
          # TokenizersBackend, list-valued extra_special_tokens) that transformers 4.57.6 in
          # this image cannot load: load the same tokenizer.json as PreTrainedTokenizerFast.
          command:
            - python3
            - -c
            - |
              import json, shutil, os
              from huggingface_hub import hf_hub_download
              os.makedirs("/tmp/glm-tokenizer", exist_ok=True)
              for fn in ["tokenizer.json", "tokenizer_config.json", "chat_template.jinja"]:
                  p = hf_hub_download("zai-org/GLM-5.3-Flash", fn)
                  shutil.copy(p, os.path.join("/tmp/glm-tokenizer", fn))
              tc_path = "/tmp/glm-tokenizer/tokenizer_config.json"
              tc = json.load(open(tc_path))
              tc["tokenizer_class"] = "PreTrainedTokenizerFast"
              tc.pop("extra_special_tokens", None)
              json.dump(tc, open(tc_path, "w"))
              os.execvp("inference-perf", ["inference-perf", "--config_file", "/etc/config/config.yaml"])
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
                  optional: true
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: config-volume
          configMap:
            name: inference-perf-config
