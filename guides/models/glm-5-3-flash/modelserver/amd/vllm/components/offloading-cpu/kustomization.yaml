apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Native CPU KV offloading on the prefill role: the KV connector becomes
# MultiConnector[OffloadingConnector, MoRIIOConnector (READ-mode producer)].
#
# KV_OFFLOAD_CPU_BYTES is the pool of the whole TP=8 engine (split across the ranks).
# Blocks are written through to CPU, so the pool only adds capacity once it exceeds the
# HBM KV: 1.2 TB is about 12.9M tokens at 93.4 KB/token (TP=8 replicates the MLA KV on
# every rank), 1.24x the 10.4M tokens of HBM KV at KV_CACHE_MEMORY_BYTES=125e9.
#
# On ROCm the pool is pinned host memory per rank, counted in the pod memory limit
# (384Gi for the engine + the pool, rounded up) and capped by the amdgpu TTM limit (half
# of host RAM by default). PyTorch rounds each rank's pinned allocation up to a power of
# two unless pinned_max_round_threshold_mb is set: without it 1.2 TB pins 2 TiB and the
# pod is killed during startup. When you change the pool, change the memory below and
# lruCapacityPerServer in the router values.
patches:
  - target:
      kind: DisaggregatedSet
    patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: any
      spec:
        roles:
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        env:
                          - name: OFFLOADING_MODE
                            value: "cpu"
                          - name: KV_OFFLOAD_CPU_BYTES
                            value: "1200000000000"
                          - name: PYTORCH_ALLOC_CONF
                            value: "pinned_max_round_threshold_mb:1024"
                        resources:
                          limits:
                            memory: 1600Gi
                          requests:
                            memory: 1600Gi
