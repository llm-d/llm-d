apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: decode
      spec:
        # A decode pod takes a whole 8-GPU node: replace it in place instead of
        # surging, which would need a spare node.
        rolloutStrategy:
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: modelserver
                  command: ["/bin/bash", "-c"]
                  args:
                    - |-
                      exec vllm serve amd/GLM-5.3-Flash-Quark-MXFP4 \
                        --revision b5688f25491202978c19c4d036eef579f61bbe07 \
                        --served-model-name amd/GLM-5.3-Flash-Quark-MXFP4 \
                        --port 8200 \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --tokenizer-mode glm5_next \
                        --language-model-only \
                        --attention-backend ROCM_AITER_MLA_SPARSE \
                        --sparse-indexer-topk-backend aiter \
                        --tensor-parallel-size 8 \
                        --enable-expert-parallel \
                        --max-model-len ${MAX_MODEL_LEN} \
                        --max-num-seqs ${MAX_NUM_SEQS} \
                        --kv-cache-memory-bytes ${KV_CACHE_MEMORY_BYTES} \
                        --enable-prefix-caching \
                        --kv-transfer-config '{"kv_connector":"MoRIIOConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"http_port":"8200","handshake_port":"6301","notify_port":"61005","read_mode":"true"}}' \
                        --reasoning-parser glm47 \
                        --tool-call-parser glm47 \
                        --enable-auto-tool-choice \
                        --shutdown-timeout=45
                  env:
                    # Optional: the checkpoint is public; a token only lifts Hub rate limits.
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                          optional: true
                    - name: MAX_MODEL_LEN
                      value: "1048576"
                    - name: MAX_NUM_SEQS
                      value: "64"
                    # See the prefill role: explicit HBM for KV per GPU (MoRI-IO registration).
                    - name: KV_CACHE_MEMORY_BYTES
                      value: "125000000000"
                    # MoRI-IO needs the KDA conv state in the dim-first layout.
                    - name: VLLM_SSM_CONV_STATE_LAYOUT
                      value: "DS"
                    - name: VLLM_ROCM_USE_AITER
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_TRITON_SPARSE_MLA
                      value: "1"
                    - name: VLLM_ENGINE_READY_TIMEOUT_S
                      value: "3600"
                    - name: AITER_JIT_DIR
                      value: "/.aiter"
                    - name: VLLM_CACHE_ROOT
                      value: "/.cache"
                    - name: MORI_IO_LOG_LEVEL
                      value: "WARN"
                    - name: MORI_APP_LOG_LEVEL
                      value: "WARN"
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]
                  ports:
                    - containerPort: 6301
                      name: mori-handshake
                      protocol: TCP
                    - containerPort: 61005
                      name: mori-notify
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "100"
                      memory: 384Gi
                      amd.com/gpu: "8"
                    requests:
                      cpu: "100"
                      memory: 384Gi
                      amd.com/gpu: "8"
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.config
                      name: vllm-config
                    - mountPath: /.triton
                      name: triton-cache
                    - mountPath: /.aiter
                      name: aiter-cache
                  startupProbe:
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 240
                  livenessProbe:
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 12
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}
                - name: aiter-cache
                  emptyDir: {}
