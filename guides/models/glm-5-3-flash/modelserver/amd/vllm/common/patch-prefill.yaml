apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: prefill
      spec:
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: modelserver
                  command: ["/bin/bash", "-c"]
                  args:
                    - |-
                      # READ mode: decode pulls the KV from prefill. WRITE mode rejects this
                      # model's DSA tail ring.
                      MORIIO_CONFIG='{"kv_connector":"MoRIIOConnector","kv_role":"kv_producer","kv_connector_extra_config":{"http_port":"8000","handshake_port":"6301","notify_port":"61005","read_mode":"true"}}'

                      case "${OFFLOADING_MODE:-off}" in
                        cpu)
                          # cpu_bytes_to_use is the pool of the whole engine, split
                          # evenly across the 8 TP ranks.
                          KV_TRANSFER_CONFIG='{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":'"${KV_OFFLOAD_CPU_BYTES}"'}},'"${MORIIO_CONFIG}"']}}'
                          ;;
                        *)
                          KV_TRANSFER_CONFIG="${MORIIO_CONFIG}"
                          ;;
                      esac

                      exec vllm serve amd/GLM-5.3-Flash-Quark-MXFP4 \
                        --revision b5688f25491202978c19c4d036eef579f61bbe07 \
                        --served-model-name amd/GLM-5.3-Flash-Quark-MXFP4 \
                        --port 8000 \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --tokenizer-mode glm5_next \
                        --limit-mm-per-prompt '{"image":0,"video":0}' \
                        --attention-backend ROCM_AITER_MLA_SPARSE \
                        --sparse-indexer-topk-backend aiter \
                        --tensor-parallel-size 8 \
                        --enable-expert-parallel \
                        --max-model-len ${MAX_MODEL_LEN} \
                        --max-num-seqs ${MAX_NUM_SEQS} \
                        --kv-cache-memory-bytes ${KV_CACHE_MEMORY_BYTES} \
                        --enable-prefix-caching \
                        --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                        --reasoning-parser glm47 \
                        --tool-call-parser glm47 \
                        --enable-auto-tool-choice \
                        --shutdown-timeout=45
                  env:
                    # Optional: the checkpoint is public; a token only lifts Hub rate limits.
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                          optional: true
                    - name: MAX_MODEL_LEN
                      value: "262144"
                    - name: MAX_NUM_SEQS
                      value: "64"
                    # HBM for KV per GPU. Keep it explicit: Pollara AI NICs cannot
                    # register more than 2 GB of contiguous memory, and MoRI-IO
                    # registration also counts against HBM. 30 GB per GPU holds about
                    # 2.5M tokens per TP=8 engine (about 12 KB/token/GPU).
                    - name: KV_CACHE_MEMORY_BYTES
                      value: "30000000000"
                    # off | cpu. ../../components/offloading-cpu sets cpu.
                    - name: OFFLOADING_MODE
                      value: "off"
                    - name: KV_OFFLOAD_CPU_BYTES
                      value: "549755813888"
                    # MoRI-IO needs the KDA conv state in the dim-first layout.
                    - name: VLLM_SSM_CONV_STATE_LAYOUT
                      value: "DS"
                    - name: VLLM_ROCM_USE_AITER
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_TRITON_SPARSE_MLA
                      value: "1"
                    - name: VLLM_ENGINE_READY_TIMEOUT_S
                      value: "3600"
                    - name: AITER_JIT_DIR
                      value: "/.aiter"
                    - name: VLLM_CACHE_ROOT
                      value: "/.cache"
                    - name: MORI_IO_LOG_LEVEL
                      value: "WARN"
                    - name: MORI_APP_LOG_LEVEL
                      value: "WARN"
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]
                  ports:
                    - containerPort: 6301
                      name: mori-handshake
                      protocol: TCP
                    - containerPort: 61005
                      name: mori-notify
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "100"
                      memory: 384Gi
                      amd.com/gpu: "8"
                    requests:
                      cpu: "100"
                      memory: 384Gi
                      amd.com/gpu: "8"
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.config
                      name: vllm-config
                    - mountPath: /.triton
                      name: triton-cache
                    - mountPath: /.aiter
                      name: aiter-cache
                  startupProbe:
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 240
                  livenessProbe:
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 12
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}
                - name: aiter-cache
                  emptyDir: {}
