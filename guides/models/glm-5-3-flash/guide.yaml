name: glm-5-3-flash

# Which model server runs on which accelerator. `validated` = covered by a
# nightly E2E workflow; `community` = an overlay exists but is not run nightly;
# `unsupported` must link a tracking issue. A missing cell means unsupported.
# Keys must match env.static ACCELERATOR_TYPE / MODEL_SERVER values; `model`
# is the model the accelerator's overlay serves (used for MODEL on llm-d.ai);
# `notes` (optional, one line) fills the Notes column of the support table.
support:
  engines: {vllm: vLLM}
  accelerators:
    amd:
      label: AMD Instinct MI355X
      notes: >-
        2 nodes / 16 GPUs: 1P (TP=8 + EP) + 1D (TP=8 + EP) · MoRI-IO KV transfer (READ mode) over RDMA ·
        native CPU KV offloading on prefill (512 GiB per engine) · vLLM v0.34.0 ·
        `INFRA_PROVIDER`: `base`, `amd-ci`
      model: amd/GLM-5.3-Flash-Quark-MXFP4
      providers:
        - {name: base, label: "Kubernetes (base)"}
        - {name: amd-ci, label: "AMD CI"}
      engines: {vllm: community}

env:
  static:
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))

    GUIDE_NAME: glm-5-3-flash
    NAMESPACE: llm-d-glm-5-3-flash

    # Prometheus monitoring is opt-in: set MONITORING=true (requires the
    # monitoring stack) to run the deploy.monitoring* steps.
    MONITORING: {default: "false", values: ["false", "true"]}
    MONITORING_VALUES: {default: ""}

    ACCELERATOR_TYPE: {default: amd, values: [amd]}
    MODEL_SERVER: {default: vllm, values: [vllm]}
    # The overlay is modelserver/<ACCELERATOR_TYPE>/<MODEL_SERVER>/<INFRA_PROVIDER>/.
    # base: cluster-agnostic; amd-ci: the llm-d AMD CI cluster (8 Pollara AI NICs
    # per node via amd-host-device-nad, model weights on a pre-filled PVC).
    INFRA_PROVIDER: {default: base, values: [base, amd-ci]}

    MODEL: {default: "amd/GLM-5.3-Flash-Quark-MXFP4", comment: "set to the model your accelerator serves (table above)"}

    HF_TOKEN: {default: HF_TOKEN_PLACEHOLDER, sensitive: true}

  source: ["${REPO_ROOT}/guides/env.sh # defines GAIE_VERSION, ROUTER_CHART_VERSION, router chart URLs, and CURL_TEST_IMAGE"]

prerequisites:
  clone:
    - skip_in: [ci]
      run: |
        export BRANCH=main
        git clone https://github.com/llm-d/llm-d.git && cd llm-d && git checkout ${BRANCH}

  gaie:
    - run: |
        # GAIE_URL is automatically calculated from GAIE_VERSION at ${REPO_ROOT}/guides/env.sh
        kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/${GAIE_URL}/v1-manifests.yaml
  # Prefill and decode run as one DisaggregatedSet. skip_in ci: the nightly
  # clusters already run LWS, and a second release would collide.
  lws:
    - skip_in: [ci]
      run: |
        # helm upgrade never updates CRDs, so apply the chart's CRDs first (see LWS
        # "Upgrade by Helm"); this upgrades them on clusters that run an older LWS.
        helm pull oci://registry.k8s.io/lws/charts/lws --version=${LWS_VERSION} --untar
        kubectl apply --server-side --force-conflicts -f lws/crds
        helm upgrade --install lws oci://registry.k8s.io/lws/charts/lws \
          --version=${LWS_VERSION} \
          --namespace lws-system --create-namespace \
          --set enableDisaggregatedSet=true \
          --wait --timeout 300s
  namespace:
    - run: kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
  secrets:
    - skip_in: [ci]
      run: |
        kubectl create secret generic llm-d-hf-token \
          --from-literal="HF_TOKEN=${HF_TOKEN}" \
          --namespace "${NAMESPACE}" \
          --dry-run=client -o yaml | kubectl apply -f -

deploy:
  router_values:
    - run: |
        # Paths to values files: the base router values, then the GLM-5.3-Flash
        # P/D plugin chain with the GPU+CPU prefix index on top
        export ROUTER_BASE_VALUES="${REPO_ROOT}/guides/recipes/router/base.values.yaml"
        export ROUTER_VALUES="${REPO_ROOT}/guides/models/${GUIDE_NAME}/router/${GUIDE_NAME}.values.yaml"

  monitoring_values:
    - when: {MONITORING: ["true"]}
      run: export MONITORING_VALUES="-f ${REPO_ROOT}/guides/recipes/router/features/monitoring.values.yaml"

  standalone:
    - run: |
        helm install ${GUIDE_NAME} \
          ${ROUTER_STANDALONE_CHART} \
          -f ${ROUTER_BASE_VALUES} \
          ${MONITORING_VALUES} \
          -f ${ROUTER_VALUES} \
          -n ${NAMESPACE} --version ${ROUTER_CHART_VERSION}

  modelserver:
    - run: |
        kubectl apply -n ${NAMESPACE} \
          -k ${REPO_ROOT}/guides/models/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/${INFRA_PROVIDER}/

  monitoring:
    - when: {MONITORING: ["true"]}
      run: kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/recipes/modelserver/components/monitoring-pd

verify:
  endpoint:
    standalone:
      - run: export IP=$(kubectl get service ${GUIDE_NAME}-epp -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}')
  tests:
    request:
      - run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"Explain how a simple agent loop works in 3 sentences.\", \"max_tokens\": 128}"'
    served_model:
      - run: |
          # The router must reach a model server that serves MODEL and returns tokens
          kubectl run serve-check --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'R=$(curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"Say hello.\", \"max_tokens\": 16}")
              echo "${R}" | grep -q "\"model\":\"${MODEL}\"" && echo "${R}" | grep -q "\"choices\"" \
                && echo "OK: ${MODEL} served through the router" \
                || { echo "FAIL: ${R}"; exit 1; }'
    pd_requests:
      - run: |
          # The same ~1.7K-token prompt 3 times: each request is prefilled on the
          # prefill pod and its KV cache pulled by the decode pod over MoRI-IO;
          # the repeats hit the prefix cache
          kubectl run pd-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'P=$(for i in $(seq 1 100); do printf "The prefill pod computes the KV cache and the decode pod pulls it to generate tokens. "; done)
              for i in 1 2 3; do
                curl -sS -o /dev/null -w "request ${i}: HTTP %{http_code}\n" -X POST "http://${IP}/v1/completions" \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"${MODEL}\", \"prompt\": \"${P} Question: what is llm-d?\", \"max_tokens\": 16}"
              done'
    pod_metrics:
      - run: |
          # Request, KV-transfer and CPU-offload counters of both roles through the API
          # server proxy (prefill serves on 8000, decode on 8200 behind the sidecar).
          for role in prefill decode; do
            port=8000; [ "${role}" = decode ] && port=8200
            for pod in $(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME},llm-d.ai/role=${role} -o jsonpath='{.items[*].metadata.name}'); do
              echo "== ${role}: ${pod}"
              kubectl get --raw "/api/v1/namespaces/${NAMESPACE}/pods/${pod}:${port}/proxy/metrics" \
                | grep -E '^vllm:(request_success_total|prompt_tokens_total|prefix_cache_hits_total|external_prefix_cache_hits_total|prompt_tokens_cached_by_source_total|kv_offload_(store|load)_bytes_total)' || true
            done
          done

cleanup:
  modelserver:
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/models/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/${INFRA_PROVIDER}/
  rest:
    - run: helm uninstall ${GUIDE_NAME} -n ${NAMESPACE}
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/recipes/modelserver/components/monitoring-pd --ignore-not-found=true
    - skip_in: [ci]
      run: kubectl delete namespace ${NAMESPACE}
