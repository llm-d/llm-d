apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen3.5-397B-A17B-FP8"
            - "--port=8000"
            - "--data-parallel-size=8"
            - "--tensor-parallel-size=1"
            - "--enable-expert-parallel"
            - "--enable-ep-weight-filter"
            - "--attention-backend=CUSTOM"
            - "--language-model-only"
            - "--max-model-len=262144"
            - "--kv-cache-dtype=fp8"
            - "--block-size=4352"
            - "--gpu-memory-utilization=0.90"
            - "--max-num-batched-tokens=4384"
            - "--max-num-seqs=32"
            - "--no-disable-hybrid-kv-cache-manager"
            - "--mamba-cache-mode=align"
            - "--enable-prefix-caching"
            - "--prefix-cache-retention-interval=0"
            - "--no-async-scheduling"
            - "--kv-transfer-config"
            - '{"kv_connector":"TPURaidenOffloadingConnector","kv_connector_module_path":"vllm_torchtpu.offload.raiden_connector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":34359738368,"raiden_controller_port":47800}}'
            - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=qwen3_coder"
            - "--reasoning-parser=qwen3"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--shutdown-timeout=45"
          env:
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "3600"
            - name: TPU_EVICT_WEIGHTS_PAGE_CACHE
              value: "1"
            - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
              value: "1"
            - name: TPU_USE_RAIDEN_KV_CACHE_MANAGER
              value: "1"
            - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
              value: "1"
            - name: TPU_VLLM_SKIP_DYNAMIC_SMEM_NEGOTIATION_FLAG
              value: "1"
            - name: TPU_RAIDEN_QWEN35_ADMISSION
              value: "1"
            - name: TPU_RAIDEN_CLIENT_IMPL
              value: "cpp"
            - name: TPU_PREMAPPED_BUFFER_SIZE
              value: "17179869184"
            - name: TPU_KV_SHM_POOL_GB
              value: "8"
            - name: PYTHONHASHSEED
              value: "0"
            - name: TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS
              value: "false"
            - name: TORCHINDUCTOR_AUTOGRAD_CACHE
              value: "0"
            - name: VLLM_TARGET_DEVICE
              value: "tpu"
            - name: PJRT_DEVICE
              value: "TPU"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  key: HF_TOKEN
                  name: llm-d-hf-token
                  optional: true
          resources:
            limits:
              memory: 850Gi
              google.com/tpu: "4"
            requests:
              cpu: "64"
              memory: 850Gi
              google.com/tpu: "4"
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - emptyDir:
            medium: Memory
          name: dshm
