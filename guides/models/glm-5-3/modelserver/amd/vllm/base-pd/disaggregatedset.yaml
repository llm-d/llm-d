# GLM-5.3 Quark MXFP4 P/D: one prefill pod and one decode pod, each DP=8 / EP=8 / TP=1 on one
# MI355X node, MTP-3 on both roles. KV moves with MoRI-IO in READ mode: prefill returns its block
# IDs, then decode pulls the blocks it does not already hold from the prefill rank that computed
# them, so the routing sidecar runs the serial path.
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: glm-5-3-pd
spec:
  roles:
    - name: prefill
      metadata:
        labels: &prefill-labels
          llm-d.ai/model: GLM-5.3
          llm-d.ai/guide: glm-5-3
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: amd
          llm-d.ai/inference-serving: "true"
          llm-d.ai/role: prefill
      spec:
        replicas: 1
        # Tear down the old pod before creating the new one: a surge needs a spare 8-GPU node per role.
        rolloutStrategy:
          type: RollingUpdate
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels: *prefill-labels
              annotations: &rails
                # One RDMA rail per GPU through the NetworkAttachmentDefinition created in the
                # prerequisites (network/rdma-nad.yaml); matches amd.com/vnic: 8 below.
                k8s.v1.cni.cncf.io/networks: |
                  [
                    {"name":"glm-5-3-rdma","interface":"net1"},
                    {"name":"glm-5-3-rdma","interface":"net2"},
                    {"name":"glm-5-3-rdma","interface":"net3"},
                    {"name":"glm-5-3-rdma","interface":"net4"},
                    {"name":"glm-5-3-rdma","interface":"net5"},
                    {"name":"glm-5-3-rdma","interface":"net6"},
                    {"name":"glm-5-3-rdma","interface":"net7"},
                    {"name":"glm-5-3-rdma","interface":"net8"}
                  ]
            spec:
              serviceAccountName: glm-5-3
              affinity: &anti-affinity
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          llm-d.ai/guide: glm-5-3
                          llm-d.ai/inference-serving: "true"
              volumes: &volumes
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi
                - name: jit-cache
                  emptyDir: {}
                - name: model-cache
                  persistentVolumeClaim:
                    claimName: model-pvc
              containers:
                - name: vllm
                  image: REPLACE_MODEL_SERVER_IMAGE
                  imagePullPolicy: IfNotPresent
                  securityContext: &engine-security
                    # IPC_LOCK: MoRI pins memory for the RDMA symmetric heap and KV registration.
                    capabilities:
                      add:
                        - IPC_LOCK
                  command:
                    - /bin/bash
                    - -c
                  args:
                    - |-
                      # Clear /dev/shm on start to prevent running out of space when crashes occur https://github.com/llm-d/llm-d/issues/352
                      find /dev/shm -type f -delete
                      # shellcheck disable=SC2086
                      exec vllm serve "${MODEL}" \
                        --revision "${MODEL_REVISION}" \
                        --port 8000 \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --api-server-count 8 \
                        --tensor-parallel-size 1 \
                        --data-parallel-size 8 \
                        --data-parallel-size-local 8 \
                        --data-parallel-address "${POD_IP}" \
                        --data-parallel-rpc-port 29550 \
                        --enable-expert-parallel \
                        --all2all-backend mori_high_throughput \
                        --block-size "${BLOCK_SIZE}" \
                        --kv-cache-dtype auto \
                        --gpu-memory-utilization 0.6 \
                        --kv-cache-memory-bytes "${KV_CACHE_MEMORY_BYTES}" \
                        --max-model-len "${MAX_MODEL_LEN}" \
                        --max-num-batched-tokens 16384 \
                        --max-num-seqs 64 \
                        --enable-prefix-caching \
                        --trust-remote-code \
                        --distributed-timeout-seconds 7200 \
                        --tool-call-parser glm47 \
                        --reasoning-parser glm45 \
                        --enable-auto-tool-choice \
                        --chat-template-content-format string \
                        --skip-mm-profiling \
                        --speculative-config "${SPEC_CONFIG}" \
                        --enforce-eager \
                        --kv-transfer-config '{"kv_connector":"MoRIIOConnector",
                                                "kv_role":"kv_producer",
                                                "kv_connector_extra_config":{"http_port":"8000",
                                                                             "handshake_port":"6301",
                                                                             "notify_port":"61005",
                                                                             "read_mode":"true",
                                                                             "defer_timeout":"1800",
                                                                             "recv_abort_timeout":"600",
                                                                             "qp_per_transfer":"2",
                                                                             "num_workers":"4"}}' \
                        --shutdown-timeout 45 \
                        ${EXTRA_ARGS}
                  env: &engine-env
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: MODEL
                      value: amd/GLM-5.3-Quark-MXFP4-AttnFP8
                    - name: MODEL_REVISION
                      value: bcd1ec31dc1fd474b9997dd2476c92687790b83d
                    - name: HF_HOME
                      value: /model-cache
                    - name: HF_HUB_OFFLINE
                      value: "1"
                    # Must match on both roles.
                    - name: BLOCK_SIZE
                      value: "16"
                    # 80e9 bytes per GPU = 851,856 tokens per rank, one 512k session. Registering the
                    # KV cache for RDMA lowers the free GPU memory the driver reports by about the KV
                    # size, so the budget is explicit and leaves at least 20 GiB free per rank after
                    # the first transfer.
                    - name: KV_CACHE_MEMORY_BYTES
                      value: "80000000000"
                    - name: MAX_MODEL_LEN
                      value: "560000"
                    - name: SPEC_CONFIG
                      value: '{"method":"mtp","num_speculative_tokens":3}'
                    # Decode only (prefill runs eager). A decode step carries running sequences x
                    # (1 + 3) tokens per rank; larger steps run without CUDA graphs.
                    - name: CUDAGRAPH_CAPTURE_SIZES
                      value: "4 8 16 32 48 64 96 128 160 192 224 256"
                    - name: EXTRA_ARGS
                      value: ""
                    # Must exceed the sidecar's 90 s idle timeout, or pooled connections are reset mid-request.
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"
                    - name: VLLM_ENGINE_READY_TIMEOUT_S
                      value: "7200"
                    - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
                      value: "3600"
                    # Enables POST /reset_prefix_cache, which the benchmark Job calls before cold
                    # prompts. Remove it outside benchmarking.
                    - name: VLLM_SERVER_DEV_MODE
                      value: "1"
                    - name: PYTHONUNBUFFERED
                      value: "1"

                    # MoRI-EP V1 IntraNode kernels. The receive-row alignment of 4096 is required by
                    # the engine image's MoRI-EP receive-row bound (see the ROCm MAD recipe).
                    - name: VLLM_MORI_EP_V2
                      value: "0"
                    - name: VLLM_MORI_RECV_ROW_ALIGN
                      value: "4096"
                    # Fabric- and NIC-specific MoRI settings come from components/fabric.
                    - name: MORI_SHMEM_HEAP_SIZE
                      value: "17179869184"
                    - name: MORI_DISABLE_TOPO
                      value: "1"
                    - name: MORI_GPU_ARCHS
                      value: gfx950
                    - name: MORI_IO_CP_TIMEOUT_MS
                      value: "60000"

                    - name: VLLM_ROCM_USE_AITER
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_MOE
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_MLA
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_RMSNORM
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_FP8BMM
                      value: "0"
                    - name: VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS
                      value: "0"
                    - name: VLLM_ROCM_USE_AITER_LINEAR
                      value: "0"
                    - name: VLLM_SPARSE_INDEXER_MAX_LOGITS_MB
                      value: "4096"
                    - name: VLLM_USE_BREAKABLE_CUDAGRAPH
                      value: "1"
                    - name: TORCHINDUCTOR_USE_STATIC_CUDA_LAUNCHER
                      value: "0"
                    # The KV cache must not be VMM-backed, or it cannot be registered for RDMA.
                    - name: PYTORCH_ALLOC_CONF
                      value: expandable_segments:False
                    - name: PYTORCH_HIP_ALLOC_CONF
                      value: expandable_segments:False
                    # Never 0 or empty: ROCm/rocm-systems#4066.
                    - name: ROCPROFILER_QUEUE_INTERPOSITION
                      value: "1"
                    - name: HSA_ENABLE_SDMA
                      value: "1"
                    - name: HSA_FORCE_FINE_GRAIN_PCIE
                      value: "1"
                    - name: HSA_NO_SCRATCH_RECLAIM
                      value: "1"
                    - name: HIP_FORCE_DEV_KERNARG
                      value: "1"
                    # NCCL carries only in-node control traffic: each instance is one node.
                    - name: NCCL_IB_DISABLE
                      value: "1"
                    - name: NCCL_SOCKET_IFNAME
                      value: eth0
                    - name: GLOO_SOCKET_IFNAME
                      value: eth0
                    - name: NCCL_DEBUG
                      value: WARN
                    - name: VLLM_CACHE_ROOT
                      value: /var/cache/vllm/vllm
                    - name: TORCHINDUCTOR_CACHE_DIR
                      value: /var/cache/vllm/inductor
                    - name: TRITON_CACHE_DIR
                      value: /var/cache/vllm/triton
                    - name: AITER_JIT_DIR
                      value: /var/cache/vllm/aiter_jit
                    - name: COMGR_CACHE_DIR
                      value: /var/cache/vllm/comgr
                    - name: MORI_JIT_CACHE_DIR
                      value: /var/cache/vllm/mori_jit
                  ports:
                    - containerPort: 8000
                      name: modelserver
                      protocol: TCP
                    - containerPort: 29550
                      name: dp-rpc
                      protocol: TCP
                    # Handshake and notify ports are per DP rank: base + rank.
                    - containerPort: 6301
                      name: mori-handshake
                      protocol: TCP
                    - containerPort: 61005
                      name: mori-notify
                      protocol: TCP
                  resources: &engine-resources
                    limits:
                      cpu: "100"
                      memory: 1200Gi
                      amd.com/gpu: "8"
                      # All eight, always: a partial request yields an arbitrary subset of rail planes.
                      amd.com/vnic: "8"
                    requests:
                      cpu: "100"
                      memory: 1200Gi
                      amd.com/gpu: "8"
                      amd.com/vnic: "8"
                  # 60 s + 240 x 30 s = 2 h; an empty JIT cache takes ~30 min.
                  startupProbe: &startup
                    httpGet:
                      path: /health
                      port: modelserver
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 240
                  livenessProbe: &liveness
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 6
                  # /health, not /v1/models: the latter answers even after the engine core dies.
                  readinessProbe: &readiness
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 12
                  volumeMounts: &engine-mounts
                    - name: dshm
                      mountPath: /dev/shm
                    - name: jit-cache
                      mountPath: /var/cache/vllm
                    - name: model-cache
                      mountPath: /model-cache
    - name: decode
      metadata:
        labels: &decode-labels
          llm-d.ai/model: GLM-5.3
          llm-d.ai/guide: glm-5-3
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: amd
          llm-d.ai/inference-serving: "true"
          llm-d.ai/role: decode
      spec:
        replicas: 1
        rolloutStrategy:
          type: RollingUpdate
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels: *decode-labels
              annotations: *rails
            spec:
              serviceAccountName: glm-5-3
              affinity: *anti-affinity
              initContainers:
                # The sidecar fronts 8000 (the port the InferencePool targets) and vLLM moves to 8200.
                - name: routing-proxy
                  image: REPLACE_ROUTING_SIDECAR_IMAGE
                  imagePullPolicy: IfNotPresent
                  restartPolicy: Always
                  args:
                    - --port=8000
                    - --model-server-port=8200
                    # The sidecar's generic P/D protocol. No --moriio-write-mode (READ) and no
                    # --moriio-parallel-dispatch: READ needs prefill's block IDs before decode can
                    # pull, so the legs run serially and prefill's kv_transfer_params reach decode
                    # verbatim. No --moriio-dp-size either: it would replace the prefill rank from
                    # the router's session-sticky x-data-parallel-rank header with a per-request
                    # hash, breaking per-session prefix locality on prefill.
                    - --kv-connector=nixlv2
                    - --metrics-port=9095
                    - --zap-log-level=1
                    - --secure-proxy=false
                  env:
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                  ports:
                    - containerPort: 8000
                      name: sidecar
                      protocol: TCP
                    - containerPort: 9095
                      name: sc-metrics
                      protocol: TCP
                  resources: {}
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
              volumes: *volumes
              containers:
                - name: vllm
                  image: REPLACE_MODEL_SERVER_IMAGE
                  imagePullPolicy: IfNotPresent
                  securityContext: *engine-security
                  command:
                    - /bin/bash
                    - -c
                  args:
                    - |-
                      # Clear /dev/shm on start to prevent running out of space when crashes occur https://github.com/llm-d/llm-d/issues/352
                      find /dev/shm -type f -delete
                      # shellcheck disable=SC2086
                      exec vllm serve "${MODEL}" \
                        --revision "${MODEL_REVISION}" \
                        --port 8200 \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --api-server-count 8 \
                        --tensor-parallel-size 1 \
                        --data-parallel-size 8 \
                        --data-parallel-size-local 8 \
                        --data-parallel-address "${POD_IP}" \
                        --data-parallel-rpc-port 29560 \
                        --enable-expert-parallel \
                        --all2all-backend mori_low_latency \
                        --block-size "${BLOCK_SIZE}" \
                        --kv-cache-dtype auto \
                        --gpu-memory-utilization 0.6 \
                        --kv-cache-memory-bytes "${KV_CACHE_MEMORY_BYTES}" \
                        --max-model-len "${MAX_MODEL_LEN}" \
                        --max-num-batched-tokens 256 \
                        --max-num-seqs 64 \
                        --enable-prefix-caching \
                        --trust-remote-code \
                        --distributed-timeout-seconds 7200 \
                        --tool-call-parser glm47 \
                        --reasoning-parser glm45 \
                        --enable-auto-tool-choice \
                        --chat-template-content-format string \
                        --skip-mm-profiling \
                        --speculative-config "${SPEC_CONFIG}" \
                        --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["+quant_fp8"]}' \
                        --cudagraph-capture-sizes ${CUDAGRAPH_CAPTURE_SIZES} \
                        --kv-transfer-config '{"kv_connector":"MoRIIOConnector",
                                                "kv_role":"kv_consumer",
                                                "kv_connector_extra_config":{"http_port":"8200",
                                                                             "handshake_port":"6301",
                                                                             "notify_port":"61005",
                                                                             "read_mode":"true",
                                                                             "defer_timeout":"1800",
                                                                             "recv_abort_timeout":"600",
                                                                             "qp_per_transfer":"2",
                                                                             "num_workers":"4"}}' \
                        --shutdown-timeout 45 \
                        ${EXTRA_ARGS}
                  # Identical to prefill: MoRI and the KV layout require matching settings on both roles.
                  env: *engine-env
                  ports:
                    - containerPort: 8200
                      name: modelserver
                      protocol: TCP
                    - containerPort: 29560
                      name: dp-rpc
                      protocol: TCP
                    - containerPort: 6301
                      name: mori-handshake
                      protocol: TCP
                    - containerPort: 61005
                      name: mori-notify
                      protocol: TCP
                  resources: *engine-resources
                  startupProbe: *startup
                  livenessProbe: *liveness
                  readinessProbe: *readiness
                  volumeMounts: *engine-mounts
