apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Wide-EP monitoring overlay.
#
# This is an overlay of the generic recipes/modelserver/components/monitoring-pd
# component, which defines the decode and prefill PodMonitors. That component
# scrapes the "modelserver" port every 30s; the patch below only tightens the
# interval to 5s, and the labels transformer scopes the PodMonitors to this
# guide's pods.
#
# Both roles serve /metrics from the vLLM API server on the container port named
# "modelserver" (prefill: 8000, decode: 8200 behind the routing-proxy sidecar).
# Note that a PodMonitor endpoint's `port` is a *container port name*, so any
# port it names must actually be declared on the pod. If DP_SIZE_LOCAL is ever
# raised above 1, each additional rank's API server binds port+rank and would
# need its own named container port plus an endpoint here.
components:
  - ../../recipes/modelserver/components/monitoring-pd

labels:
  - pairs:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/guide: wide-ep-lws
    includeSelectors: true
    fields:
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: metadata/labels
        create: true
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: spec/selector/matchLabels
        create: true

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PodMonitor
    patch: |-
      - op: replace
        path: /spec/podMetricsEndpoints
        value:
          - port: modelserver
            path: /metrics
            interval: 5s
