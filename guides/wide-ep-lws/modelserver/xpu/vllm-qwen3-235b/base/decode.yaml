apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-xpu-qwen3-235b
  labels:
    llm-d.ai/model: Qwen3-235B-A22B
    llm-d.ai/role: decode
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: wide-ep-lws
          llm-d.ai/accelerator-variant: xpu
          llm-d.ai/accelerator-vendor: intel
          llm-d.ai/model: Qwen3-235B-A22B
          llm-d.ai/role: decode
      spec:
        serviceAccountName: sa
        securityContext:
          fsGroup: 107
          supplementalGroups:
            - 107
        resourceClaims:
          - name: xpu-qwen3-235b-claim
            resourceClaimTemplateName: xpu-qwen3-235b-claim
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
          - name: hf-cache
            emptyDir: {}
          - name: vllm-cache
            emptyDir: {}
        containers:
          - name: vllm
            image: REPLACE_MODEL_SERVER_IMAGE
            imagePullPolicy: Always
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_ADMIN
              runAsGroup: 0
              runAsUser: 0
            command:
              - /bin/bash
              - -c
            args:
              - |-
                set -euo pipefail
                hostname "qwen-${LWS_WORKER_INDEX:-0}"
                find /dev/shm -type f -delete

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                exec vllm serve \
                  Qwen/Qwen3-235B-A22B \
                  --host 0.0.0.0 \
                  --port 8200 \
                  --trust-remote-code \
                  --dtype bfloat16 \
                  --quantization fp8 \
                  --block-size 64 \
                  --enforce-eager \
                  --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION} \
                  --max-model-len ${MAX_MODEL_LEN} \
                  --tensor-parallel-size ${TP_SIZE} \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local ${DP_SIZE_LOCAL} \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank ${START_RANK} \
                  --data-parallel-hybrid-lb \
                  --enable-expert-parallel \
                  --all2all-backend allgather_reducescatter \
                  --disable-access-log-for-endpoints=/health,/metrics,/v1/models
            env:
              - name: VLLM_USE_V1
                value: "1"
              - name: VLLM_WORKER_MULTIPROC_METHOD
                value: spawn
              - name: VLLM_ENABLE_V1_MULTIPROCESSING
                value: "1"
              - name: VLLM_MULTIPROC_EXECUTE_MODEL_TIMEOUT_S
                value: "1200"
              - name: TORCH_LLM_ALLREDUCE
                value: "1"
              - name: CCL_ATL_TRANSPORT
                value: ofi
              - name: CCL_PROCESS_LAUNCHER
                value: none
              - name: CCL_LOCAL_SIZE
                value: "8"
              - name: CCL_OFI_ENABLE_HOSTNAME_SHARING
                value: "1"
              - name: CCL_OFI_INIT_ENABLE_HOSTNAME_SHARING
                value: "1"
              - name: CCL_TOPO_FABRIC_VERTEX_CONNECTION_CHECK
                value: "0"
              - name: CCL_SYCL_ALLREDUCE_TMP_BUF
                value: "1"
              - name: CCL_LOG_LEVEL
                value: info
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: FI_PROVIDER
                value: verbs
              - name: I_MPI_OFI_PROVIDER
                value: verbs
              - name: UCX_TLS
                value: tcp,ze_copy
              - name: UCX_MEMTYPE_CACHE
                value: "0"
              - name: USER
                value: llm-d
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: TP_SIZE
                value: "8"
              - name: MAX_MODEL_LEN
                value: "512"
              - name: GPU_MEMORY_UTILIZATION
                value: "0.8"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface/hub
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm
            ports:
              - containerPort: 8200
                name: modelserver
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 120
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 20
            readinessProbe:
              httpGet:
                path: /v1/models
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
            resources:
              limits:
                cpu: "64"
                memory: 512Gi
              requests:
                cpu: "64"
                memory: 512Gi
              claims:
                - name: xpu-qwen3-235b-claim
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: vllm-cache
                mountPath: /var/cache/vllm
