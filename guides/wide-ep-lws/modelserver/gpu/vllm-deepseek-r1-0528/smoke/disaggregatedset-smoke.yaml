# Minimal DisaggregatedSet for local controller smoke tests (no GPUs).
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: wide-ep-lws-smoke
  labels:
    llm-d.ai/guide: wide-ep-lws
    llm-d.ai/model: smoke
spec:
  roles:
    - name: prefill
      metadata:
        labels:
          llm-d.ai/role: prefill
      spec:
        replicas: 1
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: wide-ep-lws
                llm-d.ai/role: prefill
            spec:
              containers:
                - name: vllm
                  image: registry.k8s.io/pause:3.9
    - name: decode
      metadata:
        labels:
          llm-d.ai/role: decode
      spec:
        replicas: 1
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: wide-ep-lws
                llm-d.ai/role: decode
            spec:
              containers:
                - name: vllm
                  image: registry.k8s.io/pause:3.9
