apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../gke

# Kueue Topology Aware Scheduling configuration on top of the gke overlay.
# The queue-name label is set on the role metadata, which the
# DisaggregatedSet controller stamps onto the child LeaderWorkerSets.
patches:
  - target:
      kind: DisaggregatedSet
      name: wide-ep-lws-nvidia-gpu-vllm
    patch: |-
      - op: add
        path: /spec/roles/0/metadata/labels/kueue.x-k8s.io~1queue-name
        value: default
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/metadata/annotations/kueue.x-k8s.io~1podset-required-topology
        value: "cloud.google.com/gce-topology-block"
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/metadata/annotations/kueue.x-k8s.io~1podset-group-name
        value: "llm-d-wide-ep"
      - op: add
        path: /spec/roles/1/metadata/labels/kueue.x-k8s.io~1queue-name
        value: default
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/metadata/annotations/kueue.x-k8s.io~1podset-required-topology
        value: "cloud.google.com/gce-topology-block"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/metadata/annotations/kueue.x-k8s.io~1podset-group-name
        value: "llm-d-wide-ep"
