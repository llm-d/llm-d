apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

# GKE-specific configuration, expressed as JSON patches into the
# DisaggregatedSet role pod templates: roles/0 is prefill, roles/1 is decode.
# GPUs and RDMA NICs are allocated through DRA (GKE managed DRANET): each pod
# requests eight gke-rdma-template claims, one GPU+NIC pair per rank, matched
# on PCIe root. The component's nested NCCL patches target
# Deployment/LeaderWorkerSet and do not match the DisaggregatedSet, so the
# equivalent env vars are set in the patches below.
components:
  - ../../../../../recipes/modelserver/components/gke-rdma

patches:
  - target:
      kind: DisaggregatedSet
      name: wide-ep-lws-nvidia-gpu-vllm
    patch: |-
      # Prefer the same block and subblock.
      # https://github.com/llm-d/llm-d/tree/main/docs/infrastructure/providers/gke#configuring-support-for-rdma-on-gke-workload-pods
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/affinity
        value:
          podAffinity:
            # Subblock affinity cannot guarantee all pods in the replica
            # are in the same subblock, but is better than random spreading
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 2
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    llm-d.ai/role: prefill
                matchLabelKeys:
                - component
                topologyKey: cloud.google.com/gce-topology-block
            - weight: 1
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    llm-d.ai/role: prefill
                matchLabelKeys:
                - component
                topologyKey: cloud.google.com/gce-topology-subblock
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/affinity
        value:
          podAffinity:
            # Subblock affinity cannot guarantee all pods in the replica
            # are in the same subblock, but is better than random spreading
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 2
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    llm-d.ai/role: decode
                matchLabelKeys:
                - component
                topologyKey: cloud.google.com/gce-topology-block
            - weight: 1
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    llm-d.ai/role: decode
                matchLabelKeys:
                - component
                topologyKey: cloud.google.com/gce-topology-subblock
  # Common configurations for prefill and decode.
  - target:
      kind: DisaggregatedSet
      name: wide-ep-lws-nvidia-gpu-vllm
    patch: |-
      # Enable privileged container on GKE to perform GPU initiated RDMA.
      # See https://github.com/llm-d/llm-d/tree/main/docs/infrastructure/providers/gke#configuring-support-for-rdma-on-gke-workload-pods.
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/securityContext/privileged
        value: true
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/securityContext/privileged
        value: true
      # DRA node pools taint GPU nodes; the nvidia.com/gpu extended resource no
      # longer grants the implicit toleration once GPUs come from claims.
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/tolerations
        value:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/tolerations
        value:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
      # One GPU+NIC DRA claim per rank, eight per pod.
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/resourceClaims
        value:
          - name: gke-rdma-claim-0
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-1
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-2
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-3
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-4
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-5
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-6
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-7
            resourceClaimTemplateName: gke-rdma-template
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/resourceClaims
        value:
          - name: gke-rdma-claim-0
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-1
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-2
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-3
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-4
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-5
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-6
            resourceClaimTemplateName: gke-rdma-template
          - name: gke-rdma-claim-7
            resourceClaimTemplateName: gke-rdma-template
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/claims
        value:
          - name: gke-rdma-claim-0
          - name: gke-rdma-claim-1
          - name: gke-rdma-claim-2
          - name: gke-rdma-claim-3
          - name: gke-rdma-claim-4
          - name: gke-rdma-claim-5
          - name: gke-rdma-claim-6
          - name: gke-rdma-claim-7
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/claims
        value:
          - name: gke-rdma-claim-0
          - name: gke-rdma-claim-1
          - name: gke-rdma-claim-2
          - name: gke-rdma-claim-3
          - name: gke-rdma-claim-4
          - name: gke-rdma-claim-5
          - name: gke-rdma-claim-6
          - name: gke-rdma-claim-7
      # GPUs are allocated through the claims above.
      - op: remove
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/limits/nvidia.com~1gpu
      - op: remove
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/requests/nvidia.com~1gpu
      - op: remove
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/limits/nvidia.com~1gpu
      - op: remove
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/requests/nvidia.com~1gpu
      # Disable GKE's built-in NCCL tuner and net plugin (same env vars as the
      # disable-gke-nccl-tuner-patch component sets for Deployment/LWS).
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: NCCL_TUNER_PLUGIN
          value: "none"
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: NCCL_NET_PLUGIN
          value: ""
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: NCCL_TUNER_PLUGIN
          value: "none"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: NCCL_NET_PLUGIN
          value: ""
      # GCP pairs GPU NICs to PCIe bridges (https://cloud.google.com/compute/docs/gpus/gpu-network-bandwidth#h200-gpus),
      # which can lead to NVSHMEM's automatic distance assignment algorithm selecting NICs
      # inefficiently. Instead, instruct NVSHMEM to select the NIC that aligns to the
      # index of the GPU on the node. Relies on https://github.com/deepseek-ai/DeepEP/pull/466
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: DEEP_EP_DEVICE_TO_HCA_MAPPING
          value: "0:mlx5_0:1,1:mlx5_1:1,2:mlx5_2:1,3:mlx5_3:1,4:mlx5_4:1,5:mlx5_5:1,6:mlx5_6:1,7:mlx5_7:1"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: DEEP_EP_DEVICE_TO_HCA_MAPPING
          value: "0:mlx5_0:1,1:mlx5_1:1,2:mlx5_2:1,3:mlx5_3:1,4:mlx5_4:1,5:mlx5_5:1,6:mlx5_6:1,7:mlx5_7:1"
      # This is recommended on gke.
      # https://github.com/llm-d/llm-d/tree/main/docs/infrastructure/providers/gke#configuring-support-for-rdma-on-gke-workload-pods
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: NVSHMEM_DISABLED_GDRCOPY
          value: "true"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: NVSHMEM_DISABLED_GDRCOPY
          value: "true"
      # We add the volume for different providers since the hostPath can be different.
      - op: replace
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/volumes/1
        value:
          name: hf-cache
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/vllm-hf-cache/
            type: DirectoryOrCreate
      - op: replace
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/volumes/2
        value:
          name: jit-cache
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/vllm-jit-cache/
            type: DirectoryOrCreate
      - op: replace
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/volumes/1
        value:
          name: hf-cache
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/vllm-hf-cache/
            type: DirectoryOrCreate
      - op: replace
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/volumes/2
        value:
          name: jit-cache
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/vllm-jit-cache/
            type: DirectoryOrCreate
