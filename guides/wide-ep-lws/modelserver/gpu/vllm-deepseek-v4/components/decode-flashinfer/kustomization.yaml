apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Decode-only backend swap: default ("auto") MoE backend + flashinfer_nvlink_one_sided
# all2all, instead of MegaMoE. Does NOT change parallelism — TP/DP/EP are set by the
# topology component this is composed with (e.g. decode DEP16 in 3p2d-dep8-dep16).

# The schema teaches kustomize the DisaggregatedSet merge keys so the patch
# below matches the role, container, and env entries by name instead of
# array index.
openapi:
  path: disaggregatedset-schema.json

patches:
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: wide-ep-lws-nvidia-gpu-vllm-deepseek-v4
      spec:
        roles:
          - name: decode
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: vllm
                        env:
                          - name: MOE_BACKEND
                            value: auto
                          - name: ALL2ALL_BACKEND
                            value: flashinfer_nvlink_one_sided
