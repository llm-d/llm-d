apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: MOE_BACKEND
          value: auto
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: ALL2ALL_BACKEND
          value: flashinfer_nvlink_one_sided
