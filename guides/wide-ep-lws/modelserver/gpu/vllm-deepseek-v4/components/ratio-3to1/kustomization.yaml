apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Operating point: 3 prefill : 1 decode (SemiAnalysis "max-tpt").
# 3 prefill + 1 decode instance, 8 GPUs each -> 8 nodes / 32 GPUs total.
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
