apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# 2 prefill workers (DEP8) + 1 decode worker (DEP16, 4 nodes) -> 8 nodes / 32 GPUs.
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 4
