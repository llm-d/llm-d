apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Operating point: 1 prefill : 1 decode (SemiAnalysis "mid-curve").
# 1 prefill + 1 decode instance, 8 GPUs each -> 4 nodes / 16 GPUs total.
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
