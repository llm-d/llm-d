apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# 1 prefill worker (DEP8) + 4 decode replicas (TP=8 each) -> 10 nodes / 40 GPUs.
# Scaled low-latency: multiple independent TP=8 decode workers handle higher concurrency.
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
