apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Operating point: 2 prefill : 1 decode (SemiAnalysis "high-tpt").
# 2 prefill + 1 decode instance, 8 GPUs each -> 6 nodes / 24 GPUs total.
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
