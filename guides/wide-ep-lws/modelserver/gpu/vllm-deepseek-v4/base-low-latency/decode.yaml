apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-nvidia-gpu-vllm-deepseek-v4-decode
  labels:
    llm-d.ai/model: DeepSeek-V4-Pro
    llm-d.ai/role: decode
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: DeepSeek-V4-Pro
          llm-d.ai/role: decode
      spec:
        serviceAccountName: deepseek-v4
        # Required for cross-pod cuda_ipc (NIXL KV transfers over MNNVL NVLink)
        hostIPC: true
        hostPID: true
        initContainers:
          - name: routing-proxy
            args:
              - --port=8000
              - --vllm-port=8200
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-proxy=false
              - --enable-prefiller-sampling
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
            imagePullPolicy: Always
            ports:
              - containerPort: 8000
                name: sidecar
                protocol: TCP
            resources: {}
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
        containers:
          - name: vllm
            image: vllm/vllm-openai:v0.24.0
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                #################
                # RUN vLLM DeepSeek-V4 decode worker (TP=8, low-latency)
                # Pure tensor parallelism across 2 nodes (4 GPUs each) via MNNVL.
                #################
                API_SERVER_COUNT=1
                if [ "${LWS_WORKER_INDEX:-0}" -gt 0 ]; then
                  API_SERVER_COUNT=0
                fi

                exec vllm serve \
                  deepseek-ai/DeepSeek-V4-Pro \
                  --port 8200 \
                  --tokenizer-mode deepseek_v4 \
                  --gpu-memory-utilization 0.9 \
                  --max-model-len 9280 \
                  --trust-remote-code \
                  --api-server-count $API_SERVER_COUNT \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --tensor-parallel-size $TP_SIZE \
                  --pipeline-parallel-size 1 \
                  --nnodes $((TP_SIZE / GPUS_PER_NODE)) \
                  --node-rank ${LWS_WORKER_INDEX:-0} \
                  --master-addr ${LWS_LEADER_ADDRESS} \
                  --kv_transfer_config '{"kv_connector":"NixlConnector",
                                          "kv_role":"kv_consumer",
                                          "kv_load_failure_policy":"fail"}' \
                  --kv-cache-dtype fp8 \
                  --max-num-seqs 256 \
                  --max-cudagraph-capture-size 256 \
                  --max-num-batched-tokens 256 \
                  --block-size 256 \
                  --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}' \
                  --no-disable-hybrid-kv-cache-manager \
                  --enable-cumem-allocator
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: VLLM_USE_RUST_FRONTEND
                value: "1"
              - name: VLLM_USE_V2_MODEL_RUNNER
                value: "1"
              - name: TP_SIZE
                value: "8"
              - name: GPUS_PER_NODE
                value: "4"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NCCL_MNNVL_ENABLE
                value: "1"
              - name: NCCL_NVLS_ENABLE
                value: "1"
              - name: NCCL_CUMEM_ENABLE
                value: "1"
              - name: NCCL_P2P_LEVEL
                value: NVL
              - name: VLLM_USE_NCCL_SYMM_MEM
                value: "0"
              - name: NVSHMEM_CUMEM_HANDLE_TYPE
                value: FABRIC
              - name: NVSHMEM_DISABLE_CUDA_VMM
                value: "0"
              - name: UCX_CUDA_IPC_ENABLE_MNNVL
                value: "y"
              # Enable NIXL KV transfers via NVLink (cuda_ipc) and InfiniBand RDMA (rc)
              - name: UCX_TLS
                value: cuda_ipc,rc,cuda_copy
              # Environment-specific: uncomment and set to exclude non-IB ports
              # - name: UCX_NET_DEVICES
              #   value: "mlx5_0:1,mlx5_1:1,mlx5_3:1,mlx5_4:1"
              - name: UCX_MEMTYPE_CACHE
                value: "n"
              - name: UCX_MEMTYPE_REG_WHOLE
                value: "n"
              - name: TILELANG_CLEANUP_TEMP_FILES
                value: "1"
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface

            ports:
              - containerPort: 8200
                name: modelserver
                protocol: TCP
              - containerPort: 5600
                name: nixl
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /v1/models
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: "4"
              requests:
                cpu: 32
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: "4"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
