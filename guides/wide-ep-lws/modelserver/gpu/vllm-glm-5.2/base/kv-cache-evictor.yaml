apiVersion: apps/v1
kind: Deployment
metadata:
  name: wide-ep-kv-cache-evictor
  labels:
    app: kv-cache-evictor
    llm-d.ai/model: GLM-5.2-FP8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kv-cache-evictor
  template:
    metadata:
      labels:
        app: kv-cache-evictor
        component: storage-cleanup
    spec:
      serviceAccountName: glm-5-2
      containers:
        - name: evictor
          image: quay.io/pvc-evictor/pvc-evictor:latest
          imagePullPolicy: Always
          env:
            - name: PVC_MOUNT_PATH
              value: /kv-cache
            - name: CLEANUP_THRESHOLD
              value: "80"
            - name: TARGET_THRESHOLD
              value: "55"
            - name: CACHE_DIRECTORY
              value: ""
            - name: NUM_CRAWLER_PROCESSES
              value: "8"
            - name: LOGGER_INTERVAL_SECONDS
              value: "0.5"
            - name: FILE_QUEUE_MAXSIZE
              value: "10000"
            - name: FILE_QUEUE_MIN_SIZE
              value: "1000"
            - name: DELETION_BATCH_SIZE
              value: "100"
            - name: FILE_ACCESS_TIME_THRESHOLD_MINUTES
              value: "60"
            - name: ENABLE_DIR_CLEANUP
              value: "true"
            - name: DIR_CLEANUP_TTL_SECONDS
              value: "120"
            - name: DRY_RUN
              value: "false"
            - name: LOG_LEVEL
              value: INFO
          volumeMounts:
            - name: nvme-cache
              mountPath: /kv-cache
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 4
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os; exit(0 if os.path.exists('/kv-cache') else 1)"
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os; exit(0 if os.path.exists('/kv-cache') else 1)"
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: nvme-cache
          hostPath:
            path: /mnt/local/kv-cache
            type: DirectoryOrCreate
