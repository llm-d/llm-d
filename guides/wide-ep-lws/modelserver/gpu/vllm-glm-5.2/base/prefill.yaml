apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-nvidia-gpu-vllm-glm-5-2-prefill
  labels:
    llm-d.ai/model: GLM-5.2-FP8
    llm-d.ai/role: prefill
spec:
  replicas: ${PREFILL_REPLICAS}
  leaderWorkerTemplate:
    size: ${PREFILL_SIZE}
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: GLM-5.2-FP8
          llm-d.ai/role: prefill
      spec:
        serviceAccountName: glm-5-2
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      llm-d.ai/role: prefill
                      llm-d.ai/model: GLM-5.2-FP8
                  topologyKey: backend.coreweave.cloud/leafgroup-name
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1500Gi
          - name: hf-cache
            hostPath:
              path: /mnt/local/hf-cache
              type: DirectoryOrCreate
          - name: jit-cache
            hostPath:
              path: /mnt/local/jit-cache
              type: DirectoryOrCreate
          - name: sys
            hostPath:
              path: /sys
              type: Directory
          - name: proc
            hostPath:
              path: /proc
              type: Directory
          - name: nvme-cache
            hostPath:
              path: /mnt/local/kv-cache
              type: DirectoryOrCreate
        containers:
          - name: vllm
            image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:0cc399fd59e4f23b7c2f97ceb74d91d1553fb645
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                uv pip install --system nixl==1.3.0 nixl-cu13==1.3.0 --no-deps

                # Hotfix: add kv_quant_mode to MLAAttention.get_kv_cache_spec (vllm#47722)
                # PR #47716 fixed deepseek_v4 and sparse_swa but missed mla_attention.py
                python3 -c "
                p='/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/attention/mla_attention.py'
                s=open(p).read()
                if 'get_kv_quant_mode' not in s:
                  s=s.replace('    MLAAttentionSpec,\n)', '    MLAAttentionSpec,\n    get_kv_quant_mode,\n)')
                  s=s.replace('            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n        )',
                              '            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n            kv_quant_mode=get_kv_quant_mode(vllm_config.cache_config.cache_dtype),\n        )')
                  open(p,'w').write(s); print('PATCHED mla_attention.py')
                else: print('mla_attention.py already patched')
                "

                # Hotfix: fix packed HND KV cache reshape (neuralmagic/vllm@2e10140)
                python3 -c "
                p='/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/attn_utils.py'
                s=open(p).read()
                old='            .view(kv_cache_shape)\n        )\n    elif kv_cache_spec.page_size_padded'
                new='            .view(permuted_kv_cache_shape)\n        )\n    elif kv_cache_spec.page_size_padded'
                if old in s:
                  open(p,'w').write(s.replace(old, new)); print('PATCHED attn_utils.py')
                else: print('attn_utils.py already patched or different version')
                "

                # Hotfix: offloading set_ overflow for packed non-uniform KV caches
                # The indexer group's offset+page_size exceeds block_stride in the packed
                # layout. Replace set_() with as_strided() to avoid bounds check failure.
                python3 -c "
                import re
                p='/usr/local/lib/python3.12/dist-packages/vllm/distributed/kv_transfer/kv_connector/v1/offloading/worker.py'
                s=open(p).read()
                pat = (r'(tensors_per_block\[layer_name\] = \(\n)'
                       r'(\s+)torch\.tensor\(\n'
                       r'\s+\[\],\n'
                       r'\s+dtype=torch\.int8,\n'
                       r'\s+device=layer_kv_cache\.device,\n'
                       r'\s+\)\.set_\(\n'
                       r'\s+layer_kv_cache\.untyped_storage\(\),\n'
                       r'\s+byte_offset,\n'
                       r'\s+\(num_blocks, page\),\n'
                       r'\s+\(block_stride_bytes, 1\),\n'
                       r'\s+\),\n'
                       r'(\s+)\)')
                repl = (r'\1'
                        r'\2torch.as_strided(\n'
                        r'\2    torch.empty(0, dtype=torch.int8, device=layer_kv_cache.device).set_(layer_kv_cache.untyped_storage()),\n'
                        r'\2    (num_blocks, page),\n'
                        r'\2    (block_stride_bytes, 1),\n'
                        r'\2    byte_offset,\n'
                        r'\2),\n'
                        r'\3)')
                new_s, n = re.subn(pat, repl, s)
                if n > 0:
                  open(p,'w').write(new_s); print('PATCHED worker.py')
                else:
                  print('worker.py: no match for set_ pattern')
                "

                # Hotfix: madvise out of bounds when DP>1 + TP=1
                # Each DP rank is a separate vllm process (world_size=1) with its own mmap.
                # TieringOffloadingSpec.create_worker uses torch.accelerator.current_device_index()
                # as rank, but with world_size=1 the mmap row only fits 1 worker. GPU indices
                # >0 overflow. Fix: use rank=0 since each process owns its own mmap.
                python3 -c "
                p='/usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/spec.py'
                s=open(p).read()
                old='        rank = torch.accelerator.current_device_index()'
                new='        rank = 0  # each DP process has its own mmap; TP-local rank is 0'
                if old in s:
                  open(p,'w').write(s.replace(old, new)); print('PATCHED spec.py (rank=0)')
                else: print('spec.py: pattern not found, may already be patched')
                "

                # Hotfix: skip FA3 AOT scheduling for spec-decode proposer
                # get_scheduler_metadata hardcodes is_varlen=true; mha_fwd derives it
                # from actual tensor shapes — param divergence causes metadata_size mismatch.
                # fast_build=True makes scheduler_metadata=None so mha_fwd allocates its own.
                python3 -c "
                import re
                # 1) attn_utils.py: add fast_build param to build_attn_metadata
                p1='/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/attn_utils.py'
                s=open(p1).read()
                if 'fast_build' not in s:
                  # Add fast_build parameter to function signature
                  s=s.replace(
                    'causal: bool | torch.Tensor | Mapping[int, bool] = True,\n    rswa_prefix_lens: torch.Tensor | None = None,\n) -> dict[str, Any]:',
                    'causal: bool | torch.Tensor | Mapping[int, bool] = True,\n    rswa_prefix_lens: torch.Tensor | None = None,\n    fast_build: bool = False,\n) -> dict[str, Any]:')
                  # Pass fast_build to builder.build()
                  s=s.replace(
                    'common_prefix_len=0,\n                    common_attn_metadata=common_attn_metadata,\n                    **attn_metadata_extra_kwargs,',
                    'common_prefix_len=0,\n                    common_attn_metadata=common_attn_metadata,\n                    fast_build=fast_build,\n                    **attn_metadata_extra_kwargs,')
                  open(p1,'w').write(s); print('PATCHED attn_utils.py (fast_build)')
                else: print('attn_utils.py already has fast_build')

                # 2) speculator.py: pass fast_build=True
                p2='/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/spec_decode/speculator.py'
                s=open(p2).read()
                if 'fast_build' not in s:
                  s=s.replace(
                    'kv_cache_config=self.kv_cache_config,\n            causal=causal,\n        )\n        return attn_metadata',
                    'kv_cache_config=self.kv_cache_config,\n            causal=causal,\n            fast_build=True,\n        )\n        return attn_metadata')
                  open(p2,'w').write(s); print('PATCHED speculator.py (fast_build=True)')
                else: print('speculator.py already has fast_build')
                "

                #################
                # RUN vLLM GLM-5.2-FP8 prefill worker
                #################

                # Wide-EP (multi-node): reserve VRAM for NVSHMEM symmetric heap
                if [ "${LWS_GROUP_SIZE:-1}" -gt 1 ]; then
                  export NVSHMEM_SYMMETRIC_SIZE=16G
                  GPU_MEM_UTIL=0.80
                else
                  GPU_MEM_UTIL=0.91
                fi

                # DSpark speculative decoding (multi-node only — must match decode for NIXL KV layer handshake)
                SPEC_ARGS=""
                KV_CACHE_DTYPE_ARGS="--kv-cache-dtype fp8"
                MAX_BATCHED_ARGS=""
                if [ "${ENABLE_DSPARK:-0}" = "1" ] && [ "${LWS_GROUP_SIZE:-1}" -gt 1 ]; then
                  GPU_MEM_UTIL=$(python3 -c "print(round($GPU_MEM_UTIL - 0.04, 2))")
                  MAX_BATCHED_TOKENS=1024
                  MAX_SEQS=$(( MAX_BATCHED_TOKENS / (DSPARK_NUM_TOKENS + 1) ))
                  export NVSHMEM_QP_DEPTH=$(( (MAX_BATCHED_TOKENS + 1) * 2 ))
                  MAX_BATCHED_ARGS="--max-num-batched-tokens ${MAX_BATCHED_TOKENS} --max-num-seqs ${MAX_SEQS}"
                  SPEC_ARGS="--speculative-config {\"model\":\"${DSPARK_MODEL}\",\"num_speculative_tokens\":${DSPARK_NUM_TOKENS},\"method\":\"dspark\"}"
                  KV_CACHE_DTYPE_ARGS=""
                
                  # Swap in patched FA3 .so from PVC (flash-attention PR #162)
                  FA3_DIR=$(python3 -c "import vllm.vllm_flash_attn as m; print(m.__path__[0])")
                  cp /mnt/fa3-build/_vllm_fa3_C*.so "$FA3_DIR/" \
                    && echo "FA3 .so swapped: $(ls -lh "$FA3_DIR"/_vllm_fa3_C*.so)" \
                    || { echo "FATAL: FA3 .so swap failed — /mnt/fa3-build not mounted or .so missing"; exit 1; } 
                fi

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                exec vllm serve $SPEC_ARGS $KV_CACHE_DTYPE_ARGS \
                  zai-org/GLM-5.2-FP8 \
                  --port 8000 \
                  --trust-remote-code \
                  --gpu-memory-utilization $GPU_MEM_UTIL \
                  --max-model-len 131072 \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --data-parallel-multi-port-external-lb \
                  --data-parallel-supervisor-port=8208 \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank $START_RANK \
                  --kv_transfer_config '{"kv_connector":"NixlConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail"}' \
                  --moe-backend deep_gemm \
                  --all2all-backend deepep_high_throughput \
                  $MAX_BATCHED_ARGS
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: HF_HOME
                value: /mnt/hf-cache
              - name: ENABLE_DSPARK
                value: "0"
              - name: DSPARK_MODEL
                value: "RedHatAI/GLM-5.2-speculator.dspark"
              - name: DSPARK_NUM_TOKENS
                value: "7"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "8"
              - name: TP_SIZE
                value: "1"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_COMPUTE_NANS_IN_LOGITS
                value: "1"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: PYTHONHASHSEED
                value: "0"
              - name: VLLM_SERVER_DEV_MODE
                value: "1"
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer

            ports:
              - containerPort: 8000
                name: dp0
                protocol: TCP
              - containerPort: 8001
                name: dp1
                protocol: TCP
              - containerPort: 8002
                name: dp2
                protocol: TCP
              - containerPort: 8003
                name: dp3
                protocol: TCP
              - containerPort: 8004
                name: dp4
                protocol: TCP
              - containerPort: 8005
                name: dp5
                protocol: TCP
              - containerPort: 8006
                name: dp6
                protocol: TCP
              - containerPort: 8007
                name: dp7
                protocol: TCP
              - containerPort: 8208
                name: supervisor
                protocol: TCP
              - containerPort: 5600
                name: nixl
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: supervisor
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: supervisor
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /readyz
                port: supervisor
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 1500Gi
                nvidia.com/gpu: "8"
              requests:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 1500Gi
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: hf-cache
                mountPath: /mnt/hf-cache
              - name: nvme-cache
                mountPath: /mnt/nvme-cache
              - name: fa3-build
                mountPath: /mnt/fa3-build
                readOnly: true
          - name: node-exporter
            image: quay.io/prometheus/node-exporter:v1.9.0
            imagePullPolicy: IfNotPresent
            args:
              - --collector.disable-defaults
              - --collector.infiniband
              - --collector.netstat
              - "--collector.netstat.fields=(.*Retrans.*|.*Timeout.*|.*LossProbe.*|.*FastRetrans.*|.*SackRecovery.*|.*Estab.*|.*Segs.*|.*Drops.*|.*Overflow.*|.*MemoryPressure.*|.*AutoCork.*|.*DSACK.*|.*Reorder.*|.*OFO.*|.*DelayedACK.*)"
              - --collector.pressure
              - --collector.schedstat
              - --collector.cpu
              - --path.sysfs=/host/sys
              - --path.procfs=/host/proc
            ports:
              - containerPort: 9100
                name: node-metrics
                protocol: TCP
            volumeMounts:
              - name: sys
                mountPath: /host/sys
                readOnly: true
              - name: proc
                mountPath: /host/proc
                readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
