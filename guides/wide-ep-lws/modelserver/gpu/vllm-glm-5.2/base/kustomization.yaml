# Single DisaggregatedSet managing prefill and decode roles.
# Requires LWS v0.10.0+ with the DisaggregatedSet CRD and controller installed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - disaggregatedset.yaml
  - serviceAccount.yaml
  - kv-cache-evictor.yaml

components:
  - ../../../../../recipes/modelserver/components/images/gpu-vllm/nightly
  - ../../../../../recipes/modelserver/components/images/routing-sidecar/nightly

labels:
  - pairs:
      llm-d.ai/model: GLM-5.2-FP8
      llm-d.ai/guide: wide-ep-lws
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
    # Keep selector/template label injection for the kv-cache-evictor
    # DaemonSet (built-in kinds only, the DisaggregatedSet labels are inline).
    includeSelectors: true
    includeTemplates: true
    fields:
      - version: v1
        kind: ServiceAccount
        path: metadata/labels
        create: true
