apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# GLM-5.2-FP8: 3 prefill replicas (DEP16, 2 nodes each) + 2 decode replicas (DEP16, 2 nodes each) -> 10 nodes / 80 GPUs.
resources:
  - ../../providers/coreweave
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 2
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 2
