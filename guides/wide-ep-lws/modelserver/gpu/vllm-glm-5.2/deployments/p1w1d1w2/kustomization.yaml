apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CKS H200, GLM-5.2-FP8, P8/D16: 1 prefill node (DEP8) + 2 decode nodes (DEP16, wide) -> 3 nodes / 24 GPUs.
resources:
  - ../../providers/coreweave
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 1
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 2
