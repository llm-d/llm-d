apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Enable tiered (CPU + local NVMe) KV-cache offloading on the prefill role.

# The schema teaches kustomize the DisaggregatedSet merge keys so the patch
# below matches the role, container, and env entry by name instead of array
# index.
openapi:
  path: disaggregatedset-schema.json

patches:
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: wide-ep-lws-nvidia-gpu-vllm-glm-5-2
      spec:
        roles:
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: vllm
                        env:
                          - name: OFFLOADING_MODE
                            value: "tiered"
