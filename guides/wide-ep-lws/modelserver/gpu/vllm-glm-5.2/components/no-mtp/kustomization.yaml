apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Disable MTP speculative decoding on both roles.

# The schema teaches kustomize the DisaggregatedSet merge keys so the patch
# below matches the ENABLE_MTP env entry by name instead of array index. The
# common env override is written once under the prefill role (&no-mtp-common)
# and reused for the decode role (*no-mtp-common).
openapi:
  path: disaggregatedset-schema.json

patches:
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: wide-ep-lws-nvidia-gpu-vllm-glm-5-2
      spec:
        roles:
          - name: prefill
            spec: &no-mtp-common
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: vllm
                        env:
                          - name: ENABLE_MTP
                            value: "0"
          - name: decode
            spec: *no-mtp-common
