apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Wide-EP / DP-aware monitoring overlay.
#
# Unlike the generic recipes/modelserver/components/monitoring-pd component
# (which scrapes a single "modelserver" port), wide expert parallelism runs
# data-parallel ranks behind a routing sidecar, exposing one metrics port per
# rank (rank0-rank7). These PodMonitors scrape all 8 ranks for both prefill
# and decode.
resources:
  - decode-podmonitor.yaml
  - prefill-podmonitor.yaml
