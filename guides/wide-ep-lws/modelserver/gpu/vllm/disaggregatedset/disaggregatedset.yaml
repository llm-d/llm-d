# Generated by scripts/generate-disaggregatedset.py from base/decode.yaml and base/prefill.yaml.
# Re-run the generator after changing legacy LWS role specs.
apiVersion: disaggregatedset.x-k8s.io/v1alpha1
kind: DisaggregatedSet
metadata:
  name: wide-ep-lws-nvidia-gpu-vllm
  labels:
    llm-d.ai/model: DeepSeek-R1-0528
    llm-d.ai/guide: wide-ep-lws
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
spec:
  roles:
  - name: prefill
    metadata:
      labels:
        llm-d.ai/model: DeepSeek-R1-0528
        llm-d.ai/role: prefill
    replicas: 1
    leaderWorkerTemplate:
      size: 2
      workerTemplate:
        metadata:
          labels:
            llm-d.ai/inference-serving: 'true'
            llm-d.ai/guide: wide-ep-lws
            llm-d.ai/accelerator-variant: gpu
            llm-d.ai/accelerator-vendor: nvidia
            llm-d.ai/model: DeepSeek-R1-0528
            llm-d.ai/role: prefill
        spec:
          serviceAccountName: deepseek-r1
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
          containers:
          - name: vllm
            image: ghcr.io/llm-d/llm-d-cuda:v0.7.0
            securityContext:
              capabilities:
                add:
                - IPC_LOCK
                - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
            - /bin/bash
            - -c
            args:
            - "# Clear /dev/shm on start to prevent running out of space when crashes occur\n# https://github.com/llm-d/llm-d/issues/352\n\
              find /dev/shm -type f -delete\n\n#################\n# RUN vLLM prefill worker\n#################\nSTART_RANK=$((\
              \ ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))\n\n# --data-parallel-hybrid-lb: Use external load balancing across\
              \ nodes, and internal load balancing within a node\n# --enable-expert-parallel: Use TPxDP in attention, EP in\
              \ MoE layers\n# --async-scheduling: Reduce white space between engine steps\n# --enable-dbo: Dual batch overlap\
              \ (DBO) overlaps compute with collective communication.\n# --enable-eplb:  Expert-parallel load balancing reduces\
              \ EP load imbalance by replicating heavily-used experts\n#   Performance-memory tradeoff: on DeepSeekV3 eplb\
              \ uses an extra 2GB per redundant expert per GPU\n#   Divisibility constraint: num_routed_experts (256 for DSv3)\
              \ + num_redundant_experts must be divisible by the number of GPUs.\n\nexec vllm serve \\\n  deepseek-ai/DeepSeek-R1-0528\
              \ \\\n  --port 8000 \\\n  --trust-remote-code \\\n  --gpu-memory-utilization 0.80 \\\n  --api-server-count 1\
              \ \\\n  --disable-access-log-for-endpoints=/health,/metrics \\\n  --data-parallel-hybrid-lb \\\n  --enable-expert-parallel\
              \ \\\n  --tensor-parallel-size $TP_SIZE \\\n  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \\\n\
              \  --data-parallel-size-local $DP_SIZE_LOCAL \\\n  --data-parallel-address ${LWS_LEADER_ADDRESS} \\\n  --data-parallel-rpc-port\
              \ 5555 \\\n  --data-parallel-start-rank $START_RANK \\\n  --kv_transfer_config '{\"kv_connector\":\"NixlConnector\"\
              ,\n                          \"kv_role\":\"kv_both\",\n                          \"kv_load_failure_policy\"\
              :\"fail\"}' \\\n  --enable-dbo \\\n  --dbo-prefill-token-threshold 32 \\\n  --enable-eplb \\\n  --eplb-config\
              \ '{\"window_size\":\"1000\",\n                  \"step_interval\":\"3000\",\n                  \"num_redundant_experts\"\
              :\"32\",\n                  \"log_balancedness\":\"False\"}' \\\n  --moe-backend deep_gemm \\\n  --all2all-backend\
              \ deepep_high_throughput \\\n  # To enable tracing, add:\n  # --otlp-traces-endpoint http://otel-collector:4317\
              \ \\\n  # --collect-detailed-traces all"
            env:
            - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
              value: '1'
            - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
              value: '1'
            - name: DP_SIZE_LOCAL
              value: '8'
            - name: TP_SIZE
              value: '1'
            - name: TRITON_LIBCUDA_PATH
              value: /usr/lib64
            - name: VLLM_SKIP_P2P_CHECK
              value: '1'
            - name: NVIDIA_GDRCOPY
              value: enabled
            - name: NVSHMEM_REMOTE_TRANSPORT
              value: ibgda
            - name: NVSHMEM_IB_ENABLE_IBGDA
              value: 'true'
            - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
              value: eth0
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CUDA_CACHE_PATH
              value: /var/cache/vllm/cuda
            - name: CCACHE_DIR
              value: /var/cache/vllm/ccache
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /var/cache/vllm/flashinfer
            - name: HF_HUB_CACHE
              value: /var/cache/huggingface
            ports:
            - containerPort: 8000
              name: modelserver
              protocol: TCP
            - containerPort: 5600
              name: nixl
              protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /v1/models
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: '8'
              requests:
                cpu: 32
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: '8'
            volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /var/cache/huggingface
            - name: jit-cache
              mountPath: /var/cache/vllm
  - name: decode
    metadata:
      labels:
        llm-d.ai/model: DeepSeek-R1-0528
        llm-d.ai/role: decode
    replicas: 1
    leaderWorkerTemplate:
      size: 2
      workerTemplate:
        metadata:
          labels:
            llm-d.ai/inference-serving: 'true'
            llm-d.ai/guide: wide-ep-lws
            llm-d.ai/accelerator-variant: gpu
            llm-d.ai/accelerator-vendor: nvidia
            llm-d.ai/model: DeepSeek-R1-0528
            llm-d.ai/role: decode
        spec:
          serviceAccountName: deepseek-r1
          initContainers:
          - name: routing-proxy
            args:
            - --port=8000
            - --vllm-port=8200
            - --connector=nixlv2
            - --zap-log-level=1
            - --secure-proxy=false
            - --enable-prefiller-sampling
            image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.7.1
            imagePullPolicy: Always
            ports:
            - containerPort: 8000
              name: sidecar
              protocol: TCP
            resources: {}
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
          containers:
          - name: vllm
            image: ghcr.io/llm-d/llm-d-cuda:v0.7.0
            securityContext:
              capabilities:
                add:
                - IPC_LOCK
                - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
            - /bin/bash
            - -c
            args:
            - "# Clear /dev/shm on start to prevent running out of space when crashes occur\n# https://github.com/llm-d/llm-d/issues/352\n\
              find /dev/shm -type f -delete\n\n#################\n# RUN vLLM decode worker\n#################\nSTART_RANK=$((\
              \ ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))\n\n# --data-parallel-hybrid-lb: Use external load balancing across\
              \ nodes, and internal load balancing within a node\n# --enable-expert-parallel:  Use TPxDP in attention, EP\
              \ in MoE layers\n# --async-scheduling: Reduce white space between engine steps\n# --enable-dbo:  Dual batch\
              \ overlap (DBO) overlaps compute with collective communication.\n\nexec vllm serve \\\n  deepseek-ai/DeepSeek-R1-0528\
              \ \\\n  --port 8200 \\\n  --gpu-memory-utilization 0.9 \\\n  --trust-remote-code \\\n  --api-server-count 1\
              \ \\\n  --disable-access-log-for-endpoints=/health,/metrics \\\n  --data-parallel-hybrid-lb \\\n  --enable-expert-parallel\
              \ \\\n  --tensor-parallel-size $TP_SIZE \\\n  --max-num-batched-tokens ${MAX_TOKENS} \\\n  --max-num-seqs ${MAX_TOKENS}\
              \ \\\n  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \\\n  --data-parallel-size-local $DP_SIZE_LOCAL\
              \ \\\n  --data-parallel-address ${LWS_LEADER_ADDRESS} \\\n  --data-parallel-rpc-port 5555 \\\n  --data-parallel-start-rank\
              \ $START_RANK \\\n  --kv_transfer_config '{\"kv_connector\":\"NixlConnector\",\n                          \"\
              kv_role\":\"kv_both\",\n                          \"kv_load_failure_policy\":\"fail\"}' \\\n  --enable-dbo \\\
              \n  --dbo-decode-token-threshold 32 \\\n  --enable-eplb \\\n  --eplb-config '{\"window_size\":\"1000\",\n  \
              \                \"step_interval\":\"3000\",\n                  \"num_redundant_experts\":\"32\",\n        \
              \          \"log_balancedness\":\"False\"}' \\\n  --all2all-backend deepep_low_latency \\\n  --moe-backend deep_gemm\
              \ \\\n  --kv-cache-memory-bytes=${KV_CACHE_MEMORY_BYTES-}\n  # To enable tracing, add:\n  # --otlp-traces-endpoint\
              \ http://otel-collector:4317 \\\n  # --collect-detailed-traces all"
            env:
            - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
              value: '1'
            - name: MAX_TOKENS
              value: '256'
            - name: DP_SIZE_LOCAL
              value: '8'
            - name: TP_SIZE
              value: '1'
            - name: TRITON_LIBCUDA_PATH
              value: /usr/lib64
            - name: VLLM_SKIP_P2P_CHECK
              value: '1'
            - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
              value: '1'
            - name: VLLM_USE_DEEP_GEMM
              value: '1'
            - name: NVIDIA_GDRCOPY
              value: enabled
            - name: NVSHMEM_SYMMETRIC_SIZE
              value: 16G
            - name: NVSHMEM_REMOTE_TRANSPORT
              value: ibgda
            - name: NVSHMEM_IB_ENABLE_IBGDA
              value: 'true'
            - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
              value: eth0
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CUDA_CACHE_PATH
              value: /var/cache/vllm/cuda
            - name: CCACHE_DIR
              value: /var/cache/vllm/ccache
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /var/cache/vllm/flashinfer
            - name: HF_HUB_CACHE
              value: /var/cache/huggingface
            ports:
            - containerPort: 8200
              name: modelserver
              protocol: TCP
            - containerPort: 5600
              name: nixl
              protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /v1/models
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: '8'
              requests:
                cpu: 32
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: '8'
            volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /var/cache/huggingface
            - name: jit-cache
              mountPath: /var/cache/vllm
