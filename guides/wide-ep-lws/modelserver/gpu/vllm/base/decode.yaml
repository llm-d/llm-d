apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-llm-d-decode
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "wide-ep-lws"
    llm-d.ai/accelerator-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    llm-d.ai/role: decode
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/role: decode
      spec:
        serviceAccountName: glm
        initContainers:
          - name: routing-proxy
            args:
              # sidecar proxy is started with --port 8000, --vllm-port 8200, and --data-parallel-size 8,
              # so it listens on ports in the range [port:port+data-parallel-size-1] and forwards
              # requests each to the corresponding vllm port.
              - --port=8000
              - --vllm-port=8200
              - --data-parallel-size=8
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-proxy=false
              - --enable-prefiller-sampling
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
            imagePullPolicy: Always
            ports:
              - containerPort: 8000
                name: rank0
                protocol: TCP
              - containerPort: 8001
                name: rank1
                protocol: TCP
              - containerPort: 8002
                name: rank2
                protocol: TCP
              - containerPort: 8003
                name: rank3
                protocol: TCP
              - containerPort: 8004
                name: rank4
                protocol: TCP
              - containerPort: 8005
                name: rank5
                protocol: TCP
              - containerPort: 8006
                name: rank6
                protocol: TCP
              - containerPort: 8007
                name: rank7
                protocol: TCP
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi  # roughly 32MB per local DP plus scratch space
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
        containers:
          - name: vllm
            image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:c1a4225326594a66a58b948ab8da7bccc4dbc214
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                # Clear /dev/shm on start to prevent running out of space when crashes occur
                # https://github.com/llm-d/llm-d/issues/352
                find /dev/shm -type f -delete

                # ---------------------------------------------------------------
                # Hotfixes for GLM-5.2-FP8 packed FP8 KV cache reshape crash, e.g.
                #   RuntimeError: shape '[256, 64, 576]' is invalid for input of
                #   size 10747904
                # Resolve the vLLM install dir so the patches apply regardless of
                # which image (dist-packages vs site-packages) is in use.
                # ---------------------------------------------------------------
                VLLM_DIR=$(python3 -c "import os, vllm; print(os.path.dirname(vllm.__file__))")

                # 1. Hotfix: add kv_quant_mode to MLAAttention.get_kv_cache_spec (vllm#47722)
                # PR #47716 fixed deepseek_v4 and sparse_swa but missed mla_attention.py
                python3 -c "
                p='$VLLM_DIR/model_executor/layers/attention/mla_attention.py'
                s=open(p).read()
                if 'get_kv_quant_mode' not in s:
                  s=s.replace('    MLAAttentionSpec,\n)', '    MLAAttentionSpec,\n    get_kv_quant_mode,\n)')
                  s=s.replace('            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n        )',
                              '            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n            kv_quant_mode=get_kv_quant_mode(vllm_config.cache_config.cache_dtype),\n        )')
                  open(p,'w').write(s); print('PATCHED mla_attention.py')
                else: print('mla_attention.py already patched')
                "

                # 2. Hotfix: fix packed HND KV cache reshape (neuralmagic/vllm@2e10140)
                python3 -c "
                p='$VLLM_DIR/v1/worker/gpu/attn_utils.py'
                s=open(p).read()
                old='            .view(kv_cache_shape)\n        )\n    elif kv_cache_spec.page_size_padded'
                new='            .view(permuted_kv_cache_shape)\n        )\n    elif kv_cache_spec.page_size_padded'
                if old in s:
                  open(p,'w').write(s.replace(old, new)); print('PATCHED attn_utils.py')
                else: print('attn_utils.py already patched or different version')
                "

                # 3. Hotfix: offloading set_ overflow for packed non-uniform KV caches
                # The indexer group's offset+page_size exceeds block_stride in the packed
                # layout. Replace set_() with as_strided() to avoid bounds check failure.
                python3 -c "
                import re
                p='$VLLM_DIR/distributed/kv_transfer/kv_connector/v1/offloading/worker.py'
                s=open(p).read()
                pat = (r'(tensors_per_block\[layer_name\] = \(\n)'
                       r'(\s+)torch\.tensor\(\n'
                       r'\s+\[\],\n'
                       r'\s+dtype=torch\.int8,\n'
                       r'\s+device=layer_kv_cache\.device,\n'
                       r'\s+\)\.set_\(\n'
                       r'\s+layer_kv_cache\.untyped_storage\(\),\n'
                       r'\s+byte_offset,\n'
                       r'\s+\(num_blocks, page\),\n'
                       r'\s+\(block_stride_bytes, 1\),\n'
                       r'\s+\),\n'
                       r'(\s+)\)')
                repl = (r'\1'
                        r'\2torch.as_strided(\n'
                        r'\2    torch.empty(0, dtype=torch.int8, device=layer_kv_cache.device).set_(layer_kv_cache.untyped_storage()),\n'
                        r'\2    (num_blocks, page),\n'
                        r'\2    (block_stride_bytes, 1),\n'
                        r'\2    byte_offset,\n'
                        r'\2),\n'
                        r'\3)')
                new_s, n = re.subn(pat, repl, s)
                if n > 0:
                  open(p,'w').write(new_s); print('PATCHED worker.py')
                else:
                  print('worker.py: no match for set_ pattern')
                "

                # 4. Hotfix: madvise out of bounds when DP>1 + TP=1
                # Each DP rank is a separate vllm process (world_size=1) with its own mmap.
                # TieringOffloadingSpec.create_worker uses the accelerator device index as
                # rank, but with world_size=1 the mmap row only fits 1 worker, so GPU
                # indices >0 overflow. Force rank=0 since each process owns its own mmap.
                python3 -c "
                p='$VLLM_DIR/v1/kv_offload/tiering/spec.py'
                s=open(p).read()
                old='        rank = torch.accelerator.current_device_index()'
                new='        rank = 0  # each DP process has its own mmap; TP-local rank is 0'
                if old in s:
                  open(p,'w').write(s.replace(old, new)); print('PATCHED spec.py (rank=0)')
                else: print('spec.py: pattern not found, may already be patched')
                "

                #################
                # RUN vLLM decode workers via DP Supervisor
                # The supervisor automatically assigns CUDA_VISIBLE_DEVICES and
                # --data-parallel-rank to each child process based on local_rank.
                #################
                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                uv pip install --system nixl==1.3.0 nixl-cu13==1.3.0 --no-deps

                exec vllm serve \
                  zai-org/GLM-5.2-FP8 \
                  --port 8200 \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --data-parallel-multi-port-external-lb \
                  --data-parallel-supervisor-port=8208 \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --max-num-batched-tokens ${MAX_TOKENS} \
                  --max-num-seqs ${MAX_TOKENS} \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank $START_RANK \
                  --kv_transfer_config '{"kv_connector":"NixlConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail"}' \
                  --all2all-backend deepep_low_latency \
                  --moe-backend deep_gemm \
                  --kv-cache-dtype fp8 \
                  --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
                  --max-model-len 256000
                  # To enable tracing, add:
                  # --otlp-traces-endpoint http://otel-collector:4317 \
                  # --collect-detailed-traces all
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              # To enable tracing, uncomment:
              # - name: OTEL_SERVICE_NAME
              #   value: "vllm-decode"
              # - name: OTEL_EXPORTER_OTLP_ENDPOINT
              #   value: "http://otel-collector:4317"
              # - name: OTEL_TRACES_SAMPLER
              #   value: "parentbased_traceidratio"
              # - name: OTEL_TRACES_SAMPLER_ARG
              #   value: "0.1"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: MAX_TOKENS
                value: "256"
              - name: DP_SIZE_LOCAL
                value: "8"
              - name: TP_SIZE
                value: "1"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_SYMMETRIC_SIZE # Prevent NVSHMEM OOM.
                value: "16G"
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              # Use cache directories from the mounted volume under one easy to mount
              # root directory.
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              # HuggingFace is likely to be quite a bit larger, give it its own cache
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface

            ports:
              - containerPort: 8200
                name: vllm-rank0
                protocol: TCP
              - containerPort: 8201
                name: vllm-rank1
                protocol: TCP
              - containerPort: 8202
                name: vllm-rank2
                protocol: TCP
              - containerPort: 8203
                name: vllm-rank3
                protocol: TCP
              - containerPort: 8204
                name: vllm-rank4
                protocol: TCP
              - containerPort: 8205
                name: vllm-rank5
                protocol: TCP
              - containerPort: 8206
                name: vllm-rank6
                protocol: TCP
              - containerPort: 8207
                name: vllm-rank7
                protocol: TCP
              - containerPort: 8208
                name: supervisor
                protocol: TCP

            startupProbe:
              httpGet:
                path: /health
                port: supervisor
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: supervisor
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /readyz
                port: supervisor
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: "8"
              requests:
                cpu: 32
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
