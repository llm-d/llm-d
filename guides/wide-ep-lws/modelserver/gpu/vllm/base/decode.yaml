apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-llm-d-decode
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "wide-ep-lws"
    llm-d.ai/accelerator-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    llm-d.ai/role: decode
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/role: decode
      spec:
        serviceAccountName: glm
        initContainers:
          - name: routing-proxy
            args:
              # sidecar proxy is started with --port 8000, --vllm-port 8200, and --data-parallel-size 8,
              # so it listens on ports in the range [port:port+data-parallel-size-1] and forwards
              # requests each to the corresponding vllm port.
              - --port=8000
              - --vllm-port=8200
              - --data-parallel-size=1
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-proxy=false
              - --enable-prefiller-sampling
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
            imagePullPolicy: Always
            ports:
              - containerPort: 8000
                name: rank0
                protocol: TCP
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi  # roughly 32MB per local DP plus scratch space
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
          - name: profiles
            emptyDir: {}
        containers:
          - name: vllm
            # image: docker.io/vllm/vllm-openai:kimi-k3
            image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:5619fd84968331f6900a86403f23a2866641265a@sha256:7c723236a35c2afab1c135fdbcae7a859fafa3a788eaf51357a6e80010f1c07c
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
              privileged: true
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))
                # Each step proposes 3 MTP drafts plus the verified token, so a full
                # batch of MAX_TOKENS seqs needs 4x the token budget. Keep the
                # multiplier in sync with num_speculative_tokens in --speculative-config.
                MAX_BATCHED_TOKENS=$(( MAX_TOKENS * 4 ))
                export UCX_IB_ROCE_REACHABILITY_MODE=all
                export VLLM_USE_V2_MODEL_RUNNER=1
                export VLLM_SSM_CONV_STATE_LAYOUT=DS
                export VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION=1
                export NCCL_GIN_TYPE=3
                export VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT=1
                export VLLM_DEEPEP_V2_ALLOW_HYBRID_MODE=1
                export VLLM_PREFIX_CACHE_RETENTION_INTERVAL=0

                # --- BEGIN TEMP: install NIXL ----------------------------------------
                uv pip install --system nixl nixl-cu13
                uv pip show nvidia-nccl-cu13
                # --- END TEMP: install NIXL ------------------------------------------

                apt-get update && apt-get install -y infiniband-diags

                apt-get update && apt-get install -y \
                  git \
                  build-essential \
                  cmake \
                  ninja-build \
                  pkg-config \
                  libudev-dev \
                  libnl-3-dev \
                  libnl-route-3-dev
                
                rm -rf /tmp/rdma-core-44

                git clone \
                  --depth 1 \
                  --branch v44.0 \
                  https://github.com/linux-rdma/rdma-core.git \
                  /tmp/rdma-core-44

                git -C /tmp/rdma-core-44 describe --tags --always

                cd /tmp/rdma-core-44

                rm -rf build-install

                cmake -S . -B build-install -GNinja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_INSTALL_PREFIX=/opt/rdma-core-44 \
                  -DCMAKE_INSTALL_LIBDIR=lib \
                  -DNO_MAN_PAGES=1

                cmake --build /tmp/rdma-core-44/build-install \
                  --parallel "$(nproc)"

                cmake --install /tmp/rdma-core-44/build-install
                
                find /opt/rdma-core-44 \
                  \( -name 'libibverbs.so*' -o -name 'libmlx5.so*' \) \
                  -print

                LD_LIBRARY_PATH=/opt/rdma-core-44/lib \
                  /opt/rdma-core-44/bin/ibv_devices

                export LD_LIBRARY_PATH=/opt/rdma-core-44/lib:$LD_LIBRARY_PATH

                exec vllm serve \
                  moonshotai/Kimi-K3 \
                  --port 8200 \
                  --trust-remote-code \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --enable-prefix-caching \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --max-num-batched-tokens ${MAX_BATCHED_TOKENS} \
                  --max-num-seqs ${MAX_TOKENS} \
                  --speculative-config '{"model":"Inferact/Kimi-K3-DSpark","method":"dspark","num_speculative_tokens":1,"attention_backend":"FLASHINFER_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"block"}' \
                  --data-parallel-hybrid-lb \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank $START_RANK \
                  --no-disable-hybrid-kv-cache-manager \
                  --all2all-backend deepep_v2 \
                  --moe-backend auto \
                  --max-cudagraph-capture-size ${MAX_BATCHED_TOKENS} \
                  --max-model-len 300000 \
                  --profiler-config.profiler=torch \
                  --profiler-config.torch_profiler_dir=/profiles \
                  --profiler-config.torch_profiler_with_stack=False \
                  --profiler-config.max_iterations=10 \
                  --profiler-config.ignore_frontend=true \
                  --kv_transfer_config '{"kv_connector":"NixlConnector",
                        "kv_role":"kv_consumer",
                        "kv_load_failure_policy":"fail"}' \
                  --kv-cache-dtype fp8 \
                  --attention-config '{"use_prefill_query_quantization":true,"mla_prefill_backend":"flashinfer"}'

            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              # To enable tracing, uncomment:
              # - name: OTEL_SERVICE_NAME
              #   value: "vllm-decode"
              # - name: OTEL_EXPORTER_OTLP_ENDPOINT
              #   value: "http://otel-collector:4317"
              # - name: OTEL_TRACES_SAMPLER
              #   value: "parentbased_traceidratio"
              # - name: OTEL_TRACES_SAMPLER_ARG
              #   value: "0.1"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: MAX_TOKENS
                value: "64"
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: TP_SIZE
                value: "8"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/local/nvidia/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              # Use cache directories from the mounted volume under one easy to mount
              # root directory.
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              # HuggingFace is likely to be quite a bit larger, give it its own cache
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface

            ports:
              - containerPort: 8200
                name: modelserver
                protocol: TCP

            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: "8"
              requests:
                cpu: 32
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: profiles
                mountPath: /profiles
