apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-llm-d-decode
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "wide-ep-lws"
    llm-d.ai/accelerator-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    llm-d.ai/role: decode
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/role: decode
      spec:
        serviceAccountName: glm
        initContainers:
          - name: routing-proxy
            args:
              # sidecar proxy is started with --port 8000, --vllm-port 8200, and --data-parallel-size 8,
              # so it listens on ports in the range [port:port+data-parallel-size-1] and forwards
              # requests each to the corresponding vllm port.
              - --port=8000
              - --vllm-port=8200
              - --data-parallel-size=1
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-proxy=false
              - --enable-prefiller-sampling
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
            imagePullPolicy: Always
            ports:
              - containerPort: 8000
                name: rank0
                protocol: TCP
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi  # roughly 32MB per local DP plus scratch space
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
          - name: profiles
            emptyDir: {}
        containers:
          - name: vllm
            # image: docker.io/vllm/vllm-openai:kimi-k3
            image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:f8bb1b136dc3dcdd11a984a72bbc0860378b14ec
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))
                export UCX_IB_ROCE_REACHABILITY_MODE=all
                export VLLM_USE_V2_MODEL_RUNNER=1
                export VLLM_SSM_CONV_STATE_LAYOUT=DS
                export VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION=1
                export NCCL_GIN_TYPE=2

                # --- BEGIN TEMP: install NIXL ----------------------------------------
                uv pip install --system nixl nixl-cu13
                uv pip install --system flashinfer-python==0.6.16 nvidia-nccl-cu13==2.30.7
                uv pip install --system flashinfer-jit-cache==0.6.16 --index-url https://flashinfer.ai/whl/cu130
                uv pip install --system flashinfer-cubin==0.6.16 --index-url https://flashinfer.ai/whl
                uv pip install --system "apache-tvm-ffi==0.1.13" --force-reinstall
                uv pip uninstall --system tilelang

                uv pip show nvidia-nccl-cu13
                python3 -c "import tvm_ffi; import flashinfer; print(tvm_ffi.__version__)"
                nm -D /usr/local/lib/python3.12/dist-packages/tvm_ffi/lib/libtvm_ffi.so | grep -q TVMFFIGetCustomAllocator
                # --- END TEMP: install NIXL ------------------------------------------

                # --- BEGIN TEMP PATCH: vllm-project/vllm#50478 ------------------------
                # Backport of the deepep_v2 prepare_finalize hunk only; the image already
                # carries the BLOCK_D=512 half of that PR.
                # Never blocks startup: if the anchor is absent (already fixed upstream,
                # or the code moved) or the rewrite would not compile, it logs and leaves
                # the file untouched. Delete this block once the image includes the fix.
                python3 - <<'PATCH_EOF'
                import re, sys
                from pathlib import Path

                REL = "vllm/model_executor/layers/fused_moe/prepare_finalize/deepep_v2.py"
                MARKER = "PATCH#50478"
                ANCHOR = re.compile(
                    r"^([ \t]*)expert_tokens_meta = mk\.ExpertTokensMetadata\.make_from_list\([ \t]*\n"
                    r"[ \t]*recv_expert_num_tokens,[ \t]*\n"
                    r"[ \t]*device=expert_x\.device,[ \t]*\n"
                    r"[ \t]*\)[ \t]*$",
                    re.M)

                REPLACEMENT = """\
                # PATCH#50478: do_cpu_sync=False (decode/cudagraph mode) skips the
                # device->host sync, so DeepEP returns an empty per-expert count list.
                # Leave the metadata unset rather than wrapping the empty list: a
                # non-None metadata holding zero-element tensors suppresses the
                # consumers' fallback to count_expert_num_tokens(recv_topk_idx) and
                # makes them size their workspaces to zero rows.
                expert_tokens_meta = None
                if recv_expert_num_tokens:
                    expert_tokens_meta = mk.ExpertTokensMetadata.make_from_list(
                        recv_expert_num_tokens,
                        device=expert_x.device,
                    )
                """

                path = next((p for p in (Path(e) / REL for e in sys.path if e) if p.is_file()), None)
                if path is None:
                    print("[PATCH#50478] SKIPPED: %s not found on sys.path" % REL)
                    sys.exit(0)

                src = path.read_text()
                if MARKER in src:
                    print("[PATCH#50478] already patched: %s" % path)
                    sys.exit(0)

                m = ANCHOR.search(src)
                if m is None:
                    print("[PATCH#50478] SKIPPED: anchor not found in %s" % path)
                    sys.exit(0)

                indent = m.group(1)
                block = "\n".join(indent + ln if ln else "" for ln in REPLACEMENT.splitlines())
                patched = src[:m.start()] + block + src[m.end():]
                try:
                    compile(patched, str(path), "exec")
                except SyntaxError as exc:
                    print("[PATCH#50478] SKIPPED: result does not compile: %r" % exc)
                    sys.exit(0)

                path.write_text(patched)
                print("[PATCH#50478] patched %s at line %d"
                      % (path, src[:m.start()].count("\n") + 1))
                PATCH_EOF
                # --- END TEMP PATCH ---------------------------------------------------

                # --- BEGIN TEMP PATCH: neuralmagic/vllm@469882a ----------------------
                # "enable deepep_v2 for sp": deepep_v2 is missing from the all2all
                # backends that opt into sequence-parallel MoE, so --all2all-backend
                # deepep_v2 silently runs the experts on replicated tokens.
                # Never blocks startup: if the anchor is absent (already fixed upstream,
                # or the code moved) or the rewrite would not compile, it logs and leaves
                # the file untouched. Delete this block once the image includes the fix.
                python3 - <<'PATCH_EOF'
                import sys
                from pathlib import Path

                REL = "vllm/config/parallel.py"
                TAG = "PATCH#deepep_v2_sp"
                PROP = "def use_sequence_parallel_moe"
                ANCHOR = '"deepep_low_latency",\n'
                NEW = '"deepep_v2",\n'

                path = next((p for p in (Path(e) / REL for e in sys.path if e) if p.is_file()), None)
                if path is None:
                    print("[%s] SKIPPED: %s not found on sys.path" % (TAG, REL))
                    sys.exit(0)

                src = path.read_text()
                start = src.find(PROP)
                if start < 0:
                    print("[%s] SKIPPED: %s not found in %s" % (TAG, PROP, path))
                    sys.exit(0)

                i = src.find(ANCHOR, start)
                if i < 0:
                    print("[%s] SKIPPED: anchor not found in %s" % (TAG, path))
                    sys.exit(0)

                end = i + len(ANCHOR)
                indent = src[src.rfind("\n", 0, i) + 1:i]
                if indent.strip():
                    print("[%s] SKIPPED: anchor is not at the start of a line" % TAG)
                    sys.exit(0)
                if src[end:].lstrip().startswith('"deepep_v2"'):
                    print("[%s] already patched: %s" % (TAG, path))
                    sys.exit(0)

                patched = src[:end] + indent + NEW + src[end:]
                try:
                    compile(patched, str(path), "exec")
                except SyntaxError as exc:
                    print("[%s] SKIPPED: result does not compile: %r" % (TAG, exc))
                    sys.exit(0)

                path.write_text(patched)
                print("[%s] patched %s at line %d"
                      % (TAG, path, src[:end].count("\n") + 1))
                PATCH_EOF
                # --- END TEMP PATCH ---------------------------------------------------

                exec vllm serve \
                  moonshotai/Kimi-K3 \
                  --port 8200 \
                  --trust-remote-code \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --enable-prefix-caching \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --max-num-batched-tokens ${MAX_TOKENS} \
                  --max-num-seqs ${MAX_TOKENS} \
                  --data-parallel-hybrid-lb \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank $START_RANK \
                  --no-disable-hybrid-kv-cache-manager \
                  --all2all-backend deepep_v2 \
                  --moe-backend auto \
                  --max-cudagraph-capture-size ${MAX_TOKENS} \
                  --max-model-len 300000 \
                  --profiler-config.profiler=torch \
                  --profiler-config.torch_profiler_dir=/profiles \
                  --profiler-config.max_iterations=10 \
                  --profiler-config.ignore_frontend=true \
                  --kv_transfer_config '{"kv_connector":"NixlConnector",
                        "kv_role":"kv_consumer",
                        "kv_load_failure_policy":"fail"}'

            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              # To enable tracing, uncomment:
              # - name: OTEL_SERVICE_NAME
              #   value: "vllm-decode"
              # - name: OTEL_EXPORTER_OTLP_ENDPOINT
              #   value: "http://otel-collector:4317"
              # - name: OTEL_TRACES_SAMPLER
              #   value: "parentbased_traceidratio"
              # - name: OTEL_TRACES_SAMPLER_ARG
              #   value: "0.1"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: MAX_TOKENS
                value: "32"
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: TP_SIZE
                value: "8"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/local/nvidia/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              # Use cache directories from the mounted volume under one easy to mount
              # root directory.
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              # HuggingFace is likely to be quite a bit larger, give it its own cache
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface

            ports:
              - containerPort: 8200
                name: modelserver
                protocol: TCP

            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: "8"
              requests:
                cpu: 32
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: profiles
                mountPath: /profiles
