              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3000"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: TP_SIZE
                value: "8"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/local/nvidia/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              # `init failed for transport: IBGDA` is only the summary line; the
              # reason it failed (device open, DEVX, GPU memory registration, ...)
              # is logged one level down. Subsys deliberately unset so this covers
              # every subsystem at INFO.
              - name: NVSHMEM_DEBUG
                value: INFO
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              # Keep the modern CUDA DMA-BUF registration path enabled. The NVSHMEM
              # build above hard-fails if its IBGDA plugin was compiled without it.
              - name: NVSHMEM_DISABLE_DMABUF
                value: "0"
              # Diagnostic fallback only. Enabling this masks a build without the
              # GPU-resident NIC-buffer DMA-BUF path:
              # - name: NVSHMEM_IBGDA_FORCE_NIC_BUF_MEMTYPE
              #   value: hostmem
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              # Default keep-alive timeout of 5s is shorter than the sidecar's 90s idle conn timeout,
              # causing TCP RSTs.
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              # Use cache directories from the mounted volume under one easy to mount
              # root directory.
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              # HuggingFace is likely to be quite a bit larger, give it its own cache
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
            ports:
              - containerPort: 8000
                name: modelserver
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                ephemeral-storage: 1Ti
                memory: 256Gi
                nvidia.com/gpu: "8"
              requests:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 256Gi
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: profiles
                mountPath: /profiles
