apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-llm-d-prefill
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "wide-ep-lws"
    llm-d.ai/accelerator-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    llm-d.ai/role: prefill
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 1
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/role: prefill
      spec:
        serviceAccountName: glm
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi  # roughly 32MB per local DP plus scratch space
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
        containers:
          - name: vllm
            image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:c1a4225326594a66a58b948ab8da7bccc4dbc214
            # image: ghcr.io/llm-d/llm-d-cuda-dev:sha-728dd1e
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                # Clear /dev/shm on start to prevent running out of space when crashes occur
                # https://github.com/llm-d/llm-d/issues/352
                find /dev/shm -type f -delete

                # ---------------------------------------------------------------
                # Hotfixes for GLM-5.2-FP8 packed FP8 KV cache reshape crash, e.g.
                #   RuntimeError: shape '[256, 64, 576]' is invalid for input of
                #   size 10747904
                # Resolve the vLLM install dir so the patches apply regardless of
                # which image (dist-packages vs site-packages) is in use.
                # ---------------------------------------------------------------
                VLLM_DIR=$(python3 -c "import os, vllm; print(os.path.dirname(vllm.__file__))")

                # 1. Hotfix: add kv_quant_mode to MLAAttention.get_kv_cache_spec (vllm#47722)
                # PR #47716 fixed deepseek_v4 and sparse_swa but missed mla_attention.py
                python3 -c "
                p='$VLLM_DIR/model_executor/layers/attention/mla_attention.py'
                s=open(p).read()
                if 'get_kv_quant_mode' not in s:
                  s=s.replace('    MLAAttentionSpec,\n)', '    MLAAttentionSpec,\n    get_kv_quant_mode,\n)')
                  s=s.replace('            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n        )',
                              '            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n            kv_quant_mode=get_kv_quant_mode(vllm_config.cache_config.cache_dtype),\n        )')
                  open(p,'w').write(s); print('PATCHED mla_attention.py')
                else: print('mla_attention.py already patched')
                "

                # 2. Hotfix: fix packed HND KV cache reshape (neuralmagic/vllm@2e10140)
                python3 -c "
                p='$VLLM_DIR/v1/worker/gpu/attn_utils.py'
                s=open(p).read()
                old='            .view(kv_cache_shape)\n        )\n    elif kv_cache_spec.page_size_padded'
                new='            .view(permuted_kv_cache_shape)\n        )\n    elif kv_cache_spec.page_size_padded'
                if old in s:
                  open(p,'w').write(s.replace(old, new)); print('PATCHED attn_utils.py')
                else: print('attn_utils.py already patched or different version')
                "

                # 3. Hotfix: offloading set_ overflow for packed non-uniform KV caches
                # The indexer group's offset+page_size exceeds block_stride in the packed
                # layout. Replace set_() with as_strided() to avoid bounds check failure.
                python3 -c "
                import re
                p='$VLLM_DIR/distributed/kv_transfer/kv_connector/v1/offloading/worker.py'
                s=open(p).read()
                pat = (r'(tensors_per_block\[layer_name\] = \(\n)'
                       r'(\s+)torch\.tensor\(\n'
                       r'\s+\[\],\n'
                       r'\s+dtype=torch\.int8,\n'
                       r'\s+device=layer_kv_cache\.device,\n'
                       r'\s+\)\.set_\(\n'
                       r'\s+layer_kv_cache\.untyped_storage\(\),\n'
                       r'\s+byte_offset,\n'
                       r'\s+\(num_blocks, page\),\n'
                       r'\s+\(block_stride_bytes, 1\),\n'
                       r'\s+\),\n'
                       r'(\s+)\)')
                repl = (r'\1'
                        r'\2torch.as_strided(\n'
                        r'\2    torch.empty(0, dtype=torch.int8, device=layer_kv_cache.device).set_(layer_kv_cache.untyped_storage()),\n'
                        r'\2    (num_blocks, page),\n'
                        r'\2    (block_stride_bytes, 1),\n'
                        r'\2    byte_offset,\n'
                        r'\2),\n'
                        r'\3)')
                new_s, n = re.subn(pat, repl, s)
                if n > 0:
                  open(p,'w').write(new_s); print('PATCHED worker.py')
                else:
                  print('worker.py: no match for set_ pattern')
                "

                # 4. Hotfix: madvise out of bounds when DP>1 + TP=1
                # Each DP rank is a separate vllm process (world_size=1) with its own mmap.
                # TieringOffloadingSpec.create_worker uses the accelerator device index as
                # rank, but with world_size=1 the mmap row only fits 1 worker, so GPU
                # indices >0 overflow. Force rank=0 since each process owns its own mmap.
                python3 -c "
                p='$VLLM_DIR/v1/kv_offload/tiering/spec.py'
                s=open(p).read()
                old='        rank = torch.accelerator.current_device_index()'
                new='        rank = 0  # each DP process has its own mmap; TP-local rank is 0'
                if old in s:
                  open(p,'w').write(s.replace(old, new)); print('PATCHED spec.py (rank=0)')
                else: print('spec.py: pattern not found, may already be patched')
                "

                #################
                # RUN vLLM prefill workers via DP Supervisor
                # The supervisor automatically assigns CUDA_VISIBLE_DEVICES and
                # --data-parallel-rank to each child process based on local_rank.
                #################
                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                # declare -A NIC_PATHS
                # for ib in /sys/class/infiniband/*; do
                #   NIC_PATHS[$(basename "$ib")]=$(readlink -f "$ib/device")
                # done

                # lcp_len() {
                #   local a="$1" b="$2" i=0
                #   while [ $i -lt ${#a} ] && [ $i -lt ${#b} ] && [ "${a:$i:1}" = "${b:$i:1}" ]; do i=$((i+1)); done
                #   echo $i
                # }

                # MAPPING=""
                # NUM_GPUS=$(nvidia-smi --list-gpus | wc -l)
                # for i in $(seq 0 $((NUM_GPUS-1))); do
                #   GPU_BDF=$(nvidia-smi --query-gpu=pci.bus_id --format=csv,noheader -i "$i" | tr 'A-F' 'a-f' | sed 's/^0000//')
                #   GPU_PATH=$(readlink -f "/sys/bus/pci/devices/${GPU_BDF}")

                #   BEST_NIC=""; BEST_LEN=0
                #   for nic in "${!NIC_PATHS[@]}"; do
                #     L=$(lcp_len "$GPU_PATH" "${NIC_PATHS[$nic]}")
                #     [ "$L" -gt "$BEST_LEN" ] && { BEST_LEN=$L; BEST_NIC=$nic; }
                #   done
                #   [ -n "$BEST_NIC" ] || { echo "FATAL: no NIC left for GPU $i ($GPU_BDF)"; exit 1; }

                #   NIC_BDF=$(basename "${NIC_PATHS[$BEST_NIC]}")
                #   unset "NIC_PATHS[$BEST_NIC]"   # each NIC assigned exactly once -> bijection
                #   echo "GPU $i ($GPU_BDF) -> $BEST_NIC ($NIC_BDF)"
                #   MAPPING+="${GPU_BDF}=${NIC_BDF},"
                # done
                # MAPPING="${MAPPING%,}"

                # export VLLM_GPU_NIC_PCIE_MAPPING="$MAPPING"
                # export VLLM_NIC_SELECTION_VARS="UCX_NET_DEVICES:1,NCCL_IB_HCA,NVSHMEM_HCA_LIST:1"
                # echo "VLLM_GPU_NIC_PCIE_MAPPING=$VLLM_GPU_NIC_PCIE_MAPPING"

                # # sanity: one distinct NIC per GPU
                # N_UNIQUE=$(echo "$MAPPING" | tr ',' '\n' | cut -d= -f2 | sort -u | wc -l)
                # [ "$N_UNIQUE" -eq "$NUM_GPUS" ] || { echo "FATAL: only $N_UNIQUE unique NICs for $NUM_GPUS GPUs"; exit 1; }

                uv pip install --system nixl==1.3.0 nixl-cu13==1.3.0 --no-deps
                uv pip install --system -U transformers

                # --- 1. Verify all 8 RDMA rails are usable: present, ACTIVE, UP, RoCE GID with an IP ---
                NUM_NICS=$(ls -d /sys/class/infiniband/mlx5_* 2>/dev/null | wc -l)
                if [ "$NUM_NICS" -ne 8 ]; then
                  echo "FATAL: expected 8 mlx5 devices, found $NUM_NICS — check GKE network attachments" >&2
                  ls -d /sys/class/infiniband/* >&2 || true
                  exit 1
                fi

                for d in /sys/class/infiniband/mlx5_*; do
                  dev=$(basename "$d")

                  state=$(cat "$d/ports/1/state")
                  if [[ "$state" != *ACTIVE* ]]; then
                    echo "FATAL: $dev port 1 not ACTIVE (state: $state)" >&2
                    exit 1
                  fi

                  netdev=$(ls "$d/device/net" | head -n1)
                  operstate=$(cat "/sys/class/net/$netdev/operstate")
                  if [ "$operstate" != "up" ]; then
                    echo "FATAL: $dev ($netdev) operstate is '$operstate', expected 'up'" >&2
                    exit 1
                  fi

                  # RoCEv2 GID for an IPv4 addr looks like ...:0000:ffff:XXXX:YYYY.
                  # No such GID = no IP on the netdev = UCX silently skips this rail.
                  if ! grep -lq '0000:0000:0000:0000:0000:ffff:' "$d"/ports/1/gids/* 2>/dev/null; then
                    echo "FATAL: $dev has no RoCEv2 IPv4 GID — netdev $netdev likely has no IP address" >&2
                    exit 1
                  fi
                done
                echo "All 8 RDMA rails ACTIVE, UP, and addressed."

                # --- 2. Build GPU_BDF=NIC_BDF mapping, GPU index i -> mlx5_i ---
                MAPPING=""
                while IFS=', ' read -r idx gpu_bdf; do
                  nic_bdf=$(basename "$(readlink -f /sys/class/infiniband/mlx5_${idx}/device)")
                  MAPPING="${MAPPING:+$MAPPING,}${gpu_bdf}=${nic_bdf}"
                done < <(nvidia-smi --query-gpu=index,pci.bus_id --format=csv,noheader | sort -t, -k1 -n)

                # export VLLM_GPU_NIC_PCIE_MAPPING="$MAPPING"
                # export VLLM_NIC_SELECTION_VARS="UCX_NET_DEVICES:1,NCCL_IB_HCA:1"
                # echo "VLLM_GPU_NIC_PCIE_MAPPING=$VLLM_GPU_NIC_PCIE_MAPPING"
                export UCX_IB_GPU_DIRECT_RDMA=yes

                # --- 3. Make sure nothing re-widens the per-rank pinning ---
                unset UCX_NET_DEVICES NCCL_IB_HCA || true


                exec vllm serve \
                  nvidia/GLM-5.2-NVFP4 \
                  --port 8000 \
                  --gpu-memory-utilization 0.8 \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --data-parallel-multi-port-external-lb \
                  --data-parallel-supervisor-port 8008 \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank $START_RANK \
                  --kv_transfer_config '{"kv_connector":"NixlConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail"}' \
                  --all2all-backend flashinfer_nvlink_one_sided \
                  --kv-cache-dtype fp8 \
                  --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
                  --max-model-len 150000
                
                  # To enable tracing, add:
                  # --otlp-traces-endpoint http://otel-collector:4317 \
                  # --collect-detailed-traces all
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              # To enable tracing, uncomment:
              # - name: OTEL_SERVICE_NAME
              #   value: "vllm-prefill"
              # - name: OTEL_EXPORTER_OTLP_ENDPOINT
              #   value: "http://otel-collector:4317"
              # - name: OTEL_TRACES_SAMPLER
              #   value: "parentbased_traceidratio"
              # - name: OTEL_TRACES_SAMPLER_ARG
              #   value: "0.1"
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3000"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "8"
              - name: TP_SIZE
                value: "1"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/local/nvidia/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              # Default keep-alive timeout of 5s is shorter than the sidecar's 90s idle conn timeout,
              # causing TCP RSTs.
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              # Use cache directories from the mounted volume under one easy to mount
              # root directory.
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              # HuggingFace is likely to be quite a bit larger, give it its own cache
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
            ports:
              - containerPort: 8000
                name: rank0
                protocol: TCP
              - containerPort: 8001
                name: rank1
                protocol: TCP
              - containerPort: 8002
                name: rank2
                protocol: TCP
              - containerPort: 8003
                name: rank3
                protocol: TCP
              - containerPort: 8004
                name: rank4
                protocol: TCP
              - containerPort: 8005
                name: rank5
                protocol: TCP
              - containerPort: 8006
                name: rank6
                protocol: TCP
              - containerPort: 8007
                name: rank7
                protocol: TCP
              - containerPort: 8008
                name: supervisor
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: supervisor
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: supervisor
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /readyz
                port: supervisor
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 256Gi
                nvidia.com/gpu: "8"
              requests:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 256Gi
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
