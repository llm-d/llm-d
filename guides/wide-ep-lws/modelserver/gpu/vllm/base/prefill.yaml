apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-llm-d-prefill
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "wide-ep-lws"
    llm-d.ai/accelerator-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    llm-d.ai/role: prefill
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/role: prefill
      spec:
        serviceAccountName: glm
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi  # roughly 32MB per local DP plus scratch space
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
        containers:
          - name: vllm
            # image: docker.io/vllm/vllm-openai:kimi-k3
            image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:f8bb1b136dc3dcdd11a984a72bbc0860378b14ec
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))
                export UCX_IB_ROCE_REACHABILITY_MODE=all
                export VLLM_SSM_CONV_STATE_LAYOUT=DS
                export VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION=1
                export NCCL_GIN_TYPE=2

                # --- BEGIN TEMP: install NIXL ----------------------------------------
                uv pip install --system nixl nixl-cu13
                # --- END TEMP: install NIXL ------------------------------------------

                # --- BEGIN TEMP PATCH: neuralmagic/vllm@469882a ----------------------
                # "enable deepep_v2 for sp": deepep_v2 is missing from the all2all
                # backends that opt into sequence-parallel MoE, so --all2all-backend
                # deepep_v2 silently runs the experts on replicated tokens.
                # Never blocks startup: if the anchor is absent (already fixed upstream,
                # or the code moved) or the rewrite would not compile, it logs and leaves
                # the file untouched. Delete this block once the image includes the fix.
                python3 - <<'PATCH_EOF'
                import sys
                from pathlib import Path

                REL = "vllm/config/parallel.py"
                TAG = "PATCH#deepep_v2_sp"
                PROP = "def use_sequence_parallel_moe"
                ANCHOR = '"deepep_low_latency",\n'
                NEW = '"deepep_v2",\n'

                path = next((p for p in (Path(e) / REL for e in sys.path if e) if p.is_file()), None)
                if path is None:
                    print("[%s] SKIPPED: %s not found on sys.path" % (TAG, REL))
                    sys.exit(0)

                src = path.read_text()
                start = src.find(PROP)
                if start < 0:
                    print("[%s] SKIPPED: %s not found in %s" % (TAG, PROP, path))
                    sys.exit(0)

                i = src.find(ANCHOR, start)
                if i < 0:
                    print("[%s] SKIPPED: anchor not found in %s" % (TAG, path))
                    sys.exit(0)

                end = i + len(ANCHOR)
                indent = src[src.rfind("\n", 0, i) + 1:i]
                if indent.strip():
                    print("[%s] SKIPPED: anchor is not at the start of a line" % TAG)
                    sys.exit(0)
                if src[end:].lstrip().startswith('"deepep_v2"'):
                    print("[%s] already patched: %s" % (TAG, path))
                    sys.exit(0)

                patched = src[:end] + indent + NEW + src[end:]
                try:
                    compile(patched, str(path), "exec")
                except SyntaxError as exc:
                    print("[%s] SKIPPED: result does not compile: %r" % (TAG, exc))
                    sys.exit(0)

                path.write_text(patched)
                print("[%s] patched %s at line %d"
                      % (TAG, path, src[:end].count("\n") + 1))
                PATCH_EOF
                # --- END TEMP PATCH ---------------------------------------------------

                exec vllm serve \
                  moonshotai/Kimi-K3 \
                  --port 8000 \
                  --trust-remote-code \
                  --gpu-memory-utilization 0.9 \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --max-num-batched-tokens 1024 \
                  --max-num-seqs 8 \
                  --enable-prefix-caching \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --data-parallel-hybrid-lb \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank $START_RANK \
                  --no-disable-hybrid-kv-cache-manager \
                  --all2all-backend deepep_v2 \
                  --moe-backend deep_gemm \
                  --enforce-eager \
                  --max-model-len 300000 \
                  --kv_transfer_config '{"kv_connector":"NixlConnector",
                        "kv_role":"kv_both",
                        "kv_load_failure_policy":"fail"}'

            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              # To enable tracing, uncomment:
              # - name: OTEL_SERVICE_NAME
              #   value: "vllm-prefill"
              # - name: OTEL_EXPORTER_OTLP_ENDPOINT
              #   value: "http://otel-collector:4317"
              # - name: OTEL_TRACES_SAMPLER
              #   value: "parentbased_traceidratio"
              # - name: OTEL_TRACES_SAMPLER_ARG
              #   value: "0.1"
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3000"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: TP_SIZE
                value: "8"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/local/nvidia/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              # Default keep-alive timeout of 5s is shorter than the sidecar's 90s idle conn timeout,
              # causing TCP RSTs.
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              # Use cache directories from the mounted volume under one easy to mount
              # root directory.
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              # HuggingFace is likely to be quite a bit larger, give it its own cache
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
            ports:
              - containerPort: 8000
                name: modelserver
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                ephemeral-storage: 1Ti
                memory: 256Gi
                nvidia.com/gpu: "8"
              requests:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 256Gi
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
