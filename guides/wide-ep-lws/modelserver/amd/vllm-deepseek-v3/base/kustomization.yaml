apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - decode.yaml
  - prefill.yaml
  - serviceAccount.yaml

components:
  - ../../../../../recipes/modelserver/components/images/amd-vllm/llm-d
  - ../../../../../recipes/modelserver/components/images/routing-sidecar/nightly

# TODO(#NNNN): Drop these overrides once MoRI-enabled ROCm vLLM and the PR #2816
# sidecar are published under ghcr.io/llm-d.
images:
  - name: ghcr.io/llm-d/llm-d-rocm
    newName: ghcr.io/vcave/rocm/llm-d/vllm
    newTag: wide-ep-v0.2.0
  - name: ghcr.io/llm-d/llm-d-router-disagg-sidecar
    newName: ghcr.io/vcave/rocm/llm-d/llm-d-router-disagg-sidecar
    newTag: wide-ep-v0.1.0

labels:
  - pairs:
      llm-d.ai/model: DeepSeek-V3
      llm-d.ai/guide: wide-ep-lws
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: amd
      llm-d.ai/engine-type: vllm
      llm-d.ai/kv-connector: moriio
    includeSelectors: true
    includeTemplates: true
    fields:
      - version: v1
        kind: ServiceAccount
        path: metadata/labels
        create: true
      - group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
        path: metadata/labels
        create: true
      - group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
        path: spec/leaderWorkerTemplate/workerTemplate/metadata/labels
        create: true
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: metadata/labels
        create: true
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: spec/selector/matchLabels
        create: true
