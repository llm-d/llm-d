apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-amd-gpu-vllm-deepseek-v3-decode
  labels:
    llm-d.ai/model: DeepSeek-V3
    llm-d.ai/role: decode
spec:
  replicas: 1
  leaderWorkerTemplate:
    # restartPolicy stays RecreateGroupOnPodRestart: the sidecar resolves peer IPs once, so a pod that
    # returns with a new IP has to take the group with it or its peers keep writing to a dead address.
    size: 2
    workerTemplate:
      metadata:
        # No `k8s.v1.cni.cncf.io/networks` annotation here on purpose; see prefill.yaml for why.
        # The provider overlay attaches one NAD per rail as net1..net8.
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "amd"
          llm-d.ai/model: DeepSeek-V3
          llm-d.ai/role: decode
      spec:
        serviceAccountName: deepseek-v3-moriio
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    llm-d.ai/guide: "wide-ep-lws"
                    llm-d.ai/model: DeepSeek-V3
        initContainers:
          # routing-proxy resolves its peers once and exits fatally on the first name that is missing,
          # so hold it until DNS has them all. getent is the only resolver in the engine image.
          - name: wait-peer-dns
            image: REPLACE_MODEL_SERVER_IMAGE
            imagePullPolicy: IfNotPresent
            command:
              - /bin/bash
              - -c
              - |-
                # One success proves nothing: CoreDNS runs several replicas and caches denials for 30 s,
                # so a name can resolve here and still NXDOMAIN for the proxy. Require 35 s unbroken.
                ok=0
                while (( SECONDS < 360 )); do
                  missing=
                  for h in ${MORIIO_REMOTE_HOSTS//,/ } ${MORIIO_DECODE_HOSTS//,/ }; do
                    getent hosts "$h" > /dev/null || missing="$missing $h"
                  done
                  if [[ -z $missing ]]; then
                    (( ++ok >= 8 )) && exit 0
                  else
                    ok=0
                  fi
                  sleep 5
                done
                echo "peer DNS unstable after ${SECONDS}s, last missing:$missing" >&2
                exit 1
            env:
              - &pod_namespace
                name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              # One host per pod, ordered leader-then-worker: entry i must own global DP ranks [i*8, (i+1)*8).
              - &moriio_remote_hosts
                name: MORIIO_REMOTE_HOSTS
                value: wide-ep-lws-amd-gpu-vllm-deepseek-v3-prefill-0.wide-ep-lws-amd-gpu-vllm-deepseek-v3-prefill.$(POD_NAMESPACE).svc.cluster.local,wide-ep-lws-amd-gpu-vllm-deepseek-v3-prefill-0-1.wide-ep-lws-amd-gpu-vllm-deepseek-v3-prefill.$(POD_NAMESPACE).svc.cluster.local
              - &moriio_decode_hosts
                name: MORIIO_DECODE_HOSTS
                value: wide-ep-lws-amd-gpu-vllm-deepseek-v3-decode-0.wide-ep-lws-amd-gpu-vllm-deepseek-v3-decode.$(POD_NAMESPACE).svc.cluster.local,wide-ep-lws-amd-gpu-vllm-deepseek-v3-decode-0-1.wide-ep-lws-amd-gpu-vllm-deepseek-v3-decode.$(POD_NAMESPACE).svc.cluster.local
            resources: {}
          # The sidecar fronts 8000 (the port the InferencePool targets) and vLLM moves to 8200.
          - name: routing-proxy
            image: REPLACE_ROUTING_SIDECAR_IMAGE
            imagePullPolicy: IfNotPresent
            restartPolicy: Always
            args:
              - --port=8000
              - --model-server-port=8200
              - --kv-connector=nixlv2
              # Must agree with read_mode=false in both --kv-transfer-config blocks.
              - --moriio-write-mode
              - --moriio-dp-size=16
              - --moriio-dp-size-local=8
              - --moriio-tp-size=1
              - --moriio-parallel-dispatch
              - --moriio-local-pod-ip=$(POD_IP)
              - --moriio-remote-hosts=$(MORIIO_REMOTE_HOSTS)
              - --moriio-decode-hosts=$(MORIIO_DECODE_HOSTS)
              - --metrics-port=9095
              - --zap-log-level=1
              - --secure-proxy=false
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - *pod_namespace
              - *moriio_remote_hosts
              - *moriio_decode_hosts
            ports:
              - containerPort: 8000
                name: sidecar
                protocol: TCP
              - containerPort: 9095
                name: sc-metrics
                protocol: TCP
            resources: {}
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
          - name: jit-cache
            emptyDir: {}
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-pvc
        containers:
          - name: vllm
            image: REPLACE_MODEL_SERVER_IMAGE
            imagePullPolicy: IfNotPresent
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            command:
              - /bin/bash
              - -c
            args:
              - |-
                # Clear /dev/shm on start to prevent running out of space when crashes occur https://github.com/llm-d/llm-d/issues/352
                find /dev/shm -type f -delete

                # RUN vLLM DeepSeek-V3 decode (MoRI-EP low latency)
                START_RANK=$(( ${LWS_WORKER_INDEX} * DP_SIZE_LOCAL ))

                # Benchmark CI reads the model name off the one bare continuation line: keep it off the exec line.
                exec vllm serve \
                  deepseek-ai/DeepSeek-V3 \
                  --port 8200 \
                  --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                  --api-server-count 8 \
                  --data-parallel-hybrid-lb \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 29560 \
                  --data-parallel-start-rank $START_RANK \
                  --all2all-backend mori_low_latency \
                  --block-size 16 \
                  --gpu-memory-utilization 0.58 \
                  --max-model-len 32768 \
                  --no-enable-prefix-caching \
                  --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
                  --kv-transfer-config '{"kv_connector":"MoRIIOConnector",
                                          "kv_role":"kv_consumer",
                                          "kv_connector_extra_config":{"http_port":"8200",
                                                                       "handshake_port":"6301",
                                                                       "notify_port":"61005",
                                                                       "read_mode":"false"}}'
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: DP_SIZE_LOCAL
                value: "8"
              - name: TP_SIZE
                value: "1"
              - name: HF_HOME
                value: /model-cache
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              # Must exceed the sidecar's 90 s idle timeout, or pooled connections are reset mid-request.
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"

              # MoRI-EP: must stay identical to prefill.yaml, which carries the per-variable notes
              # and lists the fabric- and NIC-specific settings that both roles leave to the
              # provider overlay. Set them for both roles or neither.
              - name: MORI_SHMEM_HEAP_SIZE
                value: "17179869184"
              - name: MORI_DISABLE_TOPO
                value: "1"

              # vLLM / ROCm: must stay identical to prefill.yaml.
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "7200"
              - name: VLLM_ROCM_USE_AITER
                value: "1"
              - name: VLLM_ROCM_USE_AITER_MOE
                value: "1"
              - name: VLLM_ROCM_USE_AITER_MLA
                value: "1"
              - name: VLLM_ROCM_USE_AITER_RMSNORM
                value: "1"
              # Deliberately off: AITER's tuned_gemm has no loadable gfx950 binary for large-M unquantized GEMMs.
              - name: VLLM_ROCM_USE_AITER_LINEAR
                value: "0"
              # Deliberately off: Inductor's static launcher kills the engine on the first real request, not at startup.
              - name: TORCHINDUCTOR_USE_STATIC_CUDA_LAUNCHER
                value: "0"
              # The base image sets 0, forcing ROCr's legacy InterceptQueue: it stages a 16384-entry AQL ring
              # through a hardcoded 256-entry buffer, so a burst past 256 corrupts the heap and segfaults every
              # rank. 1 is the upstream default; never set it empty, which aborts at HSA init. Fixed by
              # ROCm/rocm-systems#4066.
              - name: ROCPROFILER_QUEUE_INTERPOSITION
                value: "1"
              - name: HSA_ENABLE_SDMA
                value: "1"
              - name: HSA_FORCE_FINE_GRAIN_PCIE
                value: "1"
              - name: NCCL_IB_DISABLE
                value: "1"
              # Redundant but kept as a guard; see prefill.yaml. The rails carry no IPv4, so RCCL
              # and Gloo would select eth0 unaided.
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_DEBUG
                value: WARN
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
            ports:
              - containerPort: 8200
                name: modelserver
                protocol: TCP
              - containerPort: 29560
                name: dp-rpc
                protocol: TCP
              - containerPort: 6301
                name: mori-handshake
                protocol: TCP
              - containerPort: 61005
                name: mori-notify
                protocol: TCP
            resources:
              limits:
                cpu: "160"
                memory: 1200Gi
                amd.com/gpu: "8"
                amd.com/vnic: "8"
              requests:
                cpu: "160"
                memory: 1200Gi
                amd.com/gpu: "8"
                amd.com/vnic: "8"
            # 60 s + 240 x 30 s = 7260 s; the CI standup_timeout must not be tighter.
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 240
            # LWS recreates the whole group on one liveness failure, costing a 2 h standup.
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 6
            # /health, not /v1/models: the latter is a static route that answers even after the engine
            # core dies, so a dead pod would stay a ready InferencePool endpoint and absorb traffic.
            readinessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 12
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: model-cache
                mountPath: /model-cache
