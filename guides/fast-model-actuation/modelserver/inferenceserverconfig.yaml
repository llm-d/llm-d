apiVersion: fma.llm-d.ai/v1alpha1
kind: InferenceServerConfig
metadata:
  name: fma-isc
spec:
  # TCP-proxy style (FMA #831): ports come from the LauncherConfig pool and
  # routing labels live on the requester Pod -- not here.
  modelServerConfig:
    options: "--model Qwen/Qwen3-0.6B --enable-sleep-mode --gpu-memory-utilization 0.9"
    env_vars:
      VLLM_LOGGING_LEVEL: "INFO"
      HF_HOME: "/tmp/hf_cache"
  launcherConfigName: "fma-launcher"
