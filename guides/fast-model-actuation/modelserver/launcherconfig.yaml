apiVersion: fma.llm-d.ai/v1alpha1
kind: LauncherConfig
metadata:
  name: fma-launcher
spec:
  maxInstances: 2
  # FMA 0.7.x CRDs also define an optional `inferencePorts` field: the pool of
  # ports for inference-engine instances in each launcher pod. It is
  # deliberately unset -- the dual-pods controller does not consume it yet
  # (llm-d-incubation/llm-d-fast-model-actuation#779), and upstream guidance is
  # to leave it empty until producers and consumers are updated together.
  # Instance ports currently come from the InferenceServerConfig.
  podTemplate:
    spec:
      # Run launcher pods as the fma-launcher SA (rbac/role.yaml) so the
      # state-change-reflector sidecar can patch its own pod's serving-state
      # annotation.
      serviceAccountName: fma-launcher
      runtimeClassName: nvidia
      containers:
        - name: inference-server
          # Keep this tag in sync with FMA_VERSION in guide.yaml / the guide env.
          image: ghcr.io/llm-d-incubation/llm-d-fast-model-actuation/launcher:v0.7.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              python3 launcher.py \
              --host 0.0.0.0 \
              --port 8001 \
              --log-level info
          env:
            - name: HOME
              value: "/tmp"
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
