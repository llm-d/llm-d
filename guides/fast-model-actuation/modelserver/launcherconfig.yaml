apiVersion: fma.llm-d.ai/v1alpha1
kind: LauncherConfig
metadata:
  name: fma-launcher
spec:
  # One instance on the single pool port 8000: routing consumers
  # (InferencePool targetPorts, fallback service, probes) address a fixed
  # port, and 0.8.0 sleeping instances retain theirs
  # (llm-d-incubation/llm-d-fast-model-actuation#809), so extra instances
  # could serve on ports nothing routes to (8001 is the launcher service
  # port, forbidden in the pool). Relax once consumers learn assigned ports.
  maxInstances: 1
  inferencePorts: [8000]
  podTemplate:
    spec:
      # Run launcher pods as the fma-launcher SA (rbac/role.yaml) so the
      # state-change-reflector sidecar can patch its own pod's serving-state
      # annotation.
      serviceAccountName: fma-launcher
      runtimeClassName: nvidia
      containers:
        - name: inference-server
          # Keep this tag in sync with FMA_VERSION in guide.yaml / the guide env.
          image: ghcr.io/llm-d-incubation/llm-d-fast-model-actuation/launcher:v0.8.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              python3 launcher.py \
              --host 0.0.0.0 \
              --port 8001 \
              --log-level info
          env:
            - name: HOME
              value: "/tmp"
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
