## fast-model-actuation-keda guide overrides for the llm-d router.
## Layer on top of: recipes/router/base.values.yaml
##
## Same as the fast-model-actuation router values, but the EPP has the
## `flowControl` feature gate enabled so it emits the flow-control metrics.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "fast-model-actuation-keda-plugins.yaml"
    pluginsCustomConfig:
      fast-model-actuation-keda-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        featureGates:
          - flowControl
        flowControl:
          defaultRequestTTL: "60s"
          noEndpointRequestTTL: "300s"   # cover the cold start from zero
        plugins:
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: prefix-cache-scorer
          - type: no-hit-lru-scorer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: queue-scorer
                weight: 2
              - pluginRef: kv-cache-utilization-scorer
                weight: 2
              - pluginRef: prefix-cache-scorer
                weight: 3
              - pluginRef: no-hit-lru-scorer
                weight: 2

  modelServers:
    # The EPP selects requesters, serving via the FMA TCP proxy on 8000
    # (FMA #831; the requester runs with --proxy-port=8000). Keep
    # llm-d.ai/model in sync with the requester Pod template.
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "fast-model-actuation-keda"
      llm-d.ai/model: "qwen3-0.6b"
