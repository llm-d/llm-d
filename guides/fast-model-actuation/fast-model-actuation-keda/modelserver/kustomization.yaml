apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../modelserver

patches:
  # No InferenceServerConfig patch: routing labels live on the requester Pod
  # template (TCP-proxy style, FMA #831), and the base template's
  # llm-d.ai/model label carries over.
  # Start at 1 replica, the ScaledObject floor at standup -- NOT 0. The EPP emits
  # llm_d_epp_flow_control_queue_size only once it has a ready backend endpoint.
  # Otherwise the series does not exist and KEDA's query returns empty, which the
  # Prometheus scaler reads as 0 rather than an error (ignoreNullValues defaults to
  # true), so the pool has no way to leave zero.
  #
  # KEDA scales this to 0 after cooldownPeriod once idle; the verification step
  # waits for that, then exercises scale-from-zero.
  - target:
      kind: Deployment
      name: fma-requester
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fma-requester
        labels:
          llm-d.ai/guide: fast-model-actuation-keda
      spec:
        replicas: 1
        template:
          metadata:
            labels:
              llm-d.ai/guide: fast-model-actuation-keda
