## fast-model-actuation guide overrides for the llm-d router.
## Layer on top of: recipes/router/base.values.yaml

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "fast-model-actuation-plugins.yaml"
    pluginsCustomConfig:
      fast-model-actuation-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 1
          - pluginRef: kv-cache-utilization-scorer
            weight: 1

  modelServers:
    # The EPP selects requesters, serving via the FMA TCP proxy on 8000
    # (FMA #831; the requester runs with --proxy-port=8000). Keep
    # llm-d.ai/model in sync with the requester Pod template.
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "fast-model-actuation"
      llm-d.ai/model: "qwen3-0.6b"
