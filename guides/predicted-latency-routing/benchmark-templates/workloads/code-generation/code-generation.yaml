load:
  type: concurrent
  num_workers: 6
  request_timeout: 300.0
  stages:
    - num_requests: ${MAX_REQUESTS}
      concurrency_level: ${CONC}

api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: ${MODEL_NAME}
  base_url: ${BASE_URL}
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: ${MODEL_NAME}
metrics:
  type: default
report:
  request_lifecycle:
    summary: true
    per_stage: true
storage:
  local_storage:
    path: /tmp/reports
    report_file_prefix: ${REPORT_PREFIX}
data:
  type: conversation_replay
  conversation_replay:
    seed: ${SEED}
    num_conversations: ${NUM_CONVERSATIONS}
    shared_system_prompt_len: 3000
    dynamic_system_prompt_len:
      type: uniform
      min: 15000
      max: 100000
      mean: 55000
      std_dev: 25000
    turns_per_conversation:
      type: normal
      min: 2
      max: 20
      mean: 6
      std_dev: 3.5
    input_tokens_per_turn:
      type: lognormal
      min: 100
      max: 10000
      mean: 1500
      std_dev: 1200
    output_tokens_per_turn:
      type: lognormal
      min: 50
      max: 4000
      mean: 800
      std_dev: 600
    tool_call_latency_sec:
      type: normal
      min: 0
      max: 0
      mean: 0
      std_dev: 0
