apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf-${SUFFIX}
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: inference-perf
          image: quay.io/inference-perf/inference-perf:v0.5.0
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args: ["/workspace/.venv/bin/inference-perf --config_file /etc/config/config.yml"]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
            - name: results-volume
              mountPath: /tmp/reports
      restartPolicy: Never
      volumes:
        - name: config-volume
          configMap:
            name: inference-perf-config-${SUFFIX}
        - name: results-volume
          persistentVolumeClaim:
            claimName: ${PVC_NAME}
