apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The optimized-baseline AMD model server (Qwen3-32B, TP=2) with the long-context
# patch below. The latency predictor is EPP-side only, so the model server needs
# no predictor-specific changes.
resources:
  - ../../../../../optimized-baseline/modelserver/amd/vllm/base

labels:
  - pairs:
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: amd
    includeSelectors: true
    includeTemplates: true

patches:
  - path: patch-vllm.yaml
