apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Activates pod-discovery mode for the precise-prefix-cache-aware guide.
#
# Overrides the KV_EVENTS_ENDPOINT env var so vLLM PUBs bind per-pod
# (tcp://*:5557) and exposes the ZMQ port so the scheduler can dial each pod.
# Pair with scheduler/features/pod-discovery.values.yaml on the scheduler
# side.
patches:
  - path: patch-vllm-kv-events.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: decode
