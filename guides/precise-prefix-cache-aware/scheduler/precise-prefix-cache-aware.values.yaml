## precise-prefix-cache-aware guide overrides for the router.
## Layer on top of: recipes/scheduler/base.values.yaml
##
## Pod-discovery mode with active-active HA (replicas: 2). Each replica dials
## every vLLM pod's per-pod ZMQ socket; both indexes converge identically.
## Scale to a single replica with --set inferenceExtension.replicas=1.

inferenceExtension:
  image:
    # Local-build of refactor-precise-prefix-cache-split — set hub/tag to
    # whatever was pushed. Switch back to ghcr.io/llm-d:v0.8.x once the
    # split scorer ships upstream.
    name: llm-d-inference-scheduler
    hub: ghcr.io/llm-d
    tag: dev
    pullPolicy: IfNotPresent

  replicas: 2

  flags:
    # The chart auto-adds `--ha-enable-leader-election` when replicas > 1,
    # which makes only the leader's readiness probe pass — collapsing to
    # active-passive. Embedding `=false` into the key forces the single-arg
    # form (pflag won't parse `--key value` as a bool); pflag honors
    # last-occurrence wins. No-op when replicas=1.
    ha-enable-leader-election=false: ""

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: llm-d-hf-token
          key: HF_TOKEN

  # vLLM render sidecar is appended via patches/vllm-renderer
  # post-renderer (chart's sidecar.* slot is owned by Envoy).

  pluginsConfigFile: "precise-prefix-cache-aware-plugins.yaml"
  pluginsCustomConfig:
    precise-prefix-cache-aware-plugins.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
        - type: token-producer
          parameters:
            modelName: Qwen/Qwen3-32B
            vllm:
              http: http://localhost:8000
        - type: endpoint-notification-source
        - type: metrics-data-source
        - type: core-metrics-extractor
        - type: single-profile-handler
        - type: decode-filter
        - type: precise-prefix-cache-producer
          parameters:
            tokenProcessorConfig:
              blockSize: 64                 # no longer needs to match the model-server's block size
            speculativeIndexing: false
            indexerConfig:
              kvBlockIndexConfig:
                enableMetrics: true
            kvEventsConfig:
              topicFilter: "kv@"
              concurrency: 8
              discoverPods: true
              podDiscoveryConfig:
                socketPort: 5556
        - type: precise-prefix-cache-scorer
        - type: kv-cache-utilization-scorer
        - type: queue-scorer
        - type: no-hit-lru-scorer
        - type: max-score-picker
      dataLayer:
        sources:
          - pluginRef: metrics-data-source
            extractors:
              - pluginRef: core-metrics-extractor
          - pluginRef: endpoint-notification-source
            extractors:
              - pluginRef: precise-prefix-cache-producer
      schedulingProfiles:
        - name: default
          plugins:
            - pluginRef: decode-filter
            - pluginRef: kv-cache-utilization-scorer
              weight: 2.0
            - pluginRef: queue-scorer
              weight: 2.0
            - pluginRef: precise-prefix-cache-scorer
              weight: 3.0
            - pluginRef: no-hit-lru-scorer
              weight: 2.0
            - pluginRef: max-score-picker

inferencePool:
  targetPorts:
    - number: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/guide: "precise-prefix-cache-aware"
