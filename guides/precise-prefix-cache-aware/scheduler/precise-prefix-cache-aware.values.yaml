## precise-prefix-cache-aware guide overrides for the scheduler.
## Layer on top of: recipes/scheduler/base.values.yaml
##
## Default mode: central ZMQ — the scheduler SUB binds tcp://*:5557 and vLLM
## PUBs connect to the EPP service. Single scheduler replica. See
## features/pod-discovery.values.yaml to switch to per-pod discovery (required
## for active-active multi-replica schedulers).

inferenceExtension:
  # First release carrying llm-d/llm-d-inference-scheduler#862 (EndpointExtractor
  # via data-layer endpoint-notification-source). Swap to GA tag once promoted.
  image:
    name: llm-d-inference-scheduler
    hub: ghcr.io/llm-d
    tag: v0.8.0-rc.1
    pullPolicy: IfNotPresent
  flags:
    v: 4

  # Expose the ZMQ port for KV-events ingress. In central mode the scheduler
  # listens here; vLLM connects via its --kv-events-config endpoint.
  extraContainerPorts:
    - name: zmq
      containerPort: 5557
      protocol: TCP
  extraServicePorts:
    - name: zmq
      port: 5557
      targetPort: 5557
      protocol: TCP

  # HF_TOKEN flows through to the UDS tokenizer sidecar via the shared
  # /tokenizers HF_HOME so gated tokenizers can be downloaded. Public
  # models (Qwen/Qwen3-32B) don't strictly need it, but keeping the secret
  # reference means the sidecar Just Works if you swap in a gated model.
  env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: llm-d-hf-token
          key: HF_TOKEN

  # UDS tokenizer sidecar. The EPP container talks to it over the shared
  # /tmp/tokenizer Unix socket so tokenization runs out-of-process and the
  # tokenizer model/cache is a concern of the sidecar alone.
  sidecar:
    enabled: true
    image: ghcr.io/llm-d/llm-d-uds-tokenizer:v0.7.1
    imagePullPolicy: IfNotPresent
    name: tokenizer-uds
    configMap:
      name: tokenizer-uds-config
      data:
        placeholder: ""
    env:
      - name: TOKENIZERS_DIR
        value: /tokenizers
      - name: HF_HOME
        value: /tokenizers
    volumeMounts:
      - mountPath: /tokenizers
        name: tokenizers
      - mountPath: /tmp/tokenizer
        name: tokenizer-uds
  volumes:
    - name: tokenizers
      emptyDir: {}
    - name: tokenizer-uds
      emptyDir: {}
  volumeMounts:
    - mountPath: /tmp/tokenizer
      name: tokenizer-uds

  pluginsConfigFile: "precise-prefix-cache-aware-plugins.yaml"
  pluginsCustomConfig:
    precise-prefix-cache-aware-plugins.yaml: |
      # Central ZMQ mode. The scorer's SubscriberManager binds tcp://*:5557
      # via zmqEndpoint and vLLM PUBs connect into the EPP service. With
      # discoverPods: false there is no per-pod subscriber churn; the
      # data-layer endpoint-notification-source is therefore not wired.
      #
      # modelName is tied to the deployed vLLM model. Override this (and the
      # matching field in your modelserver overlay) if you deploy something
      # other than Qwen/Qwen3-32B.
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
        - type: tokenizer
          parameters:
            modelName: Qwen/Qwen3-32B
            udsTokenizerConfig:
              socketFile: /tmp/tokenizer/tokenizer-uds.socket
        - type: single-profile-handler
        - type: decode-filter
        - type: precise-prefix-cache-scorer
          parameters:
            tokenProcessorConfig:
              blockSize: 64           # must match vLLM --block-size
              hashSeed: "42"          # must match vLLM PYTHONHASHSEED env var
            indexerConfig:
              tokenizersPoolConfig:
                modelName: Qwen/Qwen3-32B
                uds:
                  socketFile: /tmp/tokenizer/tokenizer-uds.socket
              kvBlockIndexConfig:
                enableMetrics: true
            kvEventsConfig:
              topicFilter: "kv@"
              concurrency: 4
              discoverPods: false
              zmqEndpoint: "tcp://*:5557"
        - type: kv-cache-utilization-scorer
        - type: queue-scorer
        - type: max-score-picker
      schedulingProfiles:
        - name: default
          plugins:
            - pluginRef: decode-filter
            - pluginRef: tokenizer
            - pluginRef: precise-prefix-cache-scorer
              weight: 2.0
            - pluginRef: kv-cache-utilization-scorer
              weight: 1.0
            - pluginRef: queue-scorer
              weight: 1.0
            - pluginRef: max-score-picker

inferencePool:
  targetPorts:
    - number: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/guide: "precise-prefix-cache-aware"
