# Strategic merge patch: production-grade resources on the EPP
# container. The standalone chart at v1.5.0 doesn't expose EPP resources
# via values; without this patch the container runs in BestEffort QoS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder-overridden-by-target-selector
spec:
  template:
    spec:
      containers:
        - name: epp
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
