apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Post-renderer overlay applied on top of the standalone chart's rendered
# output. Adds the UDS tokenizer sidecar and sets production-grade
# resources on the EPP container (chart at v1.5.0 doesn't expose them
# via values, leaving the EPP in BestEffort QoS).
# Invoked by post-renderer.sh from `helm install --post-renderer`.

resources:
  - rendered.yaml

patches:
  # Match by Kind only — the chart emits a single Deployment per release,
  # so patches apply regardless of the user's release name.
  - path: patch-uds-sidecar.yaml
    target:
      kind: Deployment
  - path: patch-epp-resources.yaml
    target:
      kind: Deployment
