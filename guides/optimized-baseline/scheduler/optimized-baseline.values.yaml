## optimized-baseline guide overrides for the llm-d router.
## Layer on top of: recipes/scheduler/base.values.yaml

inferenceExtension:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081
  ## Standalone Envoy sidecar args — pin worker threads to match the CPU
  ## limit (chart default would spawn ~hardware_concurrency() threads) and
  ## drop the chart's default `--log-level trace`.
  sidecar:
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "8"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
  pluginsConfigFile: "optimized-baseline-plugins.yaml"
  pluginsCustomConfig:
    optimized-baseline-plugins.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      - type: prefix-cache-scorer
      - type: no-hit-lru-scorer
      schedulingProfiles:
      - name: default
        plugins:
        - pluginRef: queue-scorer
          weight: 2
        - pluginRef: kv-cache-utilization-scorer
          weight: 2
        - pluginRef: prefix-cache-scorer
          weight: 3
        - pluginRef: no-hit-lru-scorer
          weight: 2

inferencePool:
  modelServers:
    matchLabels:
      llm-d.ai/guide: "optimized-baseline"
