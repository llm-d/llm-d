## optimized-baseline guide overrides for the llm-d router.
## Layer on top of: recipes/scheduler/base.values.yaml

inferenceExtension:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081
  ## Production-grade EPP container resources. Lifts the EPP into Burstable
  ## QoS — the chart's default leaves resources empty (BestEffort).
  resources:
    requests:
      cpu: 4
      memory: 8Gi
    limits:
      memory: 16Gi
  ## Standalone-mode Envoy sidecar tuning — pin worker threads at 8 to
  ## match the CPU limit and drop the chart's default `--log-level trace`.
  sidecar:
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "8"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: 2
        memory: 4Gi
      limits:
        cpu: 8
        memory: 16Gi
  pluginsConfigFile: "optimized-baseline-plugins.yaml"
  pluginsCustomConfig:
    optimized-baseline-plugins.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      - type: prefix-cache-scorer
      - type: no-hit-lru-scorer
      schedulingProfiles:
      - name: default
        plugins:
        - pluginRef: queue-scorer
          weight: 2
        - pluginRef: kv-cache-utilization-scorer
          weight: 2
        - pluginRef: prefix-cache-scorer
          weight: 3
        - pluginRef: no-hit-lru-scorer
          weight: 2

inferencePool:
  modelServers:
    matchLabels:
      llm-d.ai/guide: "optimized-baseline"
