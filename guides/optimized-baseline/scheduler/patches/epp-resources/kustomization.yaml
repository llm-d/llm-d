apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Post-renderer overlay applied on top of the standalone chart's rendered
# output to patch the EPP container with production-grade resources.
# Invoked by post-renderer.sh from `helm install --post-renderer`.

resources:
  - rendered.yaml

patches:
  - path: patch-epp-resources.yaml
    target:
      kind: Deployment
