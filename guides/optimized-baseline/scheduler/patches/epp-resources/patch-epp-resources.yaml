# Strategic merge patch: sets production-grade resources on the EPP
# container. The standalone chart at v1.5.0 does not expose EPP
# resources via values, leaving the container in BestEffort QoS — first
# to be evicted under node pressure. This patch lifts it into Burstable
# QoS with a guaranteed CPU floor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder-overridden-by-target-selector
spec:
  template:
    spec:
      containers:
        - name: epp
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
