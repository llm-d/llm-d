## agentgateway override for the optimized-baseline guide.
## Layer on top of: optimized-baseline.values.yaml
##
## optimized-baseline.values.yaml sets extraServicePorts[0].targetPort: 8081,
## but agentgateway requires that targetPort be omitted, "http", or equal to
## the listener port (.port, 80 here). This override removes targetPort so
## the chart's agentgateway validation passes.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
