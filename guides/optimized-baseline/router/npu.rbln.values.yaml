# Rebellions NPU overrides for optimized-baseline.values.yaml. Apply after it;
# everything not named here is inherited. Named for the RBLN runtime rather than
# for NPUs in general, since the reuse unit below is that runtime's.
router:
  epp:
    pluginsCustomConfig:
      optimized-baseline-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: approx-prefix-cache-producer
          parameters:
            # The runtime reuses prefixes in 512-token sub-blocks of each 4096-token block,
            # but does not publish prefix_match_unit, so autotune would hash at 4096 and see
            # no prefix in a shorter prompt.
            autoTune: false
            blockSizeTokens: 512
            # 428 KV blocks x 8 sub-blocks, the count the runtime sized on one RBLN-CR13.
            lruCapacityPerServer: 3424
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            # Measured on one RBLN-CR13 with rbln-serve 0.12.0 at CHUNK_SIZE=512.
            peakPrefillThroughput: 12171
        - type: token-load-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer

  modelServers:
    matchLabels:
      llm-d.ai/guide: "optimized-baseline"
      llm-d.ai/accelerator-variant: "npu"
      llm-d.ai/accelerator-vendor: "rebellions"
