## optimized-baseline guide overrides for the llm-d router (TokenSpeed variant).
## Layer on top of: recipes/router/base.values.yaml
##
## Use this file INSTEAD of optimized-baseline.values.yaml when the model servers
## are `tokenspeed serve`. It schedules with the same plugins as
## optimized-baseline.values.yaml and also declares the metrics data layer:
## `tokenspeed serve` exports its engine metrics on a separate --metrics-port
## rather than on the API port, and router.epp.metricsDataSource has no port
## setting. With a custom plugins file the chart-level metricsDataSource and
## modelServers.type values are not part of the EPP configuration, so the
## metrics source and extractor are listed below.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "optimized-baseline-plugins.yaml"
    pluginsCustomConfig:
      optimized-baseline-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        # Plugins run with their built-in defaults: the prefix-cache-affinity-filter's
        # peakPrefillThroughput default (15928) is calibrated for this guide's reference
        # setup (Qwen3-32B on H100 80 GB, TP=2). For other hardware/models, measure your
        # own value with guides/recipes/router/calibration and set it on the filter.
        plugins:
        # Scrape /metrics on the port every TokenSpeed pod passes as
        # --metrics-port; the port is shared by all endpoints of the pool.
        - type: metrics-data-source
          parameters:
            path: /metrics
            port: 9100
        # Map tokenspeed:num_requests_waiting, tokenspeed:num_requests_running
        # and tokenspeed:kv_cache_usage_perc onto the EPP's core metrics.
        - type: core-metrics-extractor
          parameters:
            defaultEngine: tokenspeed
        - type: approx-prefix-cache-producer
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
        - type: token-load-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
        dataLayer:
          sources:
          - pluginRef: metrics-data-source
            extractors:
            - pluginRef: core-metrics-extractor

  modelServers:
    type: tokenspeed
    matchLabels:
      llm-d.ai/guide: "optimized-baseline"
