## optimized-baseline guide overrides for the llm-d router (TensorRT-LLM variant).
## Layer on top of: recipes/router/base.values.yaml
##
## Use this file INSTEAD of optimized-baseline.values.yaml when the model servers
## are trtllm-serve. It schedules with queue, KV-cache utilization, prefix-cache
## and no-hit-LRU scorers instead of the prefix-cache-affinity-filter profile of
## the vLLM/SGLang variant, and declares the metrics data layer itself: with a
## custom plugins file the chart-level metricsDataSource and modelServers.type
## values are not part of the EPP configuration, so the metrics source and
## extractor are listed below.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "optimized-baseline-plugins.yaml"
    pluginsCustomConfig:
      optimized-baseline-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        # trtllm-serve exposes its Prometheus metrics at /prometheus/metrics, not
        # the default /metrics (which serves JSON iteration stats the extractor
        # cannot parse). The model server must be started with
        # return_perf_metrics: true and enable_iter_perf_stats: true (see the
        # trtllm modelserver overlay).
        - type: metrics-data-source
          parameters:
            path: /prometheus/metrics
        # Map trtllm_num_requests_waiting, trtllm_num_requests_running and
        # trtllm_kv_cache_utilization onto the scorers' inputs. The overlay pods
        # carry no llm-d.ai/engine-type label, so they use this default.
        - type: core-metrics-extractor
          parameters:
            defaultEngine: trtllm-serve
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: no-hit-lru-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: no-hit-lru-scorer
            weight: 2
        dataLayer:
          sources:
          - pluginRef: metrics-data-source
            extractors:
            - pluginRef: core-metrics-extractor

  modelServers:
    type: trtllm-serve
    matchLabels:
      llm-d.ai/guide: "optimized-baseline"
