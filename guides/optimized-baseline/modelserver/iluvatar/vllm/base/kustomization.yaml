apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: optimized-baseline-iluvatar-vllm-

images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: registry.iluvatar.com.cn:10443/k8s/vllm
    newTag: corex510

labels:
  - pairs:
      llm-d.ai/model: DeepSeek-V4-Flash
      llm-d.ai/guide: optimized-baseline
      llm-d.ai/accelerator-variant: iluvatar
      llm-d.ai/accelerator-vendor: iluvatar
      llm-d.ai/engine-type: vllm
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
