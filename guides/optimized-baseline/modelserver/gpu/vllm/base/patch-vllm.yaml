apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          # Include all args in overlay patch for consistency
          args:
            - "google/gemma-4-31B-it"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=gemma4"
            - "--chat-template=examples/tool_chat_template_gemma4.jinja"
            - "--reasoning-parser=gemma4"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            # - "--enable-auto-tool-choice"
            # - "--tool-call-parser=hermes"
            # - "--reasoning-parser=qwen3"
            # Uncomment for distributed tracing
            # - "Qwen/Qwen3.5-122B-A10B-FP8"
            # - "--trust-remote-code"
            # - "--tensor-parallel-size=2"
            # - "--enable-auto-tool-choice"
            # - "--tool-call-parser=qwen3_coder"
            # - "--reasoning-parser=qwen3"
            # - "--enable-prefix-caching"

            # - "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8"
            # - "--enable-prefix-caching"
            # - "--enable-auto-tool-choice"
            # - "--tool-call-parser=qwen3_coder"
            # - "--reasoning-parser=nemotron_v3"
            # - "--tensor-parallel-size=2"
            # - "google/gemma-4-31B-it"
            # - "--enable-auto-tool-choice"
            # - "--tool-call-parser=gemma4"
            # - "--chat-template=examples/tool_chat_template_gemma4.jinja"
            # - "--reasoning-parser=gemma4"
            # - "openai/gpt-oss-120b"
            # - "--tensor-parallel-size=1"
            # - "--tool-call-parser=openai"
            # - "--enable-auto-tool-choice"
            # - "--otlp-traces-endpoint=http://otel-collector:4317"
            # - "--collect-detailed-traces=all"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            # # Uncomment for distributed tracing env vars
            - name: VLLM_USE_DEEP_GEMM
              value: "0"
            - name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL
              value: "0"
            # - name: OTEL_SERVICE_NAME
            #   value: "vllm-decode"
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "http://otel-collector:4317"
            # - name: OTEL_TRACES_EXPORTER
            #   value: "otlp"
            # - name: OTEL_TRACES_SAMPLER
            #   value: "parentbased_traceidratio"
            # - name: OTEL_TRACES_SAMPLER_ARG
            #   value: "0.1"
          resources:
            limits:
              cpu: '8'
              memory: 32Gi
              nvidia.com/gpu: 1
            requests:
              cpu: '8'
              memory: 32Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /.config
              name: vllm-config
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
