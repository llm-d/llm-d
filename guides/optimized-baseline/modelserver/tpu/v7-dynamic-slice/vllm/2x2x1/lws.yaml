apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: decode
  labels:
    # LocalQueue from docs/infrastructure/providers/gke/dynamic-slicing/kueue-localqueue.yaml
    kueue.x-k8s.io/queue-name: tpu7x-subslice-lq
    llm-d.ai/role: decode
spec:
  replicas: 2
  leaderWorkerTemplate:
    # 2x2x1 sub-slice = 4 chips = 1 tpu7x-standard-4t host.
    size: 1
    restartPolicy: RecreateGroupOnPodRestart
    workerTemplate:
      metadata:
        annotations:
          cloud.google.com/gke-tpu-slice-topology: "2x2x1"
          # Dynamic-slice pods carry no static gke-tpu-topology nodeSelector,
          # which the GKE TPU admission webhook otherwise requires.
          cloud.google.com/skip-tpu-webhook-check: "true"
        labels:
          llm-d.ai/role: decode
          llm-d.ai/guide: optimized-baseline
          llm-d.ai/model: Qwen3-Coder-480B-A35B-Instruct-FP8
          llm-d.ai/accelerator-variant: tpu
          llm-d.ai/accelerator-vendor: google
      spec:
        nodeSelector:
          cloud.google.com/gke-tpu-accelerator: tpu7x
          cloud.google.com/gke-tpu-partition-2x2x1-state: "HEALTHY"
        tolerations:
          - key: google.com/tpu
            operator: Exists
            effect: NoSchedule
        containers:
          - name: modelserver
            image: REPLACE_MODEL_SERVER_IMAGE
            command: ["vllm", "serve"]
            args:
              - "Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8"
              - "--port=8000"
              - "--max-model-len=262144"
              - "--max-num-batched-tokens=8192"
              - "--max-num-seqs=64"
              - "--tensor-parallel-size=8"
              - "--kv-cache-dtype=fp8"
              - "--language-model-only"
              - "--gpu-memory-utilization=0.80"
              - "--async-scheduling"
              - "--enable-expert-parallel"
              - "--block-size=256"
              - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: MODEL_IMPL_TYPE
                value: vllm
              - name: USE_BATCHED_RPA_KERNEL
                value: "1"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
            ports:
              - name: modelserver
                containerPort: 8000
                protocol: TCP
            resources:
              limits:
                cpu: "200"
                memory: 900Gi
                google.com/tpu: 4
              requests:
                cpu: "150"
                memory: 800Gi
                google.com/tpu: 4
            startupProbe:
              httpGet:
                path: /v1/models
                port: modelserver
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 480
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /v1/models
                port: modelserver
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 3
            volumeMounts:
              - mountPath: /dev/shm
                name: shm
              - mountPath: /.cache
                name: torch-compile-cache
              - mountPath: /.config
                name: vllm-config
        volumes:
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 100Gi
          - name: torch-compile-cache
            emptyDir: {}
          - name: vllm-config
            emptyDir: {}
