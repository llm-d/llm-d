# TPU v5p single-host slice (ct5p-hightpu-4t): 4 chips x 95 GB HBM, ~448 GB host RAM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-topology: "2x2x1"
        cloud.google.com/gke-tpu-accelerator: "tpu-v5p-slice"
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen3-32B"
            - "--port=8000"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=4"
            # Drain in-flight requests on SIGTERM. Sized with the grace period in
            # recipes/modelserver/components/graceful-shutdown; raise both together.
            - "--shutdown-timeout=45"
            # Uncomment for distributed tracing
            # - "--otlp-traces-endpoint=http://otel-collector:4317"
            # - "--collect-detailed-traces=all"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            # Uncomment for distributed tracing env vars
            # - name: OTEL_SERVICE_NAME
            #   value: "vllm-decode"
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "http://otel-collector:4317"
            # - name: OTEL_TRACES_EXPORTER
            #   value: "otlp"
            # - name: OTEL_TRACES_SAMPLER
            #   value: "parentbased_traceidratio"
            # - name: OTEL_TRACES_SAMPLER_ARG
            #   value: "0.1"
          resources:
            limits:
              google.com/tpu: "4"
            requests:
              google.com/tpu: "4"
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /root/.cache
              name: torch-compile-cache
            - mountPath: /root/.triton
              name: triton-cache
            - mountPath: /root/.config
              name: vllm-config
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        # TODO(https://github.com/llm-d/llm-d/issues/2884): Temporary workaround
        # until the tpu-v5p-spot node pool boot disk on llm-d-e2e-us-east5 is
        # resized from 100 GB to >= 250 GB. Back /root/.cache (including
        # /root/.cache/huggingface) with tmpfs from host RAM (~448 GiB on
        # ct5p-hightpu-4t) so ~65.5 GB Qwen/Qwen3-32B downloads do not trigger
        # ephemeral-storage eviction.
        - name: torch-compile-cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Gi
        - name: triton-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
