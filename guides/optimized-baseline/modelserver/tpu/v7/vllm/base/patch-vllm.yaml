apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-topology: "2x2x1"
        cloud.google.com/gke-tpu-accelerator: "tpu7x"
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          # Same engine layout as the Qwen3.5-397B model guide, without KV offload, MTP or a
          # router-side KV tier: the baseline the other TPU7x guides add features to.
          args:
            - "Qwen/Qwen3.5-397B-A17B-FP8"
            - "--port=8000"
            - "--data-parallel-size=8"
            - "--tensor-parallel-size=1"
            - "--enable-expert-parallel"
            - "--enable-ep-weight-filter"
            - "--attention-backend=CUSTOM"
            - "--language-model-only"
            - "--kv-cache-dtype=fp8"
            - "--block-size=4352"
            - "--gpu-memory-utilization=0.90"
            - "--max-model-len=262144"
            - "--max-num-batched-tokens=4384"
            - "--max-num-seqs=32"
            - "--no-disable-hybrid-kv-cache-manager"
            - "--mamba-cache-mode=align"
            - "--no-async-scheduling"
            - "--enable-prefix-caching"
            - "--prefix-cache-retention-interval=0"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=qwen3_coder"
            - "--reasoning-parser=qwen3"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            # Drain in-flight requests on SIGTERM. Sized with the grace period in
            # recipes/modelserver/components/graceful-shutdown; raise both together.
            - "--shutdown-timeout=45"
            # Uncomment for distributed tracing
            # - "--otlp-traces-endpoint=http://otel-collector:4317"
            # - "--collect-detailed-traces=all"
          env:
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "3600"
            - name: TPU_EVICT_WEIGHTS_PAGE_CACHE
              value: "1"
            - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
              value: "1"
            - name: TPU_VLLM_SKIP_DYNAMIC_SMEM_NEGOTIATION_FLAG
              value: "1"
            - name: TPU_RAIDEN_QWEN35_ADMISSION
              value: "1"
            - name: TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS
              value: "false"
            - name: TORCHINDUCTOR_AUTOGRAD_CACHE
              value: "0"
            - name: VLLM_TARGET_DEVICE
              value: "tpu"
            - name: PJRT_DEVICE
              value: "TPU"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
                  optional: true
          resources:
            limits:
              memory: 512Gi
              google.com/tpu: 4
            requests:
              memory: 512Gi
              cpu: "64"
              google.com/tpu: 4
          volumeMounts:
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /dev/shm
              name: dshm
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: torch-compile-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
