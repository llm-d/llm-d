apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-topology: "2x2x1"
        cloud.google.com/gke-tpu-accelerator: "tpu7x"
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen3.5-397B-A17B-FP8"
            - "--port=8000"
            - "--tensor-parallel-size=8"
            - "--enable-expert-parallel"
            - "--attention-backend=CUSTOM"
            - "--max-model-len=16384"
            - "--max-num-seqs=64"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
          env:
            - name: TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS
              value: "false"
            - name: TORCHINDUCTOR_AUTOGRAD_CACHE
              value: "0"
            - name: VLLM_TARGET_DEVICE
              value: "tpu"
            - name: PJRT_DEVICE
              value: "TPU"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
                  optional: true
          resources:
            limits:
              memory: 256Gi
              cpu: "64"
              google.com/tpu: 4
            requests:
              memory: 256Gi
              cpu: "64"
              google.com/tpu: 4
          volumeMounts:
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /dev/shm
              name: dshm
          startupProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          livenessProbe:
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: torch-compile-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
