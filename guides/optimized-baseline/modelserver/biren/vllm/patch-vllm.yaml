apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      runtimeClassName: biren
      nodeName: wz-server006
      terminationGracePeriodSeconds: 30
      containers:
        - name: modelserver
          command:
            - /usr/local/birensupa/br_container_tools/biren_entrypoint.sh
            - vllm
            - serve
          args:
            - /share/models/Qwen2.5-72B-Quant
            - --host=0.0.0.0
            - --port=8000
            - --served-model-name=Qwen72B_INT8
            - --distributed-executor-backend=mp
            - --block-size=128
            - --seed=1024
            - --tensor-parallel-size=4
            - --dtype=bfloat16
            - --max-model-len=3072
            - --max-num-seqs=64
            - --max-num-batched-tokens=4096
            - --trust-remote-code
            - --gpu-memory-utilization=0.75
            - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
          env:
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
            - name: SUPA_VISIBLE_DEVICES
              value: "0,1,2,3"
            - name: VLLM_USE_V1
              value: "1"
            - name: VLLM_ENABLE_V1_MULTIPROCESSING
              value: "1"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: VLLM_BR_WEIGHT_TYPE
              value: NUMA
            - name: VLLM_USE_TRITON_FLASH_ATTN
              value: "0"
            - name: VLLM_ENGINE_ITERATION_TIMEOUT_S
              value: "300"
            - name: PYTORCH_SUPA_ALLOC_CONF
              value: "max_split_size_mb:32,pool_type_boundary_mb:10"
            - name: BRTB_ENABLE_NUMA_SPLIT
              value: "1"
            - name: BRTB_ENABLE_NUMA_ALIGN_4K
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
            - name: RAY_DEDUP_LOGS
              value: "0"
          securityContext:
            privileged: true
            capabilities:
              add:
                - IPC_LOCK
                - SYSLOG
          resources:
            limits:
              cpu: "32"
              memory: 256Gi
            requests:
              cpu: "16"
              memory: 128Gi
          volumeMounts:
            - mountPath: /share
              name: share
            - mountPath: /dev/biren
              name: biren
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: share
          hostPath:
            path: /share
            type: Directory
        - name: biren
          hostPath:
            path: /dev/biren
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
        - name: torch-compile-cache
          emptyDir: {}
