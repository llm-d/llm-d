apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: optimized-baseline-cpu-sglang-

components:
  - ../../../../../recipes/modelserver/components/images/cpu-sglang/release

labels:
  - pairs:
      llm-d.ai/guide: optimized-baseline
      llm-d.ai/model: Llama-3.2-3B-Instruct
      llm-d.ai/accelerator-variant: cpu
      llm-d.ai/accelerator-vendor: intel
      llm-d.ai/engine-type: sglang
    includeSelectors: true
    includeTemplates: true

patches:
  - path: patch-sglang.yaml
