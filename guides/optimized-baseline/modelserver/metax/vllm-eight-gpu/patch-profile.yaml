apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimized-baseline-metax-vllm-decode
spec:
  replicas: 1
  template:
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: modelserver
          args:
            - serve
            - deepseek-ai/DeepSeek-R1-Distill-Llama-70B
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --served-model-name
            - deepseek-ai/DeepSeek-R1-Distill-Llama-70B
            - --trust-remote-code
            - --tensor-parallel-size=8
            - --pipeline-parallel-size=1
            - --data-parallel-size=1
            - --gpu-memory-utilization=0.85
            - --max-model-len=4096
            - --max-num-batched-tokens=4095
            - --distributed-executor-backend=mp
            - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
          startupProbe:
            failureThreshold: 360
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              metax-tech.com/gpu: "8"
            limits:
              memory: 256Gi
              metax-tech.com/gpu: "8"
