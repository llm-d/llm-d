apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CI-specific overlay for the AMD optimized-baseline vllm guide.
# Adds the persistent model cache (RWX PVC) on top of the base overlay.
# Requires the cluster's default StorageClass to support ReadWriteMany.
resources:
  - ../base
components:
  - ../../../../../recipes/modelserver/components/model-cache
