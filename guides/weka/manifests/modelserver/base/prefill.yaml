apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
spec:
  replicas: 4
  selector:
    matchLabels:
      llm-d.ai/inferenceServing: "true"
      llm-d.ai/model: Llama-33-70B-Instruct
      llm-d.ai/role: prefill
  template:
    metadata:
      labels:
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/model: Llama-33-70B-Instruct
        llm-d.ai/role: prefill
    spec:
      initContainers:
        # gds-setup-on-node:
        # In order for GDS to work we need to configure CuFile appropriately.
        # The crucial step in this is populating the list of IB IPs in the
        # configuration file. `amgctl` automates this for us. Additionally,
        # it performs various preflight checks to ensure that we can issue
        # GDS requests in this node.
        - name: gds-setup-on-node
          image: sdimitro509/amg-vanilla:latest
          command:
            - amgctl
          args:
            - host
            - gds
            - setup
            - --pre-flight
            - --config-dir=/etc/wekaio/amg
      serviceAccountName: llama-3-3-70b-instruct-fp8-dynamic
      volumes:
        - name: weka-storage # gets patched in overlays
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: host-node-cufile
          hostPath:
            path: /etc/wekaio/amg/weka-cufile.json
            type: File 
      containers:
        - name: vllm
          image: ghcr.io/llm-d/llm-d-dev:pr-246@sha256:41219315abda2cdf61121c6bc8a747795dfc8872568d21a392d335e7361e350a # This image has updated LMCache with upstream but not new vLLM for support
          command: ["vllm", "serve"]
          args:
            - RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - --port
            - "8000"
            - --served-model-name
            - "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"
            - --block-size
            - "128"
            - --kv-transfer-config
            - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both","kv_connector_extra_config": {}}'
            - --disable-log-requests
            - --disable-uvicorn-access-log
            # (Serapheim): I commented this out below. Isn't the default 131072 or something?
            #              We could start with that.
            # - --max-model-len
            # - "32000"
          env:
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_LOGGING_LEVEL
              value: INFO # DEBUG IF NEEDED
            - name: HF_HOME # LOAD MODEL FROM WEKA MOUNT POINT
              value: "/mnt/weka/hf_cache"
            - name: NCCL_SOCKET_IFNAME
              value: "=enp157s0np0,enp158s0np0"
            - name: NCCL_IB_HCA
              value: "ibp"
            - name: UCX_NET_DEVICES
              value: "ibp0:1,ibp1:1,ibp2:1,ibp3:1,ibp4:1,ibp5:1,ibp6:1,ibp7:1"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NVIDIA_GDRCOPY
              value: "enabled"
            # LMCache GPU Direct Vars
            - name: LMCACHE_USE_EXPERIMENTAL
              value: true
            - name: LMCACHE_CHUNK_SIZE
              value: 256
            - name: LMCACHE_WEKA_PATH
              value: /mnt/weka/cache
            - name: LMCACHE_CUFILE_BUFFER_SIZE
              value: "8192"
            - name: LMCACHE_LOCAL_CPU
              value: false
            - name: LMCACHE_EXTRA_CONFIG
              value: '{"gds_io_threads": 16}'
            - name: PROMETHEUS_MULTIPROC_DIR # Needed currently for LMCache metrics
              value: /tmp/lmcache_prometheus
          ports:
          - containerPort: 8000
            name: metrics
            protocol: TCP
          resources:
            limits:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
              rdma/ib: 1
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
              rdma/ib: 1
          readinessProbe: # KUSTOMIZATION overlay
            exec:
              command:
                - "gds-cufile-probe"
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: weka-storage
              mountPath: /mnt/weka
            - name: host-node-cufile
              mountPath: /etc/cufile.json
              mountPropagation: HostToContainer
              readOnly: true # is this acurate? Not required
