# Values for the multi-tenant Pub/Sub demo — team × tier (Scenarios A + B), one
# model behind one InferencePool.
#
# Replace: PROJECT_ID, NAMESPACE, IGW_HOST (the llm-d-router address). 3 topics,
# one per team. The served model name reaches the system through payload.model in
# the publisher (${MODEL}), never through these values.
#
#   - TEAM -> per-team reserved quota (redis-quota, classifying; counters keyed
#     quota:team:<team>): within quota -> reserved, over -> overflow.
#   - TIER -> per-topic `tier` label; the tier-priority merge policy orders the
#     reserved/overflow × tier lanes and stamps x-llm-d-inference-objective.
#
# Pub/Sub publishes all results to the single resultTopicId.
#
# One llm-d-async can serve several InferencePools independently: give each pool
# its own worker pool and queues whose igw_base_url points at that pool's router.
ap:

  transport: "gcp-pubsub"

  requestMergePolicyConfig:
    type: "tier-priority"
    parameters:
      objective_header: "x-llm-d-inference-objective"
      fairness_header: "x-llm-d-inference-fairness-id"
      fairness_attribute: "team"
      lane_objectives:
        reserved-interactive: "reserved-interactive"
        reserved-async: "reserved-async"
        reserved-batch: "reserved-batch"
        overflow-interactive: "overflow-interactive"
        overflow-async: "overflow-async"
        overflow-batch: "overflow-batch"

  transportConfig:
    project_id: "PROJECT_ID"
    result_topic_id: "projects/PROJECT_ID/topics/results"
    topics:
      # ---------- team queues (pool teams, payload.model = MODEL) ----------
      - subscriber_id: "projects/PROJECT_ID/subscriptions/team-premium-requests-sub"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        labels: {tier: "interactive"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - subscriber_id: "projects/PROJECT_ID/subscriptions/team-standard-requests-sub"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        labels: {tier: "async"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - subscriber_id: "projects/PROJECT_ID/subscriptions/team-batch-requests-sub"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        labels: {tier: "batch"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "1"
          prefix: "quota:"

  workerPools:
    - id: "teams"
      workers: 16

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  metrics:
    enabled: true
  podMonitor:
    enabled: false
  modelServerMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  grafana:
    dashboards:
      enabled: false
