# Values for Multi-Tenant Async Processing using tier-priority-admission
# worker pool gate with prometheus-saturation (GCP Pub/Sub backend), one model
# behind one InferencePool.
#
# Replace placeholders: PROJECT_ID, POOL_NAME, PROM_URL
#
#  - Worker Pool Gate: tier-priority-admission
#    Uses an inner saturation gate (prometheus-saturation) querying
#    flow_control_pool_saturation for the pool.
#    When saturated:
#      - reserved traffic parks cleanly in memory (ActionWait)
#      - interactive overflow is dropped immediately (429)
#      - async & batch overflow traffic is refused (ActionRefuse, returns to subscription)
#    When not saturated:
#      - all traffic continues freely (ActionContinue)
#  - Merge Policy: tier-priority with lane_objectives mapping to InferenceObjectives
#
# The router (llm-d-router-epp) and Redis are addressed by Service name: llm-d-async
# runs in their namespace.
#
# One llm-d-async can serve several InferencePools independently: give each pool
# its own worker pool and queues whose igw_base_url points at that pool's router.
# A router in another namespace takes its full Service DNS name
# (http://<release>-epp.<namespace>.svc.cluster.local:80).
ap:

  transport: "gcp-pubsub"

  prometheusURL: "PROM_URL"
  prometheusCacheTTL: "5s"

  requestMergePolicyConfig:
    type: "tier-priority"
    parameters:
      objective_header: "x-llm-d-inference-objective"
      fairness_header: "x-llm-d-inference-fairness-id"
      fairness_attribute: "team"
      lane_objectives:
        reserved-interactive: "reserved-interactive"
        reserved-async: "reserved-async"
        reserved-batch: "reserved-batch"
        overflow-interactive: "overflow-interactive"
        overflow-async: "overflow-async"
        overflow-batch: "overflow-batch"

  transportConfig:
    project_id: "PROJECT_ID"
    result_topic_id: "projects/PROJECT_ID/topics/results"
    topics:
      # ---------- team queues (pool teams, payload.model = MODEL) ----------
      - subscriber_id: "projects/PROJECT_ID/subscriptions/team-premium-requests-sub"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://llm-d-router-epp:80"
        labels: {tier: "interactive"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - subscriber_id: "projects/PROJECT_ID/subscriptions/team-standard-requests-sub"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://llm-d-router-epp:80"
        labels: {tier: "async"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - subscriber_id: "projects/PROJECT_ID/subscriptions/team-batch-requests-sub"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://llm-d-router-epp:80"
        labels: {tier: "batch"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "1"
          prefix: "quota:"

  # Worker pools with tier-priority-admission gate backed by prometheus-saturation
  workerPools:
    - id: "teams"
      workers: 16
      gate_type: "tier-priority-admission"
      gate_params:
        saturation_gate: "prometheus-saturation"
        saturation_gate_params: '{"pool":"POOL_NAME","threshold":"0.8"}'
        tier_label: "tier"

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  metrics:
    enabled: true
  podMonitor:
    enabled: true
    interval: "15s"
  modelServerMonitor:
    enabled: false
  prometheusRule:
    enabled: true
  grafana:
    dashboards:
      enabled: true
