# Values for Multi-Tenant Async Processing using tier-priority-admission
# worker pool gate with prometheus-saturation, one model behind one InferencePool.
#
# Replace placeholders: NAMESPACE, IGW_HOST, POOL_NAME, PROM_URL
#
#  - Worker Pool Gate: tier-priority-admission
#    Uses an inner saturation gate (prometheus-saturation) querying
#    flow_control_pool_saturation for the pool.
#    When saturated:
#      - reserved traffic parks cleanly in memory (ActionWait)
#      - interactive overflow is dropped immediately (429)
#      - async & batch overflow traffic is refused (ActionRefuse, returns to queue)
#    When not saturated:
#      - all traffic continues freely (ActionContinue)
#  - Merge Policy: tier-priority with lane_objectives mapping to InferenceObjectives
#
# One llm-d-async can serve several InferencePools independently: give each pool
# its own worker pool and queues whose igw_base_url points at that pool's router.
ap:

  transport: "redis-sortedset"

  prometheusURL: "PROM_URL"
  prometheusCacheTTL: "5s"

  requestMergePolicyConfig:
    type: "tier-priority"
    parameters:
      objective_header: "x-llm-d-inference-objective"
      fairness_header: "x-llm-d-inference-fairness-id"
      fairness_attribute: "team"
      lane_objectives:
        reserved-interactive: "reserved-interactive"
        reserved-async: "reserved-async"
        reserved-batch: "reserved-batch"
        overflow-interactive: "overflow-interactive"
        overflow-async: "overflow-async"
        overflow-batch: "overflow-batch"

  transportConfig:
    urlSecret:
      url: "redis://redis.NAMESPACE.svc.cluster.local:6379"
    # Results go to the destination a request carries (the optional coordinator
    # gives each request its own result key) or, for requests published straight
    # to Redis, to this list. A per-queue result_queue_name would override both
    # and break the coordinator's wait and enqueue modes. result_ttl_seconds
    # expires result keys nobody collects.
    result_queue_name: "results-list"
    poll_interval_ms: 500
    batch_size: 10
    queues:
      # ---------- team queues (pool teams, payload.model = MODEL) ----------
      - queue_name: "team-premium"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_ttl_seconds: 3600
        labels: {tier: "interactive"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - queue_name: "team-standard"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_ttl_seconds: 3600
        labels: {tier: "async"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - queue_name: "team-batch"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_ttl_seconds: 3600
        labels: {tier: "batch"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "1"
          prefix: "quota:"

  # Worker pools with tier-priority-admission gate backed by prometheus-saturation
  workerPools:
    - id: "teams"
      workers: 16
      gate_type: "tier-priority-admission"
      gate_params:
        saturation_gate: "prometheus-saturation"
        saturation_gate_params: '{"pool":"POOL_NAME","threshold":"0.8"}'
        tier_label: "tier"

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  metrics:
    enabled: true
  podMonitor:
    enabled: false
  modelServerMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  grafana:
    dashboards:
      enabled: false
