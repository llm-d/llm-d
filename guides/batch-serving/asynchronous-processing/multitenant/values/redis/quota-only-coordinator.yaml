# Values for the multi-tenant scenario with the optional router coordinator
# (README step 4): values/redis/quota-only.yaml plus two queues fed by the
# coordinator's async-broker step and their own worker pool. Everything above
# the coordinator entries is identical to quota-only.yaml
# (scripts/tests/test_multitenant_coordinator_values.py checks this).
#
# The coordinator queues differ from the team queues in three ways:
#   * no result_queue_name: each queued message carries its own result
#     mailbox, which the async-broker step reads for wait and enqueue modes;
#   * result_ttl_seconds: unfetched results expire;
#   * their own worker pool `coord` (16 workers, more than the router's
#     concurrency limit of 10), so coordinator traffic alone can saturate the
#     model server.
#
# Values for the multi-tenant scenario — team × tier (Scenarios A + B), Redis
# SortedSet queue backend, one model behind one InferencePool.
#
# Replace the placeholders: NAMESPACE and IGW_HOST (the llm-d-router address).
# The served model name reaches the system through payload.model in the
# publisher (${MODEL}), never through these values.
#
#   - TEAM -> a per-team reserved quota via redis-quota in `classifying` mode:
#     within quota -> reserved, over quota -> overflow (dispatched, not nacked).
#     Counters are keyed quota:team:<team>.
#   - TIER -> a per-queue `tier` label (premium=interactive, standard=async,
#     batch=batch).
#
# The tier-priority merge policy dispatches the 6 (classification × tier) lanes
# in strict order (all reserved before any overflow; interactive > async > batch
# within each) and stamps x-llm-d-inference-objective. Results land on
# results-list.
#
# One llm-d-async can serve several InferencePools independently: give each pool
# its own worker pool and queues whose igw_base_url points at that pool's router.
ap:

  transport: "redis-sortedset"

  requestMergePolicyConfig:
    type: "tier-priority"
    parameters:
      objective_header: "x-llm-d-inference-objective"
      fairness_header: "x-llm-d-inference-fairness-id"
      fairness_attribute: "team"
      lane_objectives:
        reserved-interactive: "reserved-interactive"
        reserved-async: "reserved-async"
        reserved-batch: "reserved-batch"
        overflow-interactive: "overflow-interactive"
        overflow-async: "overflow-async"
        overflow-batch: "overflow-batch"

  transportConfig:
    urlSecret:
      url: "redis://redis.NAMESPACE.svc.cluster.local:6379"
    result_queue_name: "results-list"   # default; per-queue result_queue_name overrides below
    poll_interval_ms: 500
    batch_size: 10
    queues:
      # ---------- team queues (pool teams, payload.model = MODEL) ----------
      - queue_name: "team-premium"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_queue_name: "results-list"
        labels:
          tier: "interactive"
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - queue_name: "team-standard"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_queue_name: "results-list"
        labels:
          tier: "async"
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - queue_name: "team-batch"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_queue_name: "results-list"
        labels:
          tier: "batch"
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "1"
          prefix: "quota:"

      # ---------- COORDINATOR (async-broker step, README step 4) ----------
      - queue_name: "coord-standard"
        worker_pool_id: "coord"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_ttl_seconds: 3600
        labels:
          tier: "async"
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - queue_name: "coord-batch"
        worker_pool_id: "coord"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_ttl_seconds: 3600
        labels:
          tier: "batch"
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "1"
          prefix: "quota:"

  # One worker pool for the one InferencePool.
  workerPools:
    - id: "teams"
      workers: 16
    - id: "coord"
      workers: 16

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  metrics:
    enabled: true
  podMonitor:
    enabled: false
  modelServerMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  grafana:
    dashboards:
      enabled: false
