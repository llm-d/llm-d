# Redis SortedSet backend + Prometheus — team × tier with saturation back-off
# (Scenario C), one model behind one InferencePool.
#
#  - SATURATION: the worker pool's wait-on-refuse(prometheus-query) gate reads
#    vLLM running requests for the InferencePool (POOL_NAME) and parks the pool's
#    workers once SAT_CAP requests are running.
#  - TEAM quota (redis-quota, classifying): within quota -> reserved, over ->
#    overflow.
#  - TIER: per-queue label; the tier-priority merge policy orders the
#    reserved/overflow × tier lanes and stamps x-llm-d-inference-objective.
#
# Replace: NAMESPACE, IGW_HOST, POOL_NAME (InferencePool name), PROM_URL,
# SAT_CAP (concurrent requests at which the pool is considered saturated).
#
# One llm-d-async can serve several InferencePools independently: give each pool
# its own worker pool and queues whose igw_base_url points at that pool's router.
ap:

  transport: "redis-sortedset"

  prometheusURL: "PROM_URL"
  prometheusCacheTTL: "5s"

  requestMergePolicyConfig:
    type: "tier-priority"
    parameters:
      objective_header: "x-llm-d-inference-objective"
      fairness_header: "x-llm-d-inference-fairness-id"
      fairness_attribute: "team"
      lane_objectives:
        reserved-interactive: "reserved-interactive"
        reserved-async: "reserved-async"
        reserved-batch: "reserved-batch"
        overflow-interactive: "overflow-interactive"
        overflow-async: "overflow-async"
        overflow-batch: "overflow-batch"

  transportConfig:
    urlSecret:
      url: "redis://redis.NAMESPACE.svc.cluster.local:6379"
    # Results go to the destination a request carries (the optional coordinator
    # gives each request its own result key) or, for requests published straight
    # to Redis, to this list. A per-queue result_queue_name would override both
    # and break the coordinator's wait and enqueue modes. result_ttl_seconds
    # expires result keys nobody collects.
    result_queue_name: "results-list"
    poll_interval_ms: 500
    batch_size: 10
    queues:
      # ---------- team queues (pool teams, payload.model = MODEL) ----------
      - queue_name: "team-premium"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_ttl_seconds: 3600
        labels: {tier: "interactive"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - queue_name: "team-standard"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_ttl_seconds: 3600
        labels: {tier: "async"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "2"
          prefix: "quota:"
      - queue_name: "team-batch"
        worker_pool_id: "teams"
        request_path_url: "/v1/completions"
        igw_base_url: "http://IGW_HOST:80"
        result_ttl_seconds: 3600
        labels: {tier: "batch"}
        gate_type: "redis-quota"
        gate_params:
          address: "redis.NAMESPACE.svc.cluster.local:6379"
          attribute: "team"
          mode: "concurrency"
          gating_mode: "classifying"
          limit: "1"
          prefix: "quota:"

  # The pool parks on its InferencePool's saturation.
  #
  # SAT_CAP is the divisor: the concurrent-request count at which the pool counts as
  # saturated. prometheus-query closes the gate at budget <= 0 and clamp() floors the
  # budget at 0, so the gate closes only once SAT_CAP requests are running.
  workerPools:
    - id: "teams"
      workers: 16
      gate_type: "wait-on-refuse"
      gate_params:
        gate: |
          {"gate_type":"prometheus-query","gate_params":{"query":"clamp(1 - sum(vllm:num_requests_running{inference_pool=\"POOL_NAME\"})/SAT_CAP, 0, 1)","fallback":"1"}}

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  metrics:
    enabled: true
  podMonitor:
    enabled: true
    interval: "15s"
  modelServerMonitor:
    enabled: false
  prometheusRule:
    enabled: true
  grafana:
    dashboards:
      enabled: true
