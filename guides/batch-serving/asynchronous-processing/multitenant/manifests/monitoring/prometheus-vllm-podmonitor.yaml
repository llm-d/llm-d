# Prometheus Operator PodMonitor that scrapes the vLLM model server so the
# self-hosted Prometheus has vllm:num_requests_running for the saturation gates.
#
# The vLLM pod is this guide's model server overlay (modelserver/), labelled
# llm-d.ai/guide=async-multitenant, with metrics on the `modelserver` port
# (8000). The saturation overlays' PromQL filters on inference_pool, which the
# pods do not carry, so this monitor sets it on every series to the guide's
# InferencePool, llm-d-router (POOL_NAME in the saturation overlays).
#
# Apply it into the model server's namespace with -n: with no
# namespaceSelector it watches only its own namespace. The Prometheus from
# install-prometheus-grafana.sh picks up PodMonitors in every namespace in its
# default (central) mode; in its namespace-scoped mode (-i) the PodMonitor and
# its namespace also need the monitoring-ns=<monitoring namespace> label.
# Adjust selector / port for your own model server.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-model-server
  labels:
    app: vllm-model-server
spec:
  selector:
    matchLabels:
      llm-d.ai/guide: async-multitenant
  podMetricsEndpoints:
    - port: modelserver
      path: /metrics
      interval: 15s
      relabelings:
        - targetLabel: inference_pool
          replacement: llm-d-router
