# InferenceObjectives mapping llm-d-async tier-priority lanes to llm-d-router Flow Control priority bands.
#
# Lane -> Objective -> Priority:
#   reserved-interactive -> priority 100
#   reserved-async       -> priority 60
#   reserved-batch       -> priority 30
#   overflow-interactive -> priority 10
#   overflow-async       -> priority -5   (negative: sheddable, evictable)
#   overflow-batch       -> priority -10  (negative: sheddable, evictable)
#
# Each objective targets the InferencePool the guide's router release creates,
# llm-d-router, through spec.poolRefs. To feed several pools in the same
# namespace, list them all in poolRefs, or select them with spec.poolSelector.
# InferenceObjective llm-d.ai/v1 is served by llm-d-router v1.0.0 and later.
# Apply into the router's namespace with -n.
apiVersion: llm-d.ai/v1
kind: InferenceObjective
metadata:
  name: reserved-interactive
  labels:
    llm-d.ai/guide: "multitenant"
    llm-d.ai/tier: "interactive"
    llm-d.ai/classification: "reserved"
spec:
  priority: 100
  poolRefs:
    - name: llm-d-router
---
apiVersion: llm-d.ai/v1
kind: InferenceObjective
metadata:
  name: reserved-async
  labels:
    llm-d.ai/guide: "multitenant"
    llm-d.ai/tier: "async"
    llm-d.ai/classification: "reserved"
spec:
  priority: 60
  poolRefs:
    - name: llm-d-router
---
apiVersion: llm-d.ai/v1
kind: InferenceObjective
metadata:
  name: reserved-batch
  labels:
    llm-d.ai/guide: "multitenant"
    llm-d.ai/tier: "batch"
    llm-d.ai/classification: "reserved"
spec:
  priority: 30
  poolRefs:
    - name: llm-d-router
---
apiVersion: llm-d.ai/v1
kind: InferenceObjective
metadata:
  name: overflow-interactive
  labels:
    llm-d.ai/guide: "multitenant"
    llm-d.ai/tier: "interactive"
    llm-d.ai/classification: "overflow"
spec:
  priority: 10
  poolRefs:
    - name: llm-d-router
---
apiVersion: llm-d.ai/v1
kind: InferenceObjective
metadata:
  name: overflow-async
  labels:
    llm-d.ai/guide: "multitenant"
    llm-d.ai/tier: "async"
    llm-d.ai/classification: "overflow"
spec:
  priority: -5
  poolRefs:
    - name: llm-d-router
---
apiVersion: llm-d.ai/v1
kind: InferenceObjective
metadata:
  name: overflow-batch
  labels:
    llm-d.ai/guide: "multitenant"
    llm-d.ai/tier: "batch"
    llm-d.ai/classification: "overflow"
spec:
  priority: -10
  poolRefs:
    - name: llm-d-router
