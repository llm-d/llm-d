# Prometheus Operator PodMonitor that scrapes the vLLM model server so the
# self-hosted Prometheus has vllm:num_requests_running for the saturation gates.
#
# The vLLM pod is optimized-baseline's GPU vLLM overlay, relabelled
# llm-d.ai/guide=async-multitenant (README step 1), with metrics on the
# `modelserver` port (8000). The saturation overlays' PromQL filters on
# inference_pool, which this monitor sets to the guide's single pool,
# llm-d-router; the pods themselves carry no such label.
#
# Apply it into the model server's namespace (kubectl apply -n ${NAMESPACE}):
# with no namespaceSelector it watches only its own namespace. The
# Prometheus from install-prometheus-grafana.sh picks up PodMonitors in every
# namespace. Adjust selector / port for your own model server.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-model-server
  labels:
    app: vllm-model-server
spec:
  selector:
    matchLabels:
      llm-d.ai/guide: async-multitenant
  podMetricsEndpoints:
    - port: modelserver
      path: /metrics
      interval: 15s
      relabelings:
        - targetLabel: inference_pool
          replacement: llm-d-router
