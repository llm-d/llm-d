apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  template:
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: modelserver
        command: ["vllm", "serve"]
        # --omni loads vLLM-Omni's default Qwen3-Omni deploy config: the
        # thinker stage on GPU 0, the talker and code2wav stages on GPU 1.
        # Explicit CLI flags override it, so don't add --tensor-parallel-size.
        args:
        - "Qwen/Qwen3-Omni-30B-A3B-Instruct"
        - "--omni"
        - "--trust-remote-code"
        - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
        - "--log-stats"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: llm-d-hf-token
              key: HF_TOKEN
              optional: true
        resources:
          limits:
            cpu: '16'
            memory: 128Gi
            # Qwen3-Omni's default deploy config uses 2 GPUs (devices 0 and 1).
            nvidia.com/gpu: 2
          requests:
            cpu: '8'
            memory: 96Gi
            nvidia.com/gpu: 2
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /.cache
          name: torch-compile-cache
        - mountPath: /.triton
          name: triton-cache
        - mountPath: /.config
          name: vllm-config
        startupProbe:
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 120
        livenessProbe:
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: torch-compile-cache
        emptyDir: {}
      - name: triton-cache
        emptyDir: {}
      - name: vllm-config
        emptyDir: {}
