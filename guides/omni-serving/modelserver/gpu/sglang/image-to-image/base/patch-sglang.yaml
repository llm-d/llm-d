apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 3
  template:
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: modelserver
          command: ["sglang", "serve"]
          args:
            - "--model-path=Qwen/Qwen-Image-Edit-2511"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--num-gpus=1"
            - "--ulysses-degree=1"
            - "--ring-degree=1"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
                  optional: true
          resources:
            limits:
              cpu: '16'
              memory: 128Gi
              nvidia.com/gpu: 1
            requests:
              cpu: '8'
              memory: 96Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /.cache
              name: sglang-cache
            - mountPath: /.triton
              name: triton-cache
          startupProbe:
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: sglang-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
