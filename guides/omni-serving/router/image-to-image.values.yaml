## omni-serving guide overrides for the llm-d router, TASK=image-to-image (/v1/images/edits).
## Layer on top of: recipes/router/base.values.yaml
##
## Load-based routing: a generation request's cost does not follow its
## prompt length and leaves no prefix or KV cache to match, so the router
## prefers the endpoint with the fewest requests it has dispatched and not
## yet seen complete (active-request-scorer). The router tracks those
## counts itself, so the data layer scrapes no model server metrics
## (injectDefaults: false): SGLang's diffusion backend publishes none.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  inferencePool:
    failureMode: FailOpen

  epp:
    pluginsConfigFile: "i2i.yaml"
    pluginsCustomConfig:
      i2i.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - name: activeRequest
          type: active-request-scorer
        - name: maxScore
          type: max-score-picker
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: activeRequest
          - pluginRef: maxScore
        dataLayer:
          injectDefaults: false

  modelServers:
    matchLabels:
      llm-d.ai/guide: "omni-serving"
    protocol: http
