# Dedicated ServiceAccount whose token KEDA borrows to authenticate to Thanos
# Querier on OpenShift. Inlined here (rather than pulled from the shared
# recipes/autoscaling/metrics-reader component) because this overlay is
# namespace-agnostic: it carries no `namespace:` transformer, so it cannot use
# the component's transformer-dependent ClusterRoleBinding. The matching
# cluster-monitoring-view binding is created imperatively in the guide's RBAC
# step.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-epp-metrics-reader
