# OpenShift overlay for the FMA + KEDA saturation autoscaling guide.
#
# On OpenShift, metrics live in Thanos Querier, whose :9091 endpoint rejects
# unauthenticated queries with a 401 -- and KEDA suppresses that error and
# silently serves `fallback` replicas, so an unauthenticated trigger looks
# healthy while autoscaling does nothing. This overlay makes the saturation path
# work on OpenShift by:
#   - pointing both triggers at Thanos Querier and enabling bearer auth, and
#   - provisioning a dedicated metrics-reader ServiceAccount + token Secret and
#     repointing the TriggerAuthentication at that token. On OpenShift the
#     service-ca operator injects `service-ca.crt` (the CA that signs Thanos's
#     serving cert) into the token Secret automatically -- so the guide's manual
#     prometheus-token copy step is not needed on OpenShift.
#
# NOTE: the PromQL label selectors inside the trigger queries are opaque strings
# kustomize cannot reach -- edit inference_pool / model_name in
# ../../base/scaledobject.yaml to match your EPP pool and model.
#
# Build:  kubectl kustomize guides/fast-model-actuation-keda/keda/overlays/ocp
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # EPP -> user-workload-monitoring scrape path (the standalone router chart
  # ships no ServiceMonitor): make the pool-saturation metric reach Thanos. The
  # SA's token authorizes the scrape; the matching /metrics-reader CRB is
  # imperative in the RBAC step.
  - epp-servicemonitor.yaml
  - epp-metrics-reader-serviceaccount.yaml
  - epp-metrics-reader-token.yaml
  - keda-metrics-reader-serviceaccount.yaml
  - keda-metrics-reader-token.yaml

patches:
  # Repoint the TriggerAuthentication from the bundled-Prometheus prometheus-token
  # secret to the auto-provisioned ServiceAccount token Secret. On OpenShift its
  # `service-ca.crt` is the CA that signs the Thanos serving cert (the base's
  # ca.crt is the bundled-Prometheus CA and does not verify Thanos).
  - patch: |-
      - op: replace
        path: /spec/secretTargetRef
        value:
          - parameter: bearerToken
            name: keda-epp-metrics-reader-token
            key: token
          - parameter: ca
            name: keda-epp-metrics-reader-token
            key: service-ca.crt
    target:
      kind: TriggerAuthentication
      name: prometheus-auth
  # Point both triggers at Thanos Querier and enable bearer authentication.
  - patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/serverAddress
        value: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
      - op: add
        path: /spec/triggers/0/metadata/authModes
        value: "bearer"
      - op: replace
        path: /spec/triggers/1/metadata/serverAddress
        value: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
      - op: add
        path: /spec/triggers/1/metadata/authModes
        value: "bearer"
    target:
      kind: ScaledObject
      name: fast-model-actuation-keda-saturation
