# Dedicated ServiceAccount whose token user-workload-monitoring uses to scrape
# the EPP's authenticated /metrics endpoint. A dedicated in-set SA (rather than
# the EPP's own helm-managed SA) lets the overlay's namespace transformer fill
# the ClusterRoleBinding subject namespace; the EPP authorizes any token whose
# SA holds `get` on the /metrics nonResourceURL.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fast-model-actuation-keda-epp-metrics-reader
