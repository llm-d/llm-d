apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../workload-autoscaling/keda-epp-saturation/optimized-baseline/base

patches:
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: optimized-baseline-nvidia-gpu-vllm-decode-saturation
    patch: |-
      - op: replace
        path: /metadata/name
        value: fast-model-actuation-keda-queue
      - op: replace
        path: /metadata/labels/app
        value: fma-requester
      - op: replace
        path: /spec/scaleTargetRef/name
        value: fma-requester
      - op: replace
        path: /spec/minReplicaCount
        value: 0
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
      - op: add
        path: /spec/cooldownPeriod
        value: 300
      - op: add
        path: /spec/advanced
        value:
          horizontalPodAutoscalerConfig:
            behavior:
              scaleUp:
                stabilizationWindowSeconds: 0
                policies:
                  - type: Percent
                    value: 100
                    periodSeconds: 15
              scaleDown:
                stabilizationWindowSeconds: 300
                policies:
                  - type: Percent
                    value: 100
                    periodSeconds: 15
      - op: replace
        path: /spec/triggers/0/name
        value: flow-control-queue
      - op: replace
        path: /spec/triggers/0/metadata/query
        value: |
          sum(llm_d_epp_flow_control_queue_size{inference_pool="fast-model-actuation-keda"})
      - op: replace
        path: /spec/triggers/0/metadata/threshold
        value: "5"
      - op: remove
        path: /spec/triggers/1
