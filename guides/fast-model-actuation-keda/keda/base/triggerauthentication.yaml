# KEDA TriggerAuthentication for Prometheus bearer token access.
#
# References the Prometheus ServiceAccount token secret (bearer token + CA cert).
# The guide's `keda` deploy step copies this secret (`prometheus-token`) from the
# monitoring namespace into the workload namespace before applying the ScaledObject.

apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: prometheus-auth
spec:
  secretTargetRef:
  - parameter: bearerToken
    name: prometheus-token
    key: token
  - parameter: ca
    name: prometheus-token
    key: ca.crt
