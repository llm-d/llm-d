# KEDA ScaledObject: saturation autoscaling of the FMA requester Deployment.
#
# Adapted from the workload-autoscaling/keda-epp-saturation guide, which scales a
# plain vLLM server Deployment on the same EPP flow-control signal. The saturation
# mechanism is reused as-is (the llm_d_epp_flow_control_pool_saturation metric, the
# flowControl-gated EPP, and the prometheus trigger shape); the FMA-specific
# changes are:
#   - scaleTargetRef is the GPU-reserving `fma-requester` Deployment, not the vLLM
#     server -- scaling a requester is what drives an FMA hot/warm start.
#   - maxReplicaCount is capped at LauncherConfig.spec.maxInstances (see below),
#     because each requester replica needs a launcher slot to bind.
#   - the advanced.behavior block below (fast scale-up, gentle scale-down) is added
#     so scale-up triggers hot-wakes promptly and scale-down lets the vacated
#     instances sleep rather than tear down.
#
# KEDA scales `fma-requester` on EPP flow-control metrics. On scale-up the FMA
# controllers hot-wake a sleeping vLLM (seconds) or warm-create a new vLLM on an
# existing launcher; on scale-down the vacated instances sleep.
#
# Before applying, review:
#   - inference_pool label in the pool-saturation query. This is the InferencePool
#     name, which the standalone router chart derives from the helm release name.
#     This guide installs the router as `helm install ${GUIDE_NAME}`, so the pool
#     is "fast-model-actuation-keda". Confirm with `kubectl get inferencepool -n $NS`.
#   - model_name label in the running-requests query (must match ${MODEL})
#   - serverAddress on BOTH triggers (see overlays/ocp for the OpenShift value)
#   - minReplicaCount / maxReplicaCount / thresholds to suit your model & budget
#
# Every trigger MUST carry a non-empty serverAddress. KEDA creates its own HPA
# from this ScaledObject -- do NOT apply a separate hpa.yaml.

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fast-model-actuation-keda-saturation
  labels:
    app: fma-requester
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fma-requester
  minReplicaCount: 1
  # Cap scale-out at the launcher pool's capacity. Each fma-requester replica
  # reserves one GPU and drives exactly one vLLM instance, so maxReplicaCount
  # must not exceed LauncherConfig.spec.maxInstances (2) -- extra requesters
  # would have no launcher slot to bind and sit idle holding a GPU. It must
  # also not exceed the number of GPUs available to this namespace. Raise all
  # three together (maxInstances, GPU count, this value) to scale further.
  maxReplicaCount: 2
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      # Fast scale-up (hot-wakes should happen promptly), gentle scale-down so
      # instances are not torn down on brief dips in saturation.
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
  - type: prometheus
    name: pool-saturation
    metadata:
      # Generic k8s with the bundled llm-d Prometheus stack. OpenShift users:
      # apply overlays/ocp, which patches this to thanos-querier.
      serverAddress: "https://llmd-kube-prometheus-stack-prometheus.llm-d-monitoring.svc.cluster.local:9090"
      query: |
        max(llm_d_epp_flow_control_pool_saturation{inference_pool="fast-model-actuation-keda"})
      # Scale out before full saturation. Recommended 0.7-0.8.
      threshold: "0.7"
      activationThreshold: "0"
      metricType: AverageValue
      unsafeSsl: "false"
    authenticationRef:
      name: prometheus-auth
  - type: prometheus
    name: running-requests
    metadata:
      serverAddress: "https://llmd-kube-prometheus-stack-prometheus.llm-d-monitoring.svc.cluster.local:9090"
      query: |
        sum(llm_d_epp_request_running{model_name="Qwen/Qwen3-32B"})
      # Target running requests per replica.
      threshold: "16"
      activationThreshold: "0"
      metricType: AverageValue
      unsafeSsl: "false"
    authenticationRef:
      name: prometheus-auth
