apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../fast-model-actuation/modelserver

patches:
  # The base fast-model-actuation ISC already serves Qwen3-0.6B with the same
  # options and llm-d.ai/model label, so the only remaining delta is the guide
  # label (used by the router/ServiceMonitor selectors and by benchmark
  # bookkeeping). Merge just that key; the rest of the ISC is inherited verbatim.
  - target:
      kind: InferenceServerConfig
      name: fma-isc
    patch: |-
      apiVersion: fma.llm-d.ai/v1alpha1
      kind: InferenceServerConfig
      metadata:
        name: fma-isc
      spec:
        modelServerConfig:
          labels:
            llm-d.ai/guide: "fast-model-actuation-keda"
  - target:
      kind: Deployment
      name: fma-requester
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fma-requester
        labels:
          llm-d.ai/guide: fast-model-actuation-keda
      spec:
        replicas: 1
        template:
          metadata:
            labels:
              llm-d.ai/guide: fast-model-actuation-keda
