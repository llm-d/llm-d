apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MiniMax-M2.7 on four Rebellions NPUs: one vLLM server per data-parallel rank,
# started with the tool-calling flags agentic-api needs.
resources:
  - ../../../../../recipes/modelserver/base/single-host/default
  - resource-claim-template.yaml

namePrefix: agentic-api-npu-vllm-

components:
  - ../../../../../recipes/modelserver/components/images/npu-vllm/release

labels:
  - pairs:
      llm-d.ai/guide: agentic-api
      llm-d.ai/model: MiniMax-M2.7
      llm-d.ai/accelerator-variant: npu
      llm-d.ai/accelerator-vendor: rebellions
    includeSelectors: true
    includeTemplates: true

patches:
  - path: patch-vllm.yaml
