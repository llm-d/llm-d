apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentic-api-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-api-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-api-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: agentic-api-postgres
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: agentic_api
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentic-api-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "agentic_api"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentic-api-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-api-postgres
spec:
  selector:
    app: agentic-api-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
