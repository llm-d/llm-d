apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-coordinator-config
data:
  coordinator.yaml: |
    log_level: 2
    server:
      listen_addr: ":8080"
      secure_coordinator: false
      read_timeout: 30s
      write_timeout: 300s
    gateway:
      address: "${GATEWAY_ADDRESS}"
      max_idle_conns_per_host: 100
      idle_conn_timeout: 90s
      timeout: 60s
    pipeline:
      kv_connector: kv-nixl
      steps:
        - type: prefill
        - type: decode