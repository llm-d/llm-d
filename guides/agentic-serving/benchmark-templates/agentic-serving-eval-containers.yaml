# ---------------------------------------------------------------------------
# eval-containers workload template for the agentic-serving guide.
#
# Complements the inference-perf templates in this directory rather than
# replacing them. Where inference-perf measures how FAST the stack serves a
# synthetic agentic load (TTFT/ITL/throughput), this drives a REAL coding agent
# (aider-polyglot / gemini-cli) against the deployed endpoint and scores whether
# it actually solved the tasks. The guide's README names that gap explicitly:
# "Replaying complete agent dependency graphs ... remains a separate evaluation
# mode."
#
# It catches a class of regression a load generator cannot see -- a broken
# tool-call parser, reasoning traces leaking into content, or truncation
# mid-solution -- each of which leaves throughput healthy while the agent
# silently fails every task.
#
# Render with `envsubst < agentic-serving-eval-containers.yaml > config.yaml`
# AFTER exporting the variables below. Any unset variable renders as an empty
# string, producing invalid or semantically wrong YAML -- so set all of them
# first.
#
# Per-run variables:
#   TASKS          int  benchmark tasks to run. aider-polyglot has 50. One agent
#                       pod per task, so this is also the GPU fan-out: size it
#                       off free accelerators, not off the task count.
#   EVAL_TIMEOUT   int  per-task agent wall-clock cap (seconds). 1500 suits a
#                       hybrid-reasoning model at 32k; the image default of 300
#                       kills verbose models mid-edit.
#
# Environment variables (set by earlier guide steps):
#   NAMESPACE      namespace where the stack is deployed
#   IP             EPP service ClusterIP (base_url = http://${IP})
#   BENCHMARK_PVC  PVC name where benchmark results are stored
#   MODEL          served model handle, exactly as the stack serves it
# ---------------------------------------------------------------------------
endpoint:
  stack_name: &stack_name agentic-serving-eval-containers  # user defined name for the stack (results prefix)
  # ${MODEL} rather than a literal handle, unlike the inference-perf templates
  # beside this one. That is deliberate, not an omission: the eval harness reads
  # the served model from the deployment itself
  # (`EVAL_MODEL="${LLMDBENCH_DEPLOY_CURRENT_MODEL:?}"`), so one template covers
  # every model the guide serves -- Nemotron-3-Ultra, GLM-5.2, Qwen3-Coder-480B,
  # or a smaller model chosen to keep a nightly cheap. Export MODEL to exactly
  # the handle the stack serves; a mismatch surfaces as a 404 on every agent
  # call, which scores as reward 0.0 rather than as an error.
  model: &model ${MODEL}
  namespace: &namespace ${NAMESPACE}  # Namespace where stack is deployed
  base_url: &url http://${IP}  # Base URL of inference endpoint (EPP service ClusterIP)
  hf_token_secret: llm-d-hf-token     # The name of secret that contains the HF token of the stack

control:
  work_dir: $HOME/llm-d-bench-work  # working directory to store temporary and autogenerated files.
                                    # Do not edit content manually.
                                    # If not set, a temp directory will be created.
  kubectl: kubectl                  # kubectl command: kubectl or oc

harness:
  name: &harness_name eval-containers
  results_pvc: ${BENCHMARK_PVC}   # PVC where benchmark results are stored
  namespace: *namespace           # Namespace where harness is deployed. Typically with stack.
  # One agent pod per task. Unlike inference-perf, which drives concurrency from
  # inside a single launcher, the eval fans out: parallelism IS the task count.
  parallelism: ${TASKS}
  wait_timeout: 0                 # 0 disables the launcher timeout; per-task
                                  # capping is EVAL_TIMEOUT below, since a task
                                  # that stalls should not fail the whole run.
  # The agent+grader image, NOT llm-d-benchmark: it ships the agent, the task
  # set, and the verifier. A generic benchmark image has no /entrypoint.sh and
  # the harness container exits 127 having produced no artifacts.
  image: ghcr.io/exgentic/evals/aider-polyglot--gemini-cli-standalone:latest

env:
  # Per-task agent wall-clock timeout, read by the image's run-agent
  # (`timeout $EVAL_TIMEOUT`).
  - name: EVAL_TIMEOUT
    value: "${EVAL_TIMEOUT}"
  # Force the OpenAI wire. gemini-cli natively speaks the Gemini v1beta protocol
  # (`/v1beta/models/<model>:generateContent`), but llm-d/vLLM serves the OpenAI
  # wire only. Without this the in-pod gateway renders its native-routing mode
  # and every call fails with "no parser registered matching path suffix"; the
  # agent then writes a stub solution and the task scores 0, which reads as a
  # model-quality failure rather than a transport one.
  - name: EVAL_MODEL_API
    value: openai

workload:                         # yaml configuration for harness workload(s)
  Agentic_Eval:
    harness: *harness_name
    benchmark: aider-polyglot
    description: "Exercism polyglot code-editing -- 6 languages, 50 tasks, fully offline, 2-attempt (agent gets test feedback on first failure)."
    tasks: ${TASKS}
    internet: false               # aider-polyglot runs fully offline.
    model: *model
    endpoint: *url
    report:
      # reward is the benchmark's own score (fraction of tasks solved). Report it
      # per task as well as in summary: a uniform 0.0 across all tasks means a
      # transport or parser fault, whereas a spread means genuine task difficulty.
      reward:
        summary: true
        per_task: true
    storage:
      local_storage:
        path: /workspace
