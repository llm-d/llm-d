# ---------------------------------------------------------------------------
# Concurrency SWEEP variant of otel-trace-replay.yaml.
#
# Render with `envsubst < otel-trace-replay.yaml > config.yaml` AFTER exporting
# the variables below. Any unset variable renders as an empty string, producing
# invalid or semantically wrong YAML — so set all of them first.
#
# Runs multiple concurrency points as sequential STAGES in a single job. The
# trace_session_replay load generator keeps a session cursor that advances per
# stage, so each stage consumes a distinct, successive slice of the corpus —
# and, because base_seed is fixed, the SAME config run for Fairness vs
# No-Fairness sees the identical session slice at each concurrency point (clean
# per-point A/B). `report.request_lifecycle.per_stage: true` emits metrics per
# point, so one job yields a full "metric vs concurrency" curve per arm.
#
# Sweeps concurrency 200 → 1000 (the saturating band). concurrent_sessions is the contention knob; session_rate scales
# with it (constant ramp) and num_sessions = 3x holds steady-state concurrency. On a 4-instance pool (aggregate maxConcurrency 4x133=532) with a plain engine (no
# prefix-cache/offload), the pool saturates in the upper stages and program-aware fairness engages.
#
# Environment variables (set by earlier guide steps):
#   GUIDE_NAME   stack name; forms the EPP service host (${GUIDE_NAME}-epp)
#   NAMESPACE    namespace where the stack is deployed
# ---------------------------------------------------------------------------
api:
  type: chat
  streaming: true
  session_id_header_key: "x-claude-code-session-id"  # header the EPP reads to route a session to a consistent replica

data:
  type: otel_trace_replay
  otel_trace_replay:
    hf_dataset_path: "Exgentic/agent-llm-traces-v2"                  # HuggingFace dataset of recorded agentic traces (~10k)
    use_static_model: true                                          # ignore each trace's recorded model, use static_model_name below
    static_model_name: "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8"  # model to replay against. Must match stack deployed.
    default_max_tokens: 25000        # cap when a trace event has no recorded max_tokens
    include_errors: false            # skip trace events that recorded an error
    skip_invalid_files: true         # tolerate unparseable trace files instead of aborting
    bad_tool_call_handling: use_recorded  # on malformed tool calls, replay the recorded call as-is

load:
  type: trace_session_replay
  base_seed: 42            # fixed RNG seed so every arm sees the identical session slice per point (per-point A/B)
  num_workers: 8           # parallel replay workers
  request_timeout: 1800    # per-request timeout (seconds)
  worker_max_concurrency: 12000  # ceiling on in-flight requests per worker
  # Concurrency sweep. concurrent_sessions = the load (contention) knob; session_rate scales with it
  # (concurrent/10) for a constant ~10s ramp-in at every point; num_sessions = 3x concurrent so
  # completed sessions are replaced and steady-state concurrency is HELD for a real measurement
  # window (not a momentary peak). Sum of num_sessions (6000) < corpus (~10k), so no duplication.
  stages:
    - concurrent_sessions: 200
      session_rate: 20
      num_sessions: 600
    - concurrent_sessions: 400
      session_rate: 40
      num_sessions: 1200
    - concurrent_sessions: 600
      session_rate: 60
      num_sessions: 1800
    - concurrent_sessions: 800
      session_rate: 80
      num_sessions: 2400
    - concurrent_sessions: 1000
      session_rate: 80
      num_sessions: 3000

server:
  type: vllm
  model_name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8       # Exact HuggingFace model name. Must match stack deployed.
  base_url: http://${GUIDE_NAME}-epp.${NAMESPACE}.svc.cluster.local  # EPP service URL for the deployed stack

storage:
  local_storage:
    path: "/data/reports"   # where benchmark results are written inside the harness pod

report:
  request_lifecycle:
    summary: true            # aggregate metrics across the whole run
    per_stage: true          # per-concurrency-point metrics = the sweep curve
    per_request: false       # omit per-request rows (keeps report small)
  session_lifecycle:
    per_session: true        # per-session metrics (session-level TTFT, turns, etc.)
