api:
  type: chat
  streaming: true
  session_id_header_key: "x-claude-code-session-id"

data:
  type: otel_trace_replay
  otel_trace_replay:
    hf_dataset_path: "Exgentic/agent-llm-traces"
    use_static_model: true
    static_model_name: "Qwen/Qwen3.6-35B-A3B"
    default_max_tokens: 200
    include_errors: false
    skip_invalid_files: true

load:
  type: trace_session_replay
  base_seed: 42
  num_workers: 8
  request_timeout: 900
  stages:
    - concurrent_sessions: 600
      num_sessions: 1000
      session_rate: 10
  worker_max_concurrency: 12000

server:
  type: vllm
  model_name: Qwen/Qwen3.6-35B-A3B
  base_url: http://${GUIDE_NAME}-epp.${NAMESPACE}.svc.cluster.local

storage:
  local_storage:
    path: "/data/reports"

report:
  request_lifecycle:
    summary: true
    per_stage: false
    per_request: false
  session_lifecycle:
    per_session: true