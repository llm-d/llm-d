apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../recipes/modelserver/base/single-host/default

namePrefix: agentic-serving-tpu-vllm-

components:
  - ../../../../recipes/modelserver/components/images/tpu-vllm

labels:
