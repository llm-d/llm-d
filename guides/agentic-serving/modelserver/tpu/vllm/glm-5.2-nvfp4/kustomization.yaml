apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: agentic-serving-tpu-vllm-glm-5.2-nvfp4-

components:
  - ../../../../../recipes/modelserver/components/images/torch-tpu-vllm/release

labels:
  - pairs:
      llm-d.ai/guide: agentic-serving
      llm-d.ai/model: GLM-5.2-NVFP4
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
      llm-d.ai/backend: torch-tpu
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
