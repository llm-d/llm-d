apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "deepseek-ai/DeepSeek-V4-Flash"
            - "--port=8000"
            - "--tensor-parallel-size=1"
            - "--data-parallel-size=8"
            - "--data-parallel-size-local=8"
            - "--enable-expert-parallel"
            - "--quantization=deepseek_v4_fp8"
            - "--kv-cache-dtype=fp8_e4m3"
            - "--max-model-len=32768"
            - "--enable-prefix-caching"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=deepseek_v3"
            - "--trust-remote-code"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
          env:
            - name: TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS
              value: "false"
            - name: TORCHINDUCTOR_AUTOGRAD_CACHE
              value: "0"
            - name: VLLM_TARGET_DEVICE
              value: "tpu"
            - name: PJRT_DEVICE
              value: "TPU"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  key: HF_TOKEN
                  name: llm-d-hf-token
                  optional: true
          resources:
            limits:
              google.com/tpu: "4"
            requests:
              google.com/tpu: "4"
