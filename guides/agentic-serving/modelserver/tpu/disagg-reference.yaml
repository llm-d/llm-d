# Reference deployment manifests for experimental TPU v7 P/D Disaggregation
# Apply with: kubectl apply -f disagg-reference.yaml -n ${NAMESPACE}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-sa
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-vllm-p
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-vllm-d
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
# 1. PREFILL DEPLOYMENT & SERVICE (kv_producer)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-prefill
  labels:
    app: vllm-prefill
    llm-d.ai/inference-serving: "true"
spec:
  replicas: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-prefill
      llm-d.ai/inference-serving: "true"
  template:
    metadata:
      labels:
        app: vllm-prefill
        llm-d.ai/inference-serving: "true"
    spec:
      serviceAccountName: vllm-sa
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      containers:
      - name: vllm-tpu
        image: vllm/vllm-tpu:nightly-20260403-350d385-d9408ff
        imagePullPolicy: Always
        command: [ "/bin/bash", "-c", "--" ]
        args: 
        - vllm serve --seed=42 --model=gs://vllm-tpu7x-gcsfuse-test/Qwen3-Coder-480B-A35B-Instruct-FP8 --served-model-name=Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8 --load-format=runai_streamer --max-model-len=65536 --max-num-batched-tokens=8192 --max-num-seqs=64 --no-enable-prefix-caching --tensor-parallel-size=8 --kv-cache-dtype=fp8 --gpu-memory-utilization=0.80 --async-scheduling --enable-expert-parallel --block-size=256 --kv-transfer-config '{"kv_connector":"TPUConnector","kv_connector_module_path":"tpu_inference.distributed.tpu_connector","kv_role":"kv_producer"}'
        env:
        - name: VLLM_LOGGING_LEVEL
          value: DEBUG
        - name: MODEL_IMPL_TYPE
          value: vllm
        - name: USE_BATCHED_RPA_KERNEL
          value: "1"
        - name: JAX_PLATFORMS
          value: tpu,cpu
        - name: TPU_BACKEND_TYPE
          value: jax
        - name: PJRT_DEVICE
          value: TPU
        - name: USE_MOE_EP_KERNEL
          value: "0"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: llm-d-hf-token
              key: HF_TOKEN
        - name: HF_HOME
          value: /usr/vllm
        - name: TPU_MAX_HOST_KV_BUFFER_SIZE
          value: "4"
        ports:
        - containerPort: 8000
        resources:
          limits:
            google.com/tpu: "4"
            memory: "900Gi"
            cpu: "220"
            ephemeral-storage: "40Gi"
          requests:
            google.com/tpu: "4"
            memory: "900Gi"
            cpu: "220"
            ephemeral-storage: "40Gi"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /usr/vllm
          name: pvc-vllm-vol
        - mountPath: /root/.cache
          name: pvc-vllm-vol
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: pvc-vllm-vol
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service-prefill
spec:
  type: ClusterIP
  selector:
    app: vllm-prefill
  ports:
  - port: 8000
    targetPort: 8000
---
# 2. DECODE DEPLOYMENT & SERVICE (kv_consumer)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-decode
  labels:
    app: vllm-decode
    llm-d.ai/inference-serving: "true"
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-decode
      llm-d.ai/inference-serving: "true"
  template:
    metadata:
      labels:
        app: vllm-decode
        llm-d.ai/inference-serving: "true"
    spec:
      serviceAccountName: vllm-sa
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      containers:
      - name: vllm-tpu
        image: vllm/vllm-tpu:nightly-20260403-350d385-d9408ff
        imagePullPolicy: Always
        command: [ "/bin/bash", "-c", "--" ]
        args: 
        - vllm serve --seed=42 --model=gs://vllm-tpu7x-gcsfuse-test/Qwen3-Coder-480B-A35B-Instruct-FP8 --served-model-name=Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8 --load-format=runai_streamer --max-model-len=65536 --max-num-batched-tokens=8192 --max-num-seqs=64 --no-enable-prefix-caching --tensor-parallel-size=8 --kv-cache-dtype=fp8 --gpu-memory-utilization=0.80 --async-scheduling --enable-expert-parallel --block-size=256 --kv-transfer-config '{"kv_connector":"TPUConnector","kv_connector_module_path":"tpu_inference.distributed.tpu_connector","kv_role":"kv_consumer"}'
        env:
        - name: VLLM_LOGGING_LEVEL
          value: DEBUG
        - name: MODEL_IMPL_TYPE
          value: vllm
        - name: USE_BATCHED_RPA_KERNEL
          value: "1"
        - name: JAX_PLATFORMS
          value: tpu,cpu
        - name: TPU_BACKEND_TYPE
          value: jax
        - name: PJRT_DEVICE
          value: TPU
        - name: USE_MOE_EP_KERNEL
          value: "0"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: llm-d-hf-token
              key: HF_TOKEN
        - name: HF_HOME
          value: /usr/vllm
        - name: TPU_MAX_HOST_KV_BUFFER_SIZE
          value: "4"
        ports:
        - containerPort: 8000
        resources:
          limits:
            google.com/tpu: "4"
            memory: "900Gi"
            cpu: "220"
            ephemeral-storage: "40Gi"
          requests:
            google.com/tpu: "4"
            memory: "900Gi"
            cpu: "220"
            ephemeral-storage: "40Gi"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /usr/vllm
          name: pvc-vllm-vol
        - mountPath: /root/.cache
          name: pvc-vllm-vol
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: pvc-vllm-vol
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service-decode
spec:
  type: ClusterIP
  selector:
    app: vllm-decode
  ports:
  - port: 8000
    targetPort: 8000
---
# 3. PROXY SERVER DEPLOYMENT & SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-disagg-proxy
  labels:
    app: vllm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-proxy
  template:
    metadata:
      labels:
        app: vllm-proxy
    spec:
      containers:
      - name: proxy-container
        image: vllm/vllm-tpu:nightly-20260403-350d385-d9408ff
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
          - |
            python3 -c "import uvicorn, runpy; old_run = uvicorn.run; uvicorn.run = lambda *a, **kw: old_run(*a, **{**kw, 'timeout_keep_alive': 600}); runpy.run_path('examples/disagg/toy_proxy_server.py', run_name='__main__')" \
              --host 0.0.0.0 \
              --port 10000 \
              --prefiller-host vllm-service-prefill \
              --prefiller-port 8000 \
              --decoder-host vllm-service-decode \
              --decoder-port 8000 &
            echo "Proxy started. Ready for benchmark."
            tail -f /dev/null
        ports:
        - containerPort: 10000
        resources:
          requests:
            cpu: "8"
            memory: "16Gi"
          limits:
            cpu: "16"
            memory: "32Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-proxy-service
spec:
  type: ClusterIP
  selector:
    app: vllm-proxy
  ports:
  - port: 10000
    targetPort: 10000
