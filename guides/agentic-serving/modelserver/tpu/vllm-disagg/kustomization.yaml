apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../recipes/modelserver/base/single-host/pd/base
  - pvcs.yaml
  - services.yaml
  - proxy-deployment.yaml

namePrefix: agentic-serving-tpu-vllm-disagg-

images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: vllm/vllm-tpu
    newTag: nightly-20260403-350d385-d9408ff

labels:
  - pairs:
      llm-d.ai/guide: agentic-serving
      llm-d.ai/model: Qwen3-Coder-480B-A35B-Instruct-FP8
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
    includeSelectors: true
    includeTemplates: true

patches:
  - path: patch-prefill.yaml
    target:
      kind: Deployment
      name: prefill
  - path: patch-decode.yaml
    target:
      kind: Deployment
      name: decode
  - target:
      kind: Deployment
      name: decode
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8000
      - op: remove
        path: /spec/template/spec/containers/0/ports/1
  - target:
      kind: Deployment
      name: prefill
    patch: |
      - op: remove
        path: /spec/template/spec/containers/0/ports/1


