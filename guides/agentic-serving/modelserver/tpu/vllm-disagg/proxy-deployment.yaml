apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  labels:
    llm-d.ai/role: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/role: proxy
  template:
    metadata:
      labels:
        llm-d.ai/role: proxy
    spec:
      containers:
      - name: proxy-container
        image: REPLACE_MODEL_SERVER_IMAGE
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
          - |
            python3 -c "import uvicorn, runpy; old_run = uvicorn.run; uvicorn.run = lambda *a, **kw: old_run(*a, **{**kw, 'timeout_keep_alive': 600}); runpy.run_path('examples/disagg/toy_proxy_server.py', run_name='__main__')" \
              --host 0.0.0.0 \
              --port 10000 \
              --prefiller-host agentic-serving-tpu-vllm-disagg-prefill \
              --prefiller-port 8000 \
              --decoder-host agentic-serving-tpu-vllm-disagg-decode \
              --decoder-port 8000 &
            echo "Proxy started. Ready for benchmark."
            tail -f /dev/null
        ports:
        - containerPort: 10000
        resources:
          requests:
            cpu: "8"
            memory: "16Gi"
          limits:
            cpu: "16"
            memory: "32Gi"
