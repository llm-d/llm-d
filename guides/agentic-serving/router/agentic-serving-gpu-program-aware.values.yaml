## agentic-serving — PROGRAM-AWARE FAIRNESS (GPU, 4-instance / non-disaggregated) router overrides.
## Layer on top of: recipes/router/base.values.yaml
##
## A separate router config (kept out of the base configs so default deployments are unchanged) for
## the multi-session agentic workload on a 4-instance (TP=4 each) model-server pool. It combines two layers:
##   1. Scheduler scoring — the non-disaggregated subset of agentic-serving-gpu.values.yaml: a two-tier
##      prefix cache (on-GPU + CPU-offload producers/scorers, matching the model server's
##      OffloadingConnector), plus queue / kv-cache-utilization / active-request / no-hit-lru scorers.
##   2. Per-session fairness — the `agent-identity` plugin derives a FairnessID from the client session
##      header (x-claude-code-session-id / Claude Code, x-session-affinity / opencode, session-id /
##      Codex), and `program-aware-fairness` (LAS: Least-Attained-Service) flow control — gated by the
##      `concurrency-detector` saturation detector — gives each session its own queue so bursty sessions
##      cannot starve concurrent ones once the server saturates.
##
## Fairness arm of an A/B: the No-Fairness baseline is this same file with `agent-identity`,
## `concurrency-detector`, `program-aware-fairness`, and the `featureGates` / `flowControl` blocks
## removed (identical scorers, fairness off). Benchmarked on
## nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8 (4 instances, TP=4 each) with the
## Exgentic/agent-llm-traces replay (benchmark-templates/otel-trace-replay.yaml).
## See nemotron-3-super-120b-program-aware.md for deployment and results.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "agentic-serving-program-aware-plugins.yaml"
    pluginsCustomConfig:
      agentic-serving-program-aware-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        # --- per-session fairness ---
        - type: agent-identity
        # --- scoring / caching (non-disaggregated subset of agentic-serving-gpu.values.yaml) ---
        - type: no-hit-lru-scorer
        - type: approx-prefix-cache-producer
          name: gpu-prefix-cache-producer
        - type: approx-prefix-cache-producer
          name: cpu-prefix-cache-producer
          parameters:
            autoTune: false
            lruCapacityPerServer: 4000000
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: active-request-scorer
        - type: prefix-cache-scorer
          name: gpu-prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: gpu-prefix-cache-producer
        - type: prefix-cache-scorer
          name: cpu-prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: cpu-prefix-cache-producer
        # --- flow-control saturation detector + fairness policy ---
        - type: concurrency-detector
          parameters:
            maxConcurrency: 133   # PER-ENDPOINT (just above --max-num-seqs=128); the detector sums
                                  # this across all 4 instances, so pool capacity = 4 x 133 = 532.
        - type: program-aware-fairness
        featureGates:
        - flowControl
        flowControl:
          saturationDetector:
            pluginRef: concurrency-detector
          defaultPriorityBand:
            fairnessPolicyRef: program-aware-fairness
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: gpu-prefix-cache-scorer
            weight: 4
          - pluginRef: cpu-prefix-cache-scorer
            weight: 2
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: active-request-scorer
            weight: 2
          - pluginRef: no-hit-lru-scorer
            weight: 1

  modelServers:
    matchLabels:
      llm-d.ai/guide: "agentic-serving-gpu"
