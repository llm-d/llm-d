decode:
  containers:
  - args:
    - --kv-transfer-config
    - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
    - --disable-uvicorn-access-log
    env:
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
    - name: UCX_TLS
      value: cuda_ipc,cuda_copy,tcp
    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: VLLM_NIXL_SIDE_CHANNEL_PORT
      value: "5557"
    - name: VLLM_LOGGING_LEVEL
      value: INFO
    image: ghcr.io/llm-d/llm-d-cuda:v0.3.1
    livenessProbe:
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8200
      periodSeconds: 10
      timeoutSeconds: 5
    modelCommand: vllmServe
    mountModelVolume: true
    name: vllm
    ports:
    - containerPort: 5557
      protocol: TCP
    - containerPort: 8200
      name: metrics
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /v1/models
        port: 8200
      periodSeconds: 5
      timeoutSeconds: 2
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    startupProbe:
      failureThreshold: 60
      httpGet:
        path: /v1/models
        port: 8200
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /.config
      name: metrics-volume
    - mountPath: /.cache
      name: torch-compile-cache
  create: true
  monitoring:
    podmonitor:
      enabled: true
      interval: 30s
      path: /metrics
      portName: metrics
  replicas: 2
  volumes:
  - emptyDir: {}
    name: metrics-volume
  - emptyDir: {}
    name: torch-compile-cache
modelArtifacts:
  authSecretName: llm-d-hf-token
  name: Qwen/Qwen3-0.6B
  size: 20Gi
  uri: hf://Qwen/Qwen3-0.6B
multinode: false
prefill:
  create: false
routing:
  proxy:
    connector: nixlv2
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0-rc.1
    secure: false
  servicePort: 8000