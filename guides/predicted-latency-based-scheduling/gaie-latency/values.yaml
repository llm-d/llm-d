inferenceExtension:
  replicas: 1

  flags:
    # in vLLM 10.0+, the metric is renamed while upstream GAIE is still using the old name as default.
    # See https://github.com/kubernetes-sigs/gateway-api-inference-extension/pull/1905.
    kv-cache-usage-percentage-metric: "vllm:kv_cache_usage_perc"
    # Disable tracing flag (not supported in experimental build)
    enable-latency-predictor: true

  image:
    # Use the experimental EPP image with SLO prediction support
    # IMPORTANT: Replace with your custom built image from the experimental branch
    name: epp
    hub: quay.io/rh-ee-kapjain
    tag: slo-prediction-06bb5de8
    pullPolicy: Always

  # Override container args to remove unsupported flags
  containerArgs:
    - --enable-latency-predictor
    - --config-file=/config/slo-prediction-plugins.yaml
    - --kv-cache-usage-percentage-metric=vllm:kv_cache_usage_perc

  extProcPort: 9002

  # Latency Predictor Configuration (using chart's built-in support)
  latencyPredictor:
    enabled: true
    # Training Server Configuration
    trainingServer:
      image:
        hub: quay.io/rh-ee-kapjain
        name: latency-predictor-training
        tag: latency-predictor-06bb5de8
        pullPolicy: Always
      port: 8000
      volumeSize: "20Gi"
      config:
        LATENCY_RETRAINING_INTERVAL_SEC: "1"
        LATENCY_MIN_SAMPLES_FOR_RETRAIN: "100"
        LATENCY_TTFT_MODEL_PATH: "/models/ttft.joblib"
        LATENCY_TPOT_MODEL_PATH: "/models/tpot.joblib"
        LATENCY_TTFT_SCALER_PATH: "/models/ttft_scaler.joblib"
        LATENCY_TPOT_SCALER_PATH: "/models/tpot_scaler.joblib"
        LATENCY_MODEL_TYPE: "xgboost"
        LATENCY_MAX_TRAINING_DATA_SIZE_PER_BUCKET: "5000"
        LATENCY_QUANTILE_ALPHA: "0.9"
    # Prediction Server Configuration
    predictionServers:
      count: 10
      startPort: 8001
      image:
        hub: quay.io/rh-ee-kapjain
        name: latency-predictor-prediction
        tag: latency-predictor-06bb5de8
        pullPolicy: Always
      volumeSize: "10Gi"
      config:
        LATENCY_MODEL_TYPE: "xgboost"
        PREDICT_HOST: "0.0.0.0"
        LOCAL_TTFT_MODEL_PATH: "/server_models/ttft.joblib"
        LOCAL_TPOT_MODEL_PATH: "/server_models/tpot.joblib"
        LOCAL_TTFT_SCALER_PATH: "/server_models/ttft_scaler.joblib"
        LOCAL_TPOT_SCALER_PATH: "/server_models/tpot_scaler.joblib"
    # EPP Environment Variables for Latency Predictor
    eppEnv:
      LATENCY_MAX_SAMPLE_SIZE: "10000"
      NEG_HEADROOM_TTFT_WEIGHT: "0.5"
      NEG_HEADROOM_TPOT_WEIGHT: "0.5"
      HEADROOM_TTFT_WEIGHT: "0.5"
      HEADROOM_TPOT_WEIGHT: "0.5"
      HEADROOM_SELECTION_STRATEGY: "least"  # or "most"
      SLO_BUFFER_FACTOR: "1.1"

  pluginsConfigFile: "slo-prediction-plugins.yaml"
  pluginsCustomConfig:
    slo-prediction-plugins.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: slo-request-tracker
        - type: slo-scorer
        - type: slo-aware-profile-handler
        - type: max-score-picker

      schedulingProfiles:
        - name: default
          plugins:
            - pluginRef: slo-request-tracker
            - pluginRef: prefix-cache-scorer
            - pluginRef: queue-scorer
            - pluginRef: kv-cache-utilization-scorer
            - pluginRef: max-score-picker

        - name: slo
          plugins:
            - pluginRef: prefix-cache-scorer
              weight: 0
            - pluginRef: slo-request-tracker
            - pluginRef: slo-scorer
            - pluginRef: max-score-picker

  # Monitoring configuration for EPP
  monitoring:
    secret:
      name: latency-prediction-gateway-sa-metrics-reader-secret
    interval: "10s"
    # Prometheus ServiceMonitor will be created when enabled for EPP metrics collection
    prometheus:
      enabled: true
      auth:
        # To allow unauthenticated /metrics access (e.g., for debugging with curl), set to false
        enabled: true

inferencePool:
  targetPorts:
    - number: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/guide: "predicted-latency-based-scheduling"