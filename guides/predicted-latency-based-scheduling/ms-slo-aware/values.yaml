multinode: false

modelArtifacts:
  uri: "hf://meta-llama/Llama-3.1-8B-Instruct"
  size: 20Gi
  authSecretName: "llm-d-hf-token"
  name: "meta-llama/Llama-3.1-8B-Instruct"

routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0
    connector: nixlv2
    secure: false

decode:
  create: true
  replicas: 3
  monitoring:
    podmonitor:
      enabled: true
      portName: "vllm"  # decode vLLM service port (from routing.proxy.targetPort)
      path: "/metrics"
      interval: "30s"
  initContainers:
    - name: lora-adapter-syncer
      tty: true
      stdin: true 
      image: us-central1-docker.pkg.dev/k8s-staging-images/gateway-api-inference-extension/lora-syncer:main
      restartPolicy: Always
      imagePullPolicy: Always
      env: 
        - name: DYNAMIC_LORA_ROLLOUT_CONFIG
          value: "/config/configmap.yaml"
      volumeMounts: # DO NOT USE subPath, dynamic configmap updates don't work on subPaths
      - name: config-volume
        mountPath:  /config
  enableServiceLinks: false
  terminationGracePeriodSeconds: 130
  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-cuda:v0.4.0
    modelCommand: custom
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - '-c'
    args:
      - |
        vllm serve meta-llama/Llama-3.1-8B-Instruct \
        --max-num-seq 1024 \
        --enable-lora \
        --max-loras 2 \
        --max-lora-rank 8 \
        --max-cpu-loras 12
    env:
      - name: VLLM_ALLOW_RUNTIME_LORA_UPDATING
        value: "true"
    ports:
      - containerPort: 8200
        name: vllm
        protocol: TCP
    lifecycle:
      preStop:
        sleep:
          seconds: 30
    livenessProbe:
      httpGet:
        path: /health
        port: http
        scheme: HTTP
      periodSeconds: 1
      successThreshold: 1
      failureThreshold: 5
      timeoutSeconds: 1
    readinessProbe:
      httpGet:
        path: /health
        port: http
        scheme: HTTP
      periodSeconds: 1
      successThreshold: 1
      failureThreshold: 1
      timeoutSeconds: 1
    startupProbe:
      failureThreshold: 600
      initialDelaySeconds: 2
      periodSeconds: 1
      httpGet:
        path: /health
        port: http
        scheme: HTTP
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: torch-compile-cache
      mountPath: /.cache
    - mountPath: /data
      name: data
    - mountPath: /dev/shm
      name: shm
    - name: adapters
      mountPath: "/adapters"
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: torch-compile-cache
    emptyDir: {}
  - name: data
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
  - name: adapters
    emptyDir: {}
  - name: config-volume
    configMap:
      name: vllm-llama3-8b-instruct-adapters

# PD disabled in this example
prefill:
  create: false

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: vllm-llama3-8b-instruct-adapters
    data:
      configmap.yaml: |
          vLLMLoRAConfig:
            name: vllm-llama3-8b-instruct-adapters
            port: 8000
            defaultBaseModel: meta-llama/Llama-3.1-8B-Instruct
            ensureExist:
              models:
              - id: food-review-1
                source: Kawon/llama3.1-food-finetune_v14_r8
