# GLM wide-EP arm: approximate prefix-cache affinity placement + P2P pull.
# Identical placement to epp-glm-approx.yaml plus the p2p-source-producer
# fed by the approximate cpu prefix-cache index (no KV events required),
# minCachedTokenDelta 16384. The engine ran offload_prompt_only:true for
# this arm - the matched setting when the index never covers decode blocks.
# Service endpoints (token-producer url) are the testbed's; adjust for your deployment.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: disagg-headers-handler
- type: always-disagg-pd-decider
- type: disagg-profile-handler
  parameters:
    deciderPluginName: always-disagg-pd-decider
- type: prefill-filter
- type: decode-filter
- type: approx-prefix-cache-producer
  name: gpu-prefix-cache-producer
- type: approx-prefix-cache-producer
  name: cpu-prefix-cache-producer
  parameters:
    autoTune: false
    lruCapacityPerServer: 200000
- type: prefix-cache-scorer
  name: gpu-prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: gpu-prefix-cache-producer
- type: prefix-cache-scorer
  name: cpu-prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: cpu-prefix-cache-producer
- type: queue-scorer
- type: active-request-scorer
- type: p2p-source-producer
  parameters:
    prefixMatchInfoProducerName: cpu-prefix-cache-producer   # approx CPU-tier index, not precise
    prefillProfileName: prefill
    minCachedTokenDelta: 16384
    p2pPortBase: 7777
schedulingProfiles:
- name: prefill
  plugins:
  - pluginRef: prefill-filter
  - pluginRef: gpu-prefix-cache-scorer
    weight: 5
  - pluginRef: cpu-prefix-cache-scorer
    weight: 2
  - pluginRef: active-request-scorer
    weight: 1
- name: decode
  plugins:
  - pluginRef: decode-filter
  - pluginRef: active-request-scorer
    weight: 3
