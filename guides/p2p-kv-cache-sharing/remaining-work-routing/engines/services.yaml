apiVersion: v1
kind: Service
metadata:
  name: glm-5-2-render
  namespace: nilig-agentx-slo
  labels:
    llm-d.ai/benchmark: p2p-cache-routing-glm
spec:
  selector:
    llm-d.ai/benchmark: p2p-cache-routing-glm
    llm-d.ai/model: GLM-5.2-FP8
    llm-d.ai/role: prefill
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
---
