apiVersion: v1
kind: Service
metadata:
  name: render
  labels:
    app.kubernetes.io/component: vllm-render
spec:
  # Same Service name as ../service.yaml so the router's token-producer URL is
  # unchanged; apply exactly one of the two overlays.
  selector:
    app.kubernetes.io/component: vllm-render
    app.kubernetes.io/part-of: p2p-kv-cache-sharing
  ports:
    - name: render-http
      port: 8000
      targetPort: render-http
