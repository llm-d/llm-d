apiVersion: apps/v1
kind: Deployment
metadata:
  name: render
spec:
  # The EPP token-producer tokenizes every request by calling this pool's
  # /v1/completions/render endpoint. Long-prompt workloads (this guide uses
  # ~48K-token documents) saturate a single render replica near ~10 req/s;
  # size for peak stage rate (see the guide's Best Practices render bullet).
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/component: vllm-render
      app.kubernetes.io/part-of: p2p-kv-cache-sharing
  template:
    metadata:
      labels:
        app.kubernetes.io/component: vllm-render
        # Guide-scoped, but deliberately NOT `llm-d.ai/guide` (the InferencePool
        # / model-server selector) so the EPP never treats a render pod as a
        # routable model server and tries to subscribe to its (nonexistent)
        # KV-event socket.
        app.kubernetes.io/part-of: p2p-kv-cache-sharing
    spec:
      automountServiceAccountToken: false
      containers:
        - name: vllm-render
          # GPU-less vLLM image; `vllm launch render` only tokenizes, no weights.
          image: docker.io/vllm/vllm-openai-cpu:v0.23.0
          imagePullPolicy: IfNotPresent
          command: ["vllm", "launch", "render"]
          args:
            - openai/gpt-oss-120b # Must match the token-producer modelName in the router values
            - --port=8000
          ports:
            - name: render-http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /tmp/hf
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: DO_NOT_TRACK
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
          readinessProbe:
            httpGet:
              path: /health
              port: render-http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - mountPath: /tmp/hf
              name: hf-cache
      volumes:
        - name: hf-cache
          emptyDir: {}
