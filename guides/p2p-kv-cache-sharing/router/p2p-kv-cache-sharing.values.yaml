## p2p-kv-cache-sharing guide overrides for the router.
## Layer on top of: recipes/router/base.values.yaml
##
## Tokenization is served by a standalone `vllm launch render` Service deployed
## from `../render/`. The EPP `token-producer` plugin tokenizes prompts over
## HTTP against that Service (see its `vllm.url` below). Size the render pool
## for the peak request rate (long-prompt workloads saturate a single replica
## near ~10 req/s) - see the guide's Best Practices.
##
## The deployed EPP config is the load-aware + P2P arm (`epp-load-p2p.yaml`
## in ../benchmarking/): placement follows queue depth and KV utilization,
## and the p2p-source-producer emits the KV cache source header when a peer
## out-caches the scheduled pod by at least minCachedTokenDelta tokens, so
## a placement chosen for load still gets the cached prefix via a pull. The
## affinity + P2P arm (`epp-affinity-p2p.yaml`) was the earlier default;
## measured on this guide's own document-Q&A headline (128 concurrent
## sessions against a fixed per-document ownership rule), it still queues
## behind a busy owner pod when the scorer's affinity term wins the
## tradeoff, so its p95/p99 TTFT sit between the recompute-only affinity
## arm and this one rather than matching it - see
## [benchmark-results/gpt-oss-120b-h200.md](../benchmark-results/gpt-oss-120b-h200.md).
## To reproduce the comparison arms, swap this pluginsCustomConfig for any
## file under ../benchmarking/.
##
## Pod-discovery mode with active-active HA (replicas: 2). Each replica dials
## every vLLM pod's per-pod ZMQ socket; both indexes converge identically.

router:
  epp:
    replicas: 2
    # TEMPORARY pin, tracked under the v0.9 "Multi-tier offloading: NIXL P/D +
    # P2P backends" goal: the chart's default EPP image (the chart version's
    # tag) predates the `p2p-source-producer` plugin and rejects this config
    # with "plugin type 'p2p-source-producer' is not registered". Pin the next
    # release once it ships the plugin.
    image:
      tag: main
      pullPolicy: Always
    flags:
      ha-enable-leader-election: false
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: llm-d-hf-token
            key: HF_TOKEN
    pluginsConfigFile: "p2p-kv-cache-sharing-plugins.yaml"
    pluginsCustomConfig:
      p2p-kv-cache-sharing-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
          - type: token-producer
            parameters:
              modelName: openai/gpt-oss-120b # Must match the render Service model (../render/) and the deployed model server
              vllm:
                # Standalone render Service (../render/): `p2p-kv-cache-sharing-`
                # namePrefix + Service name `render`.
                url: "http://p2p-kv-cache-sharing-render:8000"
          - type: endpoint-notification-source
          - type: metrics-data-source
            parameters:
              scheme: "http"
              path: "/metrics"
              insecureSkipVerify: true
          - type: core-metrics-extractor
          - type: precise-prefix-cache-producer
            parameters:
              tokenProcessorConfig:
                # MUST match the model server `--block-size`.
                blockSize: 64
              kvEventsConfig:
                topicFilter: "kv@"
                discoverPods: true
                podDiscoveryConfig:
                  socketPort: 5556
          - type: p2p-source-producer
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
              prefillProfileName: default
              # Minimum extra cached-prefix tokens a peer must hold beyond the
              # scheduled pod before a pull is requested; set from the measured
              # pull-versus-recompute crossover (see ../benchmarking/README.md).
              minCachedTokenDelta: 2048
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: weighted-random-picker
          - type: single-profile-handler
        dataLayer:
          sources:
            - pluginRef: metrics-data-source
              extractors:
                - pluginRef: core-metrics-extractor
            - pluginRef: endpoint-notification-source
              extractors:
                - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: weighted-random-picker
              - pluginRef: queue-scorer
                weight: 3
              - pluginRef: kv-cache-utilization-scorer
                weight: 2

  modelServers:
    matchLabels:
      llm-d.ai/guide: "p2p-kv-cache-sharing"
