apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Routing sidecar shared by the GPU and XPU overlays. The sidecar only speaks
# HTTP to the engine, so it has no accelerator dependency. Each overlay
# resolves REPLACE_ROUTING_SIDECAR_IMAGE with a
# recipes/modelserver/components/images/routing-sidecar component listed
# after this one.

patches:
  - path: patch-sidecar.yaml
    target:
      kind: Deployment
      name: decode
