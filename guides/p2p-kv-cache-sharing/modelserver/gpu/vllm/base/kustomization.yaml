apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aggregated gpt-oss-120b model servers with the OffloadingConnector P2P
# tier, layered on the shared recipes/ modelserver base. The engine listens
# on 8200 behind the routing sidecar on 8000 (the pd base port layout); the
# P2P tier and KV-events sockets are pod-IP listeners.

resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: p2p-kv-cache-sharing-

components:
  - ../../../../../recipes/modelserver/components/graceful-shutdown
  - ../../../components/routing-sidecar
  # Must follow routing-sidecar, which adds the container it resolves.
  - ../../../../../recipes/modelserver/components/images/routing-sidecar/nightly

# Pins:
# - engine: the P2P secondary tier (vllm#48021), its crash fixes
#   (vllm#49671, vllm#49823), the symmetric-fetch stall fix (vllm#49877)
#   and the wide-EP block-table alignment fix (vllm#50302) are all
#   contained in v0.27.0, the first tagged release with the full set.
#   v0.32.0 adds the per-tier cached prompt token metrics (vllm#56318),
#   which count the prompt tokens served from a peer
#   (prompt_tokens_cached_by_source_total{source="p2p"}). It needs
#   --enable-scale-out (patch-vllm.yaml) for the render endpoint.
# - sidecar: main because v0.9.0 predates the offloading P2P pull support
#   (llm-d-router#1937) and forwarding the router's remote_kv_source block
#   (llm-d-router#3441); pin the next release when cut, together with the
#   router image in ../../../../router/p2p-kv-cache-sharing.values.yaml:
#   a sidecar with llm-d-router#3441 behind an older router stops pulling.
#   This tag floats; see the REPRODUCIBILITY note in that file.
images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: vllm/vllm-openai
    newTag: v0.32.0

labels:
  - pairs:
      llm-d.ai/model: gpt-oss-120b
      llm-d.ai/guide: p2p-kv-cache-sharing
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: vllm
    includeSelectors: true
    includeTemplates: true

patches:
  # Engine port 8200 behind the sidecar, plus the P2P tier listener and the
  # per-pod KV-event socket the router subscribes to.
  - target:
      kind: Deployment
      name: decode
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8200
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: p2p
          containerPort: 7777
          protocol: TCP
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: kv-events
          containerPort: 5556
          protocol: TCP
  - path: patch-vllm.yaml
