# TEMPORARY - will be replaced.
# Overlays the P2P-tier implementation from the development branch
# (liranschour/vllm, branch `generic_p2p`) onto the vLLM image by
# subPath-mounting its source files over the installed package. Remove this
# patch (and the `generic-p2p-src` ConfigMap) once a vLLM release ships the
# OffloadingConnector P2P secondary tier.
#
# Prerequisite: the `generic-p2p-src` ConfigMap in the namespace - see the
# guide README, "Interim: P2P tier from the development branch".
# The base image must match the branch's rebase point; a file whose imports
# drift from the image (e.g. `SharedOffloadRegion` signature changes) crashes
# EngineCore at startup, so pin both together.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2p-kv-cache-sharing-vllm
spec:
  template:
    spec:
      containers:
        - name: modelserver
          volumeMounts:
            - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/base.py
              name: gp2p
              subPath: kv_offload_base.py
            - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/manager.py
              name: gp2p
              subPath: manager.py
            - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/session/__init__.py
              name: gp2p
              subPath: session_init.py
            - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/session/client.py
              name: gp2p
              subPath: session_client.py
            - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/session/protocol.py
              name: gp2p
              subPath: session_protocol.py
            - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/session/server.py
              name: gp2p
              subPath: session_server.py
            - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/session/session.py
              name: gp2p
              subPath: session_session.py
      volumes:
        - name: gp2p
          configMap:
            name: generic-p2p-src
