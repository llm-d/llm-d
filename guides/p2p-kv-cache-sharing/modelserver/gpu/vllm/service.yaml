apiVersion: v1
kind: Service
metadata:
  name: p2p-kv-cache-sharing-vllm
  labels:
    app: p2p-kv-cache-sharing
spec:
  clusterIP: None # headless: the InferencePool/EPP resolves individual pods
  selector:
    app: p2p-kv-cache-sharing
  ports:
    # Requests enter through the routing sidecar (which injects the pull),
    # not the vLLM port directly.
    - name: proxy
      port: 8000
      targetPort: proxy
      protocol: TCP
    - name: kv-events
      port: 5556
      targetPort: kv-events
      protocol: TCP
