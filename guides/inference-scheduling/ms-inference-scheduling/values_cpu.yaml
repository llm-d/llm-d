# Simplified Intel CPU configuration using imageDefault mode
# This configuration lets the chart handle most vLLM parameters automatically

# Distributed tracing configuration (OpenTelemetry)
# tracing:
#   enabled: true
#   otlpEndpoint: "http://otel-collector:4317"
#   sampling:
#     sampler: "parentbased_traceidratio"
#     samplerArg: "0.1"

modelArtifacts:
  uri: "hf://ibm-granite/granite-4.0-350m"
  size: 5Gi
  # authSecretName: "llm-d-hf-token"  # Not needed for Granite (public model)
  name: "ibm-granite/granite-4.0-350m"
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "inference-scheduling"
    llm-d.ai/hardware-variant: "cpu"
    llm-d.ai/model: "granite-4.0-350m"

accelerator:
  type: cpu

# Routing configuration - required for inference-scheduling
routing:
  proxy:
    enabled: false  # removes sidecar from deployment - no PD in inference scheduling
    targetPort: 8000  # controls vLLM port to matchup with sidecar if deployed

decode:
  create: true
  replicas: 2
  # OpenShift-compatible security context configuration
  # Comment out for non-OpenShift clusters if you need NUMA optimizations
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  monitoring:
    podmonitor:
      enabled: true
      portName: "vllm"
      path: "/metrics"
      interval: "30s"
  containers:
    - name: "vllm"
      image: ghcr.io/llm-d/llm-d-cpu:v0.5.1
      imagePullPolicy: IfNotPresent
      modelCommand: vllmServe
      # NUMA cross-node related security settings - COMMENTED OUT for OpenShift compatibility
      # Uncomment these for non-OpenShift clusters to enable NUMA optimizations:
      # securityContext:
      #   seccompProfile:
      #     type: Unconfined
      #   capabilities:
      #     add:
      #       - SYS_NICE
      args:
        - "--disable-hybrid-kv-cache-manager"
        - "--max_model_len"
        - "1024"
      env:
        - name: VLLM_CPU_NUM_OF_RESERVED_CPU
          value: "1"
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "4"
      ports:
        - containerPort: 8000
          name: vllm
          protocol: TCP
      resources:
        limits:
          memory: 8Gi
          cpu: "1"
        requests:
          cpu: "1"
          memory: 8Gi
      device: "cpu"
      mountModelVolume: true
      volumeMounts:
        - name: metrics-volume
          mountPath: /.config
        - name: torch-compile-cache
          mountPath: /.cache
        - name: dshm
          mountPath: /dev/shm
      startupProbe:
        httpGet:
          path: /v1/models
          port: vllm
        initialDelaySeconds: 30
        periodSeconds: 60
        timeoutSeconds: 10
        failureThreshold: 120
      livenessProbe:
        httpGet:
          path: /health
          port: vllm
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /v1/models
          port: vllm
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
  volumes:
    - name: metrics-volume
      emptyDir: {}
    - name: torch-compile-cache
      emptyDir: {}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi

# Disable prefill for simple CPU example
prefill:
  create: false

# When true, use LeaderWorkerSet for multi-node CPU setups
multinode: false
