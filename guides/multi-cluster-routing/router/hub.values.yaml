## multi-cluster-routing hub: a cluster-scoped llm-d Router whose endpoints are
## whole clusters, not pods. It discovers the clusters from clusters.yaml and
## forwards every request to the cluster its scorers pick; the cluster's own
## router then picks the pod.
##
## This file holds the settings every hub needs. The routing policy (which
## scorers rank the clusters) comes from one of the hub-<policy>.values.yaml
## files layered on top.
##
## Layer on top of: recipes/router/base.values.yaml

router:
  # Clients reach the hub's Envoy sidecar on port 80.
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    flags:
      # Every multicluster plugin is registered Alpha. Without this flag the EPP
      # refuses the configuration at startup instead of ignoring the plugins.
      allow-experimental-plugins: true

    # clusters.yaml comes from the mc-hub-clusters ConfigMap, rendered in Step 3.
    volumes:
      - name: clusters
        configMap:
          name: mc-hub-clusters
    volumeMounts:
      - name: clusters
        mountPath: /etc/epp/clusters
        readOnly: true

  # The chart names its Envoy ConfigMap "envoy" in every release, so a hub
  # installed in the same namespace as a cluster's router would fail on
  # ConfigMap ownership. Rename the hub's copy; the volume that mounts it must
  # be restated too, because a list override replaces the preset's list.
  proxy:
    configMap:
      name: mc-hub-envoy
    volumes:
      - name: config
        configMap:
          name: mc-hub-envoy
          items:
            - key: envoy.yaml
              path: envoy.yaml

  modelServers:
    # The chart always creates an InferencePool and requires a selector for it.
    # This EPP takes its endpoints from clusters.yaml, never from pods, so the
    # selector deliberately matches nothing.
    matchLabels:
      llm-d.ai/guide: multi-cluster-routing-hub
