## Hub routing policy "latency": rank clusters on their predicted time-to-first-
## token. The observer learns each cluster's latency curve from the responses
## the hub already receives, and the scorer reads it at the cluster's current
## in-flight load. Nothing is scraped from the clusters, so their routers need no
## changes. Needs llm-d-router v0.11 or later, such as the chart's default
## `main` image; an older EPP exits at startup with "plugin type
## 'latency-observer-producer-hub' is not registered".
##
## Layer on top of: recipes/router/base.values.yaml and hub.values.yaml

router:
  epp:
    pluginsConfigFile: "multi-cluster-routing-latency.yaml"
    pluginsCustomConfig:
      multi-cluster-routing-latency.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          # Endpoints are clusters, listed in clusters.yaml.
          - type: multicluster-file-discovery
            name: discovery
            parameters:
              path: /etc/epp/clusters/clusters.yaml
              watchFile: true
          - type: latency-observer-producer-hub
            name: ttft-observer
            parameters:
              intervalDuration: 1s
              windowSize: 500
              maxObservationAge: 2m
              maxRequests: 50
              minRequests: 3
              lowPercentile: 25
              typicalPercentile: 50
              bucketDuration: 5s
              bucketHistorySize: 4
          # ttftPercentilesProducerName must name the observer above; unset, the
          # scorer reads nothing and every cluster ties.
          - type: latency-observation-scorer-hub
            name: ttft
            parameters:
              explorationRate: 0.1
              minInflightGap: 1
              ttftPercentilesProducerName: ttft-observer
          - type: max-score-picker
            name: picker
          - type: single-profile-handler
            name: profile-handler
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: ttft
              - pluginRef: picker
        dataLayer:
          discovery:
            endpoints:
              pluginRef: discovery
          sources:
            # Drives the observer's periodic recompute. Scrapes nothing.
            - pluginRef: ttft-observer
