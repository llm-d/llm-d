## Hub routing policy "agentic-session": keep each session on one cluster, chosen by
## a hash weighted by each cluster's ready pods, and move it only when that
## cluster is full or down. The TTFT and KV-cache scorers pick where a full
## cluster's sessions go. The hub scrapes each cluster's EPP /metrics, so every
## cluster router needs leaf.values.yaml.
##
## Layer on top of: recipes/router/base.values.yaml and hub.values.yaml

router:
  epp:
    # Optional: the room check is per priority, so the hub needs each request's
    # priority. File discovery does not watch InferenceObjectives: put the
    # clusters' objective names and priorities in a ConfigMap (mc-hub-objectives,
    # key objectives.yaml) and uncomment below. Without it every request is
    # priority 0. These lists replace hub.values.yaml's, so they repeat the
    # clusters volume.
    # flags:
    #   objectives-file: /etc/epp/objectives/objectives.yaml
    # volumes:
    #   - name: clusters
    #     configMap: {name: mc-hub-clusters}
    #   - name: objectives
    #     configMap: {name: mc-hub-objectives}
    # volumeMounts:
    #   - {name: clusters, mountPath: /etc/epp/clusters, readOnly: true}
    #   - {name: objectives, mountPath: /etc/epp/objectives, readOnly: true}
    pluginsConfigFile: "multi-cluster-routing-agentic-session.yaml"
    pluginsCustomConfig:
      multi-cluster-routing-agentic-session.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          # Endpoints are clusters, listed in clusters.yaml.
          - type: multicluster-file-discovery
            name: discovery
            parameters:
              path: /etc/epp/clusters/clusters.yaml
              watchFile: true
          # Scrapes each cluster's EPP /metrics. The plugin defaults to https with
          # peer-certificate verification, because it crosses a cluster trust
          # boundary. The cluster routers serve their metrics over plain HTTP, so
          # this guide sets `scheme: http` and limits who can reach the metrics
          # port instead (see the guide's Known Constraints).
          - type: multicluster-metrics-data-source
            name: metrics-source
            parameters:
              scheme: http
          # Writes each cluster's pool averages (llm_d_epp_average_kv_cache_utilization,
          # llm_d_epp_average_queue_size, ready pods, flow control) into the
          # attributes the filter and the KV-cache scorer read.
          - type: multicluster-metrics-extractor
            name: metrics-extractor
          # Keys each request on its session (x-session-id and similar headers,
          # else its conversation up to the first user message) and keeps one
          # cluster per session. Reads the same pool metrics plus each cluster's
          # ready pods (llm_d_epp_ready_endpoints) and flow control, if any.
          - type: multicluster-rendezvous-filter
            name: rendezvous
          # Learns each cluster's time to first token from the streamed responses
          # the hub relays; the TTFT scorer below reads it.
          - type: latency-observer-producer-hub
            name: ttft-observer
            parameters: {intervalDuration: 1s, minRequests: 10}
          - type: latency-observation-scorer-hub
            name: ttft
            parameters: {ttftPercentilesProducerName: ttft-observer}
          - type: multicluster-kv-cache-utilization-scorer
            name: kv-cache
          - type: max-score-picker
            name: picker
          - type: single-profile-handler
            name: profile-handler
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: rendezvous
              # Pick the cluster a full cluster's sessions spill to.
              - pluginRef: ttft
                weight: 1
              - pluginRef: kv-cache
                weight: 1
              - pluginRef: picker
        dataLayer:
          discovery:
            endpoints:
              pluginRef: discovery
          sources:
            - pluginRef: metrics-source
              extractors:
                - pluginRef: metrics-extractor
            # Drives the TTFT observer's periodic recompute. Scrapes nothing.
            - pluginRef: ttft-observer
