## multimodal precise-affinity guide overrides for the llm-d router.
## Layer on top of: recipes/router/base.values.yaml

router:
  tokenizer:
    enabled: true
    modelName: Qwen/Qwen3-VL-32B-Instruct
    env:
      - name: HF_HOME
        value: /tmp/hf/hub

  epp:
    pluginsConfigFile: "precise-affinity-plugins.yaml"
    pluginsCustomConfig:
      precise-affinity-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
          - type: token-producer
            parameters:
              modelName: Qwen/Qwen3-VL-32B-Instruct
              vllm:
                url: http://localhost:8000
          - type: mm-embeddings-cache-producer
            parameters:
              cacheSizeInMBPerServer: 2048
          - type: mm-embeddings-cache-scorer
          - type: kv-cache-utilization-scorer
          - type: queue-scorer
          - type: no-hit-lru-scorer
          - type: decode-filter
          - type: max-score-picker
          - type: single-profile-handler
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: decode-filter
              - pluginRef: queue-scorer
                weight: 2.0
              - pluginRef: kv-cache-utilization-scorer
                weight: 2.0
              - pluginRef: mm-embeddings-cache-scorer
                weight: 10.0
              - pluginRef: no-hit-lru-scorer
                weight: 1.0
              - pluginRef: max-score-picker

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  modelServers:
    type: vllm
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "precise-affinity"
