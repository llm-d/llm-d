endpoint:
  stack_name: &stack_name mm-precise-affinity-Qwen3-VL-32B-Instruct
  model: &model Qwen/Qwen3-VL-32B-Instruct
  namespace: &namespace ${NAMESPACE}
  base_url: &url http://${IP}   # EPP IP (precise affinity) or round-robin Service IP (baseline)
  hf_token_secret: llm-d-hf-token

control:
  work_dir: $HOME/llm-d-bench-work
  kubectl: kubectl

harness:
  name: &harness_name inference-perf
  results_pvc: ${BENCHMARK_PVC}
  namespace: *namespace
  parallelism: 1
  wait_timeout: 6000
  image: ghcr.io/llm-d/llm-d-benchmark:v0.7.0   # multimodal datagen needs v0.7.0+

env:
  - name: RAYON_NUM_THREADS
    value: "4"

# Decode-bound: 512-token outputs saturate the 2 decode pods well below the render knee.
workload:
  decodebound_mm:
    load:
      type: constant
      num_workers: 16
      stages:
        - { rate: 5, duration: 120 }   # warmup, seat caches
        - { rate: 5, duration: 120 }
        - { rate: 10, duration: 120 }
        - { rate: 15, duration: 120 }
        - { rate: 20, duration: 120 }
        - { rate: 25, duration: 120 }
        - { rate: 30, duration: 120 }
        - { rate: 40, duration: 120 }
        - { rate: 50, duration: 120 }
    api:
      type: chat
      streaming: true
    server:
      type: vllm
      model_name: *model
      base_url: *url
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: *model
    data:
      type: shared_prefix
      multimodal:                      # fresh per-request image
        image:
          count: { type: fixed, min: 1, max: 1, mean: 1 }
          insertion_point: 1.0
          resolutions:
            - { resolution: "720p", weight: 1.0 }
      shared_prefix:
        num_groups: 16
        num_prompts_per_group: 16
        system_prompt_len: { type: fixed, min: 800, max: 800, mean: 800 }
        question_len: { type: fixed, min: 200, max: 200, mean: 200 }
        output_len: { type: fixed, min: 512, max: 512, mean: 512 }
        multimodal:                    # cached per-group image (affinity target)
          image:
            count: { type: fixed, min: 1, max: 1, mean: 1 }
            insertion_point: 0.0
            resolutions:
              - { resolution: "720p", weight: 1.0 }
    report:
      request_lifecycle:
        summary: true
        per_stage: true
    storage:
      local_storage:
        path: /workspace
