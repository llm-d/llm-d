## AMD overlay for e-p-d-disaggregation.values.yaml: layer it after that file
## (helm ... -f recipes/router/base.values.yaml -f e-p-d-disaggregation.values.yaml -f amd.e-p-d-disaggregation.values.yaml).
##
## The plugin config is the same as in e-p-d-disaggregation.values.yaml except peakPrefillThroughput,
## measured on AMD. Helm cannot change one field inside the pluginsCustomConfig
## text block, so the whole block is repeated here: keep it in sync with
## e-p-d-disaggregation.values.yaml.

router:
  epp:
    pluginsCustomConfig:
      e-p-d-config.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        # Token-based routing, matching the optimized-baseline reference stack.
        # Prefill is token-load-aware: prefix-cache-affinity-filter selects the
        # endpoint set and token-load-scorer picks on queued prefill token load,
        # fed by the multimodal token-producer (image → token-count estimation,
        # since image inputs have no text length to read). The pure `decode`
        # profile scores on active-request-scorer only — decode is bound by
        # concurrent in-flight requests, not prefill throughput. Encode is
        # unchanged.
        plugins:
        - type: always-disagg-multimodal-decider
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              encode: always-disagg-multimodal-decider
              prefill: always-disagg-pd-decider
        - type: encode-filter
        - type: prefill-filter
        - type: decode-filter
        - type: token-producer
          parameters:
            estimate:
              image:
                mode: dynamic
                defaultResolution:
                  width: 1280
                  height: 720
                dynamic:
                  # Count-correct for Qwen3-VL: one visual token per 32x32-pixel
                  # region (patch 16 x spatial merge 2 — measured 880 tokens for
                  # a 1280x720 image against the served model). Derive from your
                  # model's preprocessor config for other architectures.
                  factor: 1024
        - type: approx-prefix-cache-producer
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            # Measured for Qwen3-VL-32B-Instruct on AMD Instinct MI355X (TP=2,
            # vLLM v0.31.0, --max-num-batched-tokens 16384) with
            # guides/recipes/router/calibration (CHUNK_SIZE=16384; text prefill;
            # vision-encoder prefill is not exercised by the calibration
            # workload). The shared values file has the H200 value, 15751.
            peakPrefillThroughput: 12767
            # The workload's cacheable fraction caps at ~0.70 (the unique question
            # is never a cache hit), so the plugin's 0.8 default can never engage
            # affinity for multimodal prompts of this shape. Set the threshold
            # below the maximum cacheable fraction of your traffic.
            affinityThreshold: 0.6
            # 2x the plugin default (18000). Token counts price an image token
            # like a text token, but vision-encoder time makes image-heavy
            # prefill slower per token than the text-calibrated
            # peakPrefillThroughput implies, so the filter's predicted-TTFT
            # milliseconds run light of wall-clock on this workload. Doubling
            # the gate restores the intended pinning depth (benchmark-validated:
            # parity with the previous weighted-scorer stack). Reduce toward the
            # default for text-dominant traffic.
            maxTTFTPenaltyMs: 36000
        - type: token-load-scorer
        - type: active-request-scorer
        - type: queue-scorer
        - type: max-score-picker
        schedulingProfiles:
        - name: encode
          plugins:
          - pluginRef: encode-filter
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: max-score-picker
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
