## AMD overlay for e-pd-disaggregation.values.yaml: layer it after that file.
## Identical to it except peakPrefillThroughput. Helm cannot override one field inside the
## pluginsCustomConfig text block, so the block is repeated: keep it in sync.

router:
  epp:
    pluginsCustomConfig:
      e-pd-config.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        # See e-pd-disaggregation.values.yaml for what each plugin and value does.
        plugins:
        - type: always-disagg-multimodal-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              encode: always-disagg-multimodal-decider
        - type: encode-filter
        - type: decode-filter
        - type: token-producer
          parameters:
            estimate:
              image:
                mode: dynamic
                defaultResolution:
                  width: 1280
                  height: 720
                dynamic:
                  # Qwen3-VL: one visual token per 32x32-pixel region (patch 16 x merge 2).
                  factor: 1024
        - type: approx-prefix-cache-producer
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            # MI355X, TP=2: see guides/recipes/router/calibration/configuration-matrix.md.
            peakPrefillThroughput: 12767
            affinityThreshold: 0.6
            maxTTFTPenaltyMs: 36000
        - type: token-load-scorer
        - type: queue-scorer
        - type: max-score-picker
        schedulingProfiles:
        - name: encode
          plugins:
          - pluginRef: encode-filter
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: max-score-picker
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
