apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: prefill
      spec:
        # 6 Prefill + 2 Decode.
        replicas: 6
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: modelserver
                  command: ["vllm", "serve"]
                  args:
                    - "Qwen/Qwen3-VL-32B-Instruct"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=2"
                    - "--mm-processor-cache-gb"
                    - "20"
                    # Registering the KV cache over DMABUF briefly needs about twice its size in
                    # GPU memory, so a KV cache sized from --gpu-memory-utilization can leave too
                    # little free at startup. Cap it.
                    - "--kv-cache-memory-bytes=100000000000"
                    - "--kv-transfer-config"
                    - '{"kv_connector":"MoRIIOConnector", "kv_role":"kv_producer", "kv_connector_extra_config": {"http_port":"8000", "handshake_port":"6301", "notify_port":"61005"}}'
                    - "--no-disable-hybrid-kv-cache-manager"
                    - "--gpu-memory-utilization=0.75"
                    - "--ec-transfer-config"
                    # ec_enable_nixl turns on P2P transfers between instances and ec_transport
                    # picks their data plane: "moriio" (MoRI-IO RDMA) instead of the default NIXL.
                    # ec_cpu_bytes (mandatory, no default) is the size in bytes of the shared CPU
                    # mmap region that holds encoder outputs for multimodal items. Keep it at 1 GiB
                    # with MoRI-IO.
                    # 1 GiB holds about 26,000 encoder tokens for Qwen3-VL-32B (40,960 bytes
                    # each). It must also fit in /dev/shm.
                    # See https://docs.vllm.ai/en/v0.30.0/features/ec_cpu_connector/
                    - '{"ec_connector": "ECCPUConnector", "ec_role": "ec_consumer", "ec_connector_extra_config": {"ec_enable_nixl": true, "ec_transport": "moriio", "ec_cpu_bytes": 1073741824}}'
                  env:
                    - name: VLLM_EC_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                  resources:
                    limits:
                      cpu: "8"
                      memory: 256Gi
                      amd.com/gpu: "2"
                    requests:
                      cpu: "8"
                      memory: 256Gi
                      amd.com/gpu: "2"
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.triton
                      name: triton-cache
                    - mountPath: /.config
                      name: config-cache
                  startupProbe:
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 90Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}
                - name: config-cache
                  emptyDir: {}
