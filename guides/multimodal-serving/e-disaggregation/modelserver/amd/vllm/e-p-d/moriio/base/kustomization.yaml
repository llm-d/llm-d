# E/P/D on AMD with MoRI-IO on both transfers: the embeddings (Encode -> Prefill,
# ECCPUConnector with ec_transport=moriio) and the KV cache (Prefill -> Decode,
# MoRIIOConnector, WRITE mode).
#
# Needs a vLLM image with ec_transport=moriio and a MoRI build that registers the
# single KV region.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../../../recipes/modelserver/base/single-host/pd-disaggregatedset/e-p-d

nameSuffix: -e-p-d

components:
  - ../../../../../../../../recipes/modelserver/components/images/routing-sidecar/nightly
  - ../../../../../../../../recipes/modelserver/components/disaggregatedset-schema

# A MoRI-IO nightly build that registers the KV cache as a single region.
images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: docker.io/vllm/vllm-openai-rocm
    newTag: nightly-81198e97ba7eee2a22540caaa756b7fdddcb4d93

labels:
  - pairs:
      llm-d.ai/model: Qwen3-VL-32B-Instruct
      llm-d.ai/guide: e-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: amd
      llm-d.ai/engine-type: vllm
    fields:
      - path: spec/roles/spec/leaderWorkerTemplate/workerTemplate/metadata/labels
        kind: DisaggregatedSet
        create: true
patches:
  - path: patch-prefill.yaml
  - path: patch-decode.yaml
  - path: patch-encode.yaml
  # VLLM_USE_V2_MODEL_RUNNER=1 for the instances that use the CPU EC connector
  # (encode and prefill). The connector fails at startup without the V2 model
  # runner, see https://docs.vllm.ai/en/v0.30.0/features/ec_cpu_connector/
  # Decode has no EC connector and uses the vLLM default model runner.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: encode
            spec: &env
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        env:
                          - name: VLLM_USE_V2_MODEL_RUNNER
                            value: "1"
          - name: prefill
            spec: *env
  # MoRI-IO RDMA settings of every pod that moves data with it (all three roles).
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: encode
            spec: &mori
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        env:
                          - name: MORI_ENABLE_DMABUF_REG
                            value: "1"
                          - name: MORI_IB_GID_INDEX
                            value: "1"
                          - name: MORI_IO_LOG_LEVEL
                            value: WARN
                          - name: MORI_APP_LOG_LEVEL
                            value: WARN
          - name: prefill
            spec: *mori
          - name: decode
            spec: *mori
