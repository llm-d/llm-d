# E/P/D on AMD with MoRI-IO on both transfers: the embeddings (Encode -> Prefill,
# ECCPUConnector with ec_transport=moriio) and the KV cache (Prefill -> Decode,
# MoRIIOConnector, WRITE mode). NIXL carries neither: on MI355X it corrupts short
# KV transfers over RDMA and crashes under load, so only aggregation and E/PD
# use NIXL on AMD.
#
# Needs a vLLM image with ec_transport=moriio (not in a release yet) and a MoRI
# build that registers the single KV region: v0.31.0 cannot, the `beta` nightly can.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../../../recipes/modelserver/base/single-host/pd/vllm
  - encode-deployment.yaml

namePrefix: e-p-d-disaggregation-amd-gpu-vllm-

components:
  - ../../../../../../../../recipes/modelserver/components/images/routing-sidecar/nightly
  - ../../../../../../../../recipes/modelserver/components/images/amd-vllm/beta

labels:
  - pairs:
      llm-d.ai/model: Qwen3-VL-32B-Instruct
      llm-d.ai/guide: e-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: amd
      llm-d.ai/engine-type: vllm
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-prefill.yaml
  - path: patch-decode.yaml
  # VLLM_USE_V2_MODEL_RUNNER=1 for the instances that use the CPU EC connector
  # (encode and prefill). The connector fails at startup without the V2 model
  # runner, see https://docs.vllm.ai/en/v0.30.0/features/ec_cpu_connector/
  # Decode has no EC connector and uses the vLLM default model runner.
  - target:
      kind: Deployment
      labelSelector: llm-d.ai/role in (encode,prefill)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VLLM_USE_V2_MODEL_RUNNER
          value: "1"
  # MoRI-IO RDMA settings of every pod that moves data with it (all three roles).
  - target:
      kind: Deployment
      labelSelector: llm-d.ai/role in (encode,prefill,decode)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MORI_ENABLE_DMABUF_REG
          value: "1"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MORI_IB_GID_INDEX
          value: "1"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MORI_IO_LOG_LEVEL
          value: WARN
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MORI_APP_LOG_LEVEL
          value: WARN
