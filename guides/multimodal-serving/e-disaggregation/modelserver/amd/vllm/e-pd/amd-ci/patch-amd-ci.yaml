# AMD CI overlay for E/PD multimodal disaggregation.
# Enables UCX GPU-direct RDMA (DMABUF) for NIXL EC transfers across nodes, and the
# persistent model cache.
# GPU count is inherited from base. Every role is TP=2, so each pod takes one
# vnic (and one network attachment) per GPU: 2.
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: encode
      spec: &amd-ci
        leaderWorkerTemplate:
          workerTemplate:
            metadata:
              annotations:
                k8s.v1.cni.cncf.io/networks: |
                  [
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net1"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net2"}
                  ]
            spec:
              hostIPC: true
              containers:
                - name: modelserver
                  securityContext:
                    # UCX pins memory for RDMA queue pairs; without it NIXL fails with
                    # "Please set max locked memory (ulimit -l) to 'unlimited'".
                    capabilities:
                      add: ["IPC_LOCK"]
                  resources:
                    limits:
                      amd.com/vnic: "2"
                    requests:
                      amd.com/vnic: "2"
                  env:
                    - { name: UCX_ROCM_COPY_DMABUF,   value: "yes" }
                    - { name: UCX_IB_GPU_DIRECT_RDMA,  value: "try" }
                    - { name: UCX_TLS,                 value: "self,rocm,shm,rc" }
                    - { name: UCX_LOG_LEVEL,           value: "INFO" }
                    # Disables the destination-GID check on UCX's datagram (ud_verbs) path over
                    # Ethernet, which UCX uses for keepalive.
                    - { name: UCX_UD_VERBS_ETH_DGID_CHECK, value: "n" }
                    - name: HF_HOME
                      value: /model-cache
                  volumeMounts:
                    - name: ucx-kernel-config
                      mountPath: /boot/config-6.8.0-124-generic
                      subPath: config-6.8.0-124-generic
                      readOnly: true
                    - mountPath: /model-cache
                      name: model-cache
              volumes:
                - name: ucx-kernel-config
                  configMap:
                    name: ucx-kernel-config
                - name: model-cache
                  persistentVolumeClaim:
                    claimName: model-pvc
    - name: decode
      spec: *amd-ci
