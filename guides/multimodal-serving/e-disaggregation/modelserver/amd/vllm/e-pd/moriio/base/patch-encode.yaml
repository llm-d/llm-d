apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: encode
      spec:
        replicas: 2
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: modelserver
                  # image is inherited from the recipe's encode role; the images
                  # component transformer runs before this patch, so setting it here
                  # would clobber the substituted image with the placeholder.
                  command: ["vllm", "serve"]
                  args:
                    - "Qwen/Qwen3-VL-32B-Instruct"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=2"
                    - "--trust-remote-code"
                    - "--mm-processor-cache-gb"
                    - "20"
                    - "--mm-encoder-only"
                    - "--enforce-eager"
                    - "--no-enable-prefix-caching"
                    - "--ec-transfer-config"
                    # ec_enable_nixl turns on P2P transfers between instances and ec_transport
                    # picks their data plane: "moriio" (MoRI-IO RDMA) instead of the default NIXL.
                    # ec_cpu_bytes (mandatory, no default) is the size in bytes of the shared CPU
                    # mmap region that holds encoder outputs for multimodal items. Keep it at 1 GiB
                    # with MoRI-IO.
                    # 1 GiB holds about 26,000 encoder tokens for Qwen3-VL-32B (40,960 bytes
                    # each). It must also fit in /dev/shm.
                    # See https://docs.vllm.ai/en/v0.30.0/features/ec_cpu_connector/
                    - '{"ec_connector": "ECCPUConnector", "ec_role": "ec_producer", "ec_connector_extra_config": {"ec_enable_nixl": true, "ec_transport": "moriio", "ec_cpu_bytes": 1073741824}}'
                  env:
                    - name: MORI_ENABLE_DMABUF_REG
                      value: "1"
                    - name: MORI_IB_GID_INDEX
                      value: "1"
                    - name: VLLM_EC_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: VLLM_EC_SIDE_CHANNEL_PORT
                      value: "5610"
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    # Workaround for https://github.com/vllm-project/vllm/issues/44548, required with vLLM v0.20.0+ due to torch 2.11
                    - name: USER
                      value: llm-d
                  ports:
                    - name: modelserver
                      containerPort: 8000
                      protocol: TCP
                    - name: ec-nixl
                      containerPort: 5610
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "8"
                      memory: 128Gi
                      amd.com/gpu: "2"
                    requests:
                      cpu: "8"
                      memory: 128Gi
                      amd.com/gpu: "2"
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.triton
                      name: triton-cache
                    - mountPath: /.config
                      name: config-cache
                  startupProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 90Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}
                - name: config-cache
                  emptyDir: {}
