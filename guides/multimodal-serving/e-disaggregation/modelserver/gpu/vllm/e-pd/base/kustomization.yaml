apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../../recipes/modelserver/base/single-host/pd-disaggregatedset/e-pd

nameSuffix: -e-pd

components:
  - ../../../../../../../recipes/modelserver/components/images/routing-sidecar/nightly
  - ../../../../../../../recipes/modelserver/components/images/gpu-vllm/release
  - ../../../../../../../recipes/modelserver/components/disaggregatedset-schema

labels:
  - pairs:
      llm-d.ai/model: Qwen3-VL-32B-Instruct
      llm-d.ai/guide: e-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: vllm
    fields:
      - path: spec/roles/spec/leaderWorkerTemplate/workerTemplate/metadata/labels
        kind: DisaggregatedSet
        create: true
patches:
  - path: patch-encode.yaml
  - path: patch-decode.yaml
  # VLLM_USE_V2_MODEL_RUNNER=1 for all vLLM instances: both instances (encode
  # and PD decode) use the CPU EC connector, which fails at startup without the
  # V2 model runner, see
  # https://docs.vllm.ai/en/v0.30.0/features/ec_cpu_connector/
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: encode
            spec: &env
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        env:
                          - name: VLLM_USE_V2_MODEL_RUNNER
                            value: "1"
          - name: decode
            spec: *env
