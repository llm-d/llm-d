apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../../recipes/modelserver/base/single-host/e-pd

namePrefix: e-pd-disaggregation-nvidia-gpu-vllm-

components:
  - ../../../../../../../recipes/modelserver/components/images/routing-sidecar/nightly
  - ../../../../../../../recipes/modelserver/components/images/gpu-vllm/nightly

labels:
  - pairs:
      llm-d.ai/model: Qwen3-VL-32B-Instruct
      llm-d.ai/guide: e-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: vllm
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-encode.yaml
  - path: patch-decode.yaml
  # VLLM_USE_V2_MODEL_RUNNER=1 for all vLLM instances: both instances (encode
  # and PD decode) use the CPU EC connector, which fails at startup without the
  # V2 model runner, see
  # https://docs.vllm.ai/en/latest/features/ec_cpu_connector/
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VLLM_USE_V2_MODEL_RUNNER
          value: "1"
