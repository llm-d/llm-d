apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Unscoped on purpose: encode and decode both transfer over NIXL,
  # so every one of them needs an IB device.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/rdma~1ib
        value: "1"
      - op: add
        path: /spec/template/spec/containers/0/resources/requests/rdma~1ib
        value: "1"
