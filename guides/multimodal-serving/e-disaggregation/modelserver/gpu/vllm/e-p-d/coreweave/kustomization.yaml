apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
components:
  - ../../../../../../../recipes/modelserver/components/disaggregatedset-schema
patches:
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: encode
            spec: &rdma
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        resources:
                          limits:
                            rdma/ib: "1"
                          requests:
                            rdma/ib: "1"
          - name: prefill
            spec: *rdma
          - name: decode
            spec: *rdma
