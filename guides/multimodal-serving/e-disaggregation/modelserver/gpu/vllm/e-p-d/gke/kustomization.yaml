apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
components:
  - ../../../../../../../recipes/modelserver/components/disaggregatedset-schema
patches:
  # Disable GKE's built-in NCCL tuner plugin (the disable-gke-nccl-tuner-patch component
  # only covers Deployment and LeaderWorkerSet).
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: encode
            spec: &env
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        env:
                          - name: NCCL_TUNER_PLUGIN
                            value: "none"
          - name: prefill
            spec: *env
          - name: decode
            spec: *env
