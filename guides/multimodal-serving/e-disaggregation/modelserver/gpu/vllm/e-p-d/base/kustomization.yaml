apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../../recipes/modelserver/base/single-host/pd/vllm
  - encode-deployment.yaml

namePrefix: e-p-d-disaggregation-nvidia-gpu-vllm-

components:
  - ../../../../../../../recipes/modelserver/components/images/routing-sidecar/nightly
  - ../../../../../../../recipes/modelserver/components/images/gpu-vllm/nightly

labels:
  - pairs:
      llm-d.ai/model: Qwen2.5-VL-32B-Instruct
      llm-d.ai/guide: e-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: vllm
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-prefill.yaml
  - path: patch-decode.yaml
  # The vLLM nightly tag moves. With the default IfNotPresent policy, a node reuses the
  # build it cached earlier, so prefill and decode can run different vLLM versions and
  # NIXL then rejects the P/D handshake. Always pulls the current build on every pod
  # start. It does not prevent skew when only some pods restart after the tag moves;
  # pin a digest for that.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
