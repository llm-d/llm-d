apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            # Qwen2.5-VL, not Qwen3-VL: Qwen3-VL fails to start in any pod with a
            # NixlConnector kv-transfer config on vLLM nightly (vllm-project/vllm#53699).
            - "Qwen/Qwen2.5-VL-32B-Instruct"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=2"
            - "--mm-processor-cache-gb"
            - "20"
            - "--kv-transfer-config"
            - '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_connector_extra_config": {"kv_lease_duration": 300}}'
            - "--no-disable-hybrid-kv-cache-manager"
            - "--gpu-memory-utilization=0.75"
            - "--ec-transfer-config"
            # ec_cpu_bytes (required) sizes the shared CPU encoder cache for multimodal
            # items, in bytes. Increase this value for workloads with large or numerous
            # images to prevent cache evictions and costly re-encodings that degrade
            # system performance. ec_enable_nixl moves the cached encoder outputs over
            # the NIXL data plane instead of the local mmap region only.
            - '{"ec_connector": "ECCPUConnector", "ec_role": "ec_consumer", "ec_connector_extra_config": {"ec_cpu_bytes": 1073741824, "ec_enable_nixl": true}}'
          env:
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          resources:
            limits:
              cpu: "8"
              memory: 256Gi
              nvidia.com/gpu: "2"
              rdma/ib: "1"
            requests:
              cpu: "8"
              memory: 256Gi
              nvidia.com/gpu: "2"
              rdma/ib: "1"
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /.config
              name: config-cache
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 90Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: config-cache
          emptyDir: {}
