apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CI-specific overlay for the AMD multimodal aggregation guide.
# Adds the persistent model cache (RWX PVC `model-pvc`, created ahead of time in
# the namespace) on top of the base overlay, so replicas do not each download
# the weights from HuggingFace.
# Requires the cluster's default StorageClass to support ReadWriteMany.
resources:
  - ../base
components:
  - ../../../../../../recipes/modelserver/components/model-cache
