apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 8
  template:
    spec:
      priorityClassName: medium
      nodeSelector:
        cloud.google.com/gke-tpu-topology: "2x2x1"
        cloud.google.com/gke-tpu-accelerator: "tpu7x"
      containers:
        - name: modelserver
          # Args are replaced wholesale, not merged, so the multimodal flags from
          # ../../../../base/vllm are repeated here.
          args:
            - "google/gemma-4-31B-it"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=4"
            - "--mm-processor-cache-gb"
            - "20"
          resources:
            limits:
              cpu: "16"
              memory: 256Gi
              google.com/tpu: 4
            requests:
              cpu: "8"
              memory: 128Gi
              google.com/tpu: 4
