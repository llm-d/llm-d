name: glm-5-2

# Which model server runs on which accelerator. `validated` = covered by a
# nightly E2E workflow; `community` = an overlay exists but is not run nightly;
# `unsupported` must link a tracking issue. A missing cell means unsupported.
# Keys must match env.static ACCELERATOR_TYPE / MODEL_SERVER values; `model`
# is the model the accelerator's overlay serves (used for MODEL on llm-d.ai);
# `notes` (optional, one line) fills the Notes column of the support table.
support:
  engines: {vllm: vLLM}
  accelerators:
    gpu:
      label: NVIDIA H200
      notes: "CoreWeave H200 (8 GPUs per node), InfiniBand · default 8 nodes / 64 GPUs (`p3w2d1w2` + tiered KV offloading); 2 to 10 nodes by `DEPLOYMENT` · P/D disaggregated wide-EP; needs an all-to-all RDMA fabric"
      model: zai-org/GLM-5.2-FP8
      engines: {vllm: community}

env:
  static:
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))

    GUIDE_NAME: glm-5-2
    NAMESPACE: llm-d-glm-5-2

    # Prometheus monitoring is opt-in: set MONITORING=true (requires the
    # monitoring stack) to run the deploy.monitoring* steps.
    MONITORING: {default: "false", values: ["false", "true"]}
    MONITORING_VALUES: {default: ""}

    ACCELERATOR_TYPE: {default: gpu, values: [gpu]}
    MODEL_SERVER: {default: vllm, values: [vllm]}
    ROUTING: {default: approximate, values: [approximate, precise]}
    # default = p3w2d1w2 + tiered KV offloading; ROUTING=precise sets
    # p2w1d1w1-precise; the others are the raw topologies (see Scaling and
    # Alternative Topologies)
    DEPLOYMENT:
      default: default
      values:
        - default
        - p1w1d1w1
        - p1w1d1w2
        - p1w2d1w2
        - p2w1d1w1
        - p2w1d1w1-precise
        - p2w1d1w2
        - p2w2d1w2
        - p2w2d2w2
        - p3w2d1w2
        - p3w2d2w2

    MODEL: {default: "zai-org/GLM-5.2-FP8", comment: "the model every deployment serves"}

  source: ["${REPO_ROOT}/guides/env.sh # defines GAIE_VERSION, ROUTER_CHART_VERSION, router chart URLs, and CURL_TEST_IMAGE"]

prerequisites:
  clone:
    - skip_in: [ci]
      run: |
        export BRANCH=main
        git clone https://github.com/llm-d/llm-d.git && cd llm-d && git checkout ${BRANCH}

  gaie:
    - run: |
        # GAIE_URL is automatically calculated from GAIE_VERSION at ${REPO_ROOT}/guides/env.sh
        kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/${GAIE_URL}/v1-manifests.yaml
  namespace:
    - run: kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
  secrets:
    - skip_in: [ci]
      run: |
        kubectl create secret generic llm-d-hf-token \
          --from-literal="HF_TOKEN=${HF_TOKEN}" \
          --namespace "${NAMESPACE}" \
          --dry-run=client -o yaml | kubectl apply -f -

deploy:
  router_values:
    approximate:
      - when: {ROUTING: [approximate]}
        run: |
          # Paths to values files: the wide-EP router values, then the GLM-5.2
          # dual GPU+CPU prefix-cache scoring overrides on top
          export ROUTER_BASE_VALUES="${REPO_ROOT}/guides/recipes/router/base.values.yaml"
          export ROUTER_VALUES="${REPO_ROOT}/guides/${GUIDE_NAME}/router/${GUIDE_NAME}.values.yaml"
          export ROUTER_OVERRIDES_VALUES="${REPO_ROOT}/guides/${GUIDE_NAME}/router/glm-5.2-overrides.values.yaml"
    precise:
      - when: {ROUTING: [precise]}
        # ROUTING is not a variant dimension (ACCELERATOR_TYPE/MODEL_SERVER), so
        # guide.py does not wrap it in cicd:skip; README-parsing nightlies run
        # the default approximate mode only.
        skip_in: [ci]
        run: |
          # Paths to values files: the wide-EP router values, then the GLM-5.2
          # precise KV-event-backed prefix-cache routing overrides on top
          export ROUTER_BASE_VALUES="${REPO_ROOT}/guides/recipes/router/base.values.yaml"
          export ROUTER_VALUES="${REPO_ROOT}/guides/${GUIDE_NAME}/router/${GUIDE_NAME}.values.yaml"
          export ROUTER_OVERRIDES_VALUES="${REPO_ROOT}/guides/${GUIDE_NAME}/router/precise-routing.values.yaml"
          # Precise routing needs the kv-events + render overlay
          export DEPLOYMENT=p2w1d1w1-precise

  monitoring_values:
    - when: {MONITORING: ["true"]}
      run: export MONITORING_VALUES="-f ${REPO_ROOT}/guides/recipes/router/features/monitoring.values.yaml"

  standalone:
    - run: |
        helm install ${GUIDE_NAME} \
          ${ROUTER_STANDALONE_CHART} \
          -f ${ROUTER_BASE_VALUES} \
          ${MONITORING_VALUES} \
          -f ${ROUTER_VALUES} \
          -f ${ROUTER_OVERRIDES_VALUES} \
          -n ${NAMESPACE} --version ${ROUTER_CHART_VERSION}

  modelserver:
    - run: |
        kubectl apply -n ${NAMESPACE} \
          -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/deployments/${DEPLOYMENT}

  monitoring:
    # PodMonitors that scrape every DP rank port (rank0-rank7)
    - when: {MONITORING: ["true"]}
      run: kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/monitoring

verify:
  endpoint:
    standalone:
      - run: export IP=$(kubectl get service ${GUIDE_NAME}-epp -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}')
  tests:
    request:
      - run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"Explain how a simple agent loop works in 3 sentences.\"}"'
    served_model:
      - run: |
          # The router must reach a model server that serves MODEL and returns tokens
          kubectl run serve-check --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'R=$(curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"Say hello.\", \"max_tokens\": 16}")
              echo "${R}" | grep -q "\"model\":\"${MODEL}\"" && echo "${R}" | grep -q "\"choices\"" \
                && echo "OK: ${MODEL} served through the router" \
                || { echo "FAIL: ${R}"; exit 1; }'
    precise_routing:
      # skip_in: ROUTING is not a variant dimension (see deploy.router_values.precise)
      - when: {ROUTING: [precise]}
        skip_in: [ci]
        run: |
          # The render Service must return token IDs for MODEL
          kubectl run render-check --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://wide-ep-render:8000/v1/completions/render" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"render check\", \"max_tokens\": 1}"'
      - when: {ROUTING: [precise]}
        skip_in: [ci]
        run: |
          # Each engine pod must hold 8 established ZMQ subscriptions (ports 5557-5564) from the EPP
          EPP_IP=$(kubectl -n ${NAMESPACE} get endpointslices \
            -l kubernetes.io/service-name=${GUIDE_NAME}-epp \
            -o jsonpath='{.items[0].endpoints[0].addresses[0]}')
          ZMQ_FAILED=0
          for POD in $(kubectl -n ${NAMESPACE} get pods \
            -l llm-d.ai/inference-serving=true -o name); do
            N=$(kubectl -n ${NAMESPACE} exec "${POD}" -c vllm -- python3 -c "
          hx=''.join(f'{int(o):02X}' for o in reversed('${EPP_IP}'.split('.')))
          print(sum(1 for line in open('/proc/net/tcp')
                    if len(line.split()) > 3 and line.split()[3] == '01'
                    and line.split()[2].split(':')[0] == hx
                    and 5000 <= int(line.split()[1].split(':')[1], 16) < 6000))")
            if [ "${N:-0}" -ge 8 ]; then echo "OK: ${POD} ${N} subscriptions"
            else echo "FAIL: ${POD} ${N:-0} subscriptions (want 8)"; ZMQ_FAILED=1; fi
          done
          [ "${ZMQ_FAILED}" = 0 ]

cleanup:
  modelserver:
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/deployments/${DEPLOYMENT}
  rest:
    - run: helm uninstall ${GUIDE_NAME} -n ${NAMESPACE}
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/monitoring --ignore-not-found=true
    - skip_in: [ci]
      run: kubectl delete namespace ${NAMESPACE}
