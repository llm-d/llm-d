# One-time checkpoint download into an NFS RWX PVC shared by both
# fastsafetensors tests, so the timed `vllm serve` measures storage->HBM and
# never HuggingFace egress.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fst-model-cache
spec:
  accessModes: [ReadWriteMany]
  # Change to your cluster's RWX-capable StorageClass; shared-vast is
  # CoreWeave's NFS class (where this guide was validated).
  storageClassName: shared-vast
  resources:
    requests:
      storage: 300Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fst-prewarm-llama33-70b
spec:
  backoffLimit: 2
  template:
    metadata:
      annotations:
        # A sidecar would keep running after the download exits and block the
        # Job from ever completing. This Job needs no mesh access.
        sidecar.istio.io/inject: "false"
      labels:
        llm-d.ai/model: Llama-3.3-70B-Instruct
        llm-d.ai/guide: fastsafetensors-nfs
        llm-d.ai/role: prewarm
    spec:
      restartPolicy: OnFailure
      containers:
        - name: hf-download
          image: REPLACE_MODEL_SERVER_IMAGE
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              DEST=/models/Llama-3.3-70B-Instruct
              MODEL=meta-llama/Llama-3.3-70B-Instruct
              # Verify against the safetensors index, not file existence: a
              # download interrupted by a volume quota leaves a partial
              # checkpoint that still has config.json and some shards.
              verify() {
                python3 -c "import json,os,sys; d='$DEST'; \
              idx=os.path.join(d,'model.safetensors.index.json'); \
              sys.exit(1) if not (os.path.exists(idx) and os.path.exists(os.path.join(d,'tokenizer.json'))) else None; \
              shards=sorted(set(json.load(open(idx))['weight_map'].values())); \
              bad=[s for s in shards if not os.path.exists(os.path.join(d,s)) or os.path.getsize(os.path.join(d,s))<1000000]; \
              sys.exit(1) if bad else print('checkpoint complete: %d shards' % len(shards))"
              }
              if verify 2>/dev/null; then
                echo "checkpoint already warm on NFS, skipping download"; exit 0
              fi
              # Exclude repo variant dirs (original/ consolidated checkpoints)
              # that the serving path never reads; they can multiply the
              # download size past the PVC quota.
              # `hf` is the current CLI; fall back to huggingface-cli on older images.
              if command -v hf >/dev/null 2>&1; then
                hf download "$MODEL" --local-dir "$DEST" --exclude "original/*"
              else
                huggingface-cli download "$MODEL" --local-dir "$DEST" --exclude "original/*"
              fi
              verify
          env:
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            # Llama-3.3-70B is gated: this token is REQUIRED, not optional.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          resources:
            requests:
              cpu: '4'
              memory: 16Gi
            limits:
              cpu: '8'
              memory: 32Gi
          volumeMounts:
            - mountPath: /models
              name: model-cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: fst-model-cache
