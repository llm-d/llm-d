apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Mounts a projected ServiceAccount token (audience `modelexpress`) where the
# ModelExpress client looks for it by default. The client attaches it to every
# broker call, which the broker verifies when MODEL_EXPRESS_SECURITY_MODE=enforce.
patches:
  - target:
      kind: Deployment
      name: decode
    path: patch-mx-auth.yaml
