apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Pairs with security/serviceaccount-auth.yaml on the server side. The client
# only sends a token when one exists at MX_AUTH_TOKEN_PATH, so this component
# is safe to layer against an auth-off broker.
patches:
  - target:
      kind: Deployment
      name: decode
    path: patch-token.yaml
