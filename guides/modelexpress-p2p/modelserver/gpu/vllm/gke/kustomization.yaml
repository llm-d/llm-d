apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

# GKE A3 Ultra: GPU DRA + DRANET claims (one GPU+NIC pair per TP rank) instead
# of the nvidia.com/gpu extended resource — same pattern as the
# pd-disaggregation gke overlay — plus the UCX reachability/multipath settings
# for GKE's rail fabric.
components:
  - ../../../../../pd-disaggregation/modelserver/components/gke-rdma

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: decode
      spec:
        template:
          spec:
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
            resourceClaims:
              - name: gke-rdma-claim-0
                resourceClaimTemplateName: gke-rdma-template
              - name: gke-rdma-claim-1
                resourceClaimTemplateName: gke-rdma-template
            containers:
              - name: modelserver
                env:
                  - name: UCX_IB_ROCE_REACHABILITY_MODE
                    value: "all"
                  - name: UCX_IB_NUM_PATHS
                    value: "4"
                  - name: UCX_MAX_RMA_RAILS
                    value: "4"
                resources:
                  claims:
                    - name: gke-rdma-claim-0
                    - name: gke-rdma-claim-1
  - target:
      kind: Deployment
      name: decode
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
      - op: remove
        path: /spec/template/spec/containers/0/resources/requests/nvidia.com~1gpu
