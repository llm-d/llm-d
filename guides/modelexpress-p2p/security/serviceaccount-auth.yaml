# TokenReview is a cluster-scoped create, so the broker's ServiceAccount
# needs the built-in system:auth-delegator role; the binding name embeds the
# namespace because ClusterRoleBindings collide across namespaces.
# ${NAMESPACE} is expanded via envsubst (see the README's Security section).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modelexpress-tokenreview-${NAMESPACE}
  labels:
    app.kubernetes.io/name: modelexpress
    llm-d.ai/guide: modelexpress-p2p
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: modelexpress
    namespace: ${NAMESPACE}
