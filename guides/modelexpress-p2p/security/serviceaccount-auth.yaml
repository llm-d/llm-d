# ServiceAccount auth for the broker (ModelExpress >= 0.5.0): the server
# verifies caller tokens via the Kubernetes TokenReview API in-process, then
# authorizes the extracted <namespace>:<serviceaccount> against an allowlist.
#
# TokenReview is a cluster-scoped create, so the server's ServiceAccount needs
# the built-in system:auth-delegator role. The binding name embeds the
# namespace because ClusterRoleBindings are cluster-scoped.
#
# ${NAMESPACE} is expanded via envsubst; see the README's Security section
# for the apply command and the server env vars that turn enforcement on.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modelexpress-tokenreview-${NAMESPACE}
  labels:
    app.kubernetes.io/name: modelexpress
    llm-d.ai/guide: modelexpress-p2p
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: modelexpress
    namespace: ${NAMESPACE}
