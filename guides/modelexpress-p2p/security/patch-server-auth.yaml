# enforce fails server config validation if either list is empty, so a
# mistyped env name fails loudly instead of accepting every caller.
# ${NAMESPACE} is expanded via envsubst before kubectl patch.
spec:
  template:
    spec:
      containers:
        - name: modelexpress-server
          env:
            - name: MODEL_EXPRESS_SECURITY_MODE
              value: "enforce"
            - name: MODEL_EXPRESS_SECURITY_TOKEN_AUDIENCES
              value: "modelexpress"
            - name: MODEL_EXPRESS_SECURITY_ALLOWED_SERVICE_ACCOUNTS
              value: "${NAMESPACE}:modelexpress-p2p-nvidia-gpu-vllm-sa"
