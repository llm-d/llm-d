# Infra values
gateway:
  gatewayClassName: istio
  gatewayParameters:
    accessLogging: true  # Enable access logging to see requests
    logLevel: debug  # Most verbose: error < warn < info < debug
    resources:
      limits:
        cpu: "16"
        memory: 16Gi
      requests:
        cpu: "4"
        memory: 4Gi

# GAIE values
inferenceExtension:
  flags:
    v: 5  # Changed to DEBUG level for prediction logging
provider:
  name: istio
  istio:
    destinationRule:
      trafficPolicy:
        connectionPool:
          http:
            http1MaxPendingRequests: 256000
            maxRequestsPerConnection: 256000
            http2MaxRequests: 256000
            idleTimeout: "900s"
          tcp:
            maxConnections: 256000
            maxConnectionDuration: "1800s"
            connectTimeout: "900s"

# MS values
routing:
  proxy:
    # Disable zap flags - routing-proxy uses klog, not zap
    zapEncoder: null  # Removes --zap-encoder flag
    zapLogLevel: null  # Removes --zap-log-level flag
    args:
      - "-v=5"  # klog verbosity for routing-proxy
