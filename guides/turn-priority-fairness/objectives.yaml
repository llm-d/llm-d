# Without this, traffic stays at priority 0 and turn-priority never runs.
# The latest router release serves v1alpha2. The unreleased v1 uses
# `poolRefs`, a list, instead of `poolRef`.
apiVersion: llm-d.ai/v1alpha2
kind: InferenceObjective
metadata:
  name: agentic-sessions
  labels:
    llm-d.ai/guide: "turn-priority-fairness"
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: "Qwen3-30B-A3B-Instruct-2507"
spec:
  priority: -1
  poolRef:
    name: turn-priority-fairness
