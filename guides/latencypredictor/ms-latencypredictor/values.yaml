multinode: false

modelArtifacts:
  uri: "hf://Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8" # recreate the blog
  name: Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8
  size: 1000Gi
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "latencypredictor-based-scheduling"
    llm-d.ai/accelerator-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    llm-d.ai/accelerator-instance: "H200"
    llm-d.ai/model: "Qwen3-Coder-480B-A35B-Instruct-FP8"

tracing:
  enabled: false

