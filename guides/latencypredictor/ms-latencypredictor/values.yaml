routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.6.0
    connector: nixlv2
    secure: false

decode:
  create: true
  replicas: 4
  parallelism:
    data: 8
  monitoring:
    podmonitor:
      enabled: true
      portName: "vllm"
      path: "/metrics"
      interval: "30s"
  containers:
    - name: "vllm"
      image: ghcr.io/llm-d/llm-d-cuda-dev:latest
      securityContext:
        capabilities:
          add:
            - IPC_LOCK
            - SYS_RAWIO
        runAsGroup: 0
        runAsUser: 0
      modelCommand: vllmServe
      args:
        - "--block-size"
        - "128"
        - "--kv-transfer-config"
        - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
        - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
        - "--enable-expert-parallel"
        - "--data-parallel-size" 
        - "8"
        - "--all2all-backend"
        - "deepep_low_latency"
        - "--gpu-memory-utilization"
        - "0.95"
        - "--max-model-len"
        - "64000"
      env:
        - name: VLLM_MOE_DP_CHUNK_SIZE
          value: "384"  # vLLM default is 256
        - name: VLLM_USE_DEEP_GEMM
          value: "1"
        - name: NVIDIA_GDRCOPY
          value: enabled
        - name: NVSHMEM_REMOTE_TRANSPORT
          value: ibgda
        - name: NVSHMEM_IB_ENABLE_IBGDA
          value: "true"
        - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
          value: eth0
        - name: GLOO_SOCKET_IFNAME
          value: eth0
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: VLLM_LOGGING_LEVEL
          value: INFO
        - name: NVSHMEM_DISABLE_CUDA_VMM
          value: "0"
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      ports:
        - containerPort: 8200
          name: vllm
          protocol: TCP
        - containerPort: 5600
          name: nixl
          protocol: TCP
      resources:
        limits:
          ephemeral-storage: 1Ti
          memory: 512Gi
          nvidia.com/gpu: "8"
          rdma/ib: 1
        requests:
          cpu: "32"
          ephemeral-storage: 1Ti
          memory: 512Gi
          nvidia.com/gpu: "8"
          rdma/ib: 1
      mountModelVolume: true
      volumeMounts:
        - name: metrics-volume
          mountPath: /.config
        - name: shm
          mountPath: /dev/shm
        - name: torch-compile-cache
          mountPath: /.cache
      startupProbe:
        httpGet:
          path: /v1/models
          port: vllm
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 60
      livenessProbe:
        httpGet:
          path: /health
          port: vllm
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /v1/models
          port: vllm
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
  volumes:
    - name: metrics-volume
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "16Gi"
    - name: torch-compile-cache
      emptyDir: {}

