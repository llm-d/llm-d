ap:
  # The Async Processor needs to know where to send the requests it pulls from the queue.
  # Default assumes optimized-baseline stack in llm-d-inference-scheduler namespace.
  igwBaseURL: "http://infra-optimized-baseline-inference-gateway-istio.llm-d-inference-scheduler.svc.cluster.local:80"
  
  image:
    repository: ghcr.io/llm-d-incubation/llm-d-async
    tag: v0.6.1
  imagePullPolicy: Always

  metrics:
    enabled: true
    port: 9090
    secure: false

  messageQueueImpl: "redis-sortedset"
  
  redis:
    enabled: true
    host: "redis-master.redis.svc.cluster.local"
    port: 6379
    requestPathURL: "/v1/completions"
    requestQueueName: "request-sortedset"
    resultQueueName: "result-list"
    auth:
       enabled: false
       secretName: "redis-creds"
       # usernameKey: "username" # Optional: key in the secret for the username
       # passwordKey: "password" # Optional: key in the secret for the password

  gcpPubSub:
    enabled: false
