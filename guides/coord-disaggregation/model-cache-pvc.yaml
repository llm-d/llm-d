apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-d-model-cache
  labels:
    llm-d.ai/guide: coord-disaggregation
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 250Gi
  # Must resolve to an RWX-capable StorageClass (e.g. NFS, CephFS, EFS, GCP
  # Filestore). Remove this field entirely if your cluster's default
  # StorageClass is already RWX-capable.
  # storageClassName: <your-rwx-storage-class>
  volumeMode: Filesystem
