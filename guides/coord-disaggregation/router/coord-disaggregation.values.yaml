## Coordinator Disaggregation guide overrides for the single EPP / InferencePool that
## covers all three roles (encode, prefill, decode).
## Layer on top of: recipes/router/base.values.yaml
##
## One EPP instance runs one scheduling profile per call, selected by the
## coordinator's `x-llm-d-epp-profile` header via the `header-profile-handler`
## plugin (merged in llm-d-router#2134). Each profile filters the shared pool
## down to its own role with a role-specific `*-filter` plugin, so the InferencePool
## selector below matches on the guide label only, not `llm-d.ai/role`.

# The chart's own HTTPRoute (from features/httproute-flags.yaml) would be an
# unconditional catch-all on `/` with no header match, tying in specificity
# with the Coordinator's own catch-all `/` HTTPRoute on the same Gateway — and
# (by creation-order tiebreak) winning, sending every client request straight
# to this router/EPP instead of through the Coordinator. The single combined
# router needs to match x-llm-d-epp-profile being encode OR prefill OR decode,
# which the chart's headerMatches (a single exact-match map) can't express, so we
# disable it here and hand-author router/httproute/base/httproute.yaml instead (see there
# for the OR'd header matches).
httpRoute:
  create: false

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    # Single EPP replica: the inflight-load-producer's in-flight token accounting and
    # approx-prefix-cache-producer's cache state (which token-load-scorer,
    # prefix-cache-affinity-filter, and active-request-scorer consume across all three
    # profiles) are local to this EPP process, so multiple replicas would each see only
    # a fraction of the per-endpoint load/cache picture and mis-score requests.
    replicas: 1
    # TODO: Remove this image override once an official release including
    # llm-d-router#2134 (header-profile-handler) is published. v0.9.0 predates
    # that merge; main is the earliest build that has it.
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: "main"
    flags:
      allow-experimental-plugins: true
    pluginsConfigFile: "coordinator-plugins.yaml"
    pluginsCustomConfig:
      # prefill/decode scorers below match guides/pd-disaggregation/router/pd-disaggregation.values.yaml:
      # prefix-cache-affinity-filter + token-load-scorer for prefill (keep prefix groups
      # on cache-warm pods, then pick by queued token load), active-request-scorer for
      # decode (pick the least-busy endpoint). pd-disaggregation has no encode role to
      # borrow a scorer from, so encode reuses active-request-scorer too (pick the
      # least-busy encode pod) -- encode has no prefix-cache affinity to speak of.
      #
      # peakPrefillThroughput is left at the plugin's own default (not pd-disaggregation's
      # 33821, which is calibrated for gpt-oss-120b on 8x H200 prefill -- meaningless for
      # this guide's Qwen3-VL-32B-Instruct/TP=2 model servers). Recalibrate for your
      # hardware with guides/recipes/router/calibration/calibrate.sh.
      #
      # Plugin order below: the rollout screener runs per request before any profile,
      # then the role filters and the profile handler, then the producers, and
      # prefix-based-pd-decider last of the non-picker plugins because it reads from
      # both token-producer and decode-prefix-producer.
      coordinator-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        # Real engine token IDs, rendered through the prefill pods' own /render
        # endpoints. Without this the framework auto-creates the tokenizer-free
        # `estimate` backend, whose byte-packed IDs do not line up with the engine's
        # block boundaries, so every prefix signal below is weaker than it looks.
        - type: token-producer
          parameters:
            # Must match the model the overlay deploys: the render call lands on the
            # model servers themselves, so a mismatch is rejected rather than silently
            # tokenizing with the wrong tokenizer.
            modelName: Qwen/Qwen3-VL-32B-Instruct
            vllm:
              endpointDiscovery:
                # Render on the prefill pods only. They serve /v1/*/render because they
                # run with --enable-scale-out, and this is the same role the render
                # Service fronts (render/service.yaml) -- decode stays free to decode.
                # This pool spans all three roles (the guide label), so each encode and
                # decode pod logs one harmless "does not match any port rule" extractor
                # error when it joins the data layer; only prefill is a render target.
                # portRules filter the endpoints this pool already supplies -- they
                # cannot reach pods outside it, which is why the role-scoped decode EPP
                # in coord-disaggregation-decode.values.yaml uses vllm.url instead.
                portRules:
                - selector:
                    matchLabels:
                      llm-d.ai/role: prefill
                  basePort: 8000
                # Cap each attempt so one busy pod cannot consume the whole render
                # budget and leave no time to retry on another. Multimodal renders
                # download images, so this is looser than the text-only guides' 2s.
                attemptTimeout: 5s
              # Render only, never serve: rewrites the output budget on the render copy.
              prefillOnly: true
              messagesRenderMode: native
              # Leave vLLM's processed multimodal tensors out of the render response.
              # The producer only needs token IDs, mm_hashes and mm_placeholders, and
              # the tensors can reach tens of MB per request.
              omitMMKwargs: true
              timeout: 15s
              mmTimeout: 15s
        # A second, decode-scoped prefix index. prefix-based-pd-decider answers "can
        # this decode pod serve the request directly?" from what each decode pod has
        # already served, so the index has to be built from decode traffic, separately
        # from the prefill-side producer above.
        - type: approx-prefix-cache-producer
          name: decode-prefix-producer
          parameters:
            autoTune: true
            maxPrefixTokensToMatch: 0
            maxPrefixBlocksToMatch: 0
        # Keeps all phases of one request on a single DisaggregatedSet revision during
        # a rollout, so an encode or prefill pod of one revision is never paired with a
        # decode pod of another (mismatched engine versions can fail the encoder-cache
        # or KV handshake). The Coordinator already tags each phase call with
        # x-llm-d-disagg-revision and gives an image's parallel encode subrequests a
        # shared x-llm-d-revision-decision-id; this plugin is what acts on them.
        # See docs/operations/disaggregation/safe-rollouts.md.
        - type: disaggregatedset-rollout-screener
          parameters:
            scope:
              # The shared guide label, not disaggregatedset.x-k8s.io/name: the screener
              # has to see every role of the set, and this matches the InferencePool
              # selector below.
              labelSelector: "llm-d.ai/guide=coord-disaggregation"
            revisionGating:
              mode: max-role
              requiredRoles: [encode, prefill, decode]
              # Keep the turns of one session on one revision during a rollout.
              # The default random draw spreads consecutive turns across the old and
              # new revisions, so each switch lands on pods that do not hold the
              # session's KV cache and the prefix is recomputed. This guide's
              # multimodal requests have no text conversation prefix to key on, so
              # prefixCache sends them to the revision holding the longest cached
              # prefix -- the same decode-side index the gate reads, which is why
              # both producers are declared above the screener (the match info has
              # to cover every revision's endpoints, so they run during request
              # handling rather than after screening).
              affinity:
                mode: prefix
                sources:
                - header: x-session-id
                prefixCache:
                  producerName: decode-prefix-producer
              # disableCoordination is deliberately unset: the encode step fans out one
              # subrequest per image (max_parallel: 8 in the Coordinator pipeline), and
              # coordination is what resolves those to one revision. It is only safe to
              # disable on the PD-only variant, which has no encode role.
        - type: encode-filter
        - type: prefill-filter
        - type: decode-filter
        - type: header-profile-handler
        - type: approx-prefix-cache-producer
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
        - type: token-load-scorer
        - type: active-request-scorer
        - type: prefix-cache-scorer
          name: decode-prefix-scorer
          parameters:
            prefixMatchInfoProducerName: decode-prefix-producer
        # The gate for the Coordinator's conditional-decode step, which probes decode
        # with `Prefer: if-available`. Without a plugin claiming that header the EPP
        # default-denies with 412 (llm-d-router#2335), so the fast path never runs and
        # every request pays the full encode -> prefill -> decode cascade.
        - type: prefix-based-pd-decider
          parameters:
            # A request whose uncached suffix is shorter than this is served by the
            # chosen decode pod directly; at or above it, it disaggregates through
            # encode/prefill. The natural ceiling is decode's
            # --max-num-batched-tokens, so "fits one decode step" is what the gate
            # measures. Decode leaves that flag unset, and vLLM derives it from the
            # device: 8192 for the OpenAI server on a >=70 GiB non-A100 GPU (the H200
            # this guide targets), 16384 at >=160 GiB, 2048 otherwise. Confirm it for
            # your hardware from the decode pod's startup log:
            #   kubectl logs -n ${NAMESPACE} -l llm-d.ai/role=decode \
            #       | grep -o 'max_num_batched_tokens=[0-9]*' | head -1
            # A lower value is a valid deliberate dial, not a safety margin: it sends
            # more requests through prefill. The P2P guides ship 1024 and 512 for that
            # reason. 8192 here keeps the fast path as wide as one decode step allows.
            nonCachedTokens: 8192
            prefixMatchInfoProducerName: decode-prefix-producer
        - type: max-score-picker
        schedulingProfiles:
        - name: encode
          plugins:
          - pluginRef: encode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        - name: decode
          plugins:
          - pluginRef: decode-filter
          # Score decode on its own prefix index first, so the conditional-decode probe
          # lands on the pod that actually holds the prefix rather than merely the
          # least-busy one. Without this a direct serve happens only by chance.
          - pluginRef: decode-prefix-scorer
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker

  modelServers:
    matchLabels:
      llm-d.ai/guide: "coord-disaggregation"
