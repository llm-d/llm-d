## Coordinator Disaggregation guide overrides for the single EPP / InferencePool that
## covers all three roles (encode, prefill, decode).
## Layer on top of: recipes/router/base.values.yaml
##
## One EPP instance runs one scheduling profile per call, selected by the
## coordinator's `EPP-Phase` header via the `header-phase-profile-handler`
## plugin (llm-d-router PR #2134). Each profile filters the shared pool down
## to its own role with a `*-filter` by-label plugin, so the InferencePool
## selector below matches on the guide label only, not `llm-d.ai/role`.

# The chart's own HTTPRoute (from features/httproute-flags.yaml) would be an
# unconditional catch-all on `/` with no header match, tying in specificity
# with the Coordinator's own catch-all `/` HTTPRoute on the same Gateway — and
# (by creation-order tiebreak) winning, sending every client request straight
# to this router/EPP instead of through the Coordinator. The single combined
# router needs to match EPP-Phase being encode OR prefill OR decode, which the
# chart's headerMatches (a single exact-match map) can't express, so we
# disable it here and hand-author router/httproute.yaml instead (see there
# for the OR'd header matches).
httpRoute:
  create: false

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    # PR #2134 (single EPP for encode/prefill/decode) isn't merged/released yet;
    # this is a build of llm-d-router containing it. Swap back to the chart
    # default once the PR lands in an official image.
    image:
      registry: ghcr.io/roytman
      repository: llm-d-router-endpoint-picker
      tag: "1-epp"
    pluginsConfigFile: "epd-plugins.yaml"
    pluginsCustomConfig:
      epd-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: encode-filter
        - type: prefill-filter
        - type: decode-filter
        - type: header-phase-profile-handler
        schedulingProfiles:
        - name: encode
          plugins:
          - pluginRef: encode-filter
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
        - name: decode
          plugins:
          - pluginRef: decode-filter

  modelServers:
    matchLabels:
      llm-d.ai/guide: "coord-disaggregation"
