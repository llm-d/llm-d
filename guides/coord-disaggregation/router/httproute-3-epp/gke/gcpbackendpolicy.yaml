# GKE Gateway ignores the Gateway API HTTPRoute `timeouts` field (dropped by
# kustomization.yaml's patch for this overlay) -- on GKE the backend timeout is a
# load balancer setting, configured here instead, one policy per role
# InferencePool. The default is 30s, which would cut off any generation longer
# than that; 300s matches the request timeout the base sets on the HTTPRoute and
# the Coordinator's own server.write_timeout
# (../../../coordinator/base/configmap.yaml).
#
# Only one GCPBackendPolicy can attach to a given target at a time, so if you add
# other backend settings (logging, Cloud Armor) for one of these InferencePools,
# fold them into its policy rather than creating a second one.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: ${GUIDE_NAME}-encode-backend-policy
spec:
  default:
    timeoutSec: 300
  targetRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: ${GUIDE_NAME}-encode
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: ${GUIDE_NAME}-prefill-backend-policy
spec:
  default:
    timeoutSec: 300
  targetRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: ${GUIDE_NAME}-prefill
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: ${GUIDE_NAME}-decode-backend-policy
spec:
  default:
    timeoutSec: 300
  targetRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: ${GUIDE_NAME}-decode
