## Coordinator Disaggregation guide overrides for the prefill-only EPP / InferencePool,
## part of the "3 separate EPPs" alternative to the single combined EPP (see
## router/coord-disaggregation.values.yaml).
## Layer on top of: recipes/router/base.values.yaml
##
## This EPP only ever sees prefill-labeled pods (modelServers.matchLabels below), so no
## `prefill-filter` is needed -- just the scorers. These match the prefill profile in
## guides/pd-disaggregation/sidecar/router/pd-disaggregation.values.yaml: keep prefix groups on
## cache-warm pods (prefix-cache-affinity-filter), then pick by queued prefill token
## load (token-load-scorer).
##
## peakPrefillThroughput is left at the plugin's own default (not pd-disaggregation's
## calibrated 33821, which is tuned for gpt-oss-120b on 8x H200 prefill -- meaningless
## for this guide's Qwen3-VL-32B-Instruct/TP=2 model servers). Recalibrate for your
## hardware with guides/recipes/router/calibration/calibrate.sh.

# See router/httproute-3-epp/base/httproute.yaml for why this guide hand-authors the HTTPRoute
# instead of using the chart's own (same reason as the single-EPP variant: it
# needs Exact path matches to tie in specificity with the Coordinator's own
# Exact-path HTTPRoute).
httpRoute:
  create: false

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    # Single EPP replica: the inflight-load-producer's in-flight token accounting and
    # approx-prefix-cache-producer's cache state (which token-load-scorer and
    # prefix-cache-affinity-filter consume) are local to this EPP process, so multiple
    # replicas would each see only a fraction of the per-endpoint load/cache picture
    # and mis-gate the affinity filter.
    replicas: 1
    # TODO: Remove this image override once an official release including
    # disaggregatedset-rollout-screener (and, on decode, prefix-based-pd-decider)
    # is published.
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: "main"
    flags:
      # disaggregatedset-rollout-screener is an Alpha plugin.
      allow-experimental-plugins: true
    pluginsConfigFile: "coordinator-plugins.yaml"
    pluginsCustomConfig:
      coordinator-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        # Pins all phases of a request to one DisaggregatedSet revision during a
        # rollout. The screener does not read the InferencePool: it watches Pods
        # through the manager cache (namespace-scoped, no label selector) and keeps
        # the ones matching its own scope, so this role-scoped EPP still sees every
        # role of the set. Each EPP is a single process, so the local coordination
        # fallback covers the encode fan-out, and the forwarded
        # x-llm-d-disagg-revision pins prefill to the same revision as decode.
        - type: disaggregatedset-rollout-screener
          parameters:
            scope:
              labelSelector: "llm-d.ai/guide=coord-disaggregation"
            revisionGating:
              mode: max-role
              requiredRoles: [encode, prefill, decode]
              # Same x-session-id affinity as the decode EPP. A request that
              # cascades here after the conditional-decode probe answered 412
              # carries no x-llm-d-disagg-revision (a 412 never stamps one), so
              # without affinity this EPP would draw at random and the session
              # could leave the revision the decode EPP chose for the probe. One
              # session key hashes to the same revision on every EPP while they
              # see the same eligible revisions and shares; each EPP derives the
              # shares from its own Pod events, so two can briefly disagree during
              # a rollout step (llm-d-router#3931 carries the probe's revision
              # across the 412 instead). No prefixCache: only the decode EPP has
              # the index it reads. Later phases follow the revision this EPP's
              # response stamps either way.
              affinity:
                mode: prefix
                sources:
                - header: x-session-id
        # Real engine token IDs for the prefix hashing below. Without this the
        # framework auto-creates the tokenizer-free `estimate` backend, whose
        # byte-packed IDs do not line up with the engine's block boundaries, so
        # prefix-cache-affinity-filter's signal is weaker than it looks. This pool is
        # prefill-scoped, so render lands on its own endpoints (they serve
        # /v1/*/render under --enable-scale-out). See the single-EPP variant
        # (coord-disaggregation.values.yaml) for the same block with more context.
        - type: token-producer
          parameters:
            modelName: Qwen/Qwen3-VL-32B-Instruct
            vllm:
              endpointDiscovery:
                attemptTimeout: 5s
              prefillOnly: true
              messagesRenderMode: native
              omitMMKwargs: true
              timeout: 15s
              mmTimeout: 15s
        - type: approx-prefix-cache-producer
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
        - type: token-load-scorer
        - type: max-score-picker
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker

  modelServers:
    matchLabels:
      llm-d.ai/guide: "coord-disaggregation"
      llm-d.ai/role: "prefill"
