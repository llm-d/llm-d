## Coordinator Disaggregation guide overrides for the encode-only EPP / InferencePool,
## part of the "3 separate EPPs" alternative to the single combined EPP (see
## router/coord-disaggregation.values.yaml).
## Layer on top of: recipes/router/base.values.yaml
##
## This EPP only ever sees encode-labeled pods (modelServers.matchLabels below), so the
## chart's default plugins config (single-profile-handler, one "default" scheduling
## profile) is enough -- no header-based profile routing, and no scorer override:
## pd-disaggregation (whose prefill/decode scorers the sibling files here mirror) has no
## encode role to borrow one from.

# See router/httproute-3-epp.yaml for why this guide hand-authors the HTTPRoute
# instead of using the chart's own (same reason as the single-EPP variant: it
# needs Exact path matches to tie in specificity with the Coordinator's own
# Exact-path HTTPRoute).
httpRoute:
  create: false

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  modelServers:
    matchLabels:
      llm-d.ai/guide: "coord-disaggregation"
      llm-d.ai/role: "encode"
