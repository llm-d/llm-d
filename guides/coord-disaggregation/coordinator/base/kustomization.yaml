apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- configmap.yaml
- deployment.yaml
- httproute.yaml

# nightly (the main tag), not release: the pipeline config in configmap.yaml
# (server.secure_serving, the pipeline steps) needs a coordinator built from
# llm-d-router main after 2026-09-23, which no release contains yet.
components:
- ../../../recipes/modelserver/components/images/coordinator/nightly

# patch-pd-only.yaml is deliberately not listed here: it's applied with
# `kubectl patch` after the deploy, not built into either overlay. See the PD-only
# note in ../../README.md's Installation Instructions.
