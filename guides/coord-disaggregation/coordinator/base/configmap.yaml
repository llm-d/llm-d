apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-coordinator-config
data:
  coordinator.yaml: |
    log_level: 2
    server:
      listen_addr: ":8080"
      read_timeout: 30s
      # Matches the Gateway/HTTPRoute request timeout (coordinator/httproute.yaml,
      # router/httproute.yaml: both 300s) -- otherwise the coordinator could
      # truncate a slow encode-prefill-decode response before the Gateway's own
      # timeout even kicks in.
      write_timeout: 300s

    gateway:
      # GATEWAY_ADDRESS is the full URL the Coordinator's own outbound (EPP-Profile
      # tagged) calls land on: the Gateway's own Service. Set in the README's
      # Installation Instructions, step 1, whichever provider you used. Not built
      # from GATEWAY_SERVICE here -- agentgateway's generated Service name doesn't
      # follow the same <name>-<provider> suffix convention as istio/gke.
      address: "${GATEWAY_ADDRESS}"
      max_idle_conns_per_host: 100
      idle_conn_timeout: 90s
      timeout: 60s

    # The pipeline is a plain list of steps: add, remove, or reorder them here to
    # change what happens to a request without touching any code. See the guide's
    # "Overview" and the PD-only note in "Installation Instructions" for examples.
    pipeline:
      kv_connector: kv-nixl
      ec_connector: ec-nixl
      steps:
        - type: replace-media-urls
          params:
            download_timeout: 10s
            max_concurrent_downloads: 10
        - type: render
          params:
            address: "http://localhost:8000"
            timeout: 30s
        - type: conditional-decode
        - type: encode
          params:
            max_parallel: 8
        - type: prefill
        - type: decode
