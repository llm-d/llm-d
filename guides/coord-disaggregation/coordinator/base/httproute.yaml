apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coordinator
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: llm-d-inference-gateway
  rules:
  # Exact-path matches, no header condition: these are the client-facing inference
  # paths -- all five the coordinator's own server registers (llm-d-router
  # pkg/coordinator/server/server.go). It drives the same pipeline for
  # /v1/responses and /v1/messages as for the Completions APIs, so those two go
  # to the Coordinator rather than straight through to a decode pod.
  # The coordinator's own internal x-llm-d-epp-profile-tagged calls reuse
  # these same paths, but router/httproute/base/httproute.yaml matches them at the
  # same (exact) path specificity plus a header condition, which takes precedence
  # over this header-less rule whenever the header is present -- see the comment
  # there. Anything else without x-llm-d-epp-profile (not one of these 5 paths)
  # falls to router/httproute/base/httproute.yaml's catch-all instead, not to the
  # Coordinator.
  #
  # SECURITY NOTE: a client that forges its own x-llm-d-epp-profile header bypasses
  # the Coordinator entirely, matching router/httproute/base/httproute.yaml's rule
  # directly instead of this one -- see the SECURITY NOTE there. This split is a
  # routing convenience, not a trust/auth boundary.
  - matches:
    - path:
        type: Exact
        value: /v1/completions
    - path:
        type: Exact
        value: /v1/chat/completions
    - path:
        type: Exact
        value: /v1/responses
    - path:
        type: Exact
        value: /v1/messages
    - path:
        type: Exact
        value: /inference/v1/generate
    backendRefs:
    - kind: Service
      name: llm-d-coordinator
      port: 8080
      weight: 1
    # Removed by the gke overlay (../gke/kustomization.yaml): GKE Gateway doesn't
    # implement this field -- it uses a GCPBackendPolicy timeoutSec instead.
    timeouts:
      request: 300s
