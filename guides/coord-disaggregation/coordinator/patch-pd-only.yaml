# PD-only pipeline: drops replace-media-urls, render, and encode -- see the
# PD-only note in ../README.md's Installation Instructions for why (no encode
# role means no multimedia handling; the render step normalizes multimodal
# input for the encode/prefill phases, so it goes too).
#
# Unlike multimedia-downloader/patch-coordinator-ca.yaml, this file still has
# ${PROVIDER_NAME}/${NAMESPACE} placeholders (the gateway.address line below is
# copied whole from configmap.yaml), so it needs envsubst -- --patch-file reads
# the file raw and won't expand them. Apply after the normal coordinator deploy:
#   kubectl patch configmap llm-d-coordinator-config -n ${NAMESPACE} --type=strategic \
#       --patch="$(envsubst < coordinator/patch-pd-only.yaml)"
#   kubectl rollout restart deployment/llm-d-coordinator -n ${NAMESPACE}
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-coordinator-config
data:
  coordinator.yaml: |
    log_level: 2
    server:
      listen_addr: ":8080"
      read_timeout: 30s
      write_timeout: 120s

    gateway:
      address: "http://llm-d-inference-gateway-${PROVIDER_NAME}.${NAMESPACE}.svc:80"
      max_idle_conns_per_host: 100
      idle_conn_timeout: 90s
      timeout: 60s

    pipeline:
      kv_connector: kv-nixl
      ec_connector: ec-nixl
      steps:
        - type: conditional-decode
        - type: prefill
        - type: decode
