apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-coordinator
  labels:
    app: llm-d-coordinator
    llm-d.ai/model: Qwen3-VL-32B-Instruct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-coordinator
  template:
    metadata:
      labels:
        app: llm-d-coordinator
        llm-d.ai/model: Qwen3-VL-32B-Instruct
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: coordinator
        image: ghcr.io/llm-d/llm-d-router-coordinator:main
        imagePullPolicy: IfNotPresent
        args:
        - --config
        - /etc/coordinator/coordinator.yaml
        env:
        - name: GOMAXPROCS
          value: "4"
        - name: GOMEMLIMIT
          value: "7200MiB"
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
          limits:
            cpu: "4"
            memory: 8Gi
        ports:
        - name: http
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/coordinator
      # Runs the pipeline's "render" step (multimodal input normalization) as a
      # local CPU vLLM instance the coordinator container talks to over localhost.
      - name: vllm-render
        image: vllm/vllm-openai-cpu:v0.26.0
        imagePullPolicy: IfNotPresent
        # "vllm launch render" runs only the preprocessing/postprocessing HTTP layer
        # (no GPU/engine warmup, no encoder-cache profiling) -- "vllm serve" boots
        # the full inference engine, which for this model hangs for 10+ minutes on
        # a CPU-backend warmup pass profiling a synthetic max-resolution image,
        # blowing well past the startup probe below.
        command: ["vllm", "launch", "render"]
        args: ["$(MODEL_NAME)", "--port=8000"]
        env:
        - name: MODEL_NAME
          value: "Qwen/Qwen3-VL-32B-Instruct"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: HF_TOKEN
              name: llm-d-hf-token
              optional: true
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            cpu: "4"
            memory: 16Gi
        ports:
        - name: render-http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 1
          failureThreshold: 600
          timeoutSeconds: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - name: torch-compile-cache
          mountPath: /.cache
        - name: vllm-config
          mountPath: /.config
      volumes:
      - name: config
        configMap:
          name: llm-d-coordinator-config
      - name: torch-compile-cache
        emptyDir: {}
      - name: vllm-config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-coordinator
  labels:
    app: llm-d-coordinator
spec:
  selector:
    app: llm-d-coordinator
  type: ClusterIP
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
