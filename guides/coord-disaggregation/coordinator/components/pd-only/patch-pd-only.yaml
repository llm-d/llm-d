# PD-only pipeline: drops replace-media-urls, render, and encode -- see the
# PD-only note in ../../../README.md's Installation Instructions for why (no encode
# role means no multimedia handling; the render step normalizes multimodal
# input for the encode/prefill phases, so it goes too). ec_connector is dropped
# too -- encoder-cache transfer only matters with an encode role in the pipeline.
#
# A strategic-merge patch on the Coordinator's ConfigMap that replaces the whole
# coordinator.yaml, so every other field is a copy of ../../base/configmap.yaml
# (comments aside); scripts/tests/test_coord_disaggregation_pd_only.py keeps the
# two equal. The pd-only and pd-only-gke overlays apply it through this
# component. ${GATEWAY_ADDRESS} is left as is, for the README command's
# `| envsubst` after the build, as in base.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-coordinator-config
data:
  coordinator.yaml: |
    log_level: 2
    server:
      listen_addr: ":8080"
      secure_serving: false
      read_timeout: 30s
      write_timeout: 300s

    gateway:
      address: "${GATEWAY_ADDRESS}"
      max_idle_conns_per_host: 100
      idle_conn_timeout: 90s
      timeout: 60s

    pipeline:
      kv_connector: kv-nixl
      steps:
        - type: conditional-decode
        - type: prefill
        - type: decode
