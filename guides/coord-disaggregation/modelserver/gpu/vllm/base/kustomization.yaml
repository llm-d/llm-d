apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Encode, prefill and decode as the three roles of one DisaggregatedSet, so the whole
# pipeline rolls out as one version and replicates as whole copies (`slices`). Unlike
# ../../../../../recipes/modelserver/base/single-host/pd-disaggregatedset/e-p-d, this
# guide takes the bare `base` layer (plus the encode role) rather than the vLLM layer:
# the Coordinator dispatches the phases itself, so decode runs no routing sidecar and
# its model server owns port 8000 (see patch-decode.yaml).
resources:
  - ../../../../../recipes/modelserver/base/single-host/pd-disaggregatedset/base

nameSuffix: -coord

components:
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema
  # graceful-shutdown before encode-role: it patches roles/0 and roles/1 by index, which
  # are the base set's prefill and decode only while the encode role has not been merged
  # in yet (it merges in at roles/0 and would shift decode out of range). patch-encode.yaml
  # sets the same fields on the encode role itself.
  - ../../../../../recipes/modelserver/components/graceful-shutdown
  - ../../../../../recipes/modelserver/base/single-host/pd-disaggregatedset/components/encode-role
  - ../../../../../recipes/modelserver/components/images/gpu-vllm/release

labels:
  - pairs:
      llm-d.ai/model: Qwen3-VL-32B-Instruct
      llm-d.ai/guide: coord-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: vllm
    fields:
      - path: spec/roles/spec/leaderWorkerTemplate/workerTemplate/metadata/labels
        kind: DisaggregatedSet
        create: true

# Every role carries --enable-scale-out in its own args list: "vllm serve" registers the
# scale-out endpoints (/inference/v1/generate and the /render and /derender endpoints)
# only with this flag. It replaced VLLM_ENABLE_SCALE_OUT_ENDPOINTS, see
# https://github.com/vllm-project/vllm/pull/55176. vLLM builds from before 2026-09-14 do
# not know the flag and fail at startup. It is repeated per role rather than appended by
# one patch because args has no strategic-merge key, so a shared patch would replace the
# whole list instead of adding to it.
patches:
  - path: patch-encode.yaml
  - path: patch-prefill.yaml
  - path: patch-decode.yaml
  # VLLM_USE_V2_MODEL_RUNNER=1 for the instances that use the CPU EC connector
  # (encode and prefill). The connector fails at startup without the V2 model
  # runner, see https://docs.vllm.ai/en/v0.30.0/features/ec_cpu_connector/
  # Decode has no EC connector and uses the vLLM default model runner.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: encode
            spec: &env
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        env:
                          - name: VLLM_USE_V2_MODEL_RUNNER
                            value: "1"
          - name: prefill
            spec: *env
