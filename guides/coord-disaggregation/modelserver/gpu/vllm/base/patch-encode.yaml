apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: encode
      spec:
        replicas: 2  # per slice
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              # Graceful shutdown, set here because the graceful-shutdown component only
              # patches the base set's two roles (prefill, decode) and not the encode role
              # this guide adds. Keep in step with that component's budget:
              # terminationGracePeriodSeconds >= preStop sleep + --shutdown-timeout + 15.
              terminationGracePeriodSeconds: 75
              containers:
                - name: modelserver
                  command: ["vllm", "serve"]
                  lifecycle:
                    preStop:
                      exec:
                        command: ["/bin/sleep", "15"]
                  args:
                    - "$(MODEL_NAME)"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=2"
                    - "--mm-encoder-only"
                    - "--enforce-eager"
                    - "--no-enable-prefix-caching"
                    - "--enable-scale-out"
                    - "--ec-transfer-config"
                    # ec_enable_nixl turns on P2P NIXL transfers between instances.
                    # ec_cpu_bytes (mandatory, no default) is the size in bytes of the shared CPU
                    # mmap region that holds encoder outputs for multimodal items. Increase this
                    # value for workloads with large or numerous images to prevent cache evictions
                    # and costly re-encodings that degrade system performance.
                    # 4 GiB holds about 100,000 encoder tokens for Qwen3-VL-32B (40,960 bytes
                    # each). The value must fit in the /dev/shm volume.
                    # See https://docs.vllm.ai/en/v0.30.0/features/ec_cpu_connector/
                    - '{"ec_connector": "ECCPUConnector", "ec_role": "ec_producer", "ec_connector_extra_config": {"ec_enable_nixl": true, "ec_cpu_bytes": 4294967296}}'
                    - "--shutdown-timeout=45"
                  env:
                    - name: MODEL_NAME
                      value: "Qwen/Qwen3-VL-32B-Instruct"
                    - name: VLLM_EC_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: VLLM_EC_SIDE_CHANNEL_PORT
                      value: "5610"
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                          optional: true
                    # Workaround for https://github.com/vllm-project/vllm/issues/44548, required with vLLM v0.20.0+ due to torch 2.11
                    - name: USER
                      value: llm-d
                  resources:
                    limits:
                      cpu: "4"
                      memory: 32Gi
                      nvidia.com/gpu: "2"
                    requests:
                      cpu: "4"
                      memory: 32Gi
                      nvidia.com/gpu: "2"
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.config
                      name: config-cache
                  startupProbe:
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 8Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: config-cache
                  emptyDir: {}
