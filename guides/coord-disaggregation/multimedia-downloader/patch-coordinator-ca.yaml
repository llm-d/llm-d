# Strategic merge patch — injects your SSL-Bump proxy's CA into the
# llm-d-coordinator "coordinator" container so it trusts the proxy's
# intercepted TLS certs, and points the coordinator's outbound HTTP(S)
# traffic through the proxy.
#
# Edit `squid-ca-public-cert` / `multimedia-downloader` below to match your
# proxy's Secret and Service names, then apply:
#   kubectl patch deployment llm-d-coordinator -n ${NAMESPACE} \
#     --type=strategic --patch-file multimedia-downloader/patch-coordinator-ca.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-coordinator
spec:
  template:
    spec:
      initContainers:
      - name: install-ca-cert
        image: alpine:3.21
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache ca-certificates
          cp -L /etc/ssl/certs/ca-certificates.crt /shared-certs/ca-certificates.crt
          cat /proxy-ca/ca.pem >> /shared-certs/ca-certificates.crt
        volumeMounts:
        - name: proxy-ca-cert
          mountPath: /proxy-ca
          readOnly: true
        - name: shared-certs
          mountPath: /shared-certs
      containers:
      - name: coordinator
        env:
        - name: HTTP_PROXY
          value: "http://multimedia-downloader:80"
        - name: HTTPS_PROXY
          value: "http://multimedia-downloader:80"
        - name: NO_PROXY
          value: "localhost,127.0.0.1,.svc,.cluster.local"
        - name: SSL_CERT_DIR
          value: "/etc/ssl/certs"
        - name: SSL_CERT_FILE
          value: "/etc/ssl/certs/ca-certificates.crt"
        - name: REQUESTS_CA_BUNDLE
          value: "/etc/ssl/certs/ca-certificates.crt"
        - name: CURL_CA_BUNDLE
          value: "/etc/ssl/certs/ca-certificates.crt"
        volumeMounts:
        - name: shared-certs
          mountPath: /etc/ssl/certs
          readOnly: true
      volumes:
      - name: proxy-ca-cert
        secret:
          secretName: squid-ca-public-cert
      - name: shared-certs
        emptyDir: {}
