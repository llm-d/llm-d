apiVersion: v1
kind: Service
metadata:
  name: render
  labels:
    app.kubernetes.io/component: vllm-render
spec:
  # Fronts the prefill model server pods from ../modelserver/ for the
  # Coordinator's render step. They serve /v1/*/render because they set
  # VLLM_ENABLE_SCALE_OUT_ENDPOINTS=1. Only Ready pods receive traffic.
  #
  # Prefill only: render on decode slows token streaming, and encode has no
  # --max-model-len, so render there accepts prompts that prefill and decode
  # reject. For more render capacity, add prefill replicas or CPU.
  selector:
    llm-d.ai/guide: coord-disaggregation
    llm-d.ai/role: prefill
  ports:
    - name: render-http
      port: 8000
      # Named container port on the prefill pods (containerPort 8000).
      targetPort: modelserver
      protocol: TCP
