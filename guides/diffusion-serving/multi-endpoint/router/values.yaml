router:
  inferencePool:
    failureMode: FailOpen

  epp:
    pluginsConfigFile: "multi-endpoint.yaml"
    pluginsCustomConfig:
      multi-endpoint.yaml: |
        apiVersion: inference.networking.x-k8s.io/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: queue-scorer
        - type: max-score-picker
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
          - pluginRef: max-score-picker

  modelServers:
    matchLabels:
      llm-d.ai/guide: "diffusion-serving-multi-endpoint"
    protocol: http
