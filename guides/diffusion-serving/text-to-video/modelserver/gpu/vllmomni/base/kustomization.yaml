apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../recipes/modelserver/base/single-host/default

namespace: llm-d-diffusion-t2v

namePrefix: diffusion-serving-t2v-nvidia-gpu-vllm-omni-

components:
  - ../../../../../../recipes/modelserver/components/images/gpu-vllm-omni/release

labels:
  - pairs:
      llm-d.ai/guide: diffusion-serving-t2v
      llm-d.ai/model: Wan2.1-T2V-1.3B
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: vllm-omni
    includeSelectors: true
    includeTemplates: true

patches:
  - path: patch-vllm-omni-video.yaml
