## SGLang overrides for precise-prefix-cache-routing.values.yaml.
## Layer on top of: router/precise-prefix-cache-routing.values.yaml
##
## Use when MODEL_SERVER=sglang. Switches kvEventsConfig.engineType from vllm
## to sglang so the KV-cache indexer selects the SGLang event adapter, and sets
## modelServers.type to sglang so core-metrics-extractor scrapes SGLang metrics.

router:
  epp:
    pluginsCustomConfig:
      precise-prefix-cache-routing-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          - type: token-producer
            parameters:
              modelName: Qwen/Qwen3-32B
              vllm:
                url: "http://precise-prefix-cache-routing-render:8000"
          - type: endpoint-notification-source
          - type: precise-prefix-cache-producer
            parameters:
              tokenProcessorConfig:
                blockSizeTokens: 64
              speculativeIndexing: true
              indexerConfig:
                kvBlockIndexConfig:
                  enableMetrics: true
              kvEventsConfig:
                engineType: "sglang"
                topicFilter: "kv@"
                concurrency: 8
                discoverPods: true
                podDiscoveryConfig:
                  socketPort: 5556
                  # No replaySocketPort: SGLang has no replay buffer, and a
                  # failed replay dial clears the pod's index entries.
          - type: inflight-load-producer
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
          - type: prefix-cache-affinity-filter
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
              peakPrefillThroughput: 15926
          - type: token-load-scorer
        dataLayer:
          sources:
            - pluginRef: endpoint-notification-source
              extractors:
                - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: prefix-cache-affinity-filter
              - pluginRef: token-load-scorer

  modelServers:
    type: sglang
