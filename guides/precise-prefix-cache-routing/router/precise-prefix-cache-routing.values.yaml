## precise-prefix-cache-routing guide overrides for the router.
## Layer on top of: recipes/router/base.values.yaml
##
## Tokenization runs on the model servers themselves. The EPP `token-producer`
## uses `vllm.endpointDiscovery`: it sends each render call to one of the Ready
## InferencePool endpoints, round-robin per request, and retries once on another
## endpoint after a transport error, timeout, 408, 429 or 5xx. Render capacity
## therefore scales with the model server fleet, and no render Service or EPP
## sidecar is deployed. The model servers must serve `/v1/*/render` on their
## inference port (`--enable-scale-out` on vLLM 0.30).
##
## SGLang does not serve vLLM's render endpoints. For SGLang, also layer
## `sglang.values.yaml`, which points `token-producer` at the dedicated
## `../render/standalone/` pool instead.
##
## Single EPP replica: the token-load-scorer's in-flight token accounting is
## local to each EPP process, so active-active HA (replicas: 2) would halve the
## per-endpoint load each replica sees and mis-gate the affinity filter. Keep
## replicas: 1 while this routing config is in use. (The precise KV index itself
## is HA-safe — each replica converges via pod-discovery — so HA can return if
## in-flight state becomes shared across replicas.)

router:
  epp:
    replicas: 1
    flags:
      # The chart auto-adds `--ha-enable-leader-election` when replicas > 1,
      # which makes only the leader's readiness probe pass — collapsing to
      # active-passive. Embedding `=false` into the key forces the single-arg
      # form (pflag won't parse `--key value` as a bool); pflag honors
      # last-occurrence wins. No-op when replicas=1.
      ha-enable-leader-election: false
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: llm-d-hf-token
            key: HF_TOKEN

    pluginsConfigFile: "precise-prefix-cache-routing-plugins.yaml"
    pluginsCustomConfig:
      precise-prefix-cache-routing-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
          - type: token-producer
            parameters:
              # Must match the model the overlay deploys: render calls land on
              # the model servers themselves, so a mismatch is rejected rather
              # than silently producing token IDs from the wrong tokenizer.
              modelName: Qwen/Qwen3-32B
              vllm:
                # Render on the InferencePool endpoints, on their inference
                # port. An empty object keeps the defaults (round-robin, one
                # retry on another endpoint).
                endpointDiscovery: {}
          - type: endpoint-notification-source
          - type: precise-prefix-cache-producer
            parameters:
              tokenProcessorConfig:
                blockSizeTokens: 64
                # XXH64 block hashing, about 8x cheaper than the default
                # cbor-fnv. Block keys are internal to the router's index, so
                # this need not match the engine. Change it only on a fresh
                # index: keys built under one algorithm never match the other.
                hashAlgorithm: xxh64
              speculativeIndexing: true
              indexerConfig:
                kvBlockIndexConfig:
                  enableMetrics: true
              kvEventsConfig:
                topicFilter: "kv@"
                concurrency: 8
                discoverPods: true
                podDiscoveryConfig:
                  socketPort: 5556
                  replaySocketPort: 5559
          - type: inflight-load-producer
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
          - type: prefix-cache-affinity-filter
            parameters:
              # Exact resident-block fractions from KV-cache events, not the
              # approximate producer.
              prefixMatchInfoProducerName: precise-prefix-cache-producer
              # Measured with guides/recipes/router/calibration/calibrate.sh on
              # this guide's reference setup (Qwen3-32B, H100 80 GB, TP=2,
              # chunk 8192) — SGLang measures the same value as vLLM. Re-measure
              # for other hardware/models.
              peakPrefillThroughput: 15926
          - type: token-load-scorer
        dataLayer: # metrics-data-source + core-metrics-extractor injected by default
          sources:
            - pluginRef: endpoint-notification-source
              extractors:
                - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: prefix-cache-affinity-filter
              - pluginRef: token-load-scorer

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  modelServers:
    type: vllm
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "precise-prefix-cache-routing"
