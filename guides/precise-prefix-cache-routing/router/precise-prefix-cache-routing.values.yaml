## precise-prefix-cache-routing guide overrides for the router.
## Layer on top of: recipes/router/base.values.yaml
##
## Tokenization is served by the `../render/` Service, NOT the chart-injected
## EPP sidecar. The chart's `router.tokenizer` sidecar is off by default, so no
## override is needed here; the EPP `token-producer` plugin tokenizes prompts
## over HTTP against that Service (see its `vllm.url` below).
##
## That Service has no pods of its own — it fronts the vLLM model servers, whose
## overlays expose `/v1/*/render` (with --enable-scale-out on vLLM 0.30).
## Render capacity therefore scales with the model server fleet rather than
## with a separately-scheduled renderer pool,
## which keeps render latency more contained at higher QPS. Backends without
## vLLM's render endpoints (SGLang) apply `../render/standalone/` instead; it
## publishes the same Service name, so this `vllm.url` is unchanged either way.
##
## Single EPP replica: the token-load-scorer's in-flight token accounting is
## local to each EPP process, so active-active HA (replicas: 2) would halve the
## per-endpoint load each replica sees and mis-gate the affinity filter. Keep
## replicas: 1 while this routing config is in use. (The precise KV index is not
## HA-safe either: a replica that starts after the pods have warmed misses the
## prefixes cached before its replay window, so active-active HA also needs a
## complete index at start, which today means the experimental snapshot option.)

router:
  epp:
    replicas: 1
    flags:
      # The chart auto-adds `--ha-enable-leader-election` when replicas > 1,
      # which makes only the leader's readiness probe pass — collapsing to
      # active-passive. Embedding `=false` into the key forces the single-arg
      # form (pflag won't parse `--key value` as a bool); pflag honors
      # last-occurrence wins. No-op when replicas=1.
      ha-enable-leader-election: false
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: llm-d-hf-token
            key: HF_TOKEN

    pluginsConfigFile: "precise-prefix-cache-routing-plugins.yaml"
    pluginsCustomConfig:
      precise-prefix-cache-routing-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          - type: token-producer
            parameters:
              # Must match the model the overlay deploys: with the default
              # `../render/` overlay the render call lands on the model servers
              # themselves, so a mismatch is rejected rather than silently
              # producing token IDs from the wrong tokenizer.
              modelName: Qwen/Qwen3-32B
              vllm:
                # Guide render Service (../render/), not a loopback sidecar.
                # `precise-prefix-cache-routing-` namePrefix + Service name `render`.
                url: "http://precise-prefix-cache-routing-render:8000"
                # How /v1/messages (Anthropic) and /v1/responses requests are
                # tokenized. `auto` (default) probes the render endpoint once and
                # uses vLLM's native /v1/messages/render or /v1/responses/render
                # when it exists, else falls back to `legacy`: a translation to
                # chat-completions rendering that is deprecated and does not
                # guarantee token parity with the model server. `native` fails
                # instead of falling back. vLLM 0.30 serves both endpoints;
                # vLLM 0.29 (TPU overlays) serves Messages only.
                messagesRenderMode: auto
                responsesRenderMode: auto
          - type: endpoint-notification-source
          - type: precise-prefix-cache-producer
            parameters:
              tokenProcessorConfig:
                blockSizeTokens: 64
              speculativeIndexing: true
              indexerConfig:
                kvBlockIndexConfig:
                  enableMetrics: true
              kvEventsConfig:
                engineType: "vllm"
                topicFilter: "kv@"
                concurrency: 8
                discoverPods: true
                # OpenTelemetry spans for KV-event receive/process/decode. Off by
                # default: events arrive at many times the request rate and would
                # crowd request traces out of a shared sampler. Needs router
                # tracing enabled (recipes/router/features/tracing.values.yaml).
                # tracing: true
                podDiscoveryConfig:
                  socketPort: 5556
                  # Replay buffered events on connect and after a sequence gap.
                  # Every vLLM overlay binds this ZMQ ROUTER socket
                  # (KV_EVENTS_REPLAY_ENDPOINT); the SGLang values drop it.
                  replaySocketPort: 5559
                  # Subscribe only to pool members that publish KV events, e.g.
                  # prefill pods in a P/D pool. Empty (default) matches every pod.
                  # podLabelSelector: "llm-d.ai/role=prefill"
                  # EXPERIMENTAL: warm the index from a vLLM KV-event snapshot
                  # instead of a full replay. Requires vllm-project/vllm#57789
                  # (unreleased); upgrade the router before setting
                  # `snapshot_endpoint` on vLLM, or the router cannot decode
                  # the engine's event batches.
                  # snapshotSocketPort: <port>
          - type: inflight-load-producer
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
          - type: prefix-cache-affinity-filter
            parameters:
              # Exact resident-block fractions from KV-cache events, not the
              # approximate producer.
              prefixMatchInfoProducerName: precise-prefix-cache-producer
              # Measured with guides/recipes/router/calibration/calibrate.sh on
              # this guide's reference setup (Qwen3-32B, H100 80 GB, TP=2,
              # chunk 8192). Re-measure for other hardware/models — including
              # SGLang, which has its own copy of this value in
              # precise-prefix-cache-routing.sglang.values.yaml.
              peakPrefillThroughput: 15926
          - type: token-load-scorer
        dataLayer: # metrics-data-source + core-metrics-extractor injected by default
          sources:
            - pluginRef: endpoint-notification-source
              extractors:
                - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: prefix-cache-affinity-filter
              - pluginRef: token-load-scorer

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  modelServers:
    type: vllm
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "precise-prefix-cache-routing"
