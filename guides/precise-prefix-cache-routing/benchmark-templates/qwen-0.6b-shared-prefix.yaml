# Qwen3-0.6B shared-prefix performance benchmark for the precise-prefix-cache-routing guide.
#
# Mirrors the default guide.yaml shared_prefix workload so results are
# comparable, but targets Qwen/Qwen3-0.6B and uses smaller prefix/question/
# output lengths and gentler rates suited to compact accelerator deployments
# (e.g. the Intel XPU overlay, which serves Qwen3-0.6B).
endpoint:
  stack_name: &stack_name precise-guide-Qwen3-0.6B  # user defined name for the stack (results prefix)
  model: &model Qwen/Qwen3-0.6B        # Exact HuggingFace model name. Must match stack deployed.
  namespace: &namespace ${NAMESPACE}   # Namespace where stack is deployed
  base_url: &url http://${IP}          # Base URL of inference endpoint
  hf_token_secret: llm-d-hf-token      # The name of secret that contains the HF token of the stack

control:
  work_dir: $HOME/llm-d-bench-work  # working directory to store temporary and autogenerated files.
                                    # Do not edit content manually.
                                    # If not set, a temp directory will be created.
  kubectl: kubectl                  # kubectl command: kubectl or oc

harness:
  name: inference-perf
  results_pvc: ${BENCHMARK_PVC}   # PVC where benchmark results are stored
  namespace: *namespace           # Namespace where harness is deployed. Typically with stack.
  parallelism: 1                  # Number of parallel workload launcher pods to create.
  wait_timeout: 6000              # Time (in seconds) to wait for workload launcher pod to complete before terminating.
                                  # Set to 0 to disable timeout.
  image: ghcr.io/llm-d/llm-d-benchmark:v0.5.2

env:
  - name: RAYON_NUM_THREADS
    value: "4"

workload:                         # yaml configuration for harness workload(s)

  # Shared-prefix workload sized for compact Qwen3-0.6B deployments.
  shared_prefix:
    load:
      type: poisson
      interval: 30.0
      stages:
        # Warmup - seat residents
        - rate: 4
          duration: 50
        # Main ladder
        - rate: 1
          duration: 60
        - rate: 2
          duration: 60
        - rate: 4
          duration: 60
        - rate: 8
          duration: 60
        - rate: 16
          duration: 60
    api:
      type: completion
      streaming: true
    server:
      type: vllm
      model_name: *model
      base_url: *url
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: *model
    data:
      type: shared_prefix
      shared_prefix:
        num_groups: 50                  # Number of distinct prefixes, Note: the number of users is num_groups * num_prompts_per_group
        num_prompts_per_group: 5        # Number of unique questions per group (prefix)
        system_prompt_len: 2048         # Length of the first prefix (in tokens), simulate initialization of a system prompt
        question_len: 256               # Length of the unique question part (in tokens)
        output_len: 256                 # Target length for the model's generated output (in tokens)
        enable_multi_turn_chat: false   # If enabled, the chat context will be appended for each request.
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: false
    storage:
      local_storage:
        path: /workspace
