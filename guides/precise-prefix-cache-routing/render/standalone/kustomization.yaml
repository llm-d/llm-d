apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dedicated render (tokenizer) pool for precise-prefix-cache-routing.
#
# For backends that do not serve vLLM's /v1/*/render endpoints, notably SGLang,
# and for anyone who would rather not spend model-server CPU on tokenization. It
# runs a GPU-less `vllm launch render` Deployment fronted by a Service, so the
# tokenizer is always vLLM's regardless of which engine serves inference. The
# router reaches it through `vllm.url` in router/sglang.values.yaml.
#
# vLLM backends need no render pool: the router renders on the model servers
# through `vllm.endpointDiscovery` (router/precise-prefix-cache-routing.values.yaml),
# which at higher QPS keeps render latency more contained than this
# separately-scheduled pool.
namePrefix: precise-prefix-cache-routing-

resources:
  - deployment.yaml
  - service.yaml

components:
  - ../../../recipes/modelserver/components/images/cpu-vllm/release

# NOTE: the guide label lands on resource metadata ONLY, never on the pod
# template or selectors (kustomize `labels` defaults to includeSelectors:false /
# includeTemplates:false). `llm-d.ai/guide: precise-prefix-cache-routing` is the
# InferencePool / model-server selector (router modelServers.matchLabels); if
# render pods carried it the EPP would treat them as routable model servers and
# try to ZMQ-subscribe to their (nonexistent) :5556 KV-event socket.
labels:
  - pairs:
      llm-d.ai/guide: precise-prefix-cache-routing
