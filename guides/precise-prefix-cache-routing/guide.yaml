name: precise-prefix-cache-routing

# Which model server runs on which accelerator. `validated` = covered by a
# nightly E2E workflow; `community` = an overlay exists but is not run nightly;
# `unsupported` must link a tracking issue. A missing cell means unsupported.
# Keys must match env.static ACCELERATOR_TYPE / MODEL_SERVER values; `model`
# is the model the accelerator's overlay serves (used for MODEL on llm-d.ai);
# `notes` (optional, one line) fills the Notes column of the support table.
# `providers` lists the INFRA_PROVIDER values the accelerator takes (each
# needs a modelserver/<acc>/<engine>/.../<provider>/ overlay; `engines:`
# narrows one to a subset); llm-d.ai turns it into the provider selector.
support:
  engines: {vllm: vLLM, sglang: SGLang}
  accelerators:
    gpu:
      label: NVIDIA GPU
      notes: "Default. H100 80 GB reference · 2 replicas × TP=2 (4 GPUs) · `INFRA_PROVIDER`: `base`, `gke` (SGLang uses the dedicated render pool)"
      model: Qwen/Qwen3-32B
      providers:
        - {name: base, label: "Kubernetes (base)"}
        - {name: gke, label: "GKE"}
      engines: {vllm: validated, sglang: community}
    amd:
      label: AMD GPU
      notes: "2 replicas × TP=2 (4 GPUs)"
      model: Qwen/Qwen3-32B
      providers:
        - {name: base, label: "Kubernetes (base)"}
      engines: {vllm: validated}
    xpu:
      label: Intel XPU
      notes: "vLLM: Data Center GPU Max 1550+ · SGLang: Arc Pro B60 · 2 replicas × 1 XPU via DRA · fp16 (SGLang uses the dedicated render pool)"
      model: Qwen/Qwen3-0.6B
      providers:
        - {name: base, label: "Kubernetes (base)"}
      engines: {vllm: validated, sglang: community}
    "tpu/v6":
      label: Google TPU v6e
      notes: "GKE only · 2 replicas × 8 chips (`2x4`, TP=8) · vLLM 0.29"
      model: Qwen/Qwen3-32B
      providers:
        - {name: gke, label: "GKE"}
      engines: {vllm: validated}
    "tpu/v7":
      label: Google TPU v7
      notes: "GKE only · 2 replicas × 4 chips (`2x2x1`, TP=8) · vLLM 0.29"
      model: Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8
      providers:
        - {name: gke, label: "GKE"}
      engines: {vllm: community}
    cpu:
      label: CPU
      notes: "2 replicas"
      model: meta-llama/Llama-3.2-3B-Instruct
      providers:
        - {name: base, label: "Kubernetes (base)"}
        - {name: gke, label: "GKE"}
      engines: {vllm: community}

env:
  static:
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))

    GUIDE_NAME: precise-prefix-cache-routing
    NAMESPACE: llm-d-precise-prefix-cache-routing

    # Prometheus monitoring is opt-in: set MONITORING=true (requires the
    # monitoring stack) to run the deploy.monitoring* steps.
    MONITORING: {default: "false", values: ["false", "true"]}
    MONITORING_VALUES: {default: ""}
    ENGINE_VALUES: {default: ""}

    ACCELERATOR_TYPE: {default: gpu, values: [gpu, amd, xpu, "tpu/v6", "tpu/v7", cpu]}
    MODEL_SERVER: {default: vllm, values: [vllm, sglang]}
    # gke: GKE overlays (ACCELERATOR_TYPE=gpu, tpu/*, cpu)
    INFRA_PROVIDER: {default: base, values: [base, gke]}

    MODEL: {default: "Qwen/Qwen3-32B", comment: "set to the model your accelerator serves (table above)"}

  source: ["${REPO_ROOT}/guides/env.sh # defines GAIE_VERSION, ROUTER_CHART_VERSION, router chart URLs, and CURL_TEST_IMAGE"]

prerequisites:
  clone:
    - skip_in: [ci]
      run: |
        export BRANCH=main
        git clone https://github.com/llm-d/llm-d.git && cd llm-d && git checkout ${BRANCH}

  gaie:
    - run: |
        # GAIE_URL is automatically calculated from GAIE_VERSION at ${REPO_ROOT}/guides/env.sh
        kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/${GAIE_URL}/v1-manifests.yaml
  namespace:
    - run: kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
  secrets:
    - skip_in: [ci]
      run: |
        kubectl create secret generic llm-d-hf-token \
          --from-literal="HF_TOKEN=${HF_TOKEN}" \
          --namespace "${NAMESPACE}" \
          --dry-run=client -o yaml | kubectl apply -f -

deploy:
  router_values:
    - when: {MODEL_SERVER: [vllm]}
      run: |
        # Paths to values files
        export ROUTER_BASE_VALUES="${REPO_ROOT}/guides/recipes/router/base.values.yaml"
        export ROUTER_VALUES="${REPO_ROOT}/guides/${GUIDE_NAME}/router/${GUIDE_NAME}.values.yaml"
    - when: {MODEL_SERVER: [sglang]}
      run: |
        # Paths to values files
        export ROUTER_BASE_VALUES="${REPO_ROOT}/guides/recipes/router/base.values.yaml"
        export ROUTER_VALUES="${REPO_ROOT}/guides/${GUIDE_NAME}/router/${GUIDE_NAME}.values.yaml"
        export ENGINE_VALUES="-f ${REPO_ROOT}/guides/${GUIDE_NAME}/router/${GUIDE_NAME}.sglang.values.yaml"

  monitoring_values:
    standard:
      - when: {MONITORING: ["true"]}
        run: export MONITORING_VALUES="-f ${REPO_ROOT}/guides/recipes/router/features/monitoring.values.yaml"
    gke:
      - when: {MONITORING: ["true"], INFRA_PROVIDER: [gke]}
        skip_in: [ci]
        run: export MONITORING_VALUES="-f ${REPO_ROOT}/guides/recipes/router/features/monitoring-gke.values.yaml"

  standalone:
    - run: |
        helm install ${GUIDE_NAME} \
          ${ROUTER_STANDALONE_CHART} \
          -f ${ROUTER_BASE_VALUES} \
          ${MONITORING_VALUES} \
          -f ${ROUTER_VALUES} \
          ${ENGINE_VALUES} \
          -n ${NAMESPACE} --version ${ROUTER_CHART_VERSION}

  modelserver:
    - run: |
        kubectl apply -n ${NAMESPACE} \
          -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/${INFRA_PROVIDER}/

  render:
    # vLLM renders on the model servers through the router's endpoint
    # discovery, so only SGLang deploys a render pool: a dedicated, GPU-less
    # vLLM render Deployment, because SGLang has no render endpoints.
    - when: {MODEL_SERVER: [sglang], ACCELERATOR_TYPE: [gpu]}
      run: kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/render/standalone/
    - when: {MODEL_SERVER: [sglang], ACCELERATOR_TYPE: [xpu]}
      run: kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/render/xpu-sglang/

  monitoring:
    - when: {MONITORING: ["true"]}
      run: kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/recipes/modelserver/components/monitoring

verify:
  endpoint:
    standalone:
      - run: export IP=$(kubectl get service ${GUIDE_NAME}-epp -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}')
  tests:
    render:
      - when: {MODEL_SERVER: [vllm]}
        run: |
          # Every model server pod must return token IDs for MODEL: the router
          # renders on each of them in turn. Exits non-zero on the first pod that
          # does not, e.g. a 404 when vLLM runs without --enable-scale-out.
          export POD_IPS=$(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME} -o jsonpath='{.items[*].status.podIP}')
          kubectl run render-check --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="POD_IPS=${POD_IPS}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'test -n "${POD_IPS}" || { echo "FAIL: no model server pods"; exit 1; }
              for ip in ${POD_IPS}; do
                R=$(curl -sS -X POST "http://${ip}:8000/v1/completions/render" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"render check\", \"max_tokens\": 1}")
                echo "${R}" | grep -q "\"token_ids\"" || { echo "FAIL: ${ip}: ${R}"; exit 1; }
                echo "OK: ${ip}"
              done'
      - when: {MODEL_SERVER: [sglang]}
        run: |
          # The render pool must return token IDs for MODEL before requests are routed
          kubectl run render-check --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="GUIDE_NAME=${GUIDE_NAME}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'R=$(curl -sS -X POST "http://${GUIDE_NAME}-render:8000/v1/completions/render" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"render check\", \"max_tokens\": 1}")
              echo "${R}" | grep -q "\"token_ids\"" || { echo "FAIL: ${R}"; exit 1; }
              echo "OK: ${GUIDE_NAME}-render"'
    request:
      - run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"How are you today?\"}"'
    messages:
      - run: |
          # Anthropic Messages API: the router tokenizes it through /v1/messages/render
          kubectl run curl-messages --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://${IP}/v1/messages" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"max_tokens\": 16, \"messages\": [{\"role\": \"user\", \"content\": \"How are you today?\"}]}"'
    responses:
      - run: |
          # OpenAI Responses API: the router tokenizes it through /v1/responses/render
          kubectl run curl-responses --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://${IP}/v1/responses" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"max_output_tokens\": 16, \"input\": \"How are you today?\"}"'
    shared_prefix:
      - run: |
          # 10 requests that share a ~2k-token prefix and differ only in the last
          # sentence, 3 s apart: past the router's 2 s speculative-index TTL, so
          # each one routes on the KV-cache events of the one before it
          kubectl run prefix-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'P=$(for i in $(seq 1 100); do printf "The llm-d router keeps a conversation on the server whose KV-cache events report its prefix. "; done)
              for i in $(seq 1 10); do
                curl -sS -o /dev/null -w "request ${i}: HTTP %{http_code}\n" -X POST "http://${IP}/v1/completions" \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"${MODEL}\", \"prompt\": \"${P} Question ${i}: what is llm-d?\", \"max_tokens\": 16}"
                sleep 3
              done'
    pod_metrics:
      - run: |
          # Prefix-cache and request counters of every model server pod, read
          # through the Kubernetes API server proxy (no port-forward needed)
          for pod in $(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME} -o jsonpath='{.items[*].metadata.name}'); do
            echo "== ${pod}"
            kubectl get --raw "/api/v1/namespaces/${NAMESPACE}/pods/${pod}:8000/proxy/metrics" \
              | grep -E '^(vllm:prefix_cache_(hits|queries)_total|vllm:request_success_total|sglang:(cache_hit_rate|cached_tokens_total|num_requests_total))' || true
          done

cleanup:
  modelserver:
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/${INFRA_PROVIDER}
  render:
    - when: {MODEL_SERVER: [sglang], ACCELERATOR_TYPE: [gpu]}
      run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/render/standalone/
    - when: {MODEL_SERVER: [sglang], ACCELERATOR_TYPE: [xpu]}
      run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/render/xpu-sglang/
  rest:
    - run: helm uninstall ${GUIDE_NAME} -n ${NAMESPACE}
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/recipes/modelserver/components/monitoring --ignore-not-found=true
    - skip_in: [ci]
      run: kubectl delete namespace ${NAMESPACE}
