apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenizer
spec:
  # 2 pods of 4 render workers: 8 renders at a time, and one pod left during a
  # rollout or a node drain. Scale `replicas` for the peak number of renders in
  # flight (request rate times render time); a render that finds every worker
  # busy waits in line, and that wait is part of the request's TTFT.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: tokenizer
      app.kubernetes.io/part-of: precise-prefix-cache-routing
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tokenizer
        # Guide-scoped, so the Service cannot select a tokenizer pod of another
        # guide in a shared namespace. kustomization.yaml says why the pods
        # carry no `llm-d.ai/guide` label.
        app.kubernetes.io/part-of: precise-prefix-cache-routing
    spec:
      # The server only tokenizes over HTTP; it needs no Kubernetes API access.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # One pod per node where the cluster allows it, so a node loss takes one
      # pod of the pool.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: tokenizer
              app.kubernetes.io/part-of: precise-prefix-cache-routing
      containers:
        - name: tokenizer
          # The overlay sets the CPU build of the model server's vLLM release.
          # `vllm launch render` serves the model server's /v1/*/render
          # endpoints and loads no weights.
          image: REPLACE_MODEL_SERVER_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["vllm", "launch", "render"]
          # The overlay replaces the model and appends the model server's
          # rendering flags.
          args:
            - "Qwen/Qwen3-32B"
            - "--port=8000"
            # Renders that run at the same time in one pod, one core each. The
            # default is 1: a second render waits for the first.
            - "--renderer-num-workers=4"
          ports:
            - name: http
              containerPort: 8000
          env:
            # The tokenizer and config files are downloaded at start into the
            # emptyDir mounted below (mountPath == HF_HOME).
            - name: HF_HOME
              value: /tmp/hf
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            # Disable vLLM usage telemetry: its writes to /.config fail under
            # restricted SecurityContexts (matches the model server patch).
            - name: DO_NOT_TRACK
              value: "1"
          resources:
            # One busy render worker uses one core, so the CPU limit equals the
            # worker count. A model that takes images also keeps a cache of
            # processed images in this memory (`--mm-processor-cache-gb`,
            # 4 GiB when the flag is absent); change that cap and the memory
            # limit together.
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            # The pod leaves the Service's endpoints before the server gets
            # SIGTERM, so a rollout fails no render.
            preStop:
              exec:
                command: ["/bin/sleep", "10"]
          volumeMounts:
            - mountPath: /tmp/hf
              name: hf-cache
      volumes:
        - name: hf-cache
          emptyDir: {}
