apiVersion: v1
kind: Service
metadata:
  name: tokenizer
spec:
  # The router's token-producer dials this name (`vllm.url`). The Service
  # balances per connection and the router keeps connections alive, so a new
  # pod takes renders only as the router opens new connections.
  selector:
    app.kubernetes.io/component: tokenizer
    app.kubernetes.io/part-of: precise-prefix-cache-routing
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
