# TPU v5p single-host slice (ct5p-hightpu-4t): 4 chips x 95 GB HBM, ~448 GB host RAM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-topology: "2x2x1"
        cloud.google.com/gke-tpu-accelerator: "tpu-v5p-slice"
      containers:
        - name: modelserver
          args:
            - "Qwen/Qwen3-32B"
            - "--port=$(POD_PORT)"
            - "--max-model-len=4096"
            - "--tensor-parallel-size=4"
            - "--block-size=64"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models,/v1/completions/render,/v1/chat/completions/render"
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","replay_endpoint":"$(KV_EVENTS_REPLAY_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@Qwen/Qwen3-32B"}'
            # Drain in-flight requests on SIGTERM. Sized with the grace period in
            # recipes/modelserver/components/graceful-shutdown; raise both together.
            - "--shutdown-timeout=45"
          resources:
            limits:
              google.com/tpu: "4"
            requests:
              google.com/tpu: "4"
      volumes:
        # TODO(https://github.com/llm-d/llm-d/issues/2884): Temporary workaround
        # until the tpu-v5p-spot node pool boot disk on llm-d-e2e-us-east5 is
        # resized from 100 GB to >= 250 GB. Back /root/.cache (including
        # /root/.cache/huggingface) with tmpfs from host RAM (~448 GiB on
        # ct5p-hightpu-4t) so ~65.5 GB Qwen/Qwen3-32B downloads do not trigger
        # ephemeral-storage eviction.
        - name: torch-compile-cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Gi
