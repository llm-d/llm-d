apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 2
  # TPU node pools are fixed-size: a RollingUpdate needs a spare 8-chip node to
  # surge onto, so the rollout deadlocks with the new pod Pending.
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          ports:
            - containerPort: 5556
              name: kv-events
              protocol: TCP
            - containerPort: 5559
              name: kv-replay
              protocol: TCP
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_PORT
              value: "8000"
            - name: KV_EVENTS_ENDPOINT
              value: "tcp://*:5556"
            # Replay buffer: the router asks for buffered events here on connect
            # and after a sequence gap (podDiscoveryConfig.replaySocketPort).
            - name: KV_EVENTS_REPLAY_ENDPOINT
              value: "tcp://*:5559"
            - name: DO_NOT_TRACK
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          volumeMounts:
            - mountPath: /root/.cache
              name: torch-compile-cache
            - mountPath: /root/.triton
              name: triton-cache
            # vLLM's TP worker ring buffer (ShmRingBuffer) needs more than the
            # container default 64 MiB /dev/shm; without this the engine core
            # fails at startup with "Insufficient space in /dev/shm".
            - mountPath: /dev/shm
              name: dshm
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: torch-compile-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
