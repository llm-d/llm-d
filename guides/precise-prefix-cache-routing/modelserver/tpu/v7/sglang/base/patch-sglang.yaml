apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 2
  strategy:
    type: Recreate
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-topology: "2x2x1"
        cloud.google.com/gke-tpu-accelerator: "tpu7x"
      containers:
        - name: modelserver
          # Same engine configuration as optimized-baseline/modelserver/tpu/v7/sglang
          # (Qwen3-32B, TP=8 over one tpu7x 2x2x1 host), plus the KV-event publisher
          # the precise-prefix-cache router indexes.
          command: ["python3", "-m", "sglang.launch_server"]
          args:
            - "--model-path=Qwen/Qwen3-32B"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--device=tpu"
            - "--dtype=bfloat16"
            - "--enable-metrics"
            - "--tensor-parallel-size=8"
            - "--enable-torch-compile"
            - "--context-length=16384"
            - "--max-running-requests=64"
            - "--torch-compile-max-bs=64"
            - "--chunked-prefill-size=8192"
            - "--max-prefill-tokens=8192"
            - "--tpu-compile-tokens"
            - "2048"
            - "8192"
            - "--tpu-compile-bs"
            - "8"
            - "64"
            # Compile with the direct tracer, not the default Dynamo tracer. On the
            # v0.1.0-tpu image the Dynamo-traced extend program perturbs the last-token
            # logits of every prefill chunk longer than one 2048-token KV tile at TP >= 4
            # (sgl-project/sglang-torchtpu#1700), and the direct tracer compiles ~4x faster.
            - "--tpu-compile-tracer=direct"
            - "--max-total-tokens=131072"
            - "--mem-fraction-static=0.35"
            - "--watchdog-timeout=3600"
            - "--tool-call-parser=qwen"
            - "--reasoning-parser=qwen3"
            # KV-block granularity. Must match the router scorer's
            # tokenProcessorConfig.blockSizeTokens (64 in
            # router/precise-prefix-cache-routing.sglang.values.yaml); SGLang's
            # knob is --page-size, where vLLM uses --block-size.
            - "--page-size=64"
            # Note: --kv-events-config triggers JIT compilation of SGLang's
            # hicache_hash_cpp C++ extension (#include <openssl/sha.h>) on the
            # first request. If using lmsysorg/sglang:v0.1.0-tpu prior to the
            # image fix, ensure libssl-dev is installed in the container.
            - "--kv-events-config"
            # unlike vLLM, do NOT add {"enable_kv_cache_events":true};
            - '{"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@Qwen/Qwen3-32B"}'
          ports:
            # Exposed so each router replica can dial the per-pod ZMQ socket
            # bound by SGLang (KV_EVENTS_ENDPOINT=tcp://*:5556). Only
            # attn_tp_rank==0 publishes, so each pod binds exactly one socket.
            - containerPort: 5556
              name: kv-events
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: HF_HOME
              value: /.cache/huggingface
            - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION
              value: "0"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Matches the `modelserver` container port (--port=8000). Used in
            # the kv-events topic (kv@$(POD_IP):$(POD_PORT)@<model>) so pods are
            # identified by their inference endpoint.
            - name: POD_PORT
              value: "8000"
            # Pod-discovery mode: SGLang PUBs bind per-pod so every router
            # replica can dial each pod's socket independently (required for
            # active-active HA across routers).
            - name: KV_EVENTS_ENDPOINT
              value: "tcp://*:5556"
          resources:
            limits:
              google.com/tpu: 4
            requests:
              google.com/tpu: 4
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /.cache
              name: sglang-cache
          startupProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: sglang-cache
          emptyDir:
            medium: Memory
            sizeLimit: 120Gi
