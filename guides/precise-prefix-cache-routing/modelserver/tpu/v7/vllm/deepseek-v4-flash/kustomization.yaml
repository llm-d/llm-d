apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../common

namePrefix: precise-prefix-cache-routing-tpu-v7-vllm-deepseek-v4-flash-

components:
  - ../../../../../../recipes/modelserver/components/images/torch-tpu-vllm/release

labels:
  - pairs:
      llm-d.ai/guide: precise-prefix-cache-routing
      llm-d.ai/model: DeepSeek-V4-Flash
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
      llm-d.ai/backend: torch-tpu
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
