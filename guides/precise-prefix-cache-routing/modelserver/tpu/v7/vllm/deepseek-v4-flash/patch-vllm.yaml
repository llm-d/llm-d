apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-topology: "2x2x1"
        cloud.google.com/gke-tpu-accelerator: "tpu7x"
      containers:
        - name: modelserver
          args:
            - "deepseek-ai/DeepSeek-V4-Flash"
            - "--port=$(POD_PORT)"
            - "--tensor-parallel-size=1"
            - "--data-parallel-size=8"
            - "--data-parallel-size-local=8"
            - "--enable-expert-parallel"
            - "--quantization=deepseek_v4_fp8"
            - "--kv-cache-dtype=fp8_e4m3"
            - "--max-model-len=9216"
            - "--max-num-batched-tokens=2048"
            - "--max-num-seqs=256"
            - "--enable-prefix-caching"
            - "--async-scheduling"
            - "--trust-remote-code"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models,/v1/completions/render,/v1/chat/completions/render"
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@deepseek-ai/DeepSeek-V4-Flash"}'
          env:
            - name: TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS
              value: "false"
            - name: TORCHINDUCTOR_AUTOGRAD_CACHE
              value: "0"
            - name: VLLM_TARGET_DEVICE
              value: "tpu"
            - name: PJRT_DEVICE
              value: "TPU"
          resources:
            limits:
              google.com/tpu: 4
            requests:
              google.com/tpu: 4
