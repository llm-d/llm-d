apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-topology: "2x4"
        cloud.google.com/gke-tpu-accelerator: "tpu-v6e-slice"
      containers:
        - name: modelserver
          args:
            - "Qwen/Qwen3-32B"
            - "--port=$(POD_PORT)"
            - "--tensor-parallel-size=8"
            - "--attention-backend=CUSTOM"
            - "--max-model-len=16384"
            - "--enable-prefix-caching"
            - "--block-size=256"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=hermes"
            - "--reasoning-parser=qwen3"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models,/v1/completions/render,/v1/chat/completions/render"
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","replay_endpoint":"$(KV_EVENTS_REPLAY_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@Qwen/Qwen3-32B"}'
            # Drain in-flight requests on SIGTERM. Sized with the grace period in
            # recipes/modelserver/components/graceful-shutdown; raise both together.
            - "--shutdown-timeout=45"
          env:
            - name: TPU_EVICT_WEIGHTS_PAGE_CACHE
              value: "1"
            - name: TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS
              value: "false"
            - name: TORCHINDUCTOR_AUTOGRAD_CACHE
              value: "0"
            - name: VLLM_TARGET_DEVICE
              value: "tpu"
            - name: PJRT_DEVICE
              value: "TPU"
          resources:
            limits:
              google.com/tpu: 8
            requests:
              google.com/tpu: 8
