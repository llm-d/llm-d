apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tokenizer pool of the TPU v6e vLLM model server (../base): its vLLM release, its model
# and its rendering flags, so the pool returns the model server's token IDs.
resources:
  - ../../../../../tokenizer

components:
  # The model server's image component: the pool follows its release.
  - ../../../../../../recipes/modelserver/components/images/torch-tpu-vllm/release

images:
  # The CPU build of that release. Only the name changes; the tag stays.
  - name: docker.io/vllm/vllm-torchtpu
    newName: docker.io/vllm/vllm-openai-cpu

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: precise-prefix-cache-routing-tokenizer
    patch: |-
      # The rendering flags of ../base/patch-vllm.yaml. A pool without the tool
      # flags answers 400 to every request that carries tools.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--max-model-len=16384"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--enable-auto-tool-choice"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--tool-call-parser=hermes"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--reasoning-parser=qwen3"
