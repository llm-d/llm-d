apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/vllm

namePrefix: precise-prefix-cache-routing-tpu-v6-vllm-

components:
  - ../../../../../recipes/modelserver/components/images/tpu-vllm

labels:
  - pairs:
      llm-d.ai/guide: precise-prefix-cache-routing
      llm-d.ai/model: Qwen3-32B
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
