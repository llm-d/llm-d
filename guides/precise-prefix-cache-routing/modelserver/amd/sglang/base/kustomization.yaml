apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: precise-prefix-cache-routing-rocm-sglang-

components:
  # Keep the ROCm image aligned with the AMD SGLang optimized baseline.
  - ../../../../../recipes/modelserver/components/images/amd-sglang/rocm10-mi355x

labels:
  - pairs:
      llm-d.ai/guide: precise-prefix-cache-routing
      llm-d.ai/model: Qwen3-32B
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: amd
      llm-d.ai/engine-type: sglang
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-sglang.yaml
