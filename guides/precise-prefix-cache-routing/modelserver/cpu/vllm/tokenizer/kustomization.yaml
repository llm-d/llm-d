apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tokenizer pool of the CPU vLLM model server (../base): its vLLM release, its model
# and its rendering flags, so the pool returns the model server's token IDs.
resources:
  - ../../../../tokenizer

components:
  # The model server's image component: the same image runs both.
  - ../../../../../recipes/modelserver/components/images/cpu-vllm/release

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: precise-prefix-cache-routing-tokenizer
    patch: |-
      # The model and context length of ../base/patch-vllm.yaml.
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: "meta-llama/Llama-3.2-3B-Instruct"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--max-model-len=8192"
