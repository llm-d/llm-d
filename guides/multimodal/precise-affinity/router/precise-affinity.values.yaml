## multimodal precise-affinity guide overrides for the llm-d router.
## Layer on top of: recipes/router/base.values.yaml
##
## A `vllm launch render` sidecar exposes /v1/chat/completions/render on
## localhost:8000; the EPP `token-producer` plugin calls that endpoint to
## tokenize prompts and extract multimodal item hashes.
##
## Affinity routing is precise (per multimodal item, per pod) rather than
## approximate; see ../README.md for when this matters vs the optimized-baseline
## flavor.

router:
  tokenizer:
    enabled: true
    # Must match the served model and the token-producer modelName below.
    modelName: Qwen/Qwen3-VL-32B-Instruct
    env:
      - name: HF_HOME
        value: /tmp/hf/hub

  epp:
    pluginsConfigFile: "precise-affinity-plugins.yaml"
    pluginsCustomConfig:
      precise-affinity-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
          - type: token-producer
            parameters:
              # Must match router.tokenizer.modelName above.
              modelName: Qwen/Qwen3-VL-32B-Instruct
              vllm:
                url: http://localhost:8000
          - type: mm-embeddings-cache-producer
            parameters:
              # Per-pod LRU memory budget in mebibytes.
              # Raise for high-cardinality multimodal content; reduce on
              # memory-constrained EPP nodes.
              cacheSizeInMBPerServer: 2048
          - type: mm-embeddings-cache-scorer
          - type: kv-cache-utilization-scorer
          - type: queue-scorer
          - type: no-hit-lru-scorer
          - type: decode-filter
          - type: max-score-picker
          - type: single-profile-handler
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: decode-filter
              - pluginRef: queue-scorer
                weight: 2.0
              - pluginRef: kv-cache-utilization-scorer
                weight: 2.0
              # Affinity weight set high so identical multimodal content
              # deterministically lands on the cached pod once warm.
              - pluginRef: mm-embeddings-cache-scorer
                weight: 10.0
              # Tiebreak for cold cache: spread requests with no affinity
              # signal across least-recently-picked endpoints.
              - pluginRef: no-hit-lru-scorer
                weight: 1.0
              - pluginRef: max-score-picker

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  modelServers:
    type: vllm
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "precise-affinity"
