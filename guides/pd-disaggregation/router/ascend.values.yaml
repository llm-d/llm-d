# Common Router overrides for Ascend P/D. Layer after pd-disaggregation.values.yaml.
# Selects Ascend vLLM endpoints by default and defines the Ascend P/D routing profile.
router:
  inferencePool:
    failureMode: FailClose
  modelServers:
    matchLabels:
      llm-d.ai/deployment: ascend-vllm-pd
      llm-d.ai/accelerator-vendor: huawei
      leaderworkerset.sigs.k8s.io/worker-index: '0'
  epp:
    # Always split requests in the 1P1D reference profile. Score by active requests.
    pluginsCustomConfig:
      pd-config.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: active-request-scorer
        - type: max-score-picker
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: '2'
        memory: 4Gi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
              - arm64
  proxy:
    failOpen: false
    args:
    - --service-node
    - envoy-sidecar
    - --log-level
    - warn
    - --concurrency
    - '2'
    - --drain-strategy
    - immediate
    - --drain-time-s
    - '60'
    - -c
    - /etc/envoy/envoy.yaml
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 2Gi
