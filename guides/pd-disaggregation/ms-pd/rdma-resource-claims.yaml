apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: rdma-dranet
spec:
  selectors:
    - cel:
        expression: device.driver == "dra.net"
    - cel:
        expression: device.attributes["dra.net"].rdma == true
---
# Primary template name (as specified in values_xpu.yaml)
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: rdma-net-template
spec:
  spec:
    devices:
      requests:
        - name: rdma-net-interface
          exactly:
            deviceClassName: rdma-dranet
            count: 1
---
# Alternative template for compatibility with llm-d-modelservice v0.4.5
# In case the Helm chart dynamically renames templates based on accelerator.type = "intel"
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: intel-decode-claim-template
spec:
  spec:
    devices:
      requests:
        - name: rdma-net-interface
          exactly:
            deviceClassName: rdma-dranet
            count: 1
---
# Alternative template for prefill component
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: intel-prefill-claim-template
spec:
  spec:
    devices:
      requests:
        - name: rdma-net-interface
          exactly:
            deviceClassName: rdma-dranet
            count: 1
