# Intel XPU configuration for PD Disaggregation
# This configuration sets up prefill and decode services with Intel XPU optimization

multinode: false

# Configure accelerator type for Intel XPU
accelerator:
  type: intel

modelArtifacts:
  uri: "hf://deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  size: 10Gi  # Smaller model size for Intel XPU
  authSecretName: "llm-d-hf-token"
  name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.3.0
    connector: nixlv2
    secure: false

decode:
  create: true
  replicas: 1
  hostNetwork: true
  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics" # decode vLLM service port (from routing.proxy.targetPort)
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-xpu:v0.3.1
    modelCommand: vllmServe
    args:
      - "--block-size"
      - "128"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_buffer_device":"xpu"}'
      - "--disable-log-requests"
      - "--disable-uvicorn-access-log"
      - "--max-model-len"
      - "32000"
    securityContext:
      privileged: true
      runAsUser: 0
      runAsGroup: 0
      capabilities:
        add: ["IPC_LOCK","SYS_PTRACE","SYS_ADMIN","SYS_RAWIO"]
    env:
      - name: UCX_TLS
        value: "ib,rc,ze_copy"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5587"
      - name: UCX_MEMTYPE_CACHE
        value: "0"
      - name: UCX_NET_DEVICES
        value: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
      - name: ZE_AFFINITY_MASK
        value: "2"
    ports:
      - containerPort: 8200
        name: metrics
        protocol: TCP
    resources:
      limits:
        memory: 64Gi
        cpu: "16"
        gpu.intel.com/i915: "1"
      requests:
        memory: 64Gi
        cpu: "16"
        gpu.intel.com/i915: "1"
    mountModelVolume: true
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      - name: infiniband
        mountPath: /dev/infiniband
      - name: driver
        mountPath: /dev/dri
      - name: sys-net
        mountPath: /sys/class/net
        readOnly: true
      - name: sys-ib-verbs
        mountPath: /sys/class/infiniband_verbs
        readOnly: true
    lifecycle:
      postStart:
        exec:
          command: ["sh", "-c", "ulimit -n 65535; ulimit -l unlimited"]
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
    - name: infiniband
      hostPath:
        path: /dev/infiniband
    - name: driver
      hostPath:
        path: /dev/dri
    - name: sys-net
      hostPath:
        path: /sys/class/net
    - name: sys-ib-verbs
      hostPath:
        path: /sys/class/infiniband_verbs

prefill:
  create: true
  replicas: 1
  hostNetwork: true
  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics" # prefill vLLM service port (from routing.servicePort)
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-xpu:v0.3.1
    modelCommand: vllmServe
    args:
      - "--block-size"
      - "128"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_buffer_device":"xpu"}'
      - "--disable-log-requests"
      - "--disable-uvicorn-access-log"
      - "--max-model-len"
      - "32000"
    securityContext:
      privileged: true
      runAsUser: 0
      runAsGroup: 0
      # fsGroup: 0
      capabilities:
        add: ["IPC_LOCK","SYS_PTRACE","SYS_ADMIN","SYS_RAWIO"]
    env:
      - name: UCX_TLS
        value: "ib,rc,ze_copy"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: UCX_MEMTYPE_CACHE
        value: "0"
      - name: UCX_NET_DEVICES
        value: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
      - name: ZE_AFFINITY_MASK
        value: "3"

    ports:
      - containerPort: 8300
        name: metrics
        protocol: TCP
    resources:
      limits:
        memory: 64Gi
        cpu: "8"
        gpu.intel.com/i915: "1"
      requests:
        memory: 64Gi
        cpu: "8"
        gpu.intel.com/i915: "1"
    mountModelVolume: true
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      - name: infiniband
        mountPath: /dev/infiniband
      - name: driver
        mountPath: /dev/dri
      - name: sys-net
        mountPath: /sys/class/net
        readOnly: true
      - name: sys-ib-verbs
        mountPath: /sys/class/infiniband_verbs
        readOnly: true
    lifecycle:
      postStart:
        exec:
          command: ["sh", "-c", "ulimit -n 65535; ulimit -l unlimited"]
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
    - name: infiniband
      hostPath:
        path: /dev/infiniband
    - name: driver
      hostPath:
        path: /dev/dri
    - name: sys-net
      hostPath:
        path: /sys/class/net
    - name: sys-ib-verbs
      hostPath:
        path: /sys/class/infiniband_verbs