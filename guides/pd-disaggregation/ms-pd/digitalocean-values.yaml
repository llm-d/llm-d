      - "--tensor-parallel-size"
      - "1"  # Single GPU instead of 4
      - "--block-size"
      - "128"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector", "kv_role":"kv_producer"}'
      - "--disable-log-requests"
      - "--disable-uvicorn-access-log"
      - "--max-model-len"
      - "8192"  # Smaller context for less VRAM
      - "--gpu-memory-utilization"
      - "0.85"
    env:
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "54321"
      - name: NIXL_SIDE_CHANNEL_DIR
        value: "/nixl_sideband"
      - name: CUDA_VISIBLE_DEVICES
        value: "0"
      - name: UCX_TLS
        value: "cuda_ipc,cuda_copy,tcp"
    resources:
      requests:
        nvidia.com/gpu: 1
        memory: "16Gi"
        cpu: "4"
      limits:
        nvidia.com/gpu: 1
        memory: "32Gi"
        cpu: "8"
    volumeMounts:
    - name: nixl-sideband
      mountPath: /nixl_sideband
    - name: shared-temp
      mountPath: /tmp
    ports:
    - containerPort: 8000
      name: http
    - containerPort: 54321
      name: sideband
  volumes:
