# DigitalOcean Minimal P/D Disaggregation Override
# This file contains ONLY the values that need to be overridden for DigitalOcean
# Architecture: 1 Prefill Pod (1 GPU) + 1 Decode Pod (1 GPU) = 2 GPUs total

# Use Qwen public model - no HuggingFace token required
modelArtifacts:
  uri: "hf://Qwen/Qwen2.5-3B-Instruct"
  size: 8Gi  # Qwen 2.5-3B is smaller than LLaMA 3.2-3B
  name: "Qwen/Qwen2.5-3B-Instruct"
  authSecretName: ""  # Disable HF token for public model

routing:
  modelName: Qwen/Qwen2.5-3B-Instruct

# Decode Pod: Override to single GPU setup optimized for DigitalOcean
decode:
  replicas: 1
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d:v0.2.0"
    modelCommand: vllmServe
    args:
      - "--tensor-parallel-size"
      - "1"  # Single GPU instead of 4
      - "--block-size"
      - "128"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
      - "--disable-log-requests"
      - "--disable-uvicorn-access-log"
      - "--max-model-len"
      - "8192"  # Smaller context for less VRAM
      - "--gpu-memory-utilization"
      - "0.85"
    env:
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "54321"
      - name: NIXL_SIDE_CHANNEL_DIR
        value: "/nixl_sideband"
      - name: CUDA_VISIBLE_DEVICES
        value: "0"
      - name: UCX_TLS
        value: "cuda_ipc,cuda_copy,tcp"
    resources:
      requests:
        nvidia.com/gpu: 1
        memory: "16Gi"
        cpu: "4"
      limits:
        nvidia.com/gpu: 1
        memory: "32Gi"
        cpu: "8"
    volumeMounts:
    - name: nixl-sideband
      mountPath: /nixl_sideband
    - name: shared-temp
      mountPath: /tmp
    ports:
    - containerPort: 8000
      name: http
    - containerPort: 54321
      name: sideband
  volumes:
  - name: nixl-sideband
    emptyDir: {}
  - name: shared-temp
    emptyDir: {}
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  nodeSelector:
    doks.digitalocean.com/gpu-brand: nvidia

# Prefill Pod: Override to single GPU setup
prefill:
  replicas: 1
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d:v0.2.0"
    modelCommand: vllmServe
