apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg-vllm
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: pd-disaggregation-coordinator
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/engine-type: vllm
    llm-d.ai/model: gpt-oss-120b
spec:
  # The llm-d Coordinator dispatches the prefill and decode
  # phases through the Gateway, so decode runs no routing sidecar and its model
  # server serves port 8000, the port the InferencePool targets on every pod.
  #
  # One copy of the P/D topology: a 1-prefill (TP=1) + 1-decode (TP=4) set
  # that rolls out and recovers on its own clock. Raise slices for more
  # independent copies; changing slices is a pure scale operation and never
  # triggers a rollout of existing slices.
  slices: 1

  # Optionally confine each slice to a single topology domain (rack, NVLink
  # domain, zone, ...) and spread slices across domains, so prefill hands KV
  # cache to decode within the domain. Affinity is injected when a
  # LeaderWorkerSet is created, so enabling this takes effect on the next
  # rollout. ExclusiveTopology additionally guarantees at most one slice per
  # domain across all DisaggregatedSets.
  # See docs/operations/disaggregation/disaggregatedset.md for per-platform
  # topology label keys.
  # placementPolicy:
  #   type: ExclusiveSlice
  #   topology: topology.kubernetes.io/zone

  roles:
    - name: prefill
      spec:
        replicas: 1  # per slice
        groupIdentity: Hash
        rolloutStrategy:
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 1  # single-host: each group is one pod
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: pd-disaggregation-coordinator
                llm-d.ai/accelerator-variant: gpu
                llm-d.ai/accelerator-vendor: nvidia
                llm-d.ai/engine-type: vllm
                llm-d.ai/model: gpt-oss-120b
                llm-d.ai/role: prefill
            spec:
              serviceAccountName: pd-disagg-vllm
              containers:
                - name: modelserver
                  image: REPLACE_MODEL_SERVER_IMAGE
                  command: ["vllm", "serve"]
                  args:
                    - "openai/gpt-oss-120b"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=1"
                    - "--block-size=128"
                    - "--enable-auto-tool-choice"
                    - "--tool-call-parser=openai"
                    - "--reasoning-parser=openai_gptoss"
                    - "--kv-transfer-config"
                    - '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"]}}'
                    - "--no-disable-hybrid-kv-cache-manager"
                    - "--shutdown-timeout=45"
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    # NOTE: vLLM 0.19.X and 0.20.X images ship both nixl-cu13 and nixl-cu12;
                    # NIXL can pick the wrong UCX libraries. Uncomment UCX_MODULE_DIR only
                    # if you are running a cu129 version of vLLM.
                    # - name: UCX_MODULE_DIR
                    #   value: /usr/local/lib/python3.12/dist-packages/nixl_cu12.libs/ucx
                    # Phase calls reach the model servers through the Gateway's proxy. Keep its
                    # idle connections open longer than vLLM's 5s default, so the proxy rarely
                    # reuses a connection the server has already closed (TCP RST).
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"
                  ports:
                    - name: modelserver
                      containerPort: 8000
                      protocol: TCP
                    - name: nixl
                      containerPort: 5600
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "8"
                      memory: 16Gi
                      nvidia.com/gpu: "1"
                    requests:
                      cpu: "8"
                      memory: 16Gi
                      nvidia.com/gpu: "1"
                  startupProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.config
                      name: vllm-config
                    - mountPath: /.triton
                      name: triton-cache
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}

    - name: decode
      spec:
        replicas: 1  # per slice
        groupIdentity: Hash
        rolloutStrategy:
          rollingUpdateConfiguration:
            # Surge so a slice never loses its only decode during a rollout.
            # Requires 4 spare GPUs while a slice rolls; set maxSurge: 0 /
            # maxUnavailable: 1 instead on capacity-constrained clusters.
            maxSurge: 1
            maxUnavailable: 0
        leaderWorkerTemplate:
          size: 1  # single-host: each group is one pod
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: pd-disaggregation-coordinator
                llm-d.ai/accelerator-variant: gpu
                llm-d.ai/accelerator-vendor: nvidia
                llm-d.ai/engine-type: vllm
                llm-d.ai/model: gpt-oss-120b
                llm-d.ai/role: decode
            spec:
              serviceAccountName: pd-disagg-vllm
              containers:
                - name: modelserver
                  image: REPLACE_MODEL_SERVER_IMAGE
                  command: ["vllm", "serve"]
                  args:
                    - "openai/gpt-oss-120b"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=4"
                    - "--block-size=128"
                    - "--enable-auto-tool-choice"
                    - "--tool-call-parser=openai"
                    - "--reasoning-parser=openai_gptoss"
                    - "--kv-transfer-config"
                    - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"]}}'
                    - "--no-disable-hybrid-kv-cache-manager"
                    - "--shutdown-timeout=45"
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    # NOTE: vLLM 0.19.X and 0.20.X images ship both nixl-cu13 and nixl-cu12;
                    # NIXL can pick the wrong UCX libraries. Uncomment UCX_MODULE_DIR only
                    # if you are running a cu129 version of vLLM.
                    # - name: UCX_MODULE_DIR
                    #   value: /usr/local/lib/python3.12/dist-packages/nixl_cu12.libs/ucx
                  ports:
                    - name: modelserver
                      containerPort: 8000
                      protocol: TCP
                    - name: nixl
                      containerPort: 5600
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "16"
                      memory: 64Gi
                      nvidia.com/gpu: "4"
                    requests:
                      cpu: "16"
                      memory: 64Gi
                      nvidia.com/gpu: "4"
                  startupProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.config
                      name: vllm-config
                    - mountPath: /.triton
                      name: triton-cache
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}
