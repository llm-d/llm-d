apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Model servers on NVIDIA GPU with vLLM: a prefill and a decode
# role in one DisaggregatedSet, with no routing sidecar. This is also the
# INFRA_PROVIDER=base overlay; ../gke adds GPU DRA and DRANet RoCE.
resources:
  - serviceaccount.yaml
  - disaggregatedset.yaml

components:
  - ../../../../../../recipes/modelserver/components/images/gpu-vllm/release
  - ../../../../../../recipes/modelserver/components/disaggregatedset-schema
  - ../../../../../../recipes/modelserver/components/graceful-shutdown
