# The GKE load balancer's backend timeout defaults to 30s, which would cut off
# longer generations. 300s matches the Coordinator's server.write_timeout
# (../base/configmap.yaml). Only one GCPBackendPolicy can attach to a target,
# so fold any other settings for this Service into this policy.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: llm-d-coordinator-backend-policy
spec:
  default:
    timeoutSec: 300
  targetRef:
    group: ""
    kind: Service
    name: llm-d-coordinator
