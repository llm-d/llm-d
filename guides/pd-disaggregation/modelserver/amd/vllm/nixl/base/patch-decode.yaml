apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: decode
      spec:
        replicas: 1
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: modelserver
                  command: ["vllm", "serve"]
                  args:
                    - "openai/gpt-oss-120b"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=4"
                    - "--kv-cache-memory-bytes=100000000000"
                    - "--block-size=128"
                    - "--enable-auto-tool-choice"
                    - "--tool-call-parser=openai"
                    - "--reasoning-parser=openai_gptoss"
                    - "--kv-transfer-config"
                    - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"]}}'
                    - "--no-disable-hybrid-kv-cache-manager"
                    - "--port=8200"
                    - "--shutdown-timeout=45"
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: VLLM_ROCM_USE_AITER
                      value: "1"
                    - name: AITER_JIT_DIR
                      value: "/.aiter"
                    - name: VLLM_CACHE_ROOT
                      value: "/.cache"
                    # Cap AITER JIT (torch cpp_extension) build parallelism to the CPU
                    # limit to avoid starvation across the four TP workers.
                    - name: MAX_JOBS
                      value: "16"
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]
                  resources:
                    limits:
                      cpu: "16"
                      memory: 256Gi
                      amd.com/gpu: "4"
                    requests:
                      cpu: "16"
                      memory: 256Gi
                      amd.com/gpu: "4"
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.config
                      name: vllm-config
                    - mountPath: /.triton
                      name: triton-cache
                    - mountPath: /.aiter
                      name: aiter-cache
                  startupProbe:
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}
                - name: aiter-cache
                  emptyDir: {}
