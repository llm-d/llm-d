#
# AMD-CI provider
# - This system relies on DMABUF exclusively, no peermem.
#
# GPU count is intentionally NOT set here: it is inherited from base so the
# base config remains the single source of truth for parallelism. The
# RDMA NIC count (amd.com/vnic) and the NAD interface list must match that
# GPU/TP count per role: prefill = 1, decode = 4.
#

apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: prefill
      spec:
        leaderWorkerTemplate:
          workerTemplate:
            metadata:
              annotations:
                k8s.v1.cni.cncf.io/networks: |
                  [
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net1"}
                  ]
            spec:
              hostIPC: true
              volumes:
                - name: ucx-kernel-config
                  emptyDir: {}
              initContainers:
                # UCX < 1.23 detects DMABUF only via /boot/config-$(uname -r),
                # which these nodes do not expose to pods. Write it for the
                # running kernel so node kernel upgrades need no change here.
                - name: ucx-kernel-config
                  image: docker.io/library/busybox:1.37
                  command: ["sh", "-c", "printf 'CONFIG_DMABUF_MOVE_NOTIFY=y\\nCONFIG_PCI_P2PDMA=y\\n' > /boot/config-$(uname -r)"]
                  volumeMounts:
                    - name: ucx-kernel-config
                      mountPath: /boot
              containers:
                - name: modelserver
                  volumeMounts:
                    - name: ucx-kernel-config
                      mountPath: /boot
                      readOnly: true
                  resources:
                    limits:
                      amd.com/vnic: "1"
                    requests:
                      amd.com/vnic: "1"
                  env:
                    # Enable DMABUF; necessary for UCX < 1.23.x
                    - { name: UCX_ROCM_COPY_DMABUF,           value: "yes" }
                    - { name: UCX_IB_GPU_DIRECT_RDMA,         value: "try" }
                    - { name: UCX_TLS,                        value: "self,rocm,shm,rc" }
                    - { name: UCX_LOG_LEVEL,                  value: "INFO" }
    - name: decode
      spec:
        leaderWorkerTemplate:
          workerTemplate:
            metadata:
              annotations:
                k8s.v1.cni.cncf.io/networks: |
                  [
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net1"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net2"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net3"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net4"}
                  ]
            spec:
              hostIPC: true
              volumes:
                - name: ucx-kernel-config
                  emptyDir: {}
              initContainers:
                - name: ucx-kernel-config
                  image: docker.io/library/busybox:1.37
                  command: ["sh", "-c", "printf 'CONFIG_DMABUF_MOVE_NOTIFY=y\\nCONFIG_PCI_P2PDMA=y\\n' > /boot/config-$(uname -r)"]
                  volumeMounts:
                    - name: ucx-kernel-config
                      mountPath: /boot
              containers:
                - name: modelserver
                  volumeMounts:
                    - name: ucx-kernel-config
                      mountPath: /boot
                      readOnly: true
                  resources:
                    limits:
                      amd.com/vnic: "4"
                    requests:
                      amd.com/vnic: "4"
                  env:
                    - { name: UCX_ROCM_COPY_DMABUF,           value: "yes" }
                    - { name: UCX_IB_GPU_DIRECT_RDMA,         value: "try" }
                    - { name: UCX_TLS,                        value: "self,rocm,shm,rc" }
                    - { name: UCX_LOG_LEVEL,                  value: "INFO" }
