apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OCI OKE deployment of Llama-3.3-70B-Instruct-FP8-KV on BM.GPU.MI300X.8 nodes.
# Network: NVIDIA Network Operator SR-IOV VFs (nvidia.com/sriov-rdma-vf) over RoCE.
# Resource layout per BM.GPU.MI300X.8 node: 8x amd.com/gpu, 8x nvidia.com/sriov-rdma-vf.
# 1 decode (TP=4, 4 GPU + 4 VF) + 1 prefill (TP=1, 1 GPU + 1 VF); scale prefill to 4
# replicas to fill one node.
resources:
  - ../base

components:
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema

patches:
  # Settings shared by both roles: written once under prefill and aliased into decode.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: prefill
            spec: &oci
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        env:
                          # UCX transport for OCI RoCE via SR-IOV VFs.
                          # rc/ud = RDMA reliable/unreliable connected over RoCE, sm = shared memory, cuda_copy = fallback.
                          - name: UCX_TLS
                            value: "rc,ud,sm,self,cuda_copy"
                          # RoCE v2 GID index — verify with `show_gids` on the host; typically 3 on OCI.
                          - name: UCX_IB_GID_INDEX
                            value: "3"
                        volumeMounts:
                          - name: dev-infiniband
                            mountPath: /dev/infiniband
                        # IPC_LOCK allows UCX/RDMA to lock memory pages (mlock) — required for SR-IOV RDMA on OCI.
                        securityContext:
                          capabilities:
                            add:
                              - IPC_LOCK
                    volumes:
                      - name: dev-infiniband
                        hostPath:
                          path: /dev/infiniband
                          type: Directory
          - name: decode
            spec: *oci
  # OCI SR-IOV RDMA VFs via NVIDIA Network Operator — 1 VF per GPU in the TP group, and the
  # matching Multus interfaces. The SriovNetwork CR "sriov-rdma-vf" is published to namespace "default".
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  metadata:
                    annotations:
                      # 1 interface to match tensor parallelism (TP=1).
                      k8s.v1.cni.cncf.io/networks: |
                        [
                          {"name":"sriov-rdma-vf","namespace":"default","interface":"net1"}
                        ]
                  spec:
                    containers:
                      - name: modelserver
                        resources:
                          limits:
                            nvidia.com/sriov-rdma-vf: "1"
                          requests:
                            nvidia.com/sriov-rdma-vf: "1"
          - name: decode
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  metadata:
                    annotations:
                      # 4 interfaces to match tensor parallelism (TP=4).
                      k8s.v1.cni.cncf.io/networks: |
                        [
                          {"name":"sriov-rdma-vf","namespace":"default","interface":"net1"},
                          {"name":"sriov-rdma-vf","namespace":"default","interface":"net2"},
                          {"name":"sriov-rdma-vf","namespace":"default","interface":"net3"},
                          {"name":"sriov-rdma-vf","namespace":"default","interface":"net4"}
                        ]
                  spec:
                    containers:
                      - name: modelserver
                        resources:
                          limits:
                            nvidia.com/sriov-rdma-vf: "4"
                          requests:
                            nvidia.com/sriov-rdma-vf: "4"
