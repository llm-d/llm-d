apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../recipes/modelserver/common
  - prefill-deployment.yaml
  - decode-deployment.yaml

namePrefix: pd-disagg-hygon-sglang-

components:
  - ../../../../../recipes/modelserver/components/images/hygon-sglang/release
  - ../../../../../recipes/modelserver/components/images/routing-sidecar/nightly

labels:
  - pairs:
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/accelerator-variant: hcu
      llm-d.ai/accelerator-vendor: hygon
      llm-d.ai/engine-type: sglang
      llm-d.ai/model: Qwen3-8B
      llm-d.ai/inference-serving: "true"
    includeSelectors: true
    includeTemplates: true
