apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

components:
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema

patches:
  - target:
      kind: ResourceClaimTemplate
      name: xpu-decode-claim
    patch: |-
      apiVersion: resource.k8s.io/v1
      kind: ResourceClaimTemplate
      metadata:
        name: xpu-decode-claim
      spec:
        spec:
          devices:
            requests:
              - name: gpu
                exactly:
                  deviceClassName: gpu.intel.com
                  count: 1
              - name: nic
                exactly:
                  deviceClassName: dranet-rdma
                  count: 1
                  selectors:
                    - cel:
                        expression: device.attributes["dra.net"].rdma == true
            constraints:
              - matchAttribute: "resource.kubernetes.io/pcieRoot"
  - target:
      kind: ResourceClaimTemplate
      name: xpu-prefill-claim
    patch: |-
      apiVersion: resource.k8s.io/v1
      kind: ResourceClaimTemplate
      metadata:
        name: xpu-prefill-claim
      spec:
        spec:
          devices:
            requests:
              - name: gpu
                exactly:
                  deviceClassName: gpu.intel.com
                  count: 1
              - name: nic
                exactly:
                  deviceClassName: dranet-rdma
                  count: 1
                  selectors:
                    - cel:
                        expression: device.attributes["dra.net"].rdma == true
            constraints:
              - matchAttribute: "resource.kubernetes.io/pcieRoot"
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        env: &rdma-env
                          - name: UCX_TLS
                            value: ib,rc,ze_copy
          - name: decode
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        env: *rdma-env
