apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

components:
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema

# Override the base GPU-only ResourceClaimTemplates with GPU+NIC aligned versions.
# The strategic merge patches replace the devices spec to add an RDMA NIC request
# and a PCIe root alignment constraint, ensuring GPU and NIC share the same
# PCIe root complex for optimal RDMA transfer performance.
patches:
  # Decode ResourceClaimTemplate: add NIC request + PCIe alignment
  - target:
      kind: ResourceClaimTemplate
      name: xpu-decode-claim
    patch: |-
      apiVersion: resource.k8s.io/v1
      kind: ResourceClaimTemplate
      metadata:
        name: xpu-decode-claim
      spec:
        spec:
          devices:
            requests:
              - name: gpu
                exactly:
                  deviceClassName: gpu.intel.com
                  count: 1
              - name: nic
                exactly:
                  deviceClassName: dranet-rdma
                  count: 1
                  selectors:
                    - cel:
                        expression: device.attributes["dra.net"].rdma == true
            constraints:
              - matchAttribute: "resource.kubernetes.io/pcieRoot"
  # Prefill ResourceClaimTemplate: add NIC request + PCIe alignment
  - target:
      kind: ResourceClaimTemplate
      name: xpu-prefill-claim
    patch: |-
      apiVersion: resource.k8s.io/v1
      kind: ResourceClaimTemplate
      metadata:
        name: xpu-prefill-claim
      spec:
        spec:
          devices:
            requests:
              - name: gpu
                exactly:
                  deviceClassName: gpu.intel.com
                  count: 1
              - name: nic
                exactly:
                  deviceClassName: dranet-rdma
                  count: 1
                  selectors:
                    - cel:
                        expression: device.attributes["dra.net"].rdma == true
            constraints:
              - matchAttribute: "resource.kubernetes.io/pcieRoot"
  # Both roles: switch to RDMA transport and the XPU kv buffer.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg
      spec:
        roles:
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        args:
                          - "Qwen/Qwen3-0.6B"
                          - "--disable-uvicorn-access-log"
                          - "--tensor-parallel-size=1"
                          - "--block-size=64"
                          - "--kv-transfer-config"
                          - '{"kv_connector":"NixlConnector", "kv_role":"kv_producer", "kv_buffer_device":"xpu"}'
                          - "--max-model-len=32000"
                        env: &rdma-env
                          - name: UCX_TLS
                            value: ib,rc,ze_copy
                          - name: UCX_MEMTYPE_CACHE
                            value: "0"
          - name: decode
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        args:
                          - "Qwen/Qwen3-0.6B"
                          - "--disable-uvicorn-access-log"
                          - "--tensor-parallel-size=1"
                          - "--block-size=64"
                          - "--kv-transfer-config"
                          - '{"kv_connector":"NixlConnector", "kv_role":"kv_consumer", "kv_buffer_device":"xpu"}'
                          - "--max-model-len=32000"
                          - "--port=8200"
                        env: *rdma-env
