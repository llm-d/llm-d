apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: prefill
      spec:
        replicas: 1
        # A rolling update keeps the old and the new pod of a replica both holding a
        # claim, so neither becomes ready where there is no spare accelerator.
        rolloutStrategy:
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          workerTemplate:
            metadata:
              annotations:
                # The pool's targetPorts (router/npu.rbln.values.yaml) are 8000-8003 for
                # decode's four DP ranks; pipeline-parallel prefill serves 8000 alone.
                llm-d.ai/active-ports: "8000"
            spec:
              # The two roles want separate nodes when the cluster has them, and still
              # co-locate on a single-node cluster because this is only a preference.
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        topologyKey: kubernetes.io/hostname
                        labelSelector:
                          matchLabels:
                            llm-d.ai/guide: pd-disaggregation
              securityContext:
                runAsUser: 2000
                runAsGroup: 0
                fsGroup: 1600
              containers:
                - name: modelserver
                  command: ["vllm", "serve"]
                  args:
                    - "MiniMaxAI/MiniMax-M2.7"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    # Pipeline parallelism, not data parallelism: one API server drives all four
                    # NPUs, so this role keeps the single port the base declares.
                    - "--pipeline-parallel-size=4"
                    - "--block-size=4096"
                    - "--max-num-batched-tokens=512"
                    - "--kv-cache-dtype=fp8"
                    # Both roles must hash blocks alike, or decode cannot reuse the prefix cache prefill sends over NIXL;
                    # sha256_cbor is the one that matches LMCache's hash.
                    - "--prefix-caching-hash-algo=sha256_cbor"
                    # Prefetching shortens the weight load.
                    - "--safetensors-load-strategy=prefetch"
                    - "--enable-auto-tool-choice"
                    - "--tool-call-parser=minimax_m2"
                    - "--reasoning-parser=minimax_m2"
                    - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true,"enable_in_reasoning":true}'
                    - "--max-num-seqs=4"
                    - '--kv-transfer-config={"kv_connector":"RblnNixlConnector","kv_role":"kv_both","kv_buffer_device":"rbln","kv_connector_extra_config":{"name":"nixl"}}'
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: VLLM_CACHE_ROOT
                      value: /workspace/.cache
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                      value: "5600"
                    # The pipeline spans all four claimed NPUs; the runtime does not infer that.
                    - name: RBLN_VISIBLE_DEVICES
                      value: "0,1,2,3"
                    # The decode sidecar holds an idle upstream connection for about 90s while
                    # vLLM closes one after 5s, so a reused connection would reset the handoff.
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"
                    # Unreachable in practice: the startupProbe budget below is 7215s.
                    - name: VLLM_ENGINE_READY_TIMEOUT_S
                      value: "9600"
                    - name: VLLM_RPC_TIMEOUT
                      value: "1800000"
                  resources:
                    # Anonymous memory measured 20Gi for this role once serving; the rest of the
                    # limit is headroom for the page cache the model read charges to the cgroup.
                    # Keep cpu even — a node with an SMT-aligned static CPU manager rejects odd
                    # counts.
                    limits:
                      cpu: "40"
                      memory: 460Gi
                    requests:
                      cpu: "40"
                      memory: 460Gi
                    claims:
                      - name: npu-prefill-claim
                  volumeMounts:
                    - mountPath: /workspace/.cache
                      name: rbln-compile-cache
                    - mountPath: /dev/shm
                      name: shm
                  # 15 + 30x240 = 7215s, the same 240 checks the vendor's own reference
                  # deployment allows. Measured on one node this role reached ready well
                  # inside that, but only with the weights already cached; a first start
                  # also pulls them, and the compile cache is an emptyDir so every restart
                  # recompiles from zero.
                  startupProbe:
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 240
                  livenessProbe:
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
              resourceClaims:
                - name: npu-prefill-claim
                  resourceClaimTemplateName: npu-prefill-claim
              volumes:
                - name: rbln-compile-cache
                  emptyDir: {}
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
