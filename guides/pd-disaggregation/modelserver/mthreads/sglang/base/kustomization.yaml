apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../recipes/modelserver/base/single-host/pd-disaggregatedset/sglang

nameSuffix: -mthreads-sglang

components:
  - ../../../../../recipes/modelserver/components/images/mthreads-sglang/release
  - ../../../../../recipes/modelserver/components/images/routing-sidecar/nightly
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema

labels:
  - pairs:
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: mthreads
      llm-d.ai/engine-type: sglang
      llm-d.ai/model: DeepSeek-V4-Flash-0731-FP8-mt
    fields:
      - path: spec/roles/spec/leaderWorkerTemplate/workerTemplate/metadata/labels
        kind: DisaggregatedSet
        create: true

patches:
  - path: patch-decode.yaml
  - path: patch-prefill.yaml
