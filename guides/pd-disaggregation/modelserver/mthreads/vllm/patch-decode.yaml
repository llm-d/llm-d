apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - Qwen/Qwen3-32B
            - --served-model-name=Qwen3-32B
            - --host=0.0.0.0
            - --port=8200
            - --tensor-parallel-size=4
            - --dtype=bfloat16
            - --enforce-eager
            - --max-model-len=2048
            - --max-num-seqs=16
            - --max-num-batched-tokens=2048
            - --gpu-memory-utilization=0.5
            - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
            - --kv-transfer-config
            - '{"kv_connector":"MooncakeConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_connector_extra_config":{"mooncake_protocol":"tcp"}}'
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
              value: "8998"
          ports:
            - $patch: replace
            - name: modelserver
              containerPort: 8200
              protocol: TCP
            - name: mc-bootstrap
              containerPort: 8998
              protocol: TCP
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              mthreads.com/gpu: "4"
            limits:
              memory: 128Gi
              mthreads.com/gpu: "4"
          startupProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe: null
          securityContext:
            capabilities:
              add: [IPC_LOCK]
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
