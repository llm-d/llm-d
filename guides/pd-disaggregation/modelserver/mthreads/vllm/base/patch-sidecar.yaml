apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: decode
      spec:
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              initContainers:
                - name: routing-proxy
                  imagePullPolicy: IfNotPresent
                  args:
                    - --port=8000
                    - --kv-connector=mooncake
                    - --mooncake-bootstrap-port=8998
                    - --zap-log-level=1
                    - --secure-proxy=false
