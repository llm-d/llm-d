apiVersion: v1
kind: ConfigMap
metadata:
  name: mthreads-rdma-entry
data:
  # Node-level RDMA registrations need a raised memlock limit. The container
  # starts through this wrapper because Kubernetes has no ulimit field; the
  # SYS_RESOURCE capability is granted in the deployment patches so the hard
  # limit can be raised.
  entry.sh: |
    #!/bin/sh
    ulimit -l unlimited 2>/dev/null || true
    exec vllm serve "$@"
