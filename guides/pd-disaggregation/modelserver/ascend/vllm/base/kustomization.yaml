apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../recipes/modelserver/base/single-host/pd-disaggregatedset/vllm

nameSuffix: -ascend-vllm

components:
  - ../../../../../recipes/modelserver/components/images/ascend-vllm/release
  - ../../../../../recipes/modelserver/components/images/routing-sidecar/release

labels:
  - pairs:
      llm-d.ai/accelerator-variant: ascend
      llm-d.ai/accelerator-vendor: huawei
      llm-d.ai/engine-type: vllm
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/inference-serving: 'true'
      llm-d.ai/model: qwen3-0-6b
      llm-d.ai/deployment: ascend-vllm-pd
    fields:
      - path: spec/roles/spec/leaderWorkerTemplate/workerTemplate/metadata/labels
        kind: DisaggregatedSet
        create: true

patches:
  - path: patch-prefill.yaml
  - path: patch-decode.yaml
