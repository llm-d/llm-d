apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen3-32B"
            - "--port=8000"
            - "--tensor-parallel=2"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--max-num-batched-tokens=8192"
            - "--kv-transfer-config"
            - '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail"}'
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5600"
            - name: UCX_TLS
              value: maca_ipc,maca_copy,tcp
            - name: UCX_PROTO_ENABLE
              value: "y"
            # Default vLLM keep-alive (5s) is shorter than llm-d-routing-sidecar's default idle
            # conn timeout (90s, from Go http.Transport), causing TCP RSTs on reuse.
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
            - name: nixl
              containerPort: 5600
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
            seccompProfile:
              type: Unconfined
          resources:
            limits:
              memory: 128Gi
              metax-tech.com/gpu: "2"
            requests:
              cpu: "16"
              memory: 64Gi
              metax-tech.com/gpu: "2"
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: torch-compile-cache
          emptyDir: {}
