apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/pd-disaggregatedset/vllm

nameSuffix: -iluvatar

components:
  - ../../../../../recipes/modelserver/components/images/routing-sidecar/nightly
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema

images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: registry.iluvatar.com.cn:10443/k8s/vllm
    newTag: corex510

labels:
  - pairs:
      llm-d.ai/model: Qwen3-32B
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/accelerator-variant: iluvatar
      llm-d.ai/accelerator-vendor: iluvatar
      llm-d.ai/engine-type: vllm
    fields:
      - path: spec/roles/spec/leaderWorkerTemplate/workerTemplate/metadata/labels
        kind: DisaggregatedSet
        create: true

patches:
  - path: patch-decode.yaml
  - path: patch-prefill.yaml
