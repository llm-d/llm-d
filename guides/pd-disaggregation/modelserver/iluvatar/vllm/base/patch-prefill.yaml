apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: modelserver
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              if command -v ixsmi >/dev/null 2>&1; then
                mapfile -t _uuids < <(ixsmi -L 2>/dev/null | sed -n 's/.*UUID: \(GPU-[0-9a-fA-F-]*\).*/\1/p')
                if ((${#_uuids[@]} > 0)); then
                  IFS=,
                  export IX_VISIBLE_DEVICES="${_uuids[*]}"
                  unset IFS
                  export CUDA_VISIBLE_DEVICES="$(seq -s, 0 $((${#_uuids[@]} - 1)))"
                fi
              fi
              exec vllm serve Qwen/Qwen3-32B \
                --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                --tensor-parallel-size=4 \
                --block-size=256 \
                --max-model-len=20480 \
                --max-num-seqs=64 \
                --max-num-batched-tokens=8192 \
                --kv-transfer-config '{"kv_connector":"IluNixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda"}'
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: UCX_TLS
              value: "cuda_copy,cuda_ipc,tcp,self,posix,sysv"
            - name: UCX_PROTO_ENABLE
              value: "y"
            - name: UCX_CUDA_IPC_ENABLE_SAME_PROCESS
              value: "y"
            - name: UCX_NET_DEVICES
              value: "eth0"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5600"
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
          resources:
            limits:
              cpu: "16"
              memory: 64Gi
              iluvatar.com/gpu: "2"
            requests:
              cpu: "16"
              memory: 64Gi
              iluvatar.com/gpu: "2"
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /.triton
              name: triton-cache
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
