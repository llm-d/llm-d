apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  # Kueue stores "leaderworkerset-<lws>-<group>-<hash>" in a 63-character label,
  # which bounds a generated LeaderWorkerSet name (<set>-<slice>-<revision>-<role>,
  # 8-character revision) to 39 characters: 18 + 11 + len("prefill") = 36.
  name: pd-disagg-tpu-vllm
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: pd-disaggregation
    llm-d.ai/accelerator-variant: tpu
    llm-d.ai/accelerator-vendor: google
    llm-d.ai/engine-type: vllm
    llm-d.ai/model: Qwen3-Coder-480B-A35B-Instruct-FP8
spec:
  # One copy of the P/D topology: 1 prefill + 1 decode, each group on its own
  # 2x2x1 sub-slice. Role replicas apply per slice, so other xPyD ratios are set
  # on the roles below; raising slices adds complete copies at the current
  # revision without rolling the existing ones.
  slices: 1

  # No placementPolicy: Kueue Topology-Aware Scheduling and the GKE slice
  # controller place every LeaderWorkerSet group (see the queue-name label on
  # each role), and the GKE TPU pods carry no static topology nodeSelector.

  roles:
    - name: prefill
      # Copied onto the LeaderWorkerSet generated for this role. Kueue reads the
      # queue name from the LeaderWorkerSet metadata, not from this set's labels.
      metadata:
        labels:
          # LocalQueue from docs/infrastructure/providers/gke/dynamic-slicing/kueue-localqueue.yaml
          kueue.x-k8s.io/queue-name: tpu7x-subslice-lq
          llm-d.ai/role: prefill
      spec:
        replicas: 1  # per slice
        # Ordinal (the default) is required under Kueue: its LeaderWorkerSet
        # integration creates one Workload per numeric group index and ungates
        # pods that are not owned by a StatefulSet. Hash mode assigns random
        # group keys and runs leaders through a Deployment, so Kueue would never
        # admit them and no Slice would be formed.
        groupIdentity: Ordinal
        rolloutStrategy:
          rollingUpdateConfiguration:
            # Surge so the only prefill keeps serving while its replacement
            # starts. The surge group needs one free 2x2x1 sub-slice (one
            # tpu7x-standard-4t host) in the sub-block; set maxSurge: 0 /
            # maxUnavailable: 1 instead when the sub-block is fully allocated.
            maxSurge: 1
            maxUnavailable: 0
        leaderWorkerTemplate:
          # 2x2x1 sub-slice = 4 chips = 1 tpu7x-standard-4t host.
          size: 1
          restartPolicy: RecreateGroupOnPodRestart
          workerTemplate:
            metadata:
              annotations:
                cloud.google.com/gke-tpu-slice-topology: "2x2x1"
                # Dynamic-slice pods carry no static gke-tpu-topology nodeSelector,
                # which the GKE TPU admission webhook otherwise requires.
                cloud.google.com/skip-tpu-webhook-check: "true"
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/role: prefill
                llm-d.ai/guide: pd-disaggregation
                llm-d.ai/model: Qwen3-Coder-480B-A35B-Instruct-FP8
                llm-d.ai/accelerator-variant: tpu
                llm-d.ai/accelerator-vendor: google
                llm-d.ai/engine-type: vllm
            spec:
              serviceAccountName: pd-disagg-tpu-vllm
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-partition-2x2x1-state: "HEALTHY"
              tolerations:
                - key: google.com/tpu
                  operator: Exists
                  effect: NoSchedule
              containers:
                - name: modelserver
                  image: REPLACE_MODEL_SERVER_IMAGE
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -euo pipefail

                      if [[ "${POD_IP}" == *":"* ]]; then
                        HOST_ADDR="::"
                        export VLLM_HOST_IP="[${POD_IP}]"
                      else
                        HOST_ADDR="0.0.0.0"
                        export VLLM_HOST_IP="${POD_IP}"
                      fi

                      exec vllm serve Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8 \
                        --host "${HOST_ADDR}" \
                        --max-model-len=262144 \
                        --max-num-batched-tokens=8192 \
                        --max-num-seqs=64 \
                        --tensor-parallel-size=8 \
                        --kv-cache-dtype=fp8 \
                        --gpu-memory-utilization=0.80 \
                        --async-scheduling \
                        --enable-expert-parallel \
                        --block-size=256 \
                        --kv-transfer-config '{"kv_connector":"TPUConnectorHMA","kv_connector_module_path":"tpu_inference.distributed.tpu_connector_hma","kv_role":"kv_producer","kv_ip":"$(POD_IP)"}' \
                        --port=8000 \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models
                  env:
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: TPU_SIDE_CHANNEL_PORT
                      value: "9600"
                    - name: TPU_KV_TRANSFER_PORT
                      value: "9100"
                    - name: TPU_ENABLE_D2H_TRANSFER
                      value: "0"
                    - name: TPU_MAX_HOST_KV_BUFFER_SIZE
                      value: "16"
                    - name: MODEL_IMPL_TYPE
                      value: vllm
                    - name: USE_BATCHED_RPA_KERNEL
                      value: "1"
                    - name: USE_MOE_EP_KERNEL
                      value: "0"
                    - name: VLLM_DISABLE_SHARED_EXPERTS_STREAM
                      value: "1"
                    - name: VLLM_MLA_DISABLE
                      value: "1"
                    # Default vLLM keep-alive (5s) is shorter than llm-d-routing-sidecar's default idle
                    # conn timeout (90s, from Go http.Transport), causing TCP RSTs on reuse.
                    # Server keep-alive must be >= sidecar idle timeout; configured to 120s.
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"
                    # Node-local HuggingFace cache shared across pods and restarts.
                    - name: HF_HOME
                      value: /root/.cache/huggingface
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                  ports:
                    - name: modelserver
                      containerPort: 8000
                      protocol: TCP
                    - name: tpu-kv-transfer
                      containerPort: 9100
                      protocol: TCP
                    - name: tpu-pd-coord
                      containerPort: 9600
                      protocol: TCP
                  resources:
                    limits:
                      google.com/tpu: 4
                    requests:
                      cpu: "200"
                      memory: 900Gi
                      google.com/tpu: 4
                  startupProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 480
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.config
                      name: metrics-volume
                    - mountPath: /root/.cache/huggingface
                      name: huggingface-cache
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 100Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: metrics-volume
                  emptyDir: {}
                - name: huggingface-cache
                  hostPath:
                    path: /var/cache/huggingface
                    type: DirectoryOrCreate

    - name: decode
      metadata:
        labels:
          # LocalQueue from docs/infrastructure/providers/gke/dynamic-slicing/kueue-localqueue.yaml
          kueue.x-k8s.io/queue-name: tpu7x-subslice-lq
          llm-d.ai/role: decode
      spec:
        replicas: 1  # per slice
        # See the prefill role: Kueue requires Ordinal group identity.
        groupIdentity: Ordinal
        rolloutStrategy:
          rollingUpdateConfiguration:
            # Surge so a slice never loses its only decode during a rollout; the
            # surge group needs one free 2x2x1 sub-slice in the sub-block.
            maxSurge: 1
            maxUnavailable: 0
        leaderWorkerTemplate:
          # 2x2x1 sub-slice = 4 chips = 1 tpu7x-standard-4t host.
          size: 1
          restartPolicy: RecreateGroupOnPodRestart
          workerTemplate:
            metadata:
              annotations:
                cloud.google.com/gke-tpu-slice-topology: "2x2x1"
                # Dynamic-slice pods carry no static gke-tpu-topology nodeSelector,
                # which the GKE TPU admission webhook otherwise requires.
                cloud.google.com/skip-tpu-webhook-check: "true"
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/role: decode
                llm-d.ai/guide: pd-disaggregation
                llm-d.ai/model: Qwen3-Coder-480B-A35B-Instruct-FP8
                llm-d.ai/accelerator-variant: tpu
                llm-d.ai/accelerator-vendor: google
                llm-d.ai/engine-type: vllm
            spec:
              serviceAccountName: pd-disagg-tpu-vllm
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-partition-2x2x1-state: "HEALTHY"
              tolerations:
                - key: google.com/tpu
                  operator: Exists
                  effect: NoSchedule
              initContainers:
                - name: routing-proxy
                  image: REPLACE_ROUTING_SIDECAR_IMAGE
                  imagePullPolicy: Always
                  args:
                    - --port=8000
                    - --kv-connector=nixlv2
                    - --zap-log-level=1
                    - --secure-serving=false
                  ports:
                    - name: sidecar
                      containerPort: 8000
                      protocol: TCP
                  resources: {}
                  restartPolicy: Always
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
              containers:
                - name: modelserver
                  image: REPLACE_MODEL_SERVER_IMAGE
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -euo pipefail

                      if [[ "${POD_IP}" == *":"* ]]; then
                        HOST_ADDR="::"
                        export VLLM_HOST_IP="[${POD_IP}]"
                      else
                        HOST_ADDR="0.0.0.0"
                        export VLLM_HOST_IP="${POD_IP}"
                      fi

                      exec vllm serve Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8 \
                        --host "${HOST_ADDR}" \
                        --max-model-len=262144 \
                        --max-num-batched-tokens=8192 \
                        --max-num-seqs=64 \
                        --tensor-parallel-size=8 \
                        --kv-cache-dtype=fp8 \
                        --gpu-memory-utilization=0.80 \
                        --async-scheduling \
                        --enable-expert-parallel \
                        --block-size=256 \
                        --kv-transfer-config '{"kv_connector":"TPUConnectorHMA","kv_connector_module_path":"tpu_inference.distributed.tpu_connector_hma","kv_role":"kv_consumer","kv_ip":"$(POD_IP)"}' \
                        --port=8200 \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models
                  env:
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: TPU_SIDE_CHANNEL_PORT
                      value: "9600"
                    - name: TPU_KV_TRANSFER_PORT
                      value: "9100"
                    - name: MODEL_IMPL_TYPE
                      value: vllm
                    - name: USE_BATCHED_RPA_KERNEL
                      value: "1"
                    - name: USE_MOE_EP_KERNEL
                      value: "0"
                    - name: VLLM_DISABLE_SHARED_EXPERTS_STREAM
                      value: "1"
                    - name: VLLM_MLA_DISABLE
                      value: "1"
                    # Node-local HuggingFace cache shared across pods and restarts.
                    - name: HF_HOME
                      value: /root/.cache/huggingface
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                  ports:
                    - name: modelserver
                      containerPort: 8200
                      protocol: TCP
                    - name: nixl
                      containerPort: 5600
                      protocol: TCP
                    - name: tpu-kv-transfer
                      containerPort: 9100
                      protocol: TCP
                    - name: tpu-pd-coord
                      containerPort: 9600
                      protocol: TCP
                  resources:
                    limits:
                      google.com/tpu: 4
                    requests:
                      cpu: "200"
                      memory: 900Gi
                      google.com/tpu: 4
                  startupProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 480
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.config
                      name: metrics-volume
                    - mountPath: /root/.cache/huggingface
                      name: huggingface-cache
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 100Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: metrics-volume
                  emptyDir: {}
                - name: huggingface-cache
                  hostPath:
                    path: /var/cache/huggingface
                    type: DirectoryOrCreate
