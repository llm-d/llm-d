apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# P/D disaggregation on GKE TPU7x dynamic sub-slices (2x2x1) as one LWS
# DisaggregatedSet, each role's LeaderWorkerSet scheduled via Kueue TAS.
# Cluster prerequisites (slice controller, Kueue, LocalQueue, LWS v0.11.1+):
# docs/infrastructure/providers/gke/dynamic-slicing/README.md
#
# No namePrefix: the generated LeaderWorkerSet names derive from the set name
# (see disaggregatedset.yaml), and Kueue bounds them to 39 characters.
resources:
  - serviceaccount.yaml
  - disaggregatedset.yaml

components:
  - ../../../../../../recipes/modelserver/components/images/tpu-vllm/release-v0.26.0
  - ../../../../../../recipes/modelserver/components/images/routing-sidecar/nightly
