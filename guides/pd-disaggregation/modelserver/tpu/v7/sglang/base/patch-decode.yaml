# gpt-oss-120b decode on one TPU7x 2x2x1 node, the same TP=8 / EP engine as the prefill
# role (see patch-prefill.yaml). The routing sidecar listens on 8000 and forwards to the
# engine on 8200; it also hands the engine the prefill's bootstrap address and the
# per-request bootstrap room, after which the decode pulls the KV pages from the prefill
# over raiden. SGLang disables the radix cache on P/D decode servers by default; add
# --disaggregation-decode-enable-radix-cache to keep one.
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: decode
      spec:
        replicas: 1
        # One pod per TPU node on a fixed-size pool: a surge pod would stay Pending
        # with no node to land on, so roll the decode in place like the prefill.
        rolloutStrategy:
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x2x1
              containers:
                - name: modelserver
                  command: ["python3", "-m", "sglang.launch_server"]
                  args:
                    - --model-path=openai/gpt-oss-120b
                    - --host=0.0.0.0
                    - --port=8200
                    - --device=tpu
                    - --dtype=bfloat16
                    - --attention-backend=pallas_tpu_rpa_v3
                    - --sampling-backend=pytorch
                    - --grammar-backend=none
                    - --tp-size=8
                    - --ep-size=8
                    - --page-size=64
                    - --kv-cache-dtype=fp8_e4m3
                    - --mem-fraction-static=0.35
                    - --max-total-tokens=393216
                    - --max-running-requests=64
                    - --chunked-prefill-size=4096
                    - --max-prefill-tokens=4096
                    - --context-length=9236
                    - --enable-torch-compile
                    - --torch-compile-max-bs=64
                    # The gpt-oss (harmony) parsers, as upstream SGLang's gpt-oss-120b deployment.
                    - --tool-call-parser=gpt-oss
                    - --reasoning-parser=gpt-oss
                    - --skip-server-warmup
                    - --disaggregation-mode=decode
                    - --disaggregation-transfer-backend=raiden
                    # The TPU fused KV pool mirrors into host memory through raiden with the
                    # page_first_fused layout; these select that path for any host-side copy
                    # (retraction backups, and HiCache if it is enabled later).
                    - --hicache-mem-layout=page_first_fused
                    - --hicache-io-backend=raiden
                    - --enable-metrics
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: HF_HOME
                      value: /root/.cache/huggingface
                    - name: SGLANG_PLATFORM
                      value: tpu
                    - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION
                      value: "0"
                    - name: SGLANG_TPU_PRELOAD_TELEMETRY_STUB
                      value: "1"
                    - name: SGLANG_TPU_OVERLAP_PROFILE
                      value: "1"
                    - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
                      value: "1"
                    - name: SGLANG_TPU_FUSED_MOE_SC_GATHER
                      value: "0"
                    - name: SGLANG_RAIDEN_KV_PORT
                      value: "31000"
                    - name: TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS
                      value: "false"
                    - name: LIBTPU_INIT_ARGS
                      value: >-
                        --xla_tpu_enable_async_collective_fusion=true
                        --xla_tpu_overlap_compute_collective_tc=true
                        --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                        --xla_tpu_enable_latency_hiding_scheduler=true
                        --xla_latency_hiding_scheduler_rerun=10
                        --xla_tpu_all_gather_collective_matmul_mode=post_spmd_conservative
                        --xla_tpu_reduce_scatter_collective_matmul_mode=post_spmd_conservative
                        --xla_tpu_enable_sparse_core_collective_offload_all_reduce=false
                        --xla_tpu_offload_gather_to_sparsecore=false
                        --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false
                  ports:
                    - containerPort: 31000
                      name: raiden-kv
                      protocol: TCP
                  resources:
                    requests:
                      cpu: "32"
                      memory: 400Gi
                      google.com/tpu: 4
                    limits:
                      memory: 400Gi
                      google.com/tpu: 4
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /root/.cache
                      name: cache
                    - mountPath: /root/.cache/huggingface
                      name: huggingface-cache
                  startupProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 240
                  livenessProbe:
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 5
                    failureThreshold: 3
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi
                - name: cache
                  emptyDir: {}
                - name: huggingface-cache
                  hostPath:
                    path: /var/cache/huggingface
                    type: DirectoryOrCreate
