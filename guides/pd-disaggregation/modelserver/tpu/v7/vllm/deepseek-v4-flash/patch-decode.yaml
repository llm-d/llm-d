apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-topology: "2x2x1"
        cloud.google.com/gke-tpu-accelerator: "tpu7x"
      containers:
        - name: modelserver
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              exec vllm serve deepseek-ai/DeepSeek-V4-Flash \
                --host 0.0.0.0 \
                --port=8200 \
                --served-model-name=deepseek-ai/DeepSeek-V4-Flash \
                --tensor-parallel-size=1 \
                --data-parallel-size=8 \
                --data-parallel-size-local=8 \
                --enable-expert-parallel \
                --quantization=deepseek_v4_fp8 \
                --kv-cache-dtype=fp8_e4m3 \
                --max-model-len=9216 \
                --max-num-batched-tokens=2048 \
                --max-num-seqs=256 \
                --gpu-memory-utilization=0.90 \
                --async-scheduling \
                --trust-remote-code \
                --kv-transfer-config '{"kv_connector":"TPUConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_consumer","kv_ip":"$(POD_IP)"}' \
                --disable-access-log-for-endpoints=/health,/metrics,/v1/models
          env:
            - name: VLLM_PLUGINS
              value: "torchtpu,torchtpu_layers"
            - name: NEW_MODEL_DESIGN
              value: "1"
            - name: MOE_REQUANTIZE_WEIGHT_DTYPE
              value: "fp4"
            - name: MOE_REQUANTIZE_BLOCK_SIZE
              value: "512"
            - name: TPU_MULTIHOST_BACKEND
              value: "mp"
          resources:
            limits:
              cpu: "96"
              memory: 900Gi
              google.com/tpu: 4
            requests:
              cpu: "96"
              memory: 800Gi
              google.com/tpu: 4
