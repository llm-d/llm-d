# Deployment-based variant of ../base (same Torch TPU Raiden P/D configuration for
# Qwen/Qwen3.5-397B-A17B-FP8 on TPU7x) for clusters without the DisaggregatedSet
# controller. It is not selected by the guide's ACCELERATOR_TYPE; apply it directly:
#   kubectl apply -n ${NAMESPACE} -k guides/pd-disaggregation/modelserver/tpu/v7/vllm/deployment/
# Kept until the DisaggregatedSet overlay in ../base is validated on TPU7x.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../recipes/modelserver/base/single-host/pd/vllm

namePrefix: pd-disaggregation-tpu-vllm-

components:
  - ../../../../../../recipes/modelserver/components/images/routing-sidecar/nightly
  - ../../../../../../recipes/modelserver/components/images/torch-tpu-vllm/release

labels:
  - pairs:
      llm-d.ai/model: Qwen3.5-397B-A17B-FP8
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
      llm-d.ai/backend: torch-tpu
      llm-d.ai/engine-type: vllm
    includeSelectors: true
    includeTemplates: true
patches:
  - path: common-patch-decode.yaml
  - path: common-patch-prefill.yaml
  - path: patch-decode.yaml
  - path: patch-prefill.yaml
