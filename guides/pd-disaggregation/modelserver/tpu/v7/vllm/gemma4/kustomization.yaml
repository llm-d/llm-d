apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../common

namePrefix: pd-disaggregation-tpu-vllm-gemma4-

components:
  - ../../../../../../recipes/modelserver/components/images/torch-tpu-vllm/release

labels:
  - pairs:
      llm-d.ai/model: gemma-4-26B-A4B
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
      llm-d.ai/engine-type: vllm
      llm-d.ai/backend: torch-tpu
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-decode.yaml
  - path: patch-prefill.yaml
