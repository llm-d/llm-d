apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: decode
      spec:
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-topology: "2x2x1"
                cloud.google.com/gke-tpu-accelerator: "tpu7x"
              containers:
                - name: modelserver
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -euo pipefail
                      if [[ "${POD_IP}" == *":"* ]]; then
                        HOST_ADDR="::"
                        export VLLM_HOST_IP="[${POD_IP}]"
                      else
                        HOST_ADDR="0.0.0.0"
                        export VLLM_HOST_IP="${POD_IP}"
                      fi
                      exec vllm serve Qwen/Qwen3.5-397B-A17B-FP8 \
                        --host "${HOST_ADDR}" \
                        --max-model-len=16384 \
                        --max-num-batched-tokens=8192 \
                        --max-num-seqs=64 \
                        --tensor-parallel-size=8 \
                        --enable-expert-parallel \
                        --attention-backend=CUSTOM \
                        --kv-transfer-config '{"kv_connector":"TPUConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_consumer","kv_ip":"$(POD_IP)"}' \
                        --port=8200 \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models
                  resources:
                    limits:
                      cpu: "64"
                      memory: 256Gi
                      google.com/tpu: 4
                    requests:
                      cpu: "64"
                      memory: 256Gi
                      google.com/tpu: 4
