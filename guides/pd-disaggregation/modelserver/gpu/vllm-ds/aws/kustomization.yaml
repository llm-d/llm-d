apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

# ../base already resolves REPLACE_MODEL_SERVER_IMAGE through the
# gpu-vllm/release component, so the aws-efa component's image transform
# cannot rematch the placeholder here. Swap the resolved image instead.
# Keep newName/newTag in sync with
# recipes/modelserver/components/images/gpu-vllm/aws-efa/release.
images:
  - name: docker.io/vllm/vllm-openai
    newName: public.ecr.aws/deep-learning-containers/vllm
    newTag: 0.26.0-gpu-py312-cu130-ubuntu22.04-ec2

# Same provider-specific configuration as the Deployment-based aws overlay
# (../vllm/aws), expressed as JSON patches into the DisaggregatedSet role pod
# templates: roles/0 is prefill, roles/1 is decode.
patches:
  - target:
      kind: DisaggregatedSet
      name: pd-disagg
    patch: |-
      # prefill
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/affinity
        value:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: llm-d.ai/model
                      operator: In
                      values:
                        - gpt-oss-120b
                    - key: llm-d.ai/guide
                      operator: In
                      values:
                        - pd-disaggregation
                topologyKey: topology.kubernetes.io/zone
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      llm-d.ai/role: "decode"
                  topologyKey: "kubernetes.io/hostname"
      - op: replace
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/args
        value:
          - "openai/gpt-oss-120b"
          - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
          - "--tensor-parallel-size=1"
          - "--block-size=128"
          - "--kv-transfer-config"
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config":{"backends":["LIBFABRIC"]}}'
          - "--no-disable-hybrid-kv-cache-manager"
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/securityContext
        value:
          capabilities:
            add:
              - IPC_LOCK
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/limits/vpc.amazonaws.com~1efa
        value: "2"
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/requests/vpc.amazonaws.com~1efa
        value: "2"
      - op: remove
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/limits/cpu
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/nodeSelector
        value:
          node.kubernetes.io/instance-type: p5en.48xlarge
      # decode
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/affinity
        value:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: llm-d.ai/model
                      operator: In
                      values:
                        - gpt-oss-120b
                    - key: llm-d.ai/guide
                      operator: In
                      values:
                        - pd-disaggregation
                topologyKey: topology.kubernetes.io/zone
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      llm-d.ai/role: "prefill"
                  topologyKey: "kubernetes.io/hostname"
      - op: replace
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/args
        value:
          - "openai/gpt-oss-120b"
          - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
          - "--tensor-parallel-size=4"
          - "--block-size=128"
          - "--kv-transfer-config"
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config":{"backends":["LIBFABRIC"]}}'
          - "--no-disable-hybrid-kv-cache-manager"
          - "--port=8200"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/securityContext
        value:
          capabilities:
            add:
              - IPC_LOCK
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/limits/vpc.amazonaws.com~1efa
        value: "8"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/requests/vpc.amazonaws.com~1efa
        value: "8"
      - op: remove
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/limits/cpu
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/nodeSelector
        value:
          node.kubernetes.io/instance-type: p5en.48xlarge
