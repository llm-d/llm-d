apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - gke-rdma-nic-template.yaml

# Same platform-specific configuration as the Deployment-based gke/a4x overlay
# (../../vllm/gke/a4x), expressed as JSON patches into the DisaggregatedSet
# role pod templates on top of the DS gke overlay: roles/0 is prefill, roles/1
# is decode. NICs come from the DRANet gke-rdma-nic-template claims; GPUs are
# re-added as extended resources (managed via the NVIDIA Device Plugin on A4X).
patches:
  - target:
      kind: DisaggregatedSet
      name: pd-disagg
    patch: |-
      # prefill
      - op: replace
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/resourceClaims
        value:
          - name: gke-rdma-claim
            resourceClaimTemplateName: gke-rdma-nic-template
      # A4X requires "kv_buffer_device":"cuda" in kv-transfer-config,
      # gpu-memory-utilization=0.9, and disabling flashinfer autotune
      - op: replace
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/args
        value:
          - "openai/gpt-oss-120b"
          - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
          - "--tensor-parallel-size=1"
          - "--block-size=128"
          - "--kv-transfer-config"
          - '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_buffer_device":"cuda"}'
          - "--no-disable-hybrid-kv-cache-manager"
          - "--gpu-memory-utilization=0.9"
          - "--no-enable-flashinfer-autotune"
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: "1"
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/requests/nvidia.com~1gpu
        value: "1"
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: UCX_TLS
          value: "rc_mlx5,rc,cuda_copy,cuda_ipc,sm,shm,self"
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/securityContext
        value:
          capabilities:
            add: ["IPC_LOCK", "NET_ADMIN"]
      # decode
      - op: replace
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/resourceClaims
        value:
          - name: gke-rdma-claim-0
            resourceClaimTemplateName: gke-rdma-nic-template
          - name: gke-rdma-claim-1
            resourceClaimTemplateName: gke-rdma-nic-template
          - name: gke-rdma-claim-2
            resourceClaimTemplateName: gke-rdma-nic-template
          - name: gke-rdma-claim-3
            resourceClaimTemplateName: gke-rdma-nic-template
      # A4X requires "kv_buffer_device":"cuda" in kv-transfer-config
      - op: replace
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/args
        value:
          - "openai/gpt-oss-120b"
          - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
          - "--tensor-parallel-size=4"
          - "--block-size=128"
          - "--kv-transfer-config"
          - '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_buffer_device":"cuda"}'
          - "--no-disable-hybrid-kv-cache-manager"
          - "--port=8200"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: "4"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/requests/nvidia.com~1gpu
        value: "4"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: UCX_TLS
          value: "rc_mlx5,rc,cuda_copy,cuda_ipc,sm,shm,self"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/securityContext
        value:
          capabilities:
            add: ["IPC_LOCK", "NET_ADMIN"]
