apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: pd-disaggregation
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/engine-type: vllm
    llm-d.ai/model: gpt-oss-120b
spec:
  # Two independent copies of the whole P/D topology. Each slice is a complete
  # 4-prefill + 1-decode set that rolls out and recovers on its own clock.
  # Aggregate capacity matches the Deployment-based variant of this guide:
  # 8 x TP=1 prefill and 2 x TP=4 decode. Changing slices is a pure scale
  # operation and never triggers a rollout of existing slices.
  slices: 2

  # Optionally confine each slice to a single topology domain (rack, NVLink
  # domain, zone, ...) and spread slices across domains, so prefill hands KV
  # cache to decode within the domain. Affinity is injected when a
  # LeaderWorkerSet is created, so enabling this takes effect on the next
  # rollout. ExclusiveTopology additionally guarantees at most one slice per
  # domain across all DisaggregatedSets.
  # NOTE: placementPolicy requires LWS v0.10.0 or newer. See the "Pinning
  # Slices to Accelerator Domains" section of README.ds.md for per-platform
  # topology label keys.
  # placementPolicy:
  #   type: ExclusiveSlice
  #   topology: topology.kubernetes.io/zone

  roles:
    - name: prefill
      spec:
        replicas: 4 # per slice
        rolloutStrategy:
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 1 # single-host: each group is one pod
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: pd-disaggregation
                llm-d.ai/accelerator-variant: gpu
                llm-d.ai/accelerator-vendor: nvidia
                llm-d.ai/engine-type: vllm
                llm-d.ai/model: gpt-oss-120b
                llm-d.ai/role: prefill
            spec:
              serviceAccountName: pd-disagg
              containers:
                - name: modelserver
                  image: REPLACE_MODEL_SERVER_IMAGE
                  command: ["vllm", "serve"]
                  args:
                    - "openai/gpt-oss-120b"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=1"
                    - "--block-size=128"
                    - "--kv-transfer-config"
                    - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
                    - "--no-disable-hybrid-kv-cache-manager"
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    # NOTE: vLLM 0.19.X and 0.20.X images ship both nixl-cu13 and nixl-cu12;
                    # NIXL can pick the wrong UCX libraries. Uncomment UCX_MODULE_DIR only
                    # if you are running a cu129 version of vLLM.
                    # - name: UCX_MODULE_DIR
                    #   value: /usr/local/lib/python3.12/dist-packages/nixl_cu12.libs/ucx
                    # Default vLLM keep-alive (5s) is shorter than llm-d-routing-sidecar's default idle
                    # conn timeout (90s, from Go http.Transport), causing TCP RSTs on reuse.
                    # Server keep-alive must be >= sidecar idle timeout; configured to 120s.
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"
                    # Workaround for https://github.com/vllm-project/vllm/issues/44548,
                    # required with vLLM v0.20.0+ due to torch 2.11. The gpu-vllm images
                    # component injects this into Deployments and LeaderWorkerSets, but its
                    # patch does not target DisaggregatedSet, so it is set inline here.
                    - name: USER
                      value: llm-d
                  ports:
                    - name: modelserver
                      containerPort: 8000
                      protocol: TCP
                    - name: nixl
                      containerPort: 5600
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "8"
                      memory: 16Gi
                      nvidia.com/gpu: "1"
                    requests:
                      cpu: "8"
                      memory: 16Gi
                      nvidia.com/gpu: "1"
                  startupProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.config
                      name: vllm-config
                    - mountPath: /.triton
                      name: triton-cache
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}

    - name: decode
      spec:
        replicas: 1 # per slice
        rolloutStrategy:
          rollingUpdateConfiguration:
            # Surge so a slice never loses its only decode during a rollout.
            # Requires 4 spare GPUs while a slice rolls; set maxSurge: 0 /
            # maxUnavailable: 1 instead on capacity-constrained clusters.
            maxSurge: 1
            maxUnavailable: 0
        leaderWorkerTemplate:
          size: 1 # single-host: each group is one pod
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: pd-disaggregation
                llm-d.ai/accelerator-variant: gpu
                llm-d.ai/accelerator-vendor: nvidia
                llm-d.ai/engine-type: vllm
                llm-d.ai/model: gpt-oss-120b
                llm-d.ai/role: decode
            spec:
              serviceAccountName: pd-disagg
              initContainers:
                - name: routing-proxy
                  image: REPLACE_ROUTING_SIDECAR_IMAGE
                  imagePullPolicy: Always
                  args:
                    - --port=8000
                    - --vllm-port=8200
                    - --kv-connector=nixlv2
                    - --zap-log-level=1
                    - --secure-proxy=false
                  ports:
                    - name: sidecar
                      containerPort: 8000
                      protocol: TCP
                  resources: {}
                  restartPolicy: Always
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
              containers:
                - name: modelserver
                  image: REPLACE_MODEL_SERVER_IMAGE
                  command: ["vllm", "serve"]
                  args:
                    - "openai/gpt-oss-120b"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=4"
                    - "--block-size=128"
                    - "--kv-transfer-config"
                    - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
                    - "--no-disable-hybrid-kv-cache-manager"
                    - "--port=8200"
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    # NOTE: vLLM 0.19.X and 0.20.X images ship both nixl-cu13 and nixl-cu12;
                    # NIXL can pick the wrong UCX libraries. Uncomment UCX_MODULE_DIR only
                    # if you are running a cu129 version of vLLM.
                    # - name: UCX_MODULE_DIR
                    #   value: /usr/local/lib/python3.12/dist-packages/nixl_cu12.libs/ucx
                    # Workaround for https://github.com/vllm-project/vllm/issues/44548,
                    # required with vLLM v0.20.0+ due to torch 2.11. The gpu-vllm images
                    # component injects this into Deployments and LeaderWorkerSets, but its
                    # patch does not target DisaggregatedSet, so it is set inline here.
                    - name: USER
                      value: llm-d
                  ports:
                    - name: modelserver
                      containerPort: 8200
                      protocol: TCP
                    - name: nixl
                      containerPort: 5600
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "16"
                      memory: 64Gi
                      nvidia.com/gpu: "4"
                    requests:
                      cpu: "16"
                      memory: 64Gi
                      nvidia.com/gpu: "4"
                  startupProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
                    - mountPath: /.config
                      name: vllm-config
                    - mountPath: /.triton
                      name: triton-cache
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}
