apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../multi-tier

patches:
  - target:
      group: disaggregatedset.x-k8s.io
      version: v1
      kind: DisaggregatedSet
      name: pd-disagg-vllm
    patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg-vllm
      spec:
        roles:
          - name: prefill
            spec: &rdma
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        securityContext:
                          capabilities:
                            add: [IPC_LOCK, SYS_RAWIO]
                          runAsUser: 0
                          runAsGroup: 0
                        resources:
                          limits:
                            rdma/ib: "1"
                          requests:
                            rdma/ib: "1"
          - name: decode
            spec: *rdma
