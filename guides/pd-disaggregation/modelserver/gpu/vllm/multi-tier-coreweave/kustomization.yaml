apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../multi-tier

patches:
  - target:
      kind: Deployment
      name: prefill
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prefill
      spec:
        template:
          spec:
            containers:
              - name: modelserver
                securityContext:
                  capabilities:
                    add: [IPC_LOCK, SYS_RAWIO]
                  runAsUser: 0
                  runAsGroup: 0
                resources:
                  limits:
                    rdma/ib: "1"
                  requests:
                    rdma/ib: "1"
  - target:
      kind: Deployment
      name: decode
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: decode
      spec:
        template:
          spec:
            containers:
              - name: modelserver
                securityContext:
                  capabilities:
                    add: [IPC_LOCK, SYS_RAWIO]
                  runAsUser: 0
                  runAsGroup: 0
                resources:
                  limits:
                    rdma/ib: "1"
                  requests:
                    rdma/ib: "1"
