apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

components:
  - ../../../../../recipes/modelserver/components/images/gpu-vllm/aws-efa/release
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema

patches:
  - path: patch-decode.yaml
  - path: patch-prefill.yaml
  # EFA devices, no CPU limit, and the p5en instance type.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg-vllm
      spec:
        roles:
          - name: decode
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    nodeSelector:
                      node.kubernetes.io/instance-type: p5en.48xlarge
                    containers:
                      - name: modelserver
                        resources:
                          limits:
                            cpu: null
                            vpc.amazonaws.com/efa: "8"
                          requests:
                            vpc.amazonaws.com/efa: "8"
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    nodeSelector:
                      node.kubernetes.io/instance-type: p5en.48xlarge
                    containers:
                      - name: modelserver
                        resources:
                          limits:
                            cpu: null
                            vpc.amazonaws.com/efa: "2"
                          requests:
                            vpc.amazonaws.com/efa: "2"
