apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
spec:
  replicas: 4
  template:
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: llm-d.ai/model
                    operator: In
                    values:
                      - gpt-oss-120b
                  - key: llm-d.ai/guide
                    operator: In
                    values:
                      - pd-disaggregation
              topologyKey: topology.kubernetes.io/zone
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: llm-d.ai/role
                    operator: In
                    values:
                      - decode
              topologyKey: kubernetes.io/hostname
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "openai/gpt-oss-120b"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=2"
            - "--block-size=128"
            - "--kv-transfer-config"
            - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config":{"backends":["LIBFABRIC"]}}'
            - "--no-disable-hybrid-kv-cache-manager"
            - "--gpu-memory-utilization=0.9"
          resources:
            requests:
              cpu: "32"
              memory: 100Gi
              nvidia.com/gpu: "2"
            limits:
              memory: 100Gi
              nvidia.com/gpu: "2"
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
