apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg-vllm
spec:
  roles:
    - name: decode
      spec:
        replicas: 2
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: modelserver
                  args:
                    - "openai/gpt-oss-120b"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=4"
                    - "--block-size=128"
                    - "--enable-auto-tool-choice"
                    - "--tool-call-parser=openai"
                    - "--reasoning-parser=openai_gptoss"
                    - "--kv-transfer-config"
                    - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"]}}'
                    - "--kv-events-config"
                    - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","topic":"kv@$(POD_IP):8000@openai/gpt-oss-120b"}'
                    - "--no-disable-hybrid-kv-cache-manager"
                    - "--port=8200"
                    - "--shutdown-timeout=45"
                  env:
                    - name: PYTHONHASHSEED
                      value: "0"
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: KV_EVENTS_ENDPOINT
                      value: "tcp://*:5557"
