apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg-vllm
spec:
  roles:
    - name: prefill
      spec:
        replicas: 8
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: modelserver
                  args:
                    - "openai/gpt-oss-120b"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=1"
                    - "--block-size=128"
                    - "--enable-prefix-caching"
                    - "--enable-auto-tool-choice"
                    - "--tool-call-parser=openai"
                    - "--reasoning-parser=openai_gptoss"
                    # Serve /v1/*/render for the EPP token-producer.
                    - "--enable-scale-out"
                    - "--kv-transfer-config"
                    # NIXL remains the prefill-to-decode transport. OffloadingConnector
                    # extends the prefill cache from HBM to CPU memory.
                    - >-
                      {"kv_connector":"MultiConnector","kv_role":"kv_both",
                      "kv_load_failure_policy":"recompute",
                      "kv_connector_extra_config":{"connectors":[
                      {"kv_connector":"NixlConnector","kv_role":"kv_both",
                      "kv_buffer_device":"cuda",
                      "kv_connector_extra_config":{"backends":["UCX"]}},
                      {"kv_connector":"OffloadingConnector","kv_role":"kv_both",
                      "kv_connector_extra_config":{"cpu_bytes_to_use":107374182400,
                      "eviction_policy":"lru"}}]}}
                    - "--kv-events-config"
                    - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","topic":"kv@$(POD_IP):8000@openai/gpt-oss-120b"}'
                    - "--no-disable-hybrid-kv-cache-manager"
                    - "--shutdown-timeout=45"
                  env:
                    - name: PYTHONHASHSEED
                      value: "0"
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: KV_EVENTS_ENDPOINT
                      value: "tcp://*:5557"
                  resources:
                    limits:
                      cpu: "16"
                      memory: 220Gi
                      nvidia.com/gpu: "1"
                    requests:
                      cpu: "8"
                      memory: 160Gi
                      nvidia.com/gpu: "1"
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 120Gi
