apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

components:
  - ../../../../../recipes/modelserver/components/images/gpu-vllm/release
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema

# MultiConnector and the CPU offloading tier are provided by this vLLM release.
# Keep the sidecar on the matching release rather than the base's nightly tag.
images:
  - name: ghcr.io/llm-d/llm-d-router-disagg-sidecar
    newTag: v1.0.0

patches:
  - path: patch-prefill.yaml
  - path: patch-decode.yaml
