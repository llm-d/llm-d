apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    spec:
      initContainers:
        - name: routing-proxy
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar-dev:main
          args:
            - --port=8000
            - --connector=mooncake
            - --zap-log-level=1
            - --secure-proxy=false
