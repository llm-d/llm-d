# P/D on CoreWeave with the Mooncake connector over RDMA instead of NIXL. Two slices of
# 4 x TP=1 prefill and 1 x TP=4 decode, 8 prefill and 2 decode in total.
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg-vllm-mooncake
  labels:
    inference.networking.k8s.io/engine-type: vllm
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/guide: pd-disaggregation
    llm-d.ai/model: gpt-oss-120b
    llm-d.ai/inference-serving: "true"
spec:
  slices: 2
  roles:
    - name: prefill
      spec:
        replicas: 4
        groupIdentity: Hash
        rolloutStrategy:
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels:
                inference.networking.k8s.io/engine-type: vllm
                llm-d.ai/accelerator-variant: gpu
                llm-d.ai/accelerator-vendor: nvidia
                llm-d.ai/guide: pd-disaggregation
                llm-d.ai/model: gpt-oss-120b
                llm-d.ai/role: prefill
                llm-d.ai/inference-serving: "true"
            spec:
              serviceAccountName: pd-disagg-vllm-mooncake
              containers:
                - name: modelserver
                  image: REPLACE_MODEL_SERVER_IMAGE
                  command:
                    - /bin/bash
                    - -c
                  args:
                    - |
                      pip install mooncake-transfer-engine-cuda13 && \
                      vllm serve openai/gpt-oss-120b \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --tensor-parallel-size=1 \
                        --block-size=128 \
                        --enable-auto-tool-choice \
                        --tool-call-parser=openai \
                        --reasoning-parser=openai_gptoss \
                        --kv-transfer-config '{"kv_connector":"MooncakeConnector", "kv_role":"kv_producer", "kv_connector_extra_config":{"mooncake_protocol":"rdma"}}' \
                        --gpu-memory-utilization=0.9 \
                        --port 8000
                  env:
                    - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
                      value: "8998"
                  ports:
                    - containerPort: 8000
                      name: modelserver
                      protocol: TCP
                    - containerPort: 5600
                      name: nixl
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "8"
                      memory: 16Gi
                      nvidia.com/gpu: "1"
                      rdma/ib: "1"
                    requests:
                      cpu: "8"
                      memory: 16Gi
                      nvidia.com/gpu: "1"
                      rdma/ib: "1"
                  startupProbe:
                    failureThreshold: 120
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                  livenessProbe:
                    failureThreshold: 3
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                  readinessProbe:
                    failureThreshold: 3
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
              volumes:
                - emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
                  name: shm
                - emptyDir: {}
                  name: torch-compile-cache
    - name: decode
      spec:
        replicas: 1
        groupIdentity: Hash
        rolloutStrategy:
          rollingUpdateConfiguration:
            maxSurge: 1
            maxUnavailable: 0
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels:
                inference.networking.k8s.io/engine-type: vllm
                llm-d.ai/accelerator-variant: gpu
                llm-d.ai/accelerator-vendor: nvidia
                llm-d.ai/guide: pd-disaggregation
                llm-d.ai/model: gpt-oss-120b
                llm-d.ai/role: decode
                llm-d.ai/inference-serving: "true"
            spec:
              serviceAccountName: pd-disagg-vllm-mooncake
              initContainers:
                - name: routing-proxy
                  image: REPLACE_ROUTING_SIDECAR_IMAGE
                  imagePullPolicy: Always
                  args:
                    - --port=8000
                    - --kv-connector=mooncake
                    - --zap-log-level=1
                    - --secure-serving=false
                  ports:
                    - containerPort: 8000
                      name: sidecar
                      protocol: TCP
                  resources: {}
                  restartPolicy: Always
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
              containers:
                - name: modelserver
                  image: REPLACE_MODEL_SERVER_IMAGE
                  command:
                    - /bin/bash
                    - -c
                  args:
                    - |
                      pip install mooncake-transfer-engine-cuda13 && \
                      vllm serve openai/gpt-oss-120b \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --tensor-parallel-size=4 \
                        --block-size=128 \
                        --enable-auto-tool-choice \
                        --tool-call-parser=openai \
                        --reasoning-parser=openai_gptoss \
                        --kv-transfer-config '{"kv_connector":"MooncakeConnector", "kv_role":"kv_consumer", "kv_connector_extra_config":{"mooncake_protocol":"rdma"}}' \
                        --port=8200
                  env:
                    - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
                      value: "8998"
                  ports:
                    - containerPort: 8200
                      name: modelserver
                      protocol: TCP
                    - containerPort: 5600
                      name: nixl
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "16"
                      memory: 64Gi
                      nvidia.com/gpu: "4"
                      rdma/ib: "1"
                    requests:
                      cpu: "16"
                      memory: 64Gi
                      nvidia.com/gpu: "4"
                      rdma/ib: "1"
                  startupProbe:
                    failureThreshold: 120
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                  livenessProbe:
                    failureThreshold: 3
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                  readinessProbe:
                    failureThreshold: 3
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
                    - mountPath: /.cache
                      name: torch-compile-cache
              volumes:
                - emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
                  name: shm
                - emptyDir: {}
                  name: torch-compile-cache
