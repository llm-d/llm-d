apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/pd/vllm

namePrefix: pd-disaggregation-nvidia-gpu-vllm-

# NOTE: the model server image component is intentionally not set here.
# Each overlay sets its own (e.g. gpu-vllm/release, gpu-vllm/aws-efa) because
# kustomize resolves component image transforms at the base level, preventing
# overlays from overriding the resolved image name with a different component.
components:
  - ../../../../../recipes/modelserver/components/images/routing-sidecar/nightly

labels:
  - pairs:
      llm-d.ai/model: gpt-oss-120b
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: vllm
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-decode.yaml
  - path: patch-prefill.yaml
