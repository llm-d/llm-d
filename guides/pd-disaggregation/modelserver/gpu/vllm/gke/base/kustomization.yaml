apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../../../../../recipes/modelserver/components/images/gpu-vllm/release
  - ../../../../components/gke-rdma

# The schema teaches kustomize the DisaggregatedSet merge keys, so strategic merge
# patches match roles, containers, env, and volumes by key instead of by index.
openapi:
  path: disaggregatedset-schema.json

patches:
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg-vllm
      spec:
        roles:
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    tolerations:
                      - key: nvidia.com/gpu
                        operator: Exists
                        effect: NoSchedule
                      - key: kubernetes.io/arch
                        operator: Exists
                        effect: NoSchedule
                    resourceClaims:
                      - name: gke-rdma-claim
                        resourceClaimTemplateName: gke-rdma-template
                    containers:
                      - name: modelserver
                        env:
                          # Disable GKE's built-in NCCL tuner plugin, as the
                          # disable-gke-nccl-tuner-patch component does for Deployment/LWS.
                          - name: NCCL_TUNER_PLUGIN
                            value: "none"
                          - name: UCX_IB_ROCE_REACHABILITY_MODE
                            value: "all"
                          - name: HF_HOME
                            value: /root/.cache/huggingface
                          - name: HF_HUB_DOWNLOAD_TIMEOUT
                            value: "60"
                          # Xet CDN rate-limits concurrent downloads (429) when all pods pull the model at once
                          - name: HF_HUB_DISABLE_XET
                            value: "1"
                        resources:
                          # GPUs are allocated through the claims below.
                          limits:
                            nvidia.com/gpu: null
                          requests:
                            nvidia.com/gpu: null
                          claims:
                            - name: gke-rdma-claim
                        volumeMounts:
                          # Node-local HuggingFace cache shared across pods and restarts
                          - mountPath: /root/.cache/huggingface
                            name: huggingface-cache
                    volumes:
                      - name: huggingface-cache
                        hostPath:
                          path: /var/cache/huggingface
                          type: DirectoryOrCreate
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg-vllm
      spec:
        roles:
          - name: decode
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    tolerations:
                      - key: nvidia.com/gpu
                        operator: Exists
                        effect: NoSchedule
                      - key: kubernetes.io/arch
                        operator: Exists
                        effect: NoSchedule
                    resourceClaims:
                      - name: gke-rdma-claim-0
                        resourceClaimTemplateName: gke-rdma-template
                      - name: gke-rdma-claim-1
                        resourceClaimTemplateName: gke-rdma-template
                      - name: gke-rdma-claim-2
                        resourceClaimTemplateName: gke-rdma-template
                      - name: gke-rdma-claim-3
                        resourceClaimTemplateName: gke-rdma-template
                    containers:
                      - name: modelserver
                        env:
                          # Disable GKE's built-in NCCL tuner plugin, as the
                          # disable-gke-nccl-tuner-patch component does for Deployment/LWS.
                          - name: NCCL_TUNER_PLUGIN
                            value: "none"
                          - name: UCX_IB_ROCE_REACHABILITY_MODE
                            value: "all"
                          - name: HF_HOME
                            value: /root/.cache/huggingface
                          - name: HF_HUB_DOWNLOAD_TIMEOUT
                            value: "60"
                          # Xet CDN rate-limits concurrent downloads (429) when all pods pull the model at once
                          - name: HF_HUB_DISABLE_XET
                            value: "1"
                        resources:
                          # GPUs are allocated through the claims below.
                          limits:
                            nvidia.com/gpu: null
                          requests:
                            nvidia.com/gpu: null
                          claims:
                            - name: gke-rdma-claim-0
                            - name: gke-rdma-claim-1
                            - name: gke-rdma-claim-2
                            - name: gke-rdma-claim-3
                        volumeMounts:
                          # Node-local HuggingFace cache shared across pods and restarts
                          - mountPath: /root/.cache/huggingface
                            name: huggingface-cache
                    volumes:
                      - name: huggingface-cache
                        hostPath:
                          path: /var/cache/huggingface
                          type: DirectoryOrCreate
