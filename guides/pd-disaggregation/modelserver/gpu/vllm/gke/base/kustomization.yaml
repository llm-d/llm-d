apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../../../../../recipes/modelserver/components/images/gpu-vllm/release
  - ../../../../../../recipes/modelserver/components/disaggregatedset-schema
  - ../../../../components/gke-rdma
  - ../../../../../../recipes/modelserver/components/hf-node-cache

patches:
  # Settings shared by both roles, written once under prefill and aliased into decode.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg-vllm
      spec:
        roles:
          - name: prefill
            spec: &gke-common
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    tolerations:
                      - key: nvidia.com/gpu
                        operator: Exists
                        effect: NoSchedule
                      - key: kubernetes.io/arch
                        operator: Exists
                        effect: NoSchedule
                    containers:
                      - name: modelserver
                        env:
                          # Disable GKE's built-in NCCL tuner plugin, as the
                          # disable-gke-nccl-tuner-patch component does for Deployment/LWS.
                          - name: NCCL_TUNER_PLUGIN
                            value: "none"
                          - name: UCX_IB_ROCE_REACHABILITY_MODE
                            value: "all"
                        resources:
                          # GPUs are allocated through the DRA claims below.
                          limits:
                            nvidia.com/gpu: null
                          requests:
                            nvidia.com/gpu: null
          - name: decode
            spec: *gke-common
  # One GPU+NIC claim per rank: prefill runs TP=1, decode TP=4.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg-vllm
      spec:
        roles:
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    resourceClaims:
                      - name: gke-rdma-claim
                        resourceClaimTemplateName: gke-rdma-template
                    containers:
                      - name: modelserver
                        resources:
                          claims:
                            - name: gke-rdma-claim
          - name: decode
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    resourceClaims:
                      - name: gke-rdma-claim-0
                        resourceClaimTemplateName: gke-rdma-template
                      - name: gke-rdma-claim-1
                        resourceClaimTemplateName: gke-rdma-template
                      - name: gke-rdma-claim-2
                        resourceClaimTemplateName: gke-rdma-template
                      - name: gke-rdma-claim-3
                        resourceClaimTemplateName: gke-rdma-template
                    containers:
                      - name: modelserver
                        resources:
                          claims:
                            - name: gke-rdma-claim-0
                            - name: gke-rdma-claim-1
                            - name: gke-rdma-claim-2
                            - name: gke-rdma-claim-3
