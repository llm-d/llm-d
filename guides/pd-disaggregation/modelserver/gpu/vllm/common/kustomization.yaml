apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Model servers on NVIDIA GPU with vLLM, shared by both P/D guides: a prefill
# and a decode role in one DisaggregatedSet, with no routing sidecar. ../base
# adds the routing sidecar for the sidecar guide; the Coordinator guide
# (guides/pd-disaggregation/coord/modelserver/gpu/vllm) builds on this directly.
resources:
  - serviceaccount.yaml
  - disaggregatedset.yaml

# NOTE: the model server image component is intentionally not set here.
# Each overlay sets its own (e.g. gpu-vllm/release, gpu-vllm/aws-efa) because
# kustomize resolves component image transforms at the base level, preventing
# overlays from overriding the resolved image name with a different component.
components:
  - ../../../../../recipes/modelserver/components/graceful-shutdown
