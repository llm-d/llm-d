apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

components:
  - ../../../../../recipes/modelserver/components/images/gpu-vllm/release
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema

patches:
  # Both roles get the same settings: written once under prefill and aliased into decode.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg-vllm
      spec:
        roles:
          - name: prefill
            spec: &coreweave
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: modelserver
                        resources:
                          limits:
                            rdma/ib: "1"
                          requests:
                            rdma/ib: "1"
                        env:
                          - name: HF_HOME
                            value: /root/.cache/huggingface
                          - name: HF_HUB_DOWNLOAD_TIMEOUT
                            value: "60"
                          # Xet CDN rate-limits concurrent downloads (429) when all pods pull the model at once
                          - name: HF_HUB_DISABLE_XET
                            value: "1"
                        volumeMounts:
                          # HuggingFace cache shared across pods and restarts
                          - mountPath: /root/.cache/huggingface
                            name: huggingface-cache
                    volumes:
                      # Model weights on an RWX PVC rather than a node-local hostPath:
                      # CoreWeave's /var/cache/huggingface is a 15 GB ramdisk, far too
                      # small for the model weights. Requires the `model-pvc` PVC in the
                      # namespace and an RWX default StorageClass -- see
                      # docs/infrastructure/providers/coreweave/README.md.
                      - name: huggingface-cache
                        persistentVolumeClaim:
                          claimName: model-pvc
          - name: decode
            spec: *coreweave
