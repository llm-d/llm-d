apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

# TODO(#1894): Align AWS ECR sglang version with centralized gpu-sglang (v0.5.13.post1).
images:
  - name: docker.io/lmsysorg/sglang
    newName: 763104351884.dkr.ecr.us-east-1.amazonaws.com/sglang
    newTag: 0.5.12-gpu-py312-cu130-ubuntu24.04-ec2

components:
  - ../../../../../recipes/modelserver/components/disaggregatedset-schema

patches:
  - path: patch-decode.yaml
  - path: patch-prefill.yaml
  # EFA devices, no CPU limit, and the p5en instance type.
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: pd-disagg-sglang
      spec:
        roles:
          - name: decode
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    nodeSelector:
                      node.kubernetes.io/instance-type: p5en.48xlarge
                    containers:
                      - name: modelserver
                        resources:
                          limits:
                            cpu: null
                            vpc.amazonaws.com/efa: "8"
                          requests:
                            vpc.amazonaws.com/efa: "8"
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    nodeSelector:
                      node.kubernetes.io/instance-type: p5en.48xlarge
                    containers:
                      - name: modelserver
                        resources:
                          limits:
                            cpu: null
                            vpc.amazonaws.com/efa: "8"
                          requests:
                            vpc.amazonaws.com/efa: "8"
