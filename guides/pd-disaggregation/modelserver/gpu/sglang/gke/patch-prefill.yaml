# GKE overlay patch for SGLang prefill deployment.
# Extends base/patch-prefill.yaml with GKE-specific DRA RDMA claims, UCX networking, and persistent HuggingFace cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
spec:
  template:
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Request 1 GKE DRA RDMA claim (1 GPU + 1 rail-aligned NIC) to match the
      # prefill server's --tensor-parallel-size=1
      resourceClaims:
        - name: gke-rdma-claim
          resourceClaimTemplateName: gke-rdma-template
      containers:
        - name: modelserver
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "60"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            # Enable RoCE reachability across all subnet interfaces
            - name: UCX_IB_ROCE_REACHABILITY_MODE
              value: "all"
          resources:
            limits:
              cpu: "64"
              memory: "512Gi"
            requests:
              cpu: "32"
              memory: "128Gi"
            # Bind the GKE DRA claim to the modelserver container
            claims:
              - name: gke-rdma-claim
          volumeMounts:
            # Mount a persistent volume for huggingface cache, so that the cache is shared across restarts
            - mountPath: /root/.cache/huggingface
              name: huggingface-cache
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 240
            httpGet:
              path: /v1/models
              port: modelserver
      volumes:
        - name: huggingface-cache
          hostPath:
            path: /var/cache/huggingface
            type: DirectoryOrCreate
