# GKE overlay patch for SGLang decode deployment.
# Extends base/patch-decode.yaml with GKE-specific DRA RDMA claims, UCX networking, and persistent HuggingFace cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Request 2 GKE DRA RDMA claims for PCIe root switch rail-aligned RoCE inter-pod transfer
      resourceClaims:
        - name: gke-rdma-claim-0
          resourceClaimTemplateName: gke-rdma-template
        - name: gke-rdma-claim-1
          resourceClaimTemplateName: gke-rdma-template
      containers:
        - name: modelserver
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "60"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            # The base patches enable the KV staging buffer for heterogeneous TP.
            # This overlay runs homogeneous TP=2 (#2442), and SGLang's NIXL
            # transfer backend does not accept the staging path's
            # slot_layer_ids argument (TypeError in NixlKVManager.set_kv_buffer_tensors
            # on v0.5.19 and v0.5.20), so turn staging off here.
            - name: SGLANG_DISAGG_STAGING_BUFFER
              value: "0"
            # UCX and RoCE configurations for GKE Container-Optimized OS
            - name: UCX_IB_ROCE_REACHABILITY_MODE
              value: "all"
            - name: UCX_CUDA_COPY_DMABUF
              value: "y"
            - name: UCX_MEMTYPE_CACHE
              value: "n"
            - name: UCX_IB_PCI_RELAXED_ORDERING
              value: "y"
            - name: UCX_IB_GID_INDEX
              value: "3"
            # Keep tcp in the list: on GKE node pools without RDMA NICs (for example
            # A3 High), rc_mlx5/rc are unavailable and NIXL's UCX backend fails with
            # "no active messages transport" unless UCX can fall back to tcp.
            - name: UCX_TLS
              value: "rc_mlx5,rc,tcp,cuda_copy,cuda_ipc,sm,shm,self"
            # Each gke-rdma claim adds a NIC (eth1, eth2, ...) on its own subnet.
            # On node pools without RoCE those subnets do not route TCP between
            # pods, but UCX's tcp transport advertises every interface, so the
            # prefill side dials one of the decode pod's secondary addresses and
            # the KV transfer hangs until the request times out ("UCX ERROR
            # connect(...) failed: Connection timed out"). Pin UCX to the pod
            # network. Remove this on a RoCE-capable pool to let UCX use the
            # RDMA devices again.
            - name: UCX_NET_DEVICES
              value: "eth0"
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          resources:
            limits:
              cpu: "64"
              memory: "512Gi"
            requests:
              cpu: "32"
              memory: "128Gi"
            # Bind the 2 GKE DRA claims to the modelserver container
            claims:
              - name: gke-rdma-claim-0
              - name: gke-rdma-claim-1
          volumeMounts:
            # Mount a persistent volume for huggingface cache, so that the cache is shared across restarts
            - mountPath: /root/.cache/huggingface
              name: huggingface-cache
      volumes:
        - name: huggingface-cache
          hostPath:
            path: /var/cache/huggingface
            type: DirectoryOrCreate
