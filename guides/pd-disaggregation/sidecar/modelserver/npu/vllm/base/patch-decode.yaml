apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg
spec:
  roles:
    - name: decode
      spec:
        replicas: 1
        # A rolling update keeps the old and the new pod of a replica both holding a
        # claim, so neither becomes ready where there is no spare accelerator.
        rolloutStrategy:
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              # The two roles want separate nodes when the cluster has them, and still
              # co-locate on a single-node cluster because this is only a preference.
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        topologyKey: kubernetes.io/hostname
                        labelSelector:
                          matchLabels:
                            llm-d.ai/guide: pd-disaggregation
              securityContext:
                runAsUser: 2000
                runAsGroup: 0
                fsGroup: 1600
              initContainers:
                - name: routing-proxy
                  args:
                    # The proxy listens on [port, port+data-parallel-size-1] and forwards each
                    # to the vLLM rank on the matching port, so the EPP addresses a rank directly.
                    - --port=8000
                    - --data-parallel-size=4
                    - --kv-connector=nixlv2
                    - --zap-log-level=1
                    - --secure-proxy=false
                  ports:
                    - containerPort: 8000
                      name: sidecar
                      protocol: TCP
                    - containerPort: 8001
                      name: sidecar-rank1
                      protocol: TCP
                    - containerPort: 8002
                      name: sidecar-rank2
                      protocol: TCP
                    - containerPort: 8003
                      name: sidecar-rank3
                      protocol: TCP
              containers:
                - name: modelserver
                  # vLLM runs one API server per data-parallel rank and hands rank i its own
                  # device, so the pod needs no per-rank launcher: --data-parallel-size-local
                  # keeps all four ranks here and the external load balancer mode gives each one
                  # a port from --port upward, which is what the sidecar and the EPP address.
                  command: ["vllm", "serve"]
                  args:
                    - "MiniMaxAI/MiniMax-M2.7"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--port=8200"
                    - "--data-parallel-size=4"
                    - "--data-parallel-size-local=4"
                    - "--data-parallel-multi-port-external-lb"
                    - "--enable-expert-parallel"
                    - "--block-size=4096"
                    - "--max-num-batched-tokens=512"
                    - "--kv-cache-dtype=fp8"
                    # Both roles must hash blocks alike, or decode cannot reuse the prefix cache prefill sends over NIXL;
                    # sha256_cbor is the one that matches LMCache's hash.
                    - "--prefix-caching-hash-algo=sha256_cbor"
                    # Prefetching shortens the weight load.
                    - "--safetensors-load-strategy=prefetch"
                    - "--enable-auto-tool-choice"
                    - "--tool-call-parser=minimax_m2"
                    - "--reasoning-parser=minimax_m2"
                    - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true,"enable_in_reasoning":true}'
                    - "--max-num-seqs=4"
                    - '--kv-transfer-config={"kv_connector":"RblnNixlConnector","kv_role":"kv_both","kv_buffer_device":"rbln","kv_connector_extra_config":{"name":"nixl"}}'
                  ports:
                    - containerPort: 8200
                      name: modelserver
                      protocol: TCP
                    - containerPort: 8201
                      name: rank1
                      protocol: TCP
                    - containerPort: 8202
                      name: rank2
                      protocol: TCP
                    - containerPort: 8203
                      name: rank3
                      protocol: TCP
                    - containerPort: 5600
                      name: nixl
                      protocol: TCP
                    - containerPort: 5601
                      name: nixl-rank1
                      protocol: TCP
                    - containerPort: 5602
                      name: nixl-rank2
                      protocol: TCP
                    - containerPort: 5603
                      name: nixl-rank3
                      protocol: TCP
                  env:
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: VLLM_CACHE_ROOT
                      value: /workspace/.cache
                    # Unreachable in practice: the startupProbe budget below is 7215s.
                    - name: VLLM_ENGINE_READY_TIMEOUT_S
                      value: "9600"
                    - name: VLLM_RPC_TIMEOUT
                      value: "1800000"
                  resources:
                    # Anonymous memory measured 34Gi for this role once serving; the rest of the
                    # limit is headroom for the page cache the model read charges to the cgroup.
                    # Keep cpu even — a node with an SMT-aligned static CPU manager rejects odd
                    # counts.
                    limits:
                      cpu: "40"
                      memory: 460Gi
                    requests:
                      cpu: "40"
                      memory: 460Gi
                    claims:
                      - name: npu-decode-claim
                  volumeMounts:
                    - mountPath: /workspace/.cache
                      name: rbln-compile-cache
                    - mountPath: /dev/shm
                      name: shm
                  # 15 + 30x240 = 7215s, the same 240 checks the vendor's own reference
                  # deployment allows. Measured on one node this role reached ready well
                  # inside that, but only with the weights already cached; a first start
                  # also pulls them, and the compile cache is an emptyDir so every restart
                  # recompiles from zero.
                  startupProbe:
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 240
                  livenessProbe:
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  # The base probes the rank-0 port alone, which would mark the pod ready while
                  # the other three ranks are still starting and let the sidecar forward to them.
                  readinessProbe:
                    httpGet: null
                    exec:
                      command:
                        - /bin/sh
                        - -c
                        - 'for p in 8200 8201 8202 8203; do curl -fsS -o /dev/null --max-time 2 "http://127.0.0.1:${p}/v1/models" || exit 1; done'
                    periodSeconds: 5
                    timeoutSeconds: 10
                    failureThreshold: 3
              resourceClaims:
                - name: npu-decode-claim
                  resourceClaimTemplateName: npu-decode-claim
              volumes:
                - name: rbln-compile-cache
                  emptyDir: {}
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
