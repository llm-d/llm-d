# Example values file for SLO-aware PD disaggregation routing
# This file demonstrates how to enable SLO prediction with prefill-decode disaggregation

inferenceExtension:
  replicas: 1
  image:
    name: llm-d-inference-scheduler
    hub: quay.io/rh_ee_rsaini
    tag: slo-experimental
    pullPolicy: Always
  extProcPort: 9002
  pluginsConfigFile: "pd-slo-config.yaml"

  # Enable secure serving and logging flags
  flags:
    secure-serving: false
    v: 4

  # NOTE: Environment variables (PREFILL_TRAINING_URL, PREFILL_PREDICTION_URL, etc.)
  # are automatically generated by the chart when latencyPredictor.pdMode.enabled=true
  # No manual env configuration needed!

  # Custom plugins configuration for PD-SLO scheduling
  pluginsCustomConfig:
    pd-slo-config.yaml: |
      # PD DISAGGREGATION WITH SLO-AWARE ROUTING
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
      # Filters
      - type: prefill-filter
        name: prefill-filter
      - type: decode-filter
        name: decode-filter

      # Scorers
      - type: prefix-cache-scorer
        name: prefix-cache-scorer
        parameters:
          hashBlockSize: 5
          maxPrefixBlocksToMatch: 256
          lruCapacityPerServer: 31250

      # NEW: PD-SLO Optimizer (independent optimization with trained predictors)
      - type: pd-slo-optimizer
        name: pd-slo-optimizer
        parameters:
          sloBufferFactor: 0.9

      # Picker
      - type: max-score-picker
        name: max-score-picker

      # NEW: PD-SLO Profile Handler (unified handler with fallback)
      - type: pd-slo-profile-handler
        name: pd-slo-profile-handler
        parameters:
          decodeProfile: "decode"
          prefillProfile: "prefill"
          prefixPluginName: "prefix-cache-scorer"
          hashBlockSize: 5
          pdThreshold: 5  # Skip prefill for requests with < 5 non-cached tokens (good for testing both paths)

      schedulingProfiles:
      - name: prefill
        plugins:
        - pluginRef: prefill-filter
        - pluginRef: prefix-cache-scorer
          weight: 2
        - pluginRef: pd-slo-optimizer  # Independent prefill optimization
          weight: 3
        - pluginRef: max-score-picker

      - name: decode
        plugins:
        - pluginRef: decode-filter
        - pluginRef: prefix-cache-scorer
          weight: 2
        - pluginRef: pd-slo-optimizer  # Independent decode optimization
          weight: 3
        - pluginRef: max-score-picker

  # Monitoring configuration for EPP
  monitoring:
    interval: "10s"
    # Service account token secret for authentication
    secret:
      name: pd-gateway-sa-metrics-reader-secret
    # Prometheus ServiceMonitor will be created when enabled for EPP metrics collection
    prometheus:
      enabled: true

  # Enable PD-SLO latency predictors (2 separate predictors: prefill + decode)
  latencyPredictor:
    enabled: true

    # Enable PD Mode for disaggregated scheduling
    pdMode:
      enabled: true
      predictors:
        # Prefill predictor: Predicts TTFT for prefill pods
        prefill:
          trainingServer:
            port: 8000
            image:
              hub: quay.io/rh_ee_rsaini
              name: latency-training
              tag: slo-experimental
              pullPolicy: Always
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "1000m"
                memory: "2Gi"
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8000
              initialDelaySeconds: 30
              periodSeconds: 20
            readinessProbe:
              httpGet:
                path: /readyz
                port: 8000
              initialDelaySeconds: 45
              periodSeconds: 10
            volumeSize: "20Gi"
            config:
              LATENCY_RETRAINING_INTERVAL_SEC: "1"
              LATENCY_MIN_SAMPLES_FOR_RETRAIN: "100"
              LATENCY_TTFT_MODEL_PATH: "/models/ttft.joblib"
              LATENCY_TPOT_MODEL_PATH: "/models/tpot.joblib"
              LATENCY_TTFT_SCALER_PATH: "/models/ttft_scaler.joblib"
              LATENCY_TPOT_SCALER_PATH: "/models/tpot_scaler.joblib"
              LATENCY_MODEL_TYPE: "xgboost"
              LATENCY_MAX_TRAINING_DATA_SIZE_PER_BUCKET: "5000"
              LATENCY_QUANTILE_ALPHA: "0.9"
          predictionServers:
            count: 1
            startPort: 8001
            image:
              hub: quay.io/rh_ee_rsaini
              name: latency-prediction
              tag: slo-experimental
              pullPolicy: Always
            resources:
              requests:
                cpu: "250m"
                memory: "512Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"
            livenessProbe:
              httpGet:
                path: /healthz
              initialDelaySeconds: 15
              periodSeconds: 15
            readinessProbe:
              httpGet:
                path: /readyz
              initialDelaySeconds: 10
              periodSeconds: 5
              failureThreshold: 10
            volumeSize: "10Gi"
            config:
              LATENCY_MODEL_TYPE: "xgboost"
              PREDICT_HOST: "0.0.0.0"
              LOCAL_TTFT_MODEL_PATH: "/server_models/ttft.joblib"
              LOCAL_TPOT_MODEL_PATH: "/server_models/tpot.joblib"
              LOCAL_TTFT_SCALER_PATH: "/server_models/ttft_scaler.joblib"
              LOCAL_TPOT_SCALER_PATH: "/server_models/tpot_scaler.joblib"

        # Decode predictor: Predicts TTFT + TPOT for decode pods
        decode:
          trainingServer:
            port: 8010
            image:
              hub: quay.io/rh_ee_rsaini
              name: latency-training
              tag: slo-experimental
              pullPolicy: Always
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "1000m"
                memory: "2Gi"
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8010
              initialDelaySeconds: 30
              periodSeconds: 20
            readinessProbe:
              httpGet:
                path: /readyz
                port: 8010
              initialDelaySeconds: 45
              periodSeconds: 10
            volumeSize: "20Gi"
            config:
              LATENCY_RETRAINING_INTERVAL_SEC: "1"
              LATENCY_MIN_SAMPLES_FOR_RETRAIN: "100"
              LATENCY_TTFT_MODEL_PATH: "/models/ttft.joblib"
              LATENCY_TPOT_MODEL_PATH: "/models/tpot.joblib"
              LATENCY_TTFT_SCALER_PATH: "/models/ttft_scaler.joblib"
              LATENCY_TPOT_SCALER_PATH: "/models/tpot_scaler.joblib"
              LATENCY_MODEL_TYPE: "xgboost"
              LATENCY_MAX_TRAINING_DATA_SIZE_PER_BUCKET: "5000"
              LATENCY_QUANTILE_ALPHA: "0.9"
          predictionServers:
            count: 1
            startPort: 8011
            image:
              hub: quay.io/rh_ee_rsaini
              name: latency-prediction
              tag: slo-experimental
              pullPolicy: Always
            resources:
              requests:
                cpu: "250m"
                memory: "512Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"
            livenessProbe:
              httpGet:
                path: /healthz
              initialDelaySeconds: 15
              periodSeconds: 15
            readinessProbe:
              httpGet:
                path: /readyz
              initialDelaySeconds: 10
              periodSeconds: 5
              failureThreshold: 10
            volumeSize: "10Gi"
            config:
              LATENCY_MODEL_TYPE: "xgboost"
              PREDICT_HOST: "0.0.0.0"
              LOCAL_TTFT_MODEL_PATH: "/server_models/ttft.joblib"
              LOCAL_TPOT_MODEL_PATH: "/server_models/tpot.joblib"
              LOCAL_TTFT_SCALER_PATH: "/server_models/ttft_scaler.joblib"
              LOCAL_TPOT_SCALER_PATH: "/server_models/tpot_scaler.joblib"

inferencePool:
  apiVersion: inference.networking.x-k8s.io/v1alpha2 # use old API version for inference
  targetPortNumber: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inferenceServing: "true"
