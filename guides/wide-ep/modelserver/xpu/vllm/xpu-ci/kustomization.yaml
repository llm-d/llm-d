apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CI has no RDMA-capable network, so avoid cross-pod wide EP as a CI workaround.
# Run two independent DeepSeek-V2-Lite-Chat replicas, each using TP2 and EP2.
resources:
  - ../base

labels:
  - pairs:
      llm-d.ai/model: DeepSeek-V2-Lite-Chat
    includeSelectors: true
    includeTemplates: true

patches:
  - target:
      group: resource.k8s.io
      version: v1
      kind: ResourceClaimTemplate
      name: xpu-qwen3-235b-claim
    path: patch-xpu-ci-claim.yaml
  - target:
      group: leaderworkerset.x-k8s.io
      version: v1
      kind: LeaderWorkerSet
      name: wide-ep-xpu-qwen3-235b
    path: patch-xpu-ci-lws.yaml