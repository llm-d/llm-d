# Single DisaggregatedSet managing prefill and decode roles.
# Requires LWS v0.10.0+ with the DisaggregatedSet CRD and controller installed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../recipes/modelserver/common
  - disaggregatedset.yaml
  - resource-claim-templates.yaml

components:
  - ../../../../recipes/modelserver/components/images/xpu-vllm/llm-d
  - ../../../../recipes/modelserver/components/images/routing-sidecar/nightly

labels:
  - pairs:
      llm-d.ai/model: DeepSeek-V2-Lite-Chat
      llm-d.ai/guide: wide-ep
      llm-d.ai/accelerator-variant: xpu
      llm-d.ai/accelerator-vendor: intel
      llm-d.ai/engine-type: vllm
    fields:
      - version: v1
        kind: ServiceAccount
        path: metadata/labels
        create: true
