apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

# The schema teaches kustomize the PodCliqueSet merge keys so the
# strategic merge patch below matches cliques, containers, volumes, and env
# entries by name instead of array index.
openapi:
  path: podcliqueset-schema.json

# CoreWeave-specific configuration: provider hostPath cache volumes,
# InfiniBand HCA selection, and RDMA device limits on both cliques. Mirrors
# ../../coreweave, the DisaggregatedSet overlay; keep the two in sync.
patches:
  - patch: |-
      apiVersion: grove.io/v1alpha1
      kind: PodCliqueSet
      metadata:
        name: wide-ep-grove
      spec:
        template:
          cliques:
            - name: prefill
              spec: &cw-common
                podSpec:
                  containers:
                    - name: vllm
                      env:
                        - name: NCCL_IB_HCA
                          value: "ibp"
                        - name: NVSHMEM_HCA_PREFIX
                          value: "ibp"
                      resources:
                        limits:
                          rdma/ib: "1"
                        requests:
                          rdma/ib: "1"
                  volumes:
                    - name: hf-cache
                      emptyDir: null
                      hostPath:
                        path: /mnt/local/hf-cache
                        type: DirectoryOrCreate
                    - name: jit-cache
                      emptyDir: null
                      hostPath:
                        path: /mnt/local/jit-cache
                        type: DirectoryOrCreate
            - name: decode
              spec: *cw-common
