# Single DisaggregatedSet managing prefill and decode roles.
# Requires LWS v0.11.1+ with the DisaggregatedSet CRD and controller installed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - disaggregatedset.yaml
  - serviceAccount.yaml

components:
  - ../../../../../recipes/modelserver/components/images/gpu-vllm/release
  - ../../../../../recipes/modelserver/components/images/routing-sidecar/nightly

# TODO(#2339): Remove override once gpu-vllm/release is bumped to v0.30.0+ (required for DeepEP v2 + NCCL GIN).
images:
  - name: docker.io/vllm/vllm-openai
    newName: docker.io/vllm/vllm-openai
    newTag: v0.30.0

labels:
  - pairs:
      llm-d.ai/model: DeepSeek-R1-0528
      llm-d.ai/guide: wide-ep
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
    fields:
      - version: v1
        kind: ServiceAccount
        path: metadata/labels
        create: true
