apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# The patch below matches roles, containers, volumes, and env entries by
# name via the DisaggregatedSet schema the base declares. The common role
# spec is written once under the prefill role (&cw-common) and reused for
# the decode role (*cw-common).

# CoreWeave-specific configuration: provider hostPath cache volumes,
# InfiniBand HCA selection, and RDMA device limits on both roles.
patches:
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: wide-ep-nvidia-gpu-vllm-glm-5-2
      spec:
        roles:
          - name: prefill
            spec: &cw-common
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: vllm
                        env:
                          - name: NCCL_IB_HCA
                            value: "ibp"
                          - name: NVSHMEM_HCA_PREFIX
                            value: "ibp"
                        resources:
                          limits:
                            rdma/ib: "8"
                          requests:
                            rdma/ib: "8"
                    volumes:
                      - name: hf-cache
                        hostPath:
                          path: /mnt/local/hf-cache
                          type: DirectoryOrCreate
                      - name: jit-cache
                        hostPath:
                          path: /mnt/local/jit-cache
                          type: DirectoryOrCreate
          - name: decode
            spec: *cw-common
