apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Enable CPU KV-cache offloading on the prefill role.

# The patch below matches the role, container, and env entry by name via
# the DisaggregatedSet schema the base declares.
patches:
  - patch: |-
      apiVersion: disaggregatedset.x-k8s.io/v1
      kind: DisaggregatedSet
      metadata:
        name: wide-ep-nvidia-gpu-vllm-glm-5-2
      spec:
        roles:
          - name: prefill
            spec:
              leaderWorkerTemplate:
                workerTemplate:
                  spec:
                    containers:
                      - name: vllm
                        env:
                          - name: OFFLOADING_MODE
                            value: "cpu"
