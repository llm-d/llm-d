apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-nvidia-gpu-vllm-glm-5-3-flash
  labels:
    llm-d.ai/model: GLM-5.3-Flash
    llm-d.ai/guide: wide-ep
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/inference-serving: 'true'
    llm-d.ai/role: decode
spec:
  replicas: 1
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdateConfiguration:
      maxSurge: 0
      maxUnavailable: 1
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: 'true'
          llm-d.ai/guide: wide-ep
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: nvidia
          llm-d.ai/model: GLM-5.3-Flash
          llm-d.ai/role: decode
      spec:
        serviceAccountName: glm-5-3-flash
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Gi
        - name: hf-cache
          emptyDir: {}
        - name: jit-cache
          emptyDir: {}
        containers:
        - name: vllm
          image: REPLACE_MODEL_SERVER_IMAGE
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RAWIO
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: Always
          command:
          - /bin/bash
          - -c
          args:
          - |-
            # Clear /dev/shm on start to prevent running out of space when crashes occur
            # https://github.com/llm-d/llm-d/issues/352
            find /dev/shm -type f -delete

            #################
            # RUN vLLM GLM-5.3-Flash aggregated workers via DP Supervisor
            # 288 routed experts / 16 EP ranks = 18 routed experts per GPU.
            #################
            START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

            MTP_ARGS=""
            if [ "${ENABLE_MTP:-0}" = "1" ]; then
              MTP_ARGS="--speculative-config {\"method\":\"mtp\",\"num_speculative_tokens\":${MTP_NUM_TOKENS:-5}}"
            fi

            exec vllm serve $MTP_ARGS --kv-cache-dtype fp8 \
              zai-org/GLM-5.3-Flash \
              --port 8000 \
              --trust-remote-code \
              --gpu-memory-utilization ${GPU_MEM_UTIL:-0.85} \
              --max-model-len ${MAX_MODEL_LEN:-131072} \
              --disable-access-log-for-endpoints=/health,/metrics \
              --data-parallel-multi-port-external-lb \
              --data-parallel-supervisor-port=8008 \
              --enable-expert-parallel \
              --tensor-parallel-size $TP_SIZE \
              --max-num-batched-tokens ${MAX_TOKENS} \
              --max-num-seqs ${MAX_TOKENS} \
              --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
              --data-parallel-size-local $DP_SIZE_LOCAL \
              --data-parallel-address ${LWS_LEADER_ADDRESS} \
              --data-parallel-rpc-port 5555 \
              --data-parallel-start-rank $START_RANK \
              --all2all-backend allgather_reducescatter \
              --moe-backend deep_gemm \
              --reasoning-parser glm47 \
              --tool-call-parser glm47 \
              --enable-auto-tool-choice
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-d-hf-token
                key: HF_TOKEN
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
            value: '1'
          - name: GPU_MEM_UTIL
            value: '0.85'
          - name: MAX_MODEL_LEN
            value: '131072'
          - name: ENABLE_MTP
            value: '0'
          - name: MTP_NUM_TOKENS
            value: '5'
          - name: MAX_TOKENS
            value: '256'
          - name: DP_SIZE_LOCAL
            value: '8'
          - name: TP_SIZE
            value: '1'
          - name: TRITON_LIBCUDA_PATH
            value: /usr/local/nvidia/lib64
          - name: LD_LIBRARY_PATH
            value: /usr/local/nvidia/lib64:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu:/usr/lib64
          - name: VLLM_SKIP_P2P_CHECK
            value: '1'
          - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
            value: '1'
          - name: VLLM_USE_DEEP_GEMM
            value: '1'
          - name: NVIDIA_GDRCOPY
            value: enabled
          - name: NVSHMEM_SYMMETRIC_SIZE
            value: 16G
          - name: NVSHMEM_REMOTE_TRANSPORT
            value: ibgda
          - name: NVSHMEM_IB_ENABLE_IBGDA
            value: 'true'
          - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
            value: eth0
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: '120'
          - name: CUDA_CACHE_PATH
            value: /var/cache/vllm/cuda
          - name: CCACHE_DIR
            value: /var/cache/vllm/ccache
          - name: VLLM_CACHE_ROOT
            value: /var/cache/vllm/vllm
          - name: FLASHINFER_WORKSPACE_BASE
            value: /var/cache/vllm/flashinfer
          - name: HF_HUB_CACHE
            value: /var/cache/huggingface
          ports:
          - containerPort: 8000
            name: rank0
            protocol: TCP
          - containerPort: 8001
            name: rank1
            protocol: TCP
          - containerPort: 8002
            name: rank2
            protocol: TCP
          - containerPort: 8003
            name: rank3
            protocol: TCP
          - containerPort: 8004
            name: rank4
            protocol: TCP
          - containerPort: 8005
            name: rank5
            protocol: TCP
          - containerPort: 8006
            name: rank6
            protocol: TCP
          - containerPort: 8007
            name: rank7
            protocol: TCP
          - containerPort: 8008
            name: supervisor
            protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: supervisor
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 3600
          livenessProbe:
            httpGet:
              path: /health
              port: supervisor
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: supervisor
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              ephemeral-storage: 1Ti
              memory: 512Gi
              nvidia.com/gpu: '8'
            requests:
              cpu: 32
              ephemeral-storage: 1Ti
              memory: 512Gi
              nvidia.com/gpu: '8'
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: hf-cache
            mountPath: /var/cache/huggingface
          - name: jit-cache
            mountPath: /var/cache/vllm
