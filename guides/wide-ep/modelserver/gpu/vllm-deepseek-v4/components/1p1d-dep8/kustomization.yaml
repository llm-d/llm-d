apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# 1 prefill worker + 1 decode worker, 8 GPUs / 2 nodes each -> 4 nodes / 16 GPUs total.
# Each worker: TP=1, DP=8, EP=8 (DEP8).
patches:
  - target:
      group: disaggregatedset.x-k8s.io
      kind: DisaggregatedSet
    patch: |-
      # Roles are ordered [prefill, decode] in the base DisaggregatedSet.
      - op: replace
        path: /spec/roles/0/spec/replicas
        value: 1
