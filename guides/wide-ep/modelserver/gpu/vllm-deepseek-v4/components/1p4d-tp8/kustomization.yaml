apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# 1 prefill worker (DEP8) + 4 decode replicas (TP=8 each) -> 10 nodes / 40 GPUs.
# Scaled low-latency: multiple independent TP=8 decode workers handle higher concurrency.
patches:
  - target:
      group: disaggregatedset.x-k8s.io
      kind: DisaggregatedSet
    patch: |-
      # Roles are ordered [prefill, decode] in the base DisaggregatedSet.
      - op: replace
        path: /spec/roles/0/spec/replicas
        value: 1
      - op: replace
        path: /spec/roles/1/spec/replicas
        value: 4
