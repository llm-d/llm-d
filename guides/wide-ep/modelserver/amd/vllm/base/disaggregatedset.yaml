apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: wide-ep-amd-vllm-dsv3
  labels:
    llm-d.ai/model: DeepSeek-V3
    llm-d.ai/guide: wide-ep
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: amd
spec:
  roles:
    - name: prefill
      metadata:
        labels:
          llm-d.ai/model: DeepSeek-V3
          llm-d.ai/guide: wide-ep
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: amd
          llm-d.ai/inference-serving: 'true'
          llm-d.ai/role: prefill
      spec:
        replicas: 1
        # Tear down the old group before creating the new one: the default surge needs a spare
        # 16-GPU copy of the role, which deadlocks on clusters sized for exactly one.
        rolloutStrategy:
          type: RollingUpdate
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 2
          workerTemplate:
            metadata:
              # No `k8s.v1.cni.cncf.io/networks` annotation: NAD names are cluster-specific. The provider
              # overlay must attach one NAD per rail as net1..net8 (matching `amd.com/vnic: 8`), each rail
              # reachable between all four nodes, or the 16-rank group hangs. See
              # `amd-ci/patch-amd-ci-fabric.yaml` and `kubectl get net-attach-def -A`.
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: "wide-ep"
                llm-d.ai/accelerator-variant: "gpu"
                llm-d.ai/accelerator-vendor: "amd"
                llm-d.ai/model: DeepSeek-V3
                llm-d.ai/role: prefill
            spec:
              serviceAccountName: deepseek-v3-moriio
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          llm-d.ai/guide: "wide-ep"
                          llm-d.ai/model: DeepSeek-V3
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi
                - name: jit-cache
                  emptyDir: {}
                - name: model-cache
                  persistentVolumeClaim:
                    claimName: model-pvc
              containers:
                - name: vllm
                  image: REPLACE_MODEL_SERVER_IMAGE
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    # IPC_LOCK: MoRI pins memory for the RDMA symmetric heap.
                    capabilities:
                      add:
                        - IPC_LOCK
                  command:
                    - /bin/bash
                    - -c
                  args:
                    - |-
                      # Clear /dev/shm on start to prevent running out of space when crashes occur https://github.com/llm-d/llm-d/issues/352
                      find /dev/shm -type f -delete

                      # RUN vLLM DeepSeek-V3 prefill (MoRI-EP high throughput)
                      START_RANK=$(( ${LWS_WORKER_INDEX} * DP_SIZE_LOCAL ))

                      # Benchmark CI reads the model name off the one bare continuation line: keep it off the exec line.
                      exec vllm serve \
                        deepseek-ai/DeepSeek-V3 \
                        --port 8000 \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --api-server-count 8 \
                        --data-parallel-hybrid-lb \
                        --enable-expert-parallel \
                        --tensor-parallel-size $TP_SIZE \
                        --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                        --data-parallel-size-local $DP_SIZE_LOCAL \
                        --data-parallel-address ${LWS_LEADER_ADDRESS} \
                        --data-parallel-rpc-port 29550 \
                        --data-parallel-start-rank $START_RANK \
                        --all2all-backend mori_high_throughput \
                        --block-size 16 \
                        --gpu-memory-utilization 0.58 \
                        --max-num-batched-tokens 8192 \
                        --max-model-len 36864 \
                        --no-enable-prefix-caching \
                        --compilation-config '{"cudagraph_mode":"PIECEWISE"}' \
                        --kv-transfer-config '{"kv_connector":"MoRIIOConnector",
                                                "kv_role":"kv_producer",
                                                "kv_connector_extra_config":{"http_port":"8000",
                                                                             "handshake_port":"6301",
                                                                             "notify_port":"61005",
                                                                             "read_mode":"false"}}'
                  env:
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: DP_SIZE_LOCAL
                      value: "8"
                    - name: TP_SIZE
                      value: "1"
                    - name: HF_HOME
                      value: /model-cache
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    # Must exceed the sidecar's 90 s idle timeout, or pooled connections are reset mid-request.
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"

                    # MoRI symmetric heap, 16 GiB. A function of the model and the EP width, not of the
                    # fabric: MoRI's own default is 4 GiB, which DeepSeek-V3 at EP16 overruns.
                    - name: MORI_SHMEM_HEAP_SIZE
                      value: "17179869184"
                    # Avoids a rocm-smi init race that segfaults a rank; costs bandwidth, not correctness.
                    - name: MORI_DISABLE_TOPO
                      value: "1"
                    # MORI_IB_GID_INDEX is deliberately unset: one global index across rails yields an all-zero source GID with no warning.
                    #
                    # Fabric-, NIC- and driver-specific MoRI settings have no portable default; set them in
                    # your provider overlay (see `amd-ci/patch-amd-ci-fabric.yaml`):
                    #
                    #   MORI_RDMA_DEVICES      ibverbs device names, one per rail, in the same order on
                    #                          every pod (`ls /sys/class/infiniband`). Unset, MoRI uses
                    #                          every device ibv_get_device_list reports, which is already
                    #                          correct wherever the pod is scoped to exactly its rails.
                    #   MORI_RDMA_SL / _TC     RoCE QoS. Must match the switch: SL is the 802.1p priority
                    #                          and TC is the IP traffic class, i.e. DSCP << 2. Setting
                    #                          these without matching end-to-end PFC costs bandwidth.
                    #   MORI_ENABLE_DMABUF_REG Prefers dmabuf memory registration over ibv_reg_mr, which
                    #                          needs driver support; MoRI falls back either way.
                    #   MORI_ENABLE_HOST_PROXY Drives the NIC from a CPU proxy thread instead of IBGDA.
                    #                          Required only where the NIC firmware cannot do IBGDA.
                    #   MORI_ENABLE_RAIL_ONLY  Restricts cross-node QPs to the same rail, and
                    #   MORI_IO_RAIL_AFFINITY  pins the KV path to the sender's rail.
                    #
                    # Without MORI_ENABLE_RAIL_ONLY, MoRI builds a full cross-node mesh: correct on a
                    # fully-connected fabric, but on a rail-isolated one the cross-rail QPs never reach RTR
                    # and init hangs. Rail-only needs every rail reachable between all nodes and node-major,
                    # contiguous ranks; set it on every pod of both roles or none. If you set
                    # MORI_ENABLE_HOST_PROXY, use the literal "1", not "true".

                    - name: VLLM_ENGINE_READY_TIMEOUT_S
                      value: "7200"
                    - name: VLLM_ROCM_USE_AITER
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_MOE
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_MLA
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_RMSNORM
                      value: "1"
                    # Deliberately off: AITER's tuned_gemm has no loadable gfx950 binary for large-M unquantized GEMMs.
                    - name: VLLM_ROCM_USE_AITER_LINEAR
                      value: "0"
                    # Deliberately off: Inductor's static launcher kills the engine on the first real request, not at startup.
                    - name: TORCHINDUCTOR_USE_STATIC_CUDA_LAUNCHER
                      value: "0"
                    # The base image sets 0, selecting ROCr's legacy InterceptQueue, where a burst past 256 packets
                    # corrupts the heap and segfaults every rank. Never empty (aborts at HSA init). ROCm/rocm-systems#4066.
                    - name: ROCPROFILER_QUEUE_INTERPOSITION
                      value: "1"
                    - name: HSA_ENABLE_SDMA
                      value: "1"
                    - name: HSA_FORCE_FINE_GRAIN_PCIE
                      value: "1"
                    # DP/EP coordination rides the pod network; the RDMA rails belong to MoRI and carry no IPv4.
                    - name: NCCL_IB_DISABLE
                      value: "1"
                    # Stops a later IPv4-bearing secondary interface from capturing RCCL and Gloo traffic.
                    # Check `ls /sys/class/net` if your CNI names the primary interface differently.
                    - name: NCCL_SOCKET_IFNAME
                      value: eth0
                    - name: GLOO_SOCKET_IFNAME
                      value: eth0
                    - name: NCCL_DEBUG
                      value: WARN
                    - name: VLLM_CACHE_ROOT
                      value: /var/cache/vllm/vllm
                  ports:
                    - containerPort: 8000
                      name: modelserver
                      protocol: TCP
                    - containerPort: 29550
                      name: dp-rpc
                      protocol: TCP
                    - containerPort: 6301
                      name: mori-handshake
                      protocol: TCP
                    - containerPort: 61005
                      name: mori-notify
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "160"
                      memory: 1200Gi
                      amd.com/gpu: "8"
                      # All eight, always: a partial request yields an arbitrary subset of rail planes.
                      amd.com/vnic: "8"
                    requests:
                      cpu: "160"
                      memory: 1200Gi
                      amd.com/gpu: "8"
                      amd.com/vnic: "8"
                  # 60 s + 240 x 30 s = 7260 s; the CI standup_timeout must not be tighter.
                  startupProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 240
                  # LWS recreates the whole group on one liveness failure, costing a 2 h standup.
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 6
                  # /health, not /v1/models: the latter is a static route that answers even after the engine
                  # core dies, so a dead pod would stay a ready InferencePool endpoint and absorb traffic.
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 12
                  volumeMounts:
                    - name: dshm
                      mountPath: /dev/shm
                    - name: jit-cache
                      mountPath: /var/cache/vllm
                    - name: model-cache
                      mountPath: /model-cache
    - name: decode
      metadata:
        labels:
          llm-d.ai/model: DeepSeek-V3
          llm-d.ai/guide: wide-ep
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: amd
          llm-d.ai/inference-serving: 'true'
          llm-d.ai/role: decode
      spec:
        replicas: 1
        # Tear down the old group before creating the new one: the default surge needs a spare
        # 16-GPU copy of the role, which deadlocks on clusters sized for exactly one.
        rolloutStrategy:
          type: RollingUpdate
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 2
          workerTemplate:
            metadata:
              # No `k8s.v1.cni.cncf.io/networks` annotation here on purpose; see the prefill role for why.
              # The provider overlay attaches one NAD per rail as net1..net8.
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: "wide-ep"
                llm-d.ai/accelerator-variant: "gpu"
                llm-d.ai/accelerator-vendor: "amd"
                llm-d.ai/model: DeepSeek-V3
                llm-d.ai/role: decode
            spec:
              serviceAccountName: deepseek-v3-moriio
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          llm-d.ai/guide: "wide-ep"
                          llm-d.ai/model: DeepSeek-V3
              initContainers:
                # routing-proxy resolves its peers once and exits fatally on the first name that is missing,
                # so hold it until DNS has them all. getent is the only resolver in the engine image.
                - name: wait-peer-dns
                  image: REPLACE_MODEL_SERVER_IMAGE
                  imagePullPolicy: IfNotPresent
                  command:
                    - /bin/bash
                    - -c
                    - |-
                      # One success proves nothing: CoreDNS runs several replicas and caches denials for 30 s,
                      # so a name can resolve here and still NXDOMAIN for the proxy. Require 35 s unbroken.
                      # Each name must map to exactly one pod, and this pod must be in the decode list,
                      # or the sidecar assigns DP ranks to the wrong peer.
                      ips() { getent ahostsv4 "$1" | awk '{print $1}' | sort -u | paste -sd,; }
                      ok=0
                      while (( SECONDS < 360 )); do
                        bad=
                        for h in ${MORIIO_REMOTE_HOSTS//,/ } ${MORIIO_DECODE_HOSTS//,/ }; do
                          a=$(ips "$h")
                          [[ -n $a && $a != *,* ]] || bad="$bad $h=[$a]"
                        done
                        if [[ -z $bad ]]; then
                          if (( ++ok >= 8 )); then
                            for h in ${MORIIO_DECODE_HOSTS//,/ }; do
                              [[ $(ips "$h") == "$POD_IP" ]] && exit 0
                            done
                            echo "POD_IP $POD_IP not in MORIIO_DECODE_HOSTS" >&2
                            exit 1
                          fi
                        else
                          ok=0
                        fi
                        sleep 5
                      done
                      echo "peer DNS unstable after ${SECONDS}s, last bad:$bad" >&2
                      exit 1
                  env:
                    - &pod_ip
                      name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - &pod_namespace
                      name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    # Peers are addressed by their LWS pod DNS names, <lws>-<group>[-<worker>].<lws>, where each
                    # role's LWS is <metadata.name>-<slice>-<revision>-<role> (LWS v0.10+). Prefill and decode
                    # share the revision, so this pod's own label names both. Slice 0: the guide runs one slice.
                    - &ds_revision
                      name: DS_REVISION
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['disaggregatedset.x-k8s.io/revision']
                    # <metadata.name>-<slice>; must match metadata.name.
                    - &lws_prefix
                      name: LWS_PREFIX
                      value: wide-ep-amd-vllm-dsv3-0
                    - &prefill_lws
                      name: PREFILL_LWS
                      value: $(LWS_PREFIX)-$(DS_REVISION)-prefill
                    - &decode_lws
                      name: DECODE_LWS
                      value: $(LWS_PREFIX)-$(DS_REVISION)-decode
                    # One host per pod of group 0, ordered leader-then-worker: entry i must own global DP ranks
                    # [i*8, (i+1)*8). The sidecar resolves it once at startup for this fixed 2P2D shape (one
                    # group per role, replicas: 1); scaling either role needs new entries and a redeploy.
                    # Temporary until multi-pod peer discovery lands.
                    - &moriio_remote_hosts
                      name: MORIIO_REMOTE_HOSTS
                      value: $(PREFILL_LWS)-0.$(PREFILL_LWS).$(POD_NAMESPACE).svc,$(PREFILL_LWS)-0-1.$(PREFILL_LWS).$(POD_NAMESPACE).svc
                    - &moriio_decode_hosts
                      name: MORIIO_DECODE_HOSTS
                      value: $(DECODE_LWS)-0.$(DECODE_LWS).$(POD_NAMESPACE).svc,$(DECODE_LWS)-0-1.$(DECODE_LWS).$(POD_NAMESPACE).svc
                  resources: {}
                # The sidecar fronts 8000 (the port the InferencePool targets) and vLLM moves to 8200.
                - name: routing-proxy
                  image: REPLACE_ROUTING_SIDECAR_IMAGE
                  imagePullPolicy: IfNotPresent
                  restartPolicy: Always
                  args:
                    - --port=8000
                    - --model-server-port=8200
                    - --kv-connector=nixlv2
                    # Must agree with read_mode=false in both --kv-transfer-config blocks.
                    - --moriio-write-mode
                    - --moriio-dp-size=16
                    - --moriio-dp-size-local=8
                    - --moriio-tp-size=1
                    - --moriio-parallel-dispatch
                    # Parallel dispatch synthesises the prefill leg's KV params from these, so pin them
                    # to the ports the prefill engine listens on rather than relying on sidecar defaults.
                    - --moriio-prefill-handshake-port=6301
                    - --moriio-prefill-notify-port=61005
                    - --moriio-local-pod-ip=$(POD_IP)
                    - --moriio-remote-hosts=$(MORIIO_REMOTE_HOSTS)
                    - --moriio-decode-hosts=$(MORIIO_DECODE_HOSTS)
                    # 32k-token prompts at concurrency 64 can queue 75 s behind prefill; the 30 s default returns 504.
                    - --moriio-parallel-decode-wait-timeout=180s
                    - --metrics-port=9095
                    - --zap-log-level=1
                    - --secure-proxy=false
                  env:
                    - *pod_ip
                    - *pod_namespace
                    - *ds_revision
                    - *lws_prefix
                    - *prefill_lws
                    - *decode_lws
                    - *moriio_remote_hosts
                    - *moriio_decode_hosts
                  ports:
                    - containerPort: 8000
                      name: sidecar
                      protocol: TCP
                    - containerPort: 9095
                      name: sc-metrics
                      protocol: TCP
                  resources: {}
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi
                - name: jit-cache
                  emptyDir: {}
                - name: model-cache
                  persistentVolumeClaim:
                    claimName: model-pvc
              containers:
                - name: vllm
                  image: REPLACE_MODEL_SERVER_IMAGE
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    capabilities:
                      add:
                        - IPC_LOCK
                  command:
                    - /bin/bash
                    - -c
                  args:
                    - |-
                      # Clear /dev/shm on start to prevent running out of space when crashes occur https://github.com/llm-d/llm-d/issues/352
                      find /dev/shm -type f -delete

                      # RUN vLLM DeepSeek-V3 decode (MoRI-EP low latency)
                      START_RANK=$(( ${LWS_WORKER_INDEX} * DP_SIZE_LOCAL ))

                      # Benchmark CI reads the model name off the one bare continuation line: keep it off the exec line.
                      exec vllm serve \
                        deepseek-ai/DeepSeek-V3 \
                        --port 8200 \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --api-server-count 8 \
                        --data-parallel-hybrid-lb \
                        --enable-expert-parallel \
                        --tensor-parallel-size $TP_SIZE \
                        --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                        --data-parallel-size-local $DP_SIZE_LOCAL \
                        --data-parallel-address ${LWS_LEADER_ADDRESS} \
                        --data-parallel-rpc-port 29560 \
                        --data-parallel-start-rank $START_RANK \
                        --all2all-backend mori_low_latency \
                        --block-size 16 \
                        --gpu-memory-utilization 0.58 \
                        --max-model-len 36864 \
                        --no-enable-prefix-caching \
                        --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
                        --kv-transfer-config '{"kv_connector":"MoRIIOConnector",
                                                "kv_role":"kv_consumer",
                                                "kv_connector_extra_config":{"http_port":"8200",
                                                                             "handshake_port":"6301",
                                                                             "notify_port":"61005",
                                                                             "read_mode":"false"}}'
                  env:
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: DP_SIZE_LOCAL
                      value: "8"
                    - name: TP_SIZE
                      value: "1"
                    - name: HF_HOME
                      value: /model-cache
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    # Must exceed the sidecar's 90 s idle timeout, or pooled connections are reset mid-request.
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"

                    # MoRI-EP: must stay identical to the prefill role, which carries the per-variable notes
                    # and lists the fabric- and NIC-specific settings that both roles leave to the
                    # provider overlay. Set them for both roles or neither.
                    - name: MORI_SHMEM_HEAP_SIZE
                      value: "17179869184"
                    - name: MORI_DISABLE_TOPO
                      value: "1"

                    # vLLM / ROCm: must stay identical to the prefill role.
                    - name: VLLM_ENGINE_READY_TIMEOUT_S
                      value: "7200"
                    - name: VLLM_ROCM_USE_AITER
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_MOE
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_MLA
                      value: "1"
                    - name: VLLM_ROCM_USE_AITER_RMSNORM
                      value: "1"
                    # Deliberately off: AITER's tuned_gemm has no loadable gfx950 binary for large-M unquantized GEMMs.
                    - name: VLLM_ROCM_USE_AITER_LINEAR
                      value: "0"
                    # Deliberately off: Inductor's static launcher kills the engine on the first real request, not at startup.
                    - name: TORCHINDUCTOR_USE_STATIC_CUDA_LAUNCHER
                      value: "0"
                    # The base image sets 0, selecting ROCr's legacy InterceptQueue, where a burst past 256 packets
                    # corrupts the heap and segfaults every rank. Never empty (aborts at HSA init). ROCm/rocm-systems#4066.
                    - name: ROCPROFILER_QUEUE_INTERPOSITION
                      value: "1"
                    - name: HSA_ENABLE_SDMA
                      value: "1"
                    - name: HSA_FORCE_FINE_GRAIN_PCIE
                      value: "1"
                    - name: NCCL_IB_DISABLE
                      value: "1"
                    # See the prefill role.
                    - name: NCCL_SOCKET_IFNAME
                      value: eth0
                    - name: GLOO_SOCKET_IFNAME
                      value: eth0
                    - name: NCCL_DEBUG
                      value: WARN
                    - name: VLLM_CACHE_ROOT
                      value: /var/cache/vllm/vllm
                  ports:
                    - containerPort: 8200
                      name: modelserver
                      protocol: TCP
                    - containerPort: 29560
                      name: dp-rpc
                      protocol: TCP
                    - containerPort: 6301
                      name: mori-handshake
                      protocol: TCP
                    - containerPort: 61005
                      name: mori-notify
                      protocol: TCP
                  resources:
                    limits:
                      cpu: "160"
                      memory: 1200Gi
                      amd.com/gpu: "8"
                      amd.com/vnic: "8"
                    requests:
                      cpu: "160"
                      memory: 1200Gi
                      amd.com/gpu: "8"
                      amd.com/vnic: "8"
                  # 60 s + 240 x 30 s = 7260 s; the CI standup_timeout must not be tighter.
                  startupProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 240
                  # LWS recreates the whole group on one liveness failure, costing a 2 h standup.
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 6
                  # /health, not /v1/models: the latter is a static route that answers even after the engine
                  # core dies, so a dead pod would stay a ready InferencePool endpoint and absorb traffic.
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 12
                  volumeMounts:
                    - name: dshm
                      mountPath: /dev/shm
                    - name: jit-cache
                      mountPath: /var/cache/vllm
                    - name: model-cache
                      mountPath: /model-cache
