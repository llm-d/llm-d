# Fabric, NIC and driver settings for the amd-ci cluster; base/'s prefill role explains each one.
# Shared by both roles via &amd-ci-fabric: MoRI requires identical settings on every pod.
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: wide-ep-amd-vllm-dsv3
spec:
  roles:
    - name: prefill
      spec: &amd-ci-fabric
        leaderWorkerTemplate:
          workerTemplate:
            metadata:
              annotations:
                # Eight rails, one NAD per rail, matching amd.com/vnic: 8.
                k8s.v1.cni.cncf.io/networks: |
                  [
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net1"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net2"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net3"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net4"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net5"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net6"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net7"},
                    {"name":"amd-host-device-nad","namespace":"default","interface":"net8"}
                  ]
            spec:
              containers:
                - name: vllm
                  env:
                    # MORI_RDMA_DEVICES is deliberately unset: this cluster exposes only the pod's
                    # own eight rails as /dev/infiniband/uverbs1..8, so ibv_get_device_list already
                    # returns exactly those eight in rail order.
                    #
                    # RoCE QoS as configured on this fabric: 802.1p priority 3, DSCP 26 (TC = DSCP << 2).
                    - name: MORI_RDMA_SL
                      value: "3"
                    - name: MORI_RDMA_TC
                      value: "104"
                    # Literal "1", not "true": MoRI's JIT gates -DMORI_PROXY_ENABLED on a string compare.
                    - name: MORI_ENABLE_HOST_PROXY
                      value: "1"
                    # Rail-isolated fabric: without rail-only the cross-rail QPs never reach RTR and
                    # init hangs. Set for both roles, every pod.
                    - name: MORI_ENABLE_RAIL_ONLY
                      value: "1"
                    # Prefer dmabuf registration; avoids ibv_reg_mr warnings when peermem is absent.
                    - name: MORI_ENABLE_DMABUF_REG
                      value: "1"
                    # Rail affinity for the KV path only; not a substitute for MORI_ENABLE_RAIL_ONLY.
                    - name: MORI_IO_RAIL_AFFINITY
                      value: "1"
    - name: decode
      spec: *amd-ci-fabric
