router:
  epp:
    # Same config as wide-ep.values.yaml minus the
    # disaggregatedset-rollout-screener, which is not enabled for XPU.
    pluginsCustomConfig:
      wide-ep-config.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: prefix-cache-scorer
        - type: queue-scorer
        - type: active-request-scorer
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: active-request-scorer
            weight: 2
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer

  modelServers:
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "wide-ep"
      llm-d.ai/accelerator-variant: "xpu"
      llm-d.ai/accelerator-vendor: "intel"
      # Only the leader (worker-index 0) runs the routing-proxy sidecar and
      # listens on 8000; headless workers share every other label but not
      # this one. LWS does not propagate a role label to pods, so
      # worker-index is the only reliable way to select just the leader.
      leaderworkerset.sigs.k8s.io/worker-index: "0"
