name: wide-ep

# Which model server runs on which accelerator. `validated` = covered by a
# nightly E2E workflow; `community` = an overlay exists but is not run nightly;
# `unsupported` must link a tracking issue. A missing cell means unsupported.
# Keys must match env.static ACCELERATOR_TYPE / MODEL_SERVER values; `model`
# is the model the accelerator's overlay serves (used for MODEL on llm-d.ai);
# `notes` (optional, one line) fills the Notes column of the support table.
# `providers` lists the INFRA_PROVIDER values the accelerator takes (each
# needs a modelserver/<acc>/<engine>/.../<provider>/ overlay; `engines:`
# narrows one to a subset); llm-d.ai turns it into the provider selector.
support:
  engines: {vllm: vLLM}
  accelerators:
    gpu:
      label: NVIDIA GPU
      notes: "Default. 32× H200 · `DisaggregatedSet`: prefill DP16 + decode DP16, 2 nodes each · DeepEP + NIXL · `INFRA_PROVIDER`: `base`, `gke`, `coreweave`"
      model: deepseek-ai/DeepSeek-R1-0528
      providers:
        - {name: base, label: "Kubernetes (base)"}
        - {name: gke, label: "GKE"}
        - {name: coreweave, label: "CoreWeave"}
      engines: {vllm: validated}
    amd:
      label: AMD GPU
      notes: "32× MI355X · `DisaggregatedSet`: prefill DP16 + decode DP16, 2 nodes each · MoRI-EP + MoRI-IO"
      model: deepseek-ai/DeepSeek-V3
      providers:
        - {name: base, label: "Kubernetes (base)"}
      engines: {vllm: validated}
    xpu:
      label: Intel XPU
      notes: "4 XPUs via DRA · `LeaderWorkerSet`: prefill TP2 + decode TP2 with EP · NIXL · `INFRA_PROVIDER`: `base`"
      model: deepseek-ai/DeepSeek-V2-Lite-Chat
      providers:
        - {name: base, label: "Kubernetes (base)"}
      engines: {vllm: validated}

env:
  static:
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))

    GUIDE_NAME: wide-ep
    NAMESPACE: llm-d-wide-ep

    # Prometheus monitoring is opt-in: set MONITORING=true (requires the
    # monitoring stack) to run the deploy.monitoring* and
    # verify.tests.router_metrics steps.
    MONITORING: {default: "false", values: ["false", "true"]}
    MONITORING_VALUES: {default: ""}

    ACCELERATOR_TYPE: {default: gpu, values: [gpu, amd, xpu]}
    MODEL_SERVER: {default: vllm, values: [vllm]}
    # Selects router/<ACCELERATOR>.values.yaml, the per-accelerator router
    # overrides layered on router/wide-ep.values.yaml. It mirrors
    # ACCELERATOR_TYPE; the README-parsing nightlies set ACCELERATOR per lane,
    # which is why the router install reads it rather than ACCELERATOR_TYPE.
    ACCELERATOR: {default: "${ACCELERATOR_TYPE}", comment: "keep equal to ACCELERATOR_TYPE"}
    # The overlay is modelserver/<ACCELERATOR_TYPE>/<MODEL_SERVER>/<INFRA_PROVIDER>/.
    # gpu: base, gke, coreweave; amd: base, amd-ci; xpu: base.
    INFRA_PROVIDER: {default: base, values: [base, gke, coreweave, amd-ci], comment: "valid values per accelerator: table above"}

    # Each accelerator serves one model: NVIDIA GPU serves
    # deepseek-ai/DeepSeek-R1-0528, AMD serves deepseek-ai/DeepSeek-V3, and
    # Intel XPU serves deepseek-ai/DeepSeek-V2-Lite-Chat.
    MODEL: {default: "deepseek-ai/DeepSeek-R1-0528", comment: "set to the model your accelerator serves (table above)"}

  source: ["${REPO_ROOT}/guides/env.sh # defines GAIE_VERSION, ROUTER_CHART_VERSION, router chart URLs, and CURL_TEST_IMAGE"]

prerequisites:
  clone:
    - skip_in: [ci]
      run: |
        export BRANCH=main
        git clone https://github.com/llm-d/llm-d.git && cd llm-d && git checkout ${BRANCH}

  gaie:
    - run: |
        # GAIE_URL is automatically calculated from GAIE_VERSION at ${REPO_ROOT}/guides/env.sh
        kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/${GAIE_URL}/v1-manifests.yaml
  namespace:
    - run: kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
  secrets:
    - skip_in: [ci]
      run: |
        kubectl create secret generic llm-d-hf-token \
          --from-literal="HF_TOKEN=${HF_TOKEN}" \
          --namespace "${NAMESPACE}" \
          --dry-run=client -o yaml | kubectl apply -f -

deploy:
  router_values:
    - run: |
        # Paths to values files
        export ROUTER_BASE_VALUES="${REPO_ROOT}/guides/recipes/router/base.values.yaml"
        export ROUTER_VALUES="${REPO_ROOT}/guides/${GUIDE_NAME}/router/${GUIDE_NAME}.values.yaml"
        # Per-accelerator overrides: the AMD and Intel XPU ones re-target the router
        # at their model servers; the NVIDIA GPU one is empty
        export ROUTER_ACCELERATOR_VALUES="${REPO_ROOT}/guides/${GUIDE_NAME}/router/${ACCELERATOR}.values.yaml"

  monitoring_values:
    # skip_in ci: the README-parsing nightlies harvest every `export`, and they
    # never enabled router monitoring for this guide.
    - when: {MONITORING: ["true"]}
      skip_in: [ci]
      run: export MONITORING_VALUES="-f ${REPO_ROOT}/guides/recipes/router/features/monitoring.values.yaml"

  standalone:
    - run: |
        helm install ${GUIDE_NAME} \
          ${ROUTER_STANDALONE_CHART} \
          -f ${ROUTER_BASE_VALUES} \
          ${MONITORING_VALUES} \
          -f ${ROUTER_VALUES} \
          -f ${ROUTER_ACCELERATOR_VALUES} \
          -n ${NAMESPACE} --version ${ROUTER_CHART_VERSION}

  modelserver:
    - run: |
        kubectl apply -n ${NAMESPACE} \
          -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/${INFRA_PROVIDER}/

  monitoring:
    # The guide's own monitoring overlay: a PodMonitor that scrapes every DP
    # rank port (rank0-rank7) instead of one port per pod.
    - when: {MONITORING: ["true"]}
      run: kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/monitoring

verify:
  endpoint:
    standalone:
      - run: export IP=$(kubectl get service ${GUIDE_NAME}-epp -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}')
  tests:
    request:
      - run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"How are you today?\"}"'
    dp_requests:
      - run: |
          # 32 requests, 8 at a time, each with a distinct ~1k-token prompt (no shared
          # prefix, so prefix-cache affinity does not pin them to one DP rank): each is
          # prefilled on a prefill DP rank, and its KV cache is transferred to a decode
          # DP rank
          kubectl run dp-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'P=$(for i in $(seq 1 60); do printf "Prefill ranks compute the KV cache and decode ranks pull it to generate tokens. "; done)
              for i in $(seq 1 32); do
                curl -sS -o /dev/null -w "%{http_code}\n" -X POST "http://${IP}/v1/completions" \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"${MODEL}\", \"prompt\": \"Request ${i}. ${P} What is wide expert parallelism?\", \"max_tokens\": 32}" &
                [ $((i % 8)) -eq 0 ] && wait
              done | sort | uniq -c'
    rank_metrics:
      - run: |
          # Requests and connector (KV transfer) prefix-cache hits per DP rank, read from
          # every running model server pod through the Kubernetes API server proxy (no
          # port-forward needed). NVIDIA GPU runs one API server per DP rank (prefill on
          # ports 8000-8007, decode on 8200-8207 behind the routing sidecar); AMD and
          # Intel XPU serve all of a pod's ranks on one port (prefill 8000, decode 8200)
          for role in prefill decode; do
            first=8000; [ "${role}" = decode ] && first=8200
            ports=${first}; [ "${ACCELERATOR_TYPE}" = gpu ] && ports=$(seq ${first} $((first + 7)))
            pods=$(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME},llm-d.ai/role=${role} \
              --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.name}')
            if [ -z "${pods}" ]; then echo "${role}: no running pods"; continue; fi
            for pod in ${pods}; do
              for port in ${ports}; do
                kubectl get --raw "/api/v1/namespaces/${NAMESPACE}/pods/${pod}:${port}/proxy/metrics" \
                  | awk -v k="${pod}:${port}" '/^vllm:(request_success|external_prefix_cache_hits)_total\{/ {
                      e = match($0, /engine="[^"]*"/) ? substr($0, RSTART + 8, RLENGTH - 9) : "0"
                      if ($0 ~ /^vllm:request_success/) r[k "/" e] += $NF; else h[k "/" e] += $NF
                    } END { for (x in r) print x, r[x], h[x] + 0 }'
              done
            done | awk -v role="${role}" '$2 > 0 { n++; req += $2; hits += $3 }
              END { printf "%s: %d DP rank(s) served %d requests; connector prefix-cache hits: %d tokens\n", role, n, req, hits }'
          done
    router_metrics:
      # The router's /metrics endpoint requires authentication unless the
      # monitoring values (MONITORING=true) are applied.
      - when: {MONITORING: ["true"]}
        run: |
          # P/D decisions taken by the router, read through the API server service proxy
          kubectl get --raw "/api/v1/namespaces/${NAMESPACE}/services/${GUIDE_NAME}-epp:9090/proxy/metrics" \
            | grep -E '^llm_d_epp_disagg_decision_total' || true

cleanup:
  modelserver:
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/${INFRA_PROVIDER}
  rest:
    - run: helm uninstall ${GUIDE_NAME} -n ${NAMESPACE}
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/monitoring --ignore-not-found=true
    - skip_in: [ci]
      run: kubectl delete namespace ${NAMESPACE}
