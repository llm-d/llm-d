# Copy to guides/<your-guide>/guide.yaml and edit.
# Every bash code block in your README is emitted from here by
# `scripts/guide.py render guides/<your-guide>`.

name: <guide-name>

env:
  # Variables the renderer emits as `export VAR=…`. Referenced by `when:` filters.
  static:
    GUIDE_NAME: <guide-name>
    NAMESPACE: llm-d-<guide-name>
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))
    MODEL: {default: "<HuggingFace/Model-Name>"}
    # Sensitive vars: `default:` is the README placeholder; compiler fails if unset.
    HF_TOKEN: {default: HF_TOKEN_PLACEHOLDER, sensitive: true}
    # Target environment. Gate steps that differ per platform with
    # `when: { ENV: [kind] }`. Name this axis ENV across guides so runners
    # (e.g. a pre-merge Kind runner) can set it uniformly. Drop values the
    # guide has not been validated against.
    ENV: {default: existing, values: [kind, existing, ocp]}
    # Include `sim` only if the guide ships a GPU-free overlay backed by
    # llm-d-inference-sim — that is what makes a guide runnable on Kind.
    # Never advertise a value with no overlay behind it.
    MODEL_SERVER: {default: vllm, values: [vllm, sglang, trtllm, sim]}
  # Files to source verbatim (write the full path including ${REPO_ROOT}/ if needed).
  source: ["${REPO_ROOT}/guides/env.sh"]

prerequisites:
  - run: kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
  - skip_in: [ci]
    run: |
      kubectl create secret generic llm-d-hf-token \
        --from-literal="HF_TOKEN=${HF_TOKEN}" \
        --namespace "${NAMESPACE}" \
        --dry-run=client -o yaml | kubectl apply -f -

# Modes (`standalone:`, `gateway:`) are inferred from `verify.endpoint:` keys below.
deploy:
  standalone:
    - run: helm install ${GUIDE_NAME} <chart> -n ${NAMESPACE}
  gateway:
    - run: helm install ${GUIDE_NAME} <chart> -n ${NAMESPACE}

verify:
  endpoint:
    standalone:
      - run: export IP=$(kubectl get service <svc> -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}')
    gateway:
      - run: export IP=$(kubectl get gateway <gw> -n ${NAMESPACE} -o jsonpath='{.status.addresses[0].value}')
  tests:
    - run: curl -sS "http://${IP}/v1/completions" -d '{"model":"'"${MODEL}"'","prompt":"hi"}'

cleanup:
  - run: helm uninstall ${GUIDE_NAME} -n ${NAMESPACE}
  - skip_in: [ci]
    run: kubectl delete namespace ${NAMESPACE}
