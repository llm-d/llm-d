apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotStorageConfig
metadata:
  name: pod-snapshot-storage-config
spec:
  snapshotStorageConfig:
    gcs:
      # Lowercase so the un-substituted overlay passes PodSnapshotStorageConfig
      # CRD schema validation (^[a-z0-9._-]+$) during CI server dry-run.
      bucket: "gcs-bucket-placeholder"
      path: "/"
      tokenSource: "podKSA"
