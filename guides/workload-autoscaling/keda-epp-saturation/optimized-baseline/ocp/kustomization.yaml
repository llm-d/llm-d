# OpenShift overlay for the KEDA + EPP saturation autoscaling guide.
#
# On generic Kubernetes the base ScaledObject scrapes the bundled Prometheus over
# plain in-cluster HTTP with no auth. On OpenShift, metrics live in Thanos Querier,
# whose :9091 endpoint rejects unauthenticated queries with a 401 — and KEDA
# suppresses that error and silently serves `fallback` replicas, so an
# unauthenticated trigger looks healthy while autoscaling does nothing. This
# overlay makes the saturation path work on OpenShift by:
#   - pointing both triggers at Thanos Querier over HTTPS, enabling authModes:bearer,
#     and attaching the prometheus-auth TriggerAuthentication, and
#   - provisioning a dedicated ServiceAccount (keda-epp-metrics-reader) granted
#     cluster-monitoring-view. The service-ca operator injects `service-ca.crt`
#     (the CA that signs Thanos's serving cert) into the SA token Secret
#     automatically, so no manual CA copy step is needed on OpenShift.
#
# Build:  kubectl kustomize ocp
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default namespace for the guide; override per deployment. The namespace
# transformer also rewrites the base ScaledObject/TriggerAuthentication namespace
# and the ServiceAccount subject in the ClusterRoleBinding, keeping them aligned.
# NOTE: the PromQL label selectors inside the trigger queries are opaque strings
# the transformer cannot reach — edit them to match your EPP pool/namespace/model.
namespace: llm-d-optimized-baseline

resources:
  - ../base
  - triggerauthentication.yaml

# Shared OCP metrics-reader auth (SA + ClusterRoleBinding + token Secret).
components:
  - ../../../../recipes/autoscaling/metrics-reader

patches:
  # Point both triggers at Thanos Querier over HTTPS, enable bearer auth, and
  # attach the prometheus-auth TriggerAuthentication (bearer token + service-ca.crt).
  # The base has no authenticationRef because the generic-k8s HTTP path needs none.
  - patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/serverAddress
        value: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
      - op: add
        path: /spec/triggers/0/metadata/authModes
        value: "bearer"
      - op: add
        path: /spec/triggers/0/authenticationRef
        value:
          name: prometheus-auth
      - op: replace
        path: /spec/triggers/1/metadata/serverAddress
        value: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
      - op: add
        path: /spec/triggers/1/metadata/authModes
        value: "bearer"
      - op: add
        path: /spec/triggers/1/authenticationRef
        value:
          name: prometheus-auth
    target:
      kind: ScaledObject
      name: optimized-baseline-nvidia-gpu-vllm-decode-saturation
