apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# EPP configuration is deliberately absent here. EndpointPickerConfig is the EPP
# binary's config schema (group llm-d.ai/v1alpha1), not a Kubernetes API type —
# there is no CRD to apply it against. It is a key inside the <release>-epp
# ConfigMap, so the flowControl feature gate this guide needs is enabled by
# patching that ConfigMap — see Configure step 2 of README.epp-keda-saturation.md.
resources:
  - scaledobject.yaml
  - triggerauthentication.yaml
