apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llama-8b-model-a
  labels:
    inference.optimization/acceleratorName: "H100"
    llm-d.ai/model: "meta/llama-3.1-8b"
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "multi-inferencepool"
  annotations:
    llm-d.ai/managed: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llama-8b-model-a
  minReplicas: 1
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  metrics:
    - type: External
      external:
        metric:
          name: wva_desired_replicas
          selector:
            matchLabels:
              variant_name: llama-8b-model-a
              exported_namespace: llm-d-optimized-baseline
        target:
          type: AverageValue
          averageValue: "1"
