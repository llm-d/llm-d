# KEDA ScaledObject for direct EPP queue-based autoscaling.
#
# Generic Kubernetes: this ScaledObject scrapes the bundled kube-prometheus-stack
# over plain in-cluster HTTP with no client auth. Do NOT enable TLS on the bundled
# Prometheus for this path — KEDA's prometheus scaler ignores a TriggerAuthentication
# CA unless authModes is also set, so a CA-only "verify the serving cert" trigger
# silently fails. The ocp overlay switches to the Thanos Querier HTTPS endpoint and
# adds authModes:bearer + a metrics-reader TriggerAuthentication.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: optimized-baseline-keda-epp
  namespace: llm-d-optimized-baseline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    # Optimized Baseline example; replace with the Deployment to scale.
    name: optimized-baseline-nvidia-gpu-vllm-decode
  pollingInterval: 15
  # Applies to scale-to-zero. The generated HPA behavior below controls
  # ordinary scale-down while minReplicaCount is 1 or greater.
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 8
  advanced:
    horizontalPodAutoscalerConfig:
      name: keda-hpa-optimized-baseline
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: prometheus
      name: epp-queue-size
      metricType: AverageValue
      metadata:
        # Generic k8s bundled kube-prometheus-stack over plain in-cluster HTTP;
        # replace when the Prometheus service, protocol, or auth setup differs.
        serverAddress: http://llmd-kube-prometheus-stack-prometheus.llm-d-monitoring.svc.cluster.local:9090
        query: >-
          sum(llm_d_epp_flow_control_queue_size{namespace="llm-d-optimized-baseline",service="optimized-baseline-epp",model_name="Qwen/Qwen3-32B"})
        threshold: "1"
    - type: prometheus
      name: epp-running-requests
      metricType: AverageValue
      metadata:
        # Generic k8s bundled kube-prometheus-stack over plain in-cluster HTTP;
        # replace when the Prometheus service, protocol, or auth setup differs.
        serverAddress: http://llmd-kube-prometheus-stack-prometheus.llm-d-monitoring.svc.cluster.local:9090
        query: >-
          sum(llm_d_epp_request_running{namespace="llm-d-optimized-baseline",service="optimized-baseline-epp",model_name="Qwen/Qwen3-32B"})
        threshold: "16"
