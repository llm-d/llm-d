# KEDA TriggerAuthentication for OpenShift Thanos Querier (bearer + CA).
#
# Thanos Querier enforces auth: it rejects unauthenticated queries with 401, and
# KEDA silently serves `fallback` replicas when a trigger errors, so an
# unauthenticated trigger looks healthy while autoscaling does nothing. This
# TriggerAuthentication points KEDA at the metrics-reader ServiceAccount token
# Secret provisioned by recipes/autoscaling/metrics-reader: `token` is the bearer
# token, and `service-ca.crt` is the CA that signs the Thanos serving cert (the
# service-ca operator injects it into the token Secret automatically).
#
# Generic Kubernetes does NOT use this: the base ScaledObject talks to the bundled
# Prometheus over plain in-cluster HTTP with no client auth.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-prometheus-auth
  namespace: llm-d-optimized-baseline
spec:
  secretTargetRef:
    - parameter: bearerToken
      name: keda-epp-metrics-reader-token
      key: token
    - parameter: ca
      name: keda-epp-metrics-reader-token
      key: service-ca.crt
