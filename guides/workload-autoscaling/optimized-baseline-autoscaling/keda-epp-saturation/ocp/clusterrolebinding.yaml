# Grants the metrics-reader ServiceAccount read access to cluster monitoring
# (Thanos Querier / user-workload-monitoring) — the role Thanos requires to
# answer the trigger queries. The namespace transformer rewrites the subject
# namespace to match the deployment namespace.
#
# ClusterRoleBindings are cluster-scoped: when deploying multiple copies of this
# guide to different namespaces on a shared cluster, give this binding a
# namespace-unique name so the bindings do not collide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keda-epp-metrics-reader-monitoring-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: keda-epp-metrics-reader
    namespace: llm-d-optimized-baseline
