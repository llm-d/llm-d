## Enables EPP flow control for KEDA saturation-based autoscaling.
## Flow control is the source of llm_d_epp_flow_control_pool_saturation, but the
## metric is only emitted when a flow-control-engaging plugin (queue-scorer) is
## configured — enabling the featureGate alone (or the optimized-baseline plugins)
## does NOT emit it. This registers the same flow-control plugin set the queue guide
## uses. Layer AFTER optimized-baseline/router/optimized-baseline.values.yaml.

router:
  epp:
    pluginsConfigFile: "keda-epp-saturation-plugins.yaml"
    pluginsCustomConfig:
      keda-epp-saturation-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        featureGates:
        - flowControl
        plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: no-hit-lru-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: no-hit-lru-scorer
            weight: 2
