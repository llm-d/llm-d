# ServiceAccount token Secret that KEDA reads to authenticate to Thanos Querier.
# On OpenShift the token controller populates `token` (the bearer token) and the
# service-ca operator injects `service-ca.crt` (the CA that signs Thanos's
# serving certificate). The TriggerAuthentication references both keys.
apiVersion: v1
kind: Secret
metadata:
  name: keda-epp-metrics-reader-token
  annotations:
    kubernetes.io/service-account.name: keda-epp-metrics-reader
type: kubernetes.io/service-account-token
