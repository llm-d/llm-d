# Generic Kubernetes + saturation signal. Base is plain in-cluster HTTP (no auth);
# the trigger-saturation component inserts the pool-saturation trigger and raises
# the replica cap to 10. Use ocp-saturation on OpenShift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
components:
  - ../components/trigger-saturation
