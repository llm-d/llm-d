# OpenShift auth for the overshoot-guard leaves. Same job as components/ocp-auth
# (adds keda-prometheus-auth and repoints triggers at Thanos Querier over HTTPS
# with authModes:bearer), but the guard rewrites the trigger list to THREE triggers
# -- demand[0], pending[1], replicas[2] -- so this component authenticates all
# three. The windows path keeps two triggers and uses components/ocp-auth instead.
#
# MUST be listed AFTER both the trigger component and overshoot-guard in each OCP
# guard leaf, so that trigger index [2] exists when these patches run. The
# metrics-reader SA/CRB/token Secret is added by the leaf (not here).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  # Own copy: kustomize forbids referencing ../ocp-auth/triggerauthentication.yaml
  # (resource file outside this component's directory). Keep it in sync with
  # components/ocp-auth/triggerauthentication.yaml.
  - triggerauthentication.yaml
patches:
  - target:
      kind: ScaledObject
      name: optimized-baseline-keda-epp
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/serverAddress
        value: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
      - op: add
        path: /spec/triggers/0/metadata/authModes
        value: "bearer"
      - op: add
        path: /spec/triggers/0/authenticationRef
        value:
          name: keda-prometheus-auth
      - op: replace
        path: /spec/triggers/1/metadata/serverAddress
        value: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
      - op: add
        path: /spec/triggers/1/metadata/authModes
        value: "bearer"
      - op: add
        path: /spec/triggers/1/authenticationRef
        value:
          name: keda-prometheus-auth
      - op: replace
        path: /spec/triggers/2/metadata/serverAddress
        value: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
      - op: add
        path: /spec/triggers/2/metadata/authModes
        value: "bearer"
      - op: add
        path: /spec/triggers/2/authenticationRef
        value:
          name: keda-prometheus-auth
