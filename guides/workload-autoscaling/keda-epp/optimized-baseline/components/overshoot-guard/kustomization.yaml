# Overshoot guard: pending-pod-aware scalingModifiers on top of a scaling SIGNAL.
#
# The base ScaledObject scales on a raw demand signal (triggers[0], inserted by a
# trigger-* component) plus a running-requests keep-warm trigger (triggers[1]). On
# a burst the signal climbs while new replicas are still loading their model and
# serving nothing, so the HPA keeps adding replicas it does not need (overshoot).
#
# This component converts the raw signal into a replica-unit `demand` and clamps it
# by the pods that are already on the way:
#   - rename triggers[0] -> `demand` (the signal, now read as a replica count),
#   - remove triggers[1] (running-requests keep-warm; the formula owns scaling now),
#   - append `pending`  = unavailable replicas (pods created, not yet Ready),
#   - append `replicas` = current replica count,
#   - add a scalingModifiers formula that never asks for more than demand and never
#     discounts below the replicas already running:
#       demand <= replicas ? demand : max(demand - (pending ?? 0), replicas)
#   - set scaleUp stabilizationWindowSeconds 0 (the formula, not a time window, is
#     what now damps overshoot), and add a fallback so a trigger error degrades to
#     a single replica instead of failing the ScaledObject.
#
# SIGNAL-AGNOSTIC but UNIT-SENSITIVE: renaming the raw signal to replica-unit
# `demand` is only correct when the signal's per-pod target is 1 (queue depth,
# vllm-waiting). That per-pod target of 1 is set by the trigger-* component's
# `threshold: "1"`; if that threshold is ever changed, `demand` stops being in
# replica units and the formula below silently miscounts, so keep them in step.
# A pool-wide ratio signal (saturation) would need normalization first, so this
# guard is NOT composed onto saturation.
#
# ORDER: list this component AFTER the trigger-* signal component (it rewrites
# triggers[0]/[1]) and BEFORE ocp-auth-guard (which authenticates all 3 triggers).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: ScaledObject
      name: optimized-baseline-keda-epp
    patch: |-
      - op: replace
        path: /spec/triggers/0/name
        value: demand
      - op: remove
        path: /spec/triggers/1
      - op: add
        path: /spec/triggers/-
        value:
          type: prometheus
          name: pending
          metricType: AverageValue
          metadata:
            serverAddress: http://llmd-kube-prometheus-stack-prometheus.llm-d-monitoring.svc.cluster.local:9090
            query: >-
              max(kube_deployment_status_replicas_unavailable{namespace="${NAMESPACE}",deployment="${TARGET_DEPLOYMENT}"})
            threshold: "1"
      - op: add
        path: /spec/triggers/-
        value:
          type: prometheus
          name: replicas
          metricType: AverageValue
          metadata:
            serverAddress: http://llmd-kube-prometheus-stack-prometheus.llm-d-monitoring.svc.cluster.local:9090
            query: >-
              max(kube_deployment_status_replicas{namespace="${NAMESPACE}",deployment="${TARGET_DEPLOYMENT}"})
            threshold: "1"
      - op: add
        path: /spec/advanced/scalingModifiers
        value:
          formula: >-
            demand <= replicas
            ? demand
            : max(demand - (pending ?? 0), replicas)
          target: "1"
          metricType: AverageValue
      - op: replace
        path: /spec/advanced/horizontalPodAutoscalerConfig/behavior/scaleUp/stabilizationWindowSeconds
        value: 0
      - op: add
        path: /spec/fallback
        value:
          failureThreshold: 3
          replicas: 1
          # `static` (scale the target to `replicas`) is the only fallback
          # behavior KEDA accepts here; the valid set is static /
          # currentReplicas / currentReplicasIfHigher / currentReplicasIfLower.
          # `behavior` picks how `replicas` is read, not which scaler runs, so
          # scalingModifiers still drives normal scaling; this only takes over
          # when the composite metric is unreadable failureThreshold times.
          behavior: static
