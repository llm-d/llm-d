
# Generic Kubernetes + flow-control-off inflight signal.
#
# The full ScaledObject is in scaledobject.yaml; this overlay only makes it a
# kustomize target so the guide's
# `kubectl kustomize ... | envsubst | kubectl apply -f -` command is uniform
# across platforms. Apply on non-OpenShift clusters; use overlays/ocp/inflight
# on OpenShift.
#
# Unlike the queue and saturation paths, inflight does not require EPP Flow
# Control or a router overlay; every optimized-baseline EPP already emits
# llm_d_epp_inflight_requests via its inflight-load-producer plugin, so this
# leaf only needs the ScaledObject.
