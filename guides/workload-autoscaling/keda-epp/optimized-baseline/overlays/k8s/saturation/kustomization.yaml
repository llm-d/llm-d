# Generic Kubernetes + saturation signal (stabilization-window overshoot
# solution). The full ScaledObject is in scaledobject.yaml; this overlay only
# makes it a kustomize target so the guide's apply command is uniform across
# platforms. Use overlays/ocp/saturation on OpenShift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - scaledobject.yaml
