# KEDA ScaledObject - OpenShift, in-flight-load signal, NO Flow Control.
#
# Same signal as overlays/k8s/inflight (epp-inflight-requests, per-replica target
# 16) but the trigger queries the OpenShift Thanos Querier over HTTPS with
# authModes:bearer and authenticationRef:keda-prometheus-auth. The
# TriggerAuthentication and the metrics-reader RBAC it needs are added by this
# overlay's kustomization.yaml. Flow Control is NOT required for this path.
#
# ${...} placeholders are rendered by envsubst at apply time (see the guide).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: optimized-baseline-keda-epp
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${TARGET_DEPLOYMENT}
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 8
  advanced:
    horizontalPodAutoscalerConfig:
      name: keda-hpa-optimized-baseline
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: prometheus
      name: epp-inflight-requests
      metricType: AverageValue
      metadata:
        serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        query: >-
          sum(llm_d_epp_inflight_requests{namespace="${NAMESPACE}",producer_name="inflight-load-producer"})
        threshold: "16"
        authModes: "bearer"
      authenticationRef:
        name: keda-prometheus-auth
