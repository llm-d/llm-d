# OpenShift + queue signal + demand-aware overshoot guard. See overlays/ocp/queue
# for the namespace-transformer, TriggerAuthentication, metrics-reader, and
# ClusterRoleBinding name/subject-patch rationale; this overlay is identical except
# the ScaledObject is the four-trigger guard with the scalingModifiers formula.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${NAMESPACE}

resources:
  - scaledobject.yaml

components:
  - ../../../components/ocp-trigger-auth
  - ../../../../../../recipes/autoscaling/metrics-reader

patches:
  - target:
      kind: ClusterRoleBinding
      name: keda-epp-metrics-reader-monitoring-view
    patch: |-
      - op: replace
        path: /metadata/name
        value: keda-epp-metrics-reader-monitoring-view-${NAMESPACE}
      - op: replace
        path: /subjects/0/namespace
        value: ${NAMESPACE}
