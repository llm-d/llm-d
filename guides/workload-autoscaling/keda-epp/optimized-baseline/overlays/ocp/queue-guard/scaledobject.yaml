# KEDA ScaledObject - OpenShift, queue signal, demand-aware overshoot guard.
#
# Same guard as overlays/k8s/queue-guard (four triggers - queue, running,
# unavailableReplicas, replicas - combined by a scalingModifiers formula that
# reproduces the windows path's demand as required_replicas = max of each signal
# divided by its per-replica target, then discounts by unavailableReplicas and floors
# at replicas; scaleUp window 0; fallback to a single replica). See the k8s file
# header for the full formula rationale and why the per-replica targets are named in
# the formula rather than carried by the trigger thresholds.
#
# The difference here is platform auth: triggers query the OpenShift Thanos Querier
# over HTTPS with authModes:bearer and authenticationRef:keda-prometheus-auth. The
# TriggerAuthentication and the metrics-reader RBAC it needs are added by this
# overlay's kustomization.yaml. kube-state-metrics must be scraped into the same
# monitoring stack for the unavailableReplicas/replicas triggers.
#
# ${...} placeholders are rendered by envsubst at apply time (see the guide).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: optimized-baseline-keda-epp
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${TARGET_DEPLOYMENT}
  pollingInterval: 15
  # Applies to scale-to-zero. The generated HPA behavior below controls ordinary
  # scale-down while minReplicaCount is 1 or greater.
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 8
  advanced:
    horizontalPodAutoscalerConfig:
      name: keda-hpa-optimized-baseline
      behavior:
        scaleUp:
          # 0: the scalingModifiers formula (not a time window) absorbs overshoot;
          # see overlays/k8s/queue-guard.
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
    scalingModifiers:
      # queue_per_replica / running_per_replica are the per-replica targets, named
      # here because KEDA feeds the formula raw metric values and ignores the
      # trigger thresholds. See overlays/k8s/queue-guard for the full rationale.
      formula: >-
        let queue_per_replica = 1;
        let running_per_replica = 16;
        let queue_replicas = queue / queue_per_replica;
        let running_replicas = running / running_per_replica;
        let required_replicas = max(queue_replicas, running_replicas);
        required_replicas <= replicas
        ? required_replicas
        : max(required_replicas - (unavailableReplicas ?? 0), replicas)
      target: "1"
      metricType: AverageValue
  triggers:
    - type: prometheus
      name: queue
      metricType: AverageValue
      metadata:
        serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        query: >-
          sum(llm_d_epp_flow_control_queue_size{namespace="${NAMESPACE}",service="${EPP_SERVICE}",model_name="${MODEL}"})
        # Inert for the formula (KEDA ignores trigger thresholds for scalingModifiers
        # inputs); kept equal to the formula's queue_per_replica so they cannot drift.
        threshold: "1"
        authModes: "bearer"
      authenticationRef:
        name: keda-prometheus-auth
    - type: prometheus
      name: running
      metricType: AverageValue
      metadata:
        serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        query: >-
          sum(llm_d_epp_request_running{namespace="${NAMESPACE}",service="${EPP_SERVICE}",model_name="${MODEL}"})
        # Inert for the formula; kept equal to the formula's running_per_replica.
        threshold: "16"
        authModes: "bearer"
      authenticationRef:
        name: keda-prometheus-auth
    - type: prometheus
      # Name matches the Deployment status field (status.unavailableReplicas); the
      # formula references it as unavailableReplicas.
      name: unavailableReplicas
      metricType: AverageValue
      metadata:
        serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        query: >-
          max(kube_deployment_status_replicas_unavailable{namespace="${NAMESPACE}",deployment="${TARGET_DEPLOYMENT}"})
        threshold: "1"
        authModes: "bearer"
      authenticationRef:
        name: keda-prometheus-auth
    - type: prometheus
      name: replicas
      metricType: AverageValue
      metadata:
        serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        query: >-
          max(kube_deployment_status_replicas{namespace="${NAMESPACE}",deployment="${TARGET_DEPLOYMENT}"})
        threshold: "1"
        authModes: "bearer"
      authenticationRef:
        name: keda-prometheus-auth
  fallback:
    failureThreshold: 3
    replicas: 1
    # `static` scales the target to `replicas` when the composite metric is
    # unreadable failureThreshold times; see overlays/k8s/queue-guard.
    behavior: static
