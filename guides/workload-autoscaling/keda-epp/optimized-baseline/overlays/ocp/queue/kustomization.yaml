# OpenShift + queue signal (stabilization-window overshoot solution).
#
# The ScaledObject (scaledobject.yaml) carries the Thanos Querier serverAddress
# and authModes:bearer + authenticationRef inline, so there is no trigger
# patching here. This overlay adds the pieces the ScaledObject depends on:
#   - the namespace transformer (rendered from ${NAMESPACE} by envsubst), which
#     also moves the TriggerAuthentication and the metrics-reader ServiceAccount
#     into the deployment namespace,
#   - components/ocp-trigger-auth: the keda-prometheus-auth TriggerAuthentication,
#   - recipes/autoscaling/metrics-reader: the SA, token Secret, and CRB that grant
#     cluster-monitoring-view so Thanos accepts the queries.
#
# The namespace transformer does NOT rewrite the metrics-reader ClusterRoleBinding
# subject namespace (kustomize leaves an explicit subject namespace as-is), so the
# patch below sets it to ${NAMESPACE} too. Without it the binding points at the
# wrong namespace on any non-default deployment, the SA is not granted
# cluster-monitoring-view, and Thanos rejects the query (401 unauthenticated, 403
# when the SA lacks the role). The shared recipe stays untouched so the other
# guides that apply it with plain `kubectl apply -k` keep working.
#
# The ClusterRoleBinding is cluster-scoped, so the patch also makes its name
# namespace-unique (...-${NAMESPACE}); otherwise a second deployment on the same
# cluster would overwrite the shared binding and steal it from the first
# namespace. The SA and token Secret are namespace-scoped and need no rename.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${NAMESPACE}

resources:
  - scaledobject.yaml

components:
  - ../../../components/ocp-trigger-auth
  - ../../../../../../recipes/autoscaling/metrics-reader

patches:
  - target:
      kind: ClusterRoleBinding
      name: keda-epp-metrics-reader-monitoring-view
    patch: |-
      - op: replace
        path: /metadata/name
        value: keda-epp-metrics-reader-monitoring-view-${NAMESPACE}
      - op: replace
        path: /subjects/0/namespace
        value: ${NAMESPACE}
