# OpenShift + queue signal (windows overshoot solution). The namespace
# transformer rewrites the base ScaledObject, the TriggerAuthentication, and the
# metrics-reader ServiceAccount to the deployment namespace; it is rendered from
# ${NAMESPACE} by envsubst at apply time (see the guide).
#
# Component order matters: trigger-queue inserts the signal trigger BEFORE
# ocp-auth patches both triggers.
#
# The namespace transformer does NOT rewrite the metrics-reader
# ClusterRoleBinding subject namespace (kustomize leaves an explicit subject
# namespace as-is), so the patch below sets it to ${NAMESPACE} too. Without it the
# binding points at the wrong namespace on any non-default deployment, the SA is
# not granted cluster-monitoring-view, and Thanos rejects the query (401 when
# unauthenticated, 403 when the SA lacks the role). The trigger then errors and the
# ScaledObject goes Ready=False with KEDAScalerFailed events; no `fallback` is
# configured, so autoscaling fails visibly rather than silently. The shared recipe
# stays untouched so the other guides that apply it with plain `kubectl apply -k`
# keep working.
#
# The ClusterRoleBinding is cluster-scoped, so the patch also makes its name
# namespace-unique (...-${NAMESPACE}); otherwise a second deployment on the same
# cluster would overwrite the shared binding and steal it from the first
# namespace. The SA and token Secret are namespace-scoped and need no rename.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${NAMESPACE}

resources:
  - ../../../base

components:
  - ../../../components/trigger-queue
  - ../../../components/ocp-auth
  - ../../../../../../recipes/autoscaling/metrics-reader

patches:
  - target:
      kind: ClusterRoleBinding
      name: keda-epp-metrics-reader-monitoring-view
    patch: |-
      - op: replace
        path: /metadata/name
        value: keda-epp-metrics-reader-monitoring-view-${NAMESPACE}
      - op: replace
        path: /subjects/0/namespace
        value: ${NAMESPACE}
