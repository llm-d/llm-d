# KEDA ScaledObject - OpenShift, saturation signal, stabilization-window overshoot
# solution.
#
# Same as overlays/k8s/saturation (pool-saturation per-replica target 0.7 raced
# with epp-running-requests per-replica target 16; maxReplicaCount 10; overshoot by
# the 300s stabilization windows), but the triggers query the OpenShift Thanos
# Querier over HTTPS with authModes:bearer and authenticationRef:keda-prometheus-auth.
# The demand-aware guard is NOT offered for this signal (the replica-unit demand
# conversion is only correct for queue depth, not a pool-wide ratio).
#
# ${...} placeholders are rendered by envsubst at apply time (see the guide).
# inference_pool is the InferencePool name (the EPP's --pool-name), its own
# ${INFERENCE_POOL} var (default optimized-baseline), NOT the namespace.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: optimized-baseline-keda-epp
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${TARGET_DEPLOYMENT}
  pollingInterval: 15
  # Applies to scale-to-zero. The generated HPA behavior below controls ordinary
  # scale-down while minReplicaCount is 1 or greater.
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 10
  advanced:
    horizontalPodAutoscalerConfig:
      name: keda-hpa-optimized-baseline
      # Startup-time mitigation; see overlays/k8s/queue for the full rationale.
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: prometheus
      name: pool-saturation
      metricType: AverageValue
      metadata:
        serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        query: >-
          max(llm_d_epp_flow_control_pool_saturation{inference_pool="${INFERENCE_POOL}",namespace="${NAMESPACE}"})
        threshold: "0.7"
        authModes: "bearer"
      authenticationRef:
        name: keda-prometheus-auth
    - type: prometheus
      name: epp-running-requests
      metricType: AverageValue
      metadata:
        serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        query: >-
          sum(llm_d_epp_request_running{namespace="${NAMESPACE}",service="${EPP_SERVICE}",model_name="${MODEL}"})
        threshold: "16"
        authModes: "bearer"
      authenticationRef:
        name: keda-prometheus-auth
