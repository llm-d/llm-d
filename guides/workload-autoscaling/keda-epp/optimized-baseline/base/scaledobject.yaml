# KEDA ScaledObject for KEDA + EPP autoscaling (trigger-agnostic base).
#
# This base carries only the shared running-requests trigger and the HPA
# behavior. The scaling SIGNAL is added by a kustomize component, which INSERTS
# its trigger at index 0 (so the signal is triggers[0], running-requests[1]):
#   components/trigger-queue        -> EPP flow-control queue size
#   components/trigger-saturation   -> EPP pool saturation
#
# Generic Kubernetes: triggers scrape the bundled kube-prometheus-stack over
# plain in-cluster HTTP with no client auth. Do NOT enable TLS on the bundled
# Prometheus for this path - KEDA's prometheus scaler ignores a
# TriggerAuthentication CA unless authModes is also set, so a CA-only trigger
# silently fails (see PR #2571). The ocp-auth component switches triggers to the
# Thanos Querier HTTPS endpoint and adds authModes:bearer + a metrics-reader
# TriggerAuthentication.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: optimized-baseline-keda-epp
  # Rendered by `envsubst` at apply time (see the guide's apply step). Defaults to
  # the optimized-baseline example; set NAMESPACE for your own deployment.
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    # Deployment to scale; rendered by envsubst (TARGET_DEPLOYMENT).
    name: ${TARGET_DEPLOYMENT}
  pollingInterval: 15
  # Applies to scale-to-zero. The generated HPA behavior below controls
  # ordinary scale-down while minReplicaCount is 1 or greater.
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 8
  advanced:
    horizontalPodAutoscalerConfig:
      name: keda-hpa-optimized-baseline
      # Startup-time mitigation. Model-server pods take minutes to load a model
      # and become Ready. While a new replica is still starting it does not serve
      # traffic, so the demand signal stays elevated (risking scale-up overshoot)
      # and then collapses once the pod goes Ready (risking scale-down flapping).
      # Both stabilization windows damp that. Size scaleUp near the target
      # Deployment's cold-start time so the HPA waits for a starting replica to
      # relieve demand before adding another; size scaleDown to hold capacity
      # across brief demand dips. See "Startup-time mitigation" in the README.
      behavior:
        scaleUp:
          # Was 0. Hold scale-up recommendations for the pod cold-start window so
          # a still-loading replica is not counted as unmet demand. Lower it if
          # your model loads quickly and you need faster reaction to bursts.
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: prometheus
      name: epp-running-requests
      metricType: AverageValue
      metadata:
        # Generic k8s bundled kube-prometheus-stack over plain in-cluster HTTP;
        # replace when the Prometheus service, protocol, or auth setup differs.
        serverAddress: http://llmd-kube-prometheus-stack-prometheus.llm-d-monitoring.svc.cluster.local:9090
        query: >-
          sum(llm_d_epp_request_running{namespace="${NAMESPACE}",service="${EPP_SERVICE}",model_name="${MODEL}"})
        threshold: "16"
