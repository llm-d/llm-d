name: keda-epp

env:
  static:
    BRANCH: main
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))

    NAMESPACE: llm-d-optimized-baseline
    MONITORING_NAMESPACE: llm-d-monitoring

    # Namespace the KEDA operator runs in. `keda` matches a generic KEDA install
    # (ENV=existing); on OpenShift (ENV=ocp) the Custom Metrics Autoscaler operator
    # lives in `openshift-keda`, and the Troubleshooting `kubectl logs -n
    # ${KEDA_NAMESPACE}` command keys off this, so set it to match your platform.
    KEDA_NAMESPACE: {default: keda, values: [keda, openshift-keda]}

    MODEL: {default: "Qwen/Qwen3-32B"}

    # Deployment the ScaledObject targets, and the KEDA-managed objects it creates.
    TARGET_DEPLOYMENT: {default: "optimized-baseline-nvidia-gpu-vllm-decode"}
    SCALEDOBJECT_NAME: {default: "optimized-baseline-keda-epp"}
    HPA_NAME: {default: "keda-hpa-optimized-baseline"}

    # EPP service name (the `service` label on EPP metrics) and the InferencePool
    # name (the `inference_pool` label on pool-saturation; the EPP --pool-name /
    # Helm release name, NOT the namespace). Rendered into the overlay PromQL by
    # envsubst at apply time.
    EPP_SERVICE: {default: "optimized-baseline-epp"}
    INFERENCE_POOL: {default: "optimized-baseline"}

    # Scaling signal. `queue` = EPP flow-control queue size (default, mature).
    # `saturation` = EPP pool saturation (alternative, experimental - no nightly
    # coverage yet). Rendered as an annotation only; it selects which leaf overlay
    # the deploy step names, it does not gate execution.
    SIGNAL: {default: queue, values: [queue, saturation]}

    # Target platform. `existing` = generic Kubernetes with the bundled
    # kube-prometheus-stack over plain in-cluster HTTP. `ocp` = OpenShift with
    # Thanos Querier (reuses recipes/autoscaling/metrics-reader). Rendered as an
    # annotation only - it does not gate execution.
    ENV: {default: existing, values: [existing, ocp]}

    # Autoscaling overlays for this guide (leaf = overlays/<platform>/<signal>).
    OVERLAY_ROOT: ${REPO_ROOT}/guides/workload-autoscaling/keda-epp/optimized-baseline

  source: ["${REPO_ROOT}/guides/env.sh"]

prerequisites:
  # Prereq: complete the optimized-baseline guide (incl. enabling monitoring) and
  # install KEDA. Then upgrade the router with the KEDA+EPP overlay, which turns on
  # EPP Flow Control (both the queue-size and pool-saturation signals come from the
  # flow-control subsystem) while keeping the monitoring feature values (EPP metrics
  # port and its ServiceMonitor) enabled.
  router:
    - run: |
        helm upgrade optimized-baseline \
          ${ROUTER_STANDALONE_CHART} \
          -f ${REPO_ROOT}/guides/recipes/router/base.values.yaml \
          -f ${REPO_ROOT}/guides/optimized-baseline/router/optimized-baseline.values.yaml \
          -f ${REPO_ROOT}/guides/recipes/router/features/monitoring.values.yaml \
          -f ${OVERLAY_ROOT}/router.values.yaml \
          -n ${NAMESPACE} --version ${ROUTER_CHART_VERSION}
  confirm:
    - run: |
        kubectl logs deployment/optimized-baseline-epp -c epp -n ${NAMESPACE} | grep "Initializing Flow Control layer"
        kubectl get servicemonitor -n ${NAMESPACE}

deploy:
  # Begin at one replica so a 1-to-N scale-up is observable.
  prepare:
    - run: |
        kubectl scale deployment ${TARGET_DEPLOYMENT} -n ${NAMESPACE} --replicas=1
        kubectl rollout status deployment/${TARGET_DEPLOYMENT} -n ${NAMESPACE} --timeout=15m

  # Apply the leaf overlay for the chosen SIGNAL x ENV. The overlay carries ${...}
  # placeholders (namespace, model, deployment, EPP service, inference pool), so
  # the leaf is built and piped through envsubst before kubectl applies it.
  # Generic Kubernetes uses the bundled kube-prometheus-stack over plain
  # in-cluster HTTP with no client auth; OpenShift uses Thanos Querier + the
  # shared metrics-reader recipe.
  apply_k8s_queue:
    - when: {SIGNAL: [queue], ENV: [existing]}
      run: kubectl kustomize ${OVERLAY_ROOT}/overlays/k8s/queue | envsubst '$NAMESPACE $MODEL $TARGET_DEPLOYMENT $EPP_SERVICE $INFERENCE_POOL' | kubectl apply -f -
  apply_k8s_saturation:
    - when: {SIGNAL: [saturation], ENV: [existing]}
      run: kubectl kustomize ${OVERLAY_ROOT}/overlays/k8s/saturation | envsubst '$NAMESPACE $MODEL $TARGET_DEPLOYMENT $EPP_SERVICE $INFERENCE_POOL' | kubectl apply -f -
  apply_ocp_queue:
    - when: {SIGNAL: [queue], ENV: [ocp]}
      run: kubectl kustomize ${OVERLAY_ROOT}/overlays/ocp/queue | envsubst '$NAMESPACE $MODEL $TARGET_DEPLOYMENT $EPP_SERVICE $INFERENCE_POOL' | kubectl apply -f -
  apply_ocp_saturation:
    - when: {SIGNAL: [saturation], ENV: [ocp]}
      run: kubectl kustomize ${OVERLAY_ROOT}/overlays/ocp/saturation | envsubst '$NAMESPACE $MODEL $TARGET_DEPLOYMENT $EPP_SERVICE $INFERENCE_POOL' | kubectl apply -f -

verify:
  # ScaledObject Ready=True confirms the scaler config is valid; KEDA then creates
  # the named HPA. A non-empty currentMetrics list shows the HPA is receiving KEDA's
  # external metrics (it can take several polling intervals to appear). The
  # scale_event test then proves load actually drives a scaling DECISION.
  tests:
    scaledobject:
      - run: |
          kubectl get scaledobject ${SCALEDOBJECT_NAME} -n ${NAMESPACE}
          kubectl wait --for=condition=Ready scaledobject/${SCALEDOBJECT_NAME} -n ${NAMESPACE} --timeout=120s
    hpa:
      - run: |
          kubectl get hpa ${HPA_NAME} -n ${NAMESPACE}
          kubectl get hpa ${HPA_NAME} -n ${NAMESPACE} -o jsonpath='{.status.currentMetrics}' | jq

    # Fire a concurrent burst and assert the KEDA scale event fired:
    #   baseline desiredReplicas == min -> burst -> desiredReplicas > min (up)
    #                                   -> drain -> desiredReplicas == min (down)
    # We assert the autoscaler DECISION (hpa .status.desiredReplicas), NOT that the
    # new pod becomes Ready - on a contended GPU cluster the 2nd replica may stay
    # Pending. desiredReplicas>min transitively proves the whole chain worked: EPP
    # emits the metric -> Prometheus/Thanos -> KEDA reads it over threshold -> HPA
    # raises the target. Ported from .github/scripts/e2e/e2e-validate-scale-event.sh.
    scale_event:
      - run: |
          # Burst/timeout knobs (override via env). SCALE_UP_TIMEOUT and
          # SCALE_DOWN_TIMEOUT are generous ceilings sized to the 300s
          # scaleUp/scaleDown stabilization windows (a full window can elapse before
          # the HPA acts on a decision); the nightly lowers these windows in its
          # overlay and can override the timeouts shorter.
          # The defaults below drive scale-up through the running-request term
          # (per-replica target 16) before any queue forms. To exercise the
          # queue-driven trigger specifically, raise SCALE_CONCURRENCY and
          # SCALE_MAX_TOKENS until llm_d_epp_flow_control_queue_size goes non-zero;
          # the queue only forms once load exceeds a replica's serving capacity, and
          # the threshold depends on the model, GPU, tensor-parallel degree, and
          # max-model-len (a larger model queues at lower concurrency), so climb from
          # a few hundred concurrent requests rather than assuming a fixed value.
          : "${SCALE_CONCURRENCY:=30}" "${SCALE_TOTAL:=400}" "${SCALE_MAX_TOKENS:=512}" "${SCALE_UP_TIMEOUT:=360}" "${SCALE_DOWN_TIMEOUT:=360}"
          MIN=$(kubectl get hpa ${HPA_NAME} -n ${NAMESPACE} -o jsonpath='{.spec.minReplicas}' 2>/dev/null); MIN=${MIN:-1}
          HOST=$(kubectl get service optimized-baseline-epp -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}'):80
          POD=curl-scale-$$
          trap 'kubectl delete pod -n ${NAMESPACE} $POD --ignore-not-found --wait=false >/dev/null 2>&1 || true' EXIT
          kubectl run $POD -n ${NAMESPACE} --image=curlimages/curl --restart=Never -- sleep 3600 >/dev/null
          kubectl wait --for=condition=Ready pod/$POD -n ${NAMESPACE} --timeout=120s
          printf '{"model":"%s","prompt":"Write a very long, detailed story about a robot that learns to paint.","max_tokens":%s}' "${MODEL}" "${SCALE_MAX_TOKENS}" \
            | kubectl exec -i -n ${NAMESPACE} $POD -- tee /tmp/payload.json >/dev/null
          BASE=$(kubectl get hpa ${HPA_NAME} -n ${NAMESPACE} -o jsonpath='{.status.desiredReplicas}' 2>/dev/null); BASE=${BASE:-$MIN}
          [ "$BASE" -le "$MIN" ] || { echo "baseline desiredReplicas=$BASE already above min=$MIN"; exit 1; }
          echo "-- firing burst (concurrency=${SCALE_CONCURRENCY} total=${SCALE_TOTAL}) to drive running-requests over threshold --"
          kubectl exec -n ${NAMESPACE} $POD -- sh -c \
            "seq 1 ${SCALE_TOTAL} | xargs -I{} -P ${SCALE_CONCURRENCY} curl -sS --max-time 300 -o /dev/null -X POST http://${HOST}/v1/completions -H 'content-type: application/json' --data-binary @/tmp/payload.json" >/dev/null 2>&1 &
          BURST=$!
          up=false; end=$((SECONDS + SCALE_UP_TIMEOUT))
          while [ $SECONDS -lt $end ]; do
            d=$(kubectl get hpa ${HPA_NAME} -n ${NAMESPACE} -o jsonpath='{.status.desiredReplicas}' 2>/dev/null)
            if [ -n "$d" ] && [ "$d" -gt "$MIN" ]; then echo "  scale-up decision: desiredReplicas=$d"; up=true; break; fi
            sleep 5
          done
          kill $BURST 2>/dev/null || true
          kubectl delete pod -n ${NAMESPACE} $POD --ignore-not-found --wait=false >/dev/null 2>&1 || true
          $up || { echo "no scale-up within ${SCALE_UP_TIMEOUT}s (raise SCALE_CONCURRENCY / SCALE_MAX_TOKENS, or check the trigger)"; exit 1; }
          echo "-- load stopped; waiting up to ${SCALE_DOWN_TIMEOUT}s for scale-down (matches the 300s scaleDown window) --"
          down=false; end=$((SECONDS + SCALE_DOWN_TIMEOUT))
          while [ $SECONDS -lt $end ]; do
            d=$(kubectl get hpa ${HPA_NAME} -n ${NAMESPACE} -o jsonpath='{.status.desiredReplicas}' 2>/dev/null)
            if [ -n "$d" ] && [ "$d" -le "$MIN" ]; then echo "  scale-down decision: desiredReplicas=$d"; down=true; break; fi
            sleep 5
          done
          $down || { echo "no scale-down within ${SCALE_DOWN_TIMEOUT}s (check scaleDown stabilization/cooldown)"; exit 1; }
          echo "Scale-event verified: min ${MIN} -> >${MIN} -> ${MIN} (decision asserted; 2nd-pod readiness intentionally not required)"

cleanup:
  # Deleting the ScaledObject also removes the KEDA-managed HPA. It does not delete
  # the target Deployment or reset its replica count.
  - when: {SIGNAL: [queue], ENV: [existing]}
    run: kubectl kustomize ${OVERLAY_ROOT}/overlays/k8s/queue | envsubst '$NAMESPACE $MODEL $TARGET_DEPLOYMENT $EPP_SERVICE $INFERENCE_POOL' | kubectl delete --ignore-not-found=true -f -
  - when: {SIGNAL: [saturation], ENV: [existing]}
    run: kubectl kustomize ${OVERLAY_ROOT}/overlays/k8s/saturation | envsubst '$NAMESPACE $MODEL $TARGET_DEPLOYMENT $EPP_SERVICE $INFERENCE_POOL' | kubectl delete --ignore-not-found=true -f -
  - when: {SIGNAL: [queue], ENV: [ocp]}
    run: kubectl kustomize ${OVERLAY_ROOT}/overlays/ocp/queue | envsubst '$NAMESPACE $MODEL $TARGET_DEPLOYMENT $EPP_SERVICE $INFERENCE_POOL' | kubectl delete --ignore-not-found=true -f -
  - when: {SIGNAL: [saturation], ENV: [ocp]}
    run: kubectl kustomize ${OVERLAY_ROOT}/overlays/ocp/saturation | envsubst '$NAMESPACE $MODEL $TARGET_DEPLOYMENT $EPP_SERVICE $INFERENCE_POOL' | kubectl delete --ignore-not-found=true -f -
