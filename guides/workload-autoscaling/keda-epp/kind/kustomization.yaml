apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-d-optimized-baseline
resources:
  - ../../../optimized-baseline/modelserver/gpu/vllm/base
  - ../scaledobject.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: optimized-baseline-nvidia-gpu-vllm-decode
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0@sha256:be957b008416a645f206532aad408b5ff29dc81c628b8486479e79d0c2b3801b
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: remove
        path: /spec/template/spec/containers/0/command
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --model
          - random/model
          - --served-model-name
          - Qwen/Qwen3-32B
          - --port
          - "8000"
          - --latency-calculator
          - constant
          - --time-to-first-token
          - 180s
          - --time-to-first-token-std-dev
          - 0s
          - --inter-token-latency
          - 10ms
          - --inter-token-latency-std-dev
          - 0s
          - --max-num-seqs
          - "1"
          - --seed
          - "1"
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts
        value: []
      - op: replace
        path: /spec/template/spec/volumes
        value: []
