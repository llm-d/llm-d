router:
  epp:
    replicas: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: v0.9.0@sha256:873179822ab0895a37ea09f2112ca39a6ae50a26612561c8bfad7f9a8c5af6f5
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 384Mi
    pluginsCustomConfig:
      optimized-baseline-keda-epp-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        featureGates:
        - flowControl
        plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: no-hit-lru-scorer
        - type: round-robin-fairness-policy
        - type: fcfs-ordering-policy
        - type: concurrency-detector
          parameters:
            maxConcurrency: 1
            concurrencyMode: requests
            headroom: 0.0
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: no-hit-lru-scorer
            weight: 2
        flowControl:
          maxBytes: 1Mi
          maxRequests: "10"
          defaultRequestTTL: 300s
          saturationDetector:
            pluginRef: concurrency-detector
          priorityBands:
          - priority: 0
            maxRequests: "10"
            fairnessPolicyRef: round-robin-fairness-policy
            orderingPolicyRef: fcfs-ordering-policy
  proxy:
    args:
      - --service-node
      - envoy-sidecar
      - --log-level
      - warn
      - --concurrency
      - "1"
      - --drain-strategy
      - immediate
      - --drain-time-s
      - "10"
      - -c
      - /etc/envoy/envoy.yaml
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 192Mi
