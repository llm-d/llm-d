inferenceExtension:
  replicas: 1
  flags:
  image:
    # both downstream inference-scheduler and upstream epp image can support workload-autoscaling example
    ###################
    name: llm-d-inference-scheduler
    hub: ghcr.io/llm-d
    tag: v0.7.0
    pullPolicy: Always
  extProcPort: 9002
  pluginsConfigFile: "default-plugins.yaml"
  # Distributed tracing configuration (OpenTelemetry)
  tracing:
    enabled: false
    # otelExporterEndpoint: "http://otel-collector:4317"
    # sampling:
    #   sampler: "parentbased_traceidratio"
    #   samplerArg: "0.1"
  # GenAI payload capture — prompts and completions as OTel events (opt-in).
  # See docs/proposals/genai-payload-events.md for security implications.
  payloadCapture:
    enabled: false
    # backend: noop            # noop | inline | gcs | s3 | filesystem
    # inlineSizeThresholdBytes: 4096
    # offloadBackend: ""
    # gcs:
    #   bucket: ""
    #   prefix: "llm-d/payloads"
    # s3:
    #   bucket: ""
    #   endpoint: ""
    #   prefix: "llm-d/payloads"
    #   region: "us-east-1"
    # filesystem:
    #   mountPath: "/var/llm-d/payloads"
    # redaction:
    #   enabled: false
    #   builtinPatterns: true
    #   patterns: []
    #   webhookURL: ""
  monitoring:
    interval: "10s"
    # Prometheus ServiceMonitor will be created when enabled for EPP metrics collection
    prometheus:
      enabled: true
      auth:
        # To allow unauthenticated /metrics access (e.g., for debugging with curl), set to false
        enabled: true
inferencePool:
  targetPorts:
    - number: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/guide: "workload-autoscaling"
