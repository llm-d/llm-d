apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-d-optimized-baseline

resources:
  - github.com/llm-d/llm-d-workload-variant-autoscaler/config/overlays/namespace-scoped/kubernetes?ref=release-0.9
  - ../../base

patches:
  - path: controller-deployment-patch.yaml
    target:
      kind: Deployment
      name: wva-controller-manager

# WVA is deprecated: pin the controller to the final release-0.9 image rather
# than tracking whatever tag the upstream overlay happens to carry.
images:
  - name: ghcr.io/llm-d/llm-d-workload-variant-autoscaler
    newTag: v0.9.0
