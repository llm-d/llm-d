name: wva

env:
  static:
    BRANCH: main
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))

    NAMESPACE:            llm-d-optimized-baseline
    WVA_NAMESPACE:        llm-d-optimized-baseline
    MONITORING_NAMESPACE: llm-d-monitoring

    MODEL: { default: "Qwen/Qwen3-32B" }

    # Platform overlay for both the controller install and the KEDA consumption
    # overlay (`k8s` = generic Kubernetes, `ocp` = OpenShift/Thanos). Used
    # literally in the overlay paths below.
    PLATFORM: { default: k8s, values: [k8s, ocp] }

    # WVA controller install (topology-agnostic) and the KEDA consumption overlay
    # (Model A: <strategy>/<topology>).
    CONTROLLER_ROOT:  ${REPO_ROOT}/guides/workload-autoscaling/wva/controller
    CONSUMPTION_ROOT: ${REPO_ROOT}/guides/workload-autoscaling/wva/optimized-baseline

  source: ["${REPO_ROOT}/guides/env.sh"]

prerequisites:
  # WVA only watches ScaledObjects if the KEDA CRD is present when the controller
  # starts, so confirm KEDA is installed first.
  keda:
    - run: kubectl get crd scaledobjects.keda.sh

deploy:
  # Extract the Prometheus CA and create the prometheus-tls-cert Secret so WVA can
  # reach the Prometheus API over HTTPS.
  prometheus_ca:
    - run: |
        PROMETHEUS_CA_CERT=$(kubectl get secret prometheus-web-tls -n ${MONITORING_NAMESPACE} -o jsonpath='{.data.tls\.crt}' | base64 -d)
        kubectl create secret generic prometheus-tls-cert \
          --from-literal=ca.crt="${PROMETHEUS_CA_CERT}" \
          --dry-run=client -o yaml | kubectl apply -f - -n ${WVA_NAMESPACE}

  # Install the WVA CRDs (from the WVA controller repo).
  crds:
    - run: kubectl apply -k github.com/llm-d/llm-d-workload-variant-autoscaler/config/base/crd?ref=main

  # Install the WVA controller. Point the overlay at ${WVA_NAMESPACE} and set the
  # controller's --watch-namespace to match (this edits
  # platform/${PLATFORM}/kustomization.yaml and base/controller-deployment-patch.yaml;
  # revert both with `git checkout` afterwards), then apply it (no -n needed).
  controller:
    - run: |
        (cd ${CONTROLLER_ROOT}/platform/${PLATFORM} && kustomize edit set namespace ${WVA_NAMESPACE})

        sed -i.bak "s|--watch-namespace=.*|--watch-namespace=${WVA_NAMESPACE}|" \
          ${CONTROLLER_ROOT}/base/controller-deployment-patch.yaml \
          && rm ${CONTROLLER_ROOT}/base/controller-deployment-patch.yaml.bak

        kubectl apply -k ${CONTROLLER_ROOT}/platform/${PLATFORM}

  # Enable autoscaling via KEDA (recommended): the ScaledObject reads
  # wva_desired_replicas and creates its own HPA. (Using a plain HPA directly is a
  # documented alternative in the README — do not apply both; they conflict.)
  scaledobject:
    - run: kubectl apply -k ${CONSUMPTION_ROOT}/keda/${PLATFORM} -n ${NAMESPACE}

verify:
  tests:
    controller:
      - run: |
          kubectl rollout status deployment/wva-controller-manager -n ${WVA_NAMESPACE} --timeout=180s
          kubectl get deployment -n ${WVA_NAMESPACE}
    scaler:
      - run: |
          kubectl get scaledobject -n ${NAMESPACE}
          kubectl get hpa -n ${NAMESPACE}

cleanup:
  - run: kubectl delete -k ${CONSUMPTION_ROOT}/keda/${PLATFORM} -n ${NAMESPACE} --ignore-not-found=true
  - run: |
      (cd ${CONTROLLER_ROOT}/platform/${PLATFORM} && kustomize edit set namespace ${WVA_NAMESPACE})
      kubectl delete -k ${CONTROLLER_ROOT}/platform/${PLATFORM} --ignore-not-found=true
