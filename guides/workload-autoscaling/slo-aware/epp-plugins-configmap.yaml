# The EPP plugin configuration the benchmark ran (EndpointPickerConfig).
# The EPP consumes it from a ConfigMap mounted at /config and selected with
# --config-file=<key>; adjust the ConfigMap name/namespace/key to match your
# EPP deployment.
#
# The predicted-latency-producer is what emits the predicted/actual latency
# histograms the epp-saturation analyzer scales on. Per-request
# x-llm-d-slo-*-ms headers are not required for scaling; sending them
# additionally makes the EPP emit per-request SLO-violation counters
# (how the benchmark scored attainment server-side).
apiVersion: v1
kind: ConfigMap
metadata:
  name: optimized-baseline-epp
  namespace: llm-d-optimized-baseline
data:
  optimized-baseline-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    # Plugins run with their built-in defaults: the prefix-cache-affinity-filter's
    # peakPrefillThroughput default (15928) is calibrated for this reference
    # setup (Qwen3-32B on H100 80 GB, TP=2). For other hardware/models, measure
    # your own value with guides/recipes/router/calibration and set it on the
    # filter.
    plugins:
    - type: predicted-latency-producer
      parameters:
        streamingMode: true
    - type: approx-prefix-cache-producer
    - type: inflight-load-producer
    - type: prefix-cache-affinity-filter
    - type: token-load-scorer
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
