# Recommended (not required): faster pod warmup for the vLLM inference pool.
#
# Pod-ready time is roughly HALF the scale-up transient — while new pods warm,
# the pool is still under-provisioned and paying SLO violations. This patch cuts
# it from ~2m15s to ~100s (measured), which directly shrinks the violation bill
# at every scale-up:
#   1. torch.compile cache on a node-local hostPath + VLLM_CACHE_ROOT pointing
#      at the mount. The compile cache is container-ephemeral by default AND
#      vLLM writes it under $HOME, so an emptyDir mounted elsewhere does nothing.
#      With this patch the first pod per node pays the ~33s compile; every later
#      pod on that node loads the cached artifacts in ~8s.
#   2. startupProbe every 5s (a 30s period leaves a pod serving but unnoticed
#      for up to 30s).
#
# Apply to the optimized-baseline decode Deployment:
#   kubectl -n <serving-namespace> patch deploy <decode-deployment> \
#     --type=strategic --patch-file decode-warmup-patch.yaml
spec:
  template:
    spec:
      volumes:
      - name: torch-compile-cache
        hostPath:
          path: /var/cache/vllm-torch-compile
          type: DirectoryOrCreate
      containers:
      - name: modelserver
        volumeMounts:
        - name: torch-compile-cache
          mountPath: /.cache
        env:
        - name: VLLM_CACHE_ROOT
          value: /.cache/vllm
        startupProbe:
          httpGet:
            path: /v1/models
            port: modelserver
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 150
          timeoutSeconds: 5
          successThreshold: 1
