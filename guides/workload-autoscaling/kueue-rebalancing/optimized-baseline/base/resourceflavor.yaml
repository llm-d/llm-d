# One accelerator pool, assumed homogeneous. An empty spec matches every node -
# including nodes with no GPU at all - so nothing here constrains placement and
# quota is enforced on the declared GPU count alone. The scheduler still decides
# where an admitted pod lands, from its own `nvidia.com/gpu` request.
#
# For heterogeneous hardware, define one ResourceFlavor per GPU type with
# nodeLabels (for example nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB) and
# give each flavor its own nominalQuota in the ClusterQueues below.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: llm-d-gpu-default
