# Kueue quota objects for GPU-budget rebalancing across model deployments.
#
# ResourceFlavor and ClusterQueue are cluster-scoped, so this overlay is applied
# once per cluster; LocalQueue is namespaced and pins the workload namespace.
# Rename the queues before applying if another namespace on the same cluster
# already uses these ClusterQueue names.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - resourceflavor.yaml
  - clusterqueues.yaml
  - localqueues.yaml

# Namespace for the LocalQueues. Change this one line to retarget the overlay;
# ClusterQueue and ResourceFlavor are cluster-scoped and ignore it.
namespace: llm-d-optimized-baseline

# A common label so `kubectl get clusterqueues -l ...` can pick this guide's
# queues out of every queue on the cluster. Not a selector: ClusterQueue has no
# pod selector to break.
labels:
  - pairs:
      app.kubernetes.io/part-of: llm-d-kueue-rebalancing
    includeSelectors: false
