apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/guide: tiered-prefix-cache
    llm-d.ai/model: Qwen3-32B
    llm-d.ai/offloading-connector: mooncake-store-connector
  name: gpu-vllm-sa
---
apiVersion: v1
data:
  mooncake_config.json: |
    {
      "mode": "standalone-store",
      "metadata_server": "P2PHANDSHAKE",
      "master_server_address": "mooncake-master.mooncake.svc.cluster.local:50051",
      "global_segment_size": 0,
      "local_buffer_size": "4GB",
      "protocol": "rdma",
      "device_name": "",
      "enable_offload": true
    }
kind: ConfigMap
metadata:
  labels:
    llm-d.ai/guide: tiered-prefix-cache
    llm-d.ai/offloading-connector: mooncake-store-connector
  name: mooncake-store-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/guide: tiered-prefix-cache
    llm-d.ai/model: Qwen3-32B
    llm-d.ai/offloading-connector: mooncake-store-connector
    llm-d.ai/role: decode
  name: gpu-vllm-decode
spec:
  replicas: 4
  selector:
    matchLabels:
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/guide: tiered-prefix-cache
      llm-d.ai/model: Qwen3-32B
      llm-d.ai/offloading-connector: mooncake-store-connector
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        llm-d.ai/accelerator-variant: gpu
        llm-d.ai/accelerator-vendor: nvidia
        llm-d.ai/guide: tiered-prefix-cache
        llm-d.ai/model: Qwen3-32B
        llm-d.ai/offloading-connector: mooncake-store-connector
        llm-d.ai/role: decode
    spec:
      containers:
      - args:
        - |
          uv pip install --system mooncake-transfer-engine && \
          exec vllm serve \
            Qwen/Qwen3-32B \
            --tensor-parallel-size=2 \
            --kv-transfer-config \
            '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"load_async":true}}'
        command:
        - /bin/bash
        - -c
        env:
        - name: MOONCAKE_CONFIG_PATH
          value: /etc/mooncake/mooncake_config.json
        - name: PYTHONHASHSEED
          value: "0"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: HF_TOKEN
              name: llm-d-hf-token
        - name: USER
          value: llm-d
        image: vllm/vllm-openai:v0.23.0
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: modelserver
          periodSeconds: 10
          timeoutSeconds: 5
        name: modelserver
        ports:
        - containerPort: 8000
          name: modelserver
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /v1/models
            port: modelserver
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: "16"
            memory: 400Gi
            nvidia.com/gpu: "2"
            rdma/ib: "1"
          requests:
            cpu: "8"
            memory: 200Gi
            nvidia.com/gpu: "2"
            rdma/ib: "1"
        startupProbe:
          failureThreshold: 120
          httpGet:
            path: /v1/models
            port: modelserver
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /etc/mooncake
          name: mooncake-config
          readOnly: true
        - mountPath: /dev/shm
          name: shm
        - mountPath: /.cache
          name: torch-compile-cache
        - mountPath: /.triton
          name: triton-cache
        - mountPath: /.config
          name: vllm-config
      enableServiceLinks: false
      restartPolicy: Always
      serviceAccountName: gpu-vllm-sa
      terminationGracePeriodSeconds: 130
      volumes:
      - configMap:
          name: mooncake-store-config
        name: mooncake-config
      - emptyDir: {}
        name: data
      - emptyDir:
          medium: Memory
        name: shm
      - emptyDir: {}
        name: torch-compile-cache
      - emptyDir: {}
        name: triton-cache
      - emptyDir: {}
        name: vllm-config
