apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    spec:
      containers:
        - name: modelserver
          command: ["vllm"]
          args:
            - "serve"
            - "Qwen/Qwen3-32B"
            - "--tensor-parallel-size"
            - "2"
            - "--max-num-seq"
            - "1024"
            - "--kv-transfer-config"
            - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=hermes"
            - "--reasoning-parser=qwen3"
            - "--shutdown-timeout=45"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: LMCACHE_LOCAL_DISK
              value: "file:///mnt/files-storage/kv-cache/"
            - name: LMCACHE_EXTRA_CONFIG
              value: "{\"use_odirect\":\"True\"}"
            - name: LMCACHE_MAX_LOCAL_DISK_SIZE
              value: "1120.0"
            # CPU tier of the in-process connector: GiB per tensor-parallel rank.
            - name: LMCACHE_MAX_LOCAL_CPU_SIZE
              value: "100.0"
            - name: PYTHONHASHSEED
              value: "123"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: "/tmp/lmcache_prometheus"
          resources:
            limits:
              memory: 500Gi
            requests:
              memory: 500Gi
          volumeMounts:
            - name: files-storage
              mountPath: /mnt/files-storage
            - name: lmcache-prometheus-metrics
              mountPath: /tmp/lmcache_prometheus
      volumes:
        - name: files-storage
          persistentVolumeClaim:
            claimName: llm-d-kv-cache-storage
        - name: lmcache-prometheus-metrics
          emptyDir: {}
