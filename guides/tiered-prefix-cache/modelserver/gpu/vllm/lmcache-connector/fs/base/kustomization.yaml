apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Built on the common vLLM base, not on ../../cpu/base: this overlay sets its
  # own CPU tier (in-process LMCache) in patch-vllm.yaml to form the tiered
  # cache structure HBM - CPU - storage.
  - ../../../base

labels:
  - pairs:
      llm-d.ai/guide: tiered-prefix-cache
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
