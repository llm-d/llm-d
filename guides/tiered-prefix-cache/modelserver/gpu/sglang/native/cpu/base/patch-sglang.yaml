apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    spec:
      containers:
        - name: modelserver
          args:
            - "--model-path=Qwen/Qwen3-32B"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--tensor-parallel-size=2"
            # KV-block granularity. Must match the router scorer's
            # tokenProcessorConfig.blockSizeTokens (default 64); SGLang's knob is
            # --page-size, where vLLM uses --block-size.
            - "--page-size=64"
            - "--mem-fraction-static=0.9"
            - "--enable-metrics"
            - "--enable-hierarchical-cache"
            # Keep every flag in "--flag=value" form. llm-d-benchmark's CI
            # auto-detects the served model by discarding args that look like
            # flags; a bare value on its own line (e.g. "write_through") is
            # indistinguishable from a model name and corrupts that detection.
            - "--hicache-write-policy=write_through"
            - "--hicache-io-backend=kernel"
            - "--hicache-size=200"
