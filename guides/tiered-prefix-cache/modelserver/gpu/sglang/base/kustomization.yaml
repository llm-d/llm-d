apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: tiered-prefix-cache-gpu-sglang-

components:
  - ../../../../../recipes/modelserver/components/images/gpu-sglang/release

labels:
  - pairs:
      llm-d.ai/guide: tiered-prefix-cache
      llm-d.ai/model: Qwen3-32B
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: sglang
    includeSelectors: true
    includeTemplates: true
patches:
  # Named "patch-decode.yaml", not "patch-sglang.yaml", because this is where
  # spec.replicas is declared. llm-d-benchmark's CI applies its decode_pods
  # override by globbing for "patch-vllm.yaml"/"patch-decode.yaml" under
  # modelserver/, so any other filename silently ignores the override and the
  # nightly lane runs at whatever replica count is hardcoded here. This also
  # matches the pd-disaggregation SGLang overlays, which already use
  # patch-decode.yaml / patch-prefill.yaml.
  - path: patch-decode.yaml
