apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetwork
metadata:
  name: amit-p1-rdma
  namespace: openshift-sriov-network-operator
spec:
  resourceName: p1_sriov_nodepolicy
  networkNamespace: amit
  # Separate /24 slice of the same 172.24.0.0/16 fabric compute-p1v0 uses, so
  # whereabouts can't hand out an IP already claimed by vela's pool.
  ipam: |
    {
      "type": "whereabouts",
      "range": "172.24.1.0/24",
      "range_start": "172.24.1.1",
      "range_end": "172.24.1.254"
    }
  # No "rdma" metaPlugin: it requires the node's RDMA subsystem in netns
  # "exclusive" mode, but this cluster runs "shared" (required by the
  # rdma/roce_gdr shared-pool device plugin used elsewhere). Plain VF
  # passthrough still gives this pod a dedicated netdev/MAC/IP; the ibdev
  # itself stays node-globally visible like every other device under
  # shared mode, but render_config.py's IP-to-GID match already narrows to
  # this VF's device specifically since its IP is unique.
  logLevel: info
