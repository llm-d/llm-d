apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    metadata:
      annotations:
        # One dedicated RDMA-capable SR-IOV VF per pod, attached as net1 from the
        # ${RDMA_NETWORK} NetworkAttachmentDefinition. A PCI-backed VF lets
        # render_config.py find exactly one matching RDMA device, unlike a
        # shared RDMA device pool (verbs access to every HCA on the node) or a
        # macvlan interface (no PCI function to match).
        k8s.v1.cni.cncf.io/networks: |
          [
            {"name":"${RDMA_NETWORK}","interface":"net1"}
          ]
    spec:
      containers:
        - name: modelserver

          command:
            - /bin/sh
            - -c
            - |
              python3 /scripts/render_config.py || exit 1
              . /etc/mooncake/mooncake.env || exit 1
              exec python3 -m sglang.launch_server "$@"
            - --
          args:
            - "--model-path=Qwen/Qwen3-32B"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--tensor-parallel-size=2"
            # KV-block granularity. Must match the router scorer's
            # tokenProcessorConfig.blockSizeTokens (default 64); SGLang's knob is
            # --page-size, where vLLM uses --block-size.
            - "--page-size=64"
            - "--mem-fraction-static=0.9"
            - "--enable-metrics"
            - "--enable-hierarchical-cache"
            - "--hicache-write-policy"
            - "write_through"
            - "--hicache-io-backend"
            - "kernel"
            - "--hicache-size"
            - "100"
            - "--hicache-storage-backend"
            - "mooncake"
            - "--disable-custom-all-reduce"
            - "--hicache-storage-prefetch-policy"
            - "timeout"
          env:
            - name: SGLANG_HICACHE_MOONCAKE_CONFIG_PATH
              value: /etc/mooncake/mooncake_config.json
            - name: PYTHONHASHSEED
              value: "0"
            - name: TRITON_CACHE_DIR
              value: /.cache/triton
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            # Read straight from env by Mooncake's C++ lib (storage_backend.cpp), not the JSON.
            - name: MOONCAKE_OFFLOAD_STORAGE_BACKEND_DESCRIPTOR
              value: bucket_storage_backend
            - name: MOONCAKE_OFFLOAD_BUCKET_MAX_TOTAL_SIZE
              value: "182536110080" # 170Gi per TP rank; 2 ranks share the 400Gi sizeLimit
            - name: MOONCAKE_OFFLOAD_BUCKET_MAX_PHYSICAL_BYTES
              value: "193273528320"  # 180Gi per TP rank: 2 ranks x 180Gi = 360Gi, under the 400Gi sizeLimit
            # Anything other than "fifo"/"lru" falls through to no eviction at all.
            - name: MOONCAKE_OFFLOAD_BUCKET_EVICTION_POLICY
              value: "lru"
          resources:
            limits:
              nvidia.com/gpu: "2"
              cpu: "16"
              memory: 400Gi
              ${RDMA_VF_RESOURCE}: "1"
            requests:
              nvidia.com/gpu: "2"
              cpu: "8"
              memory: 320Gi
              ${RDMA_VF_RESOURCE}: "1"
          volumeMounts:
            - mountPath: /scripts
              name: mooncake-render-script
              readOnly: true
            - mountPath: /etc/mooncake-template
              name: mooncake-config-template
              readOnly: true
            - mountPath: /etc/mooncake
              name: mooncake-config
            - mountPath: /.cache
              name: cache-volume
            - mountPath: /data/mooncake-offload
              name: mooncake-offload
      volumes:
        - name: mooncake-render-script
          configMap:
            name: mooncake-render-config
        - name: mooncake-config-template
          configMap:
            name: mooncake-store-config
        - name: mooncake-config
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
        # Ephemeral: survives restarts but wiped on reschedule, so L3 cold-starts each rollout.
        - name: mooncake-offload
          emptyDir:
            sizeLimit: 400Gi
