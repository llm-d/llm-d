apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    metadata:
      annotations:
        # Dedicated SR-IOV VF on the p1 RDMA pool, one per pod -- avoids the
        # rdma/roce_gdr shared-pool ambiguity (that resource grants verbs access
        # to any of p0-p15/q0/q1 on the node, not a specific device) and the
        # macvlan fan-out's node-local-vs-cross-node GID guessing.
        k8s.v1.cni.cncf.io/networks: |
          [
            {"name":"amit-p1-rdma","namespace":"amit","interface":"net1"}
          ]
    spec:
      containers:
        - name: modelserver

          command:
            - /bin/sh
            - -c
            - |
              python3 /scripts/render_config.py || exit 1
              . /etc/mooncake/mooncake.env || exit 1
              exec python3 -m sglang.launch_server "$@"
            - --
          args:
            - "--model-path=Qwen/Qwen3-32B"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--tensor-parallel-size=1"
            # KV-block granularity. Must match the router scorer's
            # tokenProcessorConfig.blockSizeTokens (default 64); SGLang's knob is
            # --page-size, where vLLM uses --block-size.
            - "--page-size=64"
            - "--mem-fraction-static=0.9"
            - "--enable-metrics"
            - "--enable-hierarchical-cache"
            - "--hicache-write-policy"
            - "write_through"
            - "--hicache-io-backend"
            - "kernel"
            - "--hicache-size"
            - "100"
            - "--hicache-storage-backend"
            - "mooncake"
          env:
            - name: SGLANG_HICACHE_MOONCAKE_CONFIG_PATH
              value: /etc/mooncake/mooncake_config.json
            - name: PYTHONHASHSEED
              value: "0"
            - name: TRITON_CACHE_DIR
              value: /.cache/triton
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            # Read straight from env by Mooncake's C++ lib (storage_backend.cpp), not the JSON.
            - name: MOONCAKE_OFFLOAD_STORAGE_BACKEND_DESCRIPTOR
              value: bucket_storage_backend
            # Left unset, sizes itself from the mount's statvfs (whole node disk for an
            # emptyDir) and overruns the volume before Mooncake ever evicts.
            - name: MOONCAKE_OFFLOAD_BUCKET_MAX_TOTAL_SIZE
              value: "429496729600" # 400Gi, matching the mooncake-offload volume
            # Anything other than "fifo"/"lru" falls through to no eviction at all.
            - name: MOONCAKE_OFFLOAD_BUCKET_EVICTION_POLICY
              value: "lru"
          resources:
            limits:
              nvidia.com/gpu: "2"
              cpu: "16"
              memory: 400Gi
              openshift.io/p1_sriov_nodepolicy: "1"
            requests:
              nvidia.com/gpu: "2"
              cpu: "8"
              memory: 200Gi
              openshift.io/p1_sriov_nodepolicy: "1"
          volumeMounts:
            - mountPath: /scripts
              name: mooncake-render-script
              readOnly: true
            - mountPath: /etc/mooncake-template
              name: mooncake-config-template
              readOnly: true
            - mountPath: /etc/mooncake
              name: mooncake-config
            - mountPath: /.cache
              name: cache-volume
            # Must match ssd_offload_path in configmap.yaml and the master's root_fs_dir.
            - mountPath: /data/mooncake-offload
              name: mooncake-offload
      volumes:
        - name: mooncake-render-script
          configMap:
            name: mooncake-render-config
        - name: mooncake-config-template
          configMap:
            name: mooncake-store-config
        - name: mooncake-config
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
        # Ephemeral: survives restarts but wiped on reschedule, so L3 cold-starts each rollout.
        - name: mooncake-offload
          emptyDir:
            sizeLimit: 400Gi
