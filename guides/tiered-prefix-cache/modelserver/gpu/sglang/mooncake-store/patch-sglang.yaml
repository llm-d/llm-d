apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    metadata:
      annotations:
        # RDMA-capable secondary interfaces via Multus, so the pod's own netns has a
        # real netdev+GID for RoCE (the rdma/roce_gdr device plugin alone only exposes
        # ibverbs char devices, not a netdev inside the pod). 2 interfaces to match
        # --tensor-parallel-size=2.
        k8s.v1.cni.cncf.io/networks: |
          [
            {"name":"multi-nic-inference","namespace":"amit","interface":"net1"},
            {"name":"multi-nic-inference","namespace":"amit","interface":"net2"}
          ]
    spec:
      # Discover the Multus/RDMA interfaces after the pod network namespace has
      # been created and generate the per-interface policy-routing commands.
      # The modelserver sources the generated file below before starting SGLang.
      initContainers:
        - name: preprocess
          image: ghcr.io/llm-d/llm-d-benchmark:nightly
          imagePullPolicy: Always
          command:
            - set_llmdbench_environment.py
            - -e
            - /shared-config/llmdbench_env.sh
            - -i
          volumeMounts:
            - name: shared-config
              mountPath: /shared-config
      containers:
        - name: modelserver
          # Resolve the per-pod Mooncake settings, then hand off to the server. This runs
          # in the main container rather than an initContainer because MC_GID_INDEX has to
          # be an env var of the server process, and an initContainer cannot set one. It
          # also means both values are recomputed on every container restart, which matters
          # because GID index numbering is not stable over time -- see
          # configmap-render-config.yaml. The wrapper runs before the server loads any
          # weights, so a misconfigured fabric still fails within seconds.
          command:
            - /bin/sh
            - -c
            - |
              . /shared-config/llmdbench_env.sh || exit 1
              python3 /scripts/render_config.py || exit 1
              set -a
              . /etc/mooncake/mooncake.env
              set +a
              exec python3 -m sglang.launch_server "$@"
            - --
          args:
            - "--model-path=Qwen/Qwen3-32B"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--tensor-parallel-size=2"
            # KV-block granularity. Must match the router scorer's
            # tokenProcessorConfig.blockSizeTokens (default 64); SGLang's knob is
            # --page-size, where vLLM uses --block-size.
            - "--page-size=64"
            - "--mem-fraction-static=0.9"
            - "--enable-metrics"
            - "--enable-hierarchical-cache"
            - "--hicache-write-policy"
            - "write_through"
            - "--hicache-io-backend"
            - "kernel"
            - "--hicache-size"
            - "100"
            - "--hicache-storage-backend"
            - "mooncake"
          env:
            - name: SGLANG_HICACHE_MOONCAKE_CONFIG_PATH
              value: /etc/mooncake/mooncake_config.json
            - name: PYTHONHASHSEED
              value: "0"
            - name: TRITON_CACHE_DIR
              value: /.cache/triton
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            # Disk tier tuning. SGLang forwards only enable_ssd_offload/ssd_offload_path from
            # the JSON config; everything below is read straight from the environment by the
            # Mooncake C++ library (mooncake-store/src/storage_backend.cpp).
            - name: MOONCAKE_OFFLOAD_STORAGE_BACKEND_DESCRIPTOR
              value: bucket_storage_backend
            # Cap the backend at the volume size. Left unset it sizes itself from statvfs on
            # the mount, which for an emptyDir reports the whole node disk ("Bucket backend
            # max_total_size not set; using 90% of disk capacity: 1727017242624 bytes") -- it
            # would then overrun the emptyDir sizeLimit and the kubelet would evict the pod
            # rather than Mooncake reclaiming cache entries.
            # Note this is the bucket backend's knob; MOONCAKE_OFFLOAD_TOTAL_SIZE_LIMIT_BYTES
            # belongs to file_per_key_storage_backend and is ignored here.
            - name: MOONCAKE_OFFLOAD_BUCKET_MAX_TOTAL_SIZE
              value: "429496729600" # 400Gi, matching the mooncake-offload volume
            # Only "fifo" and "lru" are recognised; anything else falls through to "none",
            # i.e. no eviction at all, which turns the cap above into a write-failure cliff.
            - name: MOONCAKE_OFFLOAD_BUCKET_EVICTION_POLICY
              value: "lru"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
            runAsGroup: 0
            runAsUser: 0
          resources:
            limits:
              nvidia.com/gpu: "2"
              cpu: "16"
              memory: 400Gi
              rdma/roce_gdr: "1"
            requests:
              nvidia.com/gpu: "2"
              cpu: "8"
              memory: 200Gi
              rdma/roce_gdr: "1"
          volumeMounts:
            - mountPath: /shared-config
              name: shared-config
            - mountPath: /scripts
              name: mooncake-render-script
              readOnly: true
            - mountPath: /etc/mooncake-template
              name: mooncake-config-template
              readOnly: true
            # Writable: the wrapper renders mooncake_config.json and mooncake.env here.
            - mountPath: /etc/mooncake
              name: mooncake-config
            - mountPath: /.cache
              name: cache-volume
            # The disk this pod contributes to the Mooncake pool. Must match
            # ssd_offload_path in configmap.yaml and the master's root_fs_dir.
            - mountPath: /data/mooncake-offload
              name: mooncake-offload
      volumes:
        - name: shared-config
          emptyDir: {}
        - name: mooncake-render-script
          configMap:
            name: mooncake-render-config
        - name: mooncake-config-template
          configMap:
            name: mooncake-store-config
        - name: mooncake-config
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
        # Node-local disk contributed to the Mooncake pool. Ephemeral by design: it survives
        # container restarts but is wiped when the pod is deleted or rescheduled, so the L3
        # tier cold-starts on every rollout.
        - name: mooncake-offload
          emptyDir:
            sizeLimit: 400Gi
