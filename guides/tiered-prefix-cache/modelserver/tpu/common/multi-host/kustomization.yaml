apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/multi-host/default

components:
  - ../../../../../recipes/modelserver/components/images/torch-tpu-vllm/release
  - ../../../../../recipes/modelserver/components/graceful-shutdown

labels:
  - pairs:
      llm-d.ai/model: Qwen3.5-397B-A17B-FP8
      llm-d.ai/guide: tiered-prefix-cache
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
      llm-d.ai/backend: torch-tpu
    includeSelectors: true
    fields:
      - group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
        path: metadata/labels
        create: true
      - group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
        path: spec/leaderWorkerTemplate/leaderTemplate/metadata/labels
        create: true
      - group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
        path: spec/leaderWorkerTemplate/workerTemplate/metadata/labels
        create: true

patches:
  - path: patch-vllm.yaml
