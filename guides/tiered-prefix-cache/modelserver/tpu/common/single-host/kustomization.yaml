apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

# The model server image is selected by the per-generation overlays
# (v5p/, v6/, v7/) via an images/* component so each can pick its own backend.

labels:
  - pairs:
      llm-d.ai/model: Qwen3-32B
      llm-d.ai/guide: tiered-prefix-cache
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
components:
  - ../../../../../recipes/modelserver/components/graceful-shutdown
