apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../../../recipes/modelserver/base/single-host/default

namePrefix: tiered-prefix-cache-tpu-v7-sglang-

components:
  - ../../../../../../../../recipes/modelserver/components/images/tpu-sglang/release

labels:
  - pairs:
      llm-d.ai/guide: tiered-prefix-cache
      llm-d.ai/model: Qwen3-32B
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
      llm-d.ai/engine-type: sglang
      llm-d.ai/backend: torch-tpu
    includeSelectors: true
    includeTemplates: true
patches:
  # Named patch-decode.yaml because llm-d-infra's CI globs for
  # patch-{vllm,decode}.yaml when applying decode_pods overrides.
  - path: patch-decode.yaml
