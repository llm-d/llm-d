# TPU v5p host-DRAM tier (VARIANT=cpu) for SGLang on Torch TPU: HBM -> host DRAM through
# SGLang HiCache. The engine is the optimized-baseline tpu/v5p/sglang layout (Qwen3-32B,
# TP=4 over the 4 chips of one ct5p-hightpu-4t 2x2x1 slice, torch.compile with startup
# bucket precompilation; direct compile tracer here, see the note on the args) plus the
# HiCache flags. --hicache-io-backend=torch_tpu copies pages between the device pool and
# a host pool that mirrors its layout, which is why it requires
# --hicache-mem-layout=page_first_fused and a Pallas RPA attention backend (the TPU
# default). The host pool is ordinary (unpinned) process memory.
#
# Tier sizing: --max-total-tokens=131072 is the device pool (fp8 KV on TPU, 16 GiB per
# pod); --hicache-size is GB per TP rank, so 32 GB x 4 ranks = 128 GB of host DRAM per
# pod. The 320Gi request covers the host pool, the bf16 checkpoint (~62 GB, kept in a
# tmpfs because of the node's boot disk, see the volumes), the 4 TP processes and the
# 64Gi /dev/shm tmpfs; ct5p-hightpu-4t has ~448 GB of host RAM. Change the request and
# the router's lruCapacityPerServer together with --hicache-size.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 2
  # TPU node pools are fixed-size: a RollingUpdate needs a spare 4-chip node to
  # surge onto, so the rollout deadlocks with the new pod Pending.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        llm-d.ai/inference-serving: "true"
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x2x1
      containers:
        - name: modelserver
          command: ["python3", "-m", "sglang.launch_server"]
          args:
            - "--model-path=Qwen/Qwen3-32B"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--device=tpu"
            - "--dtype=bfloat16"
            - "--enable-metrics"
            - "--tensor-parallel-size=4"
            - "--enable-torch-compile"
            - "--context-length=16384"
            - "--max-running-requests=64"
            - "--torch-compile-max-bs=64"
            - "--chunked-prefill-size=8192"
            - "--max-prefill-tokens=8192"
            # Precompile the prefill token and decode batch buckets at startup
            # instead of on the first request of each shape.
            - "--tpu-compile-tokens"
            - "2048"
            - "8192"
            - "--tpu-compile-bs"
            - "8"
            - "64"
            # Compile with the direct tracer, not the default Dynamo tracer. On the
            # v0.1.0-tpu image the Dynamo-traced extend program perturbs the last-token
            # logits of every prefill chunk longer than one 2048-token KV tile at TP >= 4,
            # which surfaces as a wrong first token (sgl-project/sglang-torchtpu#1700).
            # The direct tracer is correct for the same prefills and compiles in about a
            # quarter of the time. Drop this flag once #1700 is fixed in the image.
            - "--tpu-compile-tracer=direct"
            - "--max-total-tokens=131072"
            - "--mem-fraction-static=0.35"
            - "--watchdog-timeout=3600"
            - "--tool-call-parser=qwen"
            - "--reasoning-parser=qwen3"
            # Matches the router scorer's tokenProcessorConfig.blockSizeTokens
            # (default 64); SGLang uses --page-size (vLLM uses --block-size).
            - "--page-size=64"
            # Host-DRAM tier (HiCache). Keep flags in "--flag=value" form so
            # llm-d-infra's CI model detection does not mistake bare option
            # values for the model name.
            - "--enable-hierarchical-cache"
            - "--hicache-io-backend=torch_tpu"
            - "--hicache-mem-layout=page_first_fused"
            - "--hicache-write-policy=write_through"
            - "--hicache-size=32"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION
              value: "0"
          resources:
            requests:
              cpu: "32"
              memory: 320Gi
              google.com/tpu: 4
            limits:
              memory: 320Gi
              google.com/tpu: 4
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /root/.cache
              name: cache
          # /v1/models responds before SGLang completes its generation warmup.
          startupProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        # Torch TPU keeps its compiled-executable cache in /dev/shm/torch_tpu_cache;
        # the baseline buckets alone fill 18 GiB and the HiCache reload/backup
        # programs add to it, so the tmpfs is larger than the 20Gi of the baseline.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        # Checkpoint and torch.compile cache in host RAM instead of on the boot disk:
        # the v5p Spot nodes of the nightly cluster have 100 GB boot disks, which the
        # ~62 GB Qwen3-32B download fills up to the ephemeral-storage eviction
        # threshold (https://github.com/llm-d/llm-d/issues/2884). Unlike the tpu/v7
        # overlay, the gke overlay therefore adds no gke-model-cache-hostpath.
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 120Gi
