# TPU v5p single-host slice (ct5p-hightpu-4t): 4 chips x 95 GB HBM, ~448 GB host RAM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x2x1
      containers:
        - name: modelserver
          args:
            - |
              exec vllm serve \
                Qwen/Qwen3-32B \
                --kv-transfer-config '{"kv_connector":"TPUOffloadConnector","kv_connector_module_path":"tpu_inference.offload.tpu_offload_connector","kv_role":"kv_both"}' \
                --port 8000 \
                --tensor-parallel-size 4 \
                --shutdown-timeout=45
          env:
            # Drop the checkpoint's page cache once weights are in HBM (frees host RAM).
            - name: TPU_EVICT_WEIGHTS_PAGE_CACHE
              value: "1"
            # One CPU chunk == one KV block (~32 MiB for Qwen3-32B at block_size 128).
            # 6000 chunks ~= 190 GiB, sized for the ~448 GB host RAM of ct5p-hightpu-4t.
            - name: TPU_OFFLOAD_NUM_CPU_CHUNKS
              value: "6000"
            - name: TPU_OFFLOAD_NUM_STAGING_BLOCKS
              value: "1000"
            - name: SKIP_JAX_PRECOMPILE
              value: "0"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: "/tmp/prometheus_multiproc"
          resources:
            requests:
              google.com/tpu: "4"
            limits:
              google.com/tpu: "4"
      volumes:
        # TODO(https://github.com/llm-d/llm-d/issues/2884): Temporary workaround
        # until the tpu-v5p-spot node pool boot disk on llm-d-e2e-us-east5 is
        # resized from 100 GB to >= 250 GB. Back /root/.cache (including
        # /root/.cache/huggingface) with tmpfs from host RAM (~448 GiB on
        # ct5p-hightpu-4t, ~190 GiB used by CPU KV chunks) so ~65.5 GB
        # Qwen/Qwen3-32B downloads do not trigger ephemeral-storage eviction.
        - name: torch-compile-cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Gi
