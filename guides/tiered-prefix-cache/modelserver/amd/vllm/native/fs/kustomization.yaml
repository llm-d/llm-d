apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - pvc.yaml

images:
  - name: ghcr.io/llm-d/llm-d-rocm
    newName: rocm/vllm-dev
    newTag: nightly

labels:
  - pairs:
      llm-d.ai/guide: tiered-prefix-cache
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
