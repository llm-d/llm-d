apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Reuse the shared XPU base; the OffloadingConnector config below layers the
  # filesystem tier on top of the CPU tier (VRAM - CPU - storage).
  - ../../../base

labels:
  - pairs:
      llm-d.ai/guide: tiered-prefix-cache
      llm-d.ai/subguide: tiered-prefix-cache-xpu-native
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
