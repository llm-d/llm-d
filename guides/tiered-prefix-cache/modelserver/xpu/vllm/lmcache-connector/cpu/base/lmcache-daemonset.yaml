apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xpu-vllm-lmcache
  labels:
    app.kubernetes.io/name: lmcache
    app.kubernetes.io/instance: tiered-prefix-cache-xpu
    llm-d.ai/role: cache
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lmcache
      app.kubernetes.io/instance: tiered-prefix-cache-xpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lmcache
        app.kubernetes.io/instance: tiered-prefix-cache-xpu
        llm-d.ai/role: cache
    spec:
      # Match the selector on the vLLM Deployment. Adapt both to your cluster.
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      securityContext:
        fsGroup: 107
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: lmcache
          image: REPLACE_MODEL_SERVER_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              l2_args=()
              if [ -n "${LMCACHE_L2_ADAPTER:-}" ]; then
                l2_args+=(--l2-adapter "${LMCACHE_L2_ADAPTER}")
              fi
              # An empty shm-name forces inline payloads instead of advertising
              # a shared-memory pool that other pods cannot access.
              exec lmcache server \
                --host 0.0.0.0 \
                --port 5555 \
                --http-port 8080 \
                --supported-transfer-mode engine_driven \
                --shm-name "" \
                --l1-size-gb 20 \
                --no-l1-use-lazy \
                --chunk-size 256 \
                --max-workers 1 \
                --hash-algorithm blake3 \
                --eviction-policy LRU \
                --eviction-trigger-watermark 0.8 \
                --eviction-ratio 0.2 \
                "${l2_args[@]}"
          env:
            - name: PYTHONHASHSEED
              value: "0"
          ports:
            - name: rpc
              containerPort: 5555
            # LMCache 0.5.0's combined CLI serves health and /metrics here.
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "2"
              memory: 25Gi
            limits:
              cpu: "2"
              memory: 32Gi
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
