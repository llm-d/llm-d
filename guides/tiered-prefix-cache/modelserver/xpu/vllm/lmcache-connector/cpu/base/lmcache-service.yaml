apiVersion: v1
kind: Service
metadata:
  name: xpu-vllm-lmcache
spec:
  # A vLLM pod must connect to the server on its own node.
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: lmcache
    app.kubernetes.io/instance: tiered-prefix-cache-xpu
  ports:
    - name: rpc
      port: 5555
      targetPort: rpc
    - name: http
      port: 8080
      targetPort: http
