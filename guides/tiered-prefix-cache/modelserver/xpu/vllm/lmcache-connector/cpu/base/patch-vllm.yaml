apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  # Release the singleton model's XPU before starting its replacement.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        llm-d.ai/lmcache-mode: mp
    spec:
      # Keep this in sync with the LMCache DaemonSet's node selector.
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      initContainers:
        - name: wait-for-lmcache
          image: REPLACE_MODEL_SERVER_IMAGE
          command: ["python3", "-c"]
          args:
            - |
              from importlib.metadata import version
              import time
              import urllib.error
              import urllib.request

              installed = version("lmcache")
              if installed != "0.5.7.post1":
                  raise RuntimeError(
                      f"XPU MP requires LMCache 0.5.7.post1, found {installed}. "
                      "Select the rebuilt image in a site overlay."
                  )

              url = "http://xpu-vllm-lmcache:8080/healthcheck"
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              while True:
                  try:
                      with opener.open(url, timeout=5) as response:
                          if response.status == 200:
                              break
                  except (OSError, urllib.error.URLError) as exc:
                      print(f"Waiting for node-local LMCache: {exc}", flush=True)
                  time.sleep(5)
      containers:
        - name: modelserver
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec vllm serve \
                Qwen/Qwen3-8B \
                --dtype bfloat16 \
                --gpu-memory-utilization 0.90 \
                --block-size 64 \
                --tensor-parallel-size=1 \
                --max-num-seq 128 \
                --max-model-len 20480 \
                --uvicorn-log-level warning \
                --kv-transfer-config "${LMCACHE_KV_CONFIG}" \
                --shutdown-timeout=45
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: LMCACHE_KV_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: xpu-vllm-lmcache-connection
                  key: kv-transfer-config.json
            - name: PYTHONHASHSEED
              value: "0"
