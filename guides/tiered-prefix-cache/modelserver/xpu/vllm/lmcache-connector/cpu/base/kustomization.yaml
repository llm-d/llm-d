apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base
  - lmcache-daemonset.yaml
  - lmcache-service.yaml

components:
  # Use the same LMCache installation for the MP server and the vLLM client.
  - ../../../../../../../recipes/modelserver/components/images/xpu-vllm/llm-d

configMapGenerator:
  - name: xpu-vllm-lmcache-connection
    files:
      - kv-transfer-config.json

replacements:
  # The init container is added after the image component is evaluated.
  - source:
      kind: DaemonSet
      name: xpu-vllm-lmcache
      fieldPath: spec.template.spec.containers.[name=lmcache].image
    targets:
      - select:
          kind: Deployment
          name: xpu-vllm-decode
        fieldPaths:
          - spec.template.spec.initContainers.[name=wait-for-lmcache].image

labels:
  - pairs:
      # The shared vLLM base already labels model pods with llm-d.ai/guide.
      # Cache pods must not have it: the router uses it to find model servers.
      llm-d.ai/subguide: tiered-prefix-cache-xpu-lmcache
      llm-d.ai/model: Qwen3-8B
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
  # This overlay runs Qwen3-8B with tensor-parallel-size=1, so it needs a single
  # XPU rather than the 4 requested by the shared base claim template.
  - target:
      kind: ResourceClaimTemplate
      name: xpu-vllm-tiered-prefix-cache-intel-claim-template-decode
    patch: |-
      - op: replace
        path: /spec/spec/devices/requests/0/exactly/count
        value: 1
