## tiered-prefix-cache guide overrides for the router.
## Layer on top of: recipes/router/base.values.yaml

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "tiered-prefix-cache-plugins.yaml"
    pluginsCustomConfig:
      tiered-prefix-cache-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: no-hit-lru-scorer
          parameters:
            # Use the HBM index for the cold-request check. If you do not
            # set this, the router adds one more prefix producer.
            prefixMatchInfoProducerName: gpu-prefix-cache-producer
        - type: approx-prefix-cache-producer
          name: gpu-prefix-cache-producer
          parameters:
            blockSizeTokens: 4352
            maxPrefixTokensToMatch: 262144
        - type: approx-prefix-cache-producer
          name: cpu-prefix-cache-producer
          parameters:
            autoTune: false
            # 4352-token router blocks (engine --block-size), 262k match window, LRU sized for the 256 GiB host tier
            # per group: same engine envelope as single-host/tpu-v7.values.yaml and the
            # Qwen3.5-397B model guide (autoTune ignores the host tier, llm-d-router#1650).
            blockSizeTokens: 4352
            maxPrefixTokensToMatch: 262144
            lruCapacityPerServer: 46200
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
          name: gpu-prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: gpu-prefix-cache-producer
        - type: prefix-cache-scorer
          name: cpu-prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: cpu-prefix-cache-producer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
          - pluginRef: kv-cache-utilization-scorer
          - pluginRef: gpu-prefix-cache-scorer
          - pluginRef: cpu-prefix-cache-scorer
          - pluginRef: no-hit-lru-scorer

  modelServers:
    matchLabels:
      llm-d.ai/guide: "tiered-prefix-cache"
      leaderworkerset.sigs.k8s.io/name: tpu-v7-vllm-decode
      role: leader # Routes only to leaders running the vLLM HTTP API to tiered-prefix-cache-epp
