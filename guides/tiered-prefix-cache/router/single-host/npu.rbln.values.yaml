# Rebellions NPU overrides for tiered-prefix-cache-cpu.values.yaml. Apply after it;
# everything not named here is inherited. Named for the RBLN runtime rather than
# for NPUs in general, since the reuse unit below is that runtime's.
router:
  epp:
    pluginsCustomConfig:
      tiered-prefix-cache-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: no-hit-lru-scorer
          parameters:
            # Use the NPU index for the cold-request check.
            prefixMatchInfoProducerName: gpu-prefix-cache-producer
        - type: approx-prefix-cache-producer
          name: gpu-prefix-cache-producer
          parameters:
            # The runtime reuses prefixes in 512-token sub-blocks of each 4096-token block,
            # but does not publish prefix_match_unit, so autotune would hash at 4096 and see
            # no prefix in a shorter prompt.
            autoTune: false
            blockSizeTokens: 512
            # 132 KV blocks x 8 sub-blocks, the count the runtime sized per data-parallel
            # rank on one RBLN-CR13.
            lruCapacityPerServer: 1056
        - type: approx-prefix-cache-producer
          name: cpu-prefix-cache-producer
          parameters:
            autoTune: false
            blockSizeTokens: 512
            # Unit: router blocks of 512 tokens, per data-parallel rank.
            # Value = CPU tier bytes per rank / (512 * KV bytes per token).
            # MiniMax-M2.7 fp8 KV is 124 KiB per token, so one block is 62 MiB.
            # The overlay gives each rank 50 GiB: 50 GiB / 62 MiB = 825.
            lruCapacityPerServer: 825
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
          name: gpu-prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: gpu-prefix-cache-producer
        - type: prefix-cache-scorer
          name: cpu-prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: cpu-prefix-cache-producer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
          - pluginRef: kv-cache-utilization-scorer
          - pluginRef: gpu-prefix-cache-scorer
          - pluginRef: cpu-prefix-cache-scorer
          - pluginRef: no-hit-lru-scorer

  modelServers:
    # The model server runs one API server per data-parallel rank, so all four rank
    # ports must be listed. Without this the router sends every request to rank 0.
    targetPorts:
      - number: 8000
      - number: 8001
      - number: 8002
      - number: 8003
    matchLabels:
      llm-d.ai/guide: "tiered-prefix-cache"
      llm-d.ai/accelerator-variant: "npu"
      llm-d.ai/accelerator-vendor: "rebellions"
