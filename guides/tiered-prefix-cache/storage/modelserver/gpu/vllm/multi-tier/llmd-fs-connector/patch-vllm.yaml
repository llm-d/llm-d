apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - pokprod-b93r38s3
      containers:
        - name: modelserver
          securityContext:
            runAsUser: 0
          command: ["/bin/bash", "-c"]
          args:
            - |
              export PATH="/root/.local/bin:$PATH"
              if ! command -v git > /dev/null 2>&1; then
                apt-get update -qq && apt-get install -y -qq git
              fi
              rm -rf /workspace/vllm
              cd /workspace
              #git clone https://github.com/vllm-project/vllm.git
              git clone https://github.com/effi-ofer/vllm.git
              cd vllm
              uv venv .venv --python 3.12
              source .venv/bin/activate
              uv pip install 'llmd-fs-connector==0.21' --extra-index-url https://llm-d.github.io/llm-d-kv-cache/simple/
              VLLM_USE_PRECOMPILED=1 \
              VLLM_PRECOMPILED_WHEEL_COMMIT=599e75f432e5fd7c77e65dc95587f3441201bdbc \
              uv pip install -e . --torch-backend=auto
              uv pip install nvidia-cuda-runtime-cu12
              CUDA12_LIB=$(python -c "import nvidia.cuda_runtime; print(list(nvidia.cuda_runtime.__path__)[0] + '/lib')")
              export LD_LIBRARY_PATH="${CUDA12_LIB}:${LD_LIBRARY_PATH:-}"
              sleep infinity
              exec vllm serve \
                meta-llama/Meta-Llama-3.1-8B \
                --tensor-parallel-size 1 \
                --kv-transfer-config '{
                    "kv_connector": "OffloadingConnector",
                    "kv_role": "kv_both",
                    "kv_connector_extra_config": {
                      "spec_name": "SharedStorageOffloadingSpec",
                      "shared_storage_path": "/mnt/files-storage/",
                      "block_size": 256,
                      "threads_per_gpu": "64",
                      "spec_module_path":"llmd_fs_backend.spec"
                    }
                  }'
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: "4"
              memory: 300Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "4"
              memory: 300Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
            - name: files-storage
              mountPath: /mnt/files-storage
      volumes:
        - name: workspace
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 200Gi
        - name: files-storage
          persistentVolumeClaim:
            claimName: llm-d-kv-cache-storage
