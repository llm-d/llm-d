apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: kvcache-gpu0
      containers:
        - name: modelserver
          securityContext:
            runAsUser: 0
          command: ["/bin/bash", "-c"]
          args:
            - |
              export PATH="/root/.local/bin:$PATH"
              if ! command -v git > /dev/null 2>&1; then
                apt-get update -qq && apt-get install -y -qq git
              fi
              rm -rf /workspace/vllm
              cd /workspace
              git clone https://github.com/vllm-project/vllm.git
              cd vllm
              git fetch --depth 1 origin pull/41735/head
              git checkout FETCH_HEAD
              uv venv .venv --python 3.12
              source .venv/bin/activate
              VLLM_USE_PRECOMPILED=1 \
              VLLM_PRECOMPILED_WHEEL_COMMIT=599e75f432e5fd7c77e65dc95587f3441201bdbc \
              uv pip install -e . --torch-backend=auto
              uv pip install nvidia-cuda-runtime-cu12
              CUDA12_LIB=$(python -c "import nvidia.cuda_runtime; print(list(nvidia.cuda_runtime.__path__)[0] + '/lib')")
              export LD_LIBRARY_PATH="${CUDA12_LIB}:${LD_LIBRARY_PATH:-}"
              exec vllm serve \
                meta-llama/Meta-Llama-3.1-70B \
                --tensor-parallel-size 1 \
                --kv-transfer-config '{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":100000000000,"secondary_tiers":[{"type":"fs_python","root_dir":"/mnt/files-storage","n_read_threads":16,"n_write_threads":16}]}}'
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: "4"
              memory: 300Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "4"
              memory: 300Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
            - name: files-storage
              mountPath: /mnt/files-storage
      volumes:
        - name: workspace
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 200Gi
        - name: files-storage
          persistentVolumeClaim:
            claimName: llm-d-kv-cache-storage
