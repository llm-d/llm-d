apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-d-kv-cache-storage # If you change this, update the ./manifests/vllm patches accordingly.
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: efs-sc # Replace with your storage class (e.g., efs-sc, lustre, etc.)