name: tiered-prefix-cache

# Which model server runs on which accelerator. `validated` = covered by a
# nightly E2E workflow; `community` = an overlay exists but is not run nightly;
# `unsupported` must link a tracking issue. A missing cell means unsupported.
# Keys must match env.static ACCELERATOR_TYPE / MODEL_SERVER values; `model`
# is the model the accelerator's overlay serves (used for MODEL on llm-d.ai);
# `notes` (optional, one line) fills the Notes column of the support table.
# `providers` lists the INFRA_PROVIDER values the accelerator takes (each
# needs a modelserver/<acc>/<engine>/.../<provider>/ overlay; `engines:`
# narrows one to a subset); llm-d.ai turns it into the provider selector.
support:
  engines: {vllm: vLLM, sglang: SGLang}
  accelerators:
    gpu:
      label: NVIDIA GPU
      notes: "Default. H100 80 GB reference · 2 replicas × TP=2 (4 GPUs) · `INFRA_PROVIDER`: `base`, `gke` (`mooncake-store`: `base`) · SGLang: `CONNECTOR=native` (HiCache)"
      model: Qwen/Qwen3-32B
      providers:
        - {name: base, label: "Kubernetes (base)"}
        - {name: gke, label: "GKE"}
      engines: {vllm: validated, sglang: validated}
    amd:
      label: AMD GPU
      notes: "2 replicas × TP=2 (4 GPUs) · `CONNECTOR`: `native`, `lmcache-connector`"
      model: Qwen/Qwen3-32B
      providers:
        - {name: base, label: "Kubernetes (base)"}
      engines: {vllm: validated}
    xpu:
      label: Intel XPU
      notes: "Intel B60 · 1 replica × TP=4 via DRA · `CONNECTOR`: `native`, `lmcache-connector` (the `lmcache-connector` overlay serves `Qwen/Qwen3-8B` on 1 XPU)"
      model: Qwen/Qwen3-32B
      providers:
        - {name: base, label: "Kubernetes (base)"}
      engines: {vllm: validated}
    "tpu/v5p":
      label: Google TPU v5p
      notes: >-
        GKE only · vLLM: 3 replicas × 4 chips (`2x2x1`, TP=4) ·
        SGLang: 2 replicas × 4 chips (`2x2x1`, TP=4) · Torch TPU SGLang (`tpu-sglang` image, fp8 KV, 16k context, HiCache host tier 32 GB × 4 ranks) ·
        `CONNECTOR=native`, `VARIANT=cpu` · nightlies run on Spot capacity
      model: Qwen/Qwen3-32B
      providers:
        - {name: gke, label: "GKE"}
      engines: {vllm: validated, sglang: validated}
    "tpu/v6":
      label: Google TPU v6e
      notes: "GKE only · 3 replicas × 8 chips (`2x4`, TP=8) · Torch TPU vLLM (`torch-tpu-vllm` image, 32k context) · `CONNECTOR=native`, `VARIANT=cpu` · validated manually 2026-10-12; nightly runs on `tpu/v5p` while v6e capacity is unavailable"
      model: Qwen/Qwen3-32B
      providers:
        - {name: gke, label: "GKE"}
      engines: {vllm: community}
    "tpu/v7":
      label: Google TPU v7
      notes: >-
        GKE only · vLLM: 3 replicas × 4 chips (`2x2x1`, DP=8 × TP=1, EP, fp8 KV, 262k context) or multi-host LeaderWorkerSet (`2x2x2`, TP=16, EP, `HOST_TYPE=multi-host`) ·
        Torch TPU vLLM (`torch-tpu-vllm` image, fp8 KV, 262k context, 32 GiB host tier per DP engine / 256 GiB per multi-host group) ·
        `CONNECTOR=native`, `VARIANT=cpu` or `fs` (TPU Sync storage tier on the shared PVC, validated with Managed Lustre; single-host only) ·
        SGLang: serves `Qwen/Qwen3-32B`, 2 replicas × 4 chips (`2x2x1`, TP=8) · Torch TPU SGLang (`tpu-sglang` image, fp8 KV, 16k context, HiCache host tier 32 GB × 8 ranks) · `CONNECTOR=native`, `VARIANT=cpu`
      model: Qwen/Qwen3.5-397B-A17B-FP8
      providers:
        - {name: gke, label: "GKE"}
      engines: {vllm: community, sglang: community}

env:
  static:
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))

    GUIDE_NAME: tiered-prefix-cache
    NAMESPACE: llm-d-tiered-prefix-cache

    # Prometheus monitoring is opt-in: set MONITORING=true (requires the
    # monitoring stack) to run the deploy.monitoring* steps.
    MONITORING: {default: "false", values: ["false", "true"]}
    MONITORING_VALUES: {default: ""}

    ACCELERATOR_TYPE: {default: gpu, values: [gpu, amd, xpu, "tpu/v5p", "tpu/v6", "tpu/v7"]}
    MODEL_SERVER: {default: vllm, values: [vllm, sglang]}
    # Offloading implementation and tier: the overlay is
    # modelserver/<ACCELERATOR_TYPE>/<MODEL_SERVER>/<CONNECTOR>/<VARIANT>/<INFRA_PROVIDER>/.
    # CONNECTOR and VARIANT are also the names the nightly E2E workflows override.
    CONNECTOR: {default: native, values: [native, lmcache-connector, mooncake-store], comment: "offloading implementation (table above)"}
    VARIANT: {default: cpu, values: [cpu, fs], comment: "offload tier: cpu = CPU RAM, fs = CPU RAM + shared filesystem (fs: single-host only)"}
    # gke: GKE overlays (ACCELERATOR_TYPE=gpu, tpu/*); amd-ci: AMD CI overlay (ACCELERATOR_TYPE=amd)
    INFRA_PROVIDER: {default: base, values: [base, gke, amd-ci]}
    HOST_TYPE: {default: single-host, values: [single-host, multi-host], comment: "multi-host: ACCELERATOR_TYPE=tpu/v7, MODEL_SERVER=vllm and VARIANT=cpu only"}
    STORAGE_CLASS: {default: "", comment: "VARIANT=fs only: StorageClass of the shared PVC, empty for the cluster default"}

    # ACCELERATOR_TYPE=xpu + CONNECTOR=lmcache-connector serves Qwen/Qwen3-8B,
    # and ACCELERATOR_TYPE=tpu/v7 serves Qwen/Qwen3.5-397B-A17B-FP8.
    MODEL: {default: "Qwen/Qwen3-32B", comment: "set to the model your accelerator serves (table above); xpu + lmcache-connector: Qwen/Qwen3-8B, tpu/v7: Qwen/Qwen3.5-397B-A17B-FP8"}

  source: ["${REPO_ROOT}/guides/env.sh # defines GAIE_VERSION, ROUTER_CHART_VERSION, router chart URLs, and CURL_TEST_IMAGE"]

prerequisites:
  clone:
    - skip_in: [ci]
      run: |
        export BRANCH=main
        git clone https://github.com/llm-d/llm-d.git && cd llm-d && git checkout ${BRANCH}

  gaie:
    - run: |
        # GAIE_URL is automatically calculated from GAIE_VERSION at ${REPO_ROOT}/guides/env.sh
        kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/${GAIE_URL}/v1-manifests.yaml
  namespace:
    - run: kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
  secrets:
    - skip_in: [ci]
      run: |
        kubectl create secret generic llm-d-hf-token \
          --from-literal="HF_TOKEN=${HF_TOKEN}" \
          --namespace "${NAMESPACE}" \
          --dry-run=client -o yaml | kubectl apply -f -

# Why some `when:` steps also carry `skip_in: [ci]`: guide.py only treats
# ACCELERATOR_TYPE / MODEL_SERVER filters as variants, and wraps non-default
# variants in cicd:skip markers in the README automatically. Steps keyed on
# CONNECTOR, HOST_TYPE or MONITORING render as plain fences with an
# `# only when ...` comment and no skip marker. The tiered nightlies stand the
# guide up by parsing the README's bash blocks and don't honor those comments,
# so `skip_in: [ci]` is what keeps them from running the MooncakeStore,
# TPU multi-host and router-monitoring steps, which no nightly covers.
# Drop it only once a nightly targets that configuration.
deploy:
  router_values:
    - run: |
        # Paths to values files
        export ROUTER_BASE_VALUES="${REPO_ROOT}/guides/recipes/router/base.values.yaml"
        export ROUTER_VALUES="${REPO_ROOT}/guides/${GUIDE_NAME}/router/${HOST_TYPE}/${GUIDE_NAME}-cpu.values.yaml"

  monitoring_values:
    # skip_in ci: the README-parsing nightlies harvest every `export`, and they
    # never enabled router monitoring for this guide.
    standard:
      - when: {MONITORING: ["true"]}
        skip_in: [ci]
        run: export MONITORING_VALUES="-f ${REPO_ROOT}/guides/recipes/router/features/monitoring.values.yaml"
    gke:
      - when: {MONITORING: ["true"], INFRA_PROVIDER: [gke]}
        skip_in: [ci]
        run: export MONITORING_VALUES="-f ${REPO_ROOT}/guides/recipes/router/features/monitoring-gke.values.yaml"

  standalone:
    - run: |
        helm install ${GUIDE_NAME} \
          ${ROUTER_STANDALONE_CHART} \
          -f ${ROUTER_BASE_VALUES} \
          ${MONITORING_VALUES} \
          -f ${ROUTER_VALUES} \
          -n ${NAMESPACE} --version ${ROUTER_CHART_VERSION}

  storage:
    - when: {VARIANT: [fs], CONNECTOR: [native, lmcache-connector], INFRA_PROVIDER: [base, gke]}
      run: |
        # ReadWriteMany PVC for the filesystem tier, mounted at /mnt/files-storage
        envsubst < ${REPO_ROOT}/guides/${GUIDE_NAME}/manifests/pvc.yaml | kubectl apply -n ${NAMESPACE} -f -

  mooncake:
    # skip_in ci: no nightly covers MooncakeStore (see the note above deploy:).
    - when: {CONNECTOR: [mooncake-store]}
      skip_in: [ci]
      run: |
        # Mooncake Master metadata service (namespace mooncake); use .../monitoring to also scrape it
        kubectl apply -k ${REPO_ROOT}/helpers/mooncake-master-store/base/
    - when: {CONNECTOR: [mooncake-store], VARIANT: [fs]}
      skip_in: [ci]
      run: |
        # Mooncake Client DaemonSet that owns the CPU DRAM + SSD pool, sized for Qwen3-32B
        kubectl apply -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/gpu/vllm/mooncake-store/fs/mooncake-client/

  modelserver:
    - when: {HOST_TYPE: [single-host]}
      run: |
        kubectl apply -n ${NAMESPACE} \
          -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/${CONNECTOR}/${VARIANT}/${INFRA_PROVIDER}/
    # skip_in ci: no nightly covers TPU multi-host (see the note above deploy:).
    - when: {HOST_TYPE: [multi-host]}
      skip_in: [ci]
      run: |
        # TPU v7 multi-host (LeaderWorkerSet), serving Qwen/Qwen3.5-397B-A17B-FP8
        kubectl apply -n ${NAMESPACE} \
          -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/tpu/v7/vllm/native/cpu/multi-host/

  monitoring:
    - when: {MONITORING: ["true"]}
      run: kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/recipes/modelserver/components/monitoring

verify:
  endpoint:
    standalone:
      - run: export IP=$(kubectl get service ${GUIDE_NAME}-epp -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}')
  tests:
    pvc:
      - when: {VARIANT: [fs], CONNECTOR: [native, lmcache-connector]}
        run: kubectl get pvc llm-d-kv-cache-storage -n ${NAMESPACE}
    model:
      - run: |
          # Fail fast if MODEL does not match the model the servers load (two
          # sub-variants serve a different model; see the MODEL comment above).
          # `false` (not `exit 1`) fails the step without closing an interactive shell.
          POD=$(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME} \
              -o go-template='{{range .items}}{{$i := index .metadata.labels "leaderworkerset.sigs.k8s.io/worker-index"}}{{if or (not $i) (eq $i "0")}}{{.metadata.name}} {{end}}{{end}}' | awk '{print $1}')
          SERVED=$(kubectl get --raw "/api/v1/namespaces/${NAMESPACE}/pods/${POD}:8000/proxy/v1/models" \
            | grep -o '"id": *"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          echo "model servers serve: ${SERVED}"
          [ "${SERVED}" = "${MODEL}" ] \
            || { echo "MODEL=${MODEL} does not match the served model: export MODEL=${SERVED}" >&2; false; }
    request:
      - run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"How are you today?\"}"'
    shared_prefix:
      - run: |
          # 10 requests that share a ~2k-token prefix and differ only in the last sentence
          kubectl run prefix-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'P=$(for i in $(seq 1 100); do printf "Evicted KV-cache blocks move to CPU RAM and are loaded back instead of recomputed. "; done)
              for i in $(seq 1 10); do
                curl -sS -o /dev/null -w "request ${i}: HTTP %{http_code}\n" -X POST "http://${IP}/v1/completions" \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"${MODEL}\", \"prompt\": \"${P} Question ${i}: what is llm-d?\", \"max_tokens\": 16}"
              done'
    offload_metrics:
      - when: {MODEL_SERVER: [vllm]}
        run: |
          # Offload counters of every model server pod, read through the
          # Kubernetes API server proxy (no port-forward needed). On TPU
          # multi-host only LeaderWorkerSet leaders (worker-index 0) serve :8000.
          for pod in $(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME} --request-timeout=10s \
              -o go-template='{{range .items}}{{$i := index .metadata.labels "leaderworkerset.sigs.k8s.io/worker-index"}}{{if or (not $i) (eq $i "0")}}{{.metadata.name}} {{end}}{{end}}'); do
            echo "== ${pod}"
            kubectl get --request-timeout=10s --raw "/api/v1/namespaces/${NAMESPACE}/pods/${pod}:8000/proxy/metrics" \
              | grep -E '^(vllm:(kv_offload_(store|load)_bytes_total|external_prefix_cache_(hits|queries)_total|prefix_cache_hits_total|request_success_total)|lmcache:(local_cache_usage|retrieve_hit_rate|num_(stored|hit)_tokens_total|time_to_store_count))' || true
          done
      - when: {MODEL_SERVER: [sglang]}
        run: |
          # HiCache counters of every model server pod, read through the
          # Kubernetes API server proxy (no port-forward needed). On TPU
          # multi-host only LeaderWorkerSet leaders (worker-index 0) serve :8000.
          for pod in $(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME} \
              -o go-template='{{range .items}}{{$i := index .metadata.labels "leaderworkerset.sigs.k8s.io/worker-index"}}{{if or (not $i) (eq $i "0")}}{{.metadata.name}} {{end}}{{end}}'); do
            echo "== ${pod}"
            kubectl get --raw "/api/v1/namespaces/${NAMESPACE}/pods/${pod}:8000/proxy/metrics" \
              | grep -E '^sglang[:_](hicache_host_used_tokens|evicted_tokens_total|load_back_tokens_total|cached_tokens_total)' || true
          done
    offload_gate:
      - when: {MODEL_SERVER: [vllm], CONNECTOR: [native], ACCELERATOR_TYPE: [gpu, amd, xpu]}
        run: |
          # Gate: the native OffloadingConnector writes every computed block to
          # the offload tier, so after the burst above the bytes stored, summed
          # over all model server pods, must be above zero.
          STORED=0
          for pod in $(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME} -o jsonpath='{.items[*].metadata.name}'); do
            STORED=$(kubectl get --raw "/api/v1/namespaces/${NAMESPACE}/pods/${pod}:8000/proxy/metrics" \
              | awk -v s="${STORED}" '/^vllm:kv_offload_store_bytes_total/ {s += $NF} END {print s + 0}')
          done
          echo "vllm:kv_offload_store_bytes_total (all pods): ${STORED}"
          awk -v s="${STORED}" 'BEGIN {exit !(s > 0)}' \
            || { echo "no KV-cache blocks were written to the offload tier: the connector is not active" >&2; false; }
      - when:
          ACCELERATOR_TYPE: [xpu]
          MODEL_SERVER: [vllm]
          CONNECTOR: [lmcache-connector]
          VARIANT: [cpu]
        run: |
          # Test each model pod directly. The client runs inside its modelserver
          # container, so requests and metrics use the same localhost endpoint.
          # No router affinity, cache clearing, helper pods or deployment changes.
          LLMD_LMCACHE_POD_PROBE="$(cat <<'PY'
          import json
          import math
          import re
          import signal
          import sys
          import time
          from decimal import Decimal, InvalidOperation
          from urllib.error import HTTPError
          from urllib.request import ProxyHandler, Request, build_opener

          model, invocation_id, deadline_arg = sys.argv[1:]
          deadline = time.monotonic() + (float(deadline_arg) - time.time())

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def remaining():
              seconds = deadline - time.monotonic()
              require(seconds > 0, "XPU LMCache validation deadline exceeded")
              return seconds

          def interrupted(signum, frame):
              raise RuntimeError(f"XPU LMCache validation interrupted (signal {signum})")

          for signum in (signal.SIGALRM, signal.SIGTERM, signal.SIGINT):
              signal.signal(signum, interrupted)
          signal.setitimer(signal.ITIMER_REAL, remaining())

          # Resolve the chunk size from the same installed configuration loader
          # used by the in-process adapter, including file/environment overrides.
          from lmcache.integration.vllm.utils import lmcache_get_or_create_config

          config = lmcache_get_or_create_config()
          chunk_size = config.chunk_size
          require(type(chunk_size) is int and chunk_size > 0,
                  f"Invalid effective LMCache chunk size: {chunk_size!r}")
          require(config.local_cpu, "LMCache local CPU tier is disabled")
          max_tokens = 16
          opener = build_opener(ProxyHandler({}))

          def http(path, payload=None, timeout=10):
              request = Request(
                  "http://127.0.0.1:8000" + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with opener.open(request, timeout=min(timeout, remaining())) as response:
                      require(200 <= response.status < 300,
                              f"{path}: unsuccessful HTTP status {response.status}")
                      body = response.read(8 * 1024 * 1024 + 1)
              except HTTPError as error:
                  detail = error.read(4096).decode(errors="replace")
                  raise RuntimeError(f"{path}: HTTP {error.code}: {detail}") from error
              require(len(body) <= 8 * 1024 * 1024, f"{path}: response is too large")
              remaining()
              return body.decode()

          def http_json(path, payload=None, timeout=10):
              def invalid_constant(value):
                  raise ValueError(f"Non-finite JSON constant: {value}")
              try:
                  value = json.loads(http(path, payload, timeout),
                                     parse_constant=invalid_constant)
              except (ValueError, UnicodeError) as error:
                  raise RuntimeError(f"{path}: invalid JSON response") from error
              require(isinstance(value, dict), f"{path}: expected a JSON object")
              require("error" not in value, f"{path}: application error: {value.get('error')}")
              return value

          models = http_json("/v1/models").get("data")
          require(isinstance(models, list) and len(models) == 1
                  and isinstance(models[0], dict) and models[0].get("id") == model,
                  f"Served model does not match {model!r}: {models!r}")

          # Tokenize the actual completion prompt, rather than estimating from
          # characters. Keep at least four complete chunks, and use the server's
          # effective context limit before attempting inference.
          target_tokens = max(1024, 4 * chunk_size)
          passage = (
              "Evicted KV-cache blocks move to CPU RAM and are loaded back "
              "instead of recomputed. "
          )
          repetitions = 64
          while True:
              prompt = (
                  f"Unique KV transfer validation {invocation_id}. "
                  + passage * repetitions
                  + "\nWhat is six multiplied by seven? Answer with the number only.\nAnswer:"
              )
              tokenized = http_json("/tokenize", {
                  "model": model, "prompt": prompt, "add_special_tokens": True,
              })
              prompt_tokens = tokenized.get("count")
              tokens = tokenized.get("tokens")
              context_limit = tokenized.get("max_model_len")
              require(type(prompt_tokens) is int and prompt_tokens > 0
                      and isinstance(tokens, list) and len(tokens) == prompt_tokens
                      and all(type(token) is int and token >= 0 for token in tokens),
                      f"Invalid tokenization response: {tokenized!r}")
              require(type(context_limit) is int and context_limit > max_tokens,
                      f"Invalid model context limit: {context_limit!r}")
              require(prompt_tokens + max_tokens <= context_limit,
                      f"Validation prompt ({prompt_tokens} tokens) plus generation "
                      f"does not fit the {context_limit}-token context")
              if prompt_tokens >= target_tokens:
                  break
              repetitions *= 2

          stored_name = "lmcache:num_stored_tokens_total"
          store_count_name = "lmcache:time_to_store_count"
          hit_name = "lmcache:num_hit_tokens_total"
          resident_name = "vllm:prefix_cache_hits_total"
          success_name = "vllm:request_success_total"
          metric_names = {stored_name, store_count_name, hit_name, resident_name, success_name}
          sample_pattern = re.compile(
              r'([a-zA-Z_:][a-zA-Z0-9_:]*)(?:\{(.*)\})?\s+(\S+)(?:\s+[0-9]+)?'
          )
          label_pattern = re.compile(
              r'\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*("(?:[^"\\]|\\.)*")\s*(?:,|$)'
          )
          previous_series = {}

          def metrics(require_store_count=False):
              series = {name: {} for name in metric_names}
              for line in http("/metrics").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  name_match = re.match(r'[a-zA-Z_:][a-zA-Z0-9_:]*', line)
                  if not name_match or name_match[0] not in metric_names:
                      continue
                  match = sample_pattern.fullmatch(line)
                  require(match is not None, f"Malformed metric sample: {line!r}")
                  name, label_text, raw_value = match.groups()
                  labels = {}
                  position = 0
                  while position < len(label_text or ""):
                      label = label_pattern.match(label_text, position)
                      require(label is not None, f"Malformed metric labels: {line!r}")
                      key, value = label.groups()
                      require(key not in labels, f"Duplicate metric label: {line!r}")
                      labels[key] = json.loads(value)
                      position = label.end()
                  require(re.fullmatch(
                      r'[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?',
                      raw_value,
                  ) is not None, f"Malformed metric value: {line!r}")
                  try:
                      value = Decimal(raw_value)
                  except InvalidOperation as error:
                      raise RuntimeError(f"Malformed metric value: {line!r}") from error
                  require(math.isfinite(float(raw_value)) and value.is_finite() and value >= 0
                          and value == value.to_integral_value(),
                          f"Invalid counter value: {line!r}")
                  if any(labels[key] != model for key in ("model_name", "served_model_name")
                         if key in labels):
                      continue
                  if name.startswith("lmcache:") and labels.get("role", "worker") != "worker":
                      continue
                  if name == success_name and labels.get("finished_reason") not in ("stop", "length"):
                      continue
                  identity = tuple(sorted(labels.items()))
                  require(identity not in series[name], f"Duplicate metric sample: {line!r}")
                  series[name][identity] = int(value)

              for name in metric_names:
                  # LMCache creates histogram children only on observe(). An
                  # absent initial store count represents no observations; it
                  # must appear with a positive delta after the cold request.
                  require(series[name] or (name == store_count_name and not require_store_count),
                          f"Missing required metric: {name}")
                  for identity, old_value in previous_series.get(name, {}).items():
                      require(identity in series[name],
                              f"Metric series disappeared: {name} {identity!r}")
                      require(series[name][identity] >= old_value,
                              f"Counter rollback: {name} {identity!r}")
              previous_series.clear()
              previous_series.update(series)
              return {name: sum(values.values()) for name, values in series.items()}

          def completion(salt):
              response = http_json("/v1/completions", {
                  "model": model, "prompt": prompt, "max_tokens": max_tokens,
                  "temperature": 0, "top_p": 1, "seed": 123, "n": 1,
                  "stream": False, "add_special_tokens": True, "cache_salt": salt,
              }, timeout=90)
              choices = response.get("choices")
              require(isinstance(choices, list) and len(choices) == 1
                      and isinstance(choices[0], dict),
                      f"Invalid completion choices: {response!r}")
              text = choices[0].get("text")
              require(isinstance(text, str) and text.strip(),
                      f"Empty completion: {response!r}")
              require(choices[0].get("finish_reason") in ("stop", "length"),
                      f"Unsuccessful completion: {response!r}")
              usage = response.get("usage")
              require(isinstance(usage, dict) and usage.get("prompt_tokens") == prompt_tokens
                      and type(usage.get("completion_tokens")) is int
                      and 0 < usage["completion_tokens"] <= max_tokens,
                      f"Completion usage does not match the tokenized prompt: {usage!r}")
              return text

          def wait_for(stage, predicate, require_store_count=False):
              poll_deadline = time.monotonic() + min(30, remaining())
              while True:
                  current = metrics(require_store_count)
                  require(time.monotonic() < poll_deadline,
                          f"Timed out waiting for {stage}: {current!r}")
                  if predicate(current):
                      return current
                  time.sleep(min(1, remaining(), max(0, poll_deadline - time.monotonic())))

          baseline = metrics()
          print(f"Cold inference: tokens={prompt_tokens}, chunk_size={chunk_size}", flush=True)
          cold_text = completion(invocation_id + "-cold")
          stored = wait_for(
              "a full-chunk store attempt and a completed store observation",
              lambda current: current[stored_name] - baseline[stored_name] >= chunk_size
                  and current[store_count_name] > baseline[store_count_name]
                  and current[success_name] > baseline[success_name],
          )
          require(stored[hit_name] == baseline[hit_name],
                  "Unique cold prompt unexpectedly retrieved existing LMCache tokens")

          # A fresh baseline prevents the cold request's observations from
          # satisfying warm assertions. Different salts change vLLM's resident
          # block hashes; LMCache v0.5.0 keys are derived from the same tokens.
          retrieval_baseline = metrics(require_store_count=True)
          print("Warm inference with identical tokens and a distinct cache_salt", flush=True)
          warm_text = completion(invocation_id + "-warm")
          require(cold_text == warm_text,
                  f"Cold/warm output mismatch: cold={cold_text!r}, warm={warm_text!r}")
          retrieved = wait_for(
              "completed LMCache retrieval and published warm request statistics",
              lambda current: current[hit_name] > retrieval_baseline[hit_name]
                  and current[success_name] > retrieval_baseline[success_name],
              require_store_count=True,
          )
          resident_hits = retrieved[resident_name] - retrieval_baseline[resident_name]
          require(resident_hits == 0,
                  f"Warm request reused {resident_hits} resident prefix-cache tokens")
          print("LLMD_XPU_LMCACHE_KV_EVIDENCE=" + json.dumps({
              "validated": True,
              "invocation_id": invocation_id,
              "model": model,
              "chunk_size": chunk_size,
              "prompt_tokens": prompt_tokens,
              "stored_token_delta": stored[stored_name] - baseline[stored_name],
              "completed_store_delta": stored[store_count_name] - baseline[store_count_name],
              "completed_retrieval_token_delta": retrieved[hit_name] - retrieval_baseline[hit_name],
              "warm_resident_prefix_hit_delta": resident_hits,
              "cold_salt": invocation_id + "-cold",
              "warm_salt": invocation_id + "-warm",
              "output": warm_text,
              "outputs_equal": True,
          }), flush=True)
          PY
          )"
          LLMD_XPU_LMCACHE_POD_PROBE="$LLMD_LMCACHE_POD_PROBE" python3 - <<'PY'
          import json
          import math
          import os
          import signal
          import subprocess
          import time
          import uuid

          namespace = os.environ["NAMESPACE"]
          guide = os.environ["GUIDE_NAME"]
          model = os.environ["MODEL"]
          deadline = float(os.environ.get("LLMD_XPU_LMCACHE_KV_DEADLINE", time.time() + 270))
          if not math.isfinite(deadline):
              raise RuntimeError("Invalid XPU LMCache validation deadline")
          deadline_monotonic = time.monotonic() + (deadline - time.time())

          def remaining():
              seconds = deadline_monotonic - time.monotonic()
              if seconds <= 0:
                  raise RuntimeError("XPU LMCache validation deadline exceeded")
              return seconds

          def interrupted(signum, frame):
              raise RuntimeError(f"XPU LMCache validation interrupted (signal {signum})")

          for signum in (signal.SIGALRM, signal.SIGTERM, signal.SIGINT):
              signal.signal(signum, interrupted)
          signal.setitimer(signal.ITIMER_REAL, remaining())

          def kubectl(*arguments, program=None, timeout=10):
              result = subprocess.run(
                  ["kubectl", "-n", namespace, *arguments],
                  input=program, text=True, capture_output=True,
                  timeout=min(timeout, remaining()),
              )
              if program is not None and result.stdout:
                  print(result.stdout, end="", flush=True)
              if result.returncode:
                  raise RuntimeError(
                      f"kubectl {' '.join(arguments)} failed ({result.returncode}): "
                      f"{result.stderr or result.stdout}"
                  )
              remaining()
              return result.stdout

          def snapshot():
              response = json.loads(kubectl(
                  "get", "pods", "-l", f"llm-d.ai/guide={guide}",
                  "-o", "json", "--request-timeout=10s",
              ))
              pods = {}
              for pod in response["items"]:
                  metadata = pod["metadata"]
                  labels = metadata.get("labels", {})
                  worker_index = labels.get("leaderworkerset.sigs.k8s.io/worker-index")
                  if worker_index is not None and worker_index != "0":
                      continue
                  containers = [
                      container for container in pod["spec"]["containers"]
                      if container["name"] == "modelserver"
                  ]
                  if not containers:
                      if labels.get("llm-d.ai/role") in ("decode", "prefill"):
                          raise RuntimeError(f"{metadata['name']}: missing modelserver container")
                      continue  # Router/helper pods do not run a modelserver.
                  name = metadata["name"]
                  if len(containers) != 1 or metadata.get("deletionTimestamp"):
                      raise RuntimeError(f"{name}: ambiguous or terminating model pod")
                  status = pod.get("status", {})
                  ready = any(condition["type"] == "Ready" and condition["status"] == "True"
                              for condition in status.get("conditions", []))
                  container_status = next((
                      item for item in status.get("containerStatuses", [])
                      if item["name"] == "modelserver"
                  ), {})
                  running = container_status.get("state", {}).get("running", {})
                  if (status.get("phase") != "Running" or not ready
                          or not container_status.get("ready") or not running
                          or not container_status.get("containerID")
                          or type(container_status.get("restartCount")) is not int):
                      raise RuntimeError(f"{name}: model pod is not healthy: {status!r}")
                  pods[name] = (
                      metadata["uid"], container_status["containerID"],
                      container_status["restartCount"], running["startedAt"],
                  )
              if not pods:
                  raise RuntimeError(f"No eligible model-server pods for {guide} in {namespace}")
              return pods

          initial = snapshot()

          def unchanged():
              current = snapshot()
              if current != initial:
                  raise RuntimeError(
                      f"Model pods were replaced, restarted or changed during validation: "
                      f"before={initial!r}, after={current!r}"
                  )

          for pod_name in sorted(initial):
              unchanged()
              invocation_id = str(uuid.uuid4())
              print(f"== XPU LMCache KV-transfer gate: {pod_name}", flush=True)
              output = kubectl(
                  "exec", "-i", pod_name, "-c", "modelserver",
                  "--", "python3", "-", model, invocation_id, str(deadline),
                  program=os.environ["LLMD_XPU_LMCACHE_POD_PROBE"], timeout=remaining(),
              )
              reports = [
                  json.loads(line.partition("=")[2]) for line in output.splitlines()
                  if line.startswith("LLMD_XPU_LMCACHE_KV_EVIDENCE=")
              ]
              if (len(reports) != 1 or reports[0].get("validated") is not True
                      or reports[0].get("invocation_id") != invocation_id):
                  raise RuntimeError(f"{pod_name}: missing completed KV-transfer evidence")
              unchanged()
          unchanged()
          print(f"All {len(initial)} model-server pods passed the XPU LMCache KV-transfer gate")
          PY
          # Set this in Bash only after every pod's Python validator succeeds.
          LLMD_XPU_LMCACHE_KV_VALIDATED=1
    shared_tier:
      - when: {MODEL_SERVER: [vllm], VARIANT: [fs], CONNECTOR: [native]}
        run: |
          # Prime a new prefix on the first pod, then send it to the second pod,
          # which has never seen it and must load it from the shared filesystem tier
          PODS=($(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME} -o jsonpath='{.items[*].metadata.name}'))
          IPS=($(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME} -o jsonpath='{.items[*].status.podIP}'))
          if [ ${#PODS[@]} -lt 2 ]; then
            echo "needs at least 2 model server pods, found ${#PODS[@]} (e.g. Intel XPU runs 1): skipping"
          else
          kubectl run shared-tier-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="FIRST=${IPS[0]}" \
            --env="SECOND=${IPS[1]}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'P=$(for i in $(seq 1 100); do printf "The shared filesystem tier lets every replica reuse KV-cache blocks written by another. "; done)
              for ip in ${FIRST} ${SECOND}; do
                curl -sS -o /dev/null -w "${ip}: HTTP %{http_code}\n" -X POST "http://${ip}:8000/v1/completions" \
                  -H "Content-Type: application/json" \
                  -d "{\"model\": \"${MODEL}\", \"prompt\": \"${P}\", \"max_tokens\": 1}"
                sleep 10
              done'
          kubectl get --raw "/api/v1/namespaces/${NAMESPACE}/pods/${PODS[1]}:8000/proxy/metrics" \
            | grep -E '^vllm:external_prefix_cache_hits_total' || true
          fi

# skip_in ci on the multi-host and MooncakeStore steps below: same reason as in
# deploy (no nightly covers them; see the note above deploy:).
cleanup:
  modelserver:
    - when: {HOST_TYPE: [single-host]}
      run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/${CONNECTOR}/${VARIANT}/${INFRA_PROVIDER}
    - when: {HOST_TYPE: [multi-host]}
      skip_in: [ci]
      run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/tpu/v7/vllm/native/cpu/multi-host
  storage:
    - when: {VARIANT: [fs], CONNECTOR: [native, lmcache-connector], INFRA_PROVIDER: [base, gke]}
      run: kubectl delete -n ${NAMESPACE} -f ${REPO_ROOT}/guides/${GUIDE_NAME}/manifests/pvc.yaml --ignore-not-found=true
  mooncake:
    - when: {CONNECTOR: [mooncake-store], VARIANT: [fs]}
      skip_in: [ci]
      run: kubectl delete -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/gpu/vllm/mooncake-store/fs/mooncake-client/ --ignore-not-found=true
    - when: {CONNECTOR: [mooncake-store]}
      skip_in: [ci]
      run: kubectl delete -k ${REPO_ROOT}/helpers/mooncake-master-store/base/ --ignore-not-found=true
  rest:
    - run: helm uninstall ${GUIDE_NAME} -n ${NAMESPACE}
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/recipes/modelserver/components/monitoring --ignore-not-found=true
    - skip_in: [ci]
      run: kubectl delete namespace ${NAMESPACE}
