apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# INFRA_PROVIDER=base: the P2P transfers run over TCP. Prefill and decode pods
# with the same engine configuration: ./decode, and ./prefill derived from it.
# Both carry the guide label, which the render Service and the InferencePool
# select; the EPP tells the roles apart by llm-d.ai/role.
resources:
  - decode
  - prefill
