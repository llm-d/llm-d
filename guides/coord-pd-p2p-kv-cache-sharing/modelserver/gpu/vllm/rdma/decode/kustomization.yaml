apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The decode Deployment with an InfiniBand device (rdma/ib) and IPC_LOCK, so
# the P2P transfers run over RDMA (patch-rdma.yaml).
resources:
  - ../../base/decode

patches:
  - path: patch-rdma.yaml
    target:
      kind: Deployment
      name: decode
