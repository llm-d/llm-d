apiVersion: v1
kind: Service
metadata:
  name: render
  labels:
    app.kubernetes.io/component: vllm-render
spec:
  # This Service owns no pods: it fronts the guide's model server pods of both
  # roles, which expose vLLM's /v1/*/render endpoints (--enable-scale-out).
  # The EPP token-producer tokenizes on the serving fleet, and capacity scales
  # with it. targetPort is the engine port. Only Ready endpoints receive
  # traffic, so render calls never reach a pod still loading weights.
  selector:
    llm-d.ai/guide: coord-pd-p2p-kv-cache-sharing
    llm-d.ai/engine-type: vllm
  ports:
    - name: render-http
      port: 8000
      targetPort: 8200
