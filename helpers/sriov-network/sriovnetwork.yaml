apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetwork
metadata:
  name: ${NAMESPACE}-rdma
  namespace: openshift-sriov-network-operator
spec:
  resourceName: ${SRIOV_RESOURCE_NAME}
  networkNamespace: ${NAMESPACE}
  # range is the fabric's whole subnet, shared with the other networks on it, so
  # they all allocate from one whereabouts pool and can't hand out the same IP.
  # range_start/range_end pick this network's slice of it -- see "Picking the
  # IP range" in ./README.md.
  ipam: |
    {
      "type": "whereabouts",
      "range": "${SRIOV_IPAM_RANGE}",
      "range_start": "${SRIOV_IPAM_RANGE_START}",
      "range_end": "${SRIOV_IPAM_RANGE_END}"
    }
  # No "rdma" metaPlugin: it requires the node's RDMA subsystem in netns
  # "exclusive" mode, but a cluster running "shared" mode (required by
  # shared-pool RDMA device plugins used elsewhere) can't use it. Plain VF
  # passthrough still gives the pod a dedicated netdev/MAC/IP; the consuming
  # guide's render step matches that VF to its RDMA device via PCI address
  # (sysfs), not by IP/GID guessing.
  logLevel: info
