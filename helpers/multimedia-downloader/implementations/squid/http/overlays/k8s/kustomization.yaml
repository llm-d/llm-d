apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

components:
- ../../../components/security

# ubuntu/squid starts as root, so runAsNonRoot needs an explicit uid: the "proxy" user (13).
patches:
- target:
    kind: Deployment
    name: multimedia-downloader
  patch: |
    - op: add
      path: /spec/template/spec/securityContext/fsGroup
      value: 13
    - op: add
      path: /spec/template/spec/containers/0/securityContext/runAsUser
      value: 13
