apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace: here on purpose -- this master is deployed once per consuming
# namespace, alongside the model servers that use it, so placement comes from
# `kubectl apply -n ${NAMESPACE}`. See ../README.md.
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/name: mooncake-master-store
      app.kubernetes.io/component: master-store
      app.kubernetes.io/part-of: mooncake
    includeTemplates: true
    includeSelectors: true
