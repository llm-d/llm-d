apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mooncake
resources:
  - namespace.yaml
  - service.yaml
  - deployment.yaml

components:
  # Keep the Master and SGLang client on exactly the same Mooncake version.
  - ../../../guides/recipes/modelserver/components/images/gpu-sglang

labels:
  - pairs:
      app.kubernetes.io/name: mooncake-master-store
      app.kubernetes.io/component: master-store
      app.kubernetes.io/part-of: mooncake
    includeTemplates: true
    includeSelectors: true
