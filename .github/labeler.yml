# Path-based area/* labels. .github/labeler.yml is the canonical source for
# additive path globs. See .github/area_taxonomy.md for /area directives,
# Issue Form mappings, additive overlap rules, and the synced docs-only label.
#
# Evaluated by .github/scripts/area_labels.py using the actions/labeler schema.
# Supported glob syntax: `*`, `?`, whole-segment `**`, and `{a,b}` braces.

# --- Structural areas ---

# Well-lit path, model, and operations deployment guides
area/guides:
  - changed-files:
      - any-glob-to-any-file:
          - "guides/**"

# Website documentation, architecture docs, and markdown READMEs
# (excludes .github/workflows/*.md agentic workflows and release/README.md)
area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**/*.md"
          - "docs/**/*.mdx"
          - "docs/**/*.png"
          - "docs/**/*.svg"
          - "docs/**/*.gif"
          - "docs/menu-config.json"
          - "docs/well-lit-paths/guides.yaml"
          - "proposals/**/*.md"
          - "proposals/**/*.png"
          - "proposals/**/*.svg"
          - "proposals/**/*.gif"
          - "guides/**/*.md"
          - "guides/**/*.png"
          - "guides/**/*.svg"
          - "guides/**/*.gif"
          - "helpers/**/*.md"
          - "scripts/**/*.md"
          - "docker/**/*.md"
          - ".github/area_taxonomy.md"
          - ".github/workflows/README.md"
          - ".github/scripts/**/README.md"
          - "DCO"
          - "LICENSE"

# Design proposals and project RFCs
area/proposals:
  - changed-files:
      - any-glob-to-any-file:
          - "proposals/**"

# Shared K8s/Gateway recipes, cloud providers, RDMA/storage infra, orchestration, and helpers
area/infra:
  - changed-files:
      - any-glob-to-any-file:
          - "guides/recipes/**"
          - "guides/no-kubernetes-deployment/**"
          - "guides/rollouts/**"
          - "docs/infrastructure/**"
          - "docs/operations/lifecycle/**"
          - "docs/architecture/model-server-orchestration/**"
          - "docs/architecture/model-servers/**"
          - "helpers/**"
          - "proposals/inference-resilience-operator.md"
          - "proposals/modelservice.md"
          - "proposals/non-kubernetes-mode.md"

# Container image Dockerfiles, build scripts, constraints, and upstream patches
area/docker:
  - changed-files:
      - any-glob-to-any-file:
          - "docker/**"
          - "patches/**"
          - ".dockerignore"
          - ".hadolint.yaml"

# CI/CD workflows, E2E/release matrices, repo scripts, git hooks, and linters
area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
          - "hooks/**"
          - "release/**"
          - "Makefile"
          - "OWNERS"
          - ".editorconfig"
          - ".gitattributes"
          - ".gitignore"
          - ".markdownlint.json"
          - ".pre-commit-config.yaml"
          - ".prowlabels.yaml"
          - "_typos.toml"

