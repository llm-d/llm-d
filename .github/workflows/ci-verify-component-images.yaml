name: CI Verify Component Images

# The centralized image components under
# guides/recipes/modelserver/components/images/ define the default container
# image for each accelerator/engine combination; guides pull them in as
# Kustomize components. When any of those references change, confirm every
# image still resolves to a real manifest in its registry (a typo'd tag or a
# deleted image otherwise only surfaces at deploy time). We inspect manifests
# with `docker buildx imagetools inspect` rather than pulling full layers.

on:
  pull_request:
    branches: [main]
    paths:
      - guides/recipes/modelserver/components/images/**
      - .github/scripts/list-component-images.py
      - .github/workflows/ci-verify-component-images.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-verify-component-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-component-images:
    name: Verify component images are pullable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --quiet 'pyyaml==6.*'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ghcr.io returns "not found" for anonymous manifest lookups even on
      # public images, so authenticate with the built-in token. The default
      # GITHUB_TOKEN can read ghcr.io/llm-d/* packages from within the repo.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify each component image resolves
        run: |
          mapfile -t IMAGES < <(python .github/scripts/list-component-images.py)

          echo "## Component Image Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"

          MISSING=0
          for img in "${IMAGES[@]}"; do
            if docker buildx imagetools inspect "$img" > /dev/null 2>&1; then
              echo "| \`${img}\` | ✅ Found |" >> "$GITHUB_STEP_SUMMARY"
              echo "OK: $img"
            else
              echo "| \`${img}\` | ❌ Unreachable |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Image not pullable: $img"
              MISSING=$((MISSING + 1))
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MISSING" -gt 0 ]; then
            echo "**${MISSING} of ${#IMAGES[@]} component image(s) unreachable.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "**All ${#IMAGES[@]} component images resolved successfully.**" >> "$GITHUB_STEP_SUMMARY"
