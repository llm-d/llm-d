# Labels open PRs with `needs-rebase` and notifies the author when changes on
# `main` introduce merge conflicts. Removes `needs-rebase` once resolved.

name: PR Needs Rebase

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  check-single-pr:
    name: Clear needs-rebase if resolved
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(github.event.pull_request.labels.*.name, 'needs-rebase')
    runs-on: ubuntu-latest
    steps:
      - name: Check mergeability and remove label if conflict-free
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for attempt in 1 2 3 4; do
            MERGEABLE=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.mergeable')
            if [[ "$MERGEABLE" != "null" && -n "$MERGEABLE" ]]; then
              break
            fi
            sleep 3
          done

          if [[ "$MERGEABLE" == "true" ]]; then
            echo "PR #${PR_NUMBER} is now mergeable; removing needs-rebase label."
            gh issue edit "$PR_NUMBER" --repo "$REPO" --remove-label "needs-rebase" || true
          else
            echo "PR #${PR_NUMBER} mergeable=${MERGEABLE}; keeping needs-rebase label."
          fi

  check-open-prs:
    name: Check open PRs for merge conflicts
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Scan open PRs targeting main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "needs-rebase" \
            --repo "$REPO" \
            --color "ff578a" \
            --description "PR has merge conflicts and needs a rebase" \
            --force >/dev/null 2>&1 || true

          # Allow GitHub a brief window to invalidate mergeability cache after push to main
          sleep 5

          PRS=$(gh pr list --repo "$REPO" --base main --state open --limit 100 \
            --json number,isDraft,author,labels \
            --jq '.[] | select(.isDraft == false) | @base64')

          for row in $PRS; do
            _jq() {
              echo "${row}" | base64 --decode | jq -r "${1}"
            }
            PR_NUMBER=$(_jq '.number')
            AUTHOR=$(_jq '.author.login')
            HAS_LABEL=$(echo "${row}" | base64 --decode | jq -r '([.labels[].name] | index("needs-rebase")) != null')

            MERGEABLE="null"
            for attempt in 1 2 3 4; do
              MERGEABLE=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.mergeable')
              if [[ "$MERGEABLE" != "null" && -n "$MERGEABLE" ]]; then
                break
              fi
              sleep 3
            done

            echo "PR #${PR_NUMBER} (@${AUTHOR}): mergeable=${MERGEABLE}, has_label=${HAS_LABEL}"

            if [[ "$MERGEABLE" == "false" && "$HAS_LABEL" == "false" ]]; then
              echo "Labeling and notifying PR #${PR_NUMBER}"
              gh issue edit "$PR_NUMBER" --repo "$REPO" --add-label "needs-rebase"
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "@${AUTHOR} This PR has merge conflicts with \`main\`. Please rebase on \`main\` and push to resolve them:
          \`\`\`bash
          gh pr checkout ${PR_NUMBER}
          git fetch origin main
          git rebase origin/main
          # resolve conflicts
          git push --force-with-lease
          \`\`\`"
            elif [[ "$MERGEABLE" == "true" && "$HAS_LABEL" == "true" ]]; then
              echo "Removing needs-rebase label from PR #${PR_NUMBER}"
              gh issue edit "$PR_NUMBER" --repo "$REPO" --remove-label "needs-rebase" || true
            fi
          done
