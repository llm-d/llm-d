# Manages rebase and re-approval labels for open PRs:
# 1. On push to `main`, labels conflicting non-draft PRs with `needs-rebase` and notifies the author.
# 2. When a PR is updated (or marked ready for review) and conflict-free, removes `needs-rebase`,
#    adds `re-approve`, and pings the previous approver(s) if the PR was approved before the rebase.
# 3. Removes `re-approve` once the PR is re-approved.

name: PR Needs Rebase

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [synchronize, reopened, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  clear-re-approve:
    name: Clear re-approve label on approval
    if: >-
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        contains(github.event.pull_request.labels.*.name, 're-approve')
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'lgtm' || github.event.label.name == 'approved') &&
        contains(github.event.pull_request.labels.*.name, 're-approve')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Remove re-approve label
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pull_number,
                name: 're-approve',
              });
              console.log(`Removed re-approve label from PR #${pull_number}.`);
            } catch (e) {
              if (e.status !== 404) throw e;
            }

  check-single-pr:
    name: Update needs-rebase and re-approve on PR update
    if: >-
      github.event_name == 'pull_request_target' &&
      (
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        github.event.action == 'ready_for_review'
      ) &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check mergeability and prior approval state
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const needsRebaseLabel = 'needs-rebase';
            const reApproveLabel = 're-approve';
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const isHumanReviewer = (user, prAuthor) =>
              Boolean(
                user &&
                  user.login &&
                  user.login !== prAuthor &&
                  user.type !== 'Bot' &&
                  !user.login.endsWith('[bot]')
              );

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } else {
                  throw e;
                }
              }
            }

            let pr = null;
            for (let attempt = 0; attempt < 6; attempt++) {
              const resp = await github.rest.pulls.get({ owner, repo, pull_number });
              pr = resp.data;
              if (pr.mergeable !== null) break;
              await sleep(3000 * (attempt + 1));
            }

            const prAuthor = pr.user.login;
            const labels = (pr.labels || []).map((l) => l.name);
            const hasNeedsRebase = labels.includes(needsRebaseLabel);
            const hasReApprove = labels.includes(reApproveLabel);

            if (pr.mergeable === true) {
              if (hasNeedsRebase) {
                console.log(`PR #${pull_number} is now mergeable; removing ${needsRebaseLabel}.`);
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pull_number,
                    name: needsRebaseLabel,
                  });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }

              // Check whether the PR had a prior approval that was dismissed or removed by the rebase.
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number,
                per_page: 100,
              });

              const latestByUser = new Map();
              let approvedOnHead = false;
              for (const r of reviews) {
                if (!isHumanReviewer(r.user, prAuthor)) continue;
                const user = r.user.login;
                if (['APPROVED', 'DISMISSED', 'CHANGES_REQUESTED'].includes(r.state)) {
                  latestByUser.set(user, r.state);
                }
                if (r.state === 'APPROVED' && r.commit_id === pr.head.sha) {
                  approvedOnHead = true;
                }
              }

              const priorApprovers = new Set();
              let hasChangesRequested = false;
              for (const [user, state] of latestByUser.entries()) {
                if (state === 'CHANGES_REQUESTED') {
                  hasChangesRequested = true;
                } else if (state === 'DISMISSED' || state === 'APPROVED') {
                  priorApprovers.add(user);
                }
              }

              let wasPreviouslyApproved = priorApprovers.size > 0;
              if (!wasPreviouslyApproved) {
                const events = await github.paginate(github.rest.issues.listEvents, {
                  owner,
                  repo,
                  issue_number: pull_number,
                  per_page: 100,
                });
                const hadApprovalLabelRemoved = events.some(
                  (ev) =>
                    ev.event === 'unlabeled' &&
                    ev.label &&
                    (ev.label.name === 'lgtm' || ev.label.name === 'approved')
                );
                if (hadApprovalLabelRemoved) {
                  wasPreviouslyApproved = true;
                  for (const ev of events) {
                    if (
                      ev.event === 'labeled' &&
                      ev.label &&
                      (ev.label.name === 'lgtm' || ev.label.name === 'approved') &&
                      isHumanReviewer(ev.actor, prAuthor)
                    ) {
                      priorApprovers.add(ev.actor.login);
                    }
                  }
                  if (priorApprovers.size === 0) {
                    const comments = await github.paginate(github.rest.issues.listComments, {
                      owner,
                      repo,
                      issue_number: pull_number,
                      per_page: 100,
                    });
                    for (const c of comments) {
                      if (
                        isHumanReviewer(c.user, prAuthor) &&
                        /(?:^|\s)\/(?:lgtm|approve)\b/i.test(c.body || '')
                      ) {
                        priorApprovers.add(c.user.login);
                      }
                    }
                  }
                }
              }

              const hasActiveApprovalLabel = labels.includes('lgtm') || labels.includes('approved');
              if (
                wasPreviouslyApproved &&
                !hasChangesRequested &&
                !approvedOnHead &&
                !hasActiveApprovalLabel &&
                !hasReApprove
              ) {
                await ensureLabel(
                  reApproveLabel,
                  '0e8a16',
                  'PR was rebased after prior approval and needs re-approval'
                );
                const mentions = Array.from(priorApprovers)
                  .map((u) => `@${u}`)
                  .join(' ');
                const commentPrefix = mentions ? `${mentions} ` : '';
                const body = `${commentPrefix}@${prAuthor} has updated/rebased this PR and it is now conflict-free. Since the prior approval was dismissed on push, please take another look and re-approve when ready.`;
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body,
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pull_number,
                  labels: [reApproveLabel],
                });
                console.log(
                  `Added ${reApproveLabel} label and pinged (${mentions || 'maintainers'}) on PR #${pull_number}.`
                );
              }
            } else if (pr.mergeable === false) {
              if (hasReApprove) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pull_number,
                    name: reApproveLabel,
                  });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }
              if (!hasNeedsRebase) {
                await ensureLabel(
                  needsRebaseLabel,
                  'ff578a',
                  'PR has merge conflicts and needs a rebase'
                );
                const body = [
                  `@${prAuthor} This PR has merge conflicts with \`${pr.base.ref}\`. Please rebase on \`${pr.base.ref}\` and push to resolve them:`,
                  '```bash',
                  `gh pr checkout ${pull_number}`,
                  `git fetch origin ${pr.base.ref}`,
                  `git rebase origin/${pr.base.ref}`,
                  '# resolve conflicts',
                  'git push --force-with-lease',
                  '```',
                ].join('\n');
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body,
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pull_number,
                  labels: [needsRebaseLabel],
                });
              }
            }

  check-open-prs:
    name: Check open PRs for merge conflicts
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Scan open PRs targeting main
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = 'needs-rebase';
            const reApproveLabel = 're-approve';
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: 'ff578a',
                  description: 'PR has merge conflicts and needs a rebase',
                });
              } else {
                throw e;
              }
            }

            // Give GitHub a brief window to invalidate mergeability after a push to main.
            await sleep(5000);

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            for (const item of prs) {
              if (item.draft) continue;
              const pull_number = item.number;
              const author = item.user.login;
              const hasLabel = item.labels.some((l) => l.name === labelName);
              const hasReApprove = item.labels.some((l) => l.name === reApproveLabel);

              let mergeable = null;
              for (let attempt = 0; attempt < 6; attempt++) {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
                mergeable = pr.mergeable;
                if (mergeable !== null) break;
                await sleep(3000 * (attempt + 1));
              }

              console.log(`PR #${pull_number} (@${author}): mergeable=${mergeable}, hasLabel=${hasLabel}`);

              if (mergeable === false) {
                if (hasReApprove) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: pull_number,
                      name: reApproveLabel,
                    });
                  } catch (e) {
                    if (e.status !== 404) throw e;
                  }
                }
                if (!hasLabel) {
                  console.log(`Notifying and labeling PR #${pull_number}`);
                  const body = [
                    `@${author} This PR has merge conflicts with \`main\`. Please rebase on \`main\` and push to resolve them:`,
                    '```bash',
                    `gh pr checkout ${pull_number}`,
                    'git fetch origin main',
                    'git rebase origin/main',
                    '# resolve conflicts',
                    'git push --force-with-lease',
                    '```',
                  ].join('\n');
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pull_number,
                    body,
                  });
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: pull_number,
                    labels: [labelName],
                  });
                }
              } else if (mergeable === true && hasLabel) {
                console.log(`Removing ${labelName} from PR #${pull_number}`);
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pull_number,
                    name: labelName,
                  });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }
            }
