# Labels open PRs with `needs-rebase` and notifies the author when changes on
# `main` introduce merge conflicts. Removes `needs-rebase` once resolved.

name: PR Needs Rebase

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  check-single-pr:
    name: Clear needs-rebase if resolved
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(github.event.pull_request.labels.*.name, 'needs-rebase')
    runs-on: ubuntu-latest
    steps:
      - name: Check mergeability and remove label if conflict-free
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            let mergeable = null;
            for (let attempt = 0; attempt < 4; attempt++) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              mergeable = pr.mergeable;
              if (mergeable !== null) break;
              await sleep(3000);
            }

            if (mergeable === true) {
              console.log(`PR #${pull_number} is now mergeable; removing needs-rebase label.`);
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pull_number,
                  name: 'needs-rebase',
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            } else {
              console.log(`PR #${pull_number} mergeable=${mergeable}; keeping needs-rebase label.`);
            }

  check-open-prs:
    name: Check open PRs for merge conflicts
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Scan open PRs targeting main
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = 'needs-rebase';
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: 'ff578a',
                  description: 'PR has merge conflicts and needs a rebase',
                });
              } else {
                throw e;
              }
            }

            // Give GitHub a brief window to invalidate mergeability after a push to main.
            await sleep(5000);

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            for (const item of prs) {
              if (item.draft) continue;
              const pull_number = item.number;
              const author = item.user.login;
              const hasLabel = item.labels.some((l) => l.name === labelName);

              let mergeable = null;
              for (let attempt = 0; attempt < 4; attempt++) {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
                mergeable = pr.mergeable;
                if (mergeable !== null) break;
                await sleep(3000);
              }

              console.log(`PR #${pull_number} (@${author}): mergeable=${mergeable}, hasLabel=${hasLabel}`);

              if (mergeable === false && !hasLabel) {
                console.log(`Labeling and notifying PR #${pull_number}`);
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pull_number,
                  labels: [labelName],
                });
                const body = [
                  `@${author} This PR has merge conflicts with \`main\`. Please rebase on \`main\` and push to resolve them:`,
                  '```bash',
                  `gh pr checkout ${pull_number}`,
                  'git fetch origin main',
                  'git rebase origin/main',
                  '# resolve conflicts',
                  'git push --force-with-lease',
                  '```',
                ].join('\n');
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body,
                });
              } else if (mergeable === true && hasLabel) {
                console.log(`Removing ${labelName} from PR #${pull_number}`);
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pull_number,
                    name: labelName,
                  });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }
            }
