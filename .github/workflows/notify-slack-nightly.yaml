---
name: Notify Slack - Nightly Digest

# Posts ONE message a day to #llm-d-ci-alerts summarising every nightly that
# failed, did not run, or passed with a broken badge push. Owners from the
# guide's OWNERS file are mentioned when their Slack user IDs are mapped.
#
# This replaces a per-run notifier (PR #2598) that posted one message per
# failing nightly. The nightlies are staggered across 01:00-18:30 UTC, so that
# produced a dozen-odd separate messages a day, none of which answered "how was
# last night?" without scrolling the channel.
#
# Nothing is accumulated between runs: the script asks the Actions API what each
# routed nightly did in the window. Having each nightly append to a shared store
# instead would need locking for the lanes that finish in the same minute, would
# lose an alert outright on a failed write, and would have to be pruned.
#
# Channel routing lives in .github/slack-channels.yaml -- that file is the
# source of truth, and is verified on every PR by the `sync-slack-channels`
# pre-commit hook. Unlike the per-run notifier this workflow replaces, there is
# no generated list of workflow display names here: routing is resolved at
# runtime from workflow FILE names, which are stable.

on:
  schedule:
    # 20:00 UTC. The nightly cycle starts at 01:00 and the last lane kicks off
    # at 18:30 with runs taking ~45-60m, so the cycle is done by ~19:30. Firing
    # in that quiet gap means each digest covers exactly one complete night and
    # never splits one across two messages.
    - cron: '0 20 * * *'

  # Replays the digest for an arbitrary window. Because `schedule` and
  # `workflow_dispatch` only work from the default branch, this is the only way
  # to exercise the real posting path once merged. Before merging, run
  # .github/scripts/slack-nightly-digest.py locally instead -- see
  # .github/workflows/README.md.
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'How far back to look, in hours (ignored when `since` is set)'
        required: false
        default: '24'
        type: string
      since:
        description: 'Window start, ISO 8601 (e.g. 2026-10-05T20:00:00Z). Overrides window_hours.'
        required: false
        default: ''
        type: string
      until:
        description: 'Window end, ISO 8601. Defaults to now.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'true = render the digest into the job summary without posting to Slack'
        required: false
        default: 'true'
        type: string
      channel_override:
        description: 'Post to this channel instead of the mapped one (e.g. #llm-d-ci-test)'
        required: false
        default: ''
        type: string

# Deliberately minimal: reading routing and owner mappings from the repo, and
# reading runs and their jobs from the API. Nothing here needs write access.
permissions:
  contents: read
  actions: read

concurrency:
  # A single group: there is one digest per day and dropping or duplicating it
  # are both worse than making a manual replay queue behind the scheduled run.
  group: notify-slack-nightly-digest
  cancel-in-progress: false

jobs:
  render:
    # Forks have no SLACK_BOT_TOKEN and must not try to post.
    if: github.repository == 'llm-d/llm-d'
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.render.outputs.channels }}
      payloads: ${{ steps.render.outputs.payloads }}
      has_digests: ${{ steps.render.outputs.has_digests }}
      fallback_channel: ${{ steps.render.outputs.fallback_channel }}
    steps:
      - name: Checkout mapping and script
        uses: actions/checkout@v7
        with:
          # Read the digest inputs, nightly workflow files and guide owners.
          sparse-checkout: |
            .github/slack-channels.yaml
            .github/slack-owner-ids.yaml
            .github/scripts/slack-nightly-digest.py
            .github/workflows/nightly-*.yaml
            guides/**/OWNERS
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check pyyaml

      - name: Render Slack digest
        id: render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOW_HOURS: ${{ inputs.window_hours || '24' }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          CHANNEL_OVERRIDE: ${{ inputs.channel_override }}
        run: |
          python .github/scripts/slack-nightly-digest.py \
            --repo "${GITHUB_REPOSITORY}" \
            --window-hours "${WINDOW_HOURS}" \
            ${SINCE:+--since "${SINCE}"} \
            ${UNTIL:+--until "${UNTIL}"} \
            ${CHANNEL_OVERRIDE:+--channel "${CHANNEL_OVERRIDE}"} \
            --github-output

  post:
    needs: render
    # `has_digests` is what keeps this job from expanding an empty matrix, which
    # is a hard error rather than a no-op. Comparing to 'true' means an unset or
    # unexpected value skips the job instead. A quiet night emits no digest at
    # all: posting a daily all-green message to an alert channel was considered
    # and declined, so silence here means there was nothing to report.
    if: >-
      needs.render.outputs.has_digests == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
    runs-on: ubuntu-latest
    strategy:
      # One entry per channel that has something to report. Only
      # #llm-d-ci-alerts is routed today, but slack-channels.yaml is structured
      # for more and this should not be what has to change when a SIG wants its
      # own channel. Keyed on channel names, not payloads, so the job shows up
      # as `post (#llm-d-ci-alerts)` rather than with the digest in its name.
      matrix:
        channel: ${{ fromJSON(needs.render.outputs.channels) }}
      fail-fast: false
    steps:
      - name: Post digest to Slack
        # Pinned by SHA: this is a third-party action in a job that holds
        # SLACK_BOT_TOKEN. Dependabot already tracks github-actions and will
        # propose bumps.
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          # Fail loudly when Slack rejects the call. The likely cause is the bot
          # not being a member of the target channel ('not_in_channel'), which is
          # broken configuration rather than operational noise.
          errors: true
          payload: ${{ toJSON(fromJSON(needs.render.outputs.payloads)[matrix.channel]) }}

  report-failure:
    needs: [render, post]
    # Without an all-green message, silence means "nothing to report" -- so a
    # broken digest must not also be silent, or a genuinely red night looks
    # exactly like a quiet one. Skipped jobs are not failures: always() is
    # required for this to run at all when an upstream job failed.
    if: >-
      always() && github.repository == 'llm-d/llm-d' &&
      (needs.render.result == 'failure' || needs.post.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Report the broken digest to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            {
              "channel": "${{ needs.render.outputs.fallback_channel || '#llm-d-ci-alerts' }}",
              "text": ":bangbang:  *The nightly CI digest failed to run.* Last night's results were not reported — check <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|run #${{ github.run_number }}>.",
              "mrkdwn": true,
              "unfurl_links": false,
              "unfurl_media": false
            }
