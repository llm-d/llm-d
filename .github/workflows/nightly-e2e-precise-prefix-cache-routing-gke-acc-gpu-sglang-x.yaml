name: Nightly - Precise Prefix Cache Routing SGLang E2E (GKE GPU)

# The benchmark reusable omits SGLang's dedicated render pool. Use the guide
# emitter to deploy it, then require a router cache prediction and reuse on the
# same cache-warm backend for /generate, chat completions and text completions.
# The strict probe runs from the deploy helper; generic API smoke tests follow.

on:
  schedule:
    - cron: '0 23 * * *'  # 23:00 UTC daily (staggered from sibling GKE nightlies)
  workflow_dispatch:
    inputs:
      skip_cleanup:
        description: 'Skip cleanup after tests (for debugging)'
        required: false
        default: 'false'
      pr_number:
        description: 'PR number for comment-back (set by /test-nightly)'
        required: false
        default: ''
      pr_repo:
        description: 'Repo for PR comment-back'
        required: false
        default: 'llm-d/llm-d'
      # This is a bespoke e2e, not a benchmark run, so the parameters below are
      # accepted and ignored — except cleanup (mapped to skip_cleanup) and
      # update_badge/dry_run (consumed by the badge job). They must stay
      # declared: slash-test-nightly.yaml sends its DEFAULT_PARAMS to every
      # nightly-e2e-* workflow whether or not the user passes any, and its 422
      # fallback only retries without pr_number/pr_repo — so an undeclared
      # parameter makes /test-nightly undispatchable for this lane. Keep this
      # set in sync with SUPPORTED_PARAMS in slash-test-nightly.yaml.
      decode_pods:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: false
        type: 'string'
        default: 'auto'
      prefill_pods:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: false
        type: 'string'
        default: 'auto'
      gateway_class:
        description: 'Ignored (guide is standalone/epponly)'
        required: false
        default: 'epponly'
      monitoring_enabled:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: true
        type: 'string'
        default: 'false'
      dry_run:
        description: 'Affects the badge only; this lane has no dry-run path'
        required: false
        default: 'false'
      verbose:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: false
        default: 'false'
        type: 'string'
      harness:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: false
        default: 'inference-perf'
        type: 'string'
      workload:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: false
        default: 'sanity_random.yaml'
        type: 'string'
      cleanup:
        description: 'Cleanup the llm-d stack stood up by this workflow'
        required: false
        default: 'true'
        type: string
      update_badge:
        description: 'Update the badge on gh-pages ("true", "false")'
        required: false
        default: 'true'
        type: string
      matrix_type:
        description: 'Will this workflow be part of a "nightly" (default) run or "release-X.Y.Z[rc]" run?'
        required: false
        default: 'nightly'
        type: 'string'
      harness_resources:
        description: 'CPU/Memory limits for the harness pod running llm-d-benchmark workloads (default 32/64Gi)'
        required: false
        default: '32/64Gi'
        type: 'string'

permissions:
  contents: write  # update-badge job commits the badge to the badges branch
  actions: read

concurrency:
  group: nightly-e2e-precise-prefix-cache-routing-sglang-gke-gpu
  cancel-in-progress: true

jobs:
  nightly:
    if: github.repository == 'llm-d/llm-d'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-nightly-e2e-gke.yaml@main
    with:
      guide_name: precise-prefix-cache-routing
      namespace: llm-d-nightly-precise-prefix-cache-routing-sglang-gke-gpu
      # The deploy helper runs the cache-affinity assertions before the reusable smoke loop.
      gateway_host: 'precise-prefix-cache-routing-epp'
      custom_deploy_script: |
        bash guides/precise-prefix-cache-routing/scripts/nightly-deploy-sglang-gke.sh
      gke_cluster_name: llm-d-e2e-us-east5
      gke_cluster_zone: us-east5
      # Two SGLang replicas at TP=2; the render pool uses CPU only.
      required_gpus: 4
      recommended_gpus: 4
      accelerator_type: H100
      pod_wait_timeout: '30m'
      # Deployment waits for both model replicas and the render pool, then verifies affinity.
      pod_readiness_delay: 60
      # The guide's pods use their normal priority; require four free GPUs.
      allow_gpu_preemption: false
      llm_d_ref: ${{ github.ref }}
      skip_cleanup: ${{ github.event.inputs.skip_cleanup == 'true' || github.event.inputs.cleanup == 'false' }}
      pr_number: ${{ github.event.inputs.pr_number }}
      pr_repo: ${{ github.event.inputs.pr_repo }}
      matrix_type: ${{ inputs.matrix_type || 'nightly' }}
    secrets: inherit

  update-badge:
    needs: [nightly]
    if: always() && github.repository == 'llm-d/llm-d' && inputs.update_badge != 'false'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-update-badge.yaml@main
    with:
      badge_name: precise-prefix-cache-routing-sglang-gke
      badge_label: "SGLang GPU"
      result: ${{ needs.nightly.result }}
      dry_run: ${{ inputs.dry_run || 'false' }}
      # The e2e reusable declares no outputs, so failure_category resolves empty
      # and the badge falls back to a plain pass/fail (no category granularity).
      # Same as the flow-control and workload-autoscaling lanes.
      failure_category: ${{ needs.nightly.outputs.failure_category }}
      matrix_type: ${{ inputs.matrix_type || 'nightly' }}
