name: Nightly - Workload Autoscaling KEDA+EPP E2E (OCP GPU)

# Nightly regression test for the in-flight-load KEDA + EPP autoscaling path
# (guides/workload-autoscaling/keda-epp/README.md, the default flow-control-OFF
# `inflight` signal) on OpenShift. Deploys the stock optimized-baseline modelserver
# + EPP router and scales the decode Deployment directly from the EPP in-flight-load
# metric via KEDA (keda-epp/optimized-baseline/overlays/ocp/inflight) -- there is no
# WVA controller and no EPP Flow Control on this path.
#
# OCP (GPU) sibling of
# nightly-e2e-workload-autoscaling-keda-epp-amd-acc-rocm-vllm-x.yaml (the AMD ROCm lane).

on:
  schedule:
    - cron: '30 3 * * *'  # 03:30 UTC daily
  workflow_dispatch:
    inputs:
      # decode_pods/prefill_pods/harness/workload/verbose are accepted only for
      # /test-nightly compatibility: that command classifies any nightly-e2e-*
      # not containing "-wva-" as a benchmark nightly and passes these.
      # This path runs no benchmark (metric-pipeline validation only), so they are
      # accepted-and-ignored; only cleanup/dry_run/update_badge take effect.
      decode_pods:
        description: 'Unused on this path (accepted for /test-nightly compatibility)'
        required: false
        type: 'string'
        default: 'auto'
      prefill_pods:
        description: 'Unused on this path (accepted for /test-nightly compatibility)'
        required: false
        type: 'string'
        default: 'auto'
      harness:
        description: 'Unused on this path (accepted for /test-nightly compatibility)'
        required: false
        type: 'string'
        default: 'inference-perf'
      workload:
        description: 'Unused on this path (accepted for /test-nightly compatibility)'
        required: false
        type: 'string'
        default: 'sanity_random.yaml'
      verbose:
        description: 'Unused on this path (accepted for /test-nightly compatibility)'
        required: false
        type: 'string'
        default: 'false'
      cleanup:
        description: 'Cleanup the llm-d stack stood up by this workflow'
        required: false
        default: 'true'
        type: string
      pr_number:
        description: 'PR number for comment-back (set by /test-nightly)'
        required: false
        default: ''
      pr_repo:
        description: 'Repo for PR comment-back'
        required: false
        default: 'llm-d/llm-d'
      dry_run:
        description: 'Execute workflow in "dry-run" mode ("true", "false")'
        required: false
        default: 'true'
      update_badge:
        description: 'Update the badge on gh-pages ("true", "false")'
        required: false
        default: 'true'
        type: string
      matrix_type:
        description: 'Will this workflow be part of a "nightly" (default) run or "release-X.Y.Z[rc]" run?'
        required: false
        default: 'nightly'
        type: 'string'
      harness_resources:
        description: 'CPU/Memory limits for the harness pod running llm-d-benchmark workloads (default 32/64Gi)'
        required: false
        default: '32/64Gi'
        type: 'string'

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: nightly-e2e-keda-epp-ocp
  cancel-in-progress: true

jobs:
  nightly:
    if: github.repository == 'llm-d/llm-d'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-nightly-e2e-openshift.yaml@main
    with:
      guide_name: workload-autoscaling
      namespace: llm-d-nightly-keda-epp-inflight
      # EPP Service name that e2e-validate.sh curls (http://<host>:80/v1/models).
      # It is `<ROUTER_RELEASE>-epp`; the deploy script installs the router as
      # `keda-epp-inflight` (a unique release name, to avoid colliding with the
      # optimized-baseline InferencePools on the shared cluster), so this MUST
      # stay in sync with ROUTER_RELEASE in nightly-deploy-ocp-keda-epp.sh.
      gateway_host: 'keda-epp-inflight-epp'
      # After the gateway smoke test, e2e-validate.sh hands off to
      # e2e-validate-scale-event.sh: fires a concurrent burst and asserts KEDA's
      # scale-up decision (desiredReplicas -> 2) then scale-down (-> 1). Asserts the
      # autoscaler DECISION, not the 2nd pod becoming Ready (it may stay Pending on a
      # contended cluster). Load drives llm_d_epp_inflight_requests over threshold
      # naturally, so no queue-specific assertion is needed.
      e2e_validate_args: '--extra-validate scale-event'
      custom_deploy_script: |
        bash guides/workload-autoscaling/scripts/nightly-deploy-ocp-keda-epp.sh
      required_gpus: 2
      recommended_gpus: 4
      pod_wait_timeout: '30m'
      pod_readiness_delay: 180
      image_override: 'docker.io/vllm/vllm-openai:nightly'
      allow_gpu_preemption: true
      skip_cleanup: ${{ inputs.cleanup == 'false' }}
      pr_number: ${{ github.event.inputs.pr_number }}
      pr_repo: ${{ github.event.inputs.pr_repo }}
      matrix_type: ${{ inputs.matrix_type || 'nightly' }}
    secrets: inherit

  update-badge:
    needs: [nightly]
    if: always() && github.repository == 'llm-d/llm-d' && inputs.update_badge != 'false'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-update-badge.yaml@main
    with:
      badge_name: keda-epp-queue-ocp
      badge_label: "VLLM GPU Autoscaling"
      result: ${{ needs.nightly.result }}
      dry_run: ${{ inputs.dry_run || 'false' }}
      failure_category: ${{ needs.nightly.outputs.failure_category }}
      matrix_type: ${{ inputs.matrix_type || 'nightly' }}
