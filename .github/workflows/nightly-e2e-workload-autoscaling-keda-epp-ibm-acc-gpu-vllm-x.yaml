name: Nightly - Workload Autoscaling KEDA+EPP Queue E2E (OCP GPU)

# Nightly regression test for the queue-based KEDA + EPP autoscaling path
# (guides/workload-autoscaling/keda-epp-queue/README.md) on OpenShift. Deploys the
# optimized-baseline modelserver + EPP router and scales the decode Deployment
# directly from EPP queue metrics via KEDA (keda-epp-queue/ocp) — there is NO
# WVA controller on this path.
#
# Runs ALONGSIDE nightly-e2e-workload-autoscaling-ibm-acc-gpu-vllm-x.yaml (the
# WVA path); the two test different autoscalers and must not replace each other.

on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC daily (staggered from the WVA path at 03:00)
  workflow_dispatch:
    inputs:
      # decode_pods/prefill_pods/harness/workload are accepted only for
      # /test-nightly compatibility: that command classifies any nightly-e2e-*
      # not containing "-wva-" as a benchmark nightly and always passes these.
      # This path runs no benchmark (metric-pipeline validation only), so they are
      # accepted-and-ignored; only cleanup/dry_run/update_badge take effect.
      decode_pods:
        description: 'Unused on this path (accepted for /test-nightly compatibility)'
        required: false
        type: 'string'
        default: 'auto'
      prefill_pods:
        description: 'Unused on this path (accepted for /test-nightly compatibility)'
        required: false
        type: 'string'
        default: 'auto'
      harness:
        description: 'Unused on this path (accepted for /test-nightly compatibility)'
        required: false
        type: 'string'
        default: 'inference-perf'
      workload:
        description: 'Unused on this path (accepted for /test-nightly compatibility)'
        required: false
        type: 'string'
        default: 'sanity_random.yaml'
      cleanup:
        description: 'Cleanup the llm-d stack stood up by this workflow'
        required: false
        default: 'true'
        type: string
      pr_number:
        description: 'PR number for comment-back (set by /test-nightly)'
        required: false
        default: ''
      pr_repo:
        description: 'Repo for PR comment-back'
        required: false
        default: 'llm-d/llm-d'
      dry_run:
        description: 'Execute workflow in "dry-run" mode ("true", "false")'
        required: false
        default: 'true'
      update_badge:
        description: 'Update the badge on gh-pages ("true", "false")'
        required: false
        default: 'true'
        type: string

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: nightly-e2e-keda-epp-queue-ocp
  cancel-in-progress: true

jobs:
  nightly:
    if: github.repository == 'llm-d/llm-d'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-nightly-e2e-openshift.yaml@main
    with:
      guide_name: workload-autoscaling
      namespace: llm-d-nightly-keda-epp-queue
      # EPP Service name that e2e-validate.sh curls (http://<host>:80/v1/models).
      # It is `<ROUTER_RELEASE>-epp`; the deploy script installs the router as
      # `keda-epp-queue` (a unique release name, to avoid colliding with the
      # optimized-baseline InferencePools on the shared cluster), so this MUST
      # stay in sync with ROUTER_RELEASE in nightly-deploy-ocp-keda-epp.sh.
      gateway_host: 'keda-epp-queue-epp'
      # After the gateway smoke test, e2e-validate.sh hands off to
      # e2e-validate-scale-event.sh: fires a concurrent burst and asserts KEDA's
      # scale-up decision (desiredReplicas -> 2) then scale-down (-> 1). Asserts the
      # autoscaler DECISION, not the 2nd pod becoming Ready (it may stay Pending on a
      # contended cluster). This is the Phase-2 scale-event proof on top of the
      # deploy script's Fallback=False signal-liveness gate.
      e2e_validate_args: '--extra-validate scale-event'
      custom_deploy_script: |
        bash guides/workload-autoscaling/scripts/nightly-deploy-ocp-keda-epp.sh
      required_gpus: 2
      recommended_gpus: 4
      pod_wait_timeout: '30m'
      pod_readiness_delay: 180
      image_override: 'docker.io/vllm/vllm-openai:nightly'
      allow_gpu_preemption: true
      skip_cleanup: ${{ inputs.cleanup == 'false' }}
      pr_number: ${{ github.event.inputs.pr_number }}
      pr_repo: ${{ github.event.inputs.pr_repo }}
    secrets: inherit

  update-badge:
    needs: [nightly]
    if: always() && inputs.update_badge != 'false'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-update-badge.yaml@main
    with:
      badge_name: keda-epp-queue-ocp
      badge_label: "VLLM GPU Queue"
      result: ${{ needs.nightly.result }}
      dry_run: ${{ inputs.dry_run || 'false' }}
      failure_category: ${{ needs.nightly.outputs.failure_category }}
