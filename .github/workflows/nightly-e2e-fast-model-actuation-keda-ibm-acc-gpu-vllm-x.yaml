name: Nightly - Fast Model Actuation + KEDA E2E (OCP GPU)

on:
  workflow_dispatch:
    inputs:
      decode_pods:
        description: 'Number of decode (vllm "standalone") pods (default "auto", means what was configured on the scenario)'
        required: false
        type: 'string'
        default: 'auto'
      prefill_pods:
        description: 'Number of prefill pods (default "auto", means what was configured on the scenario)'
        required: false
        type: 'string'
        default: 'auto'
      gateway_class:
        description: 'Class of gateway used ("istio", "agentgateway", "epponly" (i.e., "standalone"), "none")'
        required: false
        default: 'epponly'
      monitoring_enabled:
        description: 'Enabled monitoring ("true", "false"). Must be "true": KEDA reads the EPP pool-saturation metric from Prometheus.'
        required: true
        type: 'string'
        default: 'true'
      dry_run:
        description: 'Execute workflow in "dry-run" mode ("true", "false")'
        required: false
        default: 'false'
      verbose:
        description: 'Execute workflow in "verbose" mode ("true", "false")'
        required: false
        default: 'false'
        type: 'string'
      harness:
        description: 'Harness to be used during "run" operation ("inference-perf", "guidellm", "inferencemax", "vllm-benchmark", "nop")'
        required: false
        default: 'inference-perf'
        type: 'string'
      workload:
        description: 'Workload profile to be used during "run" operation (check list under "workload/profiles")'
        required: false
        default: 'shared_prefix_synthetic_heavy.yaml'
        type: 'string'
      wait_timeout:
        description: 'Timeout (s) to wait for benchmark pods to complete. 32B warm-under-load runs need more than the reusable default (1200s); matches the benchmark FMA warm arm.'
        required: false
        default: '5400'
        type: 'string'
      standup_timeout:
        description: 'Timeout (s) for standup. The first launcher warm-loads Qwen3-32B on bind, so raise above the reusable default (2400s).'
        required: false
        default: '3600'
        type: 'string'
      cleanup:
        description: 'Cleanup the llm-d stack stood up by this workflow'
        required: false
        default: 'true'
        type: string
      update_badge:
        description: 'Update the badge on gh-pages ("true", "false")'
        required: false
        default: 'true'
        type: string
#  push:
#    branches:
#      - main

  schedule:
    - cron: '37 13 * * *'  # 13:37 UTC daily (staggered ~1.5h after the FMA-only nightly at 12:00)

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly-e2e-fast-model-actuation-keda-ibm
  cancel-in-progress: true

jobs:
  nightly:
    uses: llm-d/llm-d-infra/.github/workflows/reusable-ci-nightly-benchmark.yaml@main
    with:
      scenario_dir: ${{ inputs.scenario_dir || 'guides' }}
      standup_method: ${{ inputs.standup_method || 'kustomize' }}
      standup_scenario: ${{ inputs.standup_scenario || 'fast-model-actuation-keda' }}
      decode_pods: ${{ inputs.decode_pods || 'auto' }}
      prefill_pods: ${{ inputs.prefill_pods || 'auto' }}
      accelerator_type: ${{ inputs.accelerator_type || 'gpu' }}
      backend_type: ${{ inputs.backend_type || 'vllm' }}
      infra_provider: ${{ inputs.infra_provider || 'base' }}
      connector: ${{ inputs.connector || '' }}
      cluster_namespace: ${{ inputs.cluster_namespace || 'llm-d-nightly-fast-model-actuation-keda-ibm-gpu' }}
      helm_release: ${{ inputs.helm_release || 'llmdbenchcicdr-ibm' }}
      workspace_dir: ${{ inputs.workspace_dir || '/tmp/llmdbenchcicdk-ibm' }}
      bucket_project: ${{ inputs.bucket_project || 'llm-d-scale' }}
      bucket_provider: ${{ inputs.bucket_provider || 'gcs' }}
      bucket_path: ${{ inputs.bucket_path || 'llm-d-benchmarks/regressions/fast-model-actuation-keda' }}
      gateway_class: ${{ inputs.gateway_class || 'epponly' }}
      monitoring_enabled: ${{ inputs.monitoring_enabled || 'true' }}
      dry_run: ${{ inputs.dry_run || 'false' }}
      verbose: ${{ inputs.verbose || 'false' }}
      harness: ${{ inputs.harness || 'inference-perf' }}
      workload: ${{ inputs.workload || 'shared_prefix_synthetic_heavy.yaml' }}
      wait_timeout: ${{ inputs.wait_timeout || '5400' }}
      standup_timeout: ${{ inputs.standup_timeout || '3600' }}
      cleanup: ${{ inputs.cleanup || 'true' }}
    secrets: inherit

  update-badge:
    needs: [nightly]
    if: always() && inputs.update_badge != 'false'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-update-badge.yaml@main
    with:
      badge_name: fast-model-actuation-keda-ocp
      badge_label: "VLLM GPU"
      result: ${{ needs.nightly.result }}
      dry_run: ${{ inputs.dry_run || 'false' }}
      failure_category: ${{ needs.nightly.outputs.failure_category }}
