name: Build LLM-D Image (Advanced)

on:
  workflow_dispatch:
    inputs:
      use_buildah:
        description: 'Use Buildah instead of Docker'
        required: false
        default: false
        type: boolean
      dockerfile:
        description: 'Dockerfile to use'
        required: false
        default: 'Dockerfile.ubi'
        type: string
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: llm-d

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load version from .version.json
        id: version
        run: |
          DEV_VERSION=$(jq -r '."dev-version"' .version.json)
          DEV_REGISTRY=$(jq -r '."dev-registry"' .version.json)
          echo "dev_version=$DEV_VERSION" >> $GITHUB_OUTPUT
          echo "dev_registry=$DEV_REGISTRY" >> $GITHUB_OUTPUT
          echo "Loaded version: $DEV_VERSION"
          echo "Loaded registry: $DEV_REGISTRY"

      - name: Set up Buildah (if requested)
        if: ${{ github.event.inputs.use_buildah == 'true' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          # Install Buildah
          sudo apt-get update
          sudo apt-get install -y buildah
          echo "Buildah version:"
          buildah --version

      - name: Set up Docker Buildx (if not using Buildah)
        if: ${{ github.event.inputs.use_buildah != 'true' && github.event_name == 'workflow_dispatch' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Buildah (if selected)
        if: ${{ github.event.inputs.use_buildah == 'true' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          DOCKERFILE="${{ github.event.inputs.dockerfile || 'Dockerfile.ubi' }}"
          IMG="${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.dev_version }}"
          
          echo "Building with Buildah using $DOCKERFILE"
          echo "Image: $IMG"
          
          # Build for amd64 architecture
          buildah build --file $DOCKERFILE --arch=amd64 --os=linux --layers -t $IMG-amd64 .
          
          # Push the architecture-specific image
          buildah push $IMG-amd64 docker://$IMG-amd64
          
          # Create and push manifest list
          buildah manifest rm $IMG || true
          buildah manifest create $IMG
          buildah manifest add $IMG $IMG-amd64
          buildah manifest push --all $IMG docker://$IMG
          
          echo "Build completed successfully"

      - name: Build with Docker (if selected)
        if: ${{ github.event.inputs.use_buildah != 'true' && github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ github.event.inputs.dockerfile || 'Dockerfile.ubi' }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.dev_version }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.dev_version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Display build summary
        run: |
          echo "=== Build Summary ==="
          echo "Image: ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.dev_version }}"
          echo "Version: ${{ steps.version.outputs.dev_version }}"
          echo "Registry: ${{ steps.version.outputs.dev_registry }}"
          echo "Build completed successfully!"

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi
