name: Update Release Testing Matrix

# Captures a frozen snapshot of the guide testing badges whenever a version tag
# is pushed (including pre-releases like v0.9.0-rc1) and opens a PR against main
# updating the "Release Testing" matrix in release/README.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and release branch
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # v0.8.1 -> release-0.8 ; v0.9.0-rc1 -> release-0.9 (informational)
          BASE="${TAG#v}"
          MAJOR_MINOR="$(echo "$BASE" | cut -d. -f1-2)"
          echo "branch=release-${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          # The release matrix lives on main; the PR targets main.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot current badge status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          wf_dir = Path(".github/workflows")
          statuses = {}
          for path in sorted(wf_dir.glob("nightly-e2e-*.yaml")):
              match = re.search(r"badge_name:\s*(\S+)", path.read_text(encoding="utf-8"))
              if not match:
                  continue
              name = match.group(1)
              url = f"https://llm-d.github.io/llm-d/badges/{name}.json"
              try:
                  with urllib.request.urlopen(url, timeout=20) as resp:
                      data = json.load(resp)
                  statuses[name] = {
                      "message": data.get("message", "unknown"),
                      "color": data.get("color", "lightgrey"),
                  }
              except Exception as exc:  # noqa: BLE001 - best-effort snapshot
                  print(f"warn: could not read badge '{name}': {exc}")

          Path("release-status.json").write_text(json.dumps(statuses, indent=2), encoding="utf-8")
          print(f"Captured {len(statuses)} badge status(es)")
          PY

      - name: Regenerate release matrix
        run: |
          python scripts/sync-release-matrix.py --fix \
            --version "${{ steps.tag.outputs.tag }}" \
            --status-file release-status.json

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release-matrix/${{ steps.tag.outputs.tag }}
          base: main
          add-paths: release/README.md
          delete-branch: true
          commit-message: "docs(release): update release testing matrix for ${{ steps.tag.outputs.tag }}"
          title: "docs(release): snapshot release testing matrix for ${{ steps.tag.outputs.tag }}"
          body: |
            Automated snapshot of the guide testing badges captured when tag
            `${{ steps.tag.outputs.tag }}` was pushed.

            - Release branch: `${{ steps.tag.outputs.branch }}`
            - Updates the **Release Testing** matrix in `release/README.md`.

            Generated by `.github/workflows/release-matrix.yaml`.
