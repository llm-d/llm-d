name: Update Release Testing Matrix

# Renders one release's section of the "Release Testing" matrix in
# release/README.md and opens a PR against main.
#
# Each cell is a live shields endpoint pointing at
# badges/<badge_name>_<release branch>.json, which the e2e lanes write when
# dispatched by release-e2e.yaml. Run this *after* those lanes have produced
# badges: rendering earlier points the cells at files that do not exist yet.
#
# Because the badges are live, re-running a single lane updates the matrix on its
# own — re-render only when the tag changes (e.g. an RC becoming the final tag).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag the section is captioned with, e.g. "v0.9.0" or "v0.9.0-rc.1"'
        required: true
        type: string
      release_branch:
        description: 'Release branch / series (default: derived from the version, e.g. release-0.9)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-matrix:
    if: github.repository == 'llm-d/llm-d'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          # The release matrix lives on main; the PR targets main.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Render the release matrix section
        id: render
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -euo pipefail

          args=(--fix --version "$VERSION")
          if [[ -n "$RELEASE_BRANCH" ]]; then
            args+=(--branch "$RELEASE_BRANCH")
          fi
          python scripts/sync-release-matrix.py "${args[@]}"

          # Derived here too, for the PR branch name and body.
          series="${RELEASE_BRANCH:-release-$(echo "${VERSION#v}" | cut -d. -f1-2)}"
          echo "series=$series" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release-matrix/${{ inputs.version }}
          base: main
          add-paths: release/README.md
          delete-branch: true
          commit-message: "docs(release): update release testing matrix for ${{ inputs.version }}"
          title: "docs(release): release testing matrix for ${{ inputs.version }}"
          body: |
            Renders the `${{ steps.render.outputs.series }}` section of the
            **Release Testing** matrix in `release/README.md`, captioned
            `${{ inputs.version }}`.

            The cells are live badges reading
            `badges/<badge_name>_${{ steps.render.outputs.series }}.json`, written by
            the e2e lanes dispatched from `release-e2e.yaml` against
            `${{ steps.render.outputs.series }}`. Re-running a lane updates the matrix
            without re-rendering; a cell showing an error badge means that lane has
            not published a badge for this release yet.

            > [!IMPORTANT]
            > This commit was written by CI, so it carries no DCO sign-off and no
            > signature. A human has to take ownership of it before it can merge:
            >
            > ```bash
            > gh pr checkout release-matrix/${{ inputs.version }}
            > git commit --amend --reset-author -s -S --no-edit
            > git push --force-with-lease
            > ```
            >
            > `--reset-author` makes you the author, `-s` adds the `Signed-off-by`
            > trailer the DCO check requires, and `-S` signs the commit so GitHub
            > marks it verified. Nothing else about the section changes.

            Generated by `.github/workflows/release-matrix.yaml`.
