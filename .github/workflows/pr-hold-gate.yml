# Fails a required check while a hold label is present, so /hold
# (Prow's `do-not-merge/hold`, applied via the existing Prow Commands
# integration in prow-github.yaml) and the legacy `hold` label block
# merging. Re-runs on label changes.
#
# /hold and /hold cancel already work on this repo through
# prow-github.yaml -> llm-d-infra's reusable-prow-commands.yaml; this adds
# the merge-blocking side that llm-d-router's pr-hold-gate.yml provides.

name: Hold gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - name: Block merge while held
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          blocking_labels=(hold do-not-merge/hold)

          # fetch current labels
          labels=$(gh pr view "$PR_URL" --json labels -q '.labels[].name')
          for label in "${blocking_labels[@]}"; do
            if grep -qxF "$label" <<< "$labels"; then
              echo "::error::Blocking label '$label' is present. Remove it to allow merge (e.g., /hold cancel for hold)."
              exit 1
            fi
          done
