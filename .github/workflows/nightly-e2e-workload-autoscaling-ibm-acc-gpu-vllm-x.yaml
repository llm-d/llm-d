name: Nightly - Workload Autoscaling E2E (OCP GPU)

# Nightly regression test for WVA (Workload Variant Autoscaler) on OpenShift.
# Deploys the workload-autoscaling guide stack via the consolidated kustomize
# reusable workflow and runs the WVA e2e test suite from the WVA repo.
#
# WVA is deprecated and gets no further releases, so this lane no longer builds
# from main: it tests the pinned release-0.9 controller image (v0.9.0) that the
# guide overlays deploy. Scheduled runs are disabled; dispatch manually if
# needed, optionally overriding image_tag.

on:
  # Scheduled execution disabled: WVA is deprecated.
  # schedule:
  #   - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'WVA image tag override (leave empty to use the pinned release image, v0.9.0)'
        required: false
        default: ''
      caller_ref:
        description: 'WVA repo ref to checkout for tests (branch, tag, or SHA)'
        required: false
        default: 'release-0.9'
      skip_cleanup:
        description: 'Skip cleanup after tests (for debugging)'
        required: false
        default: 'false'
      pr_number:
        description: 'PR number for comment-back (set by /test-nightly)'
        required: false
        default: ''
      pr_repo:
        description: 'Repo for PR comment-back'
        required: false
        default: 'llm-d/llm-d'
      decode_pods:
        description: 'Number of decode (vllm "standalone") pods (default "auto", means what was configured on the scenario)'
        required: false
        type: 'string'
        default: 'auto'
      prefill_pods:
        description: 'Number of prefill pods (default "auto", means what was configured on the scenario)'
        required: false
        type: 'string'
        default: 'auto'
      gateway_class:
        description: 'Class of gateway used ("istio", "agentgateway", "epponly" (i.e., "standalone"), "none")'
        required: false
        default: 'epponly'
      monitoring_enabled:
        description: 'Enabled monitoring ("true", "false")'
        required: true
        type: 'string'
        default: 'false'
      dry_run:
        description: 'Execute workflow in "dry-run" mode ("true", "false")'
        required: false
        default: 'true'
      verbose:
        description: 'Execute workflow in "verbose" mode ("true", "false")'
        required: false
        default: 'false'
        type: 'string'
      harness:
        description: 'Harness to be used during "run" operation ("inference-perf", "guidellm", "inferencemax", "vllm-benchmark", "nop")'
        required: false
        default: 'inference-perf'
        type: 'string'
      workload:
        description: 'Workload profile to be used during "run" operation (check list under "workload/profiles")'
        required: false
        default: 'sanity_random.yaml'
#        default: 'guide_wide-ep_1.yaml'
        type: 'string'
      cleanup:
        description: 'Cleanup the llm-d stack stood up by this workflow'
        required: false
        default: 'true'
        type: string
      update_badge:
        description: 'Update the badge on gh-pages ("true", "false")'
        required: false
        default: 'true'
        type: string
      matrix_type:
        description: 'Will this workflow be part of a "nightly" (default) run or "release-X.Y.Z[rc]" run?'
        required: false
        default: 'nightly'
        type: 'string'
      harness_resources:
        description: 'CPU/Memory limits for the harness pod running llm-d-benchmark workloads (default 32/64Gi)'
        required: false
        default: '32/64Gi'
        type: 'string'

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: nightly-e2e-wva-ocp
  cancel-in-progress: true

jobs:
  nightly:
    if: github.repository == 'llm-d/llm-d'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-nightly-e2e-openshift.yaml@main
    with:
      guide_name: workload-autoscaling
      namespace: llm-d-nightly-wva
      # Service name is truncated to 63 chars: ...-inferencepoo-epp (not ...-inferencepool-epp)
      gateway_host: 'workload-variant-autoscaler-inferencepoo-epp'
      custom_deploy_script: |
        # Empty unless a dispatch overrides it, so the overlays' pinned
        # v0.9.0 controller image is what gets deployed.
        export WVA_TAG="${{ github.event.inputs.image_tag }}"
        bash guides/workload-autoscaling/scripts/nightly-deploy-ocp.sh
      required_gpus: 2
      recommended_gpus: 4
      pod_wait_timeout: '30m'
      pod_readiness_delay: 180
      image_override: 'ghcr.io/llm-d/llm-d-cuda-dev:latest'
      allow_gpu_preemption: true
      skip_cleanup: ${{ github.event.inputs.skip_cleanup == 'true' }}
      pr_number: ${{ github.event.inputs.pr_number }}
      pr_repo: ${{ github.event.inputs.pr_repo }}
      matrix_type: ${{ inputs.matrix_type || 'nightly' }}
    secrets: inherit

  update-badge:
    needs: [nightly]
    if: always() && inputs.update_badge != 'false'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-update-badge.yaml@main
    with:
      badge_name: wva-ocp
      badge_label: "VLLM GPU"
      result: ${{ needs.nightly.result }}
      dry_run: ${{ inputs.dry_run || 'false' }}
      failure_category: ${{ needs.nightly.outputs.failure_category }}
      matrix_type: ${{ inputs.matrix_type || 'nightly' }}
