name: Build LLM-D Image

on:
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: 'Python version in the llm-d image'
        required: false
        default: '3.12'
        type: choice
        options:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
      VLLM_COMMIT_SHA:
        description: 'The VLLM commit SHA used for the LLM-D image build'
        required: false
        type: string
      NIXL_COMMIT_SHA:
        description: 'The NIXL commit SHA used for the LLM-D image build'
        required: false
        type: string
      NVSHMEM_VERSION:
        description: 'The NVShMem version used for the LLM-D image build'
        required: false
        type: string
      UCX_VERSION:
        description: 'The UCX version used for the LLM-D image build'
        required: false
        type: string
      LMCACHE_COMMIT_SHA:
        description: 'The LMCache commit SHA used for the LLM-D image build'
        required: false
        type: string
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: llm-d

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:

      - run: df -h || true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - run: df -h || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load version from .version.json
        id: version
        run: |
          DEV_VERSION=$(jq -r '."dev-version"' .version.json)
          DEV_REGISTRY=$(jq -r '."dev-registry"' .version.json)
          echo "dev_version=$DEV_VERSION" >> $GITHUB_OUTPUT
          echo "dev_registry=$DEV_REGISTRY" >> $GITHUB_OUTPUT
          echo "Loaded version: $DEV_VERSION"
          echo "Loaded registry: $DEV_REGISTRY"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-dev # For anything short of release always update dev
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ubi
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.dev_version }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.dev_version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi
