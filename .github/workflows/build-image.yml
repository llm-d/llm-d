name: Build LLM-D Image

on:
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: 'Python version in the llm-d image'
        required: false
        default: '3.12'
        type: choice
        options:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
      VLLM_COMMIT_SHA:
        description: 'The VLLM commit SHA used for the LLM-D image build'
        required: false
        type: string
      NIXL_COMMIT_SHA:
        description: 'The NIXL commit SHA used for the LLM-D image build'
        required: false
        type: string
      NVSHMEM_VERSION:
        description: 'The NVShMem version used for the LLM-D image build'
        required: false
        type: string
      UCX_VERSION:
        description: 'The UCX version used for the LLM-D image build'
        required: false
        type: string
      LMCACHE_COMMIT_SHA:
        description: 'The LMCache commit SHA used for the LLM-D image build'
        required: false
        type: string
      REF:
        description: 'If running as a workflow dispatch, what ref to use to bulid the image. Usually Dev or main.'
        required: false
        type: string
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: llm-d
  TF_VAR_aws_region: "us-west-2"
  TF_VAR_aws_ami_name: '["*ubuntu-noble-24.04*"]'
  TF_VAR_aws_ami_owners: '["099720109477"]'
  TF_VAR_aws_volume_size: 100
  TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_aws_instance_type:  "c7i.4xlarge"

jobs:
  build-and-scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ARCH: amd64
            AWS_AMI_ARCHITECTURE: x86_64
          # - ARCH: arm64
          #   AWS_AMI_ARCHITECTURE: arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
        with:
          path: main

      - name: Resolve llm-d ref
        id: ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Defaults
          OWNER_REPO="llm-d/llm-d"
          REF_OUT="dev"

          case "${{ github.event_name }}" in
            pull_request|pull_request_target|merge_group)
              # Use the PR head sha (most precise)
              REF_OUT="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              REF_OUT="${{ github.sha }}"
              ;;
            workflow_dispatch)
              IN="${{ github.event.inputs.REF }}"
              if [[ -z "${IN}" ]]; then
                REF_OUT="dev"
              elif [[ "${IN}" =~ ^(pr/)?([0-9]+)$ ]]; then
                N="${BASH_REMATCH[2]}"
                # Resolve PR -> head.sha
                REF_OUT="$(gh api repos/${OWNER_REPO}/pulls/${N} --jq '.head.sha')"
                if [[ -z "${REF_OUT}" || "${REF_OUT}" == "null" ]]; then
                  echo "Failed to resolve PR #${N} to a head SHA" >&2
                  exit 1
                fi
              else
                # Allow branch/tag/sha literals
                REF_OUT="${IN}"
              fi
              ;;
            *)
              REF_OUT="main"
              ;;
          esac

          echo "ref=${REF_OUT}" >> "$GITHUB_OUTPUT"
          echo "event_type=${{ github.event_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout terraform module
        id: checkout-module
        uses: actions/checkout@v4.1.7
        with:
          repository: containers/terraform-test-environment-module
          path: terraform-test-environment-module
          ref: 'main'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init
        working-directory: terraform-test-environment-module

      - name: Bootstrap
        id: up
        run: terraform apply -auto-approve -lock=false
        working-directory: terraform-test-environment-module
        env:
          TF_VAR_aws_instance_type: ${{ env.TF_VAR_aws_instance_type }}
          TF_VAR_aws_ami_architecture: ${{ matrix.AWS_AMI_ARCHITECTURE }}

      - name: Terraform Output
        id: terraform-output
        run: |
          echo "id=$(terraform output id | xargs)" >> $GITHUB_OUTPUT
          echo "url=$(terraform output host | xargs)" >> $GITHUB_OUTPUT
          echo "ssh_public_key=$(terraform output ssh_public_key | xargs)" >> $GITHUB_OUTPUT
          echo "pem_filename=$(terraform output pem_filename | xargs)" >> $GITHUB_OUTPUT
        working-directory: terraform-test-environment-module

      - name: Build JSON --extra-vars
        id: exjson
        shell: bash
        run: |
          extra_args=""

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            add_if_set () {
              local key="$1" val="$2"
              if [[ -n "$val" ]]; then
                # Append with backslash + newline for pretty printing
                extra_args+="-e $key=$val \\\n"
              fi
            }

            add_if_set "PYTHON_VERSION"   "${{ github.event.inputs.PYTHON_VERSION }}"
            add_if_set "VLLM_COMMIT_SHA"  "${{ github.event.inputs.VLLM_COMMIT_SHA }}"
            add_if_set "NIXL_COMMIT_SHA"  "${{ github.event.inputs.NIXL_COMMIT_SHA }}"
            add_if_set "NVSHMEM_VERSION"  "${{ github.event.inputs.NVSHMEM_VERSION }}"
            add_if_set "UCX_VERSION"      "${{ github.event.inputs.UCX_VERSION }}"
            add_if_set "LMCACHE_COMMIT_SHA" "${{ github.event.inputs.LMCACHE_COMMIT_SHA }}"
          fi

          # Trim trailing newline/backslash
          extra_args=$(echo -e "$extra_args" | sed '/^$/d')

          # Save with escapes so Actions treats it as one string
          echo "extra=$(echo -e "$extra_args")" >> "$GITHUB_OUTPUT"

      - name: Provision
        id: provision
        timeout-minutes: 180
        run: |
          ansible-playbook ./main/.github/workflows/playbooks/build-llm-d.yaml \
            -i terraform-test-environment-module/hosts.ini \
            --private-key=terraform-test-environment-module/${{ steps.terraform-output.outputs.pem_filename }} \
            ${{ steps.exjson.outputs.extra }} \
            -e LLM_D_REF=${{ steps.ref.outputs.ref }}

        env:
          ANSIBLE_CONFIG: ./main/.github/workflows/playbooks/ansible.cfg

      - name: Destroy Test Environment
        id: down
        if: always()
        run: terraform destroy -auto-approve -lock=false
        working-directory: terraform-test-environment-module
        env:
          TF_VAR_aws_instance_type: ${{ env.AWS_IMAGE_TYPE }}
          TF_VAR_aws_ami_architecture: ${{ matrix.AWS_AMI_ARCHITECTURE }}
