name: Nightly - Fast Model Actuation + KEDA E2E (GKE GPU)

# Nightly regression test for the Fast Model Actuation + KEDA guide
# (guides/fast-model-actuation/fast-model-actuation-keda) on the shared GKE e2e
# cluster, H100 GPUs.
#
# Same README-driven benchmark standup as the OCP lane, with
# infra_provider=gke: platform/gke for the privileged launcher (see the FMA GKE
# lane), router/monitoring-gke.values.yaml so Google Managed Prometheus scrapes
# the EPP, and keda/gke, whose ScaledObject queries the GMP standalone frontend.
#
# Cluster prerequisites (one-time, cluster admin; see the guide's GKE note):
# KEDA, and the GMP frontend in llm-d-monitoring with Workload Identity granting
# it roles/monitoring.viewer.
#
# The cluster is shared and the node selector is deliberately not narrowed:
# while the lane runs there is one launcher pod (CPU/memory requests only, no
# GPU) on every GPU node, as on the OCP lane (nvidia.com/gpu.present). Only
# launchers bound to a requester start vLLM, and the guide's cleanup removes
# them all.

on:
  workflow_dispatch:
    inputs:
      decode_pods:
        description: 'Number of decode (vllm "standalone") pods (default "auto", means what was configured on the scenario)'
        required: false
        type: 'string'
        default: 'auto'
      prefill_pods:
        description: 'Number of prefill pods (default "auto", means what was configured on the scenario)'
        required: false
        type: 'string'
        default: 'auto'
      gateway_class:
        description: 'Class of gateway used ("istio", "agentgateway", "epponly" (i.e., "standalone"), "none")'
        required: false
        default: 'epponly'
      monitoring_enabled:
        description: 'Enabled monitoring ("true", "false"). Must be "true": KEDA reads the EPP flow-control queue-size metric from Prometheus.'
        required: true
        type: 'string'
        default: 'true'
      dry_run:
        description: 'Execute workflow in "dry-run" mode ("true", "false")'
        required: false
        default: 'false'
      verbose:
        description: 'Execute workflow in "verbose" mode ("true", "false")'
        required: false
        default: 'false'
        type: 'string'
      harness:
        description: 'Harness to be used during "run" operation ("inference-perf", "guidellm", "inferencemax", "vllm-benchmark", "nop")'
        required: false
        default: 'inference-perf'
        type: 'string'
      workload:
        description: 'Workload profile to be used during "run" operation (check list under "workload/profiles")'
        required: false
        default: 'shared_prefix_synthetic_heavy.yaml'
        type: 'string'
      wait_timeout:
        description: 'Timeout (s) to wait for benchmark pods to complete.'
        required: false
        default: '1800'
        type: 'string'
      standup_timeout:
        description: 'Timeout (s) for standup.'
        required: false
        default: '1800'
        type: 'string'
      cleanup:
        description: 'Cleanup the llm-d stack stood up by this workflow'
        required: false
        default: 'true'
        type: string
      update_badge:
        description: 'Update the badge on gh-pages ("true", "false")'
        required: false
        default: 'true'
        type: string
      matrix_type:
        description: 'Will this workflow be part of a "nightly" (default) run or "release-X.Y.Z[rc]" run?'
        required: false
        default: 'nightly'
        type: 'string'

  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC daily (staggered after the FMA-only GKE lane at 08:00; both share the FMA CRDs and the H100 pool)

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly-e2e-fast-model-actuation-keda-gke-gpu
  cancel-in-progress: true

jobs:
  nightly:
    if: github.repository == 'llm-d/llm-d'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-ci-nightly-benchmark.yaml@main
    with:
      scenario_dir: ${{ inputs.scenario_dir || 'guides' }}
      standup_method: ${{ inputs.standup_method || 'kustomize' }}
      standup_scenario: ${{ inputs.standup_scenario || 'fast-model-actuation/fast-model-actuation-keda' }}
      decode_pods: ${{ inputs.decode_pods || 'auto' }}
      prefill_pods: ${{ inputs.prefill_pods || 'auto' }}
      accelerator_type: ${{ inputs.accelerator_type || 'gpu' }}
      backend_type: ${{ inputs.backend_type || 'vllm' }}
      infra_provider: ${{ inputs.infra_provider || 'gke' }}
      connector: ${{ inputs.connector || '' }}
      cluster_namespace: ${{ inputs.cluster_namespace || 'llm-d-nightly-fast-model-actuation-keda-gke-gpu' }}
      helm_release: ${{ inputs.helm_release || 'llmdbenchcicdr-gke' }}
      workspace_dir: ${{ inputs.workspace_dir || '/tmp/llmdbenchcicdk-gke' }}
      bucket_project: ${{ inputs.bucket_project || 'llm-d-scale' }}
      bucket_provider: ${{ inputs.bucket_provider || 'gcs' }}
      bucket_path: ${{ inputs.bucket_path || 'llm-d-benchmarks/regressions/fast-model-actuation-keda' }}
      gateway_class: ${{ inputs.gateway_class || 'epponly' }}
      monitoring_enabled: ${{ inputs.monitoring_enabled || 'true' }}
      dry_run: ${{ inputs.dry_run || 'false' }}
      verbose: ${{ inputs.verbose || 'false' }}
      harness: ${{ inputs.harness || 'inference-perf' }}
      workload: ${{ inputs.workload || 'shared_prefix_synthetic_heavy.yaml' }}
      wait_timeout: ${{ inputs.wait_timeout || '1800' }}
      standup_timeout: ${{ inputs.standup_timeout || '1800' }}
      cleanup: ${{ inputs.cleanup || 'true' }}
      matrix_type: ${{ inputs.matrix_type || 'nightly' }}
    secrets: inherit

  update-badge:
    needs: [nightly]
    if: always() && github.repository == 'llm-d/llm-d' && inputs.update_badge != 'false'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-update-badge.yaml@main
    with:
      badge_name: fast-model-actuation-keda-gke
      badge_label: "VLLM GPU"
      result: ${{ needs.nightly.result }}
      dry_run: ${{ inputs.dry_run || 'false' }}
      failure_category: ${{ needs.nightly.outputs.failure_category }}
      matrix_type: ${{ inputs.matrix_type || 'nightly' }}
