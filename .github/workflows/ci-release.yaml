name: Release LLM-D Images

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: llm-d
  TAG: ${{ github.event.release.tag_name != '' && github.event.release.tag_name || github.ref_name }}
  IS_STABLE: ${{ !contains(github.event.release.tag_name != '' && github.event.release.tag_name || github.ref_name, 'rc') }}

jobs:
  release-aws-llm-d:
    runs-on: vllm-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Load version configuration from file
        id: common-version
        run: |
          source docker/common-versions
          echo "repo=${VLLM_REPO}" >> $GITHUB_OUTPUT
          echo "commit_sha=${VLLM_COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "precompiled_wheel_commit=${VLLM_PRECOMPILED_WHEEL_COMMIT}" >> $GITHUB_OUTPUT
          echo "prebuilt=${VLLM_PREBUILT}" >> $GITHUB_OUTPUT
          echo "use_precompiled=${VLLM_USE_PRECOMPILED}" >> $GITHUB_OUTPUT
          echo "cuda_major=${CUDA_MAJOR}" >> $GITHUB_OUTPUT
          echo "cuda_minor=${CUDA_MINOR}" >> $GITHUB_OUTPUT
          echo "cuda_patch=${CUDA_PATCH}" >> $GITHUB_OUTPUT
          echo "offloading_connector_version=${LLM_D_OFFLOADING_CONNECTOR_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build the builder image layer
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.cuda
          platforms: linux/amd64
          target: builder
          push: false
          build-args: |
            TARGETOS=rhel
            TARGETPLATFORM=linux/amd64
            BUILD_BASE_IMAGE_SUFFIX=ubi9
            FINAL_BASE_IMAGE_SUFFIX=ubi9
            CUDA_MAJOR=${{ steps.common-version.outputs.cuda_major }}
            CUDA_MINOR=${{ steps.common-version.outputs.cuda_minor }}
            CUDA_PATCH=${{ steps.common-version.outputs.cuda_patch }}
            CACHE_BUSTER=${{ github.ref_name }}-${{ github.run_id }}
            ENABLE_EFA=true
          github-token: ${{ secrets.GHCR_TOKEN }}
          secrets: |
            aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID_S3_BUCKET_ONLY }}
            aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY_S3_BUCKET_ONLY }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Build and push the final image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.cuda
          platforms: linux/amd64
          target: runtime
          push: true
          provenance: true
          build-args: |
            TARGETOS=rhel
            TARGETPLATFORM=linux/amd64
            BUILD_BASE_IMAGE_SUFFIX=ubi9
            FINAL_BASE_IMAGE_SUFFIX=ubi9
            CUDA_MAJOR=${{ steps.common-version.outputs.cuda_major }}
            CUDA_MINOR=${{ steps.common-version.outputs.cuda_minor }}
            CUDA_PATCH=${{ steps.common-version.outputs.cuda_patch }}
            CACHE_BUSTER=${{ github.ref_name }}-${{ github.run_id }}
            ENABLE_EFA=true
            VLLM_REPO=${{ steps.common-version.outputs.repo }}
            VLLM_COMMIT_SHA=${{ steps.common-version.outputs.commit_sha }}
            VLLM_PRECOMPILED_WHEEL_COMMIT=${{ steps.common-version.outputs.precompiled_wheel_commit }}
            VLLM_PREBUILT=${{ steps.common-version.outputs.prebuilt }}
            VLLM_USE_PRECOMPILED=${{ steps.common-version.outputs.use_precompiled }}
            LLM_D_OFFLOADING_CONNECTOR_VERSION=${{ steps.common-version.outputs.offloading_connector_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-aws:${{ env.TAG }}
            ${{ env.IS_STABLE == 'true' && format('{0}/{1}-aws:latest', env.REGISTRY, github.repository) || '' }}
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-aws:${{ env.TAG }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: vuln
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

  release-gb200-llm-d:
    runs-on: vllm-runner-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Load version configuration from file
        id: common-version
        run: |
          source docker/common-versions
          echo "repo=${VLLM_REPO}" >> $GITHUB_OUTPUT
          echo "commit_sha=${VLLM_COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "precompiled_wheel_commit=${VLLM_PRECOMPILED_WHEEL_COMMIT}" >> $GITHUB_OUTPUT
          echo "prebuilt=${VLLM_PREBUILT}" >> $GITHUB_OUTPUT
          echo "use_precompiled=${VLLM_USE_PRECOMPILED}" >> $GITHUB_OUTPUT
          echo "cuda_major=${CUDA_MAJOR}" >> $GITHUB_OUTPUT
          echo "cuda_minor=${CUDA_MINOR}" >> $GITHUB_OUTPUT
          echo "cuda_patch=${CUDA_PATCH}" >> $GITHUB_OUTPUT
          echo "offloading_connector_version=${LLM_D_OFFLOADING_CONNECTOR_VERSION}" >> $GITHUB_OUTPUT
          echo "gb200_nvshmem_version=${GB200_NVSHMEM_VERSION}" >> $GITHUB_OUTPUT
          echo "gb200_deepep_repo=${GB200_DEEPEP_REPO}" >> $GITHUB_OUTPUT
          echo "gb200_deepep_version=${GB200_DEEPEP_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build the builder image layer
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.cuda
          platforms: linux/arm64
          target: builder
          push: false
          build-args: |
            TARGETOS=rhel
            TARGETPLATFORM=linux/arm64
            BUILD_BASE_IMAGE_SUFFIX=ubi9
            FINAL_BASE_IMAGE_SUFFIX=ubi9
            CUDA_MAJOR=${{ steps.common-version.outputs.cuda_major }}
            CUDA_MINOR=${{ steps.common-version.outputs.cuda_minor }}
            CUDA_PATCH=${{ steps.common-version.outputs.cuda_patch }}
            CACHE_BUSTER=${{ github.ref_name }}-${{ github.run_id }}
            NVSHMEM_VERSION=${{ steps.common-version.outputs.gb200_nvshmem_version }}
            DEEPEP_REPO=${{ steps.common-version.outputs.gb200_deepep_repo }}
            DEEPEP_VERSION=${{ steps.common-version.outputs.gb200_deepep_version }}
          github-token: ${{ secrets.GHCR_TOKEN }}
          secrets: |
            aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID_S3_BUCKET_ONLY }}
            aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY_S3_BUCKET_ONLY }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Build and push the final image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.cuda
          platforms: linux/arm64
          target: runtime
          push: true
          provenance: true
          build-args: |
            TARGETOS=rhel
            TARGETPLATFORM=linux/arm64
            BUILD_BASE_IMAGE_SUFFIX=ubi9
            FINAL_BASE_IMAGE_SUFFIX=ubi9
            CUDA_MAJOR=${{ steps.common-version.outputs.cuda_major }}
            CUDA_MINOR=${{ steps.common-version.outputs.cuda_minor }}
            CUDA_PATCH=${{ steps.common-version.outputs.cuda_patch }}
            CACHE_BUSTER=${{ github.ref_name }}-${{ github.run_id }}
            NVSHMEM_VERSION=${{ steps.common-version.outputs.gb200_nvshmem_version }}
            DEEPEP_REPO=${{ steps.common-version.outputs.gb200_deepep_repo }}
            DEEPEP_VERSION=${{ steps.common-version.outputs.gb200_deepep_version }}
            VLLM_REPO=${{ steps.common-version.outputs.repo }}
            VLLM_COMMIT_SHA=${{ steps.common-version.outputs.commit_sha }}
            VLLM_PRECOMPILED_WHEEL_COMMIT=${{ steps.common-version.outputs.precompiled_wheel_commit }}
            VLLM_PREBUILT=${{ steps.common-version.outputs.prebuilt }}
            VLLM_USE_PRECOMPILED=${{ steps.common-version.outputs.use_precompiled }}
            LLM_D_OFFLOADING_CONNECTOR_VERSION=${{ steps.common-version.outputs.offloading_connector_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-cuda-gb200:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}-cuda-gb200:latest
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-cuda-gb200:${{ env.TAG }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: vuln
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

  release-hpu-llm-d:
    strategy:
      fail-fast: false
    runs-on: vllm-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push the image
        id: build-and-push
        run: |
          export DEVICE=hpu
          export DOCKERFILE=Dockerfile.hpu
          export BUILD_TYPE=prod
          export VERSION="${{ env.TAG }}"
          make image-build
          make image-push
          echo "tag=${{ env.TAG }}" >> $GITHUB_OUTPUT
          # Also tag as latest (only for stable releases, not RCs)
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            export NEW_TAG="latest"
            make image-retag
            VERSION="latest" make image-push
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-hpu:${{ env.TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: vuln
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

  verify-release-images:
    name: Verify all release images exist
    needs:
      - release-aws-llm-d
      - release-gb200-llm-d
      - release-hpu-llm-d
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Verify all expected images
        run: |
          TAG="${{ env.TAG }}"
          IMAGES=(
            "${{ env.REGISTRY }}/llm-d/llm-d-aws:${TAG}"
            "${{ env.REGISTRY }}/llm-d/llm-d-cuda-gb200:${TAG}"
            "${{ env.REGISTRY }}/llm-d/llm-d-hpu:${TAG}"
          )

          echo "## Release Image Verification for ${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          MISSING=0
          for img in "${IMAGES[@]}"; do
            if docker buildx imagetools inspect "$img" > /dev/null 2>&1; then
              echo "| \`${img}\` | Found |" >> $GITHUB_STEP_SUMMARY
              echo "OK: $img"
            else
              echo "| \`${img}\` | MISSING |" >> $GITHUB_STEP_SUMMARY
              echo "MISSING: $img"
              MISSING=$((MISSING + 1))
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $MISSING -gt 0 ]; then
            echo "**${MISSING} image(s) missing from release ${TAG}**" >> $GITHUB_STEP_SUMMARY
            echo "::error::${MISSING} image(s) missing from release ${TAG}"
            exit 1
          fi
          echo "**All ${#IMAGES[@]} images verified for release ${TAG}**" >> $GITHUB_STEP_SUMMARY
