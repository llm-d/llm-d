name: Release LLM-D Images

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: llm-d
  TAG: ${{ github.event.release.tag_name != '' && github.event.release.tag_name || github.ref_name }}
  IS_STABLE: ${{ !contains(github.event.release.tag_name != '' && github.event.release.tag_name || github.ref_name, 'rc') }}

jobs:
  release-rocm-llm-d:
    runs-on: vllm-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # fetch tags for docker/metadata semver handling (if you use git describe etc.)
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --oci-worker-gc

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push the image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.rocm
          platforms: linux/amd64
          push: true
          provenance: true
          cache-from: type=gha,scope=rocm
          cache-to: type=gha,mode=max,scope=rocm,oci-mediatypes=true,compression=zstd
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-rocm:${{ env.TAG }}
            ${{ env.IS_STABLE == 'true' && format('{0}/{1}-rocm:latest', env.REGISTRY, github.repository) || '' }}
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-rocm:${{ env.TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: vuln
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

  release-xpu-llm-d:
    strategy:
      fail-fast: false
    runs-on: vllm-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # fetch tags for docker/metadata semver handling (if you use git describe etc.)
          fetch-depth: 0

      - name: Load vLLM XPU base image from file
        id: common-versions
        run: |
          source docker/common-versions
          echo "base_image=${VLLM_XPU_BASE_IMAGE}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --oci-worker-gc

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push the image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.xpu
          platforms: linux/amd64
          push: true
          provenance: true
          build-args: |
            BASE_IMAGE=${{ steps.common-versions.outputs.base_image }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-xpu:${{ env.TAG }}
            ${{ env.IS_STABLE == 'true' && format('{0}/{1}-xpu:latest', env.REGISTRY, github.repository) || '' }}
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-xpu:${{ env.TAG }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: vuln
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: "trivy-results.sarif"

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

  release-cpu-llm-d:
    runs-on: vllm-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # fetch tags for docker/metadata semver handling (if you use git describe etc.)
          fetch-depth: 0

      - name: Load vLLM version from file
        id: common-versions
        run: |
          source docker/common-versions
          echo "repo=${VLLM_REPO}" >> $GITHUB_OUTPUT
          echo "commit_sha=${VLLM_COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --oci-worker-gc

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push the image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.cpu
          platforms: linux/amd64
          push: true
          provenance: true
          # disabling cache from cache to temporarily to prevent building issues
          # cache-from: type=gha,scope=cpu
          # cache-to: type=gha,mode=max,scope=cpu,oci-mediatypes=true,compression=zstd
          build-args: |
            VLLM_REPO=${{ steps.common-versions.outputs.repo }}
            VLLM_COMMIT_SHA=${{ steps.common-versions.outputs.commit_sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-cpu:${{ env.TAG }}
            ${{ env.IS_STABLE == 'true' && format('{0}/{1}-cpu:latest', env.REGISTRY, github.repository) || '' }}
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-cpu:${{ env.TAG }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: vuln
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: "trivy-results.sarif"

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

  release-rdma-tools-llm-d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --oci-worker-gc

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push the image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.rdma-tools
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-rdma-tools:${{ env.TAG }}
            ${{ env.IS_STABLE == 'true' && format('{0}/{1}-rdma-tools:latest', env.REGISTRY, github.repository) || '' }}
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-rdma-tools@${{ steps.build-and-push.outputs.digest }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: vuln
          timeout: 30m
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: "trivy-results.sarif"

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

  release-sglang-xpu-llm-d:
    runs-on: xpu
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Load SGLang XPU source configuration
        id: common-versions
        run: |
          source docker/common-versions
          echo "repository=${SGLANG_XPU_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "ref=${SGLANG_XPU_REF}" >> $GITHUB_OUTPUT
          echo "kernel_repo=${SGLANG_XPU_KERNEL_REPO}" >> $GITHUB_OUTPUT
          echo "kernel_ref=${SGLANG_XPU_KERNEL_REF}" >> $GITHUB_OUTPUT

      - name: Checkout SGLang source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.common-versions.outputs.repository }}
          ref: ${{ steps.common-versions.outputs.ref }}
          path: .cache/sglang-src
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Pin SGLang and XPU kernel revisions
        run: git -C .cache/sglang-src apply "$GITHUB_WORKSPACE/patches/sglang_xpu_source_pins.patch"

      - name: Resolve source revisions
        id: source
        env:
          SGLANG_REPOSITORY: ${{ steps.common-versions.outputs.repository }}
        run: |
          echo "llmd_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "sglang_repo=https://github.com/${SGLANG_REPOSITORY}.git" >> $GITHUB_OUTPUT
          echo "sglang_sha=$(git -C .cache/sglang-src rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push the image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./.cache/sglang-src
          file: ./.cache/sglang-src/docker/xpu.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          no-cache: true
          build-args: |
            SG_LANG_REPO=${{ steps.source.outputs.sglang_repo }}
            SG_LANG_BRANCH=${{ steps.common-versions.outputs.ref }}
            SG_LANG_COMMIT=${{ steps.source.outputs.sglang_sha }}
            SG_LANG_KERNEL_REPO=${{ steps.common-versions.outputs.kernel_repo }}
            SG_LANG_KERNEL_BRANCH=${{ steps.common-versions.outputs.kernel_ref }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-xpu-sglang:${{ env.TAG }}
            ${{ env.IS_STABLE == 'true' && format('{0}/{1}-xpu-sglang:latest', env.REGISTRY, github.repository) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.llmd_sha }}
            io.llm-d.sglang.repository=${{ steps.source.outputs.sglang_repo }}
            io.llm-d.sglang.ref=${{ steps.common-versions.outputs.ref }}
            io.llm-d.sglang.revision=${{ steps.source.outputs.sglang_sha }}
            io.llm-d.sglang-xpu-kernel.repository=${{ steps.common-versions.outputs.kernel_repo }}
            io.llm-d.sglang-xpu-kernel.revision=${{ steps.common-versions.outputs.kernel_ref }}
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Record image provenance
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}-xpu-sglang
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
          SGLANG_REPOSITORY: ${{ steps.source.outputs.sglang_repo }}
          SGLANG_REF: ${{ steps.common-versions.outputs.ref }}
          SGLANG_SHA: ${{ steps.source.outputs.sglang_sha }}
          SGLANG_XPU_KERNEL_REPOSITORY: ${{ steps.common-versions.outputs.kernel_repo }}
          SGLANG_XPU_KERNEL_REF: ${{ steps.common-versions.outputs.kernel_ref }}
        run: |
          {
            echo "## SGLang XPU image"
            echo
            echo "- Image: \`${IMAGE}@${IMAGE_DIGEST}\`"
            echo "- SGLang repository: \`${SGLANG_REPOSITORY}\`"
            echo "- Requested ref: \`${SGLANG_REF}\`"
            echo "- Resolved revision: \`${SGLANG_SHA}\`"
            echo "- XPU kernel repository: \`${SGLANG_XPU_KERNEL_REPOSITORY}\`"
            echo "- XPU kernel revision: \`${SGLANG_XPU_KERNEL_REF}\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-xpu-sglang@${{ steps.build-and-push.outputs.digest }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: vuln
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy-xpu-sglang

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

  verify-release-images:
    name: Verify all release images exist
    needs:
      - release-cpu-llm-d
      - release-rocm-llm-d
      - release-xpu-llm-d
      - release-sglang-xpu-llm-d
      - release-rdma-tools-llm-d
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Verify all expected images
        run: |
          TAG="${{ env.TAG }}"
          IMAGES=(
            "${{ env.REGISTRY }}/llm-d/llm-d-cpu:${TAG}"
            "${{ env.REGISTRY }}/llm-d/llm-d-rocm:${TAG}"
            "${{ env.REGISTRY }}/llm-d/llm-d-xpu:${TAG}"
            "${{ env.REGISTRY }}/llm-d/llm-d-xpu-sglang:${TAG}"
            "${{ env.REGISTRY }}/llm-d/llm-d-rdma-tools:${TAG}"
          )

          echo "## Release Image Verification for ${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          MISSING=0
          for img in "${IMAGES[@]}"; do
            if docker buildx imagetools inspect "$img" > /dev/null 2>&1; then
              echo "| \`${img}\` | Found |" >> $GITHUB_STEP_SUMMARY
              echo "OK: $img"
            else
              echo "| \`${img}\` | MISSING |" >> $GITHUB_STEP_SUMMARY
              echo "MISSING: $img"
              MISSING=$((MISSING + 1))
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $MISSING -gt 0 ]; then
            echo "**${MISSING} image(s) missing from release ${TAG}**" >> $GITHUB_STEP_SUMMARY
            echo "::error::${MISSING} image(s) missing from release ${TAG}"
            exit 1
          fi
          echo "**All ${#IMAGES[@]} images verified for release ${TAG}**" >> $GITHUB_STEP_SUMMARY
