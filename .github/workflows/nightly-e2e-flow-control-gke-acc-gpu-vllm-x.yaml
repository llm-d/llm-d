name: Nightly - Flow Control E2E (GKE GPU)

# Nightly regression test for the flow-control guide (standalone router, vLLM).
# Deploys via guides/flow-control/scripts/nightly-deploy-gke.sh and hands off
# (via --extra-validate) to e2e-validate-flow-control.sh, which forces queue
# contention and checks backpressure, per-band isolation, and priority QoS.
#
# Why not the shared benchmark harness? Two reasons, both still true:
#   1. It cannot stand this guide up. The kustomize standup detects the model
#      from guides/<scenario>/modelserver/<accel>/<backend>/<infra>/, and this
#      guide deliberately keeps no modelserver/ overlay — it borrows
#      optimized-baseline's, as the guide README instructs. Runs die at standup
#      with "unable to detect model". (The harness has a flow-control special
#      case that borrows optimized-baseline's overlay, but it runs *after* the
#      detection step that needs the missing directory, so it never executes.)
#   2. It would not test the feature. Flow control is work-conserving, so a
#      sanity benchmark never queues and never exercises backpressure.
# This lane therefore runs the bespoke e2e reusable, as workload-autoscaling
# does for the same "no modelserver/ overlay" reason.
#
# Scope: proves priority ordering only. Weighted multi-tenant fairness/SLO at
# scale needs inference-perf multi-tenant trace replay (the heavy tier; see the
# guide's Benchmarking section).

on:
  schedule:
    - cron: '0 17 * * *'  # 17:00 UTC daily (staggered from sibling GKE nightlies)
  workflow_dispatch:
    inputs:
      skip_cleanup:
        description: 'Skip cleanup after tests (for debugging)'
        required: false
        default: 'false'
      pr_number:
        description: 'PR number for comment-back (set by /test-nightly)'
        required: false
        default: ''
      pr_repo:
        description: 'Repo for PR comment-back'
        required: false
        default: 'llm-d/llm-d'
      # This is a bespoke e2e, not a benchmark run, so the parameters below are
      # accepted and ignored — except cleanup (mapped to skip_cleanup) and
      # update_badge/dry_run (consumed by the badge job). They must stay
      # declared: slash-test-nightly.yaml sends its DEFAULT_PARAMS to every
      # nightly-e2e-* workflow whether or not the user passes any, and its 422
      # fallback only retries without pr_number/pr_repo — so an undeclared
      # parameter makes /test-nightly undispatchable for this lane. Keep this
      # set in sync with SUPPORTED_PARAMS in slash-test-nightly.yaml.
      decode_pods:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: false
        type: 'string'
        default: 'auto'
      prefill_pods:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: false
        type: 'string'
        default: 'auto'
      gateway_class:
        description: 'Ignored (guide is standalone/epponly)'
        required: false
        default: 'epponly'
      monitoring_enabled:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: true
        type: 'string'
        default: 'false'
      dry_run:
        description: 'Affects the badge only; this lane has no dry-run path'
        required: false
        default: 'false'
      verbose:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: false
        default: 'false'
        type: 'string'
      harness:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: false
        default: 'inference-perf'
        type: 'string'
      workload:
        description: 'Ignored (bespoke e2e, no benchmark)'
        required: false
        default: 'sanity_random.yaml'
        type: 'string'
      cleanup:
        description: 'Cleanup the llm-d stack stood up by this workflow'
        required: false
        default: 'true'
        type: string
      update_badge:
        description: 'Update the badge on gh-pages ("true", "false")'
        required: false
        default: 'true'
        type: string
      matrix_type:
        description: 'Will this workflow be part of a "nightly" (default) run or "release-X.Y.Z[rc]" run?'
        required: false
        default: 'nightly'
        type: 'string'
      harness_resources:
        description: 'CPU/Memory limits for the harness pod running llm-d-benchmark workloads (default 32/64Gi)'
        required: false
        default: '32/64Gi'
        type: 'string'

permissions:
  contents: write  # update-badge job commits the badge to the badges branch
  actions: read

concurrency:
  group: nightly-e2e-flow-control-gke-gpu
  cancel-in-progress: true

jobs:
  nightly:
    if: github.repository == 'llm-d/llm-d'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-nightly-e2e-gke.yaml@main
    with:
      guide_name: flow-control
      namespace: llm-d-nightly-flow-control-gke-gpu
      gateway_host: 'flow-control-epp'
      custom_deploy_script: |
        bash guides/flow-control/scripts/nightly-deploy-gke.sh
      e2e_validate_args: '--extra-validate flow-control'
      gke_cluster_name: llm-d-e2e-us-east5
      gke_cluster_zone: us-east5
      required_gpus: 2
      recommended_gpus: 4
      accelerator_type: H100
      pod_wait_timeout: '30m'
      # Brief grace after pods report Ready so the EPP finishes backend
      # discovery before the smoke loop fires. vLLM readiness already gates
      # model load, so a small margin suffices (reusable default is 180s).
      pod_readiness_delay: 60
      allow_gpu_preemption: true
      llm_d_ref: ${{ github.ref }}
      skip_cleanup: ${{ github.event.inputs.skip_cleanup == 'true' || github.event.inputs.cleanup == 'false' }}
      pr_number: ${{ github.event.inputs.pr_number }}
      pr_repo: ${{ github.event.inputs.pr_repo }}
      matrix_type: ${{ inputs.matrix_type || 'nightly' }}
    secrets: inherit

  update-badge:
    needs: [nightly]
    if: always() && inputs.update_badge != 'false'
    uses: llm-d/llm-d-infra/.github/workflows/reusable-update-badge.yaml@main
    with:
      badge_name: flow-control-gke
      badge_label: "VLLM GPU"
      result: ${{ needs.nightly.result }}
      dry_run: ${{ inputs.dry_run || 'false' }}
      # The e2e reusable declares no outputs, so failure_category resolves empty
      # and the badge falls back to a plain pass/fail (no category granularity).
      # Same as the workload-autoscaling lanes.
      failure_category: ${{ needs.nightly.outputs.failure_category }}
      matrix_type: ${{ inputs.matrix_type || 'nightly' }}
