name: Nightly - Router Perf Test (Optimized Baseline 10k-1k)

on:
  schedule:
    - cron: '0 9 * * *'  # Run daily at 09:00 UTC
  workflow_dispatch:      # Enable manual triggering from UI
    inputs:
      gcp_project_id:
        description: 'GCP Project ID'
        default: 'llm-d-scale'
        required: true
        type: string
      gke_cluster_name:
        description: 'GKE Cluster Name'
        default: 'llm-d-e2e-us-east5'
        required: true
        type: string
      gke_cluster_zone:
        description: 'GKE Cluster Zone/Region'
        default: 'us-east5'
        required: true
        type: string
      sim_replicas:
        description: 'Number of simulator replicas'
        default: '10'
        required: true
        type: string
      llm_d_ref:
        description: 'Git ref for llm-d/llm-d checkout (default: main)'
        default: 'main'
        required: false
        type: string
      guide_name:
        description: 'Guide name/configuration to use'
        default: 'optimized-baseline'
        required: true
        type: string
      test_name:
        description: 'Test identifier name'
        default: 'optimized-baseline-job1'
        required: true
        type: string
      perf_job:
        description: 'Performance job configuration path'
        default: 'scripts/perf-configs/shared_prefix_job1.yaml'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  run-perf-benchmark:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ inputs.gcp_project_id || 'llm-d-scale' }}
      GKE_CLUSTER_NAME: ${{ inputs.gke_cluster_name || 'llm-d-e2e-us-east5' }}
      GKE_CLUSTER_ZONE: ${{ inputs.gke_cluster_zone || 'us-east5' }}
      SIM_REPLICAS: ${{ inputs.sim_replicas || '10' }}
      LLM_D_REF: ${{ inputs.llm_d_ref || 'main' }}
      GUIDE_NAME: ${{ inputs.guide_name || 'optimized-baseline' }}
      TEST_NAME: ${{ inputs.test_name || 'optimized-baseline-job1' }}
      PERF_JOB: ${{ inputs.perf_job || 'scripts/perf-configs/shared_prefix_job1.yaml' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout llm-d/llm-d
        uses: actions/checkout@v6
        with:
          path: llm-d
          ref: ${{ env.LLM_D_REF }}

      - name: Checkout llm-d/llm-d-router
        uses: actions/checkout@v6
        with:
          repository: llm-d/llm-d-router
          path: llm-d-router

      - name: Checkout llm-d/inference-perf
        uses: actions/checkout@v6
        with:
          repository: llm-d/inference-perf
          path: inference-perf

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up gcloud CLI and kubectl
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: 'kubectl,gke-gcloud-auth-plugin'

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ env.GKE_CLUSTER_NAME }}" \
            --zone "${{ env.GKE_CLUSTER_ZONE }}" \
            --project "${{ env.GCP_PROJECT_ID }}"

      - name: Install helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: Run Performance Test Script
        run: |
          python3 llm-d/scripts/run_nightly_perf.py \
            --guide-name ${{ env.GUIDE_NAME }} \
            --test-name ${{ env.TEST_NAME }} \
            --perf-job ${{ env.PERF_JOB }} \
            --sim-replicas ${{ env.SIM_REPLICAS }} \
            --results-dir llm-d/llm-d-router-resource-tests \
            --gcp-project ${{ env.GCP_PROJECT_ID }}

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epp-perf-results
          path: llm-d/llm-d-router-resource-tests/

      - name: Commit and push updated results
        if: success() && github.ref == 'refs/heads/main'
        run: |
          cd llm-d
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llm-d-router-resource-tests/
          git commit -m "Auto-update EPP nightly performance results [skip ci]" || exit 0
          git push
