name: CI Guides Check

# Guides on the guide.yaml method render their README bash fences from the
# YAML (see guides/templates/README.md). The job fails when a README is stale
# relative to its guide.yaml (fix: `scripts/guide.py render <guide-dir>`),
# when a guide's `support:` matrix disagrees with its overlays or nightly E2E
# workflows, or when the llm-d.ai publish manifest is invalid, and runs the
# Python tests under scripts/tests/, plus
# nightly E2E verification, smoke-test, and async-multitenant tests.

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      guides: ${{ steps.filter.outputs.guides }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            guides:
              - '.github/workflows/ci-guides-check.yaml'
              - '.github/scripts/e2e/async-multitenant/**'
              - 'guides/**'
              - 'scripts/assigned-issue-reminder.py'
              - 'scripts/github_api.py'
              - 'docs/well-lit-paths/guides.yaml'
              - '.github/workflows/nightly-e2e-*.yaml'
              - 'scripts/guide.py'
              - 'scripts/matrix_common.py'
              - 'scripts/seed-release-badges.py'
              - 'scripts/tests/**'
              - '.github/scripts/nightly-e2e-verification/**'
              - 'docs/operations/validation/smoke-test/**'

  guides-check:
    needs: check-changes
    if: >-
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.check-changes.result == 'success' && needs.check-changes.outputs.guides == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          # No requirements file — the workflow itself pins the installs.
          cache-dependency-path: .github/workflows/ci-guides-check.yaml

      - name: Install dependencies
        run: python -m pip install --quiet 'pyyaml==6.*' 'packaging>=24.2' pytest

      - name: Check rendered READMEs are current
        run: python scripts/guide.py render guides/*/ guides/models/*/ guides/fast-model-actuation/fast-model-actuation-keda/ guides/batch-serving/asynchronous-processing/multitenant/ --check

      # The list of guides llm-d.ai publishes (synced by llm-d/llm-d.github.io).
      - name: Check the llm-d.ai guide publish manifest
        run: python scripts/guide.py check-manifest docs/well-lit-paths/guides.yaml

      - name: Run Python tests
        run: python -m pytest scripts/tests/ .github/scripts/nightly-e2e-verification/ docs/operations/validation/smoke-test/tests/ .github/scripts/e2e/async-multitenant/ -v
