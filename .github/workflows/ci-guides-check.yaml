name: CI Guides Check

# Guides on the guide.yaml method render their README bash fences from the
# YAML (see guides/templates/README.md). The job fails when a README is stale
# relative to its guide.yaml (fix: `scripts/guide.py render <guide-dir>`),
# when a guide's `support:` matrix disagrees with its overlays or nightly E2E
# workflows, or when the llm-d.ai publish manifest is invalid, and runs the
# unit tests under scripts/tests/.

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-guides-check.yaml
      - guides/**
      - docs/well-lit-paths/guides.yaml
      - .github/workflows/nightly-e2e-*.yaml
      - scripts/guide.py
      - scripts/matrix_common.py
      - scripts/seed-release-badges.py
      - scripts/tests/**
      - .github/scripts/nightly-e2e-verification/**
      - helpers/smoke-test/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-guides-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guides-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          # No requirements file — the workflow itself pins the installs.
          cache-dependency-path: .github/workflows/ci-guides-check.yaml

      - name: Install dependencies
        run: python -m pip install --quiet 'pyyaml==6.*' pytest

      - name: Check rendered READMEs are current
        run: python scripts/guide.py render guides/*/ guides/models/*/ --check

      # The list of guides llm-d.ai publishes (synced by llm-d/llm-d.github.io).
      - name: Check the llm-d.ai guide publish manifest
        run: python scripts/guide.py check-manifest docs/well-lit-paths/guides.yaml

      - name: Run Python tests
        run: python -m pytest scripts/tests/ .github/scripts/nightly-e2e-verification/ helpers/smoke-test/tests/ -v
