name: LLM-D Image Build

on:
  workflow_call:
    inputs:
      force_build:
        description: 'Force build all platforms (bypass change detection)'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Git ref to checkout (SHA or branch). Defaults to the triggering ref.'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Platforms to build (comma-separated: rocm,xpu,sglang-xpu,cpu). Overrides change detection when non-empty.'
        required: false
        type: string
        default: ''
      sglang_xpu_repository:
        description: 'GitHub repository containing the SGLang XPU source (owner/repo)'
        required: false
        type: string
        default: ''
      sglang_xpu_ref:
        description: 'SGLang commit, tag, or branch to build'
        required: false
        type: string
        default: ''
      sglang_xpu_buildkit_driver_opts:
        description: 'Optional BuildKit driver options for the SGLang XPU builder'
        required: false
        type: string
        default: ''
    outputs:
      xpu:
        description: 'Whether XPU image was built'
        value: ${{ jobs.detect-changes.outputs.xpu }}
      sglang-xpu:
        description: 'Whether the SGLang XPU image was built'
        value: ${{ jobs.detect-changes.outputs.sglang-xpu }}
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: rocm,xpu,sglang-xpu,cpu)"
        required: false
        default: "xpu"
        type: string
      ref:
        description: 'Git ref to checkout (SHA or branch). Defaults to the triggering ref.'
        required: false
        type: string
        default: ''
      vllm_repo:
        description: "vLLM repository URL to (override Dockerfile)"
        required: false
        type: string
      vllm_commit_sha:
        description: "vLLM commit SHA to checkout for source (override Dockerfile)"
        required: false
        type: string
      vllm_precompiled_wheel_commit:
        description: "vLLM commit SHA for precompiled wheel lookup (defaults to vllm_commit_sha)"
        required: false
        type: string
      sglang_xpu_repository:
        description: "GitHub repository containing the SGLang XPU source (owner/repo)"
        required: false
        type: string
      sglang_xpu_ref:
        description: "SGLang commit, tag, or branch to build"
        required: false
        type: string
      sglang_xpu_buildkit_driver_opts:
        description: "Optional BuildKit driver options for the SGLang XPU builder"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  PRODUCTION_REGISTRY: ghcr.io
  STAGING_REGISTRY: quay.io

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}

jobs:
  resolve-registry:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.resolve.outputs.registry }}
      is_pr: ${{ steps.resolve.outputs.is_pr }}
    steps:
      - name: Determine target registry
        id: resolve
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "registry=${{ env.STAGING_REGISTRY}}" >> $GITHUB_OUTPUT
            echo "is_pr=true" >> $GITHUB_OUTPUT
          else
            echo "registry=${{ env.PRODUCTION_REGISTRY}}" >> $GITHUB_OUTPUT
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rocm: ${{ steps.force.outputs.rocm || steps.platforms-input.outputs.rocm || steps.filter.outputs.rocm }}
      xpu: ${{ steps.force.outputs.xpu || steps.platforms-input.outputs.xpu || steps.filter.outputs.xpu }}
      sglang-xpu: ${{ steps.force.outputs.sglang-xpu || steps.platforms-input.outputs.sglang-xpu || steps.filter.outputs.sglang-xpu }}
      cpu: ${{ steps.force.outputs.cpu || steps.platforms-input.outputs.cpu || steps.filter.outputs.cpu }}
      rdma-tools: ${{ steps.filter.outputs.rdma-tools }}
    steps:
      - name: Force all platforms
        if: inputs.force_build == true
        id: force
        run: |
          echo "rocm=true" >> $GITHUB_OUTPUT
          echo "xpu=true" >> $GITHUB_OUTPUT
          echo "sglang-xpu=true" >> $GITHUB_OUTPUT
          echo "cpu=true" >> $GITHUB_OUTPUT
      # shim to convert comma-separated platforms input into same boolean outputs as path filter
      # covers both the workflow_call override and workflow_dispatch
      - name: Parse platforms input
        if: inputs.force_build != true && (inputs.platforms != '' || github.event_name == 'workflow_dispatch')
        id: platforms-input
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          platforms=",${PLATFORMS//[[:space:]]/},"
          has_platform() {
            case "$platforms" in
              *,"$1",*) printf 'true' ;;
              *) printf 'false' ;;
            esac
          }
          echo "rocm=$(has_platform rocm)" >> $GITHUB_OUTPUT
          echo "xpu=$(has_platform xpu)" >> $GITHUB_OUTPUT
          echo "sglang-xpu=$(has_platform sglang-xpu)" >> $GITHUB_OUTPUT
          echo "cpu=$(has_platform cpu)" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          allow-unsafe-pr-checkout: true
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch' && inputs.force_build != true && inputs.platforms == ''
        id: filter
        with:
          filters: |
            rocm:
              - 'docker/Dockerfile.rocm'
              - 'docker/scripts/common/build-uccl.sh'
            xpu:
              - 'docker/Dockerfile.xpu'
              - 'docker/common-versions'
            sglang-xpu:
              - 'docker/common-versions'
              - 'patches/sglang_xpu_source_pins.patch'
            cpu:
              - 'docker/Dockerfile.cpu'
              - 'docker/common-versions'
              - 'docker/scripts/cpu/**'
            rdma-tools:
              - 'docker/Dockerfile.rdma-tools'
              - 'docker/common-versions'

  rdma-tools-build-llm-d:
    needs: [detect-changes, resolve-registry]
    if: ${{ needs.detect-changes.outputs.rdma-tools == 'true' }}
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Set target registry
        run: echo "REGISTRY=${{ needs.resolve-registry.outputs.registry }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          allow-unsafe-pr-checkout: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --oci-worker-gc

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ needs.resolve-registry.outputs.registry }}
          username: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_USER || secrets.GHCR_USER }}
          password: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_TOKEN || secrets.GHCR_TOKEN }}

      - name: Compute short SHA from checkout
        id: short-sha
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-rdma-tools
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=sha-${{ steps.short-sha.outputs.short_sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.rdma-tools
          platforms: linux/amd64
          push: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          github-token: ${{ secrets.GHCR_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-rdma-tools@${{ steps.build-and-push.outputs.digest }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: vuln
          timeout: 30m
        env:
          TRIVY_USERNAME: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_USER || secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_TOKEN || secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: "trivy-results.sarif"

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

      - name: Install cosign
        if: ${{ needs.resolve-registry.outputs.is_pr == 'false' && steps.build-and-push.outputs.digest != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        if: ${{ needs.resolve-registry.outputs.is_pr == 'false' && steps.build-and-push.outputs.digest != '' }}
        run: cosign sign --yes ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-rdma-tools@${{ steps.build-and-push.outputs.digest }}
  xpu-build-llm-d:
    needs: [detect-changes, resolve-registry]
    if: ${{ needs.detect-changes.outputs.xpu == 'true' }}
    strategy:
      fail-fast: false
    runs-on: xpu
    steps:
      - name: Set target registry
        run: echo "REGISTRY=${{ needs.resolve-registry.outputs.registry }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          allow-unsafe-pr-checkout: true

      - name: Load vLLM XPU base image from file
        id: common-versions
        run: |
          # Read prebuilt XPU base image ref from docker/common-versions
          source docker/common-versions
          echo "base_image=${VLLM_XPU_BASE_IMAGE}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ needs.resolve-registry.outputs.registry }}
          username: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_USER || secrets.GHCR_USER }}
          password: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_TOKEN || secrets.GHCR_TOKEN }}

      - name: Set image tag
        id: set-tag
        run: |
          TAG="sha-$(git rev-parse --short HEAD)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          PR_TAG="${{ github.event.pull_request.number }}"
          if [ -n "${PR_TAG}" ]; then
            echo "pr_tag=pr-${PR_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Calculate Cache Bust Timestamp
        id: cache_buster_timestamp
        run: |
          echo "cache_buster_timestamp=$(date)" >> $GITHUB_OUTPUT

      - name: Build and push the image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.xpu
          platforms: linux/amd64
          push: true
          provenance: true
          build-args: |
            BASE_IMAGE=${{ steps.common-versions.outputs.base_image }}
            CACHE_BUSTER=${{ steps.cache_buster_timestamp.outputs.cache_buster_timestamp }}
          tags: |
            ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-xpu:${{ steps.set-tag.outputs.tag }}
            ${{ steps.set-tag.outputs.pr_tag != '' && format('{0}/{1}-xpu:{2}', env.REGISTRY, github.repository, steps.set-tag.outputs.pr_tag) || '' }}
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request_target' && format('{0}/{1}-xpu:latest', env.REGISTRY, github.repository) || '' }}
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-xpu:${{ steps.set-tag.outputs.tag }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: vuln # skip secrets/config/license analyzers
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_USER || secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_TOKEN || secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: "trivy-results.sarif"

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

      - name: Install cosign
        if: ${{ needs.resolve-registry.outputs.is_pr == 'false' && steps.build-and-push.outputs.digest != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        if: ${{ needs.resolve-registry.outputs.is_pr == 'false' && steps.build-and-push.outputs.digest != '' }}
        run: cosign sign --yes ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-xpu@${{ steps.build-and-push.outputs.digest }}
  xpu-sglang-build-llm-d:
    needs: [detect-changes, resolve-registry]
    if: ${{ needs.detect-changes.outputs.sglang-xpu == 'true' }}
    runs-on: xpu
    steps:
      - name: Set target registry
        run: echo "REGISTRY=${{ needs.resolve-registry.outputs.registry }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          allow-unsafe-pr-checkout: true

      - name: Load SGLang XPU source configuration
        id: common-versions
        run: |
          source docker/common-versions
          echo "repository=${SGLANG_XPU_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "ref=${SGLANG_XPU_REF}" >> $GITHUB_OUTPUT
          echo "kernel_repo=${SGLANG_XPU_KERNEL_REPO}" >> $GITHUB_OUTPUT
          echo "kernel_ref=${SGLANG_XPU_KERNEL_REF}" >> $GITHUB_OUTPUT

      - name: Checkout SGLang source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.sglang_xpu_repository || steps.common-versions.outputs.repository }}
          ref: ${{ inputs.sglang_xpu_ref || steps.common-versions.outputs.ref }}
          path: .cache/sglang-src
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Pin SGLang and XPU kernel revisions
        run: git -C .cache/sglang-src apply "$GITHUB_WORKSPACE/patches/sglang_xpu_source_pins.patch"

      - name: Resolve source revisions
        id: source
        env:
          SGLANG_REPOSITORY: ${{ inputs.sglang_xpu_repository || steps.common-versions.outputs.repository }}
        run: |
          echo "llmd_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "llmd_short_sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "sglang_repo=https://github.com/${SGLANG_REPOSITORY}.git" >> $GITHUB_OUTPUT
          echo "sglang_sha=$(git -C .cache/sglang-src rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: ${{ inputs.sglang_xpu_buildkit_driver_opts }}

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ needs.resolve-registry.outputs.registry }}
          username: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_USER || secrets.GHCR_USER }}
          password: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_TOKEN || secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-xpu-sglang
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=sha-${{ steps.source.outputs.llmd_short_sha }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.llmd_sha }}
            io.llm-d.sglang.repository=${{ steps.source.outputs.sglang_repo }}
            io.llm-d.sglang.ref=${{ inputs.sglang_xpu_ref || steps.common-versions.outputs.ref }}
            io.llm-d.sglang.revision=${{ steps.source.outputs.sglang_sha }}
            io.llm-d.sglang-xpu-kernel.repository=${{ steps.common-versions.outputs.kernel_repo }}
            io.llm-d.sglang-xpu-kernel.revision=${{ steps.common-versions.outputs.kernel_ref }}

      - name: Build and push the image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./.cache/sglang-src
          file: ./.cache/sglang-src/docker/xpu.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          no-cache: true
          build-args: |
            SG_LANG_REPO=${{ steps.source.outputs.sglang_repo }}
            SG_LANG_BRANCH=${{ inputs.sglang_xpu_ref || steps.common-versions.outputs.ref }}
            SG_LANG_COMMIT=${{ steps.source.outputs.sglang_sha }}
            SG_LANG_KERNEL_REPO=${{ steps.common-versions.outputs.kernel_repo }}
            SG_LANG_KERNEL_BRANCH=${{ steps.common-versions.outputs.kernel_ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Record image provenance
        env:
          IMAGE: ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-xpu-sglang
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
          SGLANG_REPOSITORY: ${{ steps.source.outputs.sglang_repo }}
          SGLANG_REF: ${{ inputs.sglang_xpu_ref || steps.common-versions.outputs.ref }}
          SGLANG_SHA: ${{ steps.source.outputs.sglang_sha }}
          SGLANG_XPU_KERNEL_REPOSITORY: ${{ steps.common-versions.outputs.kernel_repo }}
          SGLANG_XPU_KERNEL_REF: ${{ steps.common-versions.outputs.kernel_ref }}
        run: |
          {
            echo "## SGLang XPU image"
            echo
            echo "- Image: \`${IMAGE}@${IMAGE_DIGEST}\`"
            echo "- SGLang repository: \`${SGLANG_REPOSITORY}\`"
            echo "- Requested ref: \`${SGLANG_REF}\`"
            echo "- Resolved revision: \`${SGLANG_SHA}\`"
            echo "- XPU kernel repository: \`${SGLANG_XPU_KERNEL_REPOSITORY}\`"
            echo "- XPU kernel revision: \`${SGLANG_XPU_KERNEL_REF}\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-xpu-sglang@${{ steps.build-and-push.outputs.digest }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: vuln
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_USER || secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_TOKEN || secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy-xpu-sglang

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

      - name: Install cosign
        if: ${{ needs.resolve-registry.outputs.is_pr == 'false' && steps.build-and-push.outputs.digest != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        if: ${{ needs.resolve-registry.outputs.is_pr == 'false' && steps.build-and-push.outputs.digest != '' }}
        run: cosign sign --yes ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-xpu-sglang@${{ steps.build-and-push.outputs.digest }}
  rocm-build-llm-d:
    needs: [detect-changes, resolve-registry]
    if: ${{ needs.detect-changes.outputs.rocm == 'true' }}
    runs-on: vllm-runner
    steps:
      - name: Set target registry
        run: echo "REGISTRY=${{ needs.resolve-registry.outputs.registry }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          allow-unsafe-pr-checkout: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ needs.resolve-registry.outputs.registry }}
          username: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_USER || secrets.GHCR_USER }}
          password: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_TOKEN || secrets.GHCR_TOKEN }}

      - name: Set image tag
        id: set-tag
        run: |
          TAG="sha-$(git rev-parse --short HEAD)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          PR_TAG="${{ github.event.pull_request.number }}"
          if [ -n "${PR_TAG}" ]; then
            echo "pr_tag=pr-${PR_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push the image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.rocm
          platforms: linux/amd64
          push: true
          provenance: true
          cache-from: type=registry,ref=${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-rocm:build-cache
          cache-to: type=registry,ref=${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-rocm:build-cache,mode=max,oci-mediatypes=true,compression=zstd,ignore-error=true
          tags: |
            ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-rocm:${{ steps.set-tag.outputs.tag }}
            ${{ steps.set-tag.outputs.pr_tag != '' && format('{0}/{1}-rocm:{2}', env.REGISTRY, github.repository, steps.set-tag.outputs.pr_tag) || '' }}
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request_target' && format('{0}/{1}-rocm:latest', env.REGISTRY, github.repository) || '' }}
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-rocm:${{ steps.set-tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: vuln              # skip secrets/config/license analyzers
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_USER || secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_TOKEN || secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

      - name: Install cosign
        if: ${{ needs.resolve-registry.outputs.is_pr == 'false' && steps.build-and-push.outputs.digest != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        if: ${{ needs.resolve-registry.outputs.is_pr == 'false' && steps.build-and-push.outputs.digest != '' }}
        run: cosign sign --yes ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-rocm@${{ steps.build-and-push.outputs.digest }}
  cpu-build-llm-d:
    needs: [detect-changes, resolve-registry]
    if: ${{ needs.detect-changes.outputs.cpu == 'true' }}
    runs-on: vllm-runner
    steps:
      - name: Set target registry
        run: echo "REGISTRY=${{ needs.resolve-registry.outputs.registry }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          allow-unsafe-pr-checkout: true

      - name: Load vLLM version from file
        id: common-versions
        run: |
          # Read vLLM version from docker/common-versions file and set as outputs
          source docker/common-versions
          echo "repo=${VLLM_REPO}" >> $GITHUB_OUTPUT
          echo "commit_sha=${VLLM_COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ needs.resolve-registry.outputs.registry }}
          username: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_USER || secrets.GHCR_USER }}
          password: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_TOKEN || secrets.GHCR_TOKEN }}

      - name: Set image tag
        id: set-tag
        run: |
          TAG="sha-$(git rev-parse --short HEAD)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          PR_TAG="${{ github.event.pull_request.number }}"
          if [ -n "${PR_TAG}" ]; then
            echo "pr_tag=pr-${PR_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Calculate Cache Bust Timestamp
        id: cache_buster_timestamp
        run: |
          echo "cache_buster_timestamp=$(date)" >> $GITHUB_OUTPUT

      - name: Build and push the image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.cpu
          platforms: linux/amd64
          push: true
          provenance: true
          # disabling cache from cache to temporarily to prevent building issues
          # cache-from: type=gha,scope=cpu-dev
          # cache-to: type=gha,mode=max,scope=cpu-dev,oci-mediatypes=true,compression=zstd
          build-args: |
            CACHE_BUSTER=${{ steps.cache_buster_timestamp.outputs.cache_buster_timestamp }}
            VLLM_REPO=${{ inputs.vllm_repo || steps.common-versions.outputs.repo }}
            VLLM_COMMIT_SHA=${{ inputs.vllm_commit_sha || steps.common-versions.outputs.commit_sha }}
          tags: |
            ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-cpu:${{ steps.set-tag.outputs.tag }}
            ${{ steps.set-tag.outputs.pr_tag != '' && format('{0}/{1}-cpu:{2}', env.REGISTRY, github.repository, steps.set-tag.outputs.pr_tag) || '' }}
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request_target' && format('{0}/{1}-cpu:latest', env.REGISTRY, github.repository) || '' }}
          github-token: ${{ secrets.GHCR_TOKEN }}
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: "plain"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-cpu:${{ steps.set-tag.outputs.tag }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: vuln # skip secrets/config/license analyzers
          timeout: 30m
          skip-dirs: /root/.cache/uv
        env:
          TRIVY_USERNAME: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_USER || secrets.GHCR_USER }}
          TRIVY_PASSWORD: ${{ needs.resolve-registry.outputs.is_pr == 'true' && secrets.QUAY_TOKEN || secrets.GHCR_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: "trivy-results.sarif"

      - name: Display vulnerability summary
        run: |
          echo "=== Vulnerability Scan Summary ==="
          if [ -f trivy-results.sarif ]; then
            echo "Scan completed. Check the Security tab for detailed results."
          else
            echo "No vulnerabilities found or scan failed."
          fi

      - name: Install cosign
        if: ${{ needs.resolve-registry.outputs.is_pr == 'false' && steps.build-and-push.outputs.digest != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        if: ${{ needs.resolve-registry.outputs.is_pr == 'false' && steps.build-and-push.outputs.digest != '' }}
        run: cosign sign --yes ${{ needs.resolve-registry.outputs.registry }}/${{ github.repository }}-cpu@${{ steps.build-and-push.outputs.digest }}
