version: 2
# `labels: []` is deliberate: without the key, Dependabot creates and applies
# its default `dependencies` and ecosystem labels.
updates:

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: []
    commit-message:
      prefix: "deps(actions)"

  # Docker base image updates
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    labels: []
    commit-message:
      prefix: "deps(docker)"
