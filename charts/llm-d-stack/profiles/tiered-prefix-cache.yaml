profile: tiered-prefix-cache

routerStandalone:
  enabled: true
  router:
    extraServicePorts:
      - name: http
        port: 80
        protocol: TCP
        targetPort: 8081
    epp:
      pluginsConfigFile: tiered-prefix-cache-plugins.yaml
      pluginsCustomConfig:
        tiered-prefix-cache-plugins.yaml: |
          apiVersion: llm-d.ai/v1alpha1
          kind: EndpointPickerConfig
          plugins:
          - type: no-hit-lru-scorer
          - type: approx-prefix-cache-producer
            name: gpu-prefix-cache-producer
          - type: approx-prefix-cache-producer
            name: cpu-prefix-cache-producer
            parameters:
              autoTune: false
              lruCapacityPerServer: 82000
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: prefix-cache-scorer
            name: gpu-prefix-cache-scorer
            parameters:
              prefixMatchInfoProducerName: gpu-prefix-cache-producer
          - type: prefix-cache-scorer
            name: cpu-prefix-cache-scorer
            parameters:
              prefixMatchInfoProducerName: cpu-prefix-cache-producer
          schedulingProfiles:
          - name: default
            plugins:
            - pluginRef: queue-scorer
            - pluginRef: kv-cache-utilization-scorer
            - pluginRef: gpu-prefix-cache-scorer
            - pluginRef: cpu-prefix-cache-scorer
            - pluginRef: no-hit-lru-scorer
    modelServers:
      matchLabels:
        llm-d.ai/guide: tiered-prefix-cache

routerGateway:
  enabled: false
  router:
    extraServicePorts:
      - name: http
        port: 80
        protocol: TCP
        targetPort: 8081
    epp:
      pluginsConfigFile: tiered-prefix-cache-plugins.yaml
      pluginsCustomConfig:
        tiered-prefix-cache-plugins.yaml: |
          apiVersion: llm-d.ai/v1alpha1
          kind: EndpointPickerConfig
          plugins:
          - type: no-hit-lru-scorer
          - type: approx-prefix-cache-producer
            name: gpu-prefix-cache-producer
          - type: approx-prefix-cache-producer
            name: cpu-prefix-cache-producer
            parameters:
              autoTune: false
              lruCapacityPerServer: 82000
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: prefix-cache-scorer
            name: gpu-prefix-cache-scorer
            parameters:
              prefixMatchInfoProducerName: gpu-prefix-cache-producer
          - type: prefix-cache-scorer
            name: cpu-prefix-cache-scorer
            parameters:
              prefixMatchInfoProducerName: cpu-prefix-cache-producer
          schedulingProfiles:
          - name: default
            plugins:
            - pluginRef: queue-scorer
            - pluginRef: kv-cache-utilization-scorer
            - pluginRef: gpu-prefix-cache-scorer
            - pluginRef: cpu-prefix-cache-scorer
            - pluginRef: no-hit-lru-scorer
    modelServers:
      matchLabels:
        llm-d.ai/guide: tiered-prefix-cache

modelServers:
  enabled: true
  defaultLabels:
    llm-d.ai/guide: tiered-prefix-cache
    llm-d.ai/model: Qwen3-32B
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/engine-type: vllm
  defaults:
    command:
      - /bin/bash
      - -c
  items:
    - name: decode
      enabled: true
      role: decode
      replicas: 8
      args:
        - |
          exec vllm serve \
            Qwen/Qwen3-32B \
            --tensor-parallel-size=2 \
            --kv-transfer-config \
            '{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":107374182400}}'
      resources:
        limits:
          cpu: "16"
          memory: 128Gi
          nvidia.com/gpu: 2
        requests:
          cpu: "8"
          memory: 96Gi
          nvidia.com/gpu: 2
