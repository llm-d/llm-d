modelServers:
  enabled: true
  defaultLabels:
    llm-d.ai/guide: precise-prefix-cache-routing
    llm-d.ai/model: Qwen3-32B
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/engine-type: vllm
  items:
    - name: decode
      enabled: true
      role: decode
      replicas: 8
      args:
        - Qwen/Qwen3-32B
        - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
        - --tensor-parallel-size=2
        - --block-size=64
        - --kv-events-config
        - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@Qwen/Qwen3-32B"}'
      ports:
        - name: modelserver
          containerPort: 8000
          protocol: TCP
        - name: kv-events
          containerPort: 5556
          protocol: TCP
      env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_PORT
          value: "8000"
        - name: KV_EVENTS_ENDPOINT
          value: "tcp://*:5556"
        - name: DO_NOT_TRACK
          value: "1"
      resources:
        limits:
          cpu: "16"
          memory: 128Gi
          nvidia.com/gpu: 2
        requests:
          cpu: "8"
          memory: 96Gi
          nvidia.com/gpu: 2

extraObjects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: precise-prefix-cache-routing-render
      labels:
        app.kubernetes.io/component: vllm-render
        app.kubernetes.io/part-of: precise-prefix-cache-routing
    spec:
      replicas: 3
      selector:
        matchLabels:
          app.kubernetes.io/component: vllm-render
          app.kubernetes.io/part-of: precise-prefix-cache-routing
      template:
        metadata:
          labels:
            app.kubernetes.io/component: vllm-render
            app.kubernetes.io/part-of: precise-prefix-cache-routing
        spec:
          automountServiceAccountToken: false
          containers:
            - name: vllm-render
              image: docker.io/vllm/vllm-openai-cpu:v0.23.0
              imagePullPolicy: IfNotPresent
              command:
                - vllm
                - launch
                - render
              args:
                - Qwen/Qwen3-32B
                - --port=8000
              ports:
                - name: render-http
                  containerPort: 8000
              env:
                - name: HF_HOME
                  value: /tmp/hf
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: llm-d-hf-token
                      key: HF_TOKEN
                - name: DO_NOT_TRACK
                  value: "1"
              resources:
                requests:
                  cpu: "1"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 12Gi
              readinessProbe:
                httpGet:
                  path: /health
                  port: render-http
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 60
              volumeMounts:
                - mountPath: /tmp/hf
                  name: hf-cache
          volumes:
            - name: hf-cache
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      name: precise-prefix-cache-routing-render
      labels:
        app.kubernetes.io/component: vllm-render
        app.kubernetes.io/part-of: precise-prefix-cache-routing
    spec:
      selector:
        app.kubernetes.io/component: vllm-render
        app.kubernetes.io/part-of: precise-prefix-cache-routing
      ports:
        - name: render-http
          port: 8000
          targetPort: render-http
          protocol: TCP
