profile: precise-prefix-cache-routing

routerStandalone:
  enabled: true
  router:
    epp:
      replicas: 2
      flags:
        ha-enable-leader-election: false
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: llm-d-hf-token
              key: HF_TOKEN
      pluginsConfigFile: precise-prefix-cache-routing-plugins.yaml
      pluginsCustomConfig:
        precise-prefix-cache-routing-plugins.yaml: |
          apiVersion: llm-d.ai/v1alpha1
          kind: EndpointPickerConfig
          plugins:
            - type: token-producer
              parameters:
                modelName: Qwen/Qwen3-32B
                vllm:
                  url: "http://precise-prefix-cache-routing-render:8000"
            - type: endpoint-notification-source
            - type: precise-prefix-cache-producer
              parameters:
                tokenProcessorConfig:
                  blockSize: 64
                speculativeIndexing: true
                indexerConfig:
                  kvBlockIndexConfig:
                    enableMetrics: true
                kvEventsConfig:
                  topicFilter: "kv@"
                  concurrency: 8
                  discoverPods: true
                  podDiscoveryConfig:
                    socketPort: 5556
            - type: prefix-cache-scorer
              parameters:
                prefixMatchInfoProducerName: precise-prefix-cache-producer
            - type: kv-cache-utilization-scorer
            - type: queue-scorer
            - type: no-hit-lru-scorer
              parameters:
                prefixMatchInfoProducerName: precise-prefix-cache-producer
          dataLayer:
            sources:
              - pluginRef: endpoint-notification-source
                extractors:
                  - pluginRef: precise-prefix-cache-producer
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: kv-cache-utilization-scorer
                  weight: 2.0
                - pluginRef: queue-scorer
                  weight: 2.0
                - pluginRef: prefix-cache-scorer
                  weight: 3.0
                - pluginRef: no-hit-lru-scorer
                  weight: 2.0
    extraServicePorts:
      - name: http
        port: 80
        protocol: TCP
        targetPort: 8081
    modelServers:
      type: vllm
      targetPorts:
        - number: 8000
      matchLabels:
        llm-d.ai/guide: precise-prefix-cache-routing

