{{- if .Values.hfToken.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hfToken.secretName }}
  labels:
{{ include "llm-d-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.hfToken.key }}: {{ required "hfToken.value is required when hfToken.create=true" .Values.hfToken.value | quote }}
{{- end }}
