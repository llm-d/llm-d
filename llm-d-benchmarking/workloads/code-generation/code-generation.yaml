load:
  type: concurrent
  num_workers: 6
  request_timeout: 300.0
  stages:
    - num_requests: ${MAX_REQUESTS}
      concurrency_level: ${CONC}

api:
  type: completion
  streaming: ${STREAMING_MODE}
  headers:
    x-slo-tpot-ms: "${SLO_TPOT_MS}"
    x-slo-ttft-ms: "${SLO_TTFT_MS}"
    x-gateway-inference-objective: ${SHEDDABLE}
  slo_tpot_header: x-slo-tpot-ms
server:
  type: vllm
  model_name: ${MODEL_NAME}
  base_url: ${BASE_URL}
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: ${MODEL_NAME}
metrics:
  type: prometheus
  prometheus:
    url: http://prometheus-server.wva-monitoring.svc.cluster.local:80
    scrape_interval: 15
    google_managed: false
report:
  request_lifecycle:
    summary: true
    per_stage: true
  prometheus:
    summary: true
    per_stage: true
storage:
  google_cloud_storage:
    bucket_name: ${GCS_BUCKET}
    path: ${OUTPUT_DIR}
    report_file_prefix: ${REPORT_PREFIX}
data:
  type: conversation_replay
  conversation_replay:
    seed: ${SEED}
    num_conversations: ${NUM_CONVERSATIONS}
    shared_system_prompt_len: 3000
    dynamic_system_prompt_len:
      type: uniform
      min: 15000
      max: 100000
      mean: 55000
      std_dev: 25000
    turns_per_conversation:
      type: normal
      min: 2
      max: 20
      mean: 6
      std_dev: 3.5
    input_tokens_per_turn:
      type: lognormal
      min: 100
      max: 10000
      mean: 1500
      std_dev: 1200
    output_tokens_per_turn:
      type: lognormal
      min: 50
      max: 4000
      mean: 800
      std_dev: 600
    tool_call_latency_sec:
      type: normal
      min: 0
      max: 0
      mean: 0
      std_dev: 0
