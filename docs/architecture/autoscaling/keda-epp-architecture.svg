<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 315" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="680" height="315" rx="4" fill="#ffffff" stroke="#d9d2e9" stroke-width="2.5"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">KEDA + EPP Architecture</text>

  <!-- ── Row 1: Inference path ───────────────────────────────────────── -->

  <!-- Client -->
  <rect x="20" y="55" width="88" height="40" rx="3" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1"/>
  <text x="64" y="80" text-anchor="middle" font-size="12" fill="#000000">Client</text>

  <!-- Client → EPP -->
  <line x1="108" y1="75" x2="175" y2="75" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- EPP -->
  <rect x="177" y="55" width="138" height="40" rx="3" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1"/>
  <text x="246" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">EPP</text>
  <text x="246" y="88" text-anchor="middle" font-size="10" fill="#666666">Flow Control</text>

  <!-- EPP → Pool -->
  <line x1="315" y1="75" x2="400" y2="75" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="357" y="67" text-anchor="middle" font-size="9.5" fill="#444444">inference requests</text>

  <!-- Model Server Pool -->
  <rect x="402" y="55" width="258" height="40" rx="3" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1"/>
  <text x="531" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Model Server Pool</text>
  <text x="531" y="88" text-anchor="middle" font-size="10" fill="#666666">vLLM</text>

  <!-- ── Vertical: Prometheus scrapes EPP ───────────────────────────── -->
  <line x1="228" y1="220" x2="228" y2="97" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="152" y="152" font-size="9.5" fill="#444444">scrapes EPP</text>
  <text x="152" y="165" font-size="9.5" fill="#444444">(ServiceMonitor)</text>

  <!-- ── Row 2: Metrics pipeline ────────────────────────────────────── -->

  <!-- Prometheus -->
  <rect x="168" y="222" width="120" height="40" rx="3" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1"/>
  <text x="228" y="247" text-anchor="middle" font-size="12" fill="#000000">Prometheus</text>

  <!-- KEDA → Prometheus (KEDA queries) -->
  <line x1="330" y1="242" x2="292" y2="242" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="311" y="273" text-anchor="middle" font-size="9" fill="#444444">PromQL</text>

  <!-- KEDA -->
  <rect x="332" y="222" width="164" height="40" rx="3" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1"/>
  <text x="414" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">KEDA</text>
  <text x="414" y="255" text-anchor="middle" font-size="9" fill="#666666">Prometheus scaler + metrics server</text>

  <!-- KEDA → HPA -->
  <line x1="496" y1="242" x2="530" y2="242" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- HPA -->
  <rect x="532" y="222" width="108" height="40" rx="3" fill="#f3f3f3" stroke="#d9d2e9" stroke-width="1"/>
  <text x="586" y="240" text-anchor="middle" font-size="12" fill="#000000">HPA</text>
  <text x="586" y="254" text-anchor="middle" font-size="9" fill="#666666">owned by KEDA</text>

  <!-- ── Vertical: HPA → Pool (scale) ───────────────────────────────── -->
  <line x1="586" y1="222" x2="586" y2="97" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="599" y="152" font-size="9.5" fill="#444444">scale</text>
  <text x="599" y="165" font-size="9.5" fill="#444444">replicas</text>

  <!-- Caption -->
  <text x="340" y="299" text-anchor="middle" font-size="10" fill="#888888">EPP demand signals drive scaling; KEDA creates and owns the HPA (no Prometheus Adapter)</text>
</svg>
