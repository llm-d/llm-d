<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="queue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="gate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="merge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <linearGradient id="pool-gate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>

    <linearGradient id="pool-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="router-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#270a04"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="540" y="32" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">llm-d-async Architecture (4 Queues, 2 Pools &amp; Router Endpoints)</text>

  <!-- ==================== OUTER BOX: LLM-D-ASYNC BOUNDARY ==================== -->
  <rect x="15" y="45" width="895" height="575" rx="18" fill="#1e1b4b" fill-opacity="0.15" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="35" y="34" width="130" height="24" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <text x="100" y="50" fill="#e0e7ff" font-size="13" font-weight="700" text-anchor="middle">llm-d-async</text>

  <!-- Container Box for Pool 1 Pipeline -->
  <rect x="30" y="70" width="865" height="245" rx="14" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="50" y="92" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">INFERENCE PIPELINE 1 (POOL 1)</text>

  <!-- Container Box for Pool 2 Pipeline -->
  <rect x="30" y="345" width="865" height="245" rx="14" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="50" y="367" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">INFERENCE PIPELINE 2 (POOL 2)</text>

  <!-- ==================== COLUMN 1: MESSAGE QUEUES ==================== -->
  <g id="queues">
    <!-- Queue 1 -->
    <rect x="45" y="110" width="140" height="65" rx="10" fill="url(#queue-grad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="115" y="138" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Queue 1</text>
    <text x="115" y="156" fill="#94a3b8" font-size="10" text-anchor="middle">(High Priority)</text>

    <!-- Queue 2 -->
    <rect x="45" y="205" width="140" height="65" rx="10" fill="url(#queue-grad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="115" y="233" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Queue 2</text>
    <text x="115" y="251" fill="#94a3b8" font-size="10" text-anchor="middle">(Standard Tier)</text>

    <!-- Queue 3 -->
    <rect x="45" y="385" width="140" height="65" rx="10" fill="url(#queue-grad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="115" y="413" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Queue 3</text>
    <text x="115" y="431" fill="#94a3b8" font-size="10" text-anchor="middle">(Batch / Low)</text>

    <!-- Queue 4 -->
    <rect x="45" y="480" width="140" height="65" rx="10" fill="url(#queue-grad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="115" y="508" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Queue 4</text>
    <text x="115" y="526" fill="#94a3b8" font-size="10" text-anchor="middle">(Background)</text>
  </g>

  <!-- ==================== COLUMN 2: QUEUE DISPATCH GATES ==================== -->
  <g id="queue-gates">
    <!-- Queue Gate 1 -->
    <rect x="225" y="105" width="130" height="75" rx="10" fill="url(#gate-grad)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="290" y="135" fill="#f3e8ff" font-size="12" font-weight="600" text-anchor="middle">Queue Gate 1</text>
    <text x="290" y="155" fill="#c084fc" font-size="9.5" text-anchor="middle">Flow Control / Quota</text>

    <!-- Queue Gate 2 -->
    <rect x="225" y="200" width="130" height="75" rx="10" fill="url(#gate-grad)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="290" y="230" fill="#f3e8ff" font-size="12" font-weight="600" text-anchor="middle">Queue Gate 2</text>
    <text x="290" y="250" fill="#c084fc" font-size="9.5" text-anchor="middle">Flow Control / Quota</text>

    <!-- Queue Gate 3 -->
    <rect x="225" y="380" width="130" height="75" rx="10" fill="url(#gate-grad)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="290" y="410" fill="#f3e8ff" font-size="12" font-weight="600" text-anchor="middle">Queue Gate 3</text>
    <text x="290" y="430" fill="#c084fc" font-size="9.5" text-anchor="middle">Flow Control / Quota</text>

    <!-- Queue Gate 4 -->
    <rect x="225" y="475" width="130" height="75" rx="10" fill="url(#gate-grad)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="290" y="505" fill="#f3e8ff" font-size="12" font-weight="600" text-anchor="middle">Queue Gate 4</text>
    <text x="290" y="525" fill="#c084fc" font-size="9.5" text-anchor="middle">Flow Control / Quota</text>
  </g>

  <!-- ==================== COLUMN 3: GLOBAL MERGE POLICY & PER-POOL LANES ==================== -->
  <g id="merge-policies">
    <!-- Merged Lane 1 -->
    <rect x="390" y="125" width="145" height="130" rx="12" fill="url(#merge-grad)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="462" y="155" fill="#e0f2fe" font-size="12" font-weight="700" text-anchor="middle">Merged Lane 1</text>
    <text x="462" y="173" fill="#93c5fd" font-size="10" text-anchor="middle">(Pool 1 Group)</text>
    <rect x="405" y="190" width="115" height="45" rx="6" fill="#075985" stroke="#38bdf8" stroke-width="1"/>
    <text x="462" y="208" fill="#bae6fd" font-size="9" text-anchor="middle">Global Policy:</text>
    <text x="462" y="224" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">`tier-priority`</text>

    <!-- Merged Lane 2 -->
    <rect x="390" y="400" width="145" height="130" rx="12" fill="url(#merge-grad)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="462" y="430" fill="#e0f2fe" font-size="12" font-weight="700" text-anchor="middle">Merged Lane 2</text>
    <text x="462" y="448" fill="#93c5fd" font-size="10" text-anchor="middle">(Pool 2 Group)</text>
    <rect x="405" y="465" width="115" height="45" rx="6" fill="#075985" stroke="#38bdf8" stroke-width="1"/>
    <text x="462" y="483" fill="#bae6fd" font-size="9" text-anchor="middle">Global Policy:</text>
    <text x="462" y="499" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">`tier-priority`</text>
  </g>

  <!-- ==================== COLUMN 4: WORKER POOL ADMISSION GATES ==================== -->
  <g id="pool-gates">
    <!-- Pool Gate 1 -->
    <rect x="570" y="150" width="130" height="80" rx="10" fill="url(#pool-gate-grad)" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="635" y="183" fill="#fce7f3" font-size="11" font-weight="700" text-anchor="middle">Pool Admission</text>
    <text x="635" y="201" fill="#fce7f3" font-size="11" font-weight="700" text-anchor="middle">Gate 1</text>
    <text x="635" y="219" fill="#f472b6" font-size="9" text-anchor="middle">(Tier Priority / Saturation)</text>

    <!-- Pool Gate 2 -->
    <rect x="570" y="425" width="130" height="80" rx="10" fill="url(#pool-gate-grad)" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="635" y="458" fill="#fce7f3" font-size="11" font-weight="700" text-anchor="middle">Pool Admission</text>
    <text x="635" y="476" fill="#fce7f3" font-size="11" font-weight="700" text-anchor="middle">Gate 2</text>
    <text x="635" y="494" fill="#f472b6" font-size="9.5" text-anchor="middle">(Saturation)</text>
  </g>

  <!-- ==================== COLUMN 5: WORKER POOLS ==================== -->
  <g id="worker-pools">
    <!-- Worker Pool 1 -->
    <rect x="735" y="95" width="140" height="190" rx="14" fill="url(#pool-grad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="805" y="125" fill="#ecfdf5" font-size="13" font-weight="700" text-anchor="middle">Worker Pool 1</text>
    <text x="805" y="143" fill="#6ee7b7" font-size="10" text-anchor="middle">(High SLA Pool)</text>

    <!-- Inner Components of Pool 1 -->
    <rect x="748" y="157" width="114" height="42" rx="6" fill="#047857" stroke="#34d399" stroke-width="1"/>
    <text x="805" y="182" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">Body Transforms</text>

    <rect x="748" y="207" width="114" height="64" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="805" y="227" fill="#a7f3d0" font-size="10" font-weight="600" text-anchor="middle">Workers (N=64)</text>
    <text x="805" y="243" fill="#d1fae5" font-size="9" text-anchor="middle">Worker 1..N</text>
    <text x="805" y="257" fill="#6ee7b7" font-size="8" text-anchor="middle">Async Dispatchers</text>

    <!-- Worker Pool 2 -->
    <rect x="735" y="370" width="140" height="190" rx="14" fill="url(#pool-grad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="805" y="400" fill="#ecfdf5" font-size="13" font-weight="700" text-anchor="middle">Worker Pool 2</text>
    <text x="805" y="418" fill="#6ee7b7" font-size="10" text-anchor="middle">(Batch / Slack Pool)</text>

    <!-- Inner Components of Pool 2 -->
    <rect x="748" y="432" width="114" height="42" rx="6" fill="#047857" stroke="#34d399" stroke-width="1"/>
    <text x="805" y="457" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">Body Transforms</text>

    <rect x="748" y="482" width="114" height="64" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="805" y="502" fill="#a7f3d0" font-size="10" font-weight="600" text-anchor="middle">Workers (N=64)</text>
    <text x="805" y="518" fill="#d1fae5" font-size="9" text-anchor="middle">Worker 1..N</text>
    <text x="805" y="532" fill="#6ee7b7" font-size="8" text-anchor="middle">Async Dispatchers</text>
  </g>

  <!-- ==================== COLUMN 6: LLM-D ROUTER ENDPOINTS & RESULT QUEUE ==================== -->
  <g id="llm-d-router-endpoints">
    <!-- Endpoint 1 (Model A) -->
    <rect x="935" y="95" width="125" height="170" rx="14" fill="url(#router-grad)" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="997" y="135" fill="#ffedd5" font-size="13" font-weight="700" text-anchor="middle">llm-d Router</text>
    <rect x="949" y="150" width="96" height="32" rx="6" fill="#7c2d12" stroke="#fb923c" stroke-width="1"/>
    <text x="997" y="171" fill="#fed7aa" font-size="11" font-weight="700" text-anchor="middle">Model A</text>
    <text x="997" y="205" fill="#fdba74" font-size="10" text-anchor="middle">HTTP / EPP</text>
    <text x="997" y="222" fill="#fdba74" font-size="9" text-anchor="middle">Inference Stack</text>

    <!-- Single Result Queue (Outside llm-d-async Boundary) -->
    <g id="result-queue">
      <rect x="935" y="288" width="125" height="64" rx="10" fill="url(#queue-grad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="997" y="311" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle">Result Queue</text>
      <text x="997" y="327" fill="#6ee7b7" font-size="8.5" text-anchor="middle">(Single Output Queue)</text>
      <text x="997" y="341" fill="#a7f3d0" font-size="7.5" text-anchor="middle">All Pools Push Results</text>
    </g>

    <!-- Endpoint 2 (Model B) -->
    <rect x="935" y="375" width="125" height="170" rx="14" fill="url(#router-grad)" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="997" y="415" fill="#ffedd5" font-size="13" font-weight="700" text-anchor="middle">llm-d Router</text>
    <rect x="949" y="430" width="96" height="32" rx="6" fill="#7c2d12" stroke="#fb923c" stroke-width="1"/>
    <text x="997" y="451" fill="#fed7aa" font-size="11" font-weight="700" text-anchor="middle">Model B</text>
    <text x="997" y="485" fill="#fdba74" font-size="10" text-anchor="middle">HTTP / EPP</text>
    <text x="997" y="502" fill="#fdba74" font-size="9" text-anchor="middle">Inference Stack</text>
  </g>

  <!-- ==================== CONNECTORS & ARROWS ==================== -->
  <!-- Queues to Queue Gates -->
  <path d="M 185 142 L 225 142" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M 185 237 L 225 237" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M 185 417 L 225 417" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M 185 512 L 225 512" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Queue Gates to Merge Policies -->
  <path d="M 355 142 C 372 142, 372 165, 390 165" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 355 237 C 372 237, 372 215, 390 215" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <path d="M 355 417 C 372 417, 372 440, 390 440" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 355 512 C 372 512, 372 490, 390 490" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Merge Policies to Pool Admission Gates -->
  <path d="M 535 190 L 570 190" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
  <path d="M 535 465 L 570 465" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-pink)"/>

  <!-- Pool Admission Gates to Worker Pools -->
  <path d="M 700 190 L 735 190" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 700 465 L 735 465" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Worker Pools to Router Endpoints -->
  <path d="M 875 190 L 935 180" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M 875 465 L 935 460" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Worker Pools to Result Queue -->
  <path d="M 875 240 C 905 240, 905 310, 935 310" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)"/>
  <path d="M 875 410 C 905 410, 905 330, 935 330" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)"/>

</svg>
