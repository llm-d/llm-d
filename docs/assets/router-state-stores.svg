<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" width="800" height="384">
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0d9488" />
    </marker>
    <clipPath id="clip-stage-1"><rect x="24" y="62" width="212" height="74" rx="8"/></clipPath>
    <clipPath id="clip-stage-2"><rect x="272" y="62" width="252" height="74" rx="8"/></clipPath>
    <clipPath id="clip-stage-3"><rect x="560" y="62" width="216" height="74" rx="8"/></clipPath>
    <clipPath id="clip-store-1"><rect x="24" y="218" width="212" height="124" rx="8"/></clipPath>
    <clipPath id="clip-store-2"><rect x="272" y="218" width="252" height="124" rx="8"/></clipPath>
    <clipPath id="clip-store-3"><rect x="560" y="218" width="216" height="124" rx="8"/></clipPath>
  </defs>
  <rect x="1" y="1" width="798" height="382" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Header & Legend -->
  <text x="22" y="29" class="sans" font-size="14" font-weight="700" fill="#0f172a">EPP Pipeline Stages and Replica-Local State</text>
  <g transform="translate(458, 25)">
    <line x1="0" y1="0" x2="29" y2="0" stroke="#2563eb" stroke-width="2"/>
    <text x="37" y="3.5" class="sans" font-size="11" font-weight="600" fill="#1e40af">Stateful / Agentic</text>
  </g>
  <g transform="translate(628, 25)">
    <line x1="0" y1="0" x2="29" y2="0" stroke="#0d9488" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="37" y="3.5" class="sans" font-size="11" font-weight="600" fill="#115e59">Stateless Fast Path</text>
  </g>
  <line x1="20" y1="45" x2="780" y2="45" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Upper Band: Stage 1 -->
  <rect x="24" y="62" width="212" height="74" rx="8" fill="#faf5ff"/>
  <rect x="24" y="62" width="212" height="10" fill="#7c3aed" clip-path="url(#clip-stage-1)"/>
  <rect x="24" y="62" width="212" height="74" rx="8" fill="none" stroke="#d8b4fe" stroke-width="1"/>
  <text x="36" y="90" class="sans" font-size="12.5" font-weight="700" fill="#4c1d95">1. Request Handling</text>
  <text x="36" y="108" class="sans" font-size="11" fill="#5b21b6">Parse headers &amp; prompt body</text>
  <text x="36" y="124" class="sans" font-size="11" fill="#7e22ce">Response usage &amp; token hooks</text>
  <!-- Upper Band: Stage 2 -->
  <rect x="272" y="62" width="252" height="74" rx="8" fill="#eff6ff"/>
  <rect x="272" y="62" width="252" height="10" fill="#2563eb" clip-path="url(#clip-stage-2)"/>
  <rect x="272" y="62" width="252" height="74" rx="8" fill="none" stroke="#93c5fd" stroke-width="1"/>
  <text x="284" y="90" class="sans" font-size="12.5" font-weight="700" fill="#1e3a8a">2. Flow Control (Who &amp; When)</text>
  <text x="284" y="108" class="sans" font-size="11" fill="#1e40af">Gate &amp; queue before placement</text>
  <text x="284" y="124" class="sans" font-size="11" fill="#334155">Pick Priority band &amp; Flow queue</text>
  <!-- Upper Band: Stage 3 -->
  <rect x="560" y="62" width="216" height="74" rx="8" fill="#f0fdfa"/>
  <rect x="560" y="62" width="216" height="10" fill="#0d9488" clip-path="url(#clip-stage-3)"/>
  <rect x="560" y="62" width="216" height="74" rx="8" fill="none" stroke="#5eead4" stroke-width="1"/>
  <text x="572" y="90" class="sans" font-size="12.5" font-weight="700" fill="#134e4a">3. Scheduling (Where)</text>
  <text x="572" y="108" class="sans" font-size="11" fill="#115e59">Score live load &amp; KV block hits</text>
  <text x="572" y="124" class="sans" font-size="11" fill="#334155">Select candidate Endpoint</text>
  <!-- Inter-Stage Arrows -->
  <line x1="236" y1="88" x2="270" y2="88" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="236" y1="114" x2="270" y2="114" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-teal)"/>
  <line x1="524" y1="88" x2="558" y2="88" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="524" y1="114" x2="558" y2="114" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-teal)"/>
  <!-- Middle Join Band: Tap 1 -->
  <line x1="130" y1="136" x2="130" y2="218" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="52" y="166" width="156" height="22" rx="11" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="130" y="181" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#5b21b6">resolve derived-root</text>
  <!-- Middle Join Band: Tap 2 -->
  <line x1="348" y1="136" x2="348" y2="218" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="274" y="166" width="148" height="22" rx="11" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="348" y="181" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#1e40af">turns &amp; token state</text>
  <!-- Middle Join Band: Saturation Bridge -->
  <path d="M 584 218 L 584 202 L 504 202 L 504 138" stroke="#0d9488" stroke-width="1.5" fill="none" marker-end="url(#arr-teal)"/>
  <rect x="447" y="166" width="114" height="22" rx="11" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
  <text x="504" y="180" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#115e59">saturation gate</text>
  <!-- Middle Join Band: Tap 3 -->
  <line x1="674" y1="136" x2="674" y2="218" stroke="#0d9488" stroke-width="1.5"/>
  <rect x="596" y="166" width="156" height="22" rx="11" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
  <text x="674" y="181" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#115e59">KV blocks &amp; live load</text>
  <!-- Lower Band: Store 1 -->
  <rect x="24" y="218" width="212" height="124" rx="8" fill="#ffffff"/>
  <rect x="24" y="218" width="212" height="30" fill="#faf5ff" clip-path="url(#clip-store-1)"/>
  <line x1="24" y1="248" x2="236" y2="248" stroke="#e9d5ff" stroke-width="1"/>
  <rect x="24" y="218" width="212" height="124" rx="8" fill="none" stroke="#c4b5fd" stroke-width="1"/>
  <text x="36" y="236.5" class="sans" font-size="12" font-weight="700" fill="#4c1d95">1. Agent Lineage</text>
  <rect x="172" y="224" width="52" height="18" rx="9" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="198" y="237" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#6b21a8">~30m</text>
  <text x="36" y="268" class="mono" font-size="11" fill="#475569">Key: (Tenant, Session)</text>
  <text x="36" y="288" class="sans" font-size="11" fill="#334155">Parent map → root Program</text>
  <rect x="36" y="306" width="136" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="104" y="320" text-anchor="middle" class="sans" font-size="11" fill="#64748b">Stateless: bypassed</text>
  <!-- Lower Band: Store 2 -->
  <rect x="272" y="218" width="252" height="124" rx="8" fill="#ffffff"/>
  <rect x="272" y="218" width="252" height="30" fill="#eff6ff" clip-path="url(#clip-store-2)"/>
  <line x1="272" y1="248" x2="524" y2="248" stroke="#dbeafe" stroke-width="1"/>
  <rect x="272" y="218" width="252" height="124" rx="8" fill="none" stroke="#93c5fd" stroke-width="1"/>
  <text x="284" y="238" class="sans" font-size="12" font-weight="700" fill="#1e3a8a">2. Session &amp; Flow State</text>
  <rect x="444" y="224" width="68" height="18" rx="9" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="478" y="237" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#1d4ed8">mins–1h</text>
  <text x="284" y="268" class="mono" font-size="11" fill="#475569">Key: agent-identity, FlowKey</text>
  <text x="284" y="288" class="sans" font-size="11" fill="#334155">Turns · tokens · decayed service</text>
  <rect x="284" y="306" width="164" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="366" y="320" text-anchor="middle" class="sans" font-size="11" fill="#64748b">Stateless: FlowKey only</text>
  <!-- Lower Band: Store 3 -->
  <rect x="560" y="218" width="216" height="124" rx="8" fill="#ffffff"/>
  <rect x="560" y="218" width="216" height="30" fill="#f0fdfa" clip-path="url(#clip-store-3)"/>
  <line x1="560" y1="248" x2="776" y2="248" stroke="#ccfbf1" stroke-width="1"/>
  <rect x="560" y="218" width="216" height="124" rx="8" fill="none" stroke="#5eead4" stroke-width="1"/>
  <text x="572" y="238" class="sans" font-size="12" font-weight="700" fill="#134e4a">3. Live Load &amp; KV</text>
  <rect x="712" y="224" width="52" height="18" rx="9" fill="#ccfbf1" stroke="#5eead4" stroke-width="1"/>
  <text x="738" y="236" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#0f766e">ms–s</text>
  <text x="572" y="268" class="mono" font-size="11" fill="#475569">Key: ReqID, hash, Endpoint</text>
  <text x="572" y="288" class="sans" font-size="11" fill="#334155">In-flight · metrics · KV index</text>
  <rect x="572" y="306" width="156" height="22" rx="11" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
  <text x="650" y="321" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#115e59">Active for all traffic</text>
  <text x="400" y="365.5" text-anchor="middle" class="sans" font-size="11" fill="#475569">Replica-local in-memory state · zero cross-replica RPCs on admission · capacity converges via scraped engine telemetry</text>
</svg>
