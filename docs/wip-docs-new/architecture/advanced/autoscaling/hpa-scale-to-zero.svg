<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b57ad4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="475" rx="8" fill="#0a0510"/>

  <!-- Title -->
  <text x="380" y="33" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">IGW HPA — Scale to Zero</text>

  <!-- ── Participants ──────────────────────────────────────────────────── -->

  <!-- Client -->
  <rect x="20" y="50" width="100" height="36" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <text x="70" y="74" text-anchor="middle" font-size="14" font-weight="500" fill="#ffffff">Client</text>

  <!-- EPP (highlighted) -->
  <rect x="200" y="50" width="150" height="36" rx="6" fill="#7b2d8e" stroke="#b57ad4" stroke-width="1.5"/>
  <text x="275" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">EPP</text>
  <text x="275" y="81" text-anchor="middle" font-size="10" fill="#dec3ee">(Flow Control)</text>

  <!-- HPA -->
  <rect x="415" y="50" width="110" height="36" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <text x="470" y="74" text-anchor="middle" font-size="14" font-weight="500" fill="#ffffff">HPA</text>

  <!-- Pool -->
  <rect x="565" y="50" width="175" height="36" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <text x="652" y="67" text-anchor="middle" font-size="12" font-weight="600" fill="#b57ad4">Model Server Pool</text>
  <text x="652" y="81" text-anchor="middle" font-size="10" fill="#c294df">(vLLM)</text>

  <!-- ── Lifelines ──────────────────────────────────────────────────────── -->
  <line x1="70"  y1="86" x2="70"  y2="440" stroke="#4a1f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="275" y1="86" x2="275" y2="440" stroke="#4a1f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="470" y1="86" x2="470" y2="440" stroke="#4a1f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="652" y1="86" x2="652" y2="440" stroke="#4a1f5e" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Initial state -->
  <text x="652" y="102" text-anchor="middle" font-size="10" fill="#c294df" font-style="italic">Replicas: 0</text>

  <!-- ── Step 1: Client → EPP: Inference Request (y=120) ──────────────── -->
  <line x1="70" y1="120" x2="275" y2="120" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="172" y="112" text-anchor="middle" font-size="10" fill="#c294df">Inference Request</text>

  <!-- ── Step 2: EPP note — queue_depth = 1 (y=133–155) ───────────────── -->
  <rect x="200" y="133" width="150" height="22" rx="4" fill="#2a1040" stroke="#7b2d8e" stroke-width="1"/>
  <text x="275" y="149" text-anchor="middle" font-size="10" fill="#dec3ee">queue_depth = 1</text>

  <!-- ── Step 3: HPA → EPP: poll (y=190) ──────────────────────────────── -->
  <line x1="470" y1="190" x2="275" y2="190" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="182" text-anchor="middle" font-size="10" fill="#c294df">poll igw_queue_depth</text>

  <!-- ── Step 4: EPP → HPA: return queue_depth (y=218, dashed) ────────── -->
  <line x1="275" y1="218" x2="470" y2="218" stroke="#b57ad4" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="372" y="210" text-anchor="middle" font-size="10" fill="#c294df">queue_depth = 1</text>

  <!-- ── Step 5: HPA → Pool: scale 0→1 (y=258) ───────────────────────── -->
  <line x1="470" y1="258" x2="652" y2="258" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="561" y="250" text-anchor="middle" font-size="10" fill="#c294df">scale 0 → 1</text>

  <!-- ── Step 6: Pool note — Pod starting (y=282) ──────────────────────── -->
  <text x="652" y="282" text-anchor="middle" font-size="10" fill="#c294df" font-style="italic">Pod starting…</text>

  <!-- ── Step 7: Pool → EPP: Pod Ready (y=322) ────────────────────────── -->
  <line x1="652" y1="322" x2="275" y2="322" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="463" y="314" text-anchor="middle" font-size="10" fill="#c294df">Pod Ready</text>

  <!-- ── Step 8: EPP → Pool: Dispatch (y=358) ─────────────────────────── -->
  <line x1="275" y1="358" x2="652" y2="358" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="463" y="350" text-anchor="middle" font-size="10" fill="#c294df">Dispatch queued requests (late binding)</text>

  <!-- ── Step 9: Pool → Client: Response (y=400, dashed) ──────────────── -->
  <line x1="652" y1="400" x2="70" y2="400" stroke="#b57ad4" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="361" y="392" text-anchor="middle" font-size="10" fill="#c294df">Response</text>

  <!-- Caption -->
  <text x="380" y="458" text-anchor="middle" font-size="12" fill="#a77bbf">EPP buffers requests during scale-from-zero — users see latency spike, not errors</text>
</svg>
