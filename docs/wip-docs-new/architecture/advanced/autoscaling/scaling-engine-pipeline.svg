<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 800" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b57ad4"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="800" rx="8" fill="#0a0510"/>

  <!-- ── Title bar ── -->
  <rect x="0" y="0" width="880" height="48" rx="8" fill="#2d1045"/>
  <rect x="0" y="36" width="880" height="12" fill="#2d1045"/>
  <text x="440" y="30" text-anchor="middle" font-weight="600" font-size="16" fill="#ffffff">WVA Scaling Engine Pipeline</text>

  <!-- ── External sources (top row) ── -->

  <!-- Prometheus -->
  <rect x="80" y="72" width="170" height="52" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <circle r="12" cx="108" cy="98" fill="#3d1510" stroke="#e64a19" stroke-width="1"/>
  <text x="108" y="98" text-anchor="middle" dominant-baseline="central" font-weight="700" font-size="14" fill="#e64a19">P</text>
  <text x="175" y="95" text-anchor="middle" font-weight="600" fill="#ffffff">Prometheus</text>
  <text x="175" y="110" text-anchor="middle" font-size="11" fill="#c294df">vLLM &amp; EPP metrics</text>

  <!-- VA Watch -->
  <rect x="355" y="72" width="170" height="52" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <circle r="12" cx="383" cy="98" fill="#1a1535" stroke="#6366f1" stroke-width="1"/>
  <text x="383" y="98" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#6366f1">&#9670;</text>
  <text x="452" y="95" text-anchor="middle" font-weight="600" fill="#ffffff">VA Watch</text>
  <text x="452" y="110" text-anchor="middle" font-size="11" fill="#c294df">Active VA resources</text>

  <!-- EPP Metrics -->
  <rect x="630" y="72" width="170" height="52" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <circle r="12" cx="658" cy="98" fill="#0a1a25" stroke="#0ea5e9" stroke-width="1"/>
  <text x="658" y="98" text-anchor="middle" dominant-baseline="central" font-weight="700" font-size="14" fill="#0ea5e9">E</text>
  <text x="727" y="95" text-anchor="middle" font-weight="600" fill="#ffffff">EPP Metrics</text>
  <text x="727" y="110" text-anchor="middle" font-size="11" fill="#c294df">flow control queue size</text>

  <!-- Arrows from sources down -->
  <line x1="165" y1="124" x2="165" y2="162" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="124" x2="440" y2="162" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="715" y1="124" x2="715" y2="656" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-cyan)"/>

  <!-- ── Main Engine Box ── -->
  <rect x="39.5" y="168" width="560" height="460" rx="10" fill="#120a1e" stroke="#7b2d8e" stroke-width="1.5"/>
  <rect x="40" y="168" width="560" height="36" rx="10" fill="#2d1045"/>
  <rect x="42" y="194" width="556" height="432" fill="#120a1e"/>
  <text x="320" y="191" text-anchor="middle" font-weight="700" font-size="14" fill="#ffffff">Scaling Engine</text>
  <text x="586.5" y="185.5" text-anchor="end" font-size="11" fill="#888" font-style="italic">every 30s</text>

  <!-- Step 1: Collect -->
  <rect x="68" y="216" width="504" height="40" rx="6" fill="#0d1a10" stroke="#2d5a35" stroke-width="1"/>
  <circle cx="88" cy="236" r="9" fill="#7b2d8e" stroke="#b57ad4" stroke-width="1.2"/>
  <text x="88" y="236" text-anchor="middle" dominant-baseline="central" font-weight="700" font-size="11" fill="#ffffff">1</text>
  <text x="108" y="233" font-size="12" font-weight="600" fill="#81c784">Collect</text>
  <text x="108" y="248" font-size="11" fill="#a5d6a7">Group active VAs by modelID, scrape per-replica metrics</text>

  <!-- Arrow 1 → 2 -->
  <line x1="320" y1="256" x2="320" y2="313" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Analyze -->
  <rect x="68" y="313" width="504" height="80" rx="6" fill="#0d1220" stroke="#1e3a6a" stroke-width="1"/>
  <circle cx="88" cy="329" r="9" fill="#7b2d8e" stroke="#b57ad4" stroke-width="1.2"/>
  <text x="88" y="329" text-anchor="middle" dominant-baseline="central" font-weight="700" font-size="11" fill="#ffffff">2</text>
  <text x="108" y="334" font-size="12" font-weight="600" fill="#93c5fd">Analyze (per model)</text>

  <!-- Analyzer sub-boxes -->
  <rect x="88" y="345" width="148" height="36" rx="5" fill="#13192e" stroke="#2d4a8a" stroke-width="1"/>
  <text x="162" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#93c5fd">Saturation V1</text>
  <text x="162" y="374" text-anchor="middle" font-size="10" fill="#6b9fd6">percentage-based (default)</text>

  <rect x="246" y="345" width="148" height="36" rx="5" fill="#13192e" stroke="#2d4a8a" stroke-width="1"/>
  <text x="320" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#93c5fd">Saturation V2</text>
  <text x="320" y="374" text-anchor="middle" font-size="10" fill="#6b9fd6">token-based capacity</text>

  <rect x="404" y="345" width="148" height="36" rx="5" fill="#13192e" stroke="#2d4a8a" stroke-width="1"/>
  <text x="478" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#93c5fd">SLO / Queueing</text>
  <text x="478" y="374" text-anchor="middle" font-size="10" fill="#6b9fd6">latency-driven</text>

  <!-- Experimental badges -->
  <rect x="240" y="338" width="60" height="14" rx="7" fill="#f59e0b" stroke="#d97706" stroke-width="0.8"/>
  <text x="270" y="341" text-anchor="middle" dominant-baseline="hanging" font-weight="600" font-size="8" fill="#fff">experimental</text>

  <rect x="398.5" y="338" width="60" height="14" rx="7" fill="#f59e0b" stroke="#d97706" stroke-width="0.8"/>
  <text x="428.5" y="341" text-anchor="middle" dominant-baseline="hanging" font-weight="600" font-size="8" fill="#fff">experimental</text>

  <!-- Output labels for analyzer -->
  <text x="571" y="322" text-anchor="end" font-style="italic" font-size="10" fill="#888">RequiredCapacity</text>
  <text x="569" y="333" text-anchor="end" font-style="italic" font-size="10" fill="#888">SpareCapacity</text>

  <!-- Arrow 2 → 3 -->
  <line x1="320" y1="393" x2="320" y2="450" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Optimize -->
  <rect x="68" y="450" width="504" height="60" rx="6" fill="#150d22" stroke="#4a2d6a" stroke-width="1"/>
  <circle cx="88" cy="466" r="9" fill="#7b2d8e" stroke="#b57ad4" stroke-width="1.2"/>
  <text x="88" y="466" text-anchor="middle" dominant-baseline="central" font-weight="700" font-size="11" fill="#ffffff">3</text>
  <text x="108" y="471" font-size="12" font-weight="600" fill="#d8b4fe">Optimize (all models)</text>

  <!-- Optimizer sub-boxes -->
  <rect x="88" y="482" width="192" height="20" rx="4" fill="#1a1030" stroke="#5a2d8a" stroke-width="1"/>
  <text x="184" y="496" text-anchor="middle" font-size="11" fill="#d8b4fe">CostAwareOptimizer</text>

  <rect x="292" y="482" width="192" height="20" rx="4" fill="#1a1030" stroke="#5a2d8a" stroke-width="1"/>
  <text x="388" y="496" text-anchor="middle" font-size="11" fill="#d8b4fe">GreedyByScoreOptimizer</text>

  <!-- Output label for optimizer -->
  <text x="567" y="463" text-anchor="end" font-style="italic" font-size="10" fill="#888">VariantDecisions</text>

  <!-- Arrow 3 → 4 -->
  <line x1="320" y1="510" x2="320" y2="567" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Enforce -->
  <rect x="68" y="567" width="504" height="48" rx="6" fill="#1a120d" stroke="#5a3420" stroke-width="1"/>
  <circle cx="88" cy="583" r="9" fill="#7b2d8e" stroke="#b57ad4" stroke-width="1.2"/>
  <text x="88" y="583" text-anchor="middle" dominant-baseline="central" font-weight="700" font-size="11" fill="#ffffff">4</text>
  <text x="108" y="588" font-size="12" font-weight="600" fill="#fdba74">Enforce (per model)</text>
  <text x="108" y="605" font-size="11" fill="#e8a56e">Scale-to-zero (idle models) &amp; minimum replica guarantee</text>

  <!-- Arrow out of engine box -->
  <line x1="320" y1="615" x2="320" y2="646" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Bottom row ── -->

  <!-- Decision Cache -->
  <rect x="200" y="646" width="240" height="52" rx="8" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <rect x="200.5" y="646" width="6" height="52" rx="3" fill="#e5a000"/>
  <text x="326" y="668" text-anchor="middle" font-weight="600" fill="#ffffff">DecisionCache</text>
  <text x="326" y="684" text-anchor="middle" font-size="11" fill="#c294df">in-memory decision store</text>

  <!-- Scale-from-Zero Engine -->
  <rect x="630" y="656" width="220" height="52" rx="8" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <rect x="630" y="656" width="6" height="52" rx="3" fill="#0ea5e9"/>
  <text x="746" y="678" text-anchor="middle" font-weight="600" fill="#ffffff">Scale-from-Zero Engine</text>
  <text x="746" y="694" text-anchor="middle" font-size="11" fill="#c294df">100ms polling, EPP queue check</text>

  <!-- Arrow from Scale-from-Zero to Cache -->
  <line x1="630" y1="676" x2="452" y2="676" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Arrow from Cache down to Reconciler -->
  <line x1="320" y1="698" x2="320" y2="734" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="720" font-style="italic" font-size="10" fill="#888">DecisionTrigger</text>

  <!-- VA Reconciler -->
  <rect x="140" y="734" width="360" height="60" rx="8" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <rect x="140" y="734" width="6" height="60" rx="3" fill="#6366f1"/>
  <text x="326" y="758" text-anchor="middle" font-weight="600" fill="#ffffff">VA Reconciler</text>
  <text x="326" y="774" text-anchor="middle" font-size="11" fill="#c294df">Update VA status, emit HPA/KEDA metrics</text>

  <!-- Legend -->
  <rect x="620" y="744" width="230" height="50" rx="6" fill="#120a1e" stroke="#7b2d8e" stroke-width="1"/>
  <text x="635" y="760" font-weight="600" font-size="10" fill="#c294df">LEGEND</text>
  <line x1="635" y1="774" x2="660" y2="774" stroke="#b57ad4" stroke-width="1.5"/>
  <text x="668" y="778" font-size="10" fill="#c294df">main loop</text>
  <line x1="730" y1="774" x2="755" y2="774" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="763" y="778" font-size="10" fill="#c294df">scale-from-zero</text>
</svg>
