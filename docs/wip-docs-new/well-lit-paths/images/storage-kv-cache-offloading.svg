<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b57ad4"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7986cb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="340" rx="8" fill="#0a0510"/>

  <!-- Title -->
  <text x="350" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Storage KV Cache Offloading</text>

  <!-- GET completions -->
  <text x="250" y="68" text-anchor="middle" font-size="13" fill="#c294df">GET /completions</text>
  <line x1="250" y1="73" x2="250" y2="98" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="175" y="100" width="150" height="42" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <text x="250" y="126" text-anchor="middle" font-weight="500" font-size="15" fill="#ffffff">Gateway</text>

  <!-- Gateway to EPP -->
  <line x1="325" y1="115" x2="440" y2="115" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="129" x2="325" y2="129" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- EPP -->
  <rect x="440" y="100" width="100" height="42" rx="6" fill="#7b2d8e" stroke="#b57ad4" stroke-width="1.5"/>
  <text x="490" y="126" text-anchor="middle" font-weight="700" font-size="16" fill="#ffffff">EPP</text>

  <!-- Arrow to pods -->
  <line x1="200" y1="142" x2="115" y2="195" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pod A -->
  <rect x="35" y="198" width="175" height="72" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <rect x="42" y="203" width="161" height="22" rx="4" fill="#1a2a1a" stroke="#4caf50" stroke-width="1"/>
  <text x="123" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#81c784">CPU RAM</text>
  <text x="123" y="253" text-anchor="middle" font-weight="600" font-size="15" fill="#b57ad4">vLLM</text>
  <text x="123" y="290" text-anchor="middle" font-size="12" fill="#c294df">Pod A</text>

  <!-- Remote Storage -->
  <rect x="245" y="215" width="150" height="44" rx="6" fill="#1a1a2e" stroke="#7986cb" stroke-width="1.5"/>
  <text x="320" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#9fa8da">Remote</text>
  <text x="320" y="251" text-anchor="middle" font-size="13" font-weight="600" fill="#9fa8da">Storage</text>

  <!-- Arrows between pods and storage -->
  <line x1="210" y1="235" x2="245" y2="235" stroke="#7986cb" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>
  <line x1="395" y1="235" x2="430" y2="235" stroke="#7986cb" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>

  <!-- Pod B -->
  <rect x="430" y="198" width="175" height="72" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <rect x="437" y="203" width="161" height="22" rx="4" fill="#1a2a1a" stroke="#4caf50" stroke-width="1"/>
  <text x="518" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#81c784">CPU RAM</text>
  <text x="518" y="253" text-anchor="middle" font-weight="600" font-size="15" fill="#b57ad4">vLLM</text>
  <text x="518" y="290" text-anchor="middle" font-size="12" fill="#c294df">Pod B</text>

  <!-- Caption -->
  <text x="350" y="322" text-anchor="middle" font-size="13" fill="#a77bbf">Offload KV caches to global shared remote storage</text>
</svg>
