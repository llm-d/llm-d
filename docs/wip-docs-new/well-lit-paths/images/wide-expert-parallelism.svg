<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b57ad4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" rx="8" fill="#0a0510"/>

  <!-- GET completions -->
  <text x="340" y="25" text-anchor="middle" font-size="13" fill="#c294df">GET /completions</text>
  <line x1="340" y1="30" x2="340" y2="52" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gateway box -->
  <rect x="265" y="55" width="150" height="44" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <text x="340" y="83" text-anchor="middle" font-weight="500" font-size="15" fill="#ffffff">Gateway</text>

  <!-- Gateway to EPP -->
  <line x1="415" y1="70" x2="520" y2="70" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="64" text-anchor="middle" font-size="11" fill="#c294df">Prompt</text>
  <line x1="520" y1="84" x2="415" y2="84" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="108" text-anchor="middle" font-size="11" fill="#c294df">Pod D</text>

  <!-- EPP box -->
  <rect x="520" y="55" width="100" height="44" rx="6" fill="#7b2d8e" stroke="#b57ad4" stroke-width="1.5"/>
  <text x="570" y="83" text-anchor="middle" font-weight="700" font-size="16" fill="#ffffff">EPP</text>

  <!-- Composes note -->
  <text x="655" y="74" font-size="11" fill="#888" font-style="italic">*Composes with</text>
  <text x="655" y="88" font-size="11" fill="#888" font-style="italic">other scorers*</text>

  <!-- Arrow to LWS -->
  <line x1="315" y1="99" x2="315" y2="138" stroke="#b57ad4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LeaderWorkerSet outer box -->
  <rect x="25" y="140" width="850" height="160" rx="8" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="450" y="318" text-anchor="middle" font-size="12" fill="#888">LeaderWorkerSet</text>

  <!-- Expert-Parallel MLP bar -->
  <rect x="40" y="153" width="820" height="32" rx="6" fill="#1a1a2e" stroke="#7986cb" stroke-width="1.5"/>
  <text x="450" y="175" text-anchor="middle" font-weight="700" fill="#9fa8da" font-size="13">Expert-Parallel MLP</text>

  <!-- vLLM pods -->
  <rect x="40" y="198" width="96" height="46" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <text x="88" y="226" text-anchor="middle" font-weight="600" fill="#b57ad4" font-size="13">vLLM</text>
  <text x="88" y="258" text-anchor="middle" font-size="10" fill="#c294df">Pod A (DP-0)</text>

  <rect x="146" y="198" width="96" height="46" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <text x="194" y="226" text-anchor="middle" font-weight="600" fill="#b57ad4" font-size="13">vLLM</text>
  <text x="194" y="258" text-anchor="middle" font-size="10" fill="#c294df">Pod B (DP-1)</text>

  <rect x="252" y="198" width="96" height="46" rx="6" fill="#1e1428" stroke="#7b2d8e" stroke-width="1.5"/>
  <text x="300" y="226" text-anchor="middle" font-weight="600" fill="#b57ad4" font-size="13">vLLM</text>
  <text x="300" y="258" text-anchor="middle" font-size="10" fill="#c294df">Pod C (DP-2)</text>

  <!-- Highlighted pods -->
  <rect x="358" y="198" width="96" height="46" rx="6" fill="#2a1a3e" stroke="#b57ad4" stroke-width="2"/>
  <text x="406" y="226" text-anchor="middle" font-weight="600" fill="#dec3ee" font-size="13">vLLM</text>
  <text x="406" y="258" text-anchor="middle" font-size="10" fill="#dec3ee">Pod D (DP-3)</text>

  <rect x="464" y="198" width="96" height="46" rx="6" fill="#2a1a3e" stroke="#b57ad4" stroke-width="2"/>
  <text x="512" y="226" text-anchor="middle" font-weight="600" fill="#dec3ee" font-size="13">vLLM</text>
  <text x="512" y="258" text-anchor="middle" font-size="10" fill="#dec3ee">Pod E (DP-4)</text>

  <rect x="570" y="198" width="96" height="46" rx="6" fill="#2a1a3e" stroke="#b57ad4" stroke-width="2"/>
  <text x="618" y="226" text-anchor="middle" font-weight="600" fill="#dec3ee" font-size="13">vLLM</text>
  <text x="618" y="258" text-anchor="middle" font-size="10" fill="#dec3ee">Pod F (DP-5)</text>

  <!-- Tertiary pods -->
  <rect x="676" y="198" width="96" height="46" rx="6" fill="#1e1428" stroke="#8a3baf" stroke-width="1.5"/>
  <text x="724" y="226" text-anchor="middle" font-weight="600" fill="#a77bbf" font-size="13">vLLM</text>
  <text x="724" y="258" text-anchor="middle" font-size="10" fill="#a77bbf">Pod G (DP-6)</text>

  <rect x="782" y="198" width="96" height="46" rx="6" fill="#1e1428" stroke="#8a3baf" stroke-width="1.5"/>
  <text x="830" y="226" text-anchor="middle" font-weight="600" fill="#a77bbf" font-size="13">vLLM</text>
  <text x="830" y="258" text-anchor="middle" font-size="10" fill="#a77bbf">Pod H (DP-7)</text>
</svg>
