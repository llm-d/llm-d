# Guides published on llm-d.ai.
#
# Each guide lives once, under its `dir:`, as a guide.yaml + README.md pair
# that renders on GitHub. The website (llm-d/llm-d.github.io) reads this file
# at sync time and publishes each listed README as the page
# docs/<target>/<slug>/ (the URL a docs page at <target>/<slug>.md used to
# have), with optional child pages (`pages: [{from, to, title}]`, paths relative
# to the guide dir). Grouping into sections lives here; on disk, guides sit
# directly under guides/ except Model guides, grouped under guides/models/.
#
# Validate with: python3 scripts/guide.py check-manifest
version: 1
sections:
  foundations:
    target: well-lit-paths/foundations
    guides:
      - dir: guides/optimized-baseline
        slug: optimized-baseline
        title: Deploy an Optimized Baseline
        position: 1
      - dir: guides/predicted-latency-routing
        slug: predicted-latency
        title: Route Requests by Predicted Latency
        position: 2
      - dir: guides/precise-prefix-cache-routing
        slug: precise-prefix-cache-routing
        title: Enable Precise Prefix-Cache Aware Routing
        position: 3
      - dir: guides/tiered-prefix-cache
        slug: tiered-prefix-cache
        title: Configure a Tiered Prefix Cache
        position: 4
      - dir: guides/p2p-kv-cache-sharing
        slug: enable-p2p-prefix-cache-sharing
        title: Enable P2P Prefix Cache Sharing
        position: 5
      - dir: guides/pd-disaggregation
        slug: pd-disaggregation
        title: Deploy Prefill/Decode Disaggregation
        position: 6
      - dir: guides/wide-ep
        slug: wide-expert-parallelism
        title: Scale MoE Models with Wide Expert Parallelism
        position: 7
      - dir: guides/multimodal-serving
        slug: serve-multimodal-models
        title: Serve Multimodal Models
        position: 8
      - dir: guides/omni-serving
        slug: serve-omni-models
        title: Serve Omni Models
        position: 9
  # Models: benchmarked recipes for one model on one accelerator, each with a
  # guide.yaml support matrix like the Foundations guides.
  models:
    target: well-lit-paths/models
    guides:
      - dir: guides/models/deepseek-v4
        slug: deepseek-v4
        title: DeepSeek-V4
        position: 1
      - dir: guides/models/glm-5-2
        slug: glm-5-2
        title: GLM-5.2
        position: 2
      - dir: guides/models/nemotron-3-ultra
        slug: nemotron-3-ultra
        title: NVIDIA Nemotron 3 Ultra
        position: 3
      - dir: guides/models/qwen3-coder-480b
        slug: qwen3-coder-480b
        title: Qwen3-Coder-480B
        position: 4
  # Operations: the sidebar is at most two levels deep (Operations > category
  # > page). Two guides are categories themselves (section `operations`,
  # target `operations`) and keep their child pages; the other sections map
  # to the docs/operations/<sub>/ categories (labels in docs/menu-config.json)
  # and publish README-only leaf pages whose positions interleave with the
  # regular docs pages of the same category. Files of these guides that are
  # not listed are not published; links to them resolve to GitHub.
  # Operations guides may be README-only (no guide.yaml).
  # Category order (positions): 1 observability, 2 autoscaling, 3 startup,
  # 4 lifecycle, 5 rollouts, 6 disaggregation, 7 traffic, 8 batch-serving,
  # 9 integrations, 10 components. Guide categories take their position here;
  # docs/operations/<sub>/ categories take theirs from docs/menu-config.json.
  operations:
    target: operations
    guides:
      - dir: guides/workload-autoscaling
        slug: autoscaling
        title: Autoscale Inference Pools
        position: 2
        pages:
          - from: keda-epp/README.md
            to: keda-epp
            title: Scale on Queue Depth and Saturation
          - from: keda-epp-token-aware/README.md
            to: token-aware
            title: Scale on Token Backlog (Experimental)
          - from: slo-aware/README.md
            to: slo-aware
            title: Scale to Latency SLOs
          - from: kueue-rebalancing/README.md
            to: kueue-rebalancing
            title: Share a GPU Budget Across Models (Experimental)
      - dir: guides/batch-serving
        slug: batch-serving
        title: Process Batch and Async Requests
        position: 8
        pages:
          - from: batch-gateway/README.md
            to: batch-gateway
            title: Run Batch Jobs (Batch Gateway)
          - from: asynchronous-processing/README.md
            to: asynchronous-processing
            title: Queue Async Requests (Async Processor)
          - from: asynchronous-processing/redis/README.md
            to: async-redis
            title: Use Redis as the Async Queue
          - from: asynchronous-processing/gcp-pubsub/README.md
            to: async-gcp-pubsub
            title: Use GCP Pub/Sub as the Async Queue
          - from: asynchronous-processing/multitenant/README.md
            to: async-multitenant
            title: Enforce Tenant Quotas and Priorities
      - dir: guides/rollouts
        slug: rollouts
        title: Roll Out Updates Safely
        position: 5
        pages:
          - from: blue-green-update.md
            to: blue-green-update
            title: Blue-Green Update
          - from: adapter-rollout.md
            to: adapter-rollout
            title: LoRA Adapter Rollout
  operations-startup:
    target: operations/startup
    guides:
      # position 1: docs/operations/startup/model-loading-and-startup.md
      # position 6: docs/operations/startup/troubleshooting.md
      - dir: guides/modelexpress-p2p
        slug: modelexpress-p2p
        title: Transfer Weights Peer-to-Peer (ModelExpress)
        position: 2
      - dir: guides/pod-snapshot
        slug: pod-snapshot
        title: Restore from Pod Snapshots
        position: 3
      - dir: guides/fast-model-actuation-base
        slug: fast-model-actuation
        title: Reuse Warm Model Servers (FMA)
        position: 4
      - dir: guides/fast-model-actuation-keda
        slug: fast-model-actuation-keda
        title: Scale from Zero with FMA and KEDA
        position: 5
  operations-traffic:
    target: operations/traffic
    guides:
      - dir: guides/flow-control
        slug: flow-control
        title: Queue and Prioritize Requests (Flow Control)
        position: 1
      # position 2: docs/operations/traffic/flow-control-tuning.md
      # Lives under guides/workload-autoscaling/ (referenced from there), but
      # adding InferencePools is a traffic/tenancy topic, so it is published here.
      - dir: guides/workload-autoscaling/multi-inference-pool
        slug: multi-inference-pool
        title: Deploy Multiple Inference Pools
        position: 3
      - dir: guides/multi-model-routing
        slug: multi-model-routing
        title: Route to Multiple Models and LoRA Adapters
        position: 4
  # operations/lifecycle has only docs pages: graceful-shutdown, readiness-probes.
  # operations/disaggregation has only docs pages: vllm, sglang, disaggregatedset.
  operations-integrations:
    target: operations/integrations
    guides:
      # position 1: docs/operations/integrations/litellm.md
      # position 2: docs/operations/integrations/kong.md
      - dir: guides/agentic-api
        slug: agentic-api
        title: Serve the Responses API with Agentic API (Experimental)
        position: 3
