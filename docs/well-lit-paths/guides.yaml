# Guides published on llm-d.ai.
#
# Each guide lives once, under guides/<dir>/, as a guide.yaml + README.md pair
# that renders on GitHub. The website (llm-d/llm-d.github.io) reads this file
# at sync time and publishes each listed README as the page
# docs/<target>/<slug>/ (the URL a docs page at <target>/<slug>.md used to
# have), with optional child pages (`pages: [{from, to, title}]`, paths relative
# to the guide dir). Grouping into sections lives here only;
# the guides/ tree stays flat.
#
# Validate with: python3 scripts/guide.py check-manifest
version: 1
sections:
  foundations:
    target: well-lit-paths/foundations
    guides:
      - dir: guides/optimized-baseline
        slug: optimized-baseline
        title: Deploy an Optimized Baseline
        position: 1
      - dir: guides/predicted-latency-routing
        slug: predicted-latency
        title: Route Requests by Predicted Latency
        position: 2
      - dir: guides/precise-prefix-cache-routing
        slug: precise-prefix-cache-routing
        title: Enable Precise Prefix-Cache Aware Routing
        position: 3
      - dir: guides/tiered-prefix-cache
        slug: tiered-prefix-cache
        title: Configure a Tiered Prefix Cache
        position: 4
      - dir: guides/p2p-kv-cache-sharing
        slug: enable-p2p-prefix-cache-sharing
        title: Enable P2P Prefix Cache Sharing
        position: 5
  models:
    target: well-lit-paths/models
    guides: []
  # Operations: one section per sidebar sub-category of docs/operations/
  # (operations-<sub>, target operations/<sub>; the category labels live in
  # docs/menu-config.json). Positions interleave with the regular docs pages
  # of the same category. Operations guides may be README-only (no
  # guide.yaml).
  operations-scaling:
    target: operations/scaling
    guides:
      - dir: guides/workload-autoscaling
        slug: workload-autoscaling
        title: Autoscale your Inference Pool
        position: 1
        pages:
          - from: keda-epp/README.md
            to: keda-epp
            title: KEDA + EPP Metrics
          - from: keda-epp-token-aware/README.md
            to: token-aware
            title: Token-Aware Autoscaling
          - from: slo-aware/README.md
            to: slo-aware
            title: SLO-Aware Autoscaling
          - from: multi-inference-pool/README.md
            to: multi-inference-pool
            title: Multi-Inference Pool Setup
          - from: kueue-rebalancing/README.md
            to: kueue-rebalancing
            title: Kueue-Based Replica Rebalancing
          - from: wva/README.md
            to: wva
            title: Workload Variant Autoscaler (Deprecated)
          - from: promadapter.md
            to: prometheus-adapter
            title: Prometheus Adapter (Deprecated)
      - dir: guides/fast-model-actuation-base
        slug: fast-model-actuation
        title: Speed Up Scale-Up with Fast Model Actuation
        position: 2
      - dir: guides/fast-model-actuation-keda
        slug: fast-model-actuation-keda
        title: Autoscale Fast Model Actuation with KEDA
        position: 3
        pages:
          - from: benchmark-results/qwen3-14b-h100/README.md
            to: benchmark-qwen3-14b-h100
            title: "Benchmark: Qwen3-14B on H100"
          - from: benchmark-results/qwen3-32b-h100/README.md
            to: benchmark-qwen3-32b-h100
            title: "Benchmark: Qwen3-32B on H100"
      - dir: guides/pod-snapshot
        slug: pod-snapshot
        title: Restore Model Servers from Pod Snapshots
        position: 4
        pages:
          - from: benchmark-results/vllm-qwen3-32b-h100.md
            to: benchmark-vllm-qwen3-32b-h100
            title: "Benchmark: Qwen3-32B on vLLM (1×H100)"
      - dir: guides/modelexpress-p2p
        slug: modelexpress-p2p
        title: Transfer Weights GPU-to-GPU with ModelExpress
        position: 5
        pages:
          - from: compile-cache.md
            to: compile-cache
            title: Reuse JIT Compile Caches
          - from: security.md
            to: security
            title: Lock Down the Metadata Broker
          - from: measuring-storage-paths.md
            to: measuring-storage-paths
            title: Measure Storage-Backed Loading Paths
          - from: benchmark-results/h200-ib-gpt-oss-120b.md
            to: benchmark-h200-ib-gpt-oss-120b
            title: "Observations: gpt-oss-120b on H200 + InfiniBand"
          - from: benchmark-results/gke-a3u-roce-gpt-oss-120b.md
            to: benchmark-gke-a3u-roce-gpt-oss-120b
            title: "Observations: gpt-oss-120b on GKE A3 Ultra"
          - from: benchmark-results/coreweave-h200-llama-3.3-70b.md
            to: benchmark-coreweave-h200-llama-3-3-70b
            title: "Observations: Llama-3.3-70B on CoreWeave H200"
      # position 6: docs/operations/scaling/model-loading-and-startup.md
  operations-traffic:
    target: operations/traffic
    guides:
      - dir: guides/flow-control
        slug: flow-control
        title: Apply Flow Control and Fairness
        position: 1
        pages:
          - from: tuning.md
            to: tuning
            title: "Production Tuning: maxConcurrency"
      - dir: guides/multi-model-routing
        slug: multi-model-routing
        title: Multi-Model Routing
        position: 2
      - dir: guides/batch-serving
        slug: batch-serving
        title: Serve Batch Workloads
        position: 3
        pages:
          - from: batch-gateway/README.md
            to: batch-gateway
            title: Batch Gateway
          - from: asynchronous-processing/README.md
            to: asynchronous-processing
            title: Asynchronous Processing
          - from: asynchronous-processing/redis/README.md
            to: async-redis
            title: "Async Processing: Redis Sorted Set"
          - from: asynchronous-processing/gcp-pubsub/README.md
            to: async-gcp-pubsub
            title: "Async Processing: GCP Pub/Sub"
          - from: asynchronous-processing/multitenant/README.md
            to: async-multitenant
            title: "Async Processing: Multi-Tenant"
  operations-lifecycle:
    target: operations/lifecycle
    guides:
      - dir: guides/rollouts
        slug: rollouts
        title: Rollouts
        position: 1
        pages:
          - from: blue-green-update.md
            to: blue-green-update
            title: Blue-Green Update
          - from: adapter-rollout.md
            to: adapter-rollout
            title: LoRA Adapter Rollout
      # positions 2-5: graceful-shutdown, readiness-probes, disaggregation/,
      # router (docs/operations/lifecycle/)
  operations-integrations:
    target: operations/integrations
    guides:
      # position 1: docs/operations/integrations/serve-external-apis/
      - dir: guides/rl
        slug: rl
        title: Optimize RL Rollouts with llm-d
        position: 2
        pages:
          - from: llm-d-verl-integration.md
            to: llm-d-verl-integration
            title: llm-d verl Integration (EPP Routing)
          - from: py-scheduler-verl-integration.md
            to: py-scheduler-verl-integration
            title: verl Integration via py-inference-scheduler
